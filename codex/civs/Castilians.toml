civ = "Spanish"
name = "Castilians"
original_name = "Spanish"
status = "reviewed"
label = "Cavalry and Monk civilization"
summary = "Spanish renamed Castilians for the medieval Crown of Castile (1037–1504): the Freire of the military orders replaces the Conquistador and Missionary, the caballería de cuantía takes the Castle, the Santa Hermandad and Bula de Cruzada replace Supremacy and Inquisition, and the Mesta, cheaper castles, Santiago's relic and the foot crossbow come in while the mounted crossbow line leaves."
ideas = [
  "N3: The Aragonese, a separate civ for the Crown of Aragon (1137–1516), as RULES section 4 decides. The Almogàvers, Roger de Lauria's galleys with their Catalan crossbowmen (Malta 1283, the Bay of Naples 1284) and the Llibre del Consolat de Mar (printed 1484) are reserved for it (Muntaner; Desclot; Mott, 2003). Leaving the Almogàver out of the Castilians is a departure from the owner's Castilian sketch, accepted in the level-1 review (section 5): the almogàvers were the Crown of Aragon's troops, not Castile's. An Almogàver on the Hearth Troop model (Saxons; javelin, then melee) would need an anti-cavalry bonus for the almogàvers' record against knights (Halmyros, 1311).",
  "N2: A Jinete of its own (light horseman with lance and javelins, able to fight at close range), shared by Castilians, Portuguese, Berbers and later Aragonese, instead of the Genitour, which cannot attack at close range.",
  "N2: Ballesteros de nómina: a Crossbowman-line tech for the enrolled royal crossbowmen of the 15th century, once the archer and crossbow lines are split (RULES section 10).",
  "N3: An al-Andalus civ (Umayyad Córdoba, the taifas, Nasrid Granada); in the codex al-Andalus appears only in the Arabs' design (the Umayyad conquest and province, 711–750) and the Berbers' (its Almoravid and Almohad periods).",
  "N3: An Iberian architecture set (Romanesque, Gothic and Mudéjar) for Castilians, Portuguese and Aragonese.",
  "N2: The Mule Cart for the arrieros, the muleteers who carried the kingdom's inland trade (RULES section 10). Under RULES 6.16.7 it stays with its four holders in N1; as a unique building it would also count as a seventh passive bonus here (RULES 6.1), so a slot would have to be freed.",
]
contested = [
  "The 'Reconquista' as one continuous project: a historiographical construction (García Sanjuán; Ríos Saloma, 2011) or a still useful category (García Fitz; O'Callaghan, 2003).",
  "'Convivencia': Américo Castro against Sánchez-Albornoz; Menocal (2002) against Fernández-Morera (2016); Soifer (2009).",
  "The weight of artillery in the fall of Granada (Cook, 1993) against the Nasrid civil war and economic exhaustion.",
  "Iberian priority in the use of gunpowder (Huéscar 1324, Algeciras 1342–1344), on the Nasrid and Marinid side.",
  "The 'Toledo School of Translators', considered for the team bonus and not used (see the team bonus), is a 19th-century label for a loose, largely individual activity; many translators were foreigners working with Mozarab and Jewish intermediaries (Charles Burnett, 'The Coherence of the Arabic-Latin Translation Program in Toledo in the Twelfth Century', Science in Context 14, 2001).",
  "Where Castile begins: with the county of Castile (Fernán González, from the 930s), inside the kingdom of León (from c. 910), or with Ferdinand I, who joined León to Castile after Tamarón (1037). The design starts in 1037, with the Crown of Castile, and keeps the county and the earlier kingdom of León as background in the bases (the charter of 800, the Duero repoblación, Compostela) (level-1 review decision).",
]
open_questions = []

[profile]
entity = "The Crown of Castile: the kingdoms of León and Castile (united 1037–1065, again from 1072 to 1157, and permanently from 1230) and their conquests, from Ferdinand I, who joined León to Castile after Tamarón (1037), to the death of Isabella I (1504)"
region = "Central, northern and southern Iberian Peninsula: Old and New Castile, León, Galicia, Asturias, the Basque coast, Extremadura, Andalusia and Murcia"
window = "1037–1504 (from Ferdinand I's union of León and Castile after Tamarón to the death of Isabella I, a terminal event soon after 1500 as RULES 6.16.17 allows; core 1037–1500; nothing in the design originates after 1500, the generic skeleton items of RULES 6.16.2 aside: Cerignola and the mines at the Castel Nuovo of Naples, both 1503, confirm traits of the war of Granada)"
sources = [
