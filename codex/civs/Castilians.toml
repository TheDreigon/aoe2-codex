[[bonus]]
text = "Shepherding also generates gold"
kind = "economic"
level = 1
change = "new"
replaces = "Receive +20 gold for each technology researched"
precedent = "Shepherding, fishing, and hunting also generate gold (Varangians), narrowed to shepherding"
basis = "Castile's great export was wool. The Honrado Concejo de la Mesta, recognised by Alfonso X in 1273, organised the seasonal migration of the flocks along the royal sheep-walks (cañadas) between the summer pastures of the north and the winter pastures of Extremadura and Andalusia; from the late 14th century merino wool, shipped through Burgos and the Cantabrian ports, became the kingdom's main export (Klein, 1920; Phillips and Phillips, 1997). Gold rather than food abstracts wool sold abroad. The gold-per-technology bonus it replaces had no historical anchor. The owner's Castilian sketch gave the Mesta a shepherding effect; the design gives it gold instead, a departure accepted in the level-1 review (section 5): wool sold abroad is what made the Mesta matter, and 'Shepherds work +25% faster' (Britons) already serves the Berbers', Bulgarians', English and Norwegians' designs (and the Inca's within a combined bonus). The shepherding effect stays available should the owner prefer it. With the Norwegians' and Tamils' 'Fishing Ships generate gold in addition to food' and the Swedes' and Rus' 'Hunting also generates gold', this passive completes the split of the game's Varangian bonus. The same wool underlies the team bonus, seen from the buyers' side; the two are kept together, the passive for the wool the flocks produced and the team bonus for the trade it fed (level-1 review decision)."
relevance = "Transhumant sheep farming and the wool trade shaped Castile's landscape, law and economy for centuries; a trait unknown to most players that passes on weight (RULES 6.9 names the Mesta)."
contested = "When merino sheep reached Castile (perhaps with the Marinids, late 13th–14th century) and when wool overtook other exports are debated."

[[bonus]]
text = "Blacksmith upgrades cost no gold"
kind = "military"
level = 1
change = "kept"
precedent = "Blacksmith upgrades cost no gold (Spanish)"
basis = "Iron from the ferrerías of Biscay and Gipuzkoa was exported in bulk to England and Flanders (Childs, 1978), and Toledo was famous for its sword blades by the 15th century: abundant, cheap metalwork is a real Castilian trait. Classed as military, like the free unit upgrades of other designs, since it cheapens arms and armour."
relevance = "Basque iron was one of the kingdom's main exports and Toledo steel one of its best-known products; a lasting economic trait expressed through the army's equipment."

[[bonus]]
text = "Gunpowder Units attack +18% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Gunpowder Units attack +18% faster (Spanish)"
basis = "Castile won the war of Granada (1482–1492) largely through artillery sieges (Ronda 1485, Loja 1486, Málaga 1487) carried out by the royal artillery train under Francisco Ramírez de Madrid, with handgunners (espingarderos) in the field (Cook, 1993; Pulgar). At the end of the window, in Ferdinand's war for Naples, fought largely with Castilian troops for a claim of the Crown of Aragon, Gonzalo Fernández de Córdoba's arquebusiers, entrenched behind a ditch, broke the French at Cerignola (1503) (Taylor, 1921). The faster rate of fire is a game abstraction of Castile's late, heavy investment in gunpowder, not a documented rate."
relevance = "The guns that reduced the Nasrid fortresses ended the Reconquista, and Castilian infantry with firearms carried the kingdom into the Italian Wars."
contested = "The trait belongs to the last decades of the window; in the 15th century Italy, Burgundy, Bohemia and Germany led in handguns, and the weight of artillery in the fall of Granada is debated (see the civ-level list)."

[[bonus]]
text = "Castles cost -15/25% in Castle/Imperial Age"
kind = "military"
level = 1
change = "new"
precedent = "Castles cost -15/25% in Castle/Imperial Age (Franks)"
basis = "Castile took its name from its castles. 'Castella' first appears in a charter dated 800, known from a 12th-century cartulary copy, for a frontier district on the eastern edge of the Asturian kingdom, the Bardulia 'now called Castella' of the Chronicle of Alfonso III (background before the window). The kingdom then advanced behind successive lines of castles on the Duero, the Tagus and, from the 13th century, the frontier of Granada, held by the crown, the military orders, the nobles and the towns (MacKay, 1977; O'Callaghan, 2003). Owner's decision."
relevance = "The castle frontier gave Castile its name and the form of its expansion."
contested = "The authenticity of the charter of 800 (Taranco, Valle de Mena), preserved only in the Becerro Galicano of San Millán de la Cogolla, is debated."

[[bonus]]
text = "First Monastery receives a free Relic"
kind = "other"
level = 1
change = "new"
precedent = "First Fortified Church receives a free Relic (Armenians)"
basis = "The tomb of the apostle James, found at Compostela in the first half of the 9th century under Alfonso II of Asturias (background before the window), made Santiago the patron of the Christian kingdoms (the battle cry '¡Santiago!') and the goal of the greatest pilgrimage road of Latin Europe after Rome; the Romanesque cathedral was begun in 1075 and Diego Gelmírez won the archbishopric in 1120 (Fletcher, 1984). Owner's decision: the civ's religious angle."
relevance = "Santiago was the patron of the Reconquista and of the Crown, and Compostela made the kingdom a centre of Latin Christendom; the cult is part of Castilian identity."
contested = "The authenticity of the relics and the date of the discovery; the 'Voto de Santiago' and the apostle's appearance at Clavijo are 12th-century inventions."

[[bonus]]
text = "Town Centers cost -50% wood starting in Castle Age"
kind = "economic"
level = 1
change = "new"
replaces = "Builders work +30% faster (dropped for relevance, RULES 6.9: the repoblación behind it is central, but building speed expresses it weakly and nothing made Castilian builders faster than others; 'cheaper castles' now carries the castle tradition)"
precedent = "Town Centers cost -50% wood starting in Castle Age (Britons)"
basis = "The Christian kingdoms held their conquests by resettling them (repoblación): kings, lords and the military orders granted charters (cartas pueblas) and fueros with privileges to draw settlers to new or refounded towns, from the Duero valley (9th–10th centuries, background before the window) to Extremadura and La Mancha (11th–13th) and Andalusia, shared out among settlers in the repartimientos after the conquest of Seville (1248) (MacKay, 1977; O'Callaghan, 2003). Cheaper Town Centers from the Castle Age stand for this planned settlement. The owner's Castilian sketch kept the builders; giving their slot to the repoblación is a departure accepted in the level-1 review (section 5), which also keeps this bonus rather than restoring the builders or spending the slot on the Castilian galleys ('Galley-line +1 attack', for Seville's royal shipyard of 1252, the Boccanegra admirals and La Rochelle, 1372). With it the civ has 6 passive bonuses and 3 unique techs, the cap of 9 (RULES 6.1)."
relevance = "Repoblación, settling the frontier with chartered towns, is how Castile turned conquests into a kingdom; without it the expansion could not have been held."
contested = "How empty the Duero valley was before the repoblación: Sánchez-Albornoz's depopulated 'strategic desert' (1966) against later historians and archaeologists."

[team_bonus]
text = "Trade Units generate +25% gold"
level = 1
change = "kept"
precedent = "Trade Units generate +25% gold (Spanish team bonus)"
basis = "Castilian wool fed the cloth industries of Flanders and, through Genoese and Florentine buyers, of Italy; the merchants of Burgos kept their own 'nation' at Bruges in the 15th century, the Crown created their Consulado at Burgos in 1494, and the fairs of Medina del Campo drew foreign merchants (Childs, 1978; Phillips and Phillips, 1997). Castile's trading partners also profited from this trade, as RULES 6.2 requires. The same effect is also the Mongols' team bonus in their design; identical team-wide effects count once per team, and trade-gold team bonuses count as one at the highest value present (RULES 6.16.12). As the game's original holder of the effect, the Castilians keep it (level-1 review decision); the alternatives, Alfonsine science and the Toledo translations (Archbishop Raymond, 1125–1152; Gerard of Cremona; the Alfonsine Tables of c. 1272, printed in 1483) or the Castilian galleys that served France after the alliance of Toledo (1368; La Rochelle, 1372), are not used. The wool is also behind the Mesta passive, seen from the producers' side."
relevance = "The wool trade tied Castile's economy to Flanders and Italy and fed their cloth industries; a benefit to neighbours, not only to Castile."

[[unique_unit]]
name = "Freire"
model = "Monaspa"
building = "Castle"
level = 1
change = "new"
replaces = "Conquistador and Missionary (their unique-unit slots; both in [[dropped]])"
basis = "The professed knights (freires caballeros) of the military orders of Calatrava (1158, under the Cistercian rule), Santiago (founded 1170, approved by the pope in 1175) and Alcántara (c. 1176 as San Julián del Pereiro, named Alcántara from 1218) garrisoned frontier castles and held lordships from La Mancha to Extremadura, and fought at Alarcos (1195), Las Navas de Tolosa (1212) and in the conquest of Andalusia (O'Callaghan, 1975; Lomax, 1965). The Monaspa, heavy cavalry that grows stronger beside other Monaspas or Knight-line units, abstracts a sworn brotherhood fighting beside the royal and noble knights; it is shared with the Georgians (and the Poles' Kopijnik) and renamed (owner's decision). The name 'Freire', the orders' own word for a professed brother (freires caballeros beside freires clérigos), is kept rather than 'Caballero de Calatrava' or 'Caballero de Santiago', which would single out one order (level-1 review decision). The orders keep the unique unit while the Castle tech goes to the caballería de cuantía: the freires were a distinct, professed troop that fought as a body under their masters, which a unit renders, and a tech for the orders as well would spend two high slots on one institution (RULES 6.3). The Scenario Editor's Crusader Knight (RULES section 5) is not used as the model, although its white mantle is close to the Cistercian habit of Calatrava and Alcántara: its black cross is the Teutonic Order's, while the Castilian orders bore red crosses (the sword-cross of Santiago; the cross fleury of Calatrava) or, at Alcántara, a green cross fleury; and the Monaspa's aura renders the brotherhood fighting beside the knights better than a lone heavy horseman would."
relevance = "The military orders were a permanent, professed element of the frontier garrisons and lords of much of New Castile and Extremadura; their knights are the emblematic soldiers of the Reconquista."
contested = "The orders' share of the frontier armies: royal, noble and concejo hosts supplied most troops. Whether the orders also need a tech (the owner's answer of 19 October 2026: probably not, after checking how essential their representation is): without the draft's Órdenes Militares (Freires +20 HP and more resistant to conversion) they are not missing, since the Freire, the civ's only unique unit, renders their knights in the field and the castle and repoblación passives name their frontier castles and settlement charters; what a tech would add, their rule, the rents of their encomiendas or the crown's assumption of the masterships (Calatrava 1487–1489, Santiago 1493, Alcántara 1494; annexed for good by Adrian VI's bull of 1523), is a second high slot for one institution (RULES 6.3) in a civ already at the cap of 9, so Órdenes Militares stays out."

[[unique_tech]]
name = "Caballería de Cuantía"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Stables work +20% faster"
level = 2
change = "new"
precedent = "Stables work +20% faster (Huns team bonus; the Avars' design keeps it as its team bonus), as a tech for the civ alone, in the Castle Age, later than the game's team bonus (RULES 6.16.11). A new tech built from an existing effect, so level 2 (RULES 6.5). The Germans' design uses the same effect for its Ministerialen. Chivalry (Stables work +40% faster, Franks), which would have been level 1, is an Imperial Age tech in the game, and a reused effect never comes earlier than the game's age (RULES 6.16.11): it would have put all three Castilian techs in the Imperial Age, against the Castle Age tech for the cuantía that the level-1 review chose (section 7, Castilians Q1); the Poles' design reuses it as Wojsko Zaciężne"
basis = "Alfonso XI tied the keeping of a war horse to wealth. After a reform of the crown's paid vassals and their soldadas at Burgos (1338), a precursor, the Cortes of Alcalá (1348) obliged householders whose property reached a set amount (cuantía), reckoned in maravedís, to keep a horse and arms and to show them at the musters (alardes) (Agrait, 2005; Pérez-Prendes, 1960; González Jiménez, 1985). The institution took root above all in Andalusia and Murcia, where the caballeros de cuantía, or cuantiosos, became the core of the town cavalry; they served in the frontier war and the war of Granada. Faster Stables abstract a body of horsemen kept ready at home at their own cost and called out at once. The tech speeds what the Stable trains, the Knight-line for the horsemen a la brida and the Light Cavalry line for the lighter horse; the Jinete, the rider a la jineta typical of the Granada frontier (see the tree), trains at the Archery Range and stays outside the effect, a limit of the game's buildings rather than a claim that the cuantiosos did not ride a la jineta. The game's Chivalry, a name for an ethos rather than an institution, gives the effect at twice the magnitude but only in the Imperial Age (see the precedent)."
relevance = "The cuantía obligation gave the crown a standing pool of horsemen drawn from the towns, a mainstay of the town forces on the Granada frontier from 1348 to the war of Granada; a datable measure of Alfonso XI, distinct from the military orders that the unique unit renders, as the level-1 review decided (section 9)."
contested = "Whether the cuantía was a new institution in 1348 or the extension of older town obligations (the caballería villana of the fueros) is debated (Pérez-Prendes, 1960; González Jiménez, 1985); the Burgos reform of 1338 is a precursor, not the same measure. Whether the Alcalá obligation was meant for the whole kingdom or chiefly for the frontier is not settled here: the institution is documented above all in Andalusia and Murcia. The thresholds varied by region and reign, and the names for these compelled town horsemen (de cuantía, de premia) were not used consistently."

[[unique_tech]]
name = "Santa Hermandad"
building = "Town Center"
kind = "civil"
age = "Imperial"
effect = "Villagers +40 HP, +6 attack, +2 melee/+2 pierce armor"
level = 1
change = "changed"
replaces = "Supremacy"
precedent = "Supremacy (Spanish): identical effect, moved from the Castle to the Town Center and renamed (owner's decision; RULES 6.3)"
basis = "At the Cortes of Madrigal (1476) Isabella and Ferdinand set up the Santa Hermandad, a crown-controlled league of the towns of Castile, paid for by their contributions, with its own judges (alcaldes de hermandad) and paid squads (cuadrilleros) that policed roads and countryside; it raised men and money for the war of Granada, and its general organisation was wound up in 1498 (Lunenfeld, 1970). It grew out of the town brotherhoods (hermandades) that had policed roads and defended town rights since the 13th century (the Hermandad Vieja of Toledo, Talavera and Ciudad Real; the general hermandades of 1282–1315 and of the 1460s), and drew on the towns' long armed tradition under the frontier fueros (the Latin fuero of Sepúlveda, 1076; the Fuero de Cuenca, late 12th century), which obliged householders to serve in the town host (Powers, 1988; The Code of Cuenca, tr. Powers, 2000). The townsmen who served on horseback belong to the Caballería de Cuantía; this tech keeps the brotherhoods, their policing and the armed town community. Armed townsmen fit the effect on Villagers; 'Supremacy' named nothing historical."
relevance = "The crown's brotherhood of the towns (1476) gave the Catholic Monarchs order at home and men and money for Granada, resting on four centuries of armed town communities."
contested = "How far the Hermandad continued the towns' militia tradition: it was a police and fiscal-military league of the towns, not the fuero militia itself, and the two coexisted, the towns' own contingents serving in the war of Granada beside the Hermandad's men. RULES 6.3 cites the Hermandad as the formalisation of the municipal militias; the design reads that example loosely, as a structural tradition (the armed towns) reaching a datable institution through the brotherhoods, and the basis keeps the two apart (level-1 review decision)."

[[unique_tech]]
name = "Bula de Cruzada"
building = "Monastery"
kind = "civil"
age = "Imperial"
effect = "Military Units cost -15% gold"
level = 2
change = "new"
replaces = "Inquisition"
precedent = "All units cost -20% gold (Portuguese), narrowed to Military Units at a lower magnitude; Kshatriyas (Military Units cost -25% food, Gurjaras) for the target"
basis = "Crusade privileges framed and paid for the Reconquista: popes granted crusade indulgences for the Spanish wars from the 12th century and a share of church tithes for the conquest of Seville (the tercias reales, 1247), and in 1482 Sixtus IV granted the crusade bull for the war of Granada, preached throughout Castile, whose sale of indulgences, with the subsidies of the clergy, became a major source of the war's funds (Goñi Gaztambide, 1958; Ladero Quesada, 1967). Owner's decision, which ties the tech to the war of Granada: it stays in the Imperial Age for the bull of 1482, although the older crusade privileges would also justify the Castle Age (level-1 review decision). The -15% also stays: the level-1 review accepts the civ's power as it stands (against the game's Spanish it gains a sixth passive, a third unique tech, the foot crossbow line, Siege Engineers and the Jinete, and loses the builders, the gold per technology, the Cannon Galleon accuracy, two unique units, Thumb Ring, Siphons and the Mounted Crossbowman line); a -10% Bula would be the counterweight if play required one. The Inquisition it replaces (1478) judged only the baptised and converted no one; the forced conversions came from royal decrees (1492, 1499–1526) (Kamen, The Spanish Inquisition, 1997)."
relevance = "The crusade bull financed the last war of the Reconquista and joined Castile's religious identity to its wars."

[tree]
add = ["Crossbowman", "Arbalester", "Siege Engineers", "Genitour", "Elite Genitour"]
remove = ["Mounted Crossbowman", "Heavy Mounted Crossbowman", "Thumb Ring", "Siphons"]

[tree.basis]
"Crossbowman" = "The crossbow was a central weapon of Christian Iberia: the frontier fueros gave privileges to the crossbowmen (ballesteros) of the concejo militias (Powers, 1988), and the Crown kept enrolled royal crossbowmen (ballesteros de nómina) in the 15th century, who served in the war of Granada; just after the window, Cortés still had 32 crossbowmen against 13 handgunners (1519, Bernal Díaz). In the game only the Spanish and the Bulgarians lack it, though the Spanish already have mounted crossbowmen. Owner's decision."
"Arbalester" = "Same basis as the Crossbowman: the foot crossbowman stayed central in Castilian armies and fleets until the end of the 15th century."
"Siege Engineers" = "The war of Granada was a war of sieges (Ronda 1485, Loja 1486, Málaga 1487) with a large royal artillery train under Francisco Ramírez de Madrid (Cook, 1993). At the end of the window, in Ferdinand's war for Naples, Pedro Navarro, serving Gonzalo Fernández de Córdoba, used gunpowder mines decisively at the Castel Nuovo of Naples (1503), building on Italian experiments of 1487–1495 and on his own mine at Cephalonia (1500). Owner's decision; its absence contradicted the civ's history."
"Genitour" = "The jinete, the light horseman riding a la jineta (short stirrups, light lance, javelins and leather adarga), was the typical cavalry of the Granada frontier and a large part of the Catholic Monarchs' horse in the war of Granada (Ladero Quesada, 1967); 'genet' and 'genitour' passed into English and French. The style and the word came from the Zenata horsemen of Granada and North Africa (zenete > jinete). The jinete's main weapon was the lance, with javelins secondary; the Genitour, a javelin horseman that cannot fight at close range, is the closest existing unit. A regional unit (owner's decision; RULES 6.16.10) that does not count as a unique unit (RULES 6.1), trained at the Archery Range from the Castle Age as for the Berbers' allies, and renamed Jinete."
"Elite Genitour" = "The Elite upgrade of the Jinete (Archery Range), for the same light horsemen."
"Mounted Crossbowman" = "Shared basis (level-1 review, section 3.2): the Mounted Crossbowman line stays only where shooting from the saddle is documented. Castile had mounted crossbowmen as a troop type (the ballesteros a caballo, which the level-1 analysis counts among the plausible cases for the game's Spanish), but no source found for this design shows them shooting from the saddle rather than riding to the fight and shooting on foot, the same gap the English design finds for England's balistarii equites. Castile's mounted missile troops were the jinetes with their javelins (the Jinete), and its crossbowmen are the foot Crossbowman and Arbalester. Removed, with its Heavy tier; the line returns if a source shows Castilian crossbowmen shooting from horseback. Nothing the civ needs to play is lost (RULES 6.11): the foot crossbow line and the Jinete keep the missile roles, and the Knight-line, the Light Cavalry line and the Freire the mounted ones."
"Heavy Mounted Crossbowman" = "Same reason as the Mounted Crossbowman."
"Thumb Ring" = "The Thumb Ring is given where the thumb draw is attested for a civ's own archers or for an archery tradition its armies demonstrably used (the steppe, Islamic and East Asian traditions); civs whose archers used the European draw, or whose missile troops were crossbowmen, do not get it. Castile does not: its archers used the European draw and its missile troops the crossbow (see the Crossbowman) (RULES 6.16.4)."
"Siphons" = "Named after the Byzantine fire siphon, a state secret never given to other nations (De Administrando Imperio 13); no ship-borne liquid-fire weapon is documented for this civ. The fire arrows and pots of burning grease and oil that the Castilian galleys used against the English fleet at La Rochelle (1372), in the account of the Chronique des quatre premiers Valois, were ordinary incendiaries, which the generic Fire Ship line already abstracts. The Castilians keep the fleet-of-ships tier (RULES 6.16.1): war galleys from the royal shipyard of Seville (1252) and the naos and carracks of the Cantabrian and Andalusian coasts, with the Galleon as the skeleton's flagged abstraction (RULES 6.16.2). The Cannon Galleon rests on guns carried aboard Castilian ships inside the window: Columbus's ships of 1492 carried lombards, and a lombard shot was the agreed signal for land: the Niña fired one on 7 October, and the Pinta gave the agreed signal when land was sighted on 12 October (Diario, in Las Casas's abstract). That shows ships armed with guns, not a documented fight between gun-armed Castilian warships, so the Cannon Galleon line is a thinly grounded abstraction and is flagged as such."

[[rename]]
from = "Genitour"
to = "Jinete"
level = 1
basis = "Jinete (from zenete, 'Zenata') is the Castilian name of the light horseman the Portuguese call ginete: the same regional unit, named in each language. The rename meets RULES 6.16.15: the same function inside the window, a period term (Castilian ginete, jinete), and 'genitour' is the English and French borrowing of the same word. The Berbers keep 'Genitour', and the Lithuanians, to whom RULES 6.16.10 extends the regional unit, name it in their own design."

[[rename]]
from = "Elite Genitour"
to = "Elite Jinete"
level = 1
basis = "Same rename for the Elite upgrade."

[[rename]]
from = "Elite Monaspa"
to = "Elite Freire"
level = 1
basis = "Follows the unique unit (Monaspa → Freire), for the Castilians only; the Georgians keep the Monaspa."

[architecture]
set = "Mediterranean"
level = 1
change = "kept"
basis = "Castilian Romanesque, Gothic and Mudéjar building sits well in the Mediterranean set; an Iberian set would be N3."

[[dropped]]
item = "Cannon Galleons fire more accurately at moving targets"
kind = "bonus"
reason = "No basis for accurate Castilian naval gunnery: Castile's medieval fleets were galley squadrons (La Rochelle, 1372), and the Armada of 1588, after the window, fired more slowly than the English (Martin and Parker, 1988). The generic Cannon Galleon line stays in the tree as a thinly grounded abstraction of the armed naos and carracks of the late 15th century (see the Siphons line of the tree). A bonus for the medieval Castilian galley fleet ('Galley-line +1 attack') is left out: the six-bonus slots go to other traits, the repoblación among them (level-1 review decision)."

[[dropped]]
item = "Conquistador"
kind = "unique_unit"
reason = "Outside the window and of the wrong type: the conquistadors belong to 1519–1550, and Cortés's horsemen fought with lance and sword, not firearms (Bernal Díaz: 16 horses, 13 handgunners, 32 crossbowmen in 1519). A post-1500 element with no medieval Castilian basis (RULES section 2); owner's decision. Its slot goes to the Freire."

[[dropped]]
item = "Missionary"
kind = "unique_unit"
reason = "The missionaries of the Americas were mendicant friars on foot: the Franciscan Rule of 1223 forbade riding except in necessity or illness, and the first Twelve walked from Veracruz to Mexico in 1524; mounted missionaries were the exception before the mission frontier of the late 17th century (Kino). Owner's decision; the military orders now give the civ its religious cavalry (Freire)."
