]

[tree.basis]
"Siege Workshop" = "The Mapuche built no siege engines; they took Spanish forts by assault, blockade and fire. Removing the workshop removes all its units; Petards, the Weichafe line (strong against buildings) and Arson replace them (owner's decision, brief section 6; RULES section 10)."
"Battering Ram" = "Removed with the Siege Workshop: there were no rams and no wheeled vehicles."
"Capped Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Mangonel" = "Removed with the Siege Workshop: no torsion or traction artillery existed in the Americas."
"Onager" = "Removed with the Siege Workshop (see Mangonel)."
"Scorpion" = "Removed with the Siege Workshop: no bolt-throwers existed in the Americas."
"Heavy Scorpion" = "Removed with the Siege Workshop (see Scorpion)."
"Siege Tower" = "Removed with the Siege Workshop: a wheeled assault tower."
"Trebuchet" = "Counterweight artillery never existed in the Americas."
"Siege Engineers" = "No siege engines are left to improve."
"Crossbowman" = "The crossbow was unknown in the Americas, and nothing suggests the Mapuche adopted captured ones; their missile weapons were bows, slings and bolas. Archers, Slingers, Skirmishers and the Bolas Rider cover the role."
"Blast Furnace" = "There was no iron before contact; afterwards the Mapuche obtained it by capture and trade and worked it, but never smelted it. Removed with the other Imperial-Age iron tiers."
"Plate Mail Armor" = "There was no plate armour; Mapuche warriors wore hardened leather, represented by the HP bonus."
"Ring Archer Armor" = "Mail rings are iron armour; removed with the other Imperial-Age iron tiers."
"Galleon" = "Ocean-going sailing warships were unknown; Mapuche boats were dugout canoes (wampu) and, further south, sewn-plank dalcas."
"Carrack" = "See Galleon."
"Catapult Galleon" = "A sailing ship carrying a catapult: both a European ship type and a siege engine."
"Siphons" = "Named after the Byzantine fire siphon; the Mapuche used no fire ships. They were the only American civ with this tech."
"Carvel Hull" = "A European shipbuilding technique (flush planking on a frame); the Mapuche were the only American civ with it."
"Bombard Tower" = "Gunpowder towers have no Mapuche basis: arquebuses captured from the Spaniards appear at Quiapo (1558) in an unsuccessful defence, and artillery use is uncertain (tech-tree audit: stretched)."
"Architecture" = "The Mapuche built in wood, cane and thatch (the ruka) and raised earthwork forts, not stone buildings."
"Masonry" = "See Architecture; the Aztecs, Byzantines and Tupi also lack Masonry."
"Stone Wall" = "Mapuche defences were earthworks, ditches and palisades; stone walls are removed, as for the Cumans and Goths, and the Palisade Wall is strengthened by the team bonus."
"Gate" = "Removed with the Stone Wall; the Palisade Gate remains."
"Heavy Plow" = "There was no plough before contact (the ploughing with hueque that Spilbergen reported on Mocha Island in 1614 is post-contact). With no equivalent for the function the tech is removed; Raised Fields keep the Mapuche's own farming technique."

[[rename]]
from = "Champi Scout"
to = "Weichafe Scout"
level = 1
basis = "Weichafe is the Mapudungun word for warrior. Champi, the Quechua name of the Andean mace, is foreign to the Mapuche, whose clubs were of wood and whose stone axe (toki) was the war leader's insignia."

[[rename]]
from = "Champi Runner"
to = "Weichafe Runner"
level = 1
basis = "Same rename as Champi Scout."

[[rename]]
from = "Champi Warrior"
to = "Weichafe"
level = 1
basis = "Same rename as Champi Scout."

[[rename]]
from = "Elite Champi Warrior"
to = "Elite Weichafe"
level = 1
basis = "Same rename as Champi Scout."

[[rename]]
from = "Horse Collar"
to = "Raised Fields"
level = 1
basis = "There were no draft animals. Raised cultivation platforms in the wetlands of the Purén and Lumaco valleys, radiocarbon-dated to about 1220–1420, belong to the same landscape as the kuel ceremonial mounds (Dillehay et al. 2007 and later work by Dillehay's team). Same rename as for the Maya and the Muisca."

[architecture]
set = "South American"
level = 1
change = "kept"
basis = "The South American set fits best among the existing ones; a set of rukas and earthwork pucarás would be N3."
