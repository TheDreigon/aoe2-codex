civ = "Mapuche"
name = "Mapuche"
status = "draft"
label = "Infantry and Counter-Units civilization"
summary = "The Mapuche (Reche) of south-central Chile (1100–1598), recentred on their pre-Hispanic world as the late-element rule requires (RULES section 2): foraging, lof levies, tough infantry and raised fields stay; colihue lancers (on the Kamayuk model) become the main unique unit, the war leader (Toqui, the Caciques tech renamed) and the assemblies (Koyagtun) the unique techs, dispersed homesteads, machi healers and allied rewe replace the anecdotal and unfounded bonuses, and the cavalry of the Arauco War survives only as the Kona in the Imperial Age, the civ's one late element; the Bolas Rider, Malon, Butalmapu and raiding gold are dropped, and siege engines, crossbows, the Imperial iron tiers, the Halberdier, gunpowder towers, stone building and the ocean navy are removed."
ideas = [
  "N3: Infantry unique units of their own (a colihue pikeman, a bola and lasso thrower on foot) instead of the shared Kamayuk model.",
  "N3: A pucará (earth-and-timber fort) replacing the Castle until the Imperial Age and training the Colihue Lancer and the Spearman-line (analysis proposal).",
  "N2: Pucarás with staked pits that slow enemy cavalry (Peteroa 1556, Quiapo 1558).",
  "N2: Horse capture: each enemy mounted unit killed lowers the cost of the next Kona (the first Mapuche horses were captured from the Spaniards).",
  "N3: Herds of hueque (the chilihueque camelid), used for wool, in ritual and as bride wealth, as livestock or a pack animal.",
  "N3: Re-theme the Monk as the machi, and add the kuel ceremonial mounds of Purén–Lumaco as a monument.",
  "N3: Parliaments with the Crown (the koyagtun of Quilín, 1641) as a diplomatic mechanic.",
  "N2: The Arauco War content that the late-element rule leaves out (Lautaro's relieving squadrons at Tucapel, 1553; the futalmapu alliances; mounted raiding for cattle and horses), as an alternative late element if the owner prefers it to the Kona.",
]
contested = [
  "Ethnogenesis and ethnonym: a shift from ‘reche’ to ‘mapuche’ under colonial pressure (Boccara) or long continuity (Bengoa, Dillehay); whether the El Vergel complex (c. 1100–1450) leads continuously to the Reche of the 16th century is part of the same debate.",
  "The real extent of Inca rule south of the Maipo and the historicity, date and outcome of the battle of the Maule (known mainly from Garcilaso; Osvaldo Silva dates it much later and doubts it was decisive).",
  "Pre-Hispanic Mapuche warfare and institutions (the toqui, the assemblies, the ayllarewe, the long lance) are known almost only from sources written after 1541; their pre-Hispanic form is inferred.",
  "Whether bolas were used in Chile in the 16th century at all (Latcham 1929; Rex González 1953, who held that the Araucanians, later constant bola users on the pampas, did not know them in Chile at the conquest); the mounted bola belongs to the pampas and their later araucanisation.",
  "The periodisation of the Arauco War: open war c. 1550–1656, then a frontier of trade and parliaments until the occupation of Araucanía (1861–1883).",
  "Lautaro between history and epic (Ercilla, La Araucana).",
  "The pre-Hispanic population of Araucanía.",
]
open_questions = [
  "Late elements (scope): RULES section 2 allows one post-1500 element per civ, in the Imperial Age only. Almost everything that defined the game's Mapuche (cavalry, the Bolas Rider, Butalmapu, raiding gold, Lautaro's knowledge of the Spanish forts) dates from after 1541, so this design recentres the civ on its pre-Hispanic traits and keeps the cavalry only as the Kona from the Imperial Age. Keep this recentring, choose another late element (for example Lautaro's tactics at Tucapel, 1553), or exempt the Mapuche from the rule?",
  "Label: the game's ‘Cavalry and Counter-Units’ becomes ‘Infantry and Counter-Units’, since horses arrived only after 1541 and the cavalry is now an Imperial-Age late element. Accept?",
  "The main unique unit, the Colihue Lancer, uses the Inca Kamayuk model (also shared by the Berbers' Murabit in their design). Accept, or prefer another existing unit until N3 units exist?",
  "The Castle is kept for structural reasons (unique units, unique tech, Imperial Age requirement), though the Mapuche built earthwork and timber pucarás, not stone castles. Accept until an N3 pucará exists?",
  "Generic names: Wheelbarrow, Hand Cart, Crop Rotation, Trade Cart, Treadmill Crane, Coinage and Banking keep their generic names. Rename or keep them as accepted abstractions?",
  "Region-wide, siege: the Siege Workshop with all its units, the Trebuchet and Siege Engineers are removed from all six American civs (owner's decision, brief section 6), the first civs in the game without them. Buildings fall to the Weichafe line, Arson, Sappers and Petards, but every Castle must be taken by units standing in its arrow fire, so castle-breaking will be slow. The Petard is itself a 16th-century gunpowder charge (Cahors, 1580), a post-1500 element held by all 56 civs (RULES section 2); it is kept unrenamed as the abstraction of assault parties with fire, so as not to hide the anachronism (RULES 6.10). Accept the risk until an N2/N3 assault unit exists?",
  "Region-wide, iron: only the Imperial-Age iron tiers (Blast Furnace, Plate Mail Armor, Ring Archer Armor) are removed, a playability line rather than a historical one (the Lithuanians already lack Blast Furnace and Plate Mail Armor). Forging, Iron Casting, Scale Mail Armor and Chain Mail Armor stay as a generic equipment level, although the Mapuche had no iron before contact, and Chemistry stays for its +1 ranged attack. Remove or rename them too, at a cost to playability?",
  "Region-wide, crossbows: the Crossbowman is removed from all six American civs (the Mapuche never had the Arbalester), since the crossbow was unknown there; Archers, Slingers and Skirmishers cover the role. Accept, or keep the crossbow tiers as a flagged abstraction until the N2 bow line?",
]

[profile]
entity = "The Mapuche (called reche in 16th-century sources, ‘Araucanians’ by the Spaniards)"
region = "South-central Chile between the Itata/Biobío and Toltén rivers"
window = "1100–1598 (pre-Hispanic roots in the El Vergel complex, c. 1100–1450, and the raised fields and kuel mounds of Purén–Lumaco; the Inca frontier c. 1470–1530; the Arauco War to Curalaba, 1598, at the edge, represented only by the Kona as the one late element)"
sources = [
  "Jerónimo de Vivar, Crónica y relación copiosa y verdadera de los reinos de Chile (1558)",
  "Alonso de Ercilla, La Araucana (1569–1589)",
  "Alonso de Góngora Marmolejo, Historia de todas las cosas que han acaecido en el reino de Chile (1575)",
  "Pedro Mariño de Lobera, Crónica del Reino de Chile (c. 1595)",
  "Inca Garcilaso de la Vega, Comentarios Reales (1609)",
  "Diego de Rosales, Historia general del Reino de Chile (c. 1674)",
  "Francisco Núñez de Pineda y Bascuñán, Cautiverio feliz (1673)",
  "José Bengoa, Historia del pueblo mapuche (1985); Historia de los antiguos mapuches del sur (2003)",
  "Guillaume Boccara, Guerre et ethnogenèse mapuche dans le Chili colonial (1998)",
  "Tom D. Dillehay, Monuments, Empires, and Resistance (2007)",
  "Tom D. Dillehay et al., ‘Cultivated wetlands and emerging complexity in south-central Chile and long distance effects of climate change’, Antiquity 81 (2007)",
  "Ana Mariella Bacigalupo, Shamans of the Foye Tree (2007)",
]

[[bonus]]
text = "Foragers drop off +25% food"
kind = "economic"
level = 1
change = "kept"
precedent = "Foragers drop off +25% food (Mapuche)"
basis = "Gathering was a large part of a mixed economy: araucaria pine nuts (piñones), above all among the Pehuenche, wild fruits and shellfish on the coast, alongside the cultivation of potato, maize, quinoa, beans and madi."
relevance = "Gathering, above all the araucaria nuts of the Pehuenche and the shellfish of the coast, was a pillar of the pre-Hispanic Mapuche economy beside horticulture."

[[bonus]]
text = "Settlements can train Spearman-line and Skirmishers"
kind = "military"
level = 1
change = "kept"
precedent = "Settlements can train Spearman-line and Skirmishers (Mapuche)"
basis = "Mobilisation was decentralised: each lof or rewe sent its own warriors (weichafe) under its lonko, with no standing army or barracks (Bengoa; Boccara)."
relevance = "Each lof raised and led its own warriors: the absence of a standing army or a centre was the core of Mapuche military organisation."

[[bonus]]
text = "Infantry, Slingers and Skirmishers +5/10/15 HP in Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Infantry, Slingers and Skirmishers +5/10/15 HP in Feudal/Castle/Imperial Age (Mapuche)"
basis = "The chroniclers and Ercilla stress the endurance of Mapuche warriors, who also fought in cuirasses and helmets of hardened hide (Vivar; Góngora Marmolejo)."
relevance = "Endurance and hide armour are the traits every chronicler of Mapuche warfare stresses."

[[bonus]]
text = "Settlements cost -33%"
kind = "economic"
level = 1
change = "new"
replaces = "Enemy Castles are revealed on the map"
precedent = "Settlements cost -33% and heal nearby units (Muisca), the cost half"
basis = "The Mapuche lived in dispersed homesteads of kin groups (lof) under their lonko, without towns, capitals or permanent rulers, so there was no centre whose capture could end a war, and they could not be conquered by ‘decapitation’ as the Inca and Aztec states were (Bengoa 2003; Boccara 1998). Cheap, dispersed Settlements render this landscape. The bonus it replaces rested on one man's knowledge (Lautaro had served Valdivia as a groom) and on events after 1541 (Curalaba, 1598): an anecdote (RULES 6.9) and a late element (RULES section 2)."
relevance = "Decentralisation is the main reason the Mapuche were never conquered by the Inca and resisted the Spanish conquest."

[[bonus]]
text = "Monks heal +100% faster"
kind = "other"
level = 1
change = "new"
precedent = "Monks heal +100% faster (Byzantines team bonus)"
basis = "The machi, shamans who were often women, healed the sick with plants and with the machitun ceremony and officiated at rites around the rewe, the carved ceremonial post of the community; colonial writers describe them (Rosales; Núñez de Pineda, 1673), and the institution lives on (Bacigalupo 2007). Healing monks render the machi as healers."
relevance = "The machi is the central religious figure of Mapuche society, as healer and officiant, from the first sources to the present."
contested = "Most descriptions of the machi are from the 17th century onwards; the pre-Hispanic institution is inferred."

[team_bonus]
text = "Spearman-line and Skirmishers train +25% faster"
level = 1
change = "new"
replaces = "Spearman-line and Skirmishers +2 line of sight"
precedent = "Mounted Archers train +25% faster (Magyars team bonus); Camel and Elephant Units train +25% faster (Gurjaras team bonus)"
basis = "Lof and rewe were grouped in larger alliances (ayllarewe, ‘nine rewe’) whose communities sent warriors to each other's wars under a common toqui, and neighbouring peoples fought together, as the peoples on and south of the Maule did against the Inca armies (Garcilaso; Bengoa 2003). RULES 6.2: alliances; faster training of the levy troops renders the warriors that allies sent. The line-of-sight bonus it replaces had no specific basis (rated unfounded)."
relevance = "Alliance between autonomous communities was the only way the Mapuche fielded large armies, against the Inca as against the Spaniards."
contested = "The ayllarewe are documented from the late 16th and the 17th centuries (Rosales); their pre-Hispanic form is inferred, and the Maule battle itself is contested."

[[unique_unit]]
name = "Colihue Lancer"
model = "Kamayuk"
building = "Castle"
level = 1
change = "new"
basis = "The long lance of colihue cane was the main Mapuche weapon when the Spaniards arrived: the early chroniclers describe lances of great length and squadrons of pikemen from the first battles (Vivar, 1558; Góngora Marmolejo, 1575). The weapon is older than the contact, so it originated inside the time frame (RULES section 2); only its use in dense squares against horses dates from the 1550s. The Inca Kamayuk, a spearman with long reach, is the nearest existing unit (shared with the Inca and with the Berbers' design)."
relevance = "The lance was the Mapuche weapon par excellence, and lance squadrons were the backbone of their armies."
contested = "The pre-Hispanic length of the lance and its tactics are not documented; the counter-cavalry role of the model is a game abstraction."

[[unique_unit]]
name = "Kona"
model = "Kona"
building = "Castle"
level = 1
change = "changed"
basis = "Kona were the young warriors in the service of a lonko. As riders they belong to the decades after c. 1560, when the Mapuche, having captured and then bred horses, fielded the cavalry that destroyed the Spaniards at Curalaba (1598). Late element (RULES section 2): it originated after 1500, so it is available at the Castle only from the Imperial Age (age-gated availability, as in the Italians' team bonus ‘Condottiero available at the Barracks in Imperial Age’), and it is the civ's only post-1500 element."
relevance = "The horse changed the course of Mapuche history: mounted war won Curalaba and held the Biobío frontier for three centuries, and the Mapuche horseman is the best-known image of their resistance (clear fame)."
contested = "Kona meant a young warrior or dependant rather than a formal elite."

[[unique_tech]]
name = "Toqui"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Weichafe and Slingers attack +25% faster"
level = 1
change = "new"
replaces = "Malon"
precedent = "Caciques (Tupi: Champi Warriors and Slingers attack +25% faster): an existing unique tech, shared and renamed with an identical effect, since the Champi Warriors are the Mapuche Weichafe"
basis = "In war the Mapuche chose a war leader, the toqui, named after the polished stone axe (toki) that was his insignia, who led the warriors of the allied lof for the length of a campaign; Lautaro and Caupolicán held the office. Clubs and slings were among the weapons of the weichafe. A chief's tech on club fighters and slingers fits the office better than the rules audit's alternative, the Vikings' Chieftains, whose anti-cavalry effect would rest on tactics from after 1541 (RULES section 2). Malon is dropped: the word belongs mostly to the later mounted raids of the pampas, and its effect (pass-through damage) had no link to it (rated stretched)."
relevance = "The elected war leader was the Mapuche's only authority above the lof and the institution through which they waged every great war."
contested = "The toqui is documented from post-1541 sources; its pre-Hispanic form is inferred from the stone axes and from the chroniclers' accounts."

[[unique_tech]]
name = "Koyagtun"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Spearman-line and Skirmishers cost -20%"
level = 2
change = "new"
precedent = "Camel Riders, Skirmishers and Spearman-line cost -25% (Byzantines), narrowed and at -20%. No existing unique tech renders the council of a people without a state."
basis = "War and peace were decided in assemblies (koyag, koyagtun) of lonkos and warriors, which also chose the toqui; the communities then took the field at their own cost, with their own weapons and food, since there was no state to pay or arm them (Bengoa 2003; Boccara 1998). Cheaper levy troops render this. The same word later named the parliaments with the Spanish Crown (Quilín, 1641). For a people without a state the Town Center tech represents a community institution (RULES 6.3); its basis is thin, since the assemblies are known from post-1541 sources."
relevance = "Decision by assembly, instead of rule by chiefs, kept Mapuche society without a centre that could be conquered."
contested = "The pre-Hispanic form of the assemblies is inferred from 16th- and 17th-century descriptions."

[tree]
add = []
remove = [
  "Siege Workshop", "Battering Ram", "Capped Ram", "Mangonel", "Onager",
  "Scorpion", "Heavy Scorpion", "Siege Tower", "Trebuchet", "Siege Engineers",
  "Crossbowman",
  "Blast Furnace", "Plate Mail Armor", "Ring Archer Armor",
  "Halberdier",
  "Galleon", "Carrack", "Catapult Galleon", "Siphons", "Carvel Hull",
  "Bombard Tower", "Architecture", "Masonry", "Stone Wall", "Gate",
  "Heavy Plow",
  "Bolas Rider", "Elite Bolas Rider",
]

[tree.basis]
"Siege Workshop" = "The Mapuche built no siege engines; they took Spanish forts by assault, blockade and fire (Tucapel, 1553; the sieges of La Imperial, Villarrica and Osorno after 1599) and captured some Spanish guns (Villagra's artillery at Marihueñu, 1554) without making them a weapon of their own. Removing the workshop removes all its units; the Weichafe line (strong against buildings), Arson and Sappers, and Petards replace them (owner's decision, brief section 6; RULES 6.11 and section 10). The Petard is a 16th-century gunpowder charge, kept unrenamed as the abstraction of assault parties with fire so as not to hide the anachronism (see open questions)."
"Battering Ram" = "Removed with the Siege Workshop: there were no rams and no wheeled vehicles."
"Capped Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Mangonel" = "Removed with the Siege Workshop: no torsion or traction artillery existed in the Americas."
"Onager" = "Removed with the Siege Workshop (see Mangonel)."
"Scorpion" = "Removed with the Siege Workshop: no bolt-throwers existed in the Americas."
"Heavy Scorpion" = "Removed with the Siege Workshop (see Scorpion)."
"Siege Tower" = "Removed with the Siege Workshop: a wheeled assault tower."
"Trebuchet" = "Counterweight artillery never existed in the Americas."
"Siege Engineers" = "No siege engines are left to improve."
"Crossbowman" = "The crossbow was unknown in the Americas, and nothing suggests the Mapuche adopted captured ones; their missile weapons were bows, slings and, in some accounts, bolas. Archers, Slingers and Skirmishers cover the role. In the current game the Bulgarians also lack crossbows."
"Blast Furnace" = "There was no iron before contact; afterwards the Mapuche obtained it by capture and trade and worked it, but never smelted it. Removed with the other Imperial-Age iron tiers, a playability line rather than a historical one; the lower Blacksmith tiers stay as a generic equipment level (see open questions)."
"Plate Mail Armor" = "There was no plate armour; Mapuche warriors wore hardened hide, represented by the HP bonus. Removed with the Imperial-Age iron tiers; Scale Mail and Chain Mail Armor stay as a generic equipment level."
"Ring Archer Armor" = "Removed with the other Imperial-Age iron tiers, a playability line rather than a historical one (see Blast Furnace)."
"Halberdier" = "Removed as for the other American civs: the halberd is a European polearm, and the Mapuche pike squares against the Spanish horse date from the 1550s (a late element, RULES section 2). The long lance itself is now the Colihue Lancer; Spearman and Pikeman remain."
"Galleon" = "Ocean-going sailing warships were unknown; Mapuche boats were dugout canoes (wampu) and, further south, sewn-plank dalcas."
"Carrack" = "See Galleon."
"Catapult Galleon" = "A sailing ship carrying a catapult: both a European ship type and a siege engine."
"Siphons" = "Removed for its Byzantine name (the fire siphon) and with the Imperial-Age navy cut; the Fire Ship line stays as a generic abstraction for water maps. The Mapuche were the only American civ with this tech."
"Carvel Hull" = "Removed with the Imperial-Age navy cut: flush planking on a frame is a European technique. Clinker Construction stays as the generic lower tier; the Mapuche had dugout canoes, and the sewn-plank dalca belongs to Chiloé and the Chono."
"Bombard Tower" = "Gunpowder towers have no Mapuche basis: arquebuses captured from the Spaniards appear at Quiapo (1558) in an unsuccessful defence, and artillery use is uncertain (tech-tree audit: stretched)."
"Architecture" = "The Mapuche built in wood, cane and thatch (the ruka) and raised earthwork forts, not stone buildings."
"Masonry" = "See Architecture; in the current game the Aztecs, Byzantines and Tupi also lack Masonry."
"Stone Wall" = "Mapuche defences were earthworks, ditches and palisades; stone walls are removed (in the current game the Cumans and Goths also lack them) and Palisade Walls remain."
"Gate" = "Removed with the Stone Wall; the Palisade Gate remains."
"Heavy Plow" = "There was no plough before contact: ploughing with hueque is reported from Spilbergen's expedition at Mocha Island in 1615, as retold by Molina, after contact. With no equivalent for the function the tech is removed; Raised Fields keep the Mapuche's own farming technique."
"Bolas Rider" = "Removed with the dropped unique unit (see [[dropped]])."
"Elite Bolas Rider" = "Removed with the Bolas Rider."

[[rename]]
from = "Champi Scout"
to = "Weichafe Scout"
level = 1
basis = "Weichafe is the Mapudungun word for warrior. Champi, the Quechua name of the Andean mace, is foreign to the Mapuche, whose clubs were of wood and whose stone axe (toki) was the war leader's insignia."

[[rename]]
from = "Champi Runner"
to = "Weichafe Runner"
level = 1
basis = "Same rename as Champi Scout."

[[rename]]
from = "Champi Warrior"
to = "Weichafe"
level = 1
basis = "Same rename as Champi Scout."

[[rename]]
from = "Elite Champi Warrior"
to = "Elite Weichafe"
level = 1
basis = "Same rename as Champi Scout."

[[rename]]
from = "Kamayuk"
to = "Colihue Lancer"
level = 1
basis = "The Mapuche unique unit on the Kamayuk model (see there), named after the colihue cane of its lance; the Inca keep the model as the Awqa Kamayuq."

[[rename]]
from = "Elite Kamayuk"
to = "Elite Colihue Lancer"
level = 1
basis = "Elite tier of the renamed unit."

[[rename]]
from = "Horse Collar"
to = "Raised Fields"
level = 1
basis = "There were no draft animals. Raised cultivation platforms in the wetlands of the Purén and Lumaco valleys, in use at least from AD 1000 to 1500 (Dillehay et al. 2007) and dated at the sites PU-165 and LU-69 to about 1220–1420 by later botanical studies of Dillehay's team, belong to the same landscape as the kuel ceremonial mounds. Same rename as for the Maya and the Muisca."

[architecture]
set = "South American"
level = 1
change = "kept"
basis = "The South American set fits best among the existing ones; a set of rukas and earthwork pucarás would be N3."

[[dropped]]
item = "Mounted Units generate +3 gold when defeating military units"
kind = "bonus"
reason = "Raiding for cattle, horses and iron belongs to the decades after contact: a late element (RULES section 2), and the civ's one allowed late element is the Kona itself. The horse-capture idea is kept for N2."

[[dropped]]
item = "Bolas Rider"
kind = "unique_unit"
reason = "A late element (RULES section 2) beyond the one allowed (the Kona): mounted bola-throwers belong to the pampas of the 17th–19th centuries, and whether bolas were used in Chile in the 16th century at all is contested (Latcham 1929; Rex González 1953). The counter-cavalry role passes to the Colihue Lancer and the Spearman-line."

[[dropped]]
item = "Butalmapu"
kind = "unique_tech"
reason = "The futalmapu (‘great lands’), the regional alliances that dealt with the Crown in parliaments, are documented mainly in the 17th–18th centuries and may be partly a product of the colonial relationship (Boccara): a late element beyond the one allowed (RULES section 2), whose effect also named the dropped Bolas Rider. The alliance theme passes to the team bonus (ayllarewe)."
