civ = "Mapuche"
name = "Mapuche"
status = "reviewed"
label = "Infantry and Counter-Units civilization"
summary = "The Mapuche (1100–1598), recentred on their pre-Hispanic world: colihue lancers, the toqui, the assemblies, dispersed homesteads and machi healers replace the post-1541 cavalry kit, which survives only as the Kona in the Imperial Age, and siege engines, crossbows and stone building are removed."
ideas = [
  "N3: Infantry unique units of their own (a colihue pikeman, a bola and lasso thrower on foot) instead of the shared Kamayuk model.",
  "N3: A pucará (earth-and-timber fort) replacing the Castle until the Imperial Age and training the Colihue Lancer and the Spearman-line (analysis proposal).",
  "N2: Pucarás with staked pits that slow enemy cavalry (Peteroa 1556, Quiapo 1558).",
  "N2: Horse capture: each enemy mounted unit killed lowers the cost of the next Kona (the first Mapuche horses were captured from the Spaniards).",
  "N3: Herds of hueque (the chilihueque camelid), used for wool, in ritual and as bride wealth, as livestock or a pack animal; their pack use is uncertain, which is why the Mule Cart is not given (it stays with its four holders, RULES 6.16.7).",
  "N3: Re-theme the Monk as the machi, and add the kuel ceremonial mounds of Purén–Lumaco as a monument.",
  "N3: Parliaments with the Crown (the koyagtun of Quilín, 1641) as a diplomatic mechanic.",
  "N2: The Arauco War content that the late-element rule leaves out (Lautaro's relieving squadrons at Tucapel, 1553; the futalmapu alliances; mounted raiding for cattle and horses), kept as ideas outside the civ's one late element, the Kona.",
  "N2: A bow line split from the Crossbowman (RULES section 10), so the Mapuche Archer can improve without crossbows.",
  "N3: Assault mechanics (firing palisades and thatch, scaling parties instead of the Petard) as the American alternative to siege engines (RULES section 10); the Mapuche took Spanish forts by assault and fire from Tucapel (1553) on.",
]
contested = [
  "Ethnogenesis and ethnonym: a shift from ‘reche’ to ‘mapuche’ under colonial pressure (Boccara) or long continuity (Bengoa, Dillehay); whether the El Vergel complex (c. 1100–1450) leads continuously to the Reche of the 16th century is part of the same debate.",
  "The real extent of Inca rule south of the Maipo and the historicity, date and outcome of the battle of the Maule, known mainly from Garcilaso, who names the Purumaucas (Promaucaes), Antalli, Pincu and Cauqui as the Inca's opponents; Silva (1983) doubts that it halted the Inca advance.",
  "Pre-Hispanic Mapuche warfare and institutions (the toqui, the assemblies, the ayllarewe, the long lance) are known almost only from sources written after 1541; their pre-Hispanic form is inferred.",
  "Whether bolas were used in Chile in the 16th century at all (Latcham 1929; Rex González 1953, who held that the Araucanians, later constant bola users on the pampas, did not know them in Chile at the conquest); the mounted bola belongs to the pampas and their later araucanisation.",
  "The periodisation of the Arauco War: open war c. 1550–1656, then a frontier of trade and parliaments until the occupation of Araucanía (1861–1883).",
  "Lautaro between history and epic (Ercilla, La Araucana).",
  "The pre-Hispanic population of Araucanía.",
  "Generic economy items without a Mapuche equivalent keep their names as flagged abstractions (RULES 6.16.6): Wheelbarrow, Hand Cart and the Trade Cart, since there were no wheeled vehicles before contact and the hueque's use as a pack animal is uncertain (ideas); Heavy Plow and Crop Rotation (see Raised Fields); Treadmill Crane, as an abstraction of faster building, since there were no cranes or treadwheels and the Mapuche built in wood, cane and thatch (see Architecture); and Coinage and Banking, since the Mapuche had no money before contact. The Blacksmith tiers are flagged in the HP bonus.",
]
open_questions = []

[profile]
entity = "The Mapuche (called reche in 16th-century sources, ‘Araucanians’ by the Spaniards)"
region = "South-central Chile between the Itata/Biobío and Toltén rivers"
window = "1100–1598 (the core is the pre-Hispanic Reche world, c. 1100–1500, from the El Vergel complex on, as the chroniclers of 1541–1598 describe it; after 1541 the window reaches Curalaba only through the Kona, the one late element)"
replaces = "The game's Mapuche of the Arauco War after 1541: cavalry, the Bolas Rider, Butalmapu, raiding gold and Lautaro's knowledge of the Spanish forts"
sources = [
  "Jerónimo de Vivar, Crónica y relación copiosa y verdadera de los reinos de Chile (1558)",
  "Alonso de Ercilla, La Araucana (1569–1589)",
  "Alonso de Góngora Marmolejo, Historia de todas las cosas que han acaecido en el reino de Chile (1575)",
  "Pedro Mariño de Lobera, Crónica del Reino de Chile (c. 1595)",
  "Inca Garcilaso de la Vega, Comentarios Reales (1609)",
  "Diego de Rosales, Historia general del Reino de Chile (c. 1674)",
  "Francisco Núñez de Pineda y Bascuñán, Cautiverio feliz (1673)",
  "Osvaldo Silva Galdames, ‘¿Detuvo la batalla del Maule la expansión inca hacia el sur de Chile?’, Cuadernos de Historia 3 (1983)",
  "José Bengoa, Historia del pueblo mapuche (1985); Historia de los antiguos mapuches del sur (2003)",
  "Guillaume Boccara, Guerre et ethnogenèse mapuche dans le Chili colonial (1998)",
  "Tom D. Dillehay, Monuments, Empires, and Resistance (2007)",
  "Tom D. Dillehay et al., ‘Cultivated wetlands and emerging complexity in south-central Chile and long distance effects of climate change’, Antiquity 81 (2007)",
  "Ana Mariella Bacigalupo, Shamans of the Foye Tree (2007)",
]

[[bonus]]
text = "Foragers drop off +25% food"
kind = "economic"
level = 1
change = "kept"
precedent = "Foragers drop off +25% food (Mapuche)"
basis = "Gathering was a large part of a mixed economy: araucaria pine nuts (piñones) from the forests of the Nahuelbuta range and the Andes, wild fruits, and shellfish on the coast, alongside the cultivation of potato, maize, quinoa, beans and madi (Bengoa 2003; Dillehay 2007)."
relevance = "Gathering, of araucaria nuts in the forests and of shellfish on the coast, was a pillar of the pre-Hispanic Mapuche economy beside horticulture."

[[bonus]]
text = "Settlements can train Spearman-line and Skirmishers"
kind = "military"
level = 1
change = "kept"
precedent = "Settlements can train Spearman-line and Skirmishers (Mapuche)"
basis = "Mobilisation was decentralised: each lof or rewe sent its own warriors (weichafe) under its lonko, with no standing army or barracks (Bengoa; Boccara)."
relevance = "Every lof raised its own warriors under its lonko: the community was the unit of Mapuche mobilisation."

[[bonus]]
text = "Infantry, Slingers and Skirmishers +5/10/15 HP in Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Infantry, Slingers and Skirmishers +5/10/15 HP in Feudal/Castle/Imperial Age (Mapuche)"
basis = "The chroniclers and Ercilla stress the endurance of Mapuche warriors, who also fought in cuirasses and helmets of hardened hide (Vivar; Góngora Marmolejo)."
relevance = "Endurance and hide armour are the traits every chronicler of Mapuche warfare stresses."
contested = "Hide armour is attested from 1550 (Vivar) and in Góngora Marmolejo (1575); whether it predates contact is not known, so endurance carries the pre-Hispanic side of the bonus. For the same reason the hide cuirasses do not rename an armour tier: the Blacksmith tiers (Forging, Iron Casting, Blast Furnace, Bodkin Arrow, Scale Mail, Chain Mail and Plate Mail Armor, Ring Archer Armor) keep their generic names as a flagged generic equipment level (RULES 6.16.6), since there was no iron or metal armour before contact (afterwards the Mapuche obtained iron by capture and trade and worked it, but never smelted it), and Chemistry stays for its +1 ranged attack as a flagged abstraction."

[[bonus]]
text = "Settlements cost -33%"
kind = "economic"
level = 1
change = "new"
replaces = "Enemy Castles are revealed on the map"
precedent = "Settlements cost -33% and heal nearby units (Muisca), the cost half"
basis = "The Mapuche lived in dispersed homesteads of kin groups (lof) under their lonko, without towns, capitals or permanent rulers, so there was no centre whose capture could end a war, and they could not be conquered by ‘decapitation’ as the Inca and Aztec states were (Bengoa 2003; Boccara 1998). Cheap, dispersed Settlements render this landscape. The bonus it replaces rested on one man's knowledge (Lautaro had served Valdivia as a groom) and on events after 1541 (Curalaba, 1598): an anecdote (RULES 6.9) and a late element (RULES section 2)."
relevance = "Dispersed homesteads left no centre to conquer; decentralisation is a leading explanation of the Mapuche's resistance to the Inca and to the Spanish conquest (Silva 1983; Bengoa 2003)."

[[bonus]]
text = "Monks heal +100% faster"
kind = "other"
level = 1
change = "new"
precedent = "Monks heal +100% faster (Byzantines team bonus)"
basis = "The machi, men and women, healed the sick with plants and with the machitun ceremony and officiated at the rewe, the machi's carved, stepped altar-post; colonial writers describe many male machi, some of them cross-gendered (weye), and the predominance of women is modern (Rosales; Núñez de Pineda, 1673; Bacigalupo 2007). Healing monks render the machi as healers."
relevance = "The machi is the central religious figure of Mapuche society, as healer and officiant, from the first sources to the present."
contested = "Most descriptions of the machi are from the 17th century onwards; the pre-Hispanic institution is inferred."

[team_bonus]
text = "Spearman-line and Skirmishers train +25% faster"
level = 1
change = "new"
replaces = "Spearman-line and Skirmishers +2 line of sight"
precedent = "Conscription (Military buildings, except Siege Workshops, work +33% faster), narrowed to the Spearman-line and Skirmishers at +25%; the same training-speed form as the Magyars' and Gurjaras' team bonuses (Mounted Archers, and Camel and Elephant Units, train +25% faster)"
basis = "Neighbouring peoples fought together against the Inca armies: by Garcilaso's account (book VII), the Purumaucas (Promaucaes) and their southern neighbours, the Antalli, Pincu and Cauqui, met the Inca on the Maule in a hard-fought battle that halted the Inca advance. These were Mapudungun-speaking peoples between the Cachapoal and the Itata, north of the Reche core, and the battle is contested (Silva 1983). Alliance stayed the Mapuche way of fielding large armies: later sources describe the ayllarewe (‘nine rewe’, groups of lof sharing a ritual centre) sending warriors to each other's wars under a common toqui (Rosales; Bengoa 2003). Faster training of the levy troops renders the warriors that allies sent. RULES 6.2: alliances. The lof and rewe were autonomous polities under no common ruler, so their alliances are alliances between independent allies (RULES 6.16.14), as were those with the neighbouring Mapudungun-speaking peoples. The line-of-sight bonus it replaces had no specific basis (rated unfounded)."
relevance = "Alliance among autonomous lof and rewe, under a toqui chosen for the campaign, was how the Mapuche fielded large armies, a practice the later sources describe and whose earlier form is inferred; by Garcilaso's contested account their Mapudungun-speaking northern neighbours had already met the Inca on the Maule in the same way."
contested = "The pre-Hispanic basis of any Mapuche team bonus is weak: the Maule battle is known mainly from Garcilaso (1609), and its date, scale and outcome are doubted (Silva 1983); Reche participation is not attested; the ayllarewe are documented from the late 16th and the 17th centuries (Rosales), their earlier form being inferred. The alliances of the colonial wars themselves (Lautaro's campaigns from 1553, the futalmapu) are post-1500, so they illustrate the practice but do not carry this always-on team bonus (RULES section 2), as in the Tupi design."

[[unique_unit]]
name = "Colihue Lancer"
model = "Kamayuk"
building = "Castle"
level = 1
change = "new"
basis = "The long lance of colihue cane was the main Mapuche weapon when the Spaniards arrived: the early chroniclers describe lances of great length and squadrons of pikemen from the first battles (Vivar, 1558; Góngora Marmolejo, 1575). The weapon is older than the contact, so it originated inside the time frame (RULES section 2); only its use in dense squares against horses dates from the 1550s. The Inca Kamayuk, a spearman with long reach, is the nearest existing unit (shared with the Inca and with the Berbers' and Ethiopians' designs). Decision: the model is kept until N3 infantry units of the Mapuche's own exist (ideas); shared models are accepted in N1 (RULES 6.16.12)."
relevance = "The lance was the Mapuche weapon par excellence, and lance squadrons were the backbone of their armies."
contested = "The pre-Hispanic length of the lance and its tactics are not documented; the counter-cavalry role of the model is a game abstraction."

[[unique_unit]]
name = "Kona"
model = "Kona"
building = "Castle"
age = "Imperial"
level = 1
change = "changed"
basis = "Kona were the young warriors in the service of a lonko. As riders they belong to the decades after c. 1560, when the Mapuche, having captured and then bred horses, fielded the cavalry that destroyed the Spaniards at Curalaba (1598). Late element (RULES section 2): it originated after 1500, so it is available at the Castle only from the Imperial Age (age-gated availability, as in the game's Italian team bonus ‘Condottiero available at the Barracks in Imperial Age’), and it is the civ's only civ-specific post-1500 element; generic post-1500 items held by most civs, such as the Petard and the demolition ships, stay as flagged abstractions and do not count as a late element (RULES 6.16.2). Decision (a historical call, RULES section 11): the pre-Hispanic recentring of the civ stands, with the Kona as its one late element; the Mapuche are not exempted from RULES section 2, and Lautaro's tactics at Tucapel (1553) and the other Arauco War content stay N2 ideas. With the cavalry an Imperial-Age late element, the label becomes ‘Infantry and Counter-Units civilization’, one of the game's categories (RULES 6.16.16)."
relevance = "The horse changed the course of Mapuche history: mounted war won Curalaba and held the Biobío frontier for three centuries, and the Mapuche horseman is the best-known image of their resistance (clear fame)."
contested = "Kona meant a young warrior or dependant rather than a formal elite."

[[unique_tech]]
name = "Toqui"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Weichafe and Slingers attack +25% faster"
level = 1
change = "new"
replaces = "Malon"
precedent = "Caciques (Tupi: Champi Warriors and Slingers attack +25% faster): an existing Castle Age unique tech, which the Tupi design replaces with Morubixaba, passed to the Mapuche and renamed with an identical effect and age, since the Champi Warriors are the Mapuche Weichafe"
basis = "In war the Mapuche chose a war leader, the toqui, named after the polished stone axe (toki) that was his insignia, who led the warriors of the allied lof for the length of a campaign; Lautaro and Caupolicán held the office (Rosales; Bengoa 2003). Clubs and slings were among the weapons of the weichafe. The effect abstracts the toqui's command of the raiding levies of clubmen and slingers; the Colihue Lancers are left out because the tech keeps the existing Caciques effect unchanged, which keeps it at level 1, and the lancers have their own unit role. Malon is dropped: the word belongs mostly to the later mounted raids of the pampas, and its effect (pass-through damage) had no link to it (rated stretched)."
relevance = "The elected war leader was the Mapuche's only authority above the lof and the institution through which they waged every great war."
contested = "The toqui is documented from post-1541 sources; its pre-Hispanic form is inferred from the stone axes and from the chroniclers' accounts."

[[unique_tech]]
name = "Koyagtun"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Spearman-line and Skirmishers cost -20%"
level = 2
change = "new"
precedent = "Camel Riders, Skirmishers and Spearman-line cost -25% (Byzantines), narrowed and at -20%. No existing unique tech renders the council of a people without a state."
basis = "War and peace were decided in assemblies (koyag, koyagtun) of lonkos and warriors, which also chose the toqui; the communities then took the field at their own cost, with their own weapons and food, since there was no state to pay or arm them (Bengoa 2003; Boccara 1998). Cheaper levy troops render this. The same word later named the parliaments with the Spanish Crown (Quilín, 1641). For a people without a state the Town Center tech represents a community institution (RULES 6.3); its basis is thin, since the assemblies are known from post-1541 sources."
relevance = "The assemblies decided war and peace, chose the toqui and raised the self-financed levies; the same institution later made the parliaments that fixed the Biobío frontier with the Spaniards."
contested = "The pre-Hispanic form of the assemblies is inferred from 16th- and 17th-century descriptions."

[tree]
add = ["Traction Trebuchet"]
remove = [
  "Battering Ram", "Capped Ram", "Mangonel", "Onager",
  "Scorpion", "Heavy Scorpion", "Siege Tower", "Trebuchet", "Siege Engineers",
  "Crossbowman",
  "Halberdier",
  "Galleon", "Carrack", "Catapult Galleon", "Fast Fire Ship", "Galleon, Fast Fire Ship and Carrack", "Siphons",
  "Bombard Tower", "Architecture", "Masonry", "Stone Wall", "Gate",
  "Bolas Rider", "Elite Bolas Rider",
]

[tree.basis]
"Traction Trebuchet" = "Game convention (RULES 6.16.5, the heavy-engine floor; owner’s decision of 20 October 2026), not a historical claim: no siege engine of any kind existed in the pre-contact Americas (see the Trebuchet). Every civ keeps one heavy engine so that it can answer an enemy’s trebuchets, and the traction trebuchet, a man-powered engine known across Eurasia and North Africa from the late 6th century, is the oldest and most widespread of the three heavy engines, so the least anachronistic choice. The Siege Workshop stays in the tree for this engine alone. For its other units the design’s reading stands: The Mapuche built no siege engines; they took Spanish forts by assault, blockade and fire (Tucapel, 1553; the sieges of La Imperial, Villarrica and Osorno after 1599) and captured some Spanish guns (Villagra's artillery at Marihueñu, 1554) without making them a weapon of their own. The Weichafe line (strong against buildings), Arson, Sappers and Petards replace them (owner's decision, RULES 6.16.5; RULES 6.11 and section 10). Before the heavy-engine floor every Castle had to be taken by units standing in its arrow fire; the Traction Trebuchet now does it from range, as a game convention, until an N2/N3 assault unit exists (ideas), with no compensating bonus (RULES 6.16.13). The Petard, a 16th-century gunpowder charge, stays unrenamed as a flagged generic abstraction of assault parties with fire, outside the one-late-element limit (RULES 6.16.2)."
"Battering Ram" = "Removed with the Siege Workshop: there were no rams and no wheeled vehicles."
"Capped Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Mangonel" = "Removed with the Siege Workshop: no torsion or traction artillery existed in the Americas."
"Onager" = "Removed with the Siege Workshop (see Mangonel)."
"Scorpion" = "Removed with the Siege Workshop: no bolt-throwers existed in the Americas."
"Heavy Scorpion" = "Removed with the Siege Workshop (see Scorpion)."
"Siege Tower" = "Removed with the Siege Workshop: a wheeled assault tower."
"Trebuchet" = "Counterweight artillery never existed in the Americas."
"Siege Engineers" = "No siege engines are left to improve."
"Crossbowman" = "The crossbow was unknown in the Americas, which have neither crossbow tier (RULES 6.16.3), and nothing suggests the Mapuche adopted captured ones; their missile weapons were bows, slings and, in some accounts, bolas. Archers, Slingers and Skirmishers cover the role. In the current game the Bulgarians also lack crossbows."
"Halberdier" = "Removed under the codex convention for the American civs (RULES 6.16.6, the owner's decision on their power budget): a playability line, not a historical one, since the kept Pikeman bears as European a name; the American spear line stops at the Pikeman, as the game already does for the Aztecs and Muisca. The long lance itself is the Colihue Lancer, and Spearman and Pikeman remain."
"Galleon" = "Ocean-going sailing warships were unknown; Mapuche boats were dugout canoes (wampu) and, further south, sewn-plank dalcas, and no Mapuche war fleet is documented. Basic navy (RULES 6.16.1), since the Mapuche had no war fleet of their own: the galleys (renamed Canoe), fire ships, the Hulk line, the demolition ships and the generic Dock techs stay as an abstraction for water maps, without the Galleon, Carrack, Fast Fire Ship or a siege warship; the demolition ships are generic post-1500 items kept as flagged abstractions (RULES 6.16.2)."
"Carrack" = "See Galleon."
"Fast Fire Ship" = "Removed under the basic navy (see Galleon); the Fire Ship stays."
"Galleon, Fast Fire Ship and Carrack" = "With the Galleon, Fast Fire Ship and Carrack removed, this upgrade has nothing left to upgrade."
"Catapult Galleon" = "A sailing ship carrying a catapult: both a European ship type and a siege engine."
"Siphons" = "Removed for its Byzantine name and concept (the siphon that projected Greek fire), which has no American equivalent; the Mapuche were the only American civ with it. The Fire Ship line stays as a generic abstraction for water maps."
"Bombard Tower" = "Gunpowder towers have no Mapuche basis: arquebuses captured from the Spaniards appear at Quiapo (1558) in an unsuccessful defence, and artillery use is uncertain (tech-tree audit: stretched)."
"Architecture" = "The Mapuche built in wood, cane and thatch (the ruka) and raised earthwork forts, not stone buildings. The Castle itself stays for structural reasons (it trains the unique units, researches the Castle tech and is needed for the Imperial Age) until an N3 pucará replaces it (ideas)."
"Masonry" = "See Architecture; in the current game the Aztecs, Byzantines and Tupi also lack Masonry (the Aztecs' design adds it)."
"Stone Wall" = "Mapuche defences were earthworks, ditches and palisades; stone walls are removed (in the current game the Cumans and Goths also lack them; the Goths' design adds them) and Palisade Walls remain."
"Gate" = "Removed with the Stone Wall; the Palisade Gate remains."
"Bolas Rider" = "Removed with the dropped unique unit (see [[dropped]])."
"Elite Bolas Rider" = "Removed with the Bolas Rider."

[[rename]]
from = "Champi Scout"
to = "Weichafe Scout"
level = 1
basis = "Weichafe is the Mapudungun word for warrior. Champi, the Quechua name of the Andean mace, is foreign to the Mapuche, whose clubs were of wood and whose stone axe (toki) was the war leader's insignia."

[[rename]]
from = "Champi Runner"
to = "Weichafe Runner"
level = 1
basis = "Same rename as Champi Scout."

[[rename]]
from = "Champi Warrior"
to = "Weichafe"
level = 1
basis = "Same rename as Champi Scout."

[[rename]]
from = "Elite Champi Warrior"
to = "Elite Weichafe"
level = 1
basis = "Same rename as Champi Scout."

[[rename]]
from = "Kamayuk"
to = "Colihue Lancer"
level = 1
basis = "The Mapuche unique unit on the Kamayuk model (see there), named after the colihue cane of its lance; the Inca keep the model as the Awqa Kamayuq."

[[rename]]
from = "Elite Kamayuk"
to = "Elite Colihue Lancer"
level = 1
basis = "Elite tier of the renamed unit."

[[rename]]
from = "Horse Collar"
to = "Raised Fields"
level = 1
basis = "There were no draft animals. Raised cultivation platforms in the wetlands of the Purén and Lumaco valleys, in use at least from AD 1000 to 1500 (Dillehay et al. 2007) and dated at the sites PU-165 and LU-69 to about 1220–1420 by later botanical studies of Dillehay's team, belong to the same landscape as the kuel ceremonial mounds. Same rename as for the Maya and the Muisca. Heavy Plow (there was no plough before contact: ploughing with hueque is reported from Spilbergen's expedition at Mocha Island in 1615, as retold by Molina) and Crop Rotation keep their generic names as flagged abstractions (RULES 6.16.6; see the civ-level note on generic economy items)."

[[rename]]
from = "Galley"
to = "Canoe"
model = "Canoe"
level = 1
basis = "Mapuche boats on the coast, the rivers and the lakes were dugout canoes (wampu), with the sewn-plank dalca further south (see the Galleon note). The Scenario Editor Canoe, a small warship introduced in The Forgotten (RULES section 5), gives the Galley the look of a dugout; the Galley keeps its stats, and the Canoe's look, scale, attack and role must be checked in game. The rename renders the vessel type the Mapuche had, not a documented war fleet: they are in the basic navy (see Galleon). Same rename as for the Aztecs, Maya and Tupi, and outside the Americas in the Malians' and Avars' designs."

[[rename]]
from = "War Galley"
to = "War Canoe"
model = "Canoe"
level = 1
basis = "Upgrade tier of the renamed Galley, with the same Canoe look (see Galley)."

[architecture]
set = "South American"
level = 1
change = "kept"
basis = "The South American set fits best among the existing ones; a set of rukas and earthwork pucarás would be N3."

[[dropped]]
item = "Mounted Units generate +3 gold when defeating military units"
kind = "bonus"
reason = "Raiding for cattle, horses and iron belongs to the decades after contact: a late element (RULES section 2), and the civ's one allowed late element is the Kona itself. The horse-capture idea is kept for N2. Its effect now serves the Cumans' design as a passive bonus, for captives and ransom."

[[dropped]]
item = "Bolas Rider"
kind = "unique_unit"
reason = "A late element (RULES section 2) beyond the one allowed (the Kona): mounted bola-throwers belong to the pampas of the 17th–19th centuries, and whether bolas were used in Chile in the 16th century at all is contested (Latcham 1929; Rex González 1953). The counter-cavalry role passes to the Colihue Lancer and the Spearman-line."

[[dropped]]
item = "Butalmapu"
kind = "unique_tech"
reason = "The futalmapu (‘great lands’), the regional alliances that dealt with the Crown in parliaments, are documented mainly in the 17th–18th centuries and may be partly a product of the colonial relationship (Boccara): a late element beyond the one allowed (RULES section 2), whose effect also named the dropped Bolas Rider. The alliance theme passes to the team bonus (alliances of neighbouring peoples and communities)."
