]

[[bonus]]
text = "Town Centers spawn 2 Villagers when the next Age is reached"
kind = "economic"
level = 1
change = "kept"
precedent = "Town Centers spawn 2 Villagers when the next Age is reached (Bengalis)"
basis = "The fertile, densely peopled delta and its rice surplus: Ibn Battuta (1346) says he never saw a land where provisions were so cheap, and Ma Huan (1433) reports two rice harvests a year. The agrarian frontier of the eastern delta that Eaton (1993) traces opened under the Sultanate but expanded mainly under the Mughals, after the window. An abstraction, kept."
relevance = "The rice surplus of a dense population was the base of Bengal's wealth and armies from the Palas to the sultans."

[[bonus]]
text = "Elephant Units receive -25% bonus damage and are more resistant to conversion"
kind = "military"
level = 1
change = "kept"
precedent = "Elephant Units receive -25% bonus damage and are more resistant to conversion (Bengalis)"
basis = "Elephants were the prestige arm of Bengal from the Palas to the sultans: the Akhbar (851) gives the king of ‘Rahma’, usually taken to be the Pala ruler, some 50,000 elephants (an inflated but telling figure), and Bengal remained a main source of elephants for the Delhi sultans (Digby 1971; Trautmann 2015). The resistance to conversion is pure mechanics."
relevance = "Elephants were the striking and prestige arm of Bengal's armies from the Palas to the sultans."

[[bonus]]
text = "Ships regenerate 15 HP per minute"
kind = "military"
level = 1
change = "kept"
precedent = "Ships regenerate 15 HP per minute (Bengalis)"
basis = "War on the delta was fought on the rivers: Devapala's Monghyr plate describes the royal fleet of boats on the Ganges by his camp, the Sultanate kept river flotillas (Banglapedia, ‘Military’), and Babur met Bengali boats on the Ghaghra in 1529. Easy repair in boatyards such as Sonargaon and Chittagong is a fair abstraction."
relevance = "In the delta armies and trade moved by river; from the Pala camps to the Ghaghra, Bengal's wars turned on boats."

[[bonus]]
text = "Farmers slowly generate gold in addition to food starting in Castle Age"
kind = "economic"
level = 1
change = "new"
replaces = "Cavalry +2 attack vs. Skirmishers"
precedent = "Burgundian Vineyards (Farmers slowly generate gold in addition to food) (Burgundians), as a passive from the Castle Age, the age in which the Burgundians research it"
basis = "Farmers earning gold render Bengal's cash crops and money economy: cotton and sugarcane grew beside the rice, Ma Huan (1433) saw sugar and many kinds of fine cloth made in Bengal, and silver tankas and cowries circulated down to the village markets (Ibn Battuta; Eaton 1993). The cloth itself was the work of specialist weavers, which no existing effect renders, and its fame lasted the whole window: the Akhbar (851) says the garments of ‘Rahma’ were so fine that one could be drawn through a ring, and Tomé Pires and Duarte Barbosa (1510s) make Bengali cloth a staple of Malacca and of the western Indian Ocean. The cavalry bonus it replaces had no basis: Bengal was notoriously poor in horses, which it imported, and Bakhtiyar Khalji took Nadia c. 1204 by surprise with a small cavalry vanguard (Minhaj)."
relevance = "Cotton and sugarcane for the cloth and sugar trade, and a money economy reaching the villages, made Bengal a byword for wealth among Arab, Chinese and Portuguese visitors."
contested = "The scale of the cloth and sugar trade is better documented for the 15th–16th centuries and for the Mughal period than for the Palas."

[[bonus]]
text = "University technologies cost -25%"
kind = "other"
level = 1
change = "new"
replaces = "Monks +3 melee/+3 pierce armor"
precedent = "Dock and University technologies cost -25% (Italians), narrowed to University technologies, as in the Germans' Gutenberg's Press"
basis = "Bengal was a centre of learning and letters throughout the window. The Palas patronised the great monastic universities: Dharmapala founded Vikramashila and Somapura, and Nalanda, Odantapuri and Jagaddala drew students from Tibet and Southeast Asia; Devapala's Nalanda copper plate (mid-9th century) records a monastery at Nalanda built by the Shailendra king Balaputradeva of Suvarnadvipa, which Devapala endowed with villages at his request. Under the Sultanate the courts patronised literature in Bengali: Barbak Shah gave Maladhar Basu, who rendered the Bhagavata into Bengali (Sri Krishna Vijaya, 1473–80), the title Gunaraj Khan, and Paragal Khan, Husain Shah's governor of Chittagong, commissioned Kavindra Parameshvara's Bengali Mahabharata (Sukumar Sen 1960; Sarkar (ed.) 1948). The armour bonus it replaces suggested armoured monks, the opposite of what happened: the mahaviharas were sacked around 1200 (Odantapuri, Vikramashila)."
relevance = "The Pala mahaviharas made Bengal and Bihar the last great centre of Indian Buddhist learning, and the sultans' courts fostered the rise of Bengali literature."

[team_bonus]
text = "Trade Units generate +10% food in addition to gold"
level = 1
change = "kept"
precedent = "Trade Units generate +10% food in addition to gold (Bengalis team bonus)"
basis = "Bengal fed its trading partners: the Maldivians sold their cowries to Bengal for its rice (Ibn Battuta, 1340s), Ma Huan (1433) describes the abundance of its crops, and Tomé Pires and Duarte Barbosa (1510s) describe ships carrying Bengal's rice to Malacca and the western Indian Ocean. A good translation of a food-surplus economy tied to trade; Bengal's cloth and sugar belong to the farmers' gold passive."
relevance = "Bengal's rice fed the Maldives and Malacca: a benefit to its trading partners, as RULES 6.2 requires."

[[unique_unit]]
name = "Paik"
model = "Rattan Archer"
building = "Castle"
level = 1
change = "new"
replaces = "Ratha (Mounted Archer)"
basis = "Paik (from Sanskrit padatika, merged with Persian payk) was the foot soldier of Bengal and Orissa, armed with bow, sword, shield and spear and later the matchlock, and the backbone of the Sultanate's armies and of the later Baro-Bhuyans (Banglapedia, ‘Paik’ and ‘Military’; Sarkar (ed.) 1948). Besides the levies the sultans kept a palace guard of paiks: it killed Jalaluddin Fath Shah in 1487, opening the Habshi period, and Alauddin Husain Shah (1494–1519) disbanded it (Riyaz-us-Salatin; Sarkar (ed.) 1948). Most paiks were archers, so the model is the Rattan Archer, a shielded foot archer; the first draft's spear infantry (the game's Ghulam) goes to the Tamils' Velaikkarar."
relevance = "Bengal's armies were infantry, boats and elephants rather than cavalry, and the paik was their backbone for centuries."
contested = "Most paiks were part-time peasant levies beside the elite palace guard; the borrowed model and its Vietnamese art are placeholders (see ideas)."

[[unique_tech]]
name = "Shah-i-Bangalah"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Town Centers +100% HP and work +10% faster"
level = 2
change = "new"
precedent = "Town Centers and Docks +100% HP and work +5/10/15/20% faster in Dark/Feudal/Castle/Imperial Age (Persians), narrowed to Town Centers with the work rate at its Feudal Age value (+10%), as in the Armenians' (Bagratid Ani) and Bohemians' (Nové Město) drafts; the Maya's draft (K'uhul Ajaw) uses the Castle Age rate (+15%). A new tech (level 2): neither of the civ's other techs is a state institution, and no existing tech renders the founding of a kingdom."
basis = "By 1352 Shamsuddin Ilyas Shah had united Lakhnauti, Satgaon and Sonargaon under one ruler, and Delhi chroniclers called him Shah-i-Bangalah, ‘king of Bengal’ (Shams Siraj Afif); the name Bangalah, until then that of the eastern delta, came to mean the whole region (Eaton 1993, ch. 2). The new kingdom held out twice in the fort of Ekdala against Firuz Shah Tughluq (1353–54, 1358–59), which secured nearly two centuries of independence, and built a new capital at Pandua, whose Adina mosque (1373–75) was the largest in the subcontinent. Sturdier, busier Town Centers render a united kingdom that held its centres."
relevance = "The union of 1352 made Bengal one kingdom and gave it the name the civ bears."
contested = "How far ‘Bangalah’ reached before Ilyas Shah is debated, and the epithet is attested on the Delhi side rather than on his coins, which carry the ordinary sultanic titles; the effect is an abstraction."

[[unique_tech]]
name = "Hastyayurveda"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Elephant Units regenerate 30 HP per minute"
level = 1
change = "new"
replaces = "Paiks (Rathas and Elephant Units attack +20% faster)"
precedent = "Medical Corps (Elephant Units regenerate 30 HP per minute) (Dravidians): an existing unique tech, moved to the Bengalis and renamed, identical effect and age; the Tamils' draft gives it up"
basis = "In the Indian tradition Bengal and Bihar were the land of the best war elephants: the Arthashastra (2.2) ranks those of Kalinga and Anga first (Trautmann 2015), and the Hastyayurveda, the Sanskrit treatise on elephant medicine attributed to the sage Palakapya, is set at Champa in Anga, near modern Bhagalpur, in the Pala heartland. The Pala kings kept royal herds under their own officers: the stock list of officials in their land grants, from Dharmapala's Khalimpur plate (c. 800) onwards, includes a superintendent of elephants and horses (and of cattle, buffaloes, goats and sheep) (Majumdar (ed.) 1943); the Akhbar (851) credits the king of ‘Rahma’ with some 50,000 elephants, and Lakhnauti later sent elephants to Delhi as tribute (Minhaj; Digby 1971). The tech stands for the keeping and healing of these royal herds, while the elephant passive renders their place in battle and the Hindustanis' elephant passive the Delhi stables that Bengal helped to fill. Moved from the Tamils' former Medical Corps, a 19th-century military name, with the same effect. It replaces Paiks, which named the foot soldier but sped up chariots and elephants; the paik is now the unique unit."
relevance = "Bengal could field elephants in the numbers the Akhbar reports, and supply Delhi with them, only through royal capture, keeping and care: the establishment behind its prestige arm."
contested = "A structural trait promoted to a tech under RULES 6.3, its formalisation being the royal office of the Pala grants; the civ's datable royal and military moments (Dharmapala's Kanyakubja assembly, c. 800; Ramapala's recovery of Varendri, late 11th century; Ekdala, 1353–59) have no fitting existing effect (see open questions). The treatise is hard to date, elephant medicine was a pan-Indian tradition (the Keralan Matangalila is another branch), and the treatise's own link to Bengal rests on its frame story."

[[unique_tech]]
name = "Mahayana"
building = "Monastery"
kind = "civil"
age = "Imperial"
effect = "Villagers and Monks take -10% population space"
level = 1
change = "changed"
precedent = "Mahayana (Villagers and Monks take -10% population space) (Bengalis): moved to the Monastery (religion, RULES 6.2), identical effect and age. It stays in the Imperial Age, its game age, although the Pala centuries come before the Castle Age Shah-i-Bangalah (1352): RULES 6.4 orders ages only between two Castle techs."
basis = "The Palas, who styled themselves paramasaugata (‘devout Buddhists’), were the last great royal patrons of Mahayana and Vajrayana Buddhism in India; they endowed monasteries, shrines and images across Bengal and Bihar, and the Vajrayana of their age, carried to Tibet by masters such as Atisha (who left Vikramashila c. 1040), shaped Tibetan Buddhism. The effect is an arbitrary abstraction of a large, cheaply sustained monastic and lay population."
relevance = "Royal patronage of Mahayana and Vajrayana Buddhism defines the Pala centuries and their legacy in Tibet."

[tree]
add = ["Treadmill Crane"]
remove = ["Cannon Galleon", "Elite Cannon Galleon", "Arbalester"]

[tree.basis]
"Treadmill Crane" = "An abstraction of faster building: no treadwheel cranes are attested in Bengal, and the tech stands for the scale of its brick building, from the mahavihara of Somapura, among the largest monasteries of South Asia, to the Adina mosque (1373–75), the largest mosque of the subcontinent in its day. Stone Shaft Mining stays absent, which fits a delta without stone."
"Cannon Galleon" = "No secure evidence of guns on the Sultanate's boats: the gun-armed river flotilla (nawara) is Mughal, of the 17th century. Fire Ships, Demolition Ships and the Galleon line remain the naval answer to buildings."
"Elite Cannon Galleon" = "Same basis."
"Arbalester" = "No crossbows are attested in Pala, Sena or Sultanate armies, whose archers used bamboo bows; in South Asia the crossbow belongs mainly to the hill peoples of the north-east. Under the project's criterion (Armenians, Ethiopians, Malians) the crossbow tier goes and the Crossbowman stays as the generic Castle Age bow upgrade until the N2 bow/crossbow split; the Paik and the Elephant Archer carry the archery."

[[rename]]
from = "Elite Rattan Archer"
to = "Elite Paik"
level = 1
basis = "Follows the unique unit (Rattan Archer → Paik), for the Bengalis only."

[architecture]
set = "South Asian"
change = "kept"
basis = "Kept: the South Asian set is the closest existing one; Bengal's brick and terracotta forms would need N3 art (see ideas)."

[[dropped]]
item = "Ratha"
kind = "unique_unit"
reason = "No Pala chariot corps is attested: Pala inscriptions name chariots only in the conventional formula of the fourfold army (elephants, horses, chariots, foot), no Pala battle is known to have involved them, and the commanders' chariots that Xuanzang still saw in India (630s–640s) come before the window. The paik, the real backbone of Bengali armies, takes its place."
