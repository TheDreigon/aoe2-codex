civ = "Bengalis"
name = "Bengalis"
status = "draft"
label = "Elephant and Naval civilization"
summary = "Bengalis kept as Bengal from the Palas to the Bengal Sultanate (750–1538): elephants, river fleets, the rice surplus with its team bonus and Mahayana (now at the Monastery) stay; the paik foot archer replaces the chariot as unique unit, the keeping of the royal elephant herds (Hastyayurveda, the Tamils' former Medical Corps, at the Castle) replaces the misapplied Paiks tech, the cash crops of the cloth and sugar trade and the learning of the Pala mahaviharas and the sultans' courts replace the cavalry and armoured-monk bonuses, Ilyas Shah's union of Bengal (Shah-i-Bangalah) becomes the Town Center tech, and the Cannon Galleons and the Arbalester leave, with no land gunpowder (the Sultanate's late artillery is left to the owner)."
ideas = [
  "N2: A river war-boat unique ship for the delta fleets (Monghyr plate; the Sultanate's flotillas; Babur on the Ghaghra, 1529), with its name chosen carefully: kosa and ghurab are attested mostly for the Mughal flotilla (nawara) of the 17th century.",
  "N3: New art for the Paik: a lightly armed foot soldier with bamboo bow, sword and shield, instead of the borrowed Vietnamese Rattan Archer model.",
  "N3: Brick-and-terracotta building art for Bengal (Somapura, the Adina mosque, the Sixty Dome mosque at Bagerhat).",
  "N3: The missing eastern neighbours: Kamarupa and the Ahom kingdom of Assam (which defeated Bengal's invasion of 1532–33), and Orissa under the Eastern Gangas and Gajapatis.",
]
contested = [
  "Whether the choice of Gopala by the prakriti (Khalimpur plate) was an election or the legitimation of a strongman by local notables.",
  "The identification of the Akhbar's kingdom of ‘Rahma’ with the Palas: dominant, but not unanimous.",
  "The reach of Devapala's southern conquests and a possible Pala–Pandya clash (the Badal pillar against the Sinnamanur plates).",
  "Who destroyed Nalanda and when: Minhaj's account of Odantapuri, and the Tibetan pilgrim Dharmasvamin, who still found Nalanda partly active in 1234–36.",
  "The causes of Bengal's Islamisation: Richard Eaton's agrarian-frontier thesis against explanations by forced conversion or migration.",
  "When firearms reached Bengal: Iqtidar Alam Khan (2004) counts Bengal among the 15th-century users of gunpowder, but the firm references are of the 16th century. João de Barros credits artillery with Bengal's edge over Arakan and Tripura (via Banglapedia, ‘Military’); Babur, who fought the Bengal army on the Ghaghra in 1529, says the Bengalis were famous for their artillery, though he found that they fired at random; and Turbak's gun-armed invasion of the Ahom kingdom (1532–33) was beaten, Turbak killed and his guns taken (the Ahom Buranjis, as summarised by Gait 1906). This design treats the guns as a late element whose fame is contemporary repute rather than the lasting fame RULES section 2 asks for, and leaves them out (see open questions); the analysis counts them as a missing feature.",
]
open_questions = [
  "Ratha: dropped, because no Pala chariot corps is attested (see dropped). Keep it anyway as a second unique unit, for its place in the game?",
  "Paik model: the Vietnamese Rattan Archer (a shielded foot archer), because most paiks were archers, or the spear infantry of the game's Ghulam, which the first draft used and which now goes to the Tamils' Velaikkarar? Both are placeholders until new art (N3).",
  "Gunpowder (late element, RULES section 2): no land gunpowder by default, since Bengal's guns are securely attested only from the 1510s and their fame rests on contemporary repute (Babur's remark of 1529) rather than lasting fame (see contested). Add the Bombard Cannon anyway as the civ's one late element (Barros; Babur; the Buranjis)? The Hand Cannoneer and the Cannon Galleon line would be gameplay overrules, since no Bengali hand-gun corps or gun-armed boats are attested inside the window.",
  "Town Center tech: Shah-i-Bangalah (Ilyas Shah's union of Bengal, 1352) is a new tech (level 2) with the capital effect of the Armenians' and Bohemians' drafts (the Persian Town Center bonus at its Feudal Age rate, +10%; the Maya's draft uses the Castle Age rate, +15%). Prefer a Pala moment instead, the prakriti's choice of Gopala that ended the ‘law of the fish’ (Khalimpur plate, c. 750)?",
  "Castle tech: Hastyayurveda keeps the Medical Corps effect for the keeping of the royal elephant herds, a structural trait promoted under RULES 6.3, because the civ's datable royal and military moments have no fitting existing effect. Prefer one of them as a new tech (level 2), for example Dharmapala's assembly at Kanyakubja (c. 800), where he installed Chakrayudha with the assent of the northern kings (Khalimpur plate), or Ramapala's recovery of Varendri with the help of his samantas (late 11th century; Ramacharita)? Medical Corps would then be freed or become an N2 idea.",
  "Power budget: the cash-crop passive (farmers' gold from the Castle Age) and the Town Center tech come in; the Arbalester, the Cannon Galleons and the Ratha go, the Monastery discount narrows to University technologies, there is no land gunpowder, and the archers get no Thumb Ring (no thumb draw is attested in Bengal). Acceptable?",
]

[profile]
entity = "Bengal: the kingdom of Gauda under Shashanka, the Pala empire, the Sena kingdom and the Sultanate of Bengal"
region = "Bengal and, under the Palas, Bihar: the Ganges–Brahmaputra delta and the lower Ganges plain"
window = "750–1538 (from Gopala's accession to Sher Shah's capture of Gaur; Shashanka's Gauda, c. 600–625, as prelude)"
sources = [
  "Khalimpur copper plate of Dharmapala (ed. F. Kielhorn, Epigraphia Indica, vol. IV); Monghyr and Nalanda copper plates of Devapala; Badal pillar inscription",
  "Sandhyakaranandi, Ramacharita (12th century)",
  "Akhbar al-Sin wa'l-Hind (851, traditionally attributed to the merchant Sulaiman), in Elliot and Dowson, vol. I",
  "Minhaj al-Siraj Juzjani, Tabaqat-i Nasiri (c. 1260)",
  "Shams Siraj Afif, Tarikh-i Firuz Shahi (c. 1400)",
  "Ibn Battuta, Rihla (the Maldives and Bengal, 1340s)",
  "Ma Huan, Yingya Shenglan (1433), tr. J. V. G. Mills (1970)",
  "Babur, Baburnama (the campaign of 1529), tr. A. S. Beveridge (1922) and W. M. Thackston (1996)",
  "Tomé Pires, Suma Oriental (1512–15); Duarte Barbosa, Livro (c. 1516); João de Barros, Décadas da Ásia",
  "Ghulam Husain Salim, Riyaz-us-Salatin (1788)",
  "E. A. Gait, A History of Assam (1906)",
