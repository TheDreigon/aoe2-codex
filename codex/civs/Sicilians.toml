civ = "Sicilians"
name = "Sicilians"
status = "reviewed"
label = "Infantry and Cavalry civilization"
summary = "Sicilians as the Italo-Normans and the Kingdom of Sicily (1030–1266): the Norman charge (Imperial Age) replaces the bonus-damage bonus, a fleet bonus is added, First Crusade becomes the Magna Expeditio levy, the royal Diwan takes the Town Center, Lucera's Muslim archers replace Hauberk and the mounted crossbow line leaves the tree."
ideas = [
  "N2: The archers of Lucera as a unique unit of their own (Muslim foot archers with composite bows), instead of a tech for the Archer-line.",
  "N3: A Normans civ of its own (Normandy, England, Italy) or a variant system, since the Normans are split between the Franks (Normandy), the English (Anglo-Norman England from 1066) and the Sicilians (southern Italy and Sicily).",
]
contested = [
  "How tolerant Norman Sicily was, and how coexistence turned into latinisation and persecution (Metcalfe, Johns, Birk).",
  "'Viking' heritage against the French-speaking Frankish identity of the 11th-century Normans.",
  "Scale of the 'Arab agricultural revolution' (Andrew Watson) in Sicily.",
  "The reputation of William I 'the Bad', which comes mostly from the hostile Hugo Falcandus.",
  "Bohemond's motives in the First Crusade: ambition for Byzantine lands (Malaterra, Anna Komnene) or piety (Gesta Francorum). Bohemond and Tancred (Antioch, 1098) belong to the history text: they were Italo-Normans of Apulia, but the county of Sicily stayed out of the crusade.",
  "The name: 'Sicilians' for the Regnum Siciliae, which covers the Hauteville and Hohenstaufen kingdom with its Greek and Muslim subjects, as the design does (the diwan, Lucera, the fleet, Thumb Ring, Frederick II's castles), or 'Italo-Normans', which would end the window in 1194 and re-base the archer tech on the Muslim troops of Roger I and Roger II. The design keeps 'Sicilians', since standard scholarship names the kingdom so: the Regnum Siciliae, which included the mainland from Roger II's coronation (1130). The Italo-Norman principalities of 1030–1130 (Aversa, Apulia and Calabria, the county of Sicily) come under the name as the kingdom's antecedents, and the word stands for the realm, not only for the island's people (RULES section 4 and 6.16.15; level-1 review decision).",
]
open_questions = []

