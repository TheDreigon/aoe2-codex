[[bonus]]
text = "Start with +100 stone"
kind = "economic"
level = 1
change = "kept"
precedent = "Start with +100 stone (Sicilians)"
basis = "An abstraction of the Norman castle-building programme that held newly conquered land (Melfi, Adrano, Paternò, Caccamo) (Loud, 2000)."
relevance = "The Normans secured each conquered district with a castle from the start, and stone in hand from the first minutes abstracts that priority. It is the thinnest of the civ's three castle traits. It is kept as the game's own level-1 bonus, since the castle network is the conquest's signature, rather than giving the slot to Palermo's royal silk workshop (the tiraz, which made Roger II's coronation mantle in 1133–34 and took in silk workers carried off from Thebes and Corinth in 1147) (level-1 review decision)."

[[bonus]]
text = "Farm upgrades provide +125% additional food"
kind = "economic"
level = 1
change = "kept"
precedent = "Farm upgrades provide +125% additional food (Sicilians)"
basis = "Sicily stayed a great grain exporter under the Normans and the Hohenstaufen, to northern Italy and Ifriqiya (Abulafia, 1977), and earlier centuries had brought irrigation works such as Palermo's qanats (whose dating, Islamic or Norman, is debated), citrus, sugar cane, cotton and the mulberry (Metcalfe, 2009)."
relevance = "Grain was the kingdom's wealth and its main export; Sicilian agriculture paid for the Norman monarchy."
contested = "The scale of the 'Arab agricultural revolution' (Watson) is debated."

[[bonus]]
text = "Can build Donjon in Dark Age, replaces Watch Tower-line"
kind = "military"
level = 1
change = "kept"
precedent = "Can build Donjon in Dark Age, replaces Watch Tower-line (Sicilians)"
basis = "Norman keeps such as Adrano and Paternò, attributed to Roger I, anchored the conquest of Sicily (Loud, 2000); the ruling elite spoke French, so 'donjon' is defensible."
relevance = "The keep is the emblem of the Norman conquest of the south, and the building through which the civ's garrisons hold the land."
contested = "The first Norman strongholds in Italy (Aversa, Melfi) were earth-and-timber or reused works and the stone keeps came later, so Dark Age availability is a stretch; in Italian the tower is a mastio. The design keeps the Dark Age Donjon as the civ's game identity rather than 'Can build Donjon in Feudal Age' (level-1 review decision)."

[[bonus]]
text = "Fortifications built +50% faster; Town Centers built +100% faster"
kind = "other"
level = 1
change = "kept"
precedent = "Fortifications built +50% faster; Town Centers built +100% faster (Sicilians)"
basis = "A good abstraction of conquest by castles: the Normans threw up earth-and-timber strongholds quickly and consolidated their conquests around new centres (Loud, 2000)."
relevance = "Fast fortification let a few thousand Norman horsemen at most, helped by local troops, take and hold southern Italy and, over thirty years (1061–1091), Sicily; a structural trait of the conquest."

[[bonus]]
text = "Knight-line receives a charge attack starting in Imperial Age"
kind = "military"
level = 1
change = "new"
replaces = "Soldiers receive -40% bonus damage"
precedent = "Comitatenses (Romans, an Imperial Age tech): Militia-line, Knight-line, and Centurions train +50% faster and receive a charge attack (charge part only, here a passive at the tech's age); for the age gate, +10 population space in Imperial Age (Goths); Coustillier (Burgundians): Heavy Cavalry with a powerful charged attack"
basis = "The Normans of Italy won with the massed charge of mailed horsemen: Civitate (1053), Cerami (1063), Dyrrhachium (1081) (William of Apulia; Malaterra). Anna Komnene, writing of Bohemond's war, said that a Frank on horseback would bore his way through the walls of Babylon, but on foot was anyone's sport (Alexiad, XIII). A long military tradition, so a passive (RULES 6.2). The charge belongs to the whole window; it comes only in the Imperial Age because the codex keeps the game age of a reused effect, here Comitatenses (RULES 6.16.11). The -40% bonus-damage bonus it replaces had no historical referent."
relevance = "The knightly charge won the conquest of southern Italy and Sicily, and Anna Komnene's line made it famous; it is the military signature of the Italo-Normans."
contested = "The couched-lance charge was common to Western knights, not a Norman monopoly, and Malaterra's numbers (Cerami) are exaggerated."

[[bonus]]
text = "Warships cost -10/15/20% in Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "new"
precedent = "Warships cost -10/15/20% in Feudal/Castle/Imperial Age (Vikings, kept by the Norwegians' design; the Tupi design shares it)"
basis = "Norman Sicily was a naval power built on the island's Greek and Arab seafarers. After a failed descent on Mahdia (1123), the fleets of the admirals Christodulus and George of Antioch took Jerba (1135), Tripoli (1146) and Mahdia (1148), held a 'kingdom of Africa' on that coast until 1160, seized Corfu (1147–1149) and sacked Thebes and Corinth (1147), bringing silk workers to Palermo (Houben, 2002; Stanton, 2011; Abulafia, 1985)."
relevance = "The fleet made the kingdom a Mediterranean power: it won an African dominion, fought Byzantium and supported the crusader states."

[team_bonus]
text = "Transport Ships +5 line of sight and cost -50%"
level = 1
change = "kept"
precedent = "Transport Ships +5 line of sight and cost -50% (Sicilians team bonus)"
basis = "The kingdom's ports and ships carried its allies. Crusaders crossed from the Norman ports of Apulia (Hugh of Vermandois from Bari in 1096; Robert of Normandy and Stephen of Blois from Brindisi in 1097, Fulcher of Chartres), and Louis VII came home from the Second Crusade on Sicilian ships in 1149, landing in Calabria after a Byzantine attack off the Peloponnese. Richard I and Philip II wintered at Messina in 1190–1191: after Richard had stormed the city (October 1190) and imposed a treaty on King Tancred, Richard and Tancred were reconciled at Catania (March 1191), where Tancred gave him horse-transports and galleys for the voyage east (Roger of Howden). William II's fleets also served the Latin East, in the expedition against Alexandria planned with Amalric of Jerusalem (1174) and with some 60 galleys under Margaritus of Brindisi, who helped to relieve Tripoli and defend Tyre (1187–1188) (Houben, 2002; Stanton, 2011; Wolff and Hazard, 1962). The Norman crossings to Sicily (1061) and Epirus (1081) show the same capacity at home. The Sicilians are the game's original holder; the Tupi design uses the same team bonus. Identical team-wide effects count once per team (RULES 6.16.12)."
relevance = "Southern Italy was a recurrent crossing point for crusaders and the Norman fleet an occasional naval ally of the Latin East; a benefit to allies, as RULES 6.2 requires."
contested = "Dates and fleet sizes for Margaritus's campaigns vary between sources."

[[unique_unit]]
name = "Serjeant"
model = "Serjeant"
building = "Castle"
level = 1
change = "kept"
basis = "Servientes, non-noble soldiers on foot or on horseback, are counted beside the milites in the kingdom's register of military service (the Catalogus Baronum, c. 1150–1168); building Donjons is an abstraction of their garrison role."
relevance = "Serjeants were much of the Norman armies and garrisons, and the kingdom's own register counts them beside the knights."
contested = "'Serjeant' is a term common to the Anglo-Norman and French world, not specifically Sicilian."

[[unique_tech]]
name = "Magna Expeditio"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Up to 5 Town Centers spawn 5 Serjeants each; units more resistant to conversion"
level = 1
change = "changed"
replaces = "First Crusade"
precedent = "First Crusade (Sicilians): identical effect, building and age, renamed"
basis = "Roger II's government recorded the service that each fief of the mainland provinces of Apulia and Capua owed to the general levy, the 'great expedition' (Quaternus magne expeditionis, c. 1150–1151, revised under William II in 1167–1168, preserved in the 14th-century compilation known as the Catalogus Baronum): for every fief, the knights and serjeants (servientes) it had to send (Jamison, 1972; Cuozzo, 1984). Town Centers that raise Serjeants stand for this levy of the kingdom's lordships; resistance to conversion, for the crown's control of the Church through the apostolic legation that Urban II granted Roger I in 1098 (Houben, 2002). The effect is First Crusade's, whose name inverted history: Count Roger I's Sicily stayed out of the crusade, and when Bohemond's men took the cross at the siege of Amalfi (1096) Roger saw his army melt away and went home (Malaterra)."
relevance = "Royal control of feudal military service, recorded fief by fief for the mainland provinces, marked one of the most centralised monarchies of 12th-century Europe; it passes on weight rather than fame, and the rename removes a mechanic that contradicted the history text (RULES 6.12)."
contested = "The register's purpose and dating (a muster for the defence of the realm c. 1150, revised in 1167–1168) are reconstructions by Jamison and Cuozzo; it covers Apulia and Capua (with the Abruzzi), not Calabria or Sicily, and the baronial revolts (1132–1139, 1155–1156, 1160–1161) show the limits of royal control."

[[unique_tech]]
name = "Diwan"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Town Centers work +10% faster"
level = 2
change = "new"
precedent = "Town Centers and Docks +100% HP and work +5/10/15/20% faster in Dark/Feudal/Castle/Imperial Age (Persians, whose design drops it): the work-rate effect only, Town Centers only, at its Feudal Age value (+10%), as in the Georgians' and Cumans' designs (Chqondideli, Council of Khans). A new tech (level 2): no existing unique tech renders a royal administration"
basis = "Roger II's kingdom was governed through a royal diwan on Fatimid lines, staffed by Arabic- and Greek-writing officials: from the 1140s its offices kept Arabic registers of the villeins attached to each estate (jarāʾid) and of estate boundaries, confirmed grants and collected the king's revenues, and the royal administration issued documents in Arabic, Greek and Latin (Johns, 2002; Takayama, 1993). Ibn Jubayr (1184–1185) still found Muslim officials and pages in William II's palace. A Town Center that works faster abstracts a government that knew its lands and men; no other Latin kingdom had an Arabic-language administration. The tech structure follows RULES 6.2 (level-1 review decision): Magna Expeditio, a royal levy of feudal service, keeps First Crusade's place at the Castle, and the diwan takes the Town Center, rather than the Assizes of Ariano (conventionally 1140) or al-Idrisi's Tabula Rogeriana (1154); with it the civ has 6 passive bonuses and 3 unique techs, the cap of 9 (RULES 6.1)."
relevance = "The Arabic-Greek royal diwan, at the heart of a trilingual administration, is the most distinctive institution of the Norman kingdom, without parallel in Latin Europe, and the instrument of its kings' wealth; the analysis names it as the main missing feature."
contested = "How much the diwan owed to Fatimid models rather than to the Kalbid and Byzantine practice already on the island is debated (Johns, 2002; Metcalfe, 2009)."

[[unique_tech]]
name = "Lucera"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Archer-line +1 attack, +1 range"
level = 2
change = "new"
replaces = "Hauberk (Knight-line +1 melee/+2 pierce armor): dropped for relevance (RULES 6.9), since the long mail shirt was standard for all Western cavalry, a detail with no Sicilian specificity"
precedent = "Atlatl (Aztecs): Skirmishers +1 attack, +1 range; Recurve Bow (Magyars): Mounted Archers +1 attack, +1 range"
basis = "Muslim troops served the Hauteville from the conquest onwards (Malaterra; Metcalfe, 2009). During the long revolt of the Muslims of western Sicily (from 1189–1190 to c. 1246), Frederick II deported them in large numbers to Lucera in Apulia, from c. 1224; the colony's lightly armed archers were a loyal royal corps at Cortenuova (1237) and Benevento (1266) until Lucera was destroyed in 1300 (Taylor, 2003)."
relevance = "The Muslim archers of Lucera were the most distinctive troops of Frederick II and Manfred, and the colony embodies the kingdom's Muslim population and its fate."
contested = "Numbers are uncertain, for the deportations as for the archers at Cortenuova, and how many Sicilian Muslims went to Lucera is debated (Metcalfe, 2009; Taylor, 2003); the colony belongs to the Hohenstaufen period, at the end of the window."

[tree]
add = ["Thumb Ring", "Architecture", "Treadmill Crane", "Theocracy", "Fortified Wall"]
remove = ["Cannon Galleon", "Mounted Crossbowman", "Heavy Mounted Crossbowman", "Cranequins", "Siphons"]

[tree.basis]
"Thumb Ring" = "Given for an archery tradition the kingdom's armies demonstrably used, the Islamic one, rather than for an attested draw of their own: Muslim troops served the Hauteville from the conquest onwards, and the Muslim archers of Lucera were a royal corps under Frederick II and Manfred. The Islamic tradition drew with the thumb, as its Arabic manuals teach, from Taybugha's Mamluk manual (c. 1368; Latham and Paterson, Saracen Archery, 1970) to an anonymous manual of c. 1500 thought to be North African (Faris and Elmer, Arab Archery, 1945); that the archers of Sicily and Lucera drew the same way is an inference from that tradition, since no source specific to them describes their draw (RULES 6.16.4). It supports the Lucera tech."
"Architecture" = "The kingdom was a great builder: Cefalù cathedral (from 1131), the Palatine Chapel (consecrated 1140), La Zisa (begun c. 1164–1165) and Monreale (from 1174), which the civ's own history text praises; the lack of building techs contradicted it."
"Treadmill Crane" = "The treadwheel crane is first attested in medieval Europe c. 1225 (France) and first illustrated c. 1240 (A. L. Matthies, 'Medieval Treadwheels', Technology and Culture 33, 1992). No source documents it at Frederick II's building sites, but it fits their date rather than the 12th-century churches: Castello Maniace at Syracuse (c. 1232–1240), Castello Ursino at Catania (1239–1250) and Castel del Monte (c. 1240)."
"Theocracy" = "In 1098 Urban II granted Roger I the apostolic legation, the root of the 'Monarchia Sicula' through which the kings controlled the island's church, and the Martorana mosaic shows Roger II crowned by Christ (Houben, 2002). The name fits; the effect is the generic one."
"Fortified Wall" = "The towns of the kingdom were walled (Palermo, Bari, Salerno), and Frederick II's castles enclose their courtyards with stone curtain walls and corner towers (Castello Maniace, Castello Ursino). The Donjon replaces only the tower line, so the stone walls of a civ of castle-builders should reach the generic top tier."
"Cannon Galleon" = "No gunpowder in the window: the earliest European records of cannon date from 1326, sixty years after Benevento (1266), and the civ already lacks Bombard Cannon and Hand Cannoneer. Under RULES 6.11 the anti-ship role at sea stays with the Galley and Fire Ship lines and the anti-building role with the single-use Heavy Demolition Ship, and on land with the Trebuchet; no substitute siege warship is added (RULES 6.16.1)."
"Mounted Crossbowman" = "Shared basis (level-1 review, section 11): the Mounted Crossbowman line stays only where mounted crossbowmen are documented as a regular troop type of the civ’s armies. No mounted crossbowmen are documented in the kingdom before 1266 in the sources checked for this design: the kingdom's crossbowmen (Frederick II's balistarii) are evidence for the crossbow, not for crossbowmen on horseback, and the generic Crossbowman carries them (RULES 6.16.3); the tech tree audit justified mounted crossbowmen for the Sicilians by the Angevin and Aragonese kingdom, after the window. Removed; nothing the civ needs to play is lost (RULES 6.11): the foot Archer and crossbow lines, with the Lucera tech, keep the missile role, the Light Cavalry and the Cavalier the mounted one."
"Heavy Mounted Crossbowman" = "Same reason as the Mounted Crossbowman, and later still (14th–15th centuries)."
"Cranequins" = "The cranequin, a rack-and-pinion winder for heavy crossbows, belongs to the late 14th and 15th centuries, after the window (1266) (names theme of the analysis); RULES 6.10 forbids renaming it to hide the anachronism, and no 13th-century equivalent is attested in the kingdom. The mounted crossbow line it improves also leaves the tree (see the Mounted Crossbowman), and the civ does not need it to play (RULES 6.11)."
"Siphons" = "Named after the Byzantine fire siphon, a state secret never given to other nations (De Administrando Imperio 13); no ship-borne liquid-fire weapon is documented for this civ. The Sicilians keep the fleet-of-ships tier (RULES 6.16.1): the galley fleets of Christodulus, George of Antioch and Margaritus of Brindisi (Stanton, 2011), with the Galleon, a 16th-century type, as the skeleton's flagged abstraction (RULES 6.16.2)."

[architecture]
set = "Mediterranean"
level = 1
change = "kept"
basis = "The Arab-Norman-Byzantine buildings of Palermo (Palatine Chapel, La Zisa) and the Romanesque cathedrals sit well in the Mediterranean set; a Western European set would show only the Norman half."
