civ = "Gurjaras"
name = "Gurjaras"
status = "draft"
label = "Cavalry and Camel civilization"
summary = "Gurjaras as the Gurjara-Pratiharas and the Rajput kingdoms of western and central India (c. 730–1527): the cavalry, camel and herding identity, the Shrivamsha Rider, the Camel Scout and Frontier Guards stay; the forage-bush and camel-training bonuses give way to shepherding, the hill-forts and the horse-breeding of the Thar margins, Kshatriyas becomes Samantas (the feudatory contingents, same effect), the Battle Elephant enters the tree and the Chakram Thrower moves to the Hindustanis."
ideas = [
  "N2: Kesariya: a last-stand bonus for units fighting near their own Castle at low HP, for the saffron-clad final sorties of besieged Rajput garrisons (Chittor, 1535 and 1568); to be handled without any reference to the jauhar.",
  "N2: Bhil Archer: a fast, cheap foot archer for the Bhil allies of Mewar (tradition puts the Bhil chief Rana Punja at Haldighati, 1576, and a Bhil figures on the arms of Mewar).",
  "N3: Vav (stepwell) as a unique economic building, for the stepwells of Gujarat and Rajasthan such as the Rani ki Vav at Patan (c. 1063) and Adalaj (1499) (Jutta Jain-Neubauer, The Stepwells of Gujarat, 1981).",
  "N2: The Gujarati navy of Malik Ayaz, governor of Diu, who with the Mamluk fleet defeated the Portuguese at Chaul (1508) and lost at Diu (1509): Dry Dock, Fast Fire Ship and a naval tech, if the Gujarat Sultanate stays in this civ.",
  "N3: Split the umbrella: a Rajput civ and a Gujarat Sultanate civ (1407–1573), or move the Gujarat and Malwa sultanates to an Indo-Islamic civ.",
]
contested = [
  "The origin of the Gurjaras: a Central Asian or Huna origin (V. A. Smith, D. R. Bhandarkar) against a local one; ‘Gurjara’ as a territory (Gurjaratra), a clan or an ethnic group. The imperial Pratiharas never call themselves Gurjara in their own inscriptions; the compound ‘Gurjara-Pratihara’ appears only in the Rajor inscription of a feudatory (c. 960).",
  "The present-day dispute between Gurjar and Rajput communities over the heritage of the Pratiharas and of Mihira Bhoja.",
  "The making of ‘Rajput’ identity as a process of the 7th–16th centuries (B. D. Chattopadhyaya; Tanuja Kothiyal) against ancient genealogies (the Agnikula myth).",
  "Who checked the Arabs of Sind c. 738: Nagabhata I, the Chalukya Avanijanashraya Pulakeshin or the semi-legendary Bappa Rawal.",
  "The historicity of the Prithviraj Raso, of the Sanyogita episode and of the ‘traitor Jaichand’ (Talbot 2016).",
  "‘Indian feudalism’ (R. S. Sharma) against the integrative model of early medieval state formation (B. D. Chattopadhyaya), which bears on how the samanta system is read.",
  "The weight of the single Chatsu reference to Śrīvaṃśa horses and the reliability of the Hudud al-Alam’s figures, which recycle earlier sources.",
]
open_questions = [
  "Name: keep ‘Gurjaras’ (ambiguous and politically sensitive), rename to ‘Rajputs’ (the umbrella the civ actually covers, though a later identity) or to ‘Pratiharas’ (the core dynasty only)? This draft keeps ‘Gurjaras’ in its regional sense: Gurjaratra, the land that gave its name to Gujarat.",
  "Scope: the Gujarat Sultanate (1407–1573) stays in as a late regional phase, which is what justifies the Imperial Age Hand Cannoneer and Bombard Cannon (Rumi Khan’s guns at Chittor, 1535; the Gujarati–Mamluk fleet at Diu, 1509). Move it out and remove the gunpowder, since Rajput armies such as Rana Sanga’s at Khanwa (1527) fought almost without guns?",
  "Knight-line: Rajput cavalry was largely shock cavalry in mail, with lance and sword, and the analysis notes its absence. Add Knight and Cavalier? Not done here, to keep the Shrivamsha Rider and the camels at the centre and the power budget in check.",
  "Battle Elephant is added without the Elite upgrade. Enough, or give the Elite too (the Hudud al-Alam, via Hooja, gives the rai of Kannauj 800 elephants)?",
  "Frontier Guards keeps its effect (Camel Riders and Elephant Archers +4 melee armor), which the analysis calls arbitrary. Change it to the defensive version the analysis proposes (towers and Castles +2 armor, +2 line of sight), or keep it?",
  "Kshatriyas becomes Samantas with the same effect, so that a varna category is no longer a technology. Acceptable, or keep the old name?",
]

[profile]
entity = "The Gurjara-Pratihara empire and the Rajput kingdoms of western and central India (Chahamanas or Chauhans, Paramaras, Chaulukyas or Solankis, Guhilas and Sisodias, Chandelas), with the Sultanate of Gujarat as a late regional phase"
region = "Western and central India: Rajasthan, Gujarat and Malwa, and at the Pratihara peak Kannauj and the upper Ganges plain"
window = "c. 730–1527 (Pratihara core c. 730–1036)"
sources = [
  "Sulaiman al-Tajir, Akhbar al-Sin wa’l-Hind (851), tr. in Elliot and Dowson, vol. I (1867)",
  "Hudud al-Alam (982), tr. V. Minorsky (1937)",
  "Gwalior prashasti of Mihira Bhoja; Chatsu inscription of the Guhilas; Rajor inscription (c. 960)",
  "Jayanaka, Prithviraja Vijaya (c. 1191–92)",
  "Minhaj al-Siraj Juzjani, Tabaqat-i Nasiri (c. 1260)",
  "B. N. Puri, The History of the Gurjara-Pratiharas (1957)",
  "Dasharatha Sharma, Early Chauhan Dynasties (1959)",
  "B. D. Chattopadhyaya, The Making of Early Medieval India (1994)",
  "Rima Hooja, A History of Rajasthan (2006)",
  "Cynthia Talbot, The Last Hindu Emperor: Prithviraj Chauhan and the Indian Past, 1200–2000 (2016)",
  "Tanuja Kothiyal, Nomadic Narratives: A History of Mobility and Identity in the Great Indian Desert (2016)",
  "Tomé Pires, Suma Oriental (1512–15); Duarte Barbosa, Livro (c. 1516)",
]
replaces = "Gurjaras as written in 2022: from the Pratiharas to Maharana Pratap and the Mughal treaty of 1615, with the Soomras of Sind"

[[bonus]]
text = "Can garrison livestock in Mills to passively produce food"
kind = "economic"
level = 1
change = "kept"
precedent = "Can garrison livestock in Mills to passively produce food (Gurjaras)"
basis = "Rajasthan and Gujarat had a strong pastoral economy of cattle, goats, sheep and camels, and herding communities such as the Gujars and Rabaris have deep roots there (Kothiyal 2016; Hooja 2006). A good mechanical image of stall-fed and penned herds."
contested = "Linking the Pratihara dynasty to the pastoral identity of a modern community is disputed."

[[bonus]]
text = "Shepherds work +25% faster"
kind = "economic"
level = 1
change = "new"
replaces = "Start with 2 Forage Bushes"
precedent = "Shepherds work +25% faster (Britons)"
basis = "In the semi-arid Thar and its margins, mobile herding of sheep, goats and camels was a mainstay alongside rain-fed farming, and Kothiyal (2016) shows how pastoral mobility shaped the identities of the Great Indian Desert. The forage-bush bonus it replaces was pure balance with no historical referent."

[[bonus]]
text = "Mounted Units deal +20/30/40% bonus damage in Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Mounted Units deal +20/30/40% bonus damage in Feudal/Castle/Imperial Age (Gurjaras)"
basis = "Sulaiman (851) writes that no Indian prince had cavalry as fine as the king of ‘Jurz’ (the Gurjara-Pratihara); the Hudud al-Alam (982) credits the rai of Kannauj with 150,000 horsemen (via Hooja 2006), and the later Rajput ethos was that of the cavalry charge. An abstraction of cavalry excellence."

[[bonus]]
text = "Units and buildings receive -15% damage when located on higher elevation"
kind = "military"
level = 1
change = "new"
precedent = "Units and buildings receive -15% damage when located on higher elevation (Georgians)"
basis = "The Pratiharas and the Rajput kingdoms held their realms from hill-forts on the Aravalli and Vindhya ridges: Gwalior, where Mihira Bhoja’s inscription was found, Chittorgarh on its mesa, Ranthambore, Jalor, Mandu and Rana Kumbha’s Kumbhalgarh (15th century). Alauddin Khalji needed long sieges to take Ranthambore (1301) and Chittor (1303) (Amir Khusrau; Barani)."

[team_bonus]
text = "Stables work +20% faster"
level = 1
change = "new"
replaces = "Camel and Elephant Units train +25% faster"
precedent = "Stables work +20% faster (Huns team bonus)"
basis = "Horse-breeding on the margins of the Thar: the Chatsu inscription praises Śrīvaṃśa horses able to cross ‘seas of sand’, given to Mihira Bhoja by his Guhila feudatory Harsha, and Sulaiman (851) found the Gurjara king’s horses and camels numerous. The old team bonus had no specific basis."

[[unique_unit]]
name = "Shrivamsha Rider"
model = "Shrivamsha Rider"
level = 1
change = "kept"
basis = "Pratihara cavalry is well attested (Sulaiman, 851), and the name comes from the Chatsu inscription of the Guhilas, which records Śrīvaṃśa horses given to Mihira Bhoja (Hooja 2006). A fast light horseman is a fair image of a cavalry raised on desert-bred horses."
contested = "The breed rests on a single epigraphic mention; the ability to dodge projectiles is game invention."

[[unique_unit]]
name = "Camel Scout"
model = "Camel Scout"
level = 1
change = "kept"
basis = "Sulaiman (851) notes the Gurjara king’s numerous camels, and the riding camels of the Thar are famous; a camel replacing the starting scout suits a realm whose western frontier was desert."
contested = "Military camel scouts are not documented for the Pratihara period; the well-known camel corps of Bikaner (founded 1488) and Jaisalmer, culminating in the Ganga Risala, are later."

[[unique_tech]]
name = "Samantas"
age = "Castle"
effect = "Military Units cost -25% food"
level = 1
change = "changed"
replaces = "Kshatriyas (Military Units cost -25% food)"
precedent = "Kshatriyas (Military Units cost -25% food) (Gurjaras)"
basis = "The Pratihara empire was a hierarchy of samantas, subordinate rulers such as the Guhilas of Chatsu and the Chahamanas of Shakambhari, who served the overlord with contingents they raised and fed themselves; the later Rajput states rested on lineage lands held in return for service (Chattopadhyaya 1994; Hooja 2006). Hence an army that costs its king less food. Same effect, renamed: ‘Kshatriyas’ turned the varna that Rajput lineages claimed into a technology, and its effect had no link to the concept."
contested = "How far the samanta system amounts to ‘feudalism’ is debated (R. S. Sharma against B. D. Chattopadhyaya)."

[[unique_tech]]
name = "Frontier Guards"
age = "Imperial"
effect = "Camel Riders and Elephant Archers +4 melee armor"
level = 1
change = "kept"
precedent = "Frontier Guards (Camel Riders and Elephant Archers +4 melee armor) (Gurjaras)"
basis = "‘Pratihara’ means door-keeper, and the dynasty traced itself to Lakshmana, door-keeper of Rama. The Gwalior prashasti of Mihira Bhoja credits Nagabhata I with crushing the armies of a powerful mleccha ruler (the Arab governors of Sind, c. 730s), and Sulaiman (851) calls the Gurjara king the greatest enemy of the Arabs in India. The effect, armour for the camel and elephant corps that held the desert frontier, is an abstraction."
contested = "The name is apt, the effect has no specific source (see open questions)."

[tree]
add = ["Battle Elephant"]
remove = []

[tree.basis]
"Battle Elephant" = "Pratihara and Rajput armies fielded war elephants: the Hudud al-Alam (982) gives the rai of Kannauj 800 of them (via Hooja 2006), the Chatsu inscription praises the elephant force of the Guhila Harsha, and the Persian chronicles of Tarain (1191–92) put elephants in Prithviraj Chauhan’s army. Without the Elite upgrade, to keep the cavalry and camels at the centre of the civ."

[architecture]
set = "South Asian"
change = "kept"
basis = "Kept: the South Asian set suits the temples, palaces and hill-forts of Rajasthan and Gujarat as well as any existing set."

[[dropped]]
item = "Chakram Thrower"
kind = "unique_unit"
reason = "No source links the chakram to the Pratiharas or to Rajput armies; it is first described by Duarte Barbosa (c. 1516) in the ‘kingdom of Delli’ and later became the weapon of the Sikh Akali Nihangs of the Punjab. Moved to the Hindustanis, as the analysis suggests. The Gurjaras keep two unique units."
