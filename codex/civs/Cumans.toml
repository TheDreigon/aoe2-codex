civ = "Cumans"
name = "Cumans"
status = "draft"
label = "Cavalry civilization"
summary = "The Cuman-Kipchak confederation (1055–1241, diaspora to c. 1400) keeps its speed, extra Town Center, Kipchak and Cuman Mercenaries, gains herding, ransom, feigned flight, the Council of Khans and marriage alliances, and loses its invented early siege, the top siege tiers, the Trebuchet and camels."
ideas = [
  "N2: Konchak's “living fire” (1184/1185): Scorpions and Mangonels leave burning ground, the effect of the Mounted Trebuchet's projectiles (a Khitan unit in the game, which the Khitans' design drops) as a tech.",
  "N3: A kurgan sanctuary with stone ancestor statues replacing the Monastery (Rubruck; S. A. Pletneva, Polovtsy, 1990).",
  "N3: Vezha: wagon-camp walls that can be packed and moved (the vezhi of the Rus' chronicles), instead of the dropped Palisade bonus. In N1 the Mule Cart stays with its four holders (RULES 6.16.7), so the Cumans get no wagon dropsite; the Scenario Editor's Ox Wagon (The Last Khans), which the Tatars' design uses as the look of its Araba, could lend such a camp its look.",
  "N2: A masked heavy lancer unique unit, after the iron face masks, mail and lamellar from Cuman and Chernye Klobuky kurgans.",
  "N2: Captive raids: gold for each enemy Villager killed by mounted units (the slave trade through Sudak).",
  "N3: A “Steppe” architecture set shared with the Avars, Mongols and Tatars.",
]
contested = [
  "Cumans and Kipchaks: one people, two branches of one confederation, or two associated peoples (P. B. Golden).",
  "Origins: the Qun of al-Marwazi (c. 1120), driven west from the Khitan lands, or the Kimek-Kipchak milieu of the Irtysh.",
  "The extent of Cuman siegecraft: they besieged rarely, mostly by blockade (Torchesk, 1093), and Konchak's engines of 1184/1185, served by a Muslim specialist, are an isolated record.",
  "Herding and farming: Robert de Clari says the Cumans neither ploughed nor sowed, while S. A. Pletneva places the 12th-century Polovtsy in her second stage of nomadism, with fixed winter and summer pastures, and finds the beginnings of settlement and cultivation (Polovtsy, 1990).",
  "How many Cumans settled in Hungary (Rogerius speaks of some 40,000 families with Köten in 1239) and in Georgia under David IV.",
  "The parentage of Elizabeth the Cuman, wife of Stephen V of Hungary: a daughter of Köten, or of a Seyhan who may be the same man or a title.",
  "The Cuman, Vlach or Bulgarian origin of the Asen dynasty of Bulgaria (A. Madgearu, The Asanids, 2016).",
  "The authenticity of the Lay of Igor's Campaign has been challenged (A. A. Zimin; E. L. Keenan, Josef Dobrovský and the Origins of the Igor' Tale, 2003); most scholars accept it (A. A. Zaliznyak, 2004). This design takes its facts from the Hypatian Chronicle.",
  "Qazaq, a Turkic word usually said to be first recorded in the Codex Cumanicus (early 14th century), has an uncertain sense there; its sense of a freebooter who had left his ruler's service, the source of “Cossack”, belongs to the post-Mongol period (the qazaqlïq of 15th-century Central Asia and the Tatar cossacks of Rus' sources; J.-Y. Lee, Qazaqlïq, or Ambitious Brigandage, and the Formation of the Qazaqs, 2016). It is later than the Mongol conquest of 1237–1241, which ended the Cumans' steppe confederation, and it never named a troop type of Cuman armies, on the steppe or in the diaspora, so it fails the same-function test. Decision: the Hussar keeps the game's name, as in the Tatars' design (RULES 6.16.15).",
]
open_questions = []

[profile]
entity = "Cuman-Kipchak confederation (Polovtsy, Kun, Qipchaq) and its diaspora"
region = "Desht-i Qipchaq from the Danube to the Irtysh, with the western (Cuman-Polovtsian) branch at the core; later Hungary, Bulgaria, Georgia and Egypt"
window = "1055–1241 (diaspora to c. 1400)"
sources = [
  "Russian Primary Chronicle (Povest' vremennykh let)",
  "Hypatian Chronicle (Kievan and Galician-Volhynian chronicles)",
  "Anna Komnene, Alexiad",
  "Robert de Clari, The Conquest of Constantinople",
  "Geoffroy de Villehardouin, The Conquest of Constantinople",
  "Rogerius, Carmen miserabile (c. 1244)",
  "Life of David, King of Kings (Kartlis Tskhovreba)",
  "Ibn al-Athir, The Complete History (al-Kamil fi al-tarikh)",
  "Codex Cumanicus (early 14th century)",
  "The Lay of Igor's Campaign (authenticity debated)",
  "P. B. Golden, An Introduction to the History of the Turkic Peoples (1992); Nomads and Sedentary Societies in Medieval Eurasia (1998)",
  "I. Vásáry, Cumans and Tatars: Oriental Military in the Pre-Ottoman Balkans, 1185–1365 (2005)",
  "S. A. Pletneva, Polovtsy (1990)",
  "N. Berend, At the Gate of Christendom (2001)",
]

[[bonus]]
text = "One additional Town Center can be built in Feudal Age"
kind = "economic"
level = 1
change = "kept"
precedent = "One additional Town Center can be built in Feudal Age (Cumans)"
basis = "The Cumans were a confederation of autonomous hordes, each under its own khan (Sharukan, Boniak, Konchak, Köten) with its own camps and winter quarters; the Rus' chronicles even name Polovtsian “towns”, Sharukan and Sugrov, taken in 1111. An extra early centre stands for this dispersed, many-headed polity."
relevance = "The Cumans never formed a state: hordes under their own khans acted separately, which made them formidable raiders and sought-after allies but unable to meet the Mongols together."
contested = "A Town Center is a fixed seat, and the Cumans had few permanent settlements (Sharukan and Sugrov probably housed settled non-Cumans as well); the analysis rates the bonus stretched. Decision: the game's signature bonus is kept, read as a confederation of autonomous hordes, with herding in its own bonus, rather than replaced by “Pastures replace Farms” (Khitans), which would render Clari's “neither plough nor sow” as a total absence of farming, against Pletneva's evidence of incipient cultivation at the 12th-century winter camps."

[[bonus]]
text = "Mounted Units move +5/10/15% faster in Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Mounted Units move +5/10/15% faster in Feudal/Castle/Imperial Age (Cumans)"
basis = "Robert de Clari (ch. 65) says each Cuman had ten or twelve horses that followed him, and that they rode in a day and a night what took others several days; Boniak's raid reached the gates of Kiev in 1096 (Primary Chronicle). The bonus carries the whole trait of abundant remounts in a people where every man rode, which the dropped Steppe Husbandry also expressed, and stands in for Husbandry, which the Cumans lack."
relevance = "Speed and surprise were the Cumans' main weapons in two centuries of raids on Rus', Byzantium and Hungary."

[[bonus]]
text = "Livestock animals last +50% longer"
kind = "economic"
level = 1
change = "new"
precedent = "Livestock animals last +50% longer (Tatars)"
basis = "Herding was the Cuman economy: Robert de Clari (ch. 65) says they neither ploughed nor sowed, lived in felt tents and fed on milk, cheese and meat, and the Rus' chronicles list the cattle, sheep, horses and camels taken in the Polovtsian camps (vezhi) in 1103 (Primary Chronicle). Shared with the Tatars, whose Kipchak subjects were the same pastoralists after 1241."
relevance = "Herds were the Cumans' wealth and food, and the target of every Rus' campaign into the steppe."
contested = "Pletneva finds the beginnings of settlement and cultivation among the 12th-century Polovtsy (civ-level contested list)."

[[bonus]]
text = "Mounted Units generate +3 gold when defeating military units"
kind = "economic"
level = 1
change = "new"
replaces = "Archery Ranges and Stables cost -75 wood"
precedent = "Mounted Units generate +3 gold when defeating military units (Mapuche, whose design drops it)"
basis = "Prisoners were wealth: the princes captured with Igor Sviatoslavich in 1185 were held in the Polovtsian camps for ransom, Igor himself escaping (Hypatian Chronicle), and Rus' captives were driven into the steppe after the Polovtsian victory of 1093 (Primary Chronicle); Ibn al-Athir describes Sudak in the Crimea as the Kipchaks' port, where slaves and furs were exchanged for cloth (Golden 1992). The wood discount on military buildings had no historical link."
relevance = "Captives and ransom were a main source of Cuman wealth and drove the raids that defined their relations with Rus' and Byzantium."
contested = "An abstraction: ransom and the slave trade concerned civilians as much as soldiers."

[[bonus]]
text = "Parthian Tactics available in Castle Age"
kind = "military"
level = 1
change = "new"
replaces = "Siege Workshop and Battering Ram available in Feudal Age; Capped Ram available in Castle Age"
precedent = "Parthian Tactics available in Castle Age (Persians)"
basis = "Feigned flight, shooting backwards and ambush were the Cumans' hallmark: at Adrianople (1205) Kaloyan's Cuman horse archers lured the Latin knights into a pursuit and destroyed them (Villehardouin; Robert de Clari), and Byzantine and Rus' writers describe the same tactics. The Feudal-Age siege bonus had no basis: the Cumans besieged rarely, and mostly by blockade (Torchesk, 1093), and Konchak's engines of 1184/1185 are an isolated case."
relevance = "The feigned retreat was the Cumans' signature tactic and decided the victory they won for Kaloyan at Adrianople (1205)."

[team_bonus]
text = "Stable Units cost -10% starting in Castle Age"
level = 1
change = "new"
replaces = "Palisade Walls +33% HP"
precedent = "Stable Units cost -15/20% in Castle/Imperial Age (Berbers), at a flat -10% for the team from the same age: a lower magnitude, so level 1 (RULES section 5, narrowing), and the game's age (RULES 6.16.11); team bonuses already cut costs (Walls cost -50%, Mayans; Docks cost -15%, Vikings; Transport Ships +5 line of sight and cost -50%, Sicilians, the only one that discounts a unit)"
basis = "The khans' daughters married into the ruling houses of the Cumans' neighbours: in 1107/1108 the daughters of two khans named Aepa married sons of Vladimir Monomakh and Oleg Sviatoslavich (Primary Chronicle); Atrak's daughter Gurandukht married David IV of Georgia, who then settled Kipchak families in his kingdom (c. 1118–1120); Kaloyan of Bulgaria had a Cuman wife (Akropolites), and Elizabeth the Cuman married Stephen V of Hungary. Kinship went with gifts of horses and with alliance in war: in 1223 Köten gave the Rus' princes horses, camels, buffaloes and girls, and his son-in-law Mstislav of Galicia led them to his aid at the Kalka (Rus' chronicles). Cheaper Stable units stand for the horses these ties brought; the service of Cuman warriors, in raids and battles alike, belongs to Cuman Mercenaries. RULES 6.2: an alliance. The Palisade bonus had no Cuman basis; the wagon camps (vezhi) are an N3 idea."
relevance = "Marriage made the Cuman khans kin to the dynasties of Rus', Georgia, Bulgaria and Hungary and shaped their alliances for two centuries; several Rus' princes had Cuman mothers or wives."
contested = "The parentage of Elizabeth the Cuman is debated (civ-level contested list), and the chronicle versions date the Aepa marriages to 1107 or 1108. Decision: the marriages keep the team slot rather than raids on an ally's behalf (“Scout Cavalry-line +2 attack vs. buildings”, the Hindustanis' team bonus narrowed to the light cavalry, which is also the Lithuanians' design's team bonus, so it would count once on a team shared with them, RULES 6.16.12, and half of the English design's Chevauchée), which would also split the one trait of auxiliary service with Cuman Mercenaries; -10% is the cautious end of the game's range of unit discounts, and no game team bonus discounts military units. The discount starts in the Castle Age, the age of the Berber bonus it narrows, a game constraint (RULES 6.16.11): the marriages begin in the early 12th century."

[[unique_unit]]
name = "Kipchak"
model = "Kipchak"
building = "Castle"
level = 1
change = "kept"
basis = "The horse archer was the core of every Cuman army; Qïpčaq is the people's own name in Muslim and Turkic sources (the Codex Cumanicus records their language). The volley of several arrows abstracts massed fire."
relevance = "The mounted archer was the Cuman warrior, the reason neighbours sought the Cumans as allies and feared them as raiders."
contested = "The unit bears an ethnonym rather than a type of warrior. Decision: the sharing of the model is accepted in N1 (RULES 6.7, 6.16.12): it is also the Georgians' Kipchak (David IV's Kipchak settlers) and the model of the Hindustanis' Ghulam and the Arabs' Mamluk (the slave soldiers of Delhi and Cairo, recruited largely among the Kipchaks after the Mongol conquest of the steppe: P. Jackson, The Delhi Sultanate, 1999; D. Ayalon, The Mamluk Military Society, 1979), and the Bulgarians get free Elite Kipchaks through Cuman Alliance; the Tatars' design keeps the Keshik rather than becoming the sixth civ with Kipchaks."

[[unique_tech]]
name = "Council of Khans"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Town Centers work +10% faster"
level = 2
change = "new"
precedent = "Town Centers and Docks +100% HP and work +5/10/15/20% faster in Dark/Feudal/Castle/Imperial Age (Persians, whose design drops it): the work-rate effect only, Town Centers only, at +10%; the Georgians' (Chqondideli) and Sicilians' (Diwan) designs use the same new tech for their governments"
basis = "The Cumans had no state: their hordes, each under its own khan, decided war and peace in councils of khans and elders. In 1103, as the Rus' princes marched into the steppe, the Polovtsy took counsel: Urusoba urged them to ask Rus' for peace, and the younger khans overruled him (Primary Chronicle); after Igor's defeat in 1185 Konchak and Gzak debated whether to strike at the Kiev lands or at the Seim, and then went their separate ways (Hypatian Chronicle). For a people without a state the Town Center tech stands for a community institution (RULES 6.3); the faster work of the Town Centers, the camps of the hordes (see the extra Town Center bonus), abstracts the joint action the councils made possible, a weak link said openly."
relevance = "The councils were where the autonomous hordes agreed on war, peace and the great joint campaigns against Rus', the closest the Cumans came to a government."
contested = "The councils are known only from Rus' chroniclers' accounts of a few meetings (1103, 1185); their membership and rules are unknown. Decision: the councils keep the slot rather than the Cuman laws of Ladislaus IV (1279), issued under pressure from the papal legate Philip of Fermo, which assigned lands to the Cuman clans of Hungary and laid the legal basis of the later self-governing Cuman districts (Kunság), but were imposed on the diaspora and resisted in the rising of 1280–1282 (Berend 2001)."

[[unique_tech]]
name = "Cuman Mercenaries"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "All team members can train 5 free Elite Kipchaks per Castle"
level = 1
change = "kept"
precedent = "Cuman Mercenaries: All team members can train 5 free Elite Kipchaks per Castle (Cumans); the Bulgarians' design shares it as Cuman Alliance, and identical team-wide effects count once per team (RULES 6.16.12), so a team with Cumans and Bulgarians gets 5 free Elite Kipchaks per Castle, not 10"
basis = "Cumans served their neighbours as auxiliaries, in raids and pitched battle alike, and settled among them: Oleg Sviatoslavich brought the Polovtsy against his Rus' rivals, beating Vsevolod on the Sozhitsa in 1078 and taking Chernigov in 1094 (Primary Chronicle); Togortak (Tugorkan) and Maniak (perhaps Boniak) fought at Levounion for Alexios I (1091; Anna Komnene); the Kipchak families David IV settled in Georgia (c. 1118–1120) fought at Didgori (1121); Cuman allies brought the Asen brothers back across the Danube in 1186 (Choniates), won Kaloyan's victory at Adrianople (1205) and ravaged Thrace in 1205–1206 (Villehardouin); Köten's people entered Hungary in 1239, and the Hungarian Cumans fought at the Marchfeld (1278). The Mongol conquest (1237–1241) turned this service into the diaspora that carried Cuman history to c. 1400. Mercenary and auxiliary service was a long tradition rather than a datable moment, which RULES 6.2 would make team-bonus material (the team slot holds the marriage alliances), so Cuman Mercenaries keeps the Imperial Age Castle slot as a flagged fallback (RULES 6.16.19(b)); its effect already reaches the whole team."
relevance = "Service and settlement among their neighbours carried Cuman history beyond 1241 and shaped the armies of Georgia, Bulgaria and Hungary."
contested = "The Kipchaks who ruled Mamluk Egypt came as slave soldiers, not as mercenaries; the identification of Anna Komnene's Maniak with Boniak is a modern conjecture."

[tree]
add = ["Bracer", "Heavy Scorpion"]
remove = ["Siege Onager", "Siege Ram", "Trebuchet", "Camel Rider", "Champion", "Galleon", "Fast Fire Ship", "Carrack", "Galleon, Fast Fire Ship and Carrack", "Catapult Galleon"]

[tree.basis]
"Bracer" = "A horse-archer people without the last archery upgrade contradicted its identity; Byzantine, Rus' and Hungarian sources describe Cuman archery, feigned flight and ambush."
"Heavy Scorpion" = "In 1184/1185 Konchak advanced on Rus' with crossbows so stiff that fifty men could barely draw them, and with a Muslim specialist who shot “living fire” and was captured when Konchak fled from the Khorol (1 March 1185; Hypatian Chronicle). A heavy bolt-thrower fits this record better than early rams; the engineer was a foreigner and the record is isolated (civ-level contested list)."
"Siege Onager" = "The Cumans had no siege train of their own and besieged mostly by blockade, so the top siege tiers are cut; the Onager and the Capped Ram remain as the generic minimum the civ needs to destroy buildings (RULES 6.11)."
"Trebuchet" = "The counterweight trebuchet is not attested among the Cumans: they had no siege train of their own and besieged rarely, mostly by blockade (Torchesk, 1093), and Konchak's engines of 1184/1185 were great crossbows and a Muslim specialist's “living fire” (Hypatian Chronicle; see the Heavy Scorpion). Removed under the codex rule for engines that never reached a civ (RULES 6.16.5); the Mangonel-line stays as the generic stone-thrower. No heavy stone-throwers are attested for the Cumans either, so the traction test gives no Traction Trebuchet, and the civ has no long-range siege weapon, which the same rule allows when none is attested. The engines that Cumans of the diaspora met in Hungarian, Bulgarian or Mamluk service, such as the great engines the Mamluks hauled to Acre in 1291 (Abu'l-Fida), belonged to their host states, which have their own designs; the tree follows the steppe core (RULES 6.16.19(d))."
"Siege Ram" = "As Siege Onager; the Capped Ram remains."
"Camel Rider" = "The Rus' chronicles list camels among the booty taken in Polovtsian camps (for example in 1103), as pack animals, not cavalry."
"Champion" = "The Cumans fought almost entirely on horseback; the Two-Handed Swordsman remains for allied or subject foot."
"Galleon" = "The Cumans had no war fleet, so the basic navy only, under the codex navy rule (RULES 6.16.1): the Galley-line to War Galley, the Fire Galley and Fire Ship, the Hulk-line as the game's generic melee warship, the demolition ships and the Dock techs, with no Galleon, Carrack, Fast Fire Ship or siege warship."
"Fast Fire Ship" = "As Galleon."
"Carrack" = "As Galleon: no ocean-going ships."
"Galleon, Fast Fire Ship and Carrack" = "Nothing left to upgrade once the three ships are removed."
"Catapult Galleon" = "The Cumans had no war fleet and no ship-borne artillery, so no siege warship and no substitute, under the codex navy rule (RULES 6.16.1)."

[architecture]
set = "Central Asian"
level = 1
change = "kept"
basis = "The Cumans built little beyond tents, wagons and kurgan sanctuaries with stone statues; Central Asian, the set the game made for its steppe civs, is kept as a stopgap until a Steppe set exists (N3), although it draws on Persianate and Timurid brick building (RULES 6.16.8)."

[[dropped]]
item = "Steppe Husbandry"
kind = "unique_tech"
reason = "Scout Cavalry-line, Steppe Lancers and Cavalry Archers train +100% faster. Its trait, abundant remounts in a people where every man rode, is structural (RULES 6.2) and already carried by the movement bonus, which rests on the same passage of Robert de Clari (ch. 65); it has no datable moment that would justify a third unique tech (RULES 6.3), and placing it at the Town Center, as an inferred camp levy, would put a military effect in the civil slot. The Town Center slot goes to the Council of Khans. Decision: the tech is not restored at the Castle in the Castle Age either, as in the game, since a structural trait takes no tech slot without a datable moment."
