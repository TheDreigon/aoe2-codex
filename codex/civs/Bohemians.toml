civ = "Bohemians"
name = "Bohemians"
status = "draft"
label = "Gunpowder and Monk civilization"
summary = "Bohemians keep their Hussite core: Hussite Reforms moves to the Monastery, Charles IV’s New Town of Prague becomes the Town Center tech, the Houfnice becomes a short-range gun (Organ Gun model), Wagenburg Tactics gains armoured wagons, the Czech mercenaries replace the groschen as the team bonus, and the navy shrinks to a landlocked kingdom’s basic fleet."
ideas = [
  "N2: A Houfnice of its own: a Siege Workshop piece with short to medium range, a scattershot blast and bonus damage against infantry and cavalry, with no bonus against buildings.",
  "N2: Pavéza (pavise): Arbalesters and Hand Cannoneers gain pierce armour while standing still, more next to a Hussite Wagon. The great Bohemian pavise was used and copied across Central Europe.",
  "N2: Cepník (flailman): cheap peasant infantry from the Barracks with a bonus against cavalry, the typical Hussite weapon used from the wagons to unhorse knights.",
  "N2: ‘Ktož jsú boží bojovníci’: an aura around Hussite Wagons or Monks that lowers enemy attack, after the Hussite war hymn and the tradition of the crusaders’ flight at Domažlice (1431).",
  "N3: Proper art for the Houfnice (a short, wide-bored gun on a wheeled carriage) instead of the Organ Gun’s multi-barrelled model.",
]
contested = [
  "The location and extent of Great Moravia: the consensus places it in southern Moravia, against the ‘Sirmium’ hypothesis (Boba, Eggers, Bowlus).",
  "When Moravia was joined to Bohemia: in the 950s or only in 1019/1029.",
  "The nature of Hussitism: a religious ‘first Reformation’ (Šmahel, Fudge, Kaminsky), a social revolution (Macek and Marxist historiography) or a Czech national movement (Palacký).",
  "Whether the word ‘pistol’ comes from Czech píšťala or from the town of Pistoia.",
  "The original meaning of houfnice: a sling or stone-thrower, or from the start a gun.",
  "The authorship of the Military Ordinance of 1423 (Žižka as author or co-author) and how far the hymn and the fear of the wagons explain the crusaders’ flight at Domažlice (1431).",
]
open_questions = []

[profile]
entity = "Duchy and (from 1198, confirmed by the Golden Bull of Sicily in 1212) Kingdom of Bohemia, with the Lands of the Bohemian Crown (Moravia, Silesia, Lusatia), from the Přemyslids to the Luxembourgs, the Hussite revolution and the Jagiellonians. The Annals of Fulda first mention Bohemian dukes in 845, when fourteen of them were baptised at Regensburg, and in 872 name several, among them Goriwei, probably Bořivoj I, the first historical Přemyslid. The window starts with him, since the design is the Přemyslid duchy and kingdom; the fourteen dukes of 845 led separate groups whose link to that duchy is unknown"
region = "Bohemia and Moravia, with Silesia (from 1327–35) and Lusatia (from 1319–29 and 1367)"
window = "872–1526 (from the first mention of Bořivoj I, the first historical Přemyslid, to Mohács; focus: the Hussite era, 1419–1471)"
sources = [
  "Annales Fuldenses (9th century)",
  "Cosmas of Prague, Chronica Boemorum (c. 1120)",
  "Laurence of Březová, Hussite Chronicle (1420s)",
  "Military Ordinance of Jan Žižka (1423)",
  "Aeneas Silvius Piccolomini, Historia Bohemica (1458)",
  "Frederick G. Heymann, John Žižka and the Hussite Revolution (1955)",
  "Jan Durdík, Husitské vojenství (1953)",
  "Howard Kaminsky, A History of the Hussite Revolution (1967)",
  "František Šmahel, Husitská revoluce (1993)",
  "Thomas A. Fudge, The Crusade against Heretics in Bohemia (2002)",
  "Lisa Wolverton, Hastening toward Prague (2001)",
  "Jan Długosz, Annales seu cronicae incliti Regni Poloniae (15th century)",
  "Pál Engel, The Realm of St Stephen (2001)",
  "William Urban, The Teutonic Knights: A Military History (2003)",
  "Dominik Tóth, ‘The Wagenburg-warfare in the Army of King Matthias’, East Central Europe: Between the Baltic and the Adriatic 2:1 (2026)",
]

[[bonus]]
text = "Mining Camp technologies free"
kind = "economic"
level = 1
change = "kept"
precedent = "Mining Camp technologies free (Bohemians)"
basis = "Jihlava silver (from c. 1240) underpinned Ottokar II’s power; Kutná Hora, booming from the 1290s, became one of the richest silver mines in Europe and paid for Wenceslas II’s Prague groschen (1300) and the Luxembourg court. There was also gold at Jílové and Kašperské Hory. The groschen, the game’s team bonus (Markets work +80% faster), is placed here, as the coin of this silver: struck from Kutná Hora silver, of high quality in its first decades and later debased, markedly under Wenceslas IV and in the Hussite years, it circulated across Central Europe as a trade coin and was imitated by neighbouring mints (Meissen, Kraków), while Prague’s Týn court (Ungelt) received foreign merchants (see [[dropped]])."
relevance = "Silver made Bohemia the richest kingdom of the region and financed both the Přemyslid expansion and Charles IV’s imperial Prague."

[[bonus]]
text = "Blacksmiths and Universities cost -100 wood"
kind = "economic"
level = 1
change = "kept"
precedent = "Blacksmiths and Universities cost -100 wood (Bohemians)"
basis = "Charles IV founded the University of Prague in 1348, the first in Central Europe; Jan Hus was its rector in 1409–10, and the reform movement grew out of its masters. The Blacksmith half is more generic (Bohemian metalworking and armourers)."
relevance = "The Hussite revolution began among the masters of Prague University; without it the civ’s defining movement has no cradle. The bonus passes on its University half; the Blacksmith half is a generic detail."

[[bonus]]
text = "Spearman-line deals +25% bonus damage"
kind = "military"
level = 1
change = "kept"
precedent = "Spearman-line deals +25% bonus damage (Bohemians)"
basis = "Hussite foot soldiers used long-bladed spears (sudlice), halberds, hooks and iron-shod flails from the wagons to pull down and kill horsemen (Durdík 1953). The flail was the emblematic weapon, so the Spearman-line is an approximation."
relevance = "Peasant infantry defeating knightly cavalry is the core of the Hussite military achievement against five crusades."

[[bonus]]
text = "Fervor and Sanctity affect Villagers"
kind = "other"
level = 1
change = "kept"
precedent = "Fervor and Sanctity affect Villagers (Bohemians)"
basis = "Hussite piety was lay piety: Utraquism gave the chalice, until then reserved to the clergy, to every communicant (from 1414), and the Taborites organised whole communities of peasant ‘warriors of God’ (Kaminsky 1967). Monastery upgrades applying to Villagers mirror that extension of clerical privilege to the laity."
relevance = "The lay chalice was the symbol of the whole movement and of the Utraquist church that lasted until 1620."

[[bonus]]
text = "Chemistry and Hand Cannoneer available in Castle Age"
kind = "military"
level = 1
change = "kept"
precedent = "Chemistry and Hand Cannoneer available in Castle Age (Bohemians)"
basis = "The Hussites were among the first to use hand firearms (píšťala) systematically: from the early 1420s (the breakout at Kutná Hora, 1421–22) and in large numbers by the later 1420s, ahead of most of Europe (Durdík 1953)."
relevance = "Early mass firearms are a large part of why Hussite armies won, and the píšťala is the civ’s best-known contribution to military history."

[team_bonus]
text = "Gunpowder Units train +25% faster"
level = 1
change = "new"
replaces = "Markets work +80% faster"
precedent = "Gunpowder Units train +25% faster (Turks team bonus; the Turks’ design gives it up and the Vietnamese design takes it). Identical team-wide effects count once per team (RULES 6.16.12)."
basis = "The Czech mercenaries: after the Hussite wars, Czech companies, veterans of the wagon fort and the handgun, sold their skills to the neighbours and carried Hussite warfare across Central Europe. Jan Jiskra of Brandýs held Upper Hungary with Czech companies from 1440 and entered King Matthias’ service in 1462, and the Hungarian armies took over the war wagon (Engel 2001; Tóth 2026); in 1433 the Orphans’ field army marched with the Polish army against the Order to the Baltic coast near Danzig (Długosz); in the Thirteen Years’ War (1454–66) Czech companies fought on both sides, and in 1457 the Order’s unpaid mercenaries, many of them Czech under Oldřich Červonka, sold Marienburg, the Order’s capital, to the Polish king (Długosz; Urban 2003). Allies who trained gunpowder troops faster stand for hired Czech handgunners and gunners: a trait that benefited neighbours, mercenaries being one of the cases RULES 6.2 names. It replaces the groschen, a weaker case for the team bonus (see [[dropped]]). The pattern of the Italians’ and Goths’ designs (allies training another civ’s unit, here the Hussite Wagon) is not used: the Magyars’ design already gives the wagon to Hungary through its Black Army tech, and the game’s own team effect fits the handgun as well as the wagon fort."
relevance = "Czech companies were the main channel through which the Hussite military revolution, the wagon fort and the massed handgun, reached Hungary, Poland and the Teutonic Order."
contested = "How much of the Hussite way of fighting the neighbours actually adopted: Hungarian armies took over the wagons but used wagon forts in a secondary, mainly defensive role (Tóth 2026)."

[[unique_unit]]
name = "Hussite Wagon"
model = "Hussite Wagon"
building = "Castle"
level = 1
change = "kept"
basis = "The Hussite wagon fort (vozová hradba): reinforced wagons with boards, chained together, crewed by crossbowmen, handgunners and flailmen, behind which the infantry was safe from missiles and cavalry. Žižka’s Military Ordinance (1423) is mainly a code of discipline and march; the crews are known from later sources and reconstructions (Durdík 1953). The real fort worked as a closed, static formation, not as single vehicles; Wagenburg Tactics’ armour stands for the closed fort. Shared with the Magyars through their Black Army tech."
relevance = "The wagon fort is the signature of Hussite warfare and was copied across Central Europe."

[[unique_unit]]
name = "Houfnice"
model = "Organ Gun"
building = "Siege Workshop"
level = 1
change = "changed"
replaces = "Houfnice (upgrade of the Bombard Cannon: long-range anti-building gun that cannot attack at close range)"
basis = "In the Hussite wagon fort the houfnice and the lighter tarasnice fired stones or scattershot at close range into massed troops (houf, ‘crowd’) (Durdík 1953); through German Haubitze and Dutch houwitser the name gave English ‘howitzer’. The game made it a super-bombard with long range and a minimum range, the opposite of its role; the Organ Gun profile (a gunpowder piece firing volleys at groups of units) is the closest existing match, though the Organ Gun is multi-barrelled and weak against cavalry, while the houfnice was a single short barrel used from the wagon fort against both infantry and horse (own art is N3). Trained at the Siege Workshop from the Imperial Age, where the old Houfnice upgrade stood, with its Elite upgrade at the Castle as for the Organ Gun. The Bombard Cannon stays as the siege gun. The name also belongs to a different game unit, the Houfnice (its own model), the Bombard Cannon upgrade this design replaces: a reused name, allowed with a note on the site (RULES 6.16.15); the site keys units by model. Decision: the unit is rebuilt in N1 rather than left for N2, since the game’s long-range super-bombard inverts the houfnice’s role; a Castle Age Houfnice beside the Castle Age Hand Cannoneer would be too large a power shift, so it keeps the Imperial Age."
relevance = "The houfnice stands for Hussite field artillery, among the first guns used systematically in open battle; the name’s survival in ‘howitzer’ adds fame."

[[unique_tech]]
name = "Wagenburg Tactics"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Gunpowder Units move +10% faster; Hussite Wagons +4 melee armor"
level = 2
change = "changed"
replaces = "Wagenburg Tactics (Gunpowder Units move +10% faster)"
precedent = "Effect 1: Wagenburg Tactics (Gunpowder Units move +10% faster) (Bohemians); effect 2: Ironclad (Siege Weapons +4 melee armor) (Teutons), narrowed to Hussite Wagons. A new tech under RULES 6.5, since an effect is added: the existing tech keeps only the march, which the analysis rates ‘stretched’ for a static wagon fort, and no existing tech gives the closed fort."
basis = "Hussite field armies marched in parallel wagon columns that could close into a fort quickly (reconstructed from later 15th-century sources by Durdík 1953; the 1423 Ordinance sets the order and discipline of the march) and ranged far on their raids (the ‘spanilé jízdy’ of 1427–33 reached the Baltic). Once closed, the chained, boarded wagons held off cavalry and storming infantry, as at Ústí nad Labem (1426). The old effect kept only the march; the added armour gives the static fort, which is worth a new tech (level 2) rather than the game’s speed-only effect. The name stays Wagenburg, the German term of the Hussites’ enemies and of modern scholarship, which the game already uses; the Czech is vozová hradba."
relevance = "Žižka’s wagon-fort tactics, adopted from 1420, carried the Hussites through five crusades (1420–31), all of them defeated, and Žižka never lost a battle."

[[unique_tech]]
name = "Hussite Reforms"
building = "Monastery"
kind = "civil"
age = "Imperial"
effect = "Monks and Monastery technologies gold cost is replaced by food cost"
level = 1
change = "changed"
replaces = "Hussite Reforms (Castle unique tech, same effect)"
precedent = "Hussite Reforms (Monks and Monastery technologies gold cost is replaced by food cost) (Bohemians): moved to the Monastery, identical effect"
basis = "The Four Articles of Prague (1420) demanded free preaching, the chalice for the laity, apostolic poverty for the clergy and the punishment of public sins by the secular power; the Diet of Čáslav (1421) adopted them as the programme of the land, and Church estates passed largely to the nobility and the towns (Kaminsky 1967; Šmahel 1993). Three of the four articles are religious demands, so the tech belongs at the Monastery (RULES 6.2); a clergy that costs no gold is a neat translation of the apostolic poverty the Articles demanded. The label keeps the game’s ‘Gunpowder and Monk’: priests such as Prokop the Great led the Hussite armies and the lay chalice was the movement’s symbol, although the Taborites sacked many monasteries in 1419–21."
relevance = "The Four Articles defined the Hussite revolution and the Utraquist settlement of Bohemia (Compacts of Basel, 1436)."

[[unique_tech]]
name = "Nové Město"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Town Centers +100% HP and work +10% faster"
level = 2
change = "new"
precedent = "Town Centers and Docks +100% HP and work +5/10/15/20% faster in Dark/Feudal/Castle/Imperial Age (Persians), narrowed to Town Centers at +10%; the Armenians’ and Bengalis’ designs use the same pattern for their capitals, and the Maya’s at +15%"
basis = "On 8 March 1348 Charles IV founded the New Town of Prague, a planned town of broad streets and great markets (the Horse and Cattle Markets) with its own walls beside the Old Town; with the castle, the Old Town and the Lesser Town it made Prague the imperial residence and one of the largest cities of Central Europe, and the defenestration at its town hall on 30 July 1419 began the Hussite revolution (Kaminsky 1967; Šmahel 1993). The same programme of 1348 founded the University (see the University bonus) and defined the Lands of the Bohemian Crown. Town Centers that are sturdier and work faster stand for the walled, growing capital. A new tech (level 2): no existing unique tech represents a planned capital, and the Four Articles cannot be split into a second tech (RULES 6.3). Chosen over Wenceslas II’s mining code (Ius regale montanorum, c. 1300) and groschen reform, which would add a third silver element beside the mining passive."
relevance = "Charles IV’s Prague, with its New Town, cathedral, bridge and university, is the image of Bohemia’s golden age, and the New Town became the stronghold of radical Hussitism."

[tree]
add = ["Plate Barding Armor", "Treadmill Crane"]
remove = ["Cannon Galleon", "Elite Cannon Galleon", "Galleon", "Carrack", "Galleon, Fast Fire Ship and Carrack", "Siphons", "Incendiaries"]

[tree.basis]
"Plate Barding Armor" = "Before the Hussites, Bohemia fielded first-rate armoured cavalry: Ottokar II won at Kressenbrunn (1260) with his heavy horse and fell at the Marchfeld (1278), and John the Blind died charging with his knights at Crécy (1346). The last cavalry armour upgrade (held by 36 of the game’s 56 civs) restores part of that kingdom without changing the Hussite profile. Bloodlines is not added: the evidence is about armour, not horse breeding."
"Treadmill Crane" = "Charles IV was a great builder: Karlštejn (from 1348), the New Town of Prague, the Charles Bridge (from 1357) and St Vitus’ cathedral under Peter Parler."
"Cannon Galleon" = "Bohemia was landlocked: no gun-armed warships."
"Elite Cannon Galleon" = "As Cannon Galleon."
"Galleon" = "Navy (RULES 6.16.1): Bohemia was landlocked and had no war fleet of its own, so the civ keeps the basic navy (Galley-line to War Galley, Fire Galley and Fire Ship, Hulk and War Hulk, demolition ships and the generic Dock techs), with no substitute siege warship."
"Carrack" = "As Galleon."
"Galleon, Fast Fire Ship and Carrack" = "Nothing is left for this upgrade once the Galleon and Carrack are removed (the Bohemians already lacked the Fast Fire Ship)."
"Siphons" = "Named after the Byzantine fire siphon, a state secret never given to other nations (De Administrando Imperio 13); no ship-borne liquid-fire weapon is documented for this civ."
"Incendiaries" = "Requires Siphons, which this design removes."

[[rename]]
from = "Elite Organ Gun"
to = "Elite Houfnice"
level = 1
basis = "Follows the unique unit (Organ Gun → Houfnice), for the Bohemians only; the Portuguese design drops the Organ Gun."

[architecture]
set = "Central European"
change = "changed"
replaces = "Eastern European"
basis = "Historical fit, the codex criterion (RULES 6.16.8): Bohemia built in the Latin Romanesque and Gothic of the Empire’s lands. Prague was the imperial residence under Charles IV, its Gothic was that of Peter Parler’s workshop (from Swabia: St Vitus’ cathedral, the Charles Bridge tower), and its mining and royal towns were largely founded under German law, with German-speaking burghers. Poland and Hungary also built Latin Romanesque and Gothic, so the Poles and Magyars move to the set on the same criterion."

[[dropped]]
item = "Markets work +80% faster"
kind = "team_bonus"
reason = "The groschen is a real trait that served the neighbours’ trade, but a weaker one than the Czech mercenaries, who carried the Hussite wagon fort and handguns to Hungary, Poland and the Order; a civ has one team bonus. The coin itself is placed in the basis of the mining passive, as the money of Kutná Hora silver, and its effect stays in the game with the Aztecs’ design."
