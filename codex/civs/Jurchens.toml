civ = "Jurchens"
name = "Jurchens"
status = "draft"
label = "Cavalry and Gunpowder civilization"
summary = "The Jurchens and their Jin dynasty (1114–1234), a forest people of Manchuria who conquered the Liao and north China: hunting, shock cavalry, the Iron Pagoda, siegecraft, fortifications, fire lances and the Kaifeng bombs are kept; the meng'an mouke household army replaces Fortified Bastions, Han conscript infantry replaces the gunpowder line-of-sight team bonus, and the anachronistic counterweight trebuchet, bombard and rocket carts give way to traction trebuchets and light pao, while horse archery gains Thumb Ring and Parthian Tactics."
ideas = [
  "N2: Light flanking cavalry (guaizi ma) supporting the Iron Pagoda, if the contested reading of the Song sources is accepted.",
  "N2: Traction Trebuchets that throw iron bombs (zhentianlei), with blast damage against units and buildings, as at Qizhou (1221) and Kaifeng (1232).",
  "N3: The jiehao, the Jin trench-and-rampart border lines across Inner Mongolia and Manchuria, as a unique cheap earthwork wall.",
  "N2: Jingkang artisans: a tech that cheapens siege and gunpowder units after enemy production buildings are captured or destroyed, after the craftsmen, engines and books carried off from Kaifeng in 1127.",
  "N2: Gyrfalcons (haidongqing): a scouting and hunting tech; the Liao's falcon levies on the Jurchens were one cause of the revolt of 1114.",
  "N3: Meng'an mouke households: Houses that supply or train cavalry, for a social unit that was also a military unit.",
]
contested = [
  "The “chained horses” (guaizi ma linked in threes) of the Song accounts of 1140: doubted by the Qianlong emperor and rejected by Deng Guangming as a misreading; whether guaizi ma means flanking cavalry is itself debated.",
  "The scale of Yue Fei's victories in 1140, possibly inflated by later Song historiography.",
  "The “sinicisation” of the Jin (Ho Ping-ti against E. Rawski; J. Tao; Hok-lam Chan).",
  "Whether the Jin already used gunpowder weapons at Kaifeng in 1126–1127, and whether the “flying fire” of 1232 included true rockets.",
  "Responsibility for the breakdown of the Song–Jin Alliance Conducted at Sea (1120–1123).",
  "The Steppe Lancer is kept for the Jin lancers and for the Khitan and Xi horsemen they enlisted, although the Jurchens themselves were a forest people, not a steppe one.",
]
open_questions = [
  "“Units receive -50% friendly fire damage” is dropped as unfounded, leaving four bonuses; Bomb Throwers and Thunderclap explosions now hurt friendly units at full strength. Accept, or keep it as a game convention for the bomb-throwing civ?",
  "Fortified Bastions is replaced by Meng'an Mouke. Alternative: keep the regeneration tech renamed “Jiehao” (the Jin border works) and make Meng'an Mouke a fifth passive bonus.",
  "Grenadier is renamed Bomb Thrower (plain English, like the game's Fire Lancer and Rocket Cart). Prefer a Chinese term such as “Zhentianlei Thrower”?",
  "The Steppe Lancer is kept (Jin lancers and Khitan/Xi auxiliaries). Remove it to set the forest Jurchens further apart from the steppe civs?",
  "Mangonel and Onager are read as light traction trebuchets (the medieval sense of “mangonel”). Rename them for the East Asian civs, e.g. “Whirlwind Trebuchet” after the Wujing Zongyao's xuanfeng pao, although the art shows a torsion engine?",
  "Team bonus: Barracks work +20% faster (Han conscript infantry). Alternative: Stables work +20% faster, for the household cavalry levy.",
  "The Jin navy was weak (destroyed at Tangdao and Caishi in 1161); the Lou Chuan and Galleon stay, but the Lou Chuan leaves Thunderclap Bombs. Remove the Lou Chuan as well?",
]

[profile]
entity = "The Jurchen people (Nüzhen) under the Wanyan clan and their Jin dynasty"
region = "Forests and river valleys of Manchuria (the Songhua and Anchuhu basins); after 1127 north China to the Huai River"
window = "1114–1234"
sources = [
  "Toghto et al., Jin shi (1344)",
  "Xu Mengxin, Sanchao beimeng huibian (1194)",
  "Song shi (1345)",
  "Zhao Yurong, Xinsi Qi Qi lu (account of the siege of Qizhou, 1221)",
  "Yue Ke, Jin Tuo cuibian (13th century)",
  "Jing-shen Tao, The Jurchen in Twelfth-Century China (1976)",
  "H. Franke, “The Chin Dynasty”, Cambridge History of China, vol. 6 (1994)",
  "H. Tillman and S. West (eds.), China under Jurchen Rule (1995)",
  "Hok-lam Chan, Legitimation in Imperial China: Discussions under the Jurchen-Chin Dynasty (1984)",
  "T. Andrade, The Gunpowder Age (2016)",
  "J. Needham, Science and Civilisation in China, vol. 5 part 7, The Gunpowder Epic (1986)",
]

[[bonus]]
text = "Meat of hunted and livestock animals doesn't decay"
kind = "economic"
level = 1
change = "kept"
precedent = "Meat of hunted and livestock animals doesn't decay (Jurchens)"
basis = "Chinese accounts of their ancestors, the Mohe, describe a forest people who hunted, fished and raised pigs, and the Jin shi says that in peacetime the Jurchen men farmed, fished and hunted; the great collective hunts of the Jin court doubled as military training (Tao 1976). An abstraction."
contested = "The settled “civilised Jurchen” (shu Nüzhen) of the south were farmers; the bonus reflects the hunting and stock-raising north."

[[bonus]]
text = "Mounted Units attack +25% faster starting in Feudal Age"
kind = "military"
level = 1
change = "changed"
replaces = "Mounted Units and Fire Lancers attack +25% faster starting in Feudal Age"
precedent = "Mounted Units and Fire Lancers attack +25% faster starting in Feudal Age (Jurchens); Stirrups: Cavalry attacks +33% faster (Bulgarians)"
basis = "The early Jin army was overwhelmingly cavalry and won its first wars by shock: Aguda routed much larger Liao forces at Ningjiang (1114) and Hubudagang (1115), and a saying attributed to the Liao held that once the Jurchen reached ten thousand men no one could withstand them (Tao 1976; Franke 1994). Fire Lancers leave the bonus: the fire lance was a single-shot weapon, so a faster attack has no basis."

[[bonus]]
text = "Siege Engineers available in Castle Age"
kind = "military"
level = 1
change = "kept"
precedent = "Siege Engineers available in Castle Age (Jurchens)"
basis = "The Jin mastered Liao and Song siegecraft within a decade: they took Liao capitals in 1120–1122, besieged Taiyuan (1125–1126) and Kaifeng (1126–1127) with trebuchet batteries, and after the fall of Kaifeng (the Jingkang incident, 1127) carried off its craftsmen, engines and books (Franke 1994)."

[[bonus]]
text = "Siege and Fortification upgrades cost -75% wood and research +100% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Siege and Fortification upgrades cost -75% wood and research +100% faster (Jurchens)"
basis = "The Jin dug and raised the longest border works of the 12th century, the trench-and-rampart lines (jiehao) across Inner Mongolia and Manchuria against the Tatars and Mongols (mainly in the second half of the century), and held Kaifeng against the Mongols for months in 1232–1233 (Franke 1994)."

[team_bonus]
text = "Barracks work +20% faster"
level = 1
change = "new"
replaces = "Gunpowder Units +2 line of sight"
precedent = "Barracks work +20% faster (Goths team bonus)"
basis = "After the conquest of the north the Jin relied on drafted infantry, the qianjun (“signed-up troops”), levied from Han, Bohai and Khitan households to fight beside the Jurchen cavalry; Wanyan Liang's mass levies for the invasion of 1161 provoked revolts, the Khitan rising among them (Tao 1976; Franke 1994). The line-of-sight bonus for gunpowder units had no identifiable basis."

[[unique_unit]]
name = "Iron Pagoda"
model = "Iron Pagoda"
building = "Castle"
level = 1
change = "kept"
basis = "Song accounts of the battles of Shunchang and Yancheng (1140) describe the guard of Wuzhu (Wanyan Zongbi) as heavily armoured cavalry in double armour, called the “iron pagoda” (tie futu) (Song shi; Yue Ke, Jin Tuo cuibian). Jin heavy cavalry is well attested; the name is Song, not Jurchen."
contested = "The chained-horses story attached to it is doubtful (see the contested list); the melee-blocking mechanic is a game abstraction of double armour."

[[unique_unit]]
name = "Bomb Thrower"
model = "Grenadier"
level = 1
change = "changed"
replaces = "Grenadier"
basis = "The Jin used gunpowder bombs in their last wars: iron-cased bombs at the siege of Qizhou (1221, described by Zhao Yurong) and the “heaven-shaking thunder” (zhentianlei) at Kaifeng in 1232, lowered on iron chains onto Mongol sappers or thrown by trebuchets, whose blast the Jin shi says pierced iron armour (Andrade 2016). “Grenadier” is a 17th-century European word; the plain English name follows the game's own Fire Lancer and Rocket Cart."
contested = "How many bombs were thrown by hand rather than by trebuchet or dropped from walls is unclear; the hand-thrower is an abstraction."

[[unique_tech]]
name = "Meng'an Mouke"
age = "Castle"
effect = "Mounted Units cost -15% food and train +25% faster"
level = 1
change = "new"
replaces = "Fortified Bastions (Fortifications and Town Centers regenerate 500 HP per minute)"
precedent = "Kshatriyas: Military Units cost -25% food (Gurjaras); Mounted Archers train +25% faster (Magyars team bonus); Camel and Elephant Units train +25% faster (Gurjaras team bonus)"
basis = "In 1114 Aguda organised his people into mouke of 300 households and meng'an of ten mouke, units that were at once social, fiscal and military. The Jin shi (Bing zhi) says that every able-bodied man was a soldier, farming, fishing and hunting in peace, and that when troops were levied the households supplied the weapons and provisions of foot and horse themselves; the households were later settled across north China as military colonies (Tao 1976). Cheaper, faster-raised horsemen stand for this self-provisioned household levy. Fortified Bastions had no specific episode behind it and a name from 16th-century European fortification; Jin fortification is carried by the passive bonus."

[[unique_tech]]
name = "Thunderclap Bombs"
age = "Imperial"
effect = "Bomb Throwers and Mangonel-line detonate when defeated; projectiles produce additional explosions"
level = 1
change = "changed"
replaces = "Thunderclap Bombs (Rocket Carts, Grenadiers and Lou Chuans detonate when defeated; projectiles produce additional explosions)"
precedent = "Thunderclap Bombs: Rocket Carts, Grenadiers and Lou Chuans detonate when defeated; projectiles produce additional explosions (Jurchens); the same effect moved from the Rocket Cart to the comparable Mangonel-line (both Siege Workshop blast weapons)"
basis = "The iron bombs of Qizhou (1221) and the zhentianlei of Kaifeng (1232), whose roar, says the Jin shi, was heard a hundred li away and whose blast pierced iron armour; many were thrown by traction trebuchets (Needham 1986; Andrade 2016). The effect moves from the anachronistic Rocket Carts to the Mangonel-line, which here stands for the light traction pao that threw them. The Lou Chuans leave the list: the Jin fleets were destroyed at Tangdao and Caishi (1161) by Song fire arrows and bombs, not the reverse."
contested = "“Thunderclap” (pili) properly names the older Song soft-cased bomb; the Jin iron bomb was the zhentianlei (“heaven-shaking thunder”)."

[tree]
add = ["Traction Trebuchet", "Mangonel", "Onager", "Thumb Ring", "Parthian Tactics", "Long Swordsman"]
remove = ["Trebuchet", "Bombard Cannon", "Rocket Cart", "Heavy Rocket Cart"]

[tree.basis]
"Traction Trebuchet" = "The Jin used man-powered traction trebuchets in mass at Kaifeng (1126–1127) and in its defence in 1232, where they threw iron bombs; it replaces the counterweight Trebuchet as heavy siege artillery (RULES 6.6), as for the out-of-scope Three Kingdoms."
"Mangonel" = "Substitute for the Rocket Cart (RULES 6.6): in many medieval sources “mangonel” meant the traction trebuchet, and the light, quick-turning “whirlwind” pao of the Wujing Zongyao (1044) was the Chinese anti-personnel engine, which by the Jin period also threw gunpowder bombs."
"Onager" = "Upgrade of the Mangonel substitute, as for most civs."
"Thumb Ring" = "Jurchen warriors were horse archers as well as lancers, as the game's own history text says; the Manchu thumb ring (banzhi), heir to Jurchen archery, is one of the emblems of East Asian thumb-draw archery."
"Parthian Tactics" = "Jurchen horsemen were armoured and fought with both bow and lance (Tao 1976); the civ had Heavy Cavalry Archers without the mounted-archer armour and tactics tech."
"Long Swordsman" = "After the conquest the Jin army relied heavily on drafted Han infantry (qianjun) and on Khitan and Bohai contingents; an all-cavalry army is true only of c. 1114–1130."
"Trebuchet" = "The counterweight trebuchet reached China in 1273, four decades after the fall of the Jin (1234)."
"Bombard Cannon" = "The oldest securely dated metal-barrelled guns are Yuan (c. 1288–1298); a possibly earlier Tangut bronze piece from Wuwei is of disputed date. The Jin fought with fire lances and bombs, not cannon."
"Rocket Cart" = "Multiple-rocket carts are Ming (and the Korean hwacha, 1409/1451); whether the Jin “flying fire” of 1232 was a true rocket is disputed."
"Heavy Rocket Cart" = "Upgrade of the removed Rocket Cart."

[[rename]]
from = "Grenadier"
to = "Bomb Thrower"
level = 1
basis = "Same unit. “Grenadier” comes from the French grenade companies of the 17th century; the Jin weapon was the gunpowder bomb (huopao, zhentianlei)."

[architecture]
set = "East Asian"
level = 1
change = "kept"
basis = "The Jin built their capitals on Chinese models: Shangjing (near Acheng), Zhongdu (Beijing, from 1153) and, at the end, Kaifeng; the Zhaocheng Tripitaka was printed in Jin territory (c. 1149–1173)."

[[dropped]]
item = "Units receive -50% friendly fire damage"
kind = "bonus"
reason = "Unfounded: a balance device for the explosive units, with no historical basis; not replaced, so the civ keeps four bonuses (see open questions)."
