civ = "Bulgarians"
name = "Bulgarians"
status = "draft"
label = "Cavalry and Siege civilization"
summary = "The First (681–1018) and Second (1185–1396) Bulgarian Empires: Konnik, Krepost and Krum's siege discount are kept; the swordsman identity gives way to the Balkan passes, Byzantine tribute, armoured cavalry of the khanate's ranks (Bagains), the Council of Preslav as the Town Center tech, Kaloyan's Cuman allies (Cuman Alliance) and a Slavonic-Orthodox team bonus; the monastery tree is restored and the architecture becomes Mediterranean."
ideas = [
  "N2: Pass ambush mechanic (Varbitsa 811, Tryavna 1190): military units standing next to forests are hidden from enemies beyond a few tiles.",
  "N2: A Krum siege-train tech (Mesembria 812; the engines and the iron-bound wagons to carry them prepared against Constantinople in 814, Scriptor incertus): Siege Workshop units built faster, Battering Rams carry more Infantry.",
  "N2: Crossbowman for the Second Empire only (13th–14th-century Latin and Venetian contacts); N1 cannot limit an item to one phase of the civ.",
  "N2: Replace the Konnik's dismount mechanic (a game invention) with an armoured boyar cavalry mechanic based on the inventory inscriptions.",
  "N3: Earthworks (the Erkesia dyke in Thrace, Pliska's 23 km² outer enclosure) as a unique wall.",
  "N3: A Balkan-Byzantine architecture set shared with the Byzantines: medieval Bulgarian churches (the Round Church of Preslav, Boyana, the churches of Tarnovo and Nesebar) were Byzantine-type brick and stone.",
  "N3: Split into First Empire (steppe khanate) and Second Empire (Asen and Shishman tsardom) variants.",
]
contested = [
  "Proto-Bulgar ethnogenesis: Oghur Turkic (majority view) or Iranian/Pamiri (popular in Bulgaria, minority in scholarship).",
  "The introduction of the stirrup into Europe: by the Avars (consensus) or by the Proto-Bulgars (minority national thesis).",
  "Exact meaning of the titles bagain, boila and kana subigi (T. Slavova, 2009).",
  "Origin of the Asen brothers: Bulgarian, Vlach or Cuman (Madgearu, The Asanids, 2016).",
  "Authorship of the Cyrillic alphabet (Clement of Ohrid, Naum or Constantine of Preslav), and which script Chernorizets Hrabar defended (most read it as Constantine-Cyril's Glagolitic).",
  "Whether Old Church Slavonic krěpostĭ already meant “fortress” or mainly “strength, firmness”; the sense “fortress” for krepost may be modern.",
  "The campaign against Constantine IV is usually dated 680 and the peace 680 or 681 (conversion of Theophanes' annus mundi); 681 is the conventional foundation date.",
  "The degree of urbanisation of Pliska: a city or a steppe-type palace-camp enclosure.",
  "The “Council of Preslav” of 893 is a modern label: its decisions (Simeon's accession, the move to Preslav, Slavonic as the language of the church) are reconstructed from later and indirect sources.",
]
open_questions = [
  "“Militia-line upgrades free” and Bagains as Militia armour gave the Bulgarians a swordsman identity that no source supports; this draft drops it. Does the owner want to keep some infantry flavour for gameplay (e.g. Spearman-line and Skirmisher upgrades free, for the Slavic spear and javelin levies)?",
  "Kipchak overlap: the Bulgarians get Kipchaks through Cuman Alliance (Cuman Mercenaries renamed, identical effect, so as not to copy the Cumans' tech name verbatim; the Lithuanians did the same with Lipka Tatars), and the Georgians in this region get the Kipchak unit. History supports both (allies of the Asen dynasty; settlers of David IV). Acceptable, or should the Bulgarians get an exclusive Imperial tech instead (e.g. the Krum siege train, an N2 idea)?",
  "First-Empire horse archery, the best-documented Proto-Bulgar military trait, still has no bonus (Cuman Alliance carries the Second Empire's horse archers). N1 options: “Thumb Ring, Parthian Tactics free” (Tatars) or “Cavalry Archers cost -10/20% in Castle/Imperial Age” (Huns), either instead of the elevation bonus or as a fifth bonus.",
  "The elevation bonus (Tatars' effect) replaces the analysis's forest-ambush proposal, which needs a new mechanic (N2, see the ideas). Accept a bonus that partly duplicates the game's generic elevation advantage?",
  "Architecture: changed to Mediterranean, which is historically closer to Pliska, Preslav and Tarnovo than the onion-domed, partly wooden Eastern European set. All four civs of this region now share it. Keep Eastern European instead for visual distinctness?",
  "No siege warship: the Cannon Galleon is removed (Bulgaria had no war fleet; only the Dobruja despotate kept a few ships in the 1360s–1370s), so on water maps coastal buildings fall only to Demolition Ships and landed siege. Acceptable, or keep a non-gunpowder Catapult Galleon? Siphons also stays out: Krum captured siphons and liquid fire at Mesembria in 812 (Theophanes), but no source records Bulgarian use.",
  "The Council of Preslav sits at the Town Center as an act of state (it changed the ruler, the capital and the language of church and state), although its effect is religious; it shares the effect of the Saxons' Clerical Recruitment. Block Printing stays under its generic name, like the neighbours. Agree?",
  "Rename the Konnik to “Bolyar” (the mounted aristocracy), as the analysis proposes? Not done here: it would clash with the Rus' Boyar, and konnik (“horseman”) is acceptable.",
  "Keep the name Krepost, given the doubt about its medieval meaning, or use grad (the usual medieval word for a fortified town)?",
]

[profile]
entity = "First Bulgarian Empire (khanate, tsardom from Simeon) and Second Bulgarian Empire (Asen and Shishman dynasties)"
region = "Lower Danube, Balkan Mountains, Thrace and Macedonia"
window = "681–1018 and 1185–1396"
sources = [
  "Theophanes the Confessor, Chronographia (c. 815; tr. C. Mango & R. Scott, 1997); Nikephoros, Breviarium",
  "Scriptor incertus de Leone Armenio (on Krum)",
  "The anonymous Chronicle of 811 (ed. I. Dujčev, Travaux et Mémoires 1, 1965)",
  "Proto-Bulgarian inscriptions (V. Beševliev, Die protobulgarischen Inschriften, 1963)",
  "Theophylact of Ohrid, Life of Clement",
  "Leo the Deacon, History; John Skylitzes, Synopsis Historion; Niketas Choniates, History",
  "Geoffroy de Villehardouin, The Conquest of Constantinople; Robert de Clari",
  "F. Curta, Southeastern Europe in the Middle Ages 500–1250 (2006)",
  "J. V. A. Fine, The Early Medieval Balkans (1983) and The Late Medieval Balkans (1987)",
  "P. Stephenson, Byzantium's Balkan Frontier (2000)",
  "A. Madgearu, The Asanids (2016)",
  "D. Obolensky, The Byzantine Commonwealth (1971)",
  "I. Vásáry, Cumans and Tatars (2005)",
  "T. Slavova, “Титулите багаин и багатур в ранносредновековна България”, Eslavística Complutense 9 (2009)",
]

[[bonus]]
text = "Blacksmith and Siege Workshop technologies cost -50% food"
kind = "military"
level = 1
change = "kept"
precedent = "Blacksmith and Siege Workshop technologies cost -50% food (Bulgarians)"
basis = "Krum's siegecraft: an Arab engineer stationed at Adrianople, unpaid by Nikephoros I, deserted to the Bulgars and taught them to build engines, with which Krum took Mesembria (812) and captured siphons and Greek fire (Theophanes); the Scriptor incertus describes the engines prepared against Constantinople in 814. Later rulers kept taking Byzantine fortresses by siege, as Samuel did at Larissa (986) and Kaloyan at Varna (1201). For the Blacksmith: 9th-century inventory inscriptions list armour and helmets issued to named officials (Beševliev, 1963)."
relevance = "Siege capacity turned the khanate from a raiding power into one that took and held Byzantine cities (Mesembria 812, Adrianople 813), and it recurs under Samuel and Kaloyan."

[[bonus]]
text = "Can build Krepost in Castle Age"
kind = "military"
level = 1
change = "kept"
precedent = "Can build Krepost in Castle Age (Bulgarians)"
basis = "A dense network of hill and river fortresses carried the Second Empire: Tsarevets at Tarnovo, Baba Vida at Vidin, Lovech and Ovech, and Asen's fortress near Asenovgrad, strengthened by Ivan Asen II (inscription of 1231). A smaller, cheaper fortress than a Castle is a good abstraction."
relevance = "The Second Empire rose from and lived on its fortress towns, from the revolt of 1185 to the sieges of Tarnovo (1393) and Vidin (1396)."
contested = "The name: krepost is the modern Bulgarian word for fortress; medieval texts prefer grad."

[[bonus]]
text = "Receive +100 gold when advancing to the next Age"
kind = "economic"
level = 1
change = "new"
replaces = "Town Centers cost -50% stone"
precedent = "Receive +100 gold and +100 food when advancing to the next Age (Ethiopians); Receive +200 wood when advancing to the next Age (Dravidians)"
basis = "Byzantine payments repeatedly bought peace with Bulgaria: annual tribute to Asparuh after 680/681 (Theophanes), gifts and the title of kaisar for Tervel (705), garments and red skins worth 30 lb of gold under the treaty of 716, which Krum demanded to renew in 812, and annual payments under the peace of 927, whose cancellation in 965/966 brought war (Theophanes; Fine, 1983). A gold grant at each Age abstracts these recurring subsidies. The stone discount on Town Centers had only a weak link with Pliska and Preslav."
relevance = "For three centuries (681–965) the First Empire's relations with Byzantium turned on tribute, which financed the khans and decided war and peace."
contested = "The Second Empire received no comparable tribute."

[[bonus]]
text = "Units deal +25% damage when fighting from higher elevation"
kind = "military"
level = 1
change = "new"
replaces = "Militia-line upgrades free"
precedent = "Units deal +25% damage when fighting from higher elevation (Tatars)"
basis = "The Balkan range was Bulgaria's rampart and its passes the scene of its great victories. At Varbitsa (811) Krum closed the pass with palisades and fell on Nikephoros I's camp at dawn (Theophanes; Chronicle of 811); at the Gates of Trajan (986) Samuel's army attacked Basil II's retreating column in the pass (Leo the Deacon); at Tryavna (1190) the Asen brothers attacked Isaac II's army from the heights above the defile (Niketas Choniates). The swordsman bonus is dropped: Slavic infantry fought with spears, javelins and bows, and no source describes Bulgarian heavy swordsmen."
relevance = "Holding the passes of the Haemus decided Bulgaria's survival against Byzantium three times in four centuries (811, 986, 1190); a structural trait of geography and warfare."
contested = "The bonus rewards fighting downhill, which fits Tryavna and the Gates of Trajan better than the palisade trap of Varbitsa."

[team_bonus]
text = "Monasteries work +20% faster"
level = 1
change = "new"
replaces = "Blacksmiths work +80% faster"
precedent = "Monasteries work +20% faster (Lithuanians team bonus)"
basis = "Bulgaria was the workshop of Slavonic Orthodoxy for its neighbours: Boris I (baptised 864/865) received the disciples of Cyril and Methodius in 886, and the schools of Preslav and Ohrid trained clergy and produced the Slavonic books later used in Serbia and Rus'; in the 14th century the Tarnovo school of Patriarch Euthymius again shaped Serbian and Russian letters (Obolensky, 1971; Curta, 2006). Blacksmith speed had no specific Bulgarian basis."
relevance = "The Slavonic liturgy and letters that Bulgaria passed to Serbs and Rus' are its greatest legacy to its neighbours; a clear benefit to others, as RULES 6.2 asks."

[[unique_unit]]
name = "Konnik"
model = "Konnik"
building = "Castle"
level = 1
change = "kept"
basis = "The mounted aristocracy (boilas, later bolyars) was the elite core of Bulgarian armies from the khanate to the Second Empire; konnik is the ordinary Bulgarian word for horseman. Fighting on as infantry when unhorsed is a game mechanic, not a documented Bulgarian speciality."
relevance = "The armoured horseman of the aristocracy was the decisive arm of Bulgarian armies in both empires."

[[unique_tech]]
name = "Bagains"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Konniks (mounted and dismounted) and Knight-line +1 melee/+1 pierce armor"
level = 2
change = "changed"
replaces = "Bagains (Militia-line +5 melee armor), formerly the Imperial Age tech"
precedent = "Silk Armor: Scout Cavalry-line, Steppe Lancers and Cavalry Archers +1 melee/+1 pierce armor (Tatars); Hauberk: Knight-line +1 melee/+2 pierce armor (Sicilians). A new effect for an existing name, so level 2."
basis = "Bagain was a 9th-century Proto-Bulgarian military rank with several grades (Slavova, 2009); inventory inscriptions of the same century list mail coats and helmets recorded against named officials (Beševliev, 1963). The armour therefore goes to the heavy cavalry, the arm of the khanate's elite, not to swordsmen. It moves to the Castle Age slot left by Stirrups, as the First Empire's tech; the dismounted Konnik keeps it because it is the same man, unhorsed."
relevance = "The ranked, state-equipped mounted elite of the 9th-century khanate, attested by its own inscriptions, is what made Krum's and Omurtag's armies; a datable military institution at the Castle."
contested = "That bagains served as armoured cavalry is inferred from the mounted character of the Proto-Bulgar elite; the inscriptions give only the rank."

[[unique_tech]]
name = "Council of Preslav"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Monks +1 conversion range; train +33% faster"
level = 1
change = "new"
precedent = "Clerical Recruitment (Monks +1 conversion range; train +33% faster) (Saxons): an existing unique tech, shared, moved to the Town Center and renamed, identical effect"
basis = "In 893 Boris I deposed his son Vladimir-Rasate, Simeon was enthroned, the capital moved from Pliska to Preslav and Slavonic replaced Greek as the language of the Bulgarian church, with clergy trained by Clement and Naum replacing the Greek clergy; Clement is said to have trained some 3,500 pupils (Theophylact of Ohrid, Life of Clement). The Preslav and Ohrid schools translated and copied Greek religious texts into Slavonic, and Chernorizets Hrabar's On the Letters defended Constantine-Cyril's Slavonic letters against those who held that only Hebrew, Greek and Latin were fit for scripture (Curta, 2006; Obolensky, 1971)."
relevance = "The adoption of Slavonic as the language of church and state fused Bulgars and Slavs into one people and made Bulgaria the source of Slavia Orthodoxa; few acts weighed more on its identity."
contested = "See the civ-level note on the “Council of Preslav” as a modern label."

[[unique_tech]]
name = "Cuman Alliance"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "All team members can train 5 free Elite Kipchaks per Castle"
level = 1
change = "new"
precedent = "Cuman Mercenaries (All team members can train 5 free Elite Kipchaks per Castle) (Cumans): an existing unique tech, shared and renamed, identical effect"
basis = "The Cumans were structural allies of the Asen dynasty, not hired soldiers: Peter and Asen brought Cuman troops from beyond the Danube in 1186 (Choniates); Cuman horse archers and a feigned retreat won Kaloyan's victory over the Latin Empire at Adrianople (14 April 1205), where Emperor Baldwin I was captured (Villehardouin; Robert de Clari); the Terter dynasty (1280–1323) was of Cuman origin (Vásáry, 2005; Madgearu, 2016). The Second Empire's tech, renamed because “alliance” fits the relationship better than “mercenaries”."
relevance = "Without its Cuman allies the Asen revolt would hardly have survived Byzantine and Latin counter-attacks; the alliance shaped the Second Empire from 1186 to the Terters."

[tree]
add = ["Faith", "Atonement", "Sanctity", "Block Printing", "Fortified Wall"]
remove = ["Cannon Galleon"]

[tree.basis]
"Faith" = "Christianisation under Boris I (864/865), a patriarchate (927, restored 1235) and great monasteries such as Rila (10th century): the monastery tree should not be cut down for the civ whose history centres on its Christian and literary culture (Heresy stays, for the Bogomils)."
"Atonement" = "As for Faith: a full monastic tradition, from Preslav and Ohrid to the Tarnovo school of Patriarch Euthymius (14th century)."
"Sanctity" = "As for Faith: the cult of St John of Rila and the monastic centres of the Second Empire."
"Block Printing" = "Kept under its generic name, like the neighbouring civs: the Preslav and Ohrid scriptoria multiplied Slavonic books, and the Council of Preslav tech carries the named moment."
"Fortified Wall" = "Pliska's inner citadel had stone walls over 2 m thick and Preslav was walled in stone; the First Empire also built the Erkesia earthwork across Thrace."
"Cannon Galleon" = "Bulgaria had neither a war navy nor gunpowder before its fall (Tarnovo 1393, Vidin 1396); only the Dobruja despotate kept a small Black Sea fleet in the 1360s–1370s."

[architecture]
set = "Mediterranean"
change = "changed"
replaces = "Eastern European"
basis = "Of the existing sets, the Mediterranean one is closest to Pliska, Preslav and Tarnovo, whose churches (the Round Church of Preslav, Boyana, the churches of Tarnovo and Nesebar) were Middle Byzantine in type, in brick and stone (Krautheimer, Early Christian and Byzantine Architecture); the Eastern European set's onion domes and timber are Russian. A Balkan-Byzantine set is N3."

[[dropped]]
item = "Stirrups"
kind = "unique_tech"
reason = "The stirrup reached Europe with the Avars in the late 6th century and is first mentioned in the Strategikon (c. 600); its attribution to the Bulgars is a minority national claim, and the effect (Cavalry attacks +33% faster) does not match the stirrup's function, which is stability. Its Castle Age slot goes to Bagains. The name could serve the Avars (Huns redesign) in the steppe region."
