civ = "Muisca"
name = "Muisca"
status = "draft"
label = "Archer and Monk civilization"
summary = "The Muisca chiefdoms (800–1540): salt and gold offerings replace the age-up and Settlement bonuses and salt trade the gold team bonus, cloth tribute becomes the Town Center tech, the Temple Guard and Huaracas are dropped, the Champi line becomes the Club line, and siege engines and stone forts go."
ideas = [
  "N2: A mummy-bearer support unit: warriors carried the mummies of famous ancestors into battle, strengthening nearby güechas (Simón; Piedrahita).",
  "N3: A palisaded cacique enclosure (cercado) replacing the Castle and the towers.",
  "N3: Reed rafts on the sacred lakes (Guatavita, Tota, Fúquene; the gold Muisca raft found at Pasca in 1969) instead of an ocean navy.",
  "N3: Salt cakes, cotton mantles and emeralds (Somondoco, Chivor) as distinct trade goods in a reworked Market.",
  "N3: Re-theme the Monastery as the sanctuaries of Sugamuxi and Guatavita with their jeques (chyquy), and Relics as the sanctuaries' holy objects, which drew the gold offerings (tunjos) of chiefs and pilgrims to the sanctuaries and sacred lakes (the N1 Relic-gold bonus is the stand-in).",
  "N2: Güecha darts: Guecha Warriors and Skirmishers +1 range, +1 attack (analysis proposal), for the hand-thrown darts that the chroniclers give as the güechas' common weapon (Simón; Piedrahita). Whether the Muisca also used the spear-thrower (tiradera) is unverified (the Epítome's list of arms; Simón); if it is confirmed, sharing the existing Aztec Atlatl would be the alternative.",
  "N2: A bow line split from the Crossbowman (RULES section 10), so the Archer can improve without crossbows, although the bow was a secondary Muisca weapon beside darts and slings.",
  "N3: Assault mechanics (firing the palisaded enclosures, assault parties instead of the Petard) as the American alternative to siege engines (RULES section 10).",
]
contested = [
  "Whether the Muisca formed a ‘confederation’ or a network of chiefdoms (Langebaek; Gamboa).",
  "The population at the conquest (estimates from c. 300,000 to over one million).",
  "The El Dorado ritual: best described by Rodríguez Freyle (1636–38), a century after the conquest; the story of a ‘golden’ ruler was already reported by Oviedo c. 1541 and is told by Castellanos. It was probably out of use before 1537.",
  "How warlike the Muisca were: the conquerors saw them as traders more than fighters; the scale of their wars and their real use of the bow are debated.",
  "Whether the Muisca had money: cotton mantles served as a standard of value and tribute (quasi-money), and small cast gold pieces (tejuelos) may have circulated; the point is debated. The design keeps Coinage and Banking under their generic names as flagged abstractions (RULES 6.16.6), since neither the mantles nor the tejuelos are coins.",
  "Other generic economy items without a Muisca equivalent also keep their names as flagged abstractions (RULES 6.16.6): Wheelbarrow, Hand Cart and the Trade Cart, since there were no wheeled vehicles or pack animals and goods such as salt cakes and mantles were carried on people's backs; Heavy Plow and Crop Rotation (see Raised Fields); and Guilds (see the Caravan bonus). The Blacksmith tiers are flagged in the armour bonus.",
  "Periodisation: Early Muisca 800–1200 and Late Muisca 1200–1537 is one common scheme, while Rodríguez-Gallo (2018) uses a Late Muisca period of 1000–1550; whether the Herrera period and the Muisca are culturally continuous is also debated.",
  "The extent of human sacrifice (moxa).",
  "The reliability of the Muisca calendar reconstructed by Duquesne in the 18th century.",
]
open_questions = []

[profile]
entity = "The Muisca (muysca, ‘people’) chiefdoms: the zipazgo of Bacatá, the zacazgo of Hunza, the sacred chiefdom of Iraca (Sugamuxi) and Tundama"
region = "Altiplano Cundiboyacense, Eastern Ranges of the Colombian Andes"
window = "800–1540 (in one common periodisation, Early Muisca 800–1200 and Late Muisca 1200–1537; the core is the Late Muisca chiefdoms before c. 1500; Spanish conquest 1537–1540)"
sources = [
  "Epítome de la conquista del Nuevo Reino de Granada (attributed to Gonzalo Jiménez de Quesada, c. 1548–1550)",
  "Juan de Castellanos, Elegías de varones ilustres de Indias (Part I 1589; the Historia del Nuevo Reino de Granada, written c. 1600, published 1886)",
  "Pedro Simón, Noticias historiales (1626)",
  "Juan Rodríguez Freyle, El Carnero (1636–1638)",
  "Lucas Fernández de Piedrahita, Historia general de las conquistas del Nuevo Reino de Granada (1688)",
  "Carl Henrik Langebaek, Los muiscas (2019)",
  "Jorge Augusto Gamboa Mendoza, El cacicazgo muisca en los años posteriores a la Conquista (2010)",
  "Marianne Cardale de Schrimpff, Las salinas de Zipaquirá (1981)",
  "Ana María Groot, Sal y poder en el altiplano de Bogotá (2008)",
  "Sylvia Broadbent, ‘A prehistoric field system in Chibcha territory, Colombia’, Ñawpa Pacha 6 (1968)",
  "Lorena Rodríguez-Gallo, ‘Camellones e agricultura pré-hispânica na Sabana de Bogotá-Colômbia’, Estudos do Quaternário 18 (2018)",
]

[[bonus]]
text = "Stone Miners generate gold in addition to stone"
kind = "economic"
level = 1
change = "new"
replaces = "Advancing to the next Age costs -50% gold"
precedent = "Stone Miners generate gold in addition to stone (Poles)"
basis = "The Muisca boiled brine from the springs of Zipaquirá, Nemocón and Tausa in ceramic vessels into salt cakes, their main good of exchange with neighbouring peoples for gold, cotton and other goods (Cardale de Schrimpff 1981; Groot 2008). Here stone stands for salt. The age-up discount it replaces had no identifiable historical link (rated unfounded)."
relevance = "Salt from Zipaquirá and Nemocón was the base of Muisca wealth and exchange; the Spaniards found the Muisca by following its trade route."

[[bonus]]
text = "Club Warriors and Archery Range Units +1/2/3 melee armor in Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Champi Warriors and Archery Range Units +1/2/3 melee armor in Feudal/Castle/Imperial Age (Muisca)"
basis = "The chroniclers describe long shields and several layers of cotton mantles, which protected against clubs and darts at close quarters, and the Muisca were great weavers (Langebaek 2019). Limiting the bonus to melee armour and to these units is a game choice, as the analysis notes. Effect unchanged; the in-game text only renames the Champi Warriors as Club Warriors. The Blacksmith tiers (Forging, Iron Casting, Bodkin Arrow, Scale Mail, Chain Mail and Plate Mail Armor) keep their generic names as a flagged generic equipment level (RULES 6.16.6): the Muisca had no metal weapons or armour (tumbaga was for ornaments and offerings). No armour tier is renamed after the mantles (RULES 6.16.15): the sources describe everyday mantles worn in layers rather than a distinct armour garment, and no muysccubun term for them as armour is known. Chemistry stays for its +1 ranged attack as a flagged abstraction. The Muisca lack Blast Furnace and Ring Archer Armor in the game, and the design leaves it so."
relevance = "Cotton weaving was a Muisca hallmark, and layered mantles with long shields were their battle dress."

[[bonus]]
text = "Monks regain faith +50% faster"
kind = "other"
level = 1
change = "kept"
precedent = "Monks regain faith +50% faster (Muisca)"
basis = "The jeques (chyquy) trained for years in seclusion, fasted and used coca and tobacco in ritual; sanctuaries such as the Temple of the Sun at Sugamuxi and the sacred lakes received offerings (Langebaek 2019)."
relevance = "The jeques and their sanctuaries (Sugamuxi, Guatavita) were a pillar of Muisca society, and the sacred lakes are the best-known Muisca image."

[[bonus]]
text = "Caravan, Guilds free"
kind = "economic"
level = 1
change = "kept"
precedent = "Caravan, Guilds free (Muisca)"
basis = "The Spaniards found the Muisca more given to trade than to war: periodic markets (Turmequé, Sorocotá) exchanged salt, cotton mantles, emeralds and gold with the Panche, Muzo, Guane and the peoples of the Llanos, and Muisca goods travelled far beyond the Altiplano (Langebaek 2019). Guilds is a European corporate name with no Muisca equivalent, since no merchant corporations are documented; it stays as a flagged generic abstraction (RULES 6.16.6)."
relevance = "Markets and long-distance exchange of salt and cloth for gold, cotton and coca defined the Muisca economy."

[[bonus]]
text = "Relics generate +33% gold"
kind = "economic"
level = 1
change = "new"
precedent = "Relics generate +33% gold (Aztecs team bonus), as a passive bonus; the Aztecs' design gives it up"
basis = "Muisca goldsmiths cast votive figures (tunjos) and other offerings in gold and tumbaga by the lost-wax method, and chiefs, pilgrims and petitioners brought them to the sanctuaries and sacred lakes, where the jeques received them. The Temple of the Sun at Sugamuxi, whose lord, the iraca, was also its high priest, was a place of pilgrimage and held so much gold that Quesada's soldiers looted it in 1537 and burned it down in the looting (Castellanos; Simón; Langebaek 2019); the ritual of the gilded chief on Lake Guatavita, the root of the El Dorado legend, belongs to the same practice (see contested). A Relic housed in a Monastery stands for a sanctuary and its holy object, and the gold it yields for the offerings that the faithful brought to it: read this way, the bonus follows the direction of the offerings, from the faithful to the shrine and its keepers, and does not draw gold from the gods. What remains an abstraction is that the gold becomes spendable, while the offerings were deposited, buried or sunk in the lakes and so withdrawn from use."
relevance = "Goldwork and votive offerings are the best-known Muisca trait and the root of the El Dorado legend."
contested = "Most Muisca gold was imported from the lowlands in exchange for salt and cloth; the bonus renders the offerings, not mining. The offerings were withdrawn from use rather than spent, so counting them as income for the sanctuary's holder is an abstraction."

[team_bonus]
text = "Trade Units generate +10% food in addition to gold"
level = 1
change = "new"
replaces = "Natural gold sources last +15% longer"
precedent = "Trade Units generate +10% food in addition to gold (Bengalis team bonus)"
basis = "Salt cakes and cotton mantles went down to the Magdalena valley and the Llanos in exchange for gold, raw cotton and coca, so that Muisca salt reached peoples far beyond the Altiplano; in 1536–37 Quesada's expedition followed the trail of salt loaves up from the Magdalena (La Tora, the Opón) to the highlands (Epítome; Castellanos; Groot 2008). RULES 6.2: trade that benefited neighbours; food in addition to gold renders the salt in the exchange. The gold team bonus it replaces suited the Muisca worst of all, since they imported most of their gold, and showed no benefit to allies (rated stretched). The Bengalis have the same team bonus, and the Malians' design has the effect as a passive bonus (repetition allowed, RULES 6.7)."
relevance = "Salt traded to neighbours was the Muisca's main link with the peoples around them and the source of their gold."

[[unique_unit]]
name = "Guecha Warrior"
model = "Guecha Warrior"
building = "Castle"
level = 1
change = "kept"
basis = "The güechas were a privileged class of frontier warriors facing the Panche, adorned with gold or tumbaga ornaments that marked the enemies they had killed; they fought with darts, slings, clubs and long shields. Regenerating when a comrade falls evokes the mummies of famous warriors carried into battle (Simón; Piedrahita). Decision: it stays the civ's only unique unit until the N2 mummy-bearer exists (ideas). Against cavalry, which the Muisca first met in 1537, they keep the Pikeman and Monks, as the current Aztecs do; no anti-cavalry bonus is added, since none would pass the relevance test (RULES 6.9). The label keeps the game's ‘Archer and Monk’, since the game's categories count skirmishers, such as the güechas and the Archery Range skirmishers, as archers (RULES 6.16.16)."
relevance = "The güechas, the privileged warriors of the Panche frontier, were the professional soldiers of the Muisca chiefdoms."
contested = "The ornaments-per-enemy custom and the mummies come from 17th-century chroniclers."

[[unique_tech]]
name = "Herbalism"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Archer-line and Club Warriors move +15% faster"
level = 1
change = "kept"
precedent = "Herbalism (Muisca)"
basis = "Chewing coca with lime increased endurance and was common practice among warriors and travellers as among the jeques; coca, which the chroniclers of New Granada call hayo, came by trade from the warmer valleys (Langebaek 2019). The speed bonus is an acceptable abstraction. Coca chewing is a structural practice with no datable moment or formalisation (RULES 6.2, 6.3): this is a current-game tech kept as an abstraction and held as a tech by the effect-size tie-break (RULES 6.2.4), a flagged fallback (RULES 6.16.19 b), because the Muisca have no datable military moment for the mandatory Castle slot. Effect unchanged; the in-game text only renames the Champi Warriors as Club Warriors. Its Archer-line target sits awkwardly with a civ whose bows were secondary (the chroniclers link the bow mainly with the Panche). Decision: the effect stays unchanged at level 1; retargeting it to Skirmishers, Slingers and Club Warriors would make a new, level-2 tech for a detail."
relevance = "Coca was the stimulant of Muisca ritual, travel and war and one of the main goods of their trade."

[[unique_tech]]
name = "Cotton Mantles"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "All gold income +10% faster; Market trading fee reduced to 10%"
level = 1
change = "new"
precedent = "Grand Trunk Road (Hindustanis): identical effect, shared, moved to the Town Center and renamed"
basis = "Muisca commoners paid tribute to their caciques, and the caciques to the zipa of Bacatá and the zaque of Hunza, largely in cotton mantles and gold (Langebaek 2019; Gamboa 2010). Gold income renders the tribute that flowed to the chiefs; the lower market fee renders the mantle as the measure of exchange. Tribute is a chiefly institution, so this is the Town Center tech of a people organised in chiefdoms (RULES 6.2 and 6.3). The effect is Grand Trunk Road, kept by the Hindustanis as Tanka and shared in the Anglo-Saxons', Burgundians', Khitans' and Malay designs; five more designs use its gold half, in the Arabs', Avars', Bulgarians' and Danes' techs and the Byzantines' passive (RULES 6.7; reuse is accepted in N1, RULES 6.16.12)."
relevance = "Cloth tribute tied Muisca households to their chiefs and the chiefs to the zipa and the zaque: the mantle was the measure of Muisca wealth."
contested = "Whether mantles were money proper is debated (see the civ-level note). Decision: Cotton Mantles is kept rather than a level-2 tech for the code of laws that 17th-century chroniclers attribute to the zipa Nemequene (c. 1490–1514; Piedrahita), whose historicity is contested."

[tree]
add = ["Arson"]
remove = [
  "Siege Workshop", "Battering Ram", "Capped Ram", "Mangonel", "Onager", "Siege Onager",
  "Scorpion", "Heavy Scorpion", "Siege Tower", "Trebuchet", "Siege Engineers",
  "Crossbowman", "Arbalester", "Thumb Ring",
  "Galleon", "Carrack", "Catapult Galleon", "Galleon, Fast Fire Ship and Carrack",
  "Block Printing",
  "Keep", "Stone Wall", "Gate", "Masonry",
  "Temple Guard", "Elite Temple Guard",
]

[tree.basis]
"Arson" = "With the Temple Guard dropped, the Muisca need another way to destroy buildings (RULES 6.11). Houses and cacique enclosures were of wood, cane and thatch, so fire is a plausible abstraction, though no chronicle passage on Muisca fire attacks was found. In the current game only the Goths, Romans and Muisca lack Arson."
"Siege Workshop" = "The Muisca built no siege engines; their defences were palisaded enclosures. Removing the workshop removes all its units; the Club line (strong against buildings), Arson and Petards replace them (owner's decision, RULES 6.16.5; RULES 6.11 and section 10). The Muisca have no Sappers, and every Castle must be taken by units standing in its arrow fire, so castle-breaking is slow; this is accepted until an N2/N3 assault unit exists (ideas), with no compensating bonus (RULES 6.16.13). The Petard, a 16th-century gunpowder charge, stays unrenamed as a flagged generic abstraction of assault parties with fire, outside the one-late-element limit (RULES 6.16.2)."
"Battering Ram" = "Removed with the Siege Workshop: there were no rams and no wheeled vehicles."
"Capped Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Mangonel" = "Removed with the Siege Workshop: no torsion or traction artillery existed in the Americas."
"Onager" = "Removed with the Siege Workshop (see Mangonel)."
"Siege Onager" = "Removed with the Siege Workshop (see Mangonel)."
"Scorpion" = "Removed with the Siege Workshop: no bolt-throwers existed in the Americas."
"Heavy Scorpion" = "Removed with the Siege Workshop (see Scorpion)."
"Siege Tower" = "Removed with the Siege Workshop: a wheeled assault tower."
"Trebuchet" = "Counterweight artillery never existed in the Americas."
"Siege Engineers" = "No siege engines are left to improve."
"Crossbowman" = "The crossbow was unknown in the Americas, which have neither crossbow tier (RULES 6.16.3). Muisca missile weapons were darts, slings and, to a lesser degree, bows (associated mainly with the Panche); the Guecha Warrior, Slingers and Skirmishers cover the role, and the Archer stays. In the current game the Bulgarians also lack crossbows."
"Arbalester" = "Removed with the Crossbowman (see there)."
"Thumb Ring" = "No thumb rings or thumb draw are attested in the Americas, so the tech goes (RULES 6.16.4)."
"Galleon" = "An ocean navy is absurd for an inland plateau people; Muisca boats were reed rafts on the lakes. Basic navy (RULES 6.16.1), since the Muisca had no war fleet of their own: the Galley-line to War Galley, the Fire Galley and Fire Ship, the Hulk and War Hulk, the demolition ships and the generic Dock techs stay as an abstraction for water maps, with no Galleon, Carrack or siege warship; the demolition ships are generic post-1500 items kept as flagged abstractions (RULES 6.16.2). The Scenario Editor Canoe is not used: the Muisca are in the basic navy, their craft were reed rafts on the lakes, and a canoe look would suggest a canoe navy that is not attested."
"Carrack" = "See Galleon."
"Catapult Galleon" = "A sailing ship carrying a catapult: both a European ship type and a siege engine."
"Galleon, Fast Fire Ship and Carrack" = "With the Galleon and Carrack removed (the Muisca never had the Fast Fire Ship), this upgrade has nothing left to upgrade."
"Block Printing" = "There was no printing or writing. With no equivalent for the function the tech is removed (18 of the game's 56 civs already lack it)."
"Keep" = "Region-wide tower policy: only the Keep, a stone tower, needs documented stone towers, so it stays only where they are documented (the Inca); the Guard Tower stays as a generic tier wherever the Watch Tower stays. The Muisca built in wood, cane and wattle-and-daub and had no towers, so their Guard Towers are an abstraction of wooden frontier posts. The Castle itself stays for structural reasons (it trains the unique unit, researches the Castle tech and is needed for the Imperial Age) until an N3 cercado replaces it (ideas)."
"Stone Wall" = "Muisca defences were palisades around the enclosures of the caciques; stone walls are removed (in the current game the Cumans and Goths also lack them; the Goths' design adds them) and Palisade Walls remain."
"Gate" = "Removed with the Stone Wall; the Palisade Gate remains."
"Masonry" = "There was no stone masonry tradition (the Temple of the Sun at Sugamuxi was of wood); the Muisca already lacked Architecture, and in the current game the Aztecs, Byzantines and Tupi lack Masonry too (the Aztecs' design adds it)."
"Temple Guard" = "Removed with the dropped unique unit (see [[dropped]]): no corps of temple guards is documented."
"Elite Temple Guard" = "Removed with the Temple Guard."

[[rename]]
from = "Champi Scout"
to = "Club Scout"
level = 1
basis = "Champi is the Quechua name of the Andean stone or bronze mace, and macana, the chroniclers' word for the Muisca clubs of hard palm wood, is Taíno: both are foreign to the Muisca. No muysccubun term for the club was found in the sources used (the colonial grammars and vocabularies of the language, c. 1612 and 1619, could not be checked), so a neutral English name is given. Decision: it is kept rather than the chroniclers' loanword ‘macana’, which would also have opened the Taíno ‘cacique’ to the Tupi."

[[rename]]
from = "Champi Runner"
to = "Club Runner"
level = 1
basis = "Same rename as Champi Scout."

[[rename]]
from = "Champi Warrior"
to = "Club Warrior"
level = 1
basis = "Same rename as Champi Scout."

[[rename]]
from = "Elite Champi Warrior"
to = "Elite Club Warrior"
level = 1
basis = "Same rename as Champi Scout."

[[rename]]
from = "Horse Collar"
to = "Raised Fields"
level = 1
basis = "There were no draft animals. Ridged fields (camellones) separated by drainage ditches covered the flood plains of the Sabana de Bogotá from the Herrera period to the Late Muisca period (Broadbent 1968; Rodríguez-Gallo 2018). Same rename as for the Maya and the Mapuche. Heavy Plow and Crop Rotation keep their generic names as flagged abstractions (RULES 6.16.6; see the civ-level note on generic economy items)."

[architecture]
set = "South American"
level = 1
change = "kept"
basis = "The South American set of the region's chiefdom civs fits the Muisca better than any other set; a set of wooden and thatched buildings (bohíos, cercados) would be N3."

[[dropped]]
item = "Settlements cost -33% and heal nearby units"
kind = "bonus"
reason = "No historical basis (rated unfounded); the Settlement itself stays as the regional abstraction of dispersed settlement. Its cost half is reused by the Mapuche for their dispersed homesteads."

[[dropped]]
item = "Temple Guard"
kind = "unique_unit"
reason = "No corps of ‘temple guards’ is documented: the sanctuaries of Sugamuxi and Guatavita had priests and servants, not a warrior unit (rated unfounded). Its anti-building role passes to Arson and the Club line; against cavalry the Muisca keep the Pikeman and Monks, as the current Aztecs do (a Spearman-line damage bonus is not given, since it fails the relevance test, RULES 6.9). An N2 mummy-bearer is recorded in the ideas."

[[dropped]]
item = "Huaracas"
kind = "unique_tech"
reason = "Huaraca is the Quechua warak'a, and even under a Muisca name the tech would fail the relevance test (RULES 6.9): a sling-range tech is a single-weapon detail, and the sling was a secondary Muisca weapon beside darts, lances and clubs. The Slinger stays in the tree."
