civ = "Teutons"
name = "Teutons"
status = "draft"
label = "Cavalry and Defensive civilization"
summary = "Teutons as the medieval German kingdom and German-speaking society with the German-recruited Teutonic Order (919–1500), relabelled ‘Cavalry and Defensive’: the Teutonic Knight becomes the mounted brother-knight it was, conversion resistance becomes a passive for the Order’s vows, German miners become the team bonus, Henry I’s burgs (Tigui renamed) become the Town Center tech, the Hanse replaces the anachronistic Ironclad at the Market, Murder Holes and Herbal Medicine free is dropped as a mere detail, and the tree gains Arbalester, Architecture, Treadmill Crane, Gold Shaft Mining and Dry Dock while losing Siege Onager."
ideas = [
  "N2: Give the mounted Teutonic Knight its own data (slow heavy cavalry with very high melee armour and extra resistance to conversion) instead of borrowing the Boyar’s stats.",
  "N2: A Landsknecht for the Barracks in the Imperial Age (pike and two-handed sword, small bonus against the Spearman-line): Maximilian I’s German infantry raised from c. 1486–87, at the very end of the time frame.",
  "N2: Reichskirche: Knight-line trainable at the Monastery, after the Indiculus loricatorum (981), in which most of the armoured horsemen Otto II summoned to Italy were owed by bishoprics and abbeys. A building-trains-unit effect exists (Mapuche Settlements), but a Monastery training cavalry is a new pairing.",
  "N2: Bergrecht as a separate economic tech at the Mining Camp (Gold and Stone Miners work faster) if the team bonus proposed here is not accepted.",
  "N3: Proper art for the mounted Teutonic Knight (white mantle with black cross) and a cog/hulk model for the Hanseatic ships.",
  "N3: Old Prussians and the other Baltic peoples fought by the Order (Prussians, Curonians, Semigallians, Estonians) have no civ; at most a variant or campaign faction.",
]
contested = [
  "When ‘Germany’ begins: 843 (Verdun), 911/919, or only in the 11th–12th centuries (Brühl, Ehlers, Reuter).",
  "The nature of Ottonian armies: dominated by heavy cavalry (Leyser) or mixed forces with strong infantry and siege capacity (Bernard and David Bachrach).",
  "Whether Henry I issued a systematic ‘Burgenordnung’ (a term of modern historians) and what Widukind meant by agrarii milites.",
  "Whether the Order’s hospital at Acre (1190) continued the older German hospital in Jerusalem (c. 1127, placed under the Hospitallers in 1143); the Order’s own foundation account presents it as a new foundation.",
  "The scale and significance of the Battle on the Ice (1242): the Soviet/Russian tradition against the minimalist reading of Fennell, Christiansen and Urban, based on the Livonian Rhymed Chronicle.",
  "The late Empire as ‘fragmentation and failure’ (Prussian national historiography) or as a functioning political system (Whaley, Wilson).",
]
open_questions = [
  "Name. ‘Teutons’ is defensible (medieval Latin Teutonici, regnum Teutonicorum, the Ordo Teutonicus) but it is a learned exonym, used by the papacy precisely to deny the king his Roman title, and in English it mostly evokes the Teutonic Order. Alternatives: ‘Germans’ (from the people’s own diutisc/deutsch, the clearest for players) or ‘Holy Roman Empire’ (the polity, but multi-ethnic, including Bohemia and imperial Italy, and ‘sacrum’ only from 1157, ‘Sacrum Romanum Imperium’ from 1254). The people-based scope of this draft (German kingdom, settlers, miners, towns and the German-recruited Order) supports ‘Germans’. This draft keeps ‘Teutons’; recommended alternative: ‘Germans’, to be decided together with any Saxons → Anglo-Saxons rename (the continental Saxon Ottonians belong here).",
  "Entity. This draft represents the German kingdom and German-speaking society within the Empire (919–1500) with the Teutonic Order and its Baltic state (1226/30–1525), not the whole multi-ethnic Empire (Bohemia, imperial Italy and Burgundy have their own civs). Agree?",
  "Label: ‘Infantry and Defensive’ becomes ‘Cavalry and Defensive’, because heavy cavalry was the elite arm of German armies from the 10th to the 14th century and the Order’s brothers fought mounted. The civ keeps infantry mechanics (melee armour bonus, Crenellations, Champion), and infantry fits the late-15th-century towns and Landsknechte. Keep ‘Cavalry and Defensive’ or return to ‘Infantry and Defensive’?",
  "The Teutonic Knight is changed from infantry to cavalry on the Boyar model and the foot version is dropped. In N1 it is identical to the Rus’ Boyar (Rus.toml keeps it), the unique unit of the Order’s opponents at Lake Peipus. Accept this, keep the foot Teutonic Knight until the N2 version, or keep it as a second unique unit for dismounted knights in siege and garrison?",
  "Conversion resistance: under RULES 6.2 it cannot stay the team bonus (it benefited only the civ itself), so it becomes a passive bonus replacing ‘Murder Holes, Herbal Medicine free’, and German miners become the team bonus. Accept? (The first draft had moved it to the Lithuanians; that was withdrawn as historically backwards.)",
  "Second team bonus? The Ostsiedlung also benefited neighbours: Polish, Bohemian and Hungarian rulers invited German settlers under German law (ius Teutonicum, Magdeburg law). Here it stays a passive (Farms -40%), with the miners as the only team bonus.",
  "Town Center tech: Henry I’s burgs reuse the Malian Tigui effect (Town Centers fire arrows without garrison), renamed ‘Burgenordnung’ (level 1). Accept, or prefer a new level-2 state tech (e.g. the Golden Bull of 1356 or the Imperial Reform of 1495)?",
  "Light Cavalry: the Order used native Prussian light horse on its raids into Lithuania. Add Light Cavalry to the tree (not done here, to keep the power budget)?",
  "Shipwright: the analysis also proposes it for the Hanseatic fleets; only Dry Dock is added here. Add Shipwright too?",
]

[profile]
entity = "The German kingdom (regnum Teutonicorum) and German-speaking society within the Holy Roman Empire (towns, settlers, miners), together with the German-recruited Teutonic Order and its state in Prussia and Livonia"
region = "German-speaking lands of the Empire, from both banks of the Rhine and the Alps to the Baltic, with Prussia and Livonia under the Teutonic Order"
window = "919–1500 (Teutonic Order in Prussia 1226/30–1525)"
sources = [
  "Widukind of Corvey, Res gestae Saxonicae (c. 967–973)",
  "Thietmar of Merseburg, Chronicon (c. 1012–1018)",
  "Indiculus loricatorum (981)",
  "Narratio de primordiis ordinis Theutonici (early 13th century)",
  "Peter of Dusburg, Chronicon terrae Prussiae (1326)",
  "Timothy Reuter, Germany in the Early Middle Ages c. 800–1056 (1991)",
  "Karl Leyser, Rule and Conflict in an Early Medieval Society (1979)",
  "David S. Bachrach, Warfare in Tenth-Century Germany (2012)",
  "Benjamin Arnold, German Knighthood 1050–1300 (1985)",
  "Len Scales, The Shaping of German Identity: Authority and Crisis, 1245–1414 (2012)",
  "Robert Bartlett, The Making of Europe (1993)",
  "Philippe Dollinger, The German Hansa (1964; English translation 1970)",
  "Eric Christiansen, The Northern Crusades (2nd ed. 1997)",
  "William Urban, The Teutonic Knights: A Military History (2003)",
  "Peter H. Wilson, Heart of Europe (2016); Joachim Whaley, Germany and the Holy Roman Empire (2012), relevant only from 1493",
]

[[bonus]]
text = "Farms cost -40%"
kind = "economic"
level = 1
change = "kept"
precedent = "Farms cost -40% (Teutons)"
basis = "Read as the Ostsiedlung (12th–14th centuries): locators settled peasants east of the Elbe and in Silesia, Bohemia and Poland under ‘German law’ (ius Teutonicum), with standard holdings (Hufen), the heavy plough and several rent-free years (Freijahre) to clear and sow new land (Bartlett 1993). An abstraction: cheap farms stand for the low start-up cost of these settlements."
relevance = "The Ostsiedlung moved the German-speaking frontier from the Elbe to the Baltic and the Carpathians and reshaped the map of Central Europe for seven centuries."

[[bonus]]
text = "Town Centers +10 garrison capacity; Towers +5 garrison capacity"
kind = "military"
level = 1
change = "kept"
precedent = "Town Centers +10 garrison capacity; Towers +5 garrison capacity (Teutons)"
basis = "The German lands had one of the densest networks of castles in Europe (estimates run to more than ten thousand Burgen) and hundreds of walled towns, where the people of the countryside took refuge in war. The datable start of this tradition, Henry I’s burgs of 926–933, is the Town Center tech."
relevance = "The castle and the walled town are the defining features of the German medieval landscape and the root of the civ’s ‘Defensive’ label."

[[bonus]]
text = "Infantry and Mounted Units +1/+2 melee armor in Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Infantry and Mounted Units +1/+2 melee armor in Castle/Imperial Age (Teutons)"
basis = "Nuremberg, Augsburg and Landshut were among the great armour-making centres of 15th-century Europe (‘Gothic’ plate; the Helmschmid workshop of Augsburg worked for Maximilian I), and Passau and Solingen blades were exported widely. The link is strongest for the Imperial Age."
relevance = "German plate armour was an export industry and a European byword; the heavily armoured German knight and Landsknecht are part of the civ’s identity."

[[bonus]]
text = "Units more resistant to conversion"
kind = "other"
level = 1
change = "changed"
replaces = "Murder Holes, Herbal Medicine free"
precedent = "Units more resistant to conversion (Teutons team bonus); First Crusade (Up to 5 Town Centers spawn 5 Serjeants each; units more resistant to conversion) (Sicilians)"
basis = "The Teutonic Order was a religious order whose brothers took vows of poverty, chastity and obedience under a rule modelled on those of the Templars and Hospitallers, and it fought a crusade preached and renewed for two centuries (Christiansen 1997); the Ottonian and Salian kings also drew much of their armoured cavalry from bishops and abbots (Indiculus loricatorum, 981). Moved from the team bonus, which under RULES 6.2 must benefit allies; it also covers the old infantry Teutonic Knight’s own conversion resistance."
relevance = "Without its religious vows and crusade the Order would not exist; the imperial Church was the backbone of the Ottonian and Salian kingdom."
contested = "An abstraction: the game’s conversion is a change of allegiance; the bonus stands for religious commitment, not for a documented immunity."

[[bonus]]
text = "Monks +100% healing range"
kind = "other"
level = 1
change = "kept"
precedent = "Monks +100% healing range (Teutons)"
basis = "According to the Order’s own foundation account (Narratio de primordiis ordinis Theutonici), it began as a field hospital set up by burghers of Bremen and Lübeck at the siege of Acre (1190) and became a military order only in 1198; its full name remained the Hospital of St Mary of the Germans, its Grand Hospitaller was one of its great officers, and in 1234 it took over St Elisabeth’s hospital at Marburg."
relevance = "Care of the sick was the Order’s founding purpose and stayed in its name and rule; without it the Order’s identity would be different."

[team_bonus]
text = "Natural gold sources last +15% longer"
level = 1
change = "new"
replaces = "Units more resistant to conversion"
precedent = "Natural gold sources last +15% longer (Muisca team bonus)"
basis = "German miners opened and ran mines all over Central Europe: Rammelsberg near Goslar (silver, traditionally from 968) and Freiberg (1168) at home, then Jihlava and Kutná Hora in Bohemia, Kremnica and Banská Štiavnica in Hungary, and Novo Brdo in Serbia, carrying the mining law of Freiberg and Jihlava with them; their drainage adits and shaft techniques kept deep mines working (Bartlett 1993; Agricola codified this knowledge in De re metallica, 1556). As a team bonus it reflects German mining expertise working for the neighbours (RULES 6.2: transferred techniques)."
relevance = "German mining made Central Europe the silver and gold supplier of the continent and spread German law and settlers; it benefited Bohemia, Hungary and Serbia as much as the Empire."
contested = "Mines ‘lasting longer’ is an abstraction of deeper and longer exploitation, not of larger ore bodies. The Muisca team bonus is identical (repetition intended)."

[[unique_unit]]
name = "Teutonic Knight"
model = "Boyar"
building = "Castle"
level = 1
change = "changed"
replaces = "Teutonic Knight (Infantry): slow infantry with exceptional melee armor, resistant to conversion"
basis = "The brother-knights of the Order fought mounted, as heavy cavalry: at Durbe (1260) and at Grunwald (1410), a few hundred brothers per campaign led sergeants, guest crusaders and Prussian auxiliaries (Christiansen 1997; Urban 2003). The Boyar profile (cavalry with exceptional melee armour, weak against the Spearman-line and Monks) is the closest existing match; making them infantry inverted their role and fitted at most dismounted knights in sieges and garrisons."
relevance = "The brother-knights are the civ’s namesake and the core of the Order’s state; the mounted knight was the elite of German armies for four centuries."
contested = "In N1 the unit uses the Boyar’s stats and art, so it is identical to the Rus’ unique unit (see ideas and open questions); the civ-wide conversion resistance replaces the old unit’s own."

[[unique_tech]]
name = "Burgenordnung"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Town Centers fire arrows without garrison"
level = 1
change = "new"
precedent = "Tigui (Town Centers fire arrows without garrison) (Malians): an existing unique tech, moved to the Town Center, shared and renamed with an identical effect"
basis = "During the truce with the Magyars (926–933) Henry I had fortified refuges (urbes) built and ordered that one in nine of the agrarii milites live in them permanently, that a third of the harvest be stored there and that councils, gatherings and feasts be held there (Widukind I.35); the system prepared the victory at Riade (933). A permanent garrison is what lets the Town Center shoot without villagers inside. Castle Age, Tigui’s original age, rather than Feudal."
relevance = "The burgs made the young Ottonian kingdom able to resist and then defeat the Magyars (Riade 933, Lechfeld 955), the turning point that secured it."
contested = "‘Burgenordnung’ is a modern historians’ name; whether Henry issued a systematic ordinance, and who the agrarii milites were, is debated (Bachrach 2012)."

[[unique_tech]]
name = "Hanse"
building = "Market"
kind = "civil"
age = "Castle"
effect = "Trade Units generate +25% gold; Hulk-line +20% HP"
level = 2
change = "new"
replaces = "Ironclad (Siege Weapons +4 melee armor)"
precedent = "Effect 1: Trade Units generate +25% gold (Spanish team bonus); effect 2: Longships and Catapult Galleons +20% HP (Saxons)"
basis = "The Hanse (c. 1250–1500; first general diet 1356) linked Lübeck, Hamburg, Cologne, Danzig and dozens of other German towns, with Kontore at Novgorod, Bergen, London and Bruges; its cogs and later hulks (the ship type that gives the game’s Hulk-line its name) also fought, and the towns forced Denmark to the Peace of Stralsund (1370). The Teutonic Order took part in the Hanse with its Prussian towns and conquered Gotland from the Victual Brothers in 1398 (Dollinger 1964). Ironclad is dropped: it is the mid-19th-century term for armoured warships (La Gloire 1859, Monitor 1862), and covering siege engines with hides and boards was universal."
relevance = "The Hanse dominated the trade of northern Europe for three centuries and is one of the best-known German institutions of the Middle Ages."

[[unique_tech]]
name = "Crenellations"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Castles +3 range, garrisoned Infantry fires arrows"
level = 1
change = "kept"
precedent = "Crenellations (Castles +3 range, garrisoned Infantry fires arrows) (Teutons)"
basis = "Kept for the Order’s brick convent-castles in Prussia and Livonia, each garrisoned by a convent of brothers with their men-at-arms, and for the dense castle landscape of the German lands. Marienburg, seat of the Grand Master from 1309, was the largest brick castle in Europe; after Grunwald, Heinrich von Plauen held it against the Polish–Lithuanian army for some eight weeks (July–September 1410), and the Order’s state survived (Urban 2003)."
relevance = "The Order ruled Prussia through its castles, and the defence of Marienburg in 1410 saved its state after Grunwald."
contested = "The analysis rates this tech ‘stretched’: battlements existed everywhere, so only the castle density and the Order’s castle-state make it German."

[tree]
add = ["Arbalester", "Architecture", "Treadmill Crane", "Gold Shaft Mining", "Dry Dock"]
remove = ["Siege Onager"]

[tree.basis]
"Arbalester" = "Crossbowmen were central to the Order’s garrisons and arsenals in Prussia and to the urban militias of the German towns, whose shooting guilds (Schützengilden) appear from the 14th century. The Teutons already have the Heavy Mounted Crossbowman; the foot upgrade completes the crossbow line."
"Architecture" = "Romanesque Speyer, Gothic Cologne, the brick Gothic of the Baltic towns and the Order’s castles (Marienburg) make the absence hard to justify for a defensive civilization."
"Treadmill Crane" = "The medieval treadwheel crane is almost a German emblem: the crane of Cologne cathedral stood on the unfinished south tower from the 15th century until 1868, and the Krantor of Danzig (1442–44) was built under the Order."
"Gold Shaft Mining" = "Germany was the mining heart of medieval Europe (Rammelsberg, Freiberg, the Harz and the Erzgebirge, Schwaz in Tyrol) (Bartlett 1993); lacking the late mining upgrade contradicted that."
"Dry Dock" = "Hanseatic fleets dominated the Baltic and the North Sea, defeated Denmark (1367–70) and carried the Order to Gotland (1398) (Dollinger 1964); a weak navy contradicted this."
"Siege Onager" = "Removed to offset the additions. There is no specific German basis for the top torsion-engine upgrade (held by only 15 civs); the Teutons keep the Onager, Capped Ram, Trebuchet and Bombard Cannon."

[architecture]
set = "Central European"
change = "kept"
basis = "The Central European set is the one modelled on the German lands; Bohemia, also a kingdom of the Empire, joins it in this redesign (criterion: membership of the Empire)."

[[dropped]]
item = "Murder Holes, Herbal Medicine free"
kind = "bonus"
reason = "Fails the relevance test (RULES 6.9): both techniques were common to all of Latin Europe, and the first draft already called the bonus flavour rather than a distinctive trait. Monastic medicine (Lorsch Pharmacopoeia, c. 795; Hildegard of Bingen) is already carried by the Monks’ healing bonus. Its slot goes to the conversion-resistance passive."
