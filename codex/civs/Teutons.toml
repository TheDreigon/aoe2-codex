civ = "Teutons"
name = "Teutons"
status = "draft"
label = "Cavalry and Defensive civilization"
summary = "Teutons refocused on the medieval German kingdom and its crusading offshoot, the Teutonic Order (919–1500): the Teutonic Knight becomes the mounted brother-knight it really was, the anachronistic Ironclad gives way to the Hanse, German miners become the team bonus, and the tree gains Arbalester, Architecture, Treadmill Crane, Gold Shaft Mining and Dry Dock while losing Siege Onager."
ideas = [
  "N2: Give the mounted Teutonic Knight its own data (slow heavy cavalry with very high melee armour and the old infantry unit's extra resistance to conversion) instead of borrowing the Boyar's stats.",
  "N2: A Landsknecht for the Barracks in the Imperial Age (pike and two-handed sword, small bonus against the Spearman-line): Maximilian I's German infantry raised from c. 1486–87, at the very end of the time frame.",
  "N2: Reichskirche: Knight-line trainable at the Monastery, after the Indiculus loricatorum (981), in which most of the armoured horsemen Otto II summoned to Italy were owed by bishoprics and abbeys. A building-trains-unit effect exists (Mapuche Settlements), but a Monastery training cavalry is a new pairing.",
  "N2: Bergrecht as a separate economic tech (Gold and Stone Miners work faster) if the team bonus proposed here is not accepted.",
  "N3: Proper art for the mounted Teutonic Knight (white mantle with black cross) and a cog/hulk model for the Hanseatic ships.",
  "N3: Old Prussians and the other Baltic peoples fought by the Order (Prussians, Curonians, Semigallians, Estonians) have no civ; at most a variant or campaign faction.",
]
contested = [
  "When ‘Germany’ begins: 843 (Verdun), 911/919, or only in the 11th–12th centuries (Brühl, Ehlers, Reuter).",
  "The nature of Ottonian armies: dominated by heavy cavalry (Leyser) or mixed forces with strong infantry and siege capacity (Bernard and David Bachrach).",
  "Whether Henry I issued a systematic ‘Burgenordnung’ and what Widukind meant by agrarii milites.",
  "The scale and significance of the Battle on the Ice (1242): the Soviet/Russian tradition against the minimalist reading of Fennell, Christiansen and Urban, based on the Livonian Rhymed Chronicle.",
  "The late Empire as ‘fragmentation and failure’ (Prussian national historiography) or as a functioning political system (Whaley, Wilson).",
]
open_questions = [
  "Name. ‘Teutons’ is defensible (medieval Latin Teutonici, regnum Teutonicorum, the Ordo Teutonicus) but it is a learned exonym, used by the papacy precisely to deny the king his Roman title, and in English it mostly evokes the Teutonic Order. Alternatives: ‘Germans’ (from the people’s own diutisc/deutsch, the clearest for players) or ‘Holy Roman Empire’ (the polity, but multi-ethnic, including Bohemia and imperial Italy, and ‘sacrum’ only from 1157, ‘Sacrum Romanum Imperium’ from 1254). This draft keeps ‘Teutons’; recommended alternative: ‘Germans’.",
  "Entity. This draft represents the German kingdom within the Empire (919–1500) with the Teutonic Order state (1226/30–1525) as its crusading offshoot, not the whole multi-ethnic Empire (Bohemia, imperial Italy and Burgundy have their own civs). Agree?",
  "The Teutonic Knight is changed from infantry to cavalry (Boyar stats) and the foot version is dropped. Alternative: keep the foot Teutonic Knight as a second unique unit representing dismounted knights in siege and garrison, or as an N2 Landsknecht stand-in.",
  "Light Cavalry: the Order used native Prussian light horse (Turkopolen, Witinge) on its raids into Lithuania. Add Light Cavalry to the tree (not done here, to keep the power budget)?",
  "Shipwright: the analysis also proposes it for the Hanseatic fleets; only Dry Dock is added here. Add Shipwright too?",
  "Team bonus: German miners (allies’ gold mines last longer) replaces the conversion-resistance team bonus, which moves to the Lithuanians as a passive bonus (resistance of the last pagan state). Accept the swap?",
]

[profile]
entity = "Kingdom of Germany (regnum Teutonicorum) within the Holy Roman Empire, with the state of the Teutonic Order in Prussia and Livonia"
region = "German lands between the Rhine and the Oder, with Prussia and Livonia under the Teutonic Order"
window = "919–1500 (Teutonic Order in Prussia 1226/30–1525)"
sources = [
  "Widukind of Corvey, Res gestae Saxonicae (c. 967–973)",
  "Thietmar of Merseburg, Chronicon (c. 1012–1018)",
  "Indiculus loricatorum (981)",
  "Peter of Dusburg, Chronicon terrae Prussiae (1326)",
  "Timothy Reuter, Germany in the Early Middle Ages c. 800–1056 (1991)",
  "Karl Leyser, Rule and Conflict in an Early Medieval Society (1979)",
  "Benjamin Arnold, German Knighthood 1050–1300 (1985)",
  "Robert Bartlett, The Making of Europe (1993)",
  "Philippe Dollinger, The German Hansa (1964; English translation 1970)",
  "Eric Christiansen, The Northern Crusades (2nd ed. 1997)",
  "William Urban, The Teutonic Knights: A Military History (2003)",
  "Joachim Whaley, Germany and the Holy Roman Empire (2012); Peter H. Wilson, Heart of Europe (2016)",
]

[[bonus]]
text = "Farms cost -40%"
kind = "economic"
level = 1
change = "kept"
precedent = "Farms cost -40% (Teutons)"
basis = "Read as the Ostsiedlung (12th–14th centuries): locators settled peasants east of the Elbe and in Silesia, Bohemia and Poland under ‘German law’ (ius Teutonicum), with standard holdings (Hufen), the heavy plough and several rent-free years (Freijahre) to clear and sow new land (Bartlett, The Making of Europe, 1993). An abstraction: cheap farms stand for the low start-up cost of these settlements."

[[bonus]]
text = "Town Centers +10 garrison capacity; Towers +5 garrison capacity"
kind = "military"
level = 1
change = "kept"
precedent = "Town Centers +10 garrison capacity; Towers +5 garrison capacity (Teutons)"
basis = "During the truce with the Magyars (926–933) Henry I had fortified refuges (urbes) built; Widukind (I.35) says one in nine agrarii milites lived in them and a third of the harvest was stored there, which prepared the victory at Riade (933). The later German lands had one of the densest castle networks in Europe, plus walled towns."
contested = "Whether this was a systematic ordinance (‘Burgenordnung’) and who the agrarii milites were."

[[bonus]]
text = "Infantry and Mounted Units +1/+2 melee armor in Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Infantry and Mounted Units +1/+2 melee armor in Castle/Imperial Age (Teutons)"
basis = "Nuremberg, Augsburg and Landshut were among the great armour-making centres of 15th-century Europe (‘Gothic’ plate; the Helmschmid workshop of Augsburg worked for Maximilian I), and Passau and Solingen blades were exported widely. The link is strongest for the Imperial Age."

[[bonus]]
text = "Monks +100% healing range"
kind = "other"
level = 1
change = "kept"
precedent = "Monks +100% healing range (Teutons)"
basis = "The Teutonic Order began as a field hospital set up by merchants from Bremen and Lübeck at the siege of Acre (1190) and became a military order only in 1198; the care of the sick stayed in its rule and its Grand Hospitaller was one of its great officers. German monastic medicine (Lorsch Pharmacopoeia, c. 795; Hildegard of Bingen, 12th century) adds to the link."

[[bonus]]
text = "Murder Holes, Herbal Medicine free"
kind = "other"
level = 1
change = "kept"
precedent = "Murder Holes, Herbal Medicine free (Teutons)"
basis = "An abstraction of castle culture and monastic medicine: the Lorsch Pharmacopoeia (c. 795), Walafrid Strabo’s herb-garden poem Hortulus (Reichenau, 9th century) and Hildegard of Bingen’s Physica. Both techniques were common to all of Latin Europe, so this is flavour rather than a distinctive trait."

[team_bonus]
text = "Natural gold sources last +15% longer"
level = 1
change = "new"
replaces = "Units more resistant to conversion"
precedent = "Natural gold sources last +15% longer (Muisca team bonus)"
basis = "German miners opened and ran mines all over Central Europe: Rammelsberg near Goslar (silver, traditionally from 968) and Freiberg (1168) at home, then Jihlava and Kutná Hora in Bohemia, Kremnica and Banská Štiavnica in Hungary, and Novo Brdo in Serbia, carrying the mining law of Freiberg and Jihlava with them; their drainage adits and shaft techniques kept deep mines working (Bartlett 1993; Agricola codified this knowledge in De re metallica, 1556). As a team bonus it reflects German mining expertise working for the neighbours."
contested = "Mines ‘lasting longer’ is an abstraction of deeper and longer exploitation, not of larger ore bodies."

[[unique_unit]]
name = "Teutonic Knight"
model = "Boyar"
building = "Castle"
level = 1
change = "changed"
replaces = "Teutonic Knight (Infantry): slow infantry with exceptional melee armor, resistant to conversion"
basis = "The brother-knights of the Order fought mounted, as heavy cavalry: at Durbe (1260) and at Grunwald (1410), a few hundred brothers per campaign led sergeants, guest crusaders and Prussian auxiliaries (Christiansen 1997; Urban 2003). The Boyar profile (cavalry with exceptional melee armour, weak against the Spearman-line and Monks) is the closest existing match; making them infantry inverted their role and fitted at most dismounted knights in sieges and garrisons."
contested = "In N1 the unit uses the Boyar’s stats and art, so it loses the old unit’s extra resistance to conversion (see ideas)."

[[unique_tech]]
name = "Hanse"
age = "Castle"
effect = "Trade Units generate +25% gold; Hulk-line +20% HP"
level = 1
change = "new"
replaces = "Ironclad (Siege Weapons +4 melee armor)"
precedent = "Trade Units generate +25% gold (Spanish team bonus); Longships and Catapult Galleons +20% HP (Saxons)"
basis = "The Hanse (c. 1250–1500) linked Lübeck, Hamburg, Cologne, Danzig and dozens of other German towns, with Kontore at Novgorod, Bergen, London and Bruges; its cogs and later hulks (the ship type that gives the game’s Hulk-line its name) also fought, and the towns forced Denmark to the Peace of Stralsund (1370). The Teutonic Order took part in the Hanse with its Prussian towns and conquered Gotland from the Victual Brothers in 1398 (Dollinger 1964). Ironclad is dropped: the word dates from 1859 and armouring siege engines with hides and boards was universal."

[[unique_tech]]
name = "Crenellations"
age = "Imperial"
effect = "Castles +3 range, garrisoned Infantry fires arrows"
level = 1
change = "kept"
precedent = "Crenellations (Castles +3 range, garrisoned Infantry fires arrows) (Teutons)"
basis = "Kept for the dense castle landscape of the German lands and the Order’s convent-castles in Prussia, garrisoned by brothers and men-at-arms, with Marienburg, seat of the Grand Master from 1309, as the largest brick castle in Europe. The mechanic itself is generic: battlements existed everywhere."
contested = "The analysis rates this tech ‘stretched’: nothing in it is specifically German apart from the density of castles."

[tree]
add = ["Arbalester", "Architecture", "Treadmill Crane", "Gold Shaft Mining", "Dry Dock"]
remove = ["Siege Onager"]

[tree.basis]
"Arbalester" = "Crossbowmen were central to the Order’s garrisons and arsenals in Prussia and to the urban militias of the German towns, whose shooting guilds (Schützengilden) appear from the 14th century. The Teutons already have the Heavy Mounted Crossbowman; the foot upgrade completes the crossbow line."
"Architecture" = "Romanesque Speyer, Gothic Cologne, the brick Gothic of the Baltic towns and the Order’s castles (Marienburg) make the absence hard to justify for a defensive civilization."
"Treadmill Crane" = "The medieval treadwheel crane is almost a German emblem: the crane of Cologne cathedral stood on the unfinished south tower from the 15th century until 1868, and the Krantor of Danzig (1442–44) was built under the Order."
"Gold Shaft Mining" = "Germany was the mining heart of medieval Europe (Rammelsberg, Freiberg, the Harz and the Erzgebirge, Schwaz in Tyrol); lacking the late mining upgrade contradicted that."
"Dry Dock" = "Hanseatic fleets dominated the Baltic and the North Sea, defeated Denmark (1367–70) and carried the Order to Gotland (1398); a weak navy contradicted this."
"Siege Onager" = "Removed to offset the additions. There is no specific German basis for the top torsion-engine upgrade (held by only 15 civs); the Teutons keep the Onager, Capped Ram, Trebuchet and Bombard Cannon."

[architecture]
set = "Central European"
change = "kept"
basis = "The Central European set is the one modelled on the German lands, and Bohemia, also part of the Empire, joins it in this redesign."
