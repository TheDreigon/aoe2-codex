civ = "Malians"
name = "Malians"
status = "reviewed"
label = "Infantry and Archer civilization"
summary = "Malians as the Mali Empire of the Mande (1235–1599): Tontajon archers replace the Gbeto, the farba governors become the Town Center tech, the salt trade and poisoned arrows passives, war canoes (the Scenario Editor's Canoe) the Galley line, and gunpowder, Trebuchet, Keep, camels and cavalry archers leave, with the Halberdier and Siege Ram as substitutes."
ideas = [
  "N2: Jeli (griot): a support unit with an aura (the Centurion's mechanic) that hastens nearby units, for the griots who exhorted warriors and kept the memory of Sunjata (Balla Fasseke).",
  "N2: Give the Canoe (the Galley line on the Scenario Editor's Canoe model) stats of its own, a fast and cheap river warship with arrows, for the Niger boatmen (the Sorko and Bozo) and Sonni Ali's later fleet (Tarikh al-Sudan); N1 gives it only the canoe's look.",
  "N2: Give the Tontajon stats of its own on the existing Blackwood Archers art (RULES section 5): a simple-bow archer with damage-over-time poison, built from existing mechanics.",
  "N2: Donso: the Mande hunters' brotherhoods, masters of the bow and of the bush in the Sunjata epic, as a scouting unit or a hunting-and-scouting technology (their medieval antiquity rests on oral tradition).",
  "N3: A Tontajon model of its own (Mande dress and simple bow) instead of the Tupi Blackwood Archers model (new art, RULES section 5).",
  "N3: A Songhay civ (1464–1591) with Timbuktu's scholarly peak and the river fleet, and a Ghana (Wagadu) civ or phase, leaving the Malians to the Mali Empire.",
  "N3: Sahelian siege warfare by blockade and assault (Mali's repeated attacks on Djenné and Sonni Ali's long siege of the town, Tarikh al-Sudan), in place of the generic Mangonel-line and rams.",
]
contested = [
  "Name: ‘Malians’ is also the name of the citizens of the modern republic (1960), and the people of the empire were the Mande (Maninka). The civ keeps the game's name (RULES section 4 and 6.16.15), and its entity names the Mali Empire.",
  "The tontajon clans and the Kurukan Fuga ‘charter’ are known from oral tradition recorded in the 20th century; their exact form and date are debated.",
  "Abu Bakr II's Atlantic voyage, reported by Mansa Musa to al-Umari's informants.",
  "The Almoravid conquest of Ghana in 1076 (Conrad and Fisher, 1982–1983).",
  "The dates of Mansa Musa's reign (1312–1337 or 1307–1332) and the site of the capital (Niani or elsewhere; Fauvelle).",
  "The founding and date of the Sankore mosque, attributed by al-Sa'di to a wealthy woman.",
  "The etymology of Farimba as used by the game (from farin, ‘brave’?).",
  "The Kano Chronicle's date for the arrival of Wangara Muslims in Kano (under Yaji, 1349–1385) comes from a 19th-century compilation.",
  "How far the poisoned arrows of the Senegambian coast, rather than other causes, made the Portuguese turn from raiding to trading there in the 1450s.",
  "Walled towns: the loopholed earthen walls (tata) are known mainly from 19th-century fortifications (Sikasso, Samori's towns); medieval Malian town walls are thinly attested.",
]
open_questions = []

[profile]
entity = "The Mali Empire (Manden Kurufaba) of the Mande (Maninka) under the Keita mansas"
region = "Western Sudan: the upper and middle Niger, Senegambia and the southern Saharan towns (Walata, Timbuktu, Gao)"
window = "1235–1599 (from Kirina, traditionally 1235, to Mahmud IV's defeat before Djenné, 1599, a terminal event after 1500 with a stated core inside the time frame (RULES 6.16.17, accepted for the Malians in the level-1 review, section 6, CQ21); core 1235–1400; no late element)"
sources = [
  "al-Bakri (1068), al-Umari (c. 1337–1340), Ibn Battuta (visit of 1352–1353) and Ibn Khaldun, in N. Levtzion and J. F. P. Hopkins, Corpus of Early Arabic Sources for West African History (1981)",
  "al-Sa'di, Tarikh al-Sudan (c. 1655; trans. J. O. Hunwick, Timbuktu and the Songhay Empire, 1999)",
  "Gomes Eanes de Zurara, Crónica da Guiné (c. 1453)",
  "Alvise Cadamosto, Navigazioni (voyages of 1455–1456)",
  "D. T. Niane, Soundjata ou l'épopée mandingue (1960)",
  "Nehemia Levtzion, Ancient Ghana and Mali (1973)",
  "Robin Law, The Horse in West African History (1980)",
  "François-Xavier Fauvelle, Le rhinocéros d'or (2013)",
  "Michael A. Gomez, African Dominion (2018)",
]

[[bonus]]
text = "Buildings cost -15% wood"
kind = "economic"
level = 1
change = "kept"
precedent = "Buildings cost -15% wood (Malians)"
basis = "Sudano-Sahelian architecture builds in banco (earth) with few palm-wood beams (toron); the Djinguereber mosque of Timbuktu (c. 1327, attributed to Abu Ishaq al-Sahili for Mansa Musa) is the classic example."
relevance = "Earthen building on a timber-poor savanna shaped every Sahelian town and mosque; it is the visual identity of Mali."

[[bonus]]
text = "Villagers drop off +10% more gold"
kind = "economic"
level = 1
change = "kept"
precedent = "Villagers drop off +10% more gold (Malians)"
basis = "Mali controlled the goldfields of Bambuk and Bure; according to al-Umari, Mansa Musa's passage through Cairo on pilgrimage (1324) depressed the value of gold there for years."
relevance = "Gold was the base of Mali's power and fame, from the trans-Saharan trade to the Catalan Atlas (1375); unlike gold-mining bonuses with weak historical weight, this one carries the civ's identity."

[[bonus]]
text = "Barracks Units +1/+2/+3 pierce armor in Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Barracks Units +1/+2/+3 pierce armor in Feudal/Castle/Imperial Age (Malians)"
basis = "Mali's army was above all infantry: al-Umari's informants put it at about 100,000 men, of whom about 10,000 were horsemen; modern historians describe the foot soldiers as spearmen and archers (Levtzion, 1973). The extra pierce armour is an admitted abstraction of that infantry."
relevance = "A mass infantry army under a cavalry elite conquered and held the empire; the trait is central, though the effect is an abstraction."
contested = "No source shows Mande infantry as especially protected against missiles; the bonus is largely a balance choice, kept to preserve the civ's infantry identity rather than replaced by an archer bonus (such as ‘Foot Archers cost -10/20/30% in Feudal/Castle/Imperial Age’, Mayans), which the Tontajon and the poison passive already make unnecessary."

[[bonus]]
text = "Trade Units generate +10% food in addition to gold"
kind = "economic"
level = 1
change = "new"
precedent = "Trade Units generate +10% food in addition to gold (Bengalis team bonus)"
basis = "Mali's wealth rested on the Saharan exchange that carried its gold north and brought salt south. Ibn Battuta (1352) crossed from Taghaza, where the houses were built of salt and slabs of it were cut to be carried to the Sudan and used there as money, as gold and silver are elsewhere, to Walata, where the mansa's governor received the caravan; on his return he describes the copper of Takedda sold into the Sudan (Levtzion and Hopkins, 1981). Salt, the Sahel's scarce necessity, has no resource of its own in the game, so food stands for it. A hunters' bonus for the donso brotherhoods is not used because it would turn them into a food-gathering rate (see the N2 idea)."
relevance = "The salt-for-gold trade made Mali rich and tied it to the Islamic world, from Walata and Timbuktu to Cairo; without it there is no empire of Mansa Musa."

[[bonus]]
text = "Foot Archers deal poison damage starting in Imperial Age"
kind = "military"
level = 1
change = "new"
precedent = "Curare (Foot Archers and Fortifications deal poison damage) (Tupi): the effect of an existing Imperial Age unique tech, narrowed to Foot Archers and reused as an age-gated passive, worded as in ‘Town Centers cost -50% wood starting in Castle Age’ (Britons); the Tupi design drops Curare"
basis = "Mande and Senegambian archers poisoned their arrows. Cadamosto's caravels were attacked on the Gambia by canoes of archers shooting poisoned arrows (1455), and on his next voyage (1456) he describes the lords of the Gambia as subjects of the ‘emperor of Melli’; earlier, Zurara's Chronicle of Guinea tells how Nuno Tristão and most of his crew died of poisoned arrows on a river south of Cape Verde (1446; the river is disputed). The Portuguese raids on this coast mostly failed and gave way to trade. A long-standing technique with no moment of adoption is structural, so it is a passive rather than a unique tech (RULES 6.2, 6.3); Curare's fortification half is left out, since nothing documents poisoned arrows shot from Malian walls."
relevance = "Poison made up for the weak bows of the Mande archers and checked the Portuguese raids on Mali's western provinces; it is the best-documented technique of the Mande archers there."
contested = "The coastal peoples who killed Nuno Tristão are not named in the sources; the evidence comes from the western fringe of the empire."

[team_bonus]
text = "Universities work +80% faster"
level = 1
change = "kept"
precedent = "Universities work +80% faster (Malians team bonus)"
basis = "Under Mali's rule of Timbuktu (c. 1325–1433) Mansa Musa brought scholars back from his pilgrimage and had the Djinguereber built, and Ibn Battuta (1352–1353) saw such zeal for learning the Qur'an by heart that children were put in fetters until they knew it. Mande-speaking Muslim traders and clerics (Wangara, Juula) carried Islam and learning to neighbours, to Hausaland, where the Kano Chronicle places their arrival under Yaji (1349–1385), and to the forest edge. Timbuktu's peak came later, under Songhay (Ahmad Baba, 1556–1627). Identical team-wide effects count once per team (RULES 6.16.12)."
relevance = "Mali made the Sahel part of the Islamic world of learning and spread it to its neighbours through the Wangara clerics, a benefit to others as RULES 6.2 requires."
contested = "‘University’ is anachronistic: learning was organised in circles of teachers around the mosques."

[[unique_unit]]
name = "Tontajon"
model = "Blackwood Archers"
building = "Castle"
level = 1
change = "new"
replaces = "Gbeto"
basis = "Mande tradition gives Sunjata's army the tontajon, the ‘quiver-bearers’ (ton-ta-jon), sixteen clans of free warriors who formed the military arm of the Manden; archers were the mass of Mande infantry, using simple bows whose weakness they made up for with poison, and Ibn Battuta (1352) saw the mansa himself come to audience with a bow in his hand and a quiver on his back. The Blackwood Archers, cheap self-bow archers trained in pairs at half population and strong in high numbers, fit that mass archery; the Armenian Composite Bowman, the alternative, has an armour-ignoring composite bow, the opposite of the Mande self bow. The Gbeto came from the Fon kingdom of Dahomey (18th–19th centuries), far from Mali in place and time."
relevance = "Archers were the bulk of the army that founded and held the empire, and the quiver-bearers are the founding warrior class of Mande tradition."
contested = "The tontajon clans are known from oral tradition; the model shows a Tupi archer, shared with the Tupi (see the N3 idea)."

[[unique_tech]]
name = "Farba"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Foot Soldiers cost -5% per Town Center or Castle controlled (maximum -20%)"
level = 2
change = "new"
precedent = "A new tech copying one existing effect type: ‘Foot Soldiers cost -5% per Town Center or Castle controlled (maximum -20%)’ (Saxons, civ bonus)"
basis = "The mansas ruled subject towns and provinces through governors called farba, a word Ibn Battuta glosses as ‘deputy’: at Walata in 1352 the farba Husayn received the merchants of his caravan, speaking to them only through an interpreter (Levtzion and Hopkins, 1981). Through such governors and the local chiefs the provinces supplied the levies of an army that al-Umari's informants put at about 100,000 men (Levtzion, 1973); foot soldiers that grow cheaper with every town held translate this. Tigui (Town Centers fire arrows without garrison) had no documented referent (see dropped), and no existing tech expresses provincial governors, so this is a new tech (level 2). A tech for Mansa Musa's pilgrimage (1324) was weighed and set aside: the hajj was a royal journey, not an institution of government, and its fame already shows in the gold bonus."
relevance = "Governors in the subject towns let the mansas hold an empire from the Atlantic to Gao with few officials; they are one of the few institutions of Mali's government that the Arabic sources describe."
contested = "How the farba were appointed and how far their authority reached beyond the trading towns is unclear."

[[unique_tech]]
name = "Farimba"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Cavalry +5 attack"
level = 1
change = "kept"
precedent = "Farimba (Cavalry +5 attack) (Malians)"
basis = "The name seems to come from farin, ‘brave’, a Mande title of war leaders that also lies behind the governors' title farba; the horsemen, mounted on costly horses brought across the Sahara, were the warrior aristocracy (Law, 1980). They fought with lance, javelins and sword and are carried by the generic Stable lines; the regional Genitour is not extended to the Malians (owner's decision, RULES 6.16.10). The cavalry aristocracy is a long tradition rather than a datable moment, so Farimba keeps the mandatory Castle slot as a flagged fallback (RULES 6.16.19(b)): no datable military reform of the mansas is documented well enough to replace it, and Kirina (1235), the founding victory, is a battle, not a reform."
relevance = "Cavalry was the instrument of the Sudanic empires (Law, 1980): Mali's mounted nobility conquered and policed the savanna."
contested = "The exact etymology used by the game is unconfirmed."

[tree]
add = ["Bracer", "Halberdier", "Siege Ram"]
remove = ["Hand Cannoneer", "Bombard Cannon", "Cannon Galleon", "Siege Onager", "Trebuchet", "Cavalry Archer", "Heavy Cavalry Archer", "Camel Rider", "Heavy Camel Rider", "Arbalester", "Thumb Ring", "Carrack", "Keep", "Block Printing"]

[tree.basis]
"Bracer" = "Archers were the mass of Mande infantry (the tontajon), so the archers' Blacksmith line should be complete; the analysis lists Bracer as missing. Arrowslits, which the analysis lists with it, stays out: medieval Malian fortifications are thinly attested, and the loopholed tata walls are 19th-century (see contested)."
"Halberdier" = "The anti-cavalry substitute for the removed camels (RULES 6.11), as in the Mongols' and Khitans' designs: a generic top spear tier for Mali's foot soldiers, whom modern historians describe as spearmen and archers (Levtzion, 1973)."
"Siege Ram" = "Substitute for the removed Trebuchet and Bombard Cannon as the late anti-building engine (RULES 6.11), as for the Goths and the Malay: Sahelian towns were taken, when at all, by blockade and assault (see the Siege Onager), for which the ram is the game's generic tool, an abstraction. The civ has no long-range anti-building weapon, as RULES 6.16.5 allows where none is attested."
"Hand Cannoneer" = "Neither Mali nor its Songhay successor used firearms: Songhay's army was routed at Tondibi (1591) by Judar Pasha's Moroccan arquebusiers precisely because it had none."
"Bombard Cannon" = "As Hand Cannoneer: no gunpowder in the Western Sudan before the Moroccan invasion of 1591. Rams, Petards and infantry still destroy buildings."
"Cannon Galleon" = "No gunpowder, and the civ lacked the Galleon, so the Cannon Galleon was incoherent. The boat-tier navy that stays (see the Carrack) keeps the Galley line, on the canoe model (see the renames), the fire ships, hulks and demolition ships."
"Siege Onager" = "The top tier of the stone-thrower line is dropped (the tech tree audit rates it unfounded); the Mangonel and Onager stay as the generic stone-thrower and the rams as the abstraction of assault (RULES 6.16.5). Sahelian towns were taken, when at all, by blockade and assault: al-Sa'di's Tarikh al-Sudan says, with a formulaic number, that the rulers of Mali attacked Djenné ninety-nine times without taking it."
"Trebuchet" = "No torsion or traction artillery is attested in the Sahel (analysis; tech tree audit), so the counterweight engine never reached the civ and is removed (RULES 6.16.5); the Mangonel and Onager stay as the generic stone-thrower, and the Siege Ram becomes the late anti-building engine."
"Cavalry Archer" = "Sahelian horsemen fought with lance, javelins and sword, and the archers fought on foot (tech tree audit)."
"Heavy Cavalry Archer" = "As Cavalry Archer."
"Camel Rider" = "No camel troops are attested in Mali's armies: al-Umari counts only horse and foot, the Massufa of Walata and Taghaza were caravaneers and guides, and the Tuareg were rivals who took Timbuktu from Mali in 1433 (analysis; tech tree audit). The Ethiopian design removes its camels on the same kind of evidence. The Halberdier replaces it as the anti-cavalry unit (RULES 6.11); the camels are not kept as an abstraction of the Saharan peoples inside or beside the empire, whose service in Mali's armies is not attested."
"Heavy Camel Rider" = "As Camel Rider."
"Arbalester" = "No crossbow is attested in the Sahel, so the crossbow tier goes (RULES 6.16.3); the Crossbowman stays as the generic Castle Age bow upgrade until the N2 bow/crossbow split, and the Tontajon fills the elite archer role. The tech tree audit rates the Malian Arbalester unfounded."
"Thumb Ring" = "No thumb draw or thumb rings are attested for Sahelian archery (RULES 6.16.4); the thumb draw belongs to the steppe and Asian traditions (names theme), and other designs drop the tech on the same ground (among them the Ethiopians, Malay, Maya, Inca and Muisca)."
"Carrack" = "The navy is the boat tier (RULES 6.16.1), which keeps the generic lines without the Galleon and Carrack: Mali's craft were dugout canoes, on its own river, where Ibn Battuta travelled down the Niger from Timbuktu (1353) in a small boat carved from a single piece of wood (Levtzion and Hopkins, 1981), and on the empire's western fringe, where canoes of archers attacked the Portuguese on the Gambia (Cadamosto, 1455); there were no high-castled sailing warships."
"Keep" = "Sudano-Sahelian building was in earth, and medieval Malian town walls are thinly attested (see contested); the Guard Tower stays as the abstraction of defended posts, as for the Muisca."
"Block Printing" = "No printing in the window: the scholarship of Timbuktu and the Sahel lived in manuscripts copied by hand."

[[rename]]
from = "Elite Blackwood Archers"
to = "Elite Tontajon"
level = 1
basis = "Follows the unique unit (Blackwood Archers → Tontajon) for the Malians only."

[[rename]]
from = "Galley"
to = "Canoe"
model = "Canoe"
level = 1
basis = "Mali's craft were dugout canoes: Ibn Battuta travelled down the Niger from Timbuktu (1353) in a small boat carved from a single piece of wood (Levtzion and Hopkins, 1981), and canoes of archers attacked Cadamosto's caravels on the Gambia with poisoned arrows (1455) (see the Carrack). The Scenario Editor's Canoe (RULES section 5; codex/tools/scenario-units.md), a light boat that shoots arrows like the Galley, gives the Galley the look of a dugout war canoe, which fits the boat tier far better than a Mediterranean galley; the Galley keeps its stats, and the Canoe's look and scale must be checked in game. Same rename as in the Aztec, Avar, Mapuche, Maya and Tupi designs. No Mande name for the war canoe is secure in the sources used here, so the generic English name is used."

[[rename]]
from = "War Galley"
to = "War Canoe"
model = "Canoe"
level = 1
basis = "Upgrade tier of the renamed Galley, with the same Canoe look (see Galley)."

[architecture]
set = "African"
change = "kept"
basis = "Sudano-Sahelian earth building (Djinguereber, Djenné, Walata) is what the African set represents. Treadmill Crane stays in the tree, as in the game, flagged as a generic abstraction of faster building under the region's one reading of the tech (see the Arabs' design), as in the American designs whose civs built without cranes: no lifting machine is attested in the Sahel, and building in banco (sun-dried earth) was raised by hand, the projecting toron beams serving as fixed scaffolding. It rests on Mansa Musa's building, the Djinguereber (c. 1327) and the domed audience hall that Abu Ishaq al-Sahili built for him (Ibn Khaldun, in Levtzion and Hopkins, 1981); the earthen architecture is also carried by the -15% wood bonus and the African set."

[[dropped]]
item = "Tigui (Town Centers fire arrows without garrison)"
kind = "unique_tech"
reason = "Relevance test (RULES 6.9): the effect has no documented Malian referent (analysis: stretched), the walled-town reading leans on 19th-century tata, and a reading as village and canton chiefs (dugutigi, kafutigi) would express rule through chiefs only loosely. The mansa's governors (Farba), one of the few documented institutions of Mali's government, take the Town Center slot, and Tigui is not kept as a gameplay survivor without a referent. The effect stays in the codex with the Italians' Comune."
