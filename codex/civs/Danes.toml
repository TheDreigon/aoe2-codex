civ = "Danes"
name = "Danes"
status = "reviewed"
label = "Infantry and Defensive civilization"
summary = "Denmark from Godfred to the end of the Kalmar Union (808–1523): Trelleborg ring forts and the Danevirke replace the invented siege identity, the Øresund toll is the Town Center tech, the Varangian Guard becomes the Housecarl, Lund's church carries the team bonus, Kalmar-era guns and ships enter, and the mounted crossbow line leaves."
ideas = [
  "N2: Danegeld: infantry generate gold while attacking enemy buildings (the Keshik and Varangian Guard gold mechanic applied to a new target), instead of the generic loot bonus.",
  "N2: Remove the Housecarl's gold generation inherited from the Varangian Guard model, or tie it to plunder rather than to fighting units; the Anglo-Saxons' design also proposes removing it.",
  "N2: Absalon: a crusading-fleet tech for Warships and Monks, for the Valdemarian crusades led by warrior bishops (Arkona 1168, Estonia 1219).",
  "N2: Hedeby: a Market tech for the royal emporium to which Godfred moved the merchants of Reric (Royal Frankish Annals s.a. 808), for example on the effect of Silk Road (Trade Units cost -50%).",
  "N3: A true Trelleborg building (circular rampart, four gates, standardised longhouses) instead of the renamed Krepost.",
  "N3: The Øresund toll as a mechanic: Docks earn gold from passing Trade Cogs, beyond what the Town Center tech can express.",
  "N3: A late Nordic brick-Gothic architecture set (Roskilde, Uppsala), shared with the Swedes: creating a set is N3 (RULES 6.15).",
]
contested = [
  "Who built the Trelleborg-type fortresses (Harald Bluetooth or Sweyn Forkbeard) and why: barracks for the conquest of England, royal control of the provinces, or defence against other Vikings.",
  "Chronology of the Danevirke: radiocarbon dates put a first stage c. 500 or earlier, dendrochronology gives phases in 737 and 968, and the Royal Frankish Annals credit Godfred with works in 808.",
  "Historicity of the Jomsvikings as an organised brotherhood and the identification of Jomsborg with Wolin.",
  "What housecarls were: a paid standing guard (L. M. Larson, 1904) or royal and noble retainers, many of them landholders (N. Hooper, 1985). The Anglo-Saxons' design also claims Cnut's housecarls under the same name, since they served the Anglo-Danish kings of England.",
  "Reliability of Sven Aggesen's Lex Castrensis, written in the 1180s: it may describe the household troops of his own day rather than Cnut's.",
  "When the leding became a public levy: Niels Lund (Lið, leding og landeværn, 1996) argues that it is a 12th-century development rather than a Viking-age institution.",
  "How far Cnut ruled Sweden: his letter of 1027 claims only ‘part of the Swedes’.",
  "Which was the first book printed in Denmark: Johann Snell's Breviarium Ottoniense, printed at Odense in 1482 for Bishop Karl Rønnow, or Guillaume Caoursin's account of the siege of Rhodes, which Snell printed there in the same year. Either way printing falls inside the window, so Block Printing stays in the tree; the same printing-date test gives it to the Swedes (Stockholm, 1483) and removes it from the Norwegians (to 1469) and the Rus' (to 1505).",
  "Label (RULES 6.16.16): ‘Infantry and Defensive’ follows the redesign, which rests on infantry (the Housecarl, the Jomsviking) and on defence (Trelleborg, the Danevirke, the Fortified Wall). It matches the Anglo-Saxons' design; the relabel ‘Defensive and Naval’ was weighed and not adopted, since the Danes' naval elements (the Longship half of the speed passive, the Carrack and Cannon Galleon of the tree) weigh less than their infantry. The ramparts, the Øresund toll and the fleets set the two designs apart in play.",
  "Counterweight trebuchet: its Danish use is an inference. Saxo has Erik Emune, in the civil war of the 1130s, besiege Haraldsborg near Roskilde with a throwing engine that Germans living in Roskilde built and worked for him, the Danes being then unskilled in such machines (Vemming Hansen 1992), a traction engine by its date; Kurt Villads Jensen traces large war machines in Denmark and the Baltic around 1200 (2009). The type of the later Danish engines is not recorded in the sources used for this design. The later evidence falls in the counterweight era, so the design reads the Danish engines of the 13th–15th centuries as counterweight engines, a flagged inference on the standard of the Georgians' design (an inference with a stated basis, RULES 6.16.5); if they were man-powered, the Traction Trebuchet would replace the Trebuchet (RULES 6.11).",
]
open_questions = []

[profile]
entity = "Kingdom of Denmark (the Danes)"
region = "Jutland, the Danish islands, Scania, Halland and Blekinge; with the Danelaw (9th–10th centuries), Cnut's North Sea empire (1016–1035), the Valdemarian conquests on the southern Baltic coast and in Estonia (1168–1346) and the Kalmar Union (1397–1523), which the Danish crown led; Norway within it is covered by the Norwegians (to 1469) and Sweden by the Swedes (to 1500)"
window = "808–1523 (from Godfred's rampart and the move of Reric's merchants to Hedeby, Royal Frankish Annals, to the end of the Kalmar Union, a terminal event soon after 1500 as RULES 6.16.17 allows; core 808–1500, from Godfred to King Hans; nothing in the design originates after 1500, the generic skeleton items of RULES 6.16.2 aside)"
sources = [
  "Royal Frankish Annals",
  "Anglo-Saxon Chronicle",
  "Abbo of Saint-Germain, Bella Parisiacae urbis (c. 897)",
  "Adam of Bremen, Gesta Hammaburgensis ecclesiae pontificum (c. 1075)",
  "Saxo Grammaticus, Gesta Danorum; Sven Aggesen, Lex Castrensis (1180s)",
  "Knýtlinga saga; Jómsvíkinga saga",
  "Jelling runestones (DR 41, DR 42)",
  "Else Roesdahl, Viking Age Denmark (1982)",
  "N. Hooper, ‘The Housecarls in England in the Eleventh Century’, Anglo-Norman Studies 7 (1985)",
  "Niels Lund, Lið, leding og landeværn (1996)",
  "Timothy Bolton, Cnut the Great (2017)",
  "Kurt Villads Jensen, Crusading at the Edges of Europe: Denmark and Portugal c.1000–c.1250 (2017); ‘Large Castles and Large War Machines in Denmark and the Baltic around 1200: An Early Military Revolution?’, Revista de História das Ideias 30 (2009)",
  "Peter Vemming Hansen, ‘Experimental Reconstruction of a Medieval Trébuchet’, Acta Archaeologica 63 (1992)",
]
replaces = "Danes of the Viking Age only (to 1042), with an invented siege identity"

[[bonus]]
text = "Fishing Ships and Villagers drop off +5% food"
kind = "economic"
level = 1
change = "kept"
precedent = "Fishing Ships and Villagers drop off +5% food (Danes)"
basis = "The herring of the Øresund and the great Scania market at Skanör and Falsterbo (12th–16th centuries), taxed by the Danish crown and frequented by Hanseatic merchants, were a backbone of the medieval Danish economy; Saxo's preface praises the Sound's abundance of fish. The Villager part is a generic abstraction."
relevance = "The Scania herring fair was one of the great markets of northern Europe and a main royal revenue; the Danes and the Hanse fought over it (Stralsund, 1370). Fishing shaped this civ's history."

[[bonus]]
text = "Loot 25% of the resource cost of each destroyed building"
kind = "economic"
level = 1
change = "kept"
precedent = "Loot 25% of the resource cost of each destroyed building (Danes)"
basis = "Plunder and the Danegeld: Paris paid 7,000 pounds of silver in 845, and the Anglo-Saxon Chronicle records tributes rising from 10,000 pounds (991) to 48,000 (1012), and Cnut's levy of 72,000 pounds, besides 10,500 from London, in 1018."
relevance = "Plunder and tribute financed Danish kingship from the Great Army to Cnut's conquest of England."

[[bonus]]
text = "Can build Trelleborg in Castle Age"
kind = "military"
level = 1
change = "new"
replaces = "Barracks and Siege Workshop upgrades cost -66% gold"
precedent = "Can build Krepost in Castle Age (Bulgarians)"
basis = "The Trelleborg-type ring fortresses (Trelleborg, Fyrkat, Aggersborg, Nonnebakken, Borgring) were built to one geometric plan with standardised longhouses for a garrison; Trelleborg's timber was felled in 980/981 (dendrochronology), under Harald Bluetooth. The Krepost, a small castle that trains unique units and houses troops, is the closest existing building. The replaced bonus had no historical correlate."
relevance = "The ring forts are the clearest trace of Harald Bluetooth's new royal power, which unified and Christianised Denmark; they are on the UNESCO World Heritage List (2023)."
contested = "Builder and purpose of the forts are debated (see the civ-level notes)."

[[bonus]]
text = "Housecarls and Longships move +10% faster"
kind = "military"
level = 1
change = "changed"
replaces = "Varangian Guards and Longships move +10% faster"
precedent = "Varangian Guards and Longships move +10% faster (Danes)"
basis = "The game's effect is kept through the rename of the Varangian Guard to Housecarl; its basis is the strategic mobility of Danish armies in general, not of the housecarls in particular. Danish armies moved by ship and as mounted infantry (the Great Army ‘was horsed’ in East Anglia, Anglo-Saxon Chronicle 866), in long, slender warships such as Hedeby 1 (c. 985), which sank in the harbour of Haithabu."
relevance = "Strategic mobility by sea and on horseback let Danish armies strike from the Seine to the Humber and conquer England twice (1013, 1016)."

[team_bonus]
text = "Monasteries work +20% faster"
level = 1
change = "new"
replaces = "Siege Weapons +2 line of sight"
precedent = "Monasteries work +20% faster (Lithuanians team bonus). Eight designs use it, the largest cluster of reused team bonuses: reuse is accepted in N1 and identical team-wide effects count once per team (RULES 6.16.12); the planned N2 diversification pass may give the Danes another religious-influence effect."
basis = "Lund was the first archbishopric in Scandinavia: from 1103/04 it ruled the Church of all Scandinavia until Nidaros (1152/53) and Uppsala (1164) received their own, and kept its primacy over Uppsala. Danish kings and bishops led missions and founded churches among their neighbours: Absalon took Arkona on Rügen in 1168 and destroyed the temple of Svantevit, and Valdemar II's crusade to Estonia (1219) led to the see of Reval (Tallinn), a suffragan of Lund. Harald Bluetooth's Jelling stone (c. 965), which says he ‘made the Danes Christian’, is the background. Faster allied monasteries render the clergy Lund trained and sent (RULES 6.2: religious influence). The replaced team bonus had no historical basis."
relevance = "Lund organised the Church of the whole North and led the Baltic missions, the most lasting Danish influence on its neighbours."
contested = "The crusades on the southern Baltic coast and in Estonia were conquests as much as missions."

[[unique_unit]]
name = "Jomsviking"
model = "Jomsviking"
building = "Castle"
level = 1
change = "kept"
basis = "The Jomsvikings of Jómsvíkinga saga (c. 1200), a warrior brotherhood at Jomsborg, usually identified with Wolin (Adam of Bremen's Iumne), where Harald Bluetooth died in exile. The battle of Hjǫrungavágr (c. 986), which the sagas make their defeat, is attested in near-contemporary skaldic verse, and the sagas make Thorkell the Tall, whose ‘immense raiding army’ came to England in 1009 (Anglo-Saxon Chronicle), one of their chiefs. The torches render the burning of settlements and ships."
relevance = "Fame carries much of it, but the Jomsvikings stand for the professional war bands of the late 10th and early 11th centuries, Thorkell's army of 1009–1012 among them, that fought the Danish wars in England."
contested = "The organised ‘order’ is largely literary, and the unit's strength against cavalry is a game invention."

[[unique_tech]]
name = "Danevirke"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Fortifications and Town Centers regenerate 500 HP per minute"
level = 1
change = "new"
precedent = "Fortified Bastions (Jurchens): the tech description reads ‘Fortifications and Town Centers regenerate 500 HP per minute’ and the civ window ‘Fortifications regenerate 500 HP per minute’; shared and renamed with an identical effect and age (the Jurchens' design renames it Jiehao)"
basis = "The Danevirke, the rampart across the neck of Jutland, was rebuilt in successive phases from c. 500 to the 12th century: a first stage c. 500 or earlier (radiocarbon), dendro-dated phases in 737 and 968, Godfred's work of 808 (Royal Frankish Annals) and the brick wall of Valdemar the Great (reigned 1157–1182). It held the border through wars: Otto II broke through it in 974, and the Danes regained the border region after 983. The semicircular rampart of Hedeby was joined to it by a connecting wall in the 10th century, hence the Town Centers. Regeneration renders this continuous royal upkeep, which suits a rampart rebuilt and repaired over six centuries better than a flat walls effect such as the Chinese Great Wall (Walls, Watch Tower-line and Bombard Towers +30% HP), which would also come close to the Anglo-Saxons' walls bonus."
relevance = "The rampart defined Denmark's southern border from Godfred to Valdemar and is the emblem of the Danish state's defence; with Hedeby it is on the UNESCO World Heritage List (2018)."

[[unique_tech]]
name = "Øresundstold"
building = "Town Center"
kind = "civil"
age = "Imperial"
effect = "All gold income +10% faster"
level = 2
change = "new"
precedent = "Grand Trunk Road (All gold income +10% faster; Market trading fee reduced to 10%) (Hindustanis), the gold half only, in the game's wording. The same half is also a level-2 Town Center tech in other designs (the Avars' Byzantine Tribute and the Bulgarians' Peace of 927 among them) and a passive in the Byzantines' design, and several more designs share the whole of Grand Trunk Road: one of the most reused effects of the codex, accepted in N1, with a diversification pass planned for N2 (RULES 6.16.12). No existing tech renders a toll."
basis = "From about 1429 Erik of Pomerania, king of the Kalmar Union, levied a toll on every ship passing the Sound at Helsingør, where he built the castle of Krogen to enforce it; the Sound Dues remained a main revenue of the Danish crown until they were abolished in 1857. A state revenue, so at the Town Center (RULES 6.2)."
relevance = "Control of the Sound and its toll made Denmark the gatekeeper of the Baltic and paid for its kings for four centuries."

[tree]
add = ["Krepost", "Cavalier", "Arbalester", "Fortified Wall", "Architecture", "Hand Cannoneer", "Bombard Cannon", "Carrack", "Cannon Galleon"]
remove = ["Siege Onager", "Catapult Galleon", "Thumb Ring", "Mounted Crossbowman", "Heavy Mounted Crossbowman", "Cranequins"]

[tree.basis]
"Krepost" = "Built as the Trelleborg ring fort (see the bonus and the rename)."
"Cavalier" = "Valdemarian Denmark fought with armoured knights (Lyndanisse 1219, Bornhöved 1227): in the 12th–13th centuries the naval levy was largely commuted into a tax, and military service shifted to tax-exempt lords serving as armoured horsemen (the herremænd)."
"Arbalester" = "Crossbows were common in the castles and fleets of 13th–15th-century Denmark, which gives the top tier the crossbow evidence RULES 6.16.3 asks for; the Danish crossbow is rendered on foot, by the Crossbowman and Arbalester (see the Mounted Crossbowman)."
"Fortified Wall" = "The Danevirke and Valdemar's brick wall make the Danes one of the great wall-building peoples of the North."
"Architecture" = "Stone and brick building of the medieval kingdom: Lund Cathedral (high altar consecrated 1145), Valdemar's brick wall and churches, the royal castle of Vordingborg."
"Hand Cannoneer" = "Guns reached Scandinavia in the 14th century (the Loshult gun, found in Scania, is one of the oldest surviving in Europe), and the Kalmar-era kings fought with hired German infantry: King Hans's army at Hemmingstedt (1500) was built around the mercenary Great Guard, a Landsknecht band of the kind that by 1500 included handgunners (their number in the Guard is not recorded in the sources used for this design), which was routed in the marsh with the loss of its guns and baggage. The tree follows the period the design represents (RULES 6.16.19(d)), and the Kalmar Union, which the Danish crown led to 1523, is part of it, so the guns of the late Kalmar kings enter (Hemmingstedt, 1500); the Swedes take the Hand Cannoneer on their own evidence (Brunkeberg, 1471), and the Norwegians, whose window ends in 1469, have no guns."
"Bombard Cannon" = "Danish royal forces carried guns by the end of the 15th century: King Hans's flagship Gribshunden carried guns when she sank in 1495 (see the Cannon Galleon), and Hans lost his field guns in the marsh at Hemmingstedt (February 1500). A cannon shot from Christian II's army mortally wounded the Swedish regent Sten Sture the Younger at Bogesund (January 1520), a confirmation after 1500 rather than the basis."
"Carrack" = "Navy tier (RULES 6.16.1): a fleet of ships, from the Viking-age warships of Hedeby and Skuldelev to the royal fleet of the Union kings. The game's gap of the Danes, no demolition ships, is kept, the Longship covering the anti-building role, and the Galleon is a flagged abstraction (RULES 6.16.2). King Hans's flagship Gribshunden, sunk off Ronneby in 1495, was a large carvel-built warship of the new type, the kind of ship the Carrack stands for."
"Cannon Galleon" = "Gribshunden carried guns (1495), an early case of shipboard artillery in northern waters."
"Siege Onager" = "Dropped with the invented ‘Siege’ identity of the game's Danes (Northmen's Fury, the siege discount), whose top tier it was; the Mangonel and Onager stay as the light stone-thrower (RULES 6.16.5). The Trebuchet stays as a flagged inference (see contested): Danish kings used throwing engines from the 1130s, and the design reads those of the counterweight era (13th–15th centuries) as counterweight engines."
"Catapult Galleon" = "No ship-borne catapults are known in Danish fleets; the Longship (strong vs buildings) keeps the anti-building naval role. The fire-ship line, Fast Fire Ship included, is kept: Abbo of Saint-Germain describes the Danes sending burning ships against the bridge of Paris (885)."
"Thumb Ring" = "Danish archers used the European draw and the missile troops of the later kingdom were crossbowmen, so the tech is removed: the Thumb Ring goes only where the thumb draw is attested for a civ's own archers or for an archery tradition its armies demonstrably used (the steppe, Islamic and East Asian traditions; RULES 6.16.4). The Anglo-Saxons' design, among others, removes it on the same ground."
"Mounted Crossbowman" = "Shared basis (level-1 review, section 11): the Mounted Crossbowman line stays only where mounted crossbowmen are documented as a regular troop type of the civ’s armies. No Danish mounted crossbowmen are recorded as a troop type: the crossbow served the castles and fleets of the later kingdom, and its mounted service was that of armoured lords (see the Cavalier), so the line, which the game's Danes had without any stated basis, is removed; the Swedes' and Norwegians' designs drop it on the same test."
"Heavy Mounted Crossbowman" = "As for the Mounted Crossbowman."
"Cranequins" = "A 15th-century spanning device for the mounted crossbow line, which the Danes no longer have."

[[rename]]
from = "Krepost"
to = "Trelleborg"
level = 1
basis = "The Danish royal ring fortresses of c. 980, named after the excavated fort at Trelleborg near Slagelse; the function (a small fortress that houses and trains troops) is the same."

[[rename]]
from = "Varangian Guard"
to = "Housecarl"
level = 1
basis = "The húskarlar, household troops of the Danish kings, from Cnut's guard in England (1016–1035) to the law of the retainers that Sven Aggesen attributes to Cnut (Lex Castrensis, 1180s); whether the heregeld paid them is debated (see contested). The axe-armed heavy infantry model is the same one the Anglo-Saxons' design renames Housecarl, so that one model serves one Anglo-Danish institution; the Varangian Guard itself stays Byzantine (RULES section 4). The Goths' dropped Huskarl, which bears the Old Norse name, is not used: the Varangian Guard renders the housecarls better in role, being strong against cavalry, as the Dane axe was against horsemen at Hastings (the Bayeux Tapestry shows an English axeman striking a horse; Wace, Roman de Rou), whereas the Huskarl is weak against cavalry; its axe, which the game's Gothikon has it throw, fits the Dane axe too, and one model shared with the Anglo-Saxons' design keeps one institution under one look. The Norse Warrior (Scenario Editor, RULES section 5) was weighed as the look of the Housecarl and not used: its base stats make it a light swordsman rather than an armoured guard (to be checked in game), a look alone would not remove the Varangian Guard's gold mechanic (see the N2 idea), and it would split the one model the Anglo-Saxons' design shares."

[[rename]]
from = "Elite Varangian Guard"
to = "Elite Housecarl"
level = 1
basis = "Same as the Varangian Guard rename."

[architecture]
set = "Northern European"
change = "kept"
basis = "The set the Viking Sagas expansion gave the Danes, Varangians and Vikings according to its official FAQ (not recorded in the repository data): its timber halls and clinker ships render Viking-age Denmark, to which the design's signature elements belong (the ring forts, the Danevirke, the Housecarl, the Jomsviking, the Longship). The brick building of the later kingdom (Valdemar's wall) and its brick Gothic (Roskilde Cathedral), shared with northern Germany, fit it less well; historical fit decides (RULES 6.16.8), and the set is kept for the signature elements. A late Nordic brick-Gothic set is an N3 idea, since creating a set is N3 (RULES 6.15)."

[[dropped]]
item = "Northmen's Fury"
kind = "unique_tech"
reason = "Its name rests on the apocryphal prayer ‘A furore Normannorum libera nos’, not attested in that form, and no Norse tradition of throwing artillery is known; the Danes' engineering excelled in fortification, now represented by the Danevirke tech."

[[dropped]]
item = "Hamask"
kind = "unique_tech"
reason = "Fails the relevance test (RULES 6.9): the Danish berserk material is legendary and lies before the window (Saxo's berserkir belong to the legendary books of his history, I–IX; Hrólfs saga kraka is a late saga about legendary Lejre), and it duplicates the Norwegians' Berserk. Its slot is not refilled: a tech for Cnut's household troops (Þingalið) would repeat the Housecarl and its bonus on the same evidence (RULES 6.3), so the Danes keep two unique techs (4 passives + 2 techs, within RULES 6.1). Two other moments were weighed and left out: Hedeby's trade, from Godfred's move of the merchants of Reric to the royal emporium (808), is left out in N1 because the design's economy already rests on the herring, plunder and the Øresund toll (see the N2 idea); and the Valdemarian knights (Lyndanisse 1219, Bornhöved 1227), whom the added Cavalier represents."
