civ = "Danes"
name = "Danes"
status = "draft"
label = "Infantry and Defensive civilization"
summary = "Denmark from Godfred to the end of the Kalmar Union (808–1523): Trelleborg ring forts and the Danevirke replace the invented siege identity, the Øresund toll is the Town Center tech, the Varangian Guard becomes the Housecarl, Lund's church carries the team bonus, and Kalmar-era guns and ships enter."
ideas = [
  "N2: Danegeld: infantry generate gold while attacking enemy buildings (the Keshik and Varangian Guard gold mechanic applied to a new target), instead of the generic loot bonus.",
  "N2: Remove the Housecarl's gold generation inherited from the Varangian Guard model, or tie it to plunder rather than to fighting units; the Saxons' draft proposes the same.",
  "N2: Absalon: a crusading-fleet tech for Warships and Monks, for the Valdemarian crusades led by warrior bishops (Arkona 1168, Estonia 1219).",
  "N3: A true Trelleborg building (circular rampart, four gates, standardised longhouses) instead of the renamed Krepost.",
  "N3: The Øresund toll as a mechanic: Docks earn gold from passing Trade Cogs, beyond what the Town Center tech can express.",
]
contested = [
  "Who built the Trelleborg-type fortresses (Harald Bluetooth or Sweyn Forkbeard) and why: barracks for the conquest of England, royal control of the provinces, or defence against other Vikings.",
  "Chronology of the Danevirke: radiocarbon dates put a first stage c. 500 or earlier, dendrochronology gives phases in 737 and 968, and the Royal Frankish Annals credit Godfred with works in 808.",
  "Historicity of the Jomsvikings as an organised brotherhood and the identification of Jomsborg with Wolin.",
  "What housecarls were: a paid standing guard (L. M. Larson, 1904) or royal and noble retainers, many of them landholders (N. Hooper, 1985). The Saxons' draft claims Cnut's housecarls under the same name, since they served the Anglo-Danish kings of England.",
  "Reliability of Sven Aggesen's Lex Castrensis, written in the 1180s: it may describe the household troops of his own day rather than Cnut's.",
  "When the leding became a public levy: Niels Lund (Lið, leding og landeværn, 1996) argues that it is a 12th-century development rather than a Viking-age institution.",
  "How far Cnut ruled Sweden: his letter of 1027 claims only ‘part of the Swedes’.",
]
open_questions = [
  "Danevirke shares the Jurchens' Jiehao, both renaming Fortified Bastions: one tech for two border ramparts. A more literal option is a walls effect, for example the Chinese Great Wall (Walls, Watch Tower-line and Bombard Towers +30% HP) shared and renamed (level 1), close to the Saxons' walls bonus; repetition is allowed (RULES 6.7). Keep regeneration?",
  "Housecarl: the Varangian Guard is renamed Housecarl, as for the Saxons, so that one model serves one Anglo-Danish institution. The alternative is the Goths' Huskarl, now unused (exceptional pierce armour, strong vs buildings, weak vs cavalry). Keep the rename?",
  "Power budget: the Danes gain the Trelleborg, the Øresund toll, Cavalier, Arbalester, Fortified Wall, Architecture, Hand Cannoneer, Bombard Cannon, Carrack and Cannon Galleon, and lose the Barracks and Siege Workshop discount, Hamask, Northmen's Fury, the Siege Onager, the Catapult Galleon and Thumb Ring. Þingalið, the previous draft's tech for Cnut's household troops, is dropped because it repeated the Housecarl and its bonus, so the Danes have two unique techs (4 passives + 2 techs). Acceptable, or add a third tech for a distinct moment: Hedeby, the royal emporium to which Godfred moved the merchants of Reric (Royal Frankish Annals, 808), for example Silk Road (Trade Units cost -50%, the Italians' Commenda) shared and renamed at the Market (level 1); or the Valdemarian knights (Lyndanisse 1219, Bornhöved 1227), for example Hauberk (Knight-line +1 melee/+2 pierce armor, the Armenians' Sparapet) shared and renamed at the Castle in the Imperial Age (level 1)?",
  "Distinctness from the Saxons: the Danes share with the Saxons' draft the label (Infantry and Defensive), the Housecarl, the Northern European set, the Longship and the team bonus ‘Monasteries work +20% faster’, which seven drafts now use (Bulgarians, Danes, Gaels, Hindustanis, Khitans, Malay, Saxons). Keep, give the Danes another religious-influence effect (for example ‘Monastery technologies cost -33%’, the Koreans' team bonus), or relabel them ‘Defensive and Naval civilization’ for the ramparts, ring forts and fleets that set them apart?",
  "Architecture: the Northern European set renders the timber halls of the Viking age, but from the 12th century Denmark built in the brick Gothic it shared with northern Germany (Roskilde Cathedral, Valdemar's wall). Keep the set, reassign Central European (N1), or wait for an N3 set for the late kingdom?",
  "Codex-wide question CQ11 (see codex/civs/README.md): Reuse and stacking.",
  "Codex-wide question CQ19 (see codex/civs/README.md): Labels.",
]

[profile]
entity = "Kingdom of Denmark (the Danes)"
region = "Jutland, the Danish islands, Scania, Halland and Blekinge; with the Danelaw (9th–10th centuries), Cnut's North Sea empire (1016–1035), the Valdemarian conquests on the southern Baltic coast and in Estonia (1168–1346) and the Kalmar Union (1397–1523), which the Danish crown led; Norway within it is covered by the Norwegians (to 1469) and Sweden by the Swedes (to 1500)"
window = "808–1523 (from Godfred's rampart and the move of Reric's merchants to Hedeby, Royal Frankish Annals, to the end of the Kalmar Union)"
sources = [
  "Royal Frankish Annals",
  "Anglo-Saxon Chronicle",
  "Abbo of Saint-Germain, Bella Parisiacae urbis (c. 897)",
  "Adam of Bremen, Gesta Hammaburgensis ecclesiae pontificum (c. 1075)",
  "Saxo Grammaticus, Gesta Danorum; Sven Aggesen, Lex Castrensis (1180s)",
  "Knýtlinga saga; Jómsvíkinga saga",
  "Jelling runestones (DR 41, DR 42)",
  "Else Roesdahl, Viking Age Denmark (1982)",
  "N. Hooper, ‘The Housecarls in England in the Eleventh Century’, Anglo-Norman Studies 7 (1985)",
  "Niels Lund, Lið, leding og landeværn (1996)",
  "Timothy Bolton, Cnut the Great (2017)",
  "Kurt Villads Jensen, Crusading at the Edge of Europe (2017)",
]
replaces = "Danes of the Viking Age only (to 1042), with an invented siege identity"

[[bonus]]
text = "Fishing Ships and Villagers drop off +5% food"
kind = "economic"
level = 1
change = "kept"
precedent = "Fishing Ships and Villagers drop off +5% food (Danes)"
basis = "The herring of the Øresund and the great Scania market at Skanör and Falsterbo (12th–16th centuries), taxed by the Danish crown and frequented by Hanseatic merchants, were a backbone of the medieval Danish economy; Saxo's preface praises the Sound's abundance of fish. The Villager part is a generic abstraction."
relevance = "The Scania herring fair was one of the great markets of northern Europe and a main royal revenue; the Danes and the Hanse fought over it (Stralsund, 1370). Fishing shaped this civ's history."

[[bonus]]
text = "Loot 25% of the resource cost of each destroyed building"
kind = "economic"
level = 1
change = "kept"
precedent = "Loot 25% of the resource cost of each destroyed building (Danes)"
basis = "Plunder and the Danegeld: Paris paid 7,000 pounds of silver in 845, and the Anglo-Saxon Chronicle records tributes rising from 10,000 pounds (991) to 48,000 (1012), and Cnut's levy of 72,000 pounds, besides 10,500 from London, in 1018."
relevance = "Plunder and tribute financed Danish kingship from the Great Army to Cnut's conquest of England."

[[bonus]]
text = "Can build Trelleborg in Castle Age"
kind = "military"
level = 1
change = "new"
replaces = "Barracks and Siege Workshop upgrades cost -66% gold"
precedent = "Can build Krepost in Castle Age (Bulgarians)"
basis = "The Trelleborg-type ring fortresses (Trelleborg, Fyrkat, Aggersborg, Nonnebakken, Borgring) were built to one geometric plan with standardised longhouses for a garrison; Trelleborg's timber was felled in 980/981 (dendrochronology), under Harald Bluetooth. The Krepost, a small castle that trains unique units and houses troops, is the closest existing building. The replaced bonus had no historical correlate."
relevance = "The ring forts are the clearest trace of Harald Bluetooth's new royal power, which unified and Christianised Denmark; they are on the UNESCO World Heritage List (2023)."
contested = "Builder and purpose of the forts are debated (see the civ-level notes)."

[[bonus]]
text = "Housecarls and Longships move +10% faster"
kind = "military"
level = 1
change = "changed"
replaces = "Varangian Guards and Longships move +10% faster"
precedent = "Varangian Guards and Longships move +10% faster (Danes)"
basis = "The game's effect is kept through the rename of the Varangian Guard to Housecarl; its basis is the strategic mobility of Danish armies in general, not of the housecarls in particular. Danish armies moved by ship and as mounted infantry (the Great Army ‘was horsed’ in East Anglia, Anglo-Saxon Chronicle 866), in long, slender warships such as Hedeby 1 (c. 985), which sank in the harbour of Haithabu."
relevance = "Strategic mobility by sea and on horseback let Danish armies strike from the Seine to the Humber and conquer England twice (1013, 1016)."

[team_bonus]
text = "Monasteries work +20% faster"
level = 1
change = "new"
replaces = "Siege Weapons +2 line of sight"
precedent = "Monasteries work +20% faster (Lithuanians team bonus); seven drafts now use it (see open questions)"
basis = "Lund was the first archbishopric in Scandinavia: from 1103/04 it ruled the Church of all Scandinavia until Nidaros (1152/53) and Uppsala (1164) received their own, and kept its primacy over Uppsala. Danish kings and bishops led missions and founded churches among their neighbours: Absalon took Arkona on Rügen in 1168 and destroyed the temple of Svantevit, and Valdemar II's crusade to Estonia (1219) led to the see of Reval (Tallinn), a suffragan of Lund. Harald Bluetooth's Jelling stone (c. 965), which says he ‘made the Danes Christian’, is the background. Faster allied monasteries render the clergy Lund trained and sent (RULES 6.2: religious influence). The replaced team bonus had no historical basis."
relevance = "Lund organised the Church of the whole North and led the Baltic missions, the most lasting Danish influence on its neighbours."
contested = "The crusades on the southern Baltic coast and in Estonia were conquests as much as missions."

[[unique_unit]]
name = "Jomsviking"
model = "Jomsviking"
building = "Castle"
level = 1
change = "kept"
basis = "The Jomsvikings of Jómsvíkinga saga (c. 1200), a warrior brotherhood at Jomsborg, usually identified with Wolin (Adam of Bremen's Iumne), where Harald Bluetooth died in exile. The battle of Hjǫrungavágr (c. 986), which the sagas make their defeat, is attested in near-contemporary skaldic verse, and the sagas make Thorkell the Tall, whose ‘immense raiding army’ came to England in 1009 (Anglo-Saxon Chronicle), one of their chiefs. The torches render the burning of settlements and ships."
relevance = "Fame carries much of it, but the Jomsvikings stand for the professional war bands of the late 10th and early 11th centuries, Thorkell's army of 1009–1012 among them, that fought the Danish wars in England."
contested = "The organised ‘order’ is largely literary, and the unit's strength against cavalry is a game invention."

[[unique_tech]]
name = "Danevirke"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Fortifications and Town Centers regenerate 500 HP per minute"
level = 1
change = "new"
precedent = "Fortified Bastions (Jurchens): the tech description reads ‘Fortifications and Town Centers regenerate 500 HP per minute’ and the civ window ‘Fortifications regenerate 500 HP per minute’; shared and renamed with an identical effect and age (the Jurchens' draft renames it Jiehao)"
basis = "The Danevirke, the rampart across the neck of Jutland, was rebuilt in successive phases from c. 500 to the 12th century: a first stage c. 500 or earlier (radiocarbon), dendro-dated phases in 737 and 968, Godfred's work of 808 (Royal Frankish Annals) and the brick wall of Valdemar the Great (reigned 1157–1182). It held the border through wars: Otto II broke through it in 974, and the Danes regained the border region after 983. The semicircular rampart of Hedeby was joined to it by a connecting wall in the 10th century, hence the Town Centers. Regeneration renders this continuous royal upkeep."
relevance = "The rampart defined Denmark's southern border from Godfred to Valdemar and is the emblem of the Danish state's defence; with Hedeby it is on the UNESCO World Heritage List (2018)."

[[unique_tech]]
name = "Øresundstold"
building = "Town Center"
kind = "civil"
age = "Imperial"
effect = "All gold income +10% faster"
level = 2
change = "new"
precedent = "Grand Trunk Road (All gold income +10% faster; Market trading fee reduced to 10%) (Hindustanis), the gold half only, in the game's wording. The same half is the level-2 Town Center tech of the Avars' (Byzantine Tribute) and Bulgarians' (Peace of 927) drafts and a passive in the Byzantines' draft, and six drafts share the whole of Grand Trunk Road at the Town Center (Burgundians, Hindustanis, Khitans, Malay, Muisca, Saxons): ten drafts in all. No existing tech renders a toll."
basis = "From about 1429 Erik of Pomerania, king of the Kalmar Union, levied a toll on every ship passing the Sound at Helsingør, where he built the castle of Krogen to enforce it; the Sound Dues remained a main revenue of the Danish crown until they were abolished in 1857. A state revenue, so at the Town Center (RULES 6.2)."
relevance = "Control of the Sound and its toll made Denmark the gatekeeper of the Baltic and paid for its kings for four centuries."

[tree]
add = ["Krepost", "Cavalier", "Arbalester", "Fortified Wall", "Architecture", "Hand Cannoneer", "Bombard Cannon", "Carrack", "Cannon Galleon"]
remove = ["Siege Onager", "Catapult Galleon", "Thumb Ring"]

[tree.basis]
"Krepost" = "Built as the Trelleborg ring fort (see the bonus and the rename)."
"Cavalier" = "Valdemarian Denmark fought with armoured knights (Lyndanisse 1219, Bornhöved 1227): in the 12th–13th centuries the naval levy was largely commuted into a tax, and military service shifted to tax-exempt lords serving as armoured horsemen (the herremænd)."
"Arbalester" = "The Danes already have Mounted and Heavy Mounted Crossbowmen and Cranequins; crossbows were common in the castles and fleets of 13th–15th-century Denmark, so lacking the Arbalester was incoherent."
"Fortified Wall" = "The Danevirke and Valdemar's brick wall make the Danes one of the great wall-building peoples of the North."
"Architecture" = "Stone and brick building of the medieval kingdom: Lund Cathedral (high altar consecrated 1145), Valdemar's brick wall and churches, the royal castle of Vordingborg."
"Hand Cannoneer" = "Guns reached Scandinavia in the 14th century (the Loshult gun, found in Scania, is one of the oldest surviving in Europe), and the Kalmar-era kings fought with firearm infantry, largely hired Germans: King Hans's army at Hemmingstedt (1500) was built around the mercenary Great Guard, which was routed in the marsh with the loss of its guns and baggage."
"Bombard Cannon" = "Danish royal armies took artillery into the field in the Union wars: King Hans lost his guns in the marsh at Hemmingstedt (1500), and a cannon shot from Christian II's army mortally wounded the Swedish regent Sten Sture the Younger at Bogesund (January 1520), within the window."
"Carrack" = "King Hans's flagship Gribshunden, sunk off Ronneby in 1495, was a large carvel-built warship of the new type, the kind of ship the Carrack stands for."
"Cannon Galleon" = "Gribshunden carried guns (1495), an early case of shipboard artillery in northern waters."
"Siege Onager" = "Dropped with the invented ‘Siege’ identity of the original design (Northmen's Fury, the siege discount), whose top tier it was; the Mangonel, Onager and Trebuchet stay as the generic siege line of a medieval kingdom."
"Catapult Galleon" = "No ship-borne catapults are known in Danish fleets; the Longship (strong vs buildings) keeps the anti-building naval role. The fire-ship line, Fast Fire Ship included, is kept: Abbo of Saint-Germain describes the Danes sending burning ships against the bridge of Paris (885)."
"Thumb Ring" = "No thumb draw is attested: the civ's archers used the European draw and its missile troops the crossbow; the codex gives the tech only where a thumb draw is attested (Gurjaras, Tamils, Saxons)."

[[rename]]
from = "Krepost"
to = "Trelleborg"
level = 1
basis = "The Danish royal ring fortresses of c. 980, named after the excavated fort at Trelleborg near Slagelse; the function (a small fortress that houses and trains troops) is the same."

[[rename]]
from = "Varangian Guard"
to = "Housecarl"
level = 1
basis = "The húskarlar, household troops of the Danish kings, from Cnut's guard in England (1016–1035) to the law of the retainers that Sven Aggesen attributes to Cnut (Lex Castrensis, 1180s); whether the heregeld paid them is debated (see contested). The axe-armed heavy infantry model is the same one the Saxons rename Housecarl; the Varangian Guard itself stays Byzantine (RULES section 4)."

[[rename]]
from = "Elite Varangian Guard"
to = "Elite Housecarl"
level = 1
basis = "Same as the Varangian Guard rename."

[architecture]
set = "Northern European"
change = "kept"
basis = "The set the Viking Sagas expansion gave the Danes, Varangians and Vikings according to its official FAQ (not recorded in the repository data): its timber halls and clinker ships render Viking-age Denmark; the brick Gothic of the later kingdom fits it less well (see open questions)."

[[dropped]]
item = "Northmen's Fury"
kind = "unique_tech"
reason = "Its name rests on the apocryphal prayer ‘A furore Normannorum libera nos’, not attested in that form, and no Norse tradition of throwing artillery is known; the Danes' engineering excelled in fortification, now represented by the Danevirke tech."

[[dropped]]
item = "Hamask"
kind = "unique_tech"
reason = "Fails the relevance test (RULES 6.9): the Danish berserk material is legendary and lies before the window (Saxo's berserkir belong to the legendary books of his history, I–IX; Hrólfs saga kraka is a late saga about legendary Lejre), and it duplicates the Norwegians' Berserk. Its slot is not refilled: Þingalið, the previous draft's replacement (the Armenians' Fereters renamed, for Cnut's household troops), repeated the Housecarl and its bonus on the same evidence (RULES 6.3) and was dropped after the second review, so the Danes keep two unique techs (see open questions)."
