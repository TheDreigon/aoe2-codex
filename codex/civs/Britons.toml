civ = "Britons"
name = "Britons"
status = "draft"
label = "Foot Archer civilization"
summary = "England after 1066 (core c. 1277–1453): Yeomen moves to the Town Center, the Chevauchée replaces Warwolf, dismounted men-at-arms gain armour, archers serving allies carry the team bonus, and the Mounted Crossbowman line leaves the tree as Bombard Cannon, Carrack and Crop Rotation join it."
ideas = [
  "N2: A mounted archer that rides at cavalry speed and dismounts to shoot as a Longbowman (the Ratha’s mode switch), as the historical substitute for the removed Mounted Crossbowman line: English mounted archers rode to the fight and shot on foot (Strickland and Hardy, The Great Warbow, 2005).",
  "N2: Give the Longbowman a faster rate of fire and only slightly more range than the Arbalester, since the war bow’s edge lay in shooting rate and massed volleys rather than range (Strickland and Hardy 2005; Curry 2005).",
  "N2: Split the Archer and Crossbowman lines (RULES section 10), so that the longbow bonuses stop applying to crossbows, which English field armies used little after c. 1300.",
  "N2: A ‘Bill’ name or variant for the late-medieval English polearm infantry (Wars of the Roses; still used at Flodden, 1513).",
  "N3: An Anglo-Norman layer (the French-speaking elite and the Angevin lands, 1066–1204): the window includes it, but this design, centred on 1277–1453, draws on it only for forerunners (the dismounted knights of Tinchebray and the Standard) and for the Romanesque of its architecture; Normandy itself falls within the Franks’ France.",
  "N3: If this civ is renamed ‘English’, the name ‘Britons’ is freed for a Brythonic civ (Welsh, Cornish, Bretons): the archers of Gwent praised by Gerald of Wales, Owain Glyndŵr’s revolt, the Breton captains of the Hundred Years War.",
]
contested = [
  "Where the longbow’s advantage lay: Strickland and Hardy and Anne Curry stress rate of shooting and massed use, with ranges comparable to contemporary crossbows. This design follows that reading; the game’s range bonus is kept only as the civ’s established convention (see open questions).",
  "The effect of arrows on plate armour: Clifford Rogers argues for real lethality, Kelly DeVries is more sceptical, and modern tests disagree; arrows killed horses and lightly armoured men above all.",
  "The size of the armies at Agincourt, and so the odds: Anne Curry, from the pay records, puts c. 9,000 English against c. 12,000 French; Sumption, Barker and Rogers count a smaller English army (c. 5,000 archers and 900–1,000 men-at-arms), and Barker and Rogers a French host several times larger. All agree that archers made up the great majority of Henry V’s army.",
  "The Welsh origin of the longbow (Gerald of Wales on the archers of Gwent, 1188) against the view that it was the ordinary European self bow (Strickland and Hardy; Bradbury).",
  "The scale of English gunpowder use at Crécy (1346): reported by Giovanni Villani, absent from most other accounts.",
  "How common hand guns were in English armies before 1485: the royal stores held guns from the 1340s, but handgunners in the field are documented mainly in the Wars of the Roses, from the 300 Flemish handgunners who landed with Edward IV in 1471 (Warkworth’s Chronicle) to the lead shot from small guns found by the battlefield survey of Bosworth, 1485 (Foard and Curry, 2013). This design adds the Bombard Cannon, whose siege guns of Calais, Harfleur and Normandy fall inside its core (c. 1277–1453), but not the Hand Cannoneer, whose field evidence comes after it; that some of the gunners were hired foreigners is not the reason (hired handgunners give the unit to the Danes, Poles and Magyars).",
  "What the chevauchées were for: Clifford Rogers argues that Edward III used them to force the French to battle as well as to ruin the Valois tax base; other historians stress plunder and economic war that avoided battle.",
]
open_questions = [
  "Name (not decided; to be settled with the other open renames, codex-wide question CQ16): the design is England 1066–1485, and ‘Britons’ historically means the Brythonic peoples the English displaced (Welsh, Cornish, Bretons). Rename to ‘English’? If so, should the Saxons become ‘Anglo-Saxons’ to keep the two English civs distinct, and should ‘Britons’ be reserved for a future Brythonic civ?",
  "Range: the history settles the direction (the longbow’s edge lay in rate of shooting and massed use, not range; see contested), so the only choice is how much range to keep for its fame. The civ stacks it twice, in the passive and in Yeomen. Options: (a) keep both, the game’s convention and the current default; (b) keep range once, on Yeomen (a level-1 tech whose effect cannot change), and turn the passive into rate of fire, ‘Foot Archers attack +10/+20% faster in Castle/Imperial Age’ (precedent: ‘Foot Archers attack +18% faster’, Ethiopians). Option (b) is the one that follows the history. Which?",
  "Warwolf is dropped under the relevance test (a single engine at a single siege) and its Castle slot goes to the Chevauchée. It is the Britons’ best-known tech in the game: keep it anyway for its fame, either instead of the Chevauchée or as a third tech (Castle Age at the Castle, before the Chevauchée in Imperial Age)?",
  "A third tech at the Market for the Calais Staple (1363), the wool monopoly that paid the Calais garrison (analysis proposal; e.g. ‘Trade Units generate +10% gold’, after the Spanish team bonus ‘Trade Units generate +25% gold’)? The wool trade also fed the cloth towns of Flanders and Italy, so it is a second team-bonus-type trait (RULES 6.2); here wool stays in the Shepherds bonus and the archers carry the team bonus.",
]

[profile]
entity = "Kingdom of England (Anglo-Norman, Angevin/Plantagenet, Lancastrian and Yorkist England)"
region = "England, with Wales after 1283, the English lordship of Ireland (from 1171) and the English lands in France (Gascony, Calais, Lancastrian Normandy)"
window = "1066–1485 (design core c. 1277–1453, from Edward I’s Welsh wars to Castillon)"
sources = [
  "Statute of Winchester (1285)",
  "Jean Froissart, Chroniques",
  "Gesta Henrici Quinti (c. 1417)",
  "Matthew Strickland and Robert Hardy, The Great Warbow (2005)",
  "Anne Curry, Agincourt: A New History (2005)",
  "Clifford J. Rogers, War Cruel and Sharp: English Strategy under Edward III, 1327–1360 (2000)",
  "Michael Prestwich, Armies and Warfare in the Middle Ages: The English Experience (1996); Edward I (1988)",
  "Adrian R. Bell, Anne Curry, Andy King and David Simpkin, The Soldier in Later Medieval England (2013)",
  "Jonathan Sumption, The Hundred Years War (5 vols., 1990–2023)",
  "William Caferro, John Hawkwood: An English Mercenary in Fourteenth-Century Italy (2006)",
  "T. H. Lloyd, The English Wool Trade in the Middle Ages (1977)",
  "Maurice Beresford, New Towns of the Middle Ages: Town Plantation in England, Wales and Gascony (1967)",
  "David Hall, The Open Fields of England (2014)",
  "N. A. M. Rodger, The Safeguard of the Sea: A Naval History of Britain 660–1649 (1997)",
  "Glenn Foard and Anne Curry, Bosworth 1485: A Battlefield Rediscovered (2013)",
]
replaces = "Britons as an umbrella for all of English history from c. 400 to 1453; Anglo-Saxon England (449–1066) now belongs to the Saxons"

[[bonus]]
text = "Shepherds work +25% faster"
kind = "economic"
level = 1
change = "kept"
precedent = "Shepherds work +25% faster (Britons)"
basis = "Wool was England’s chief export and the fiscal engine of its wars. Edward I’s wars were paid largely by the ‘Ancient Custom’ on wool (1275) and the maltolt (1294–97); Edward III’s by the wool subsidies and wool-loan schemes such as the Dordrecht bonds (1337–38); and from 1363 the Calais Staple made the wool trade the paymaster of the Calais garrison, an arrangement made formal by the Act of Retainer of 1466 (T. H. Lloyd, The English Wool Trade in the Middle Ages, 1977). The Lord Speaker still sits on the Woolsack. An abstraction: sheep were valued for wool rather than meat."
relevance = "Wool was England’s main export and the tax base of its wars for three centuries."

[[bonus]]
text = "Town Centers cost -50% wood starting in Castle Age"
kind = "economic"
level = 1
change = "kept"
precedent = "Town Centers cost -50% wood starting in Castle Age (Britons)"
basis = "Town plantation: Beresford’s gazetteer counts some 170 towns planted in England between the Conquest and Queenborough (1368), over 80 in Wales and about 125 in Gascony, among them Edward I’s castle-boroughs in north Wales (Flint, Rhuddlan, Conwy, Caernarfon, Beaumaris) and New Winchelsea (Beresford, New Towns of the Middle Ages, 1967). The cheap Castle-Age Town Center stands for these planned boroughs."
relevance = "Planted boroughs carried English settlement and rule into Wales and Gascony; a borderline pass, since new towns were founded all over Europe."
contested = "The basis is supplied after the fact; the bonus was probably designed for balance. Rated ‘stretched’ by the analysis, kept because planted towns are a real and well-documented English phenomenon. Beresford’s counts are given as approximate."

[[bonus]]
text = "Foot Archers +1/+2 range in Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Foot Archers +1/+2 range in Castle/Imperial Age (Britons)"
basis = "The English longbow in the field: massed archers, many of them riding to the fight and shooting on foot, stood on the wings of the dismounted men-at-arms and were central at Falkirk (1298), Halidon Hill (1333), Crécy (1346) and Agincourt (1415), and supporting at Poitiers (1356), where the French attacked largely on foot, the archers ran short of arrows and the Captal de Buch’s flank attack settled the day (Strickland and Hardy 2005; Rogers 2000). A long military tradition, so a passive (RULES 6.2); the royal arms legislation that supplied the archers is the basis of Yeomen."
relevance = "The massed longbow is the defining English weapon from Falkirk to Agincourt and the best-known trait of the civ."
contested = "The bonus models range, the attribute the scholarship rates least (see the civ-level contested list and open questions). It also applies to the Crossbowman line, which English field armies used little after c. 1300."

[[bonus]]
text = "Militia-line +1/+2 melee armor in Castle/Imperial Age"
kind = "military"
level = 1
change = "new"
precedent = "Infantry and Mounted Units +1/+2 melee armor in Castle/Imperial Age (Teutons), narrowed to the Militia-line at the same magnitude; Bagains (Militia-line +5 melee armor) (Bulgarians) shows the Militia-line as an armour target"
basis = "Anglo-Norman knights dismounted to fight at Tinchebray (1106) and at the Standard (1138); from Dupplin Moor (1332, the Disinherited under Edward Balliol) and Halidon Hill (1333) English men-at-arms in full armour fought on foot in the centre with archers on the wings, the system of Crécy, Poitiers and Agincourt (Prestwich 1996; Rogers 2000). What was English was the combination of dismounted men-at-arms with massed archers on the wings; dismounting itself was common Western practice (the French fought largely on foot at Poitiers and Agincourt). The game’s Militia-line, whose second tier is literally called Man-at-Arms, stands for these armoured dismounted men-at-arms."
relevance = "Dismounted men-at-arms were half of the English tactical system that won the great battles of the Hundred Years War."

[team_bonus]
text = "Archery Ranges work +10% faster"
level = 1
change = "kept"
precedent = "Archery Ranges work +10% faster (Britons)"
basis = "English archers served allies and employers abroad: under the Black Prince they decided Nájera (1367) for Pedro I of Castile; the White Company, in Italy from 1361 and led by John Hawkwood from 1364, and Hawkwood’s later English companies served Pisa, Bernabò Visconti, the papacy and Florence until his death in 1394 (Caferro 2006); an English contingent fought with John I of Portugal at Aljubarrota (1385), on the eve of the Treaty of Windsor (1386); Henry of Bolingbroke’s archers fought beside the Teutonic Order before Vilnius (1390); and Charles the Bold hired English archers in the 1470s (Vaughan, Charles the Bold, 1973). The Portuguese defensive line of dismounted men with missile troops on the flanks, used at Atoleiros (1384) and Aljubarrota, is often linked to English example after the Earl of Cambridge’s expedition of 1381–82 (see contested). A team bonus because the archers benefited allies and employers (RULES 6.2); England’s own recruiting by commissions of array and indentures benefited only England and would not qualify."
relevance = "The English archer was England’s best-known military export, hired by allies and employers from Castile to Florence; Nájera shows an ally winning with him."
contested = "The size of the English contingent at Aljubarrota is uncertain, and whether the Portuguese tactics of 1384–85 copied the English or developed independently is debated."

[[unique_unit]]
name = "Longbowman"
model = "Longbowman"
building = "Castle"
level = 1
change = "kept"
basis = "The emblematic soldier of English armies from Edward I’s Welsh wars to Castillon (1277–1453). Bows recovered from the Mary Rose (sunk 1545) suggest very heavy draw weights (estimates of c. 100–180 lbf, debated). English archers also carried swords or bucklers and stakes and were decisive only alongside dismounted men-at-arms (Strickland and Hardy 2005)."
relevance = "The longbowman is the emblem of English arms in the Hundred Years War."

[[unique_tech]]
name = "Yeomen"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Foot Archers and Skirmisher-line +1 range; Watch Tower-line +2 attack"
level = 1
change = "changed"
replaces = "Yeomen (Castle unique tech, same effect)"
precedent = "Yeomen (Foot Archers and Skirmisher-line +1 range; Watch Tower-line +2 attack) (Britons): moved to the Town Center, identical effect"
basis = "The Crown’s arms legislation supplied the archers: Henry III’s writs of 1242 and 1252 extended Henry II’s Assize of Arms (1181) to bows and arrows for the poorer free men; Edward I’s Statute of Winchester (1285) fixed the arms every man had to keep by his wealth and ordered a watch at the town gates from sunset to sunrise (‘watch and ward’); and Edward III’s proclamation of 1363 ordered archery practice on holidays, an order repeated in the Statute of Cambridge (1388) and later, which suggests it was not always obeyed (Strickland and Hardy 2005). With a culture of archery among free men of modest means (later called yeomen), it fed armies whose archers were increasingly recruited as professionals by indenture (Bell, Curry, King and Simpkin, The Soldier in Later Medieval England, 2013). At the Town Center because it rests on the Crown’s legislation, a state matter (RULES 6.2); the tower half fits the Statute’s watch."
relevance = "The Crown’s arms legislation kept England supplied with archers from Falkirk to Agincourt, and the yeoman archer is the popular image of English arms."
contested = "In the 14th century ‘yeoman’ (yeman, Latin valettus) meant a household servant or attendant of middling rank (Chaucer’s Yeoman is the Knight’s forester-archer); the sense of a substantial free smallholder is mainly 15th-century (Middle English Dictionary). The tower bonus has also been read as an allusion to the Yeomen Warders of the Tower of London, but that body descends from the Yeomen of the Guard (1485), at the very end of the window; the link to the Statute’s watch is this design’s reading."

[[unique_tech]]
name = "Chevauchée"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Knight-line and Scout Cavalry-line +2 attack vs. buildings; loot 25% of the resource cost of each destroyed building (by any unit)"
level = 2
change = "new"
replaces = "Warwolf (Trebuchets deal blast damage and are more accurate)"
precedent = "Effect 1: Scout Cavalry-line and Camel Units +2 attack vs. buildings (Hindustanis team bonus; also, without the Camel Units, the team bonus of the Lithuanians’ design), with the Knight-line in place of the Camel Units; effect 2: Loot 25% of the resource cost of each destroyed building (Danes; also a passive in the Khitans’ and Lithuanians’ designs), with the same scope. No existing unique tech renders a raiding strategy: the game has these effects only as a passive bonus and a team bonus."
basis = "The chevauchée, the great mounted raid that burned and plundered across enemy country, was the core of Edward III’s strategy: the Cambrésis (1339), Normandy on the way to Crécy (1346), the Black Prince’s raids from Bordeaux to Narbonne (1355) and towards the Loire before Poitiers (1356), and Reims (1359–60) (Rogers, War Cruel and Sharp, 2000; Sumption). The later raids of Knolles (1370), John of Gaunt (1373, from Calais to Bordeaux) and Buckingham (1380–81) failed to bring the French to battle, and Henry V’s war (1415–22) was one of sieges and occupation instead. The whole army rode, men-at-arms and mounted archers alike; the game’s mounted units stand for both, and the loot applies to every enemy building destroyed, as in the Danes’ bonus, since the engine ties no loot to a unit class. Replaces Warwolf, dropped under the relevance test (see [[dropped]]); the analysis proposed this tech."
relevance = "The chevauchées were how Edward III and the Black Prince waged the war (1339–1360), bringing on Crécy, Poitiers and the Treaty of Brétigny (1360), and a recurring English strategy until the 1380s."
contested = "What the raids were for (see the civ-level contested list)."

[tree]
add = ["Bombard Cannon", "Carrack", "Crop Rotation"]
remove = ["Mounted Crossbowman", "Heavy Mounted Crossbowman", "Cranequins", "Siphons"]

[tree.basis]
"Bombard Cannon" = "English armies besieged with gunpowder artillery: guns at the siege of Calais (1346–47), Henry V’s train of great guns at Harfleur (1415) and the artillery of the conquest of Normandy (Caen 1417, Rouen 1418–19) (Sumption, vol. IV). The civ already had the Cannon Galleon; land artillery removes that incoherence. The Hand Cannoneer is not added: handgunners in English armies are documented mainly in the Wars of the Roses (Edward IV’s Flemish handgunners in 1471; the Bosworth shot of 1485), after the design core (see contested)."
"Carrack" = "Genoese carracks captured at the battle of the Seine (1416) were taken into Henry V’s navy, which also built its own ‘great ships’, the largest being the Grace Dieu (launched 1418); the Mary Rose (1511), built just after the window, shows the type in English service (Rodger, The Safeguard of the Sea, 1997). The Britons were the only civ of the region without it."
"Crop Rotation" = "The open fields of the Midland system were worked in two- and three-course rotations, with the fallow course grazed by the village’s livestock (David Hall, The Open Fields of England, 2014). The game gave the tech to the Saxons, who end in 1066, but not to later medieval England, a reversed chronology (RULES 6.12)."
"Mounted Crossbowman" = "Crossbowmen, many of them foreign (Gascon, Brabançon, Genoese), were important in Angevin and early Edwardian armies, among them mounted crossbowmen (balistarii equites) in the pay of John and Henry III, who used their horses to move; whether they shot from the saddle is unclear. After c. 1300 the longbow displaced the crossbow in English field armies, and the ‘mounted archers’ of the Hundred Years War rode to battle and shot on foot with the longbow (Strickland and Hardy 2005; Prestwich 1996). Removed for the design core; no substitute is needed, since the archers are the foot Archer line and the Longbowman (see the N2 idea of a dismounting mounted archer)."
"Heavy Mounted Crossbowman" = "Same reason as the Mounted Crossbowman."
"Cranequins" = "The cranequin (rack-and-pinion spanning device) is a 15th-century continental crossbow fitting; it has no place in an army built on the longbow."
"Siphons" = "Named after the Byzantine fire siphon, the projector of Greek fire, a state secret that Constantine VII ordered never to be given to another nation (De Administrando Imperio 13); its game effect, an explosive charge for fire ships, has no medieval English equivalent. The fire-ship line itself stays as the engine’s convention for close-range incendiary warships."

[architecture]
set = "Western European"
change = "kept"
basis = "Anglo-Norman Romanesque (Durham, the Tower of London) and English Gothic, with the stone castles of Edward I’s Welsh programme (Arnold Taylor, The Welsh Castles of Edward I, 1986)."

[[dropped]]
item = "Warwolf (Trebuchets deal blast damage and are more accurate)"
kind = "unique_tech"
reason = "Relevance test (RULES 6.9): the Warwolf was a single engine built for a single siege, Stirling (1304), whose garrison Edward I would not let surrender until the engine had been tried (Prestwich, Edward I, 1988); erasing it changes neither the course nor the identity of medieval England, and ‘blast damage’ is a game invention (a trebuchet threw one heavy stone). Its Castle slot goes to the Chevauchée, the weightier trait the civ lacked. The owner may keep it for its fame (open questions)."
