civ = "Malay"
name = "Malay"
status = "draft"
label = "Naval civilization"
summary = "The Malay states from Srivijaya to Malacca (671–1511): trade and Orang Laut fleets replace the age-up and armour bonuses, the Hulubalang the Karambit Warrior, Lela Thalassocracy and a religious team bonus the dock sight, Syahbandar is the Town Center tech, and the Bombard Cannon, Trebuchet and Keep leave."
ideas = [
  "N3: A Javanese civ (Mataram, Singhasari, Majapahit), separating agrarian, brick-building Java from the maritime Malay world (Wolters), with the jong, the huge junks described by Tomé Pires and Gaspar Correia (Pati Unus’ fleet against Malacca, 1513; Manguin), the bronze cetbang guns of Majapahit, whose 14th-century dating rests on late sources, and the early Javanese firearms that Portuguese sources mention; Ma Huan’s huochong fired at Javanese weddings (1433), which translators render as guns or as fire-crackers, belongs there too.",
  "N2: Lela and rentaka as true guns: Harbors, towers and Galley-line ships fire short-range scatter shot instead of arrows (the Lela tech gives only the Harbor, which shoots arrows).",
  "N2: A blowpipe (sumpit) skirmisher dealing poison damage (cf. Curare).",
  "N2: Orang Laut amphibious infantry trained at the Harbor.",
]
contested = [
  "The nature and location of Srivijaya: Palembang, Jambi or Chaiya; a centralised empire or a network of kedatuan (Kulke).",
  "The relation between the Sailendras of Java and Srivijaya, including whether Bālaputradeva, the Sailendra prince who built a monastery at Nālandā as king of Suvarṇadvīpa (c. 860), ruled from Srivijaya.",
  "The founding date of Malacca (c. 1400) and who converted to Islam, Parameswara or his successor; the title of sultan is fixed only with Muzaffar Shah (c. 1445).",
  "How far the spread of Islam in the archipelago owed to Malacca rather than to Pasai, to Gujarati, Tamil and Chinese Muslim merchants or to Sufi teachers.",
  "That the Orang Laut manned Srivijaya’s fleets is inferred back from Malacca and Johor evidence (Wolters 1970).",
  "The number of guns taken at Malacca in 1511: about 3,000 of 8,000 in João de Barros, 2,000 bronze pieces in other accounts; probably inflated.",
  "Hand-held guns before 1511: there is no clear evidence of hand guns at Malacca before the Portuguese, whose accounts describe many guns there, mostly light pieces on stockades and ships. The matchlock came with the Portuguese (istinggar, from Portuguese espingarda), while bedil, the older Malay word for a gun, is not Portuguese (usually derived from Tamil); the Sejarah Melayu’s scene of Malaccans astonished by Portuguese gunfire (1509) is usually read as literary. The design reads Malacca’s guns as artillery and keeps the Hand Cannoneer out; the evidence from Java goes to the Javanese idea.",
  "Light Malay artillery (lela, rentaka) on stockades and ships is attested for 1511, heavy siege guns in Malay offensive warfare are not: the Bombard Cannon goes, as the Khmer lose their unattested engines, and the Siege Ram takes the anti-building role, while Malay gunpowder stays in the Harbor (Lela), the Bombard Tower and the Cannon Galleon (codex-wide question CQ13).",
  "No stone-throwing engines are attested in Malay warfare, which was fought through raids, sea battles and assaults on stockades: the counterweight Trebuchet is removed as an anachronism, and the Mangonel line stays as a game abstraction.",
  "Bow and crossbow mattered little in Malay warfare, whose missile weapons were the blowpipe, javelins and later guns. There is no evidence for the crossbow, so the Arbalester goes under the project’s crossbow criterion (the Crossbowman stays as the generic bow tier), and Thumb Ring goes too.",
  "Tun Perak’s levy of the men of Klang against Siam is chronicle tradition (Sejarah Melayu), and the dates of the Siamese attacks on Malacca under Muzaffar Shah (c. 1445–56) are uncertain.",
]
open_questions = [
  "Scope and name: this design centres the civ on the Malay states (Srivijaya, Melayu, Singapura, Pasai and Malacca) and leaves Java (Majapahit) to a future Javanese civ (N3). Keep the name ‘Malay’ and this scope, or split now?",
  "Unique unit name: Hulubalang (war chief, warrior retainer, as Hang Tuah) names an elite, while the half-population mechanic suits a mass. Keep it, reading the unit as a war chief’s band of followers, or use ‘Rakyat’ (the commoners called up for war, the word of the Malacca-period texts, which also ties in with Forced Levy)?",
  "Codex-wide question CQ7 (see codex/civs/README.md): Siege engines that never reached a civ (here the counterweight Trebuchet).",
  "Codex-wide question CQ13 (see codex/civs/README.md): Long-range siege (here the Bombard Cannon goes and the Siege Ram takes its role; keeping it as an abstraction of Malacca’s guns is the alternative).",
  "Arbalester: removed, since there is no evidence for the crossbow in Malay warfare (see contested). Keep it anyway for the civ’s strength on land?",
  "Power: the land economy rests on Syahbandar (gold income and market fee), and the civ loses the faster age-up, the free infantry armour, the Knight-line, Thumb Ring, the Arbalester, the Bombard Cannon, the Trebuchet and the Keep (with Siphons and Block Printing). Acceptable? (See also codex-wide question CQ14, power floor.)",
  "Second team bonus: the Malay have a second team-bonus candidate, the entrepôt that served foreign merchants (kept as the Trade Cogs passive). If some civs may have two team bonuses (RULES 6.1, proposal), should the Malay be one of them?",
  "Codex-wide question CQ11 (see codex/civs/README.md): Reuse and stacking (here the team bonus ‘Monasteries work +20% faster’, held by eight designs, and Syahbandar, the Grand Trunk Road effect shared by six Town Center techs).",
  "Syahbandar sits at the Town Center on the argument that in a port-state like Malacca the administration of the port was the core of government. Alternatively, move it to the Market (trade, RULES 6.2) and give the Town Center the Malacca law digest (Undang-Undang Melaka, compiled under Muhammad Shah and Muzaffar Shah), as a new tech (level 2) unless an existing effect fits. Which?",
]

[profile]
entity = "The Malay maritime states of the Straits: Srivijaya, Melayu (Jambi), Singapura (Temasek), Samudera-Pasai and the Sultanate of Malacca"
region = "Strait of Malacca: Sumatra and the Malay Peninsula"
window = "671–1511"
sources = [
  "Yijing, travel accounts (671–695)",
  "Inscriptions of Kedukan Bukit (682), Kota Kapur (686) and Palas Pasemah (late 7th century)",
  "Nālandā copper plate of Devapāla (c. 860); the Larger Leiden plates (1006)",
  "Zhao Rugua, Zhufan zhi (1225)",
  "Ibn Battuta, Rihla (Samudera-Pasai, 1345–46)",
  "Sejarah Melayu (Malay Annals)",
  "Undang-Undang Melaka (15th century; ed. Liaw Yock Fang, 1976)",
  "Ma Huan, Yingya shenglan (1433)",
  "Tomé Pires, Suma Oriental (c. 1512–15)",
  "Brás de Albuquerque, Comentários do Grande Afonso de Albuquerque (1557)",
  "João de Barros, Décadas da Ásia",
  "George Cœdès, Les États hindouisés d’Indochine et d’Indonésie (1964)",
  "O. W. Wolters, Early Indonesian Commerce (1967); The Fall of Srivijaya in Malay History (1970)",
  "Anthony Reid, Southeast Asia in the Age of Commerce, 1450–1680 (1988–93)",
  "Leonard Y. Andaya, Leaves of the Same Tree (2008)",
]
replaces = "Proposed, pending the scope question: the game’s Malay–Javanese umbrella civ, which also took in Majapahit (Java)"

[[bonus]]
text = "Trade Cogs generate +20% gold"
kind = "economic"
level = 1
change = "new"
replaces = "Advancing to the next Age is +66% faster"
precedent = "Trade Units generate +25% gold (Spanish team bonus), applied to Trade Cogs"
basis = "Srivijaya and Malacca were entrepôts that lived by drawing the shipping of the Straits into their ports: Yijing stayed at Srivijaya on his way to India and back (671–695), and in Malacca, where he heard 84 languages, Tomé Pires wrote that whoever is lord of Malacca has his hand on the throat of Venice (Suma Oriental). The faster age-up it replaces had no historical basis."
relevance = "Srivijaya and Malacca existed to collect the trade of the Straits; the entrepôt is the economic base of every Malay state of the window."

[[bonus]]
text = "Fish Traps cost -33% and provide +200% food"
kind = "economic"
level = 1
change = "kept"
precedent = "Fish Traps cost -33% and provide +200% food (Malay)"
basis = "Ma Huan (1433) found Malacca’s land poor for rice and its people living largely by fishing from dugout canoes, and the sea peoples of the Straits, the Orang Laut, lived from the sea. The fixed stake trap itself is an abstraction, known on these coasts from later records; the entrepôts themselves were fed largely by rice imported from Java, Siam and Pegu (Pires)."
relevance = "Fishing, and the sea peoples who lived by it, were the base of coastal Malay life and of the Orang Laut on whom the rulers’ fleets depended (RULES 6.9)."

[[bonus]]
text = "Galley-line attacks +25% faster"
kind = "military"
level = 1
change = "new"
replaces = "Infantry armor upgrades free"
precedent = "Galley-line attacks +25% faster (Saracens)"
basis = "The sea peoples of the Straits (Orang Laut) manned the fleets of Malacca, and probably those of Srivijaya (Wolters 1970), patrolled the straits and drove passing ships into the ruler’s port. Srivijaya held the Bangka Strait (the Kota Kapur inscription on Bangka, 686) and reached the Sunda Strait (the Palas Pasemah inscription in Lampung), and Zhao Rugua (1225) says that it commanded the strait, had once closed it with an iron chain against pirates, and attacked ships that would not call. Malacca’s fleets were lancaran and other oared craft. The free infantry armour it replaces contradicted the light Malay infantry, with shield, spear and kris, and mail (baju rantai) only for the elite."
relevance = "The Orang Laut fleets that patrolled the Straits and drove shipping into the ruler’s port were the armed force on which both Srivijaya and Malacca rested."

[[bonus]]
text = "Battle Elephants cost -25/35% in Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Battle Elephants cost -25/35% in Castle/Imperial Age (Malay)"
basis = "Malacca met the Portuguese with war elephants in 1511, when the sultan and his son led them at the bridge (Comentários of Albuquerque), and the Sejarah Melayu shows a court that kept royal elephants; the discount is an abstraction."
relevance = "War elephants were the royal land arm of the Malay sultans, the heavy force that met the Portuguese at Malacca."

[team_bonus]
text = "Monasteries work +20% faster"
level = 1
change = "new"
replaces = "Docks +6 line of sight"
precedent = "Monasteries work +20% faster (Lithuanians team bonus, which their design gives up); also the team bonus of the Bulgarian, Burmese, Danish, Gaelic, Hindustani, Khitan and Saxon designs (codex-wide question CQ11)"
basis = "The Straits were a religious centre for their neighbours for eight centuries. Under Srivijaya it was Buddhist: Yijing (671–695) found more than a thousand monks there and advised Chinese pilgrims to train there before going on to India; the Nālandā copper plate of Devapāla (c. 860) records a monastery built at Nālandā by Bālaputradeva, king of Suvarṇadvīpa; the Larger Leiden plates (1006) record the Cūḷāmaṇivarma-vihāra at Nāgapaṭṭinam, built by the king of Śrīvijaya and Kaṭāha; and Atiśa studied under Dharmakīrti of Suvarṇadvīpa (c. 1012–24) before he went to Tibet (Cœdès 1964). Under Malacca it was Muslim: its rulers adopted Islam in the 15th century (see contested), after Samudera-Pasai, whose sultan Malik al-Saleh died in 1297 and which Ibn Battuta visited in 1345–46, and Malacca’s merchants and teachers carried Islam along its trade network to the ports of the Peninsula and east Sumatra, to the north coast of Java and to the Moluccas (Pires; Reid 1993; Andaya 2008); Malay became the language of Islam in the archipelago, and in later usage ‘masuk Melayu’, to become Malay, meant to convert. A team bonus because it is religious influence on neighbours (RULES 6.2). The Docks line-of-sight bonus it replaces described the Orang Laut watching the Straits for the ruler, a benefit to the civ alone; the Orang Laut now ground the Galley-line bonus."
relevance = "Buddhist Srivijaya and Muslim Malacca each made the Straits a religious centre for their neighbours, from India and Tibet to the Moluccas, and Islam became the core of Malay identity."

[[unique_unit]]
name = "Hulubalang"
model = "Karambit Warrior"
building = "Castle"
level = 1
change = "changed"
replaces = "Karambit Warrior"
basis = "Malay rulers fought with their war chiefs and champions (hulubalang), such as Hang Tuah of the Malacca tradition, and the followers they brought, armed with spear, kris and shield; warfare in the region aimed at capturing people and relied on numbers (Reid). The karambit, a small curved knife of the Minangkabau for farm work and close defence, never armed a corps of troops, so the unit takes the name of the warriors; the half-population mechanic abstracts the war chiefs’ bands of followers."
relevance = "Manpower-centred warfare by chiefs and their followers was the substance of Malay land war (Reid), and the hulubalang Hang Tuah is the hero of Malay tradition."
contested = "Hulubalang were leaders and elite retainers; a half-population unit fits a levy better (see open questions)."

[[unique_tech]]
name = "Syahbandar"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "All gold income +10% faster; Market trading fee reduced to 10%"
level = 1
change = "new"
precedent = "Grand Trunk Road (All gold income +10% faster; Market trading fee reduced to 10%) (Hindustanis): an existing unique tech, shared and renamed with an identical effect; five other designs’ Town Center techs share it (the Burgundians’ Vierlander Coinage, the Hindustanis’ Tanka, the Khitans’ Chanyuan Treaty, the Muisca’s Cotton Mantles and the Saxons’ Edgar's Recoinage; codex-wide question CQ11)"
basis = "Malacca’s port was run by four harbour masters (syahbandar), each in charge of the merchants of a group of nations, from Gujarat to China and Ryūkyū: they received the captains, presented them to the bendahara, found them warehouses and dispatched their goods (Pires, Suma Oriental), under the 15th-century codes of Malacca (the Undang-Undang Melaka and the maritime Undang-Undang Laut). The syahbandars were not among the great officers of state (the bendahara, the penghulu bendahari, the temenggung and the laksamana) but served under the treasurer, the penghulu bendahari (Sejarah Melayu). Faster gold income and a lower market fee abstract an efficient, open port. At the Town Center rather than the Market because in a port-state like Malacca the administration of the port was the core of government and of the crown’s revenue (see open questions). It also gives the civ an economic edge on land maps."
relevance = "The syahbandar system made Malacca the great entrepôt of 15th-century Asia; running open, regulated trade was the business of the Malay sultanate’s government."

[[unique_tech]]
name = "Lela"
building = "Dock"
kind = "military"
age = "Castle"
effect = "Docks are upgraded to Harbors"
level = 1
change = "changed"
replaces = "Thalassocracy (Docks are upgraded to Harbors)"
precedent = "Thalassocracy (Docks are upgraded to Harbors) (Malay): renamed and moved from the Castle to the Dock, identical effect and age"
basis = "An adopted technique: gunpowder artillery, taken up in the Straits in the 15th century by routes that are uncertain. Malacca met the Portuguese in 1511 with guns on its stockades, its waterfront and its ships, light bronze pieces such as the lela and the swivel-mounted rentaka, of which the Portuguese took a great number (about 3,000 in João de Barros, probably inflated; see contested) (Barros; Comentários of Albuquerque). The Harbor, the Malay unique building that shoots at enemies, abstracts the gun-defended waterfront; the lela, the classic light Malay cannon, gives the tech its name (RULES 6.10). At the Dock because it is the defence of the port (RULES 6.2); Castle Age, as for the game’s Thalassocracy, although the guns belong to the last century of the window. The game’s name, a modern scholarly term for the sea power that the Galley-line bonus already carries, is replaced."
relevance = "Light guns defended the 15th-century Malay ports and their fleets, and Malacca’s guns are the best-known feature of its fall in 1511; the lela became the classic Malay cannon."
contested = "The guns’ numbers and origins are uncertain (see contested)."

[[unique_tech]]
name = "Forced Levy"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Militia-line gold cost is replaced by additional food cost"
level = 1
change = "kept"
precedent = "Forced Levy (Militia-line gold cost is replaced by additional food cost) (Malay)"
basis = "Malay rulers counted their power in people and called them up for war. The Sejarah Melayu tells how, when Siam attacked Malacca under Muzaffar Shah (c. 1445–56), Tun Perak, headman of Klang, brought the men of Klang with their wives and children to defend the city, saying that men fight hardest with their families beside them, and so began his rise to bendahara, the office from which he led Malacca’s expansion (chronicle tradition; see contested). Paying the levy in food rather than gold fits an infantry of levies."
relevance = "Levies raised through chiefs such as Tun Perak defended Malacca against Siam and carried its expansion; the call-up of the commoners (rakyat) was how the Malay states made war."

[tree]
add = ["Siege Ram"]
remove = ["Cavalry Archer", "Knight", "Cavalier", "Thumb Ring", "Arbalester", "Bombard Cannon", "Trebuchet", "Keep", "Siphons", "Block Printing"]

[tree.basis]
"Siege Ram" = "The rams take the anti-building role of the removed Bombard Cannon (RULES 6.11), as for the Khmer; Malay land war against fortifications meant assaults on stockades, for which the ram is the game’s generic tool, an abstraction. Like the Armenians, Ethiopians, Goths, Khmer, Malians, Saxons and Tatars, the Malay have no long-range siege weapon (no Trebuchet, Traction Trebuchet or Bombard Cannon) and rely on the Siege Ram as the RULES 6.11 substitute (codex-wide question CQ13)."
"Bombard Cannon" = "Heavy siege guns are not attested in Malay offensive warfare: Malacca’s guns of 1511 were mostly light pieces on stockades and ships (see contested). The Siege Ram takes the anti-building role, and Malay gunpowder stays in the Harbor (Lela), the Bombard Tower and the Cannon Galleon (codex-wide question CQ13)."
"Arbalester" = "No evidence for the crossbow in Malay warfare, whose missile weapons were the blowpipe, javelins and later guns; under the project’s crossbow criterion the Crossbowman stays as the generic bow tier (see open questions)."
"Cavalry Archer" = "The Malay world has no tradition of mounted archery."
"Knight" = "Cavalry was marginal in Malay warfare; the heavy shock arm was the elephant (the Khmer design removes the Knight line on the same ground)."
"Cavalier" = "As for the Knight."
"Thumb Ring" = "Bow and crossbow mattered little; the characteristic missile weapons were the blowpipe (sumpit), javelins and throwing spears (lembing) and later firearms. The thumb draw belongs to the steppe and East Asian archery traditions."
"Trebuchet" = "No stone-throwing engine is attested in Malay warfare (see contested); the counterweight trebuchet reached China only in 1273, and there is no evidence that it reached this region. The rams keep the civ able to destroy buildings (RULES 6.11)."
"Keep" = "Malacca’s defences in 1511 were timber stockades, on which its light guns stood (see Lela); no stone or brick fortifications are documented before the Portuguese built A Famosa after the conquest (1511–12), partly with stone from the city’s mosques. The Guard Tower stays as the abstraction of defended posts, as for the Muisca."
"Siphons" = "Named after the Byzantine fire siphon, a state secret never given to other nations (De Administrando Imperio 13); no ship-borne liquid-fire weapon is documented for this civ."
"Block Printing" = "No printing in the window: Malay texts such as the Sejarah Melayu and the law codes of Malacca were copied by hand, and the first printed Malay books came from European presses after 1600."

[[rename]]
from = "Elite Karambit Warrior"
to = "Elite Hulubalang"
level = 1
basis = "Follows the unique unit (Karambit Warrior → Hulubalang), for the Malay only; it would follow ‘Rakyat’ if the owner picks that name (see open questions)."

[architecture]
set = "Southeast Asian"
change = "kept"
basis = "The set evokes the brick and stone temples (candi) of the region, such as those of Muara Jambi and Muara Takus in the lands of Melayu and Srivijaya; the timber palaces of Malacca have no closer existing set."
