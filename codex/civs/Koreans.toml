civ = "Koreans"
name = "Koreans"
status = "draft"
label = "Defensive and Naval civilization"
summary = "Korea from the Three Kingdoms to early Joseon (500–1598), on the owner’s sketch: the Korean bow and armoured monks join the kept bonuses, the infantry discount goes, the Gaema Musa replaces the War Wagon, Eupseong takes the walls effect, Singijeon narrows Shinkichon, and gifts to Japan give the team bonus."
ideas = [
  "N2: Panokseon (owner’s idea): a two-deck warship with high HP as the backbone of the Joseon fleet (1555), replacing the Galleon line, with the Turtle Ship kept as a rare elite ship.",
  "N2: Monk-soldiers (seungbyeong) who can switch to melee combat, beyond the armoured Monks of the passive bonus.",
  "N3: Balhae (698–926), and Goryeo’s wars with the Khitans (993–1019) and Jurchens (1107–09) reflected in campaigns or civ links.",
]
contested = [
  "Whether the geobukseon carried iron plates and can be called the first ironclad; the Korean sources of 1592 describe a spiked roof.",
  "The historical belonging of Goguryeo and Balhae (Korean historiography versus China’s ‘Northeast Project’).",
  "The real weight of the hwacha in the victory of Haengju (1593) and the numbers of combatants.",
  "Goguryeo’s fully armoured cavalry is attested mainly for the 4th–6th centuries (the tomb murals; the armour taken in 407, Gwanggaeto stele); its part in the Sui and Tang wars is probable but not recorded, and its survival into the Goryeo period is not shown. The Gaema Musa therefore stands for Goguryeo at the opening of the window, in a civ whose other elements are mostly Goryeo and Joseon.",
  "The occupant of Anak Tomb No. 3 (357): its inscription names Dong Shou, an émigré from Former Yan, while North Korean scholars attribute it to a Goguryeo king; its value as Goguryeo evidence is debated.",
  "The date of Buddhism’s transmission from Baekje to Yamato: 552 in the Nihon Shoki, 538 in other early Japanese sources.",
  "The Mangonel is read as the light traction stone-thrower and renamed Pocha, the word the Goryeosa uses for the engines at Gwiju (1231), as the Khitan design reads it (its Whirlwind Pao), while the game’s art shows a torsion engine. The Onager tier has no distinct Korean referent: the Khitan design leaves it out, and it is kept here only by the owner’s decision, as an abstraction. With the Hwacha the Koreans also have two Castle-Age blast weapons, against the convention of one per civ that the Chinese, Jurchen and Khitan designs follow, again by the owner’s decision. The convention mirrors the game, where none of the four civs that train the Rocket Cart (Chinese, Jurchens, Khitans, Koreans) has the Mangonel line; the Pocha and Onager therefore also depart from the game’s own pattern for the Koreans, by the same decision.",
  "Whether the cupellation (haifuki) that reached Iwami in 1533 came from Joseon: the lead–silver separation recorded in Joseon in 1503 is the usual source proposed, while the Edo-period Ginzan kyūki says only that the Hakata merchant Kamiya Jutei brought two men, Keiju and Sōtan, from Hakata.",
  "The name: ‘Korea’ derives from Goryeo, and the medieval states had their own names (Goguryeo, Baekje, Silla, Goryeo, Joseon). Standard English scholarship nonetheless writes the history of all of them as Korean history (Lee 1984; Seth 2010), so the civ keeps the name Koreans (RULES 6.16.15), with the states named in the profile.",
]
open_questions = []

[profile]
entity = "The Korean states: Goguryeo, Baekje and Silla, Unified Silla, Goryeo (918–1392) and early Joseon"
region = "Korean peninsula, with Goguryeo’s lands in southern Manchuria"
window = "500–1598 (core: 500–1500, from the Three Kingdoms to early Joseon; the window runs on to the end of the Imjin War, 1592–98, without a late element, RULES 6.16.17)"
sources = [
  "Chen Shou, Sanguozhi (3rd century), Wei shu 30, on Goguryeo",
  "Gwanggaeto stele (414)",
  "Nihon Shoki (720)",
  "Sima Guang, Zizhi tongjian (1084)",
  "Kim Bu-sik, Samguk Sagi (1145)",
  "Goryeosa (1451)",
  "Joseon Wangjo Sillok (Annals of the Joseon Dynasty)",
  "Gukjo oryeui seorye (1474)",
  "Yi Sun-sin, Nanjung Ilgi (war diary, 1592–98)",
  "Ki-baik Lee, A New History of Korea (1984)",
  "Michael J. Seth, A History of Korea (2010)",
  "Kenneth M. Swope, A Dragon’s Head and a Serpent’s Tail (2009)",
  "Joseph Needham et al., Science and Civilisation in China, vol. 5, part 7 (1986)",
]

[[bonus]]
text = "Stone miners work +20% faster"
kind = "economic"
level = 1
change = "kept"
precedent = "Stone miners work +20% faster (Koreans)"
basis = "Korean defence rested on stone. When invaded, Koreans emptied the fields and withdrew into walled refuges: Goguryeo’s fortresses held the Sui (Liaodong, 612) and Tang Taizong (the mountain fortress of Ansi, 645), and against the Mongols Goryeo moved its people into mountain fortresses (sanseong) and onto islands while the court held out on Ganghwa (1232–70); the monk-turned-commander Kim Yun-hu held the mountain fortress of Chungju for some seventy days in 1253 (Goryeosa). Joseon walled its capital Hanyang (1396) and the towns of its southern coasts (see Eupseong). This bonus and the tower bonus carry the mountain-fortress strategy (sanseong): a separate sanseong passive with the Georgians’ high-ground effect (Units and buildings receive -15% damage when located on higher elevation), in place of one of the two bow bonuses, was considered and not adopted, since the owner’s sketch fills the six passive slots."
relevance = "Stone fortification and the retreat into walled refuges were the backbone of Korean defence for a thousand years."

[[bonus]]
text = "Archery Range Units cost -50% wood"
kind = "military"
level = 1
change = "changed"
replaces = "Ranged Soldiers and Infantry cost -50% wood"
precedent = "Ranged Soldiers and Infantry cost -50% wood (Koreans), without the Infantry"
basis = "Owner’s decision. The bow was the weapon of the mass of Korean soldiers, not of an elite: from the mounted hunters of the Goguryeo tomb murals (Muyongchong) to Joseon, which selected its regular troops and its military officials by tests centred on archery (the military examination, mugwa, from 1402) and built its armies around massed archers until the Imjin War. The infantry discount, which had no specific basis, is dropped."
relevance = "Massed archers were the core of Korean armies from Goguryeo to Joseon; this bonus stands for their numbers, the range bonus for the power of their bow."

[[bonus]]
text = "Foot Archers +1 range starting in Castle Age; Cavalry Archers +1 range starting in Imperial Age"
kind = "military"
level = 1
change = "new"
precedent = "Foot Archers +1/+2 range in Castle/Imperial Age (Britons), its Castle Age step only; Recurve Bow (Mounted Archers +1 attack, +1 range) (Magyars), its range only, applied to Cavalry Archers in the Imperial Age as in the game (part of the effect on a narrower set of targets, level 1 under RULES section 5)"
basis = "The owner’s pyeonjeon bonus, widened to the power of the Korean bow, since one arrow type alone would be a detail under the relevance test (RULES 6.9). Goguryeo’s ‘maek bows’ were already famous in the 3rd century (Sanguozhi, Wei shu 30: 出好弓，所謂貊弓是也), and the horn composite bow (gakgung) of water-buffalo horn, bamboo, mulberry wood and sinew was prized for its cast; Joseon also shot short ‘baby arrows’ (pyeonjeon) through a half-pipe guide (tongah), which flew farther than ordinary arrows and were feared by Jurchens and Japanese (Joseon military sources). The owner’s sketch starts the whole bonus in the Castle Age. The foot-archer half keeps that age, the Castle Age step of the Britons’ range bonus; the Cavalry Archer half takes the Imperial Age of the Magyars’ Recurve Bow, the only existing range effect for mounted archers, because a reused effect keeps the game’s age or a later one (RULES 6.16.11, a game constraint the site labels). The power budget is accepted as it stands, the gains (range, armoured Monks, the Pocha and Onager, the Heavy Scorpion, Plate Barding Armor, the Gaema Musa) set against the lost infantry discount, War Wagon and fire-ship techs (RULES 6.14)."
relevance = "The range and power of the Korean bow were Korea’s signature advantage in its wars with the Jurchens and the Japanese; the bonus carries the bow itself, with the pyeonjeon as one example, not one arrow type."

[[bonus]]
text = "Archer armor and tower upgrades free (Bombard Tower requires Chemistry)"
kind = "military"
level = 1
change = "kept"
precedent = "Archer armor and tower upgrades free (Bombard Tower requires Chemistry) (Koreans)"
basis = "Archers on walls were the core of Korean defence, from Ansi against Tang Taizong (645) to Gwiju, which Pak Seo held against the Mongols in 1231 while both sides battered each other with traction stone-throwers (Goryeosa); an abstraction."
relevance = "Korean warfare was above all the defence of walls by archers."

[[bonus]]
text = "Warships cost -20% wood"
kind = "military"
level = 1
change = "kept"
precedent = "Warships cost -20% wood (Koreans)"
basis = "Korea had a large shipbuilding capacity: on Mongol orders Goryeo built some 900 ships within months for the invasion of Japan in 1274 (Goryeosa), and Joseon developed the panokseon (1555). Jang Bogo’s Cheonghaejin (828) and Choe Mu-seon’s ship-borne guns against the wakō at Jinpo (1380) show the naval tradition. Korea keeps the fleet-of-ships tier (RULES 6.16.1): planked warships, from Goryeo’s invasion fleets to the panokseon and the geobukseon, with the Galleon kept as the skeleton’s flagged abstraction (RULES 6.16.2)."
relevance = "Shipbuilding and fleets decided Korea’s wars at sea, from Jang Bogo’s Cheonghaejin to Yi Sun-sin."

[[bonus]]
text = "Monks +3 melee/+3 pierce armor"
kind = "military"
level = 1
change = "new"
precedent = "Monks +3 melee/+3 pierce armor (Bengalis, whose design replaces it)"
basis = "Owner’s decision (monk-soldiers). Buddhist monks took up arms for Goryeo and Joseon: Yun Gwan’s Special Military Corps (Byeolmuban, 1104) had a corps of monks (hangmagun) beside its cavalry (sin’gigun) and infantry (sinbogun); the monk Kim Yun-hu killed the Mongol commander Saritai at Cheoin (1232); and in 1592–93 the monk armies of Hyujeong (Seosan Daesa), Yujeong (Samyeong) and Yeonggyu fought the Japanese (Goryeosa; Joseon Wangjo Sillok)."
relevance = "The monk-soldier recurs in Korean resistance from the Jurchen wars to the Imjin War."

[team_bonus]
text = "Monastery technologies cost -33%"
level = 1
change = "new"
replaces = "Villagers +3 line of sight"
precedent = "Monastery technologies cost -50% (Burmese), at a lower magnitude as a team bonus"
basis = "Owner’s decision: Korea as Japan’s teacher. Baekje sent Buddhist images and sutras to Yamato (552 in the Nihon Shoki, 538 in other sources) and in 588 monks, temple carpenters, a metal-caster, tile-makers and a painter for its first great temple, Asuka-dera; the Goguryeo monk Hyeja taught Prince Shōtoku (from 595), and the Goguryeo monk Damjing brought paints, paper, ink and millstones (610) (Nihon Shoki); in 618 Goguryeo also presented engines and other trophies captured from the Sui, a diplomatic gift rather than a transfer of technique. Later, Joseon sent printed sets of the Buddhist canon to Muromachi Japan at the request of shoguns and daimyo, and the cupellation (haifuki) that reached the Iwami silver mine by way of Hakata in 1533, after the 500–1500 frame though within this civ’s window, is usually traced to the lead–silver separation recorded in Joseon in 1503 (see contested). A team bonus because these were transfers to a neighbour (RULES 6.2: religious influence, transferred techniques). The retreat into fortresses benefited only Korea, so it grounds the stone and tower bonuses rather than a team bonus."
relevance = "Korea was Japan’s main channel for Buddhism and continental crafts in the 6th–7th centuries; its role as transmitter is part of its place in East Asian history."

[[unique_unit]]
name = "Turtle Ship"
model = "Turtle Ship"
building = "Dock"
level = 1
change = "kept"
basis = "The geobukseon is mentioned in 1413 in the Annals of King Taejong and was used by Yi Sun-sin from 1592 (Sacheon, Dangpo, Hansan), armed with cheonja and jija cannons. There were very few, probably three to five; the panokseon was the backbone of the fleet. It originated inside the window, so its later fame raises no late-element issue (RULES section 2)."
relevance = "The geobukseon is Korea’s most famous warship and the symbol of Yi Sun-sin’s victories, which cut the Japanese sea lanes in 1592."
contested = "Iron plating is not documented in the Korean sources of 1592, which describe a roof covered with spikes."

[[unique_unit]]
name = "Gaema Musa"
model = "Cataphract"
building = "Castle"
level = 1
change = "new"
replaces = "War Wagon"
basis = "Owner’s decision. Goguryeo tomb murals show riders and horses in full lamellar armour: the battle scenes of Samsil-chong (the Three Chambers Tomb) at Ji’an, the Gaemachong (‘Armoured Horse Tomb’) near Pyongyang, named after its mural, and Anak Tomb No. 3 (357, occupant debated). Armoured horse and rider were Goguryeo’s elite arm in its age of expansion under Gwanggaeto and Jangsu (391–491), when the Gwanggaeto stele (414) boasts of over 10,000 suits of armour captured in 407. Goguryeo still fielded a heavily armoured army in 645, when the Tang took 10,000 suits of armour after the battle of Jupilsan (Zizhi tongjian 198), and its barded cavalry probably fought the Sui and Tang, though barding is not recorded then. ‘Gaema musa’ (‘armoured-horse warrior’) is a modern label built on the old word gaema (鎧馬, ‘armoured horse’). Goryeo later raised a large cavalry corps (sin’gigun) in Yun Gwan’s Byeolmuban of 1104 against the Jurchen horsemen; whether it was barded is not recorded. The Cataphract, a heavily armoured lancer on a barded horse, is the existing model. The Scenario Editor’s Sogdian Cataphract (RULES section 5), a Central Asian horseman with high pierce armour but no melee armour (110 HP, 0/5 armour; codex/tools/scenario-units-stats.md), was considered; neither it nor any other Scenario Editor unit renders the Goguryeo armoured lancer better than the Cataphract. The War Wagon it replaces had no known Korean prototype: the hwacha were rocket or gun carts, already represented by the Rocket Cart (renamed Hwacha here)."
relevance = "Armoured horse and rider were the elite arm of Goguryeo in its age of expansion (4th–6th centuries, at the opening of the window), when it became the great military power of early Korea, and they are the best-known image of its army; Goguryeo’s later victories over the Sui and Tang belong to its fortresses (see the stone and tower bonuses)."
contested = "The dating of Goguryeo’s barded cavalry and the occupant of Anak Tomb No. 3 (see contested)."

[[unique_tech]]
name = "Eupseong"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Walls, Watch Tower-line and Bombard Towers +30% HP"
level = 1
change = "changed"
replaces = "Eupseong (Watch Tower-line +2 range)"
precedent = "Great Wall (Walls, Watch Tower-line and Bombard Towers +30% HP) (Chinese): an existing unique tech, shared and renamed with an identical effect; the Chinese keep it as Great Wall, and the Japanese design shares it as Genko Borui, at the Castle"
basis = "Owner’s decision: the name keeps its meaning, town walls (邑城). Against the wakō raids of late Goryeo and early Joseon, the state walled the county towns of the southern coasts; the court of King Sejong issued standards for them in 1438 (Chukseong sindo), and walls of the programme survive at Haemi and Nagan. The owner’s ‘walls, gates and towers +30% HP’ is the Great Wall effect, used word for word so that the tech stays level 1. Walling towns was also a military work; it sits at the Town Center because the court ran and standardised it as a programme for the county seats, the units of local government (RULES 6.2), and fortified towns go to the Town Center (RULES 6.16.19(c)). Moving it to the Castle as the Castle-Age tech (1438, before Singijeon in 1448) and giving the Town Center a state institution (the Goryeo civil examinations of 958, the Gwajeon land law of 1391 or the Gyeongguk daejeon code of 1485) was considered and not adopted. The game’s effect (+2 tower range) had no relation to the name and is dropped. The tech is not renamed Sanseong, since the mountain-fortress tradition grounds the stone and tower bonuses."
relevance = "The walled county towns were Joseon’s answer to the wakō raids and gave the Korean county seat its lasting form."

[[unique_tech]]
name = "Singijeon"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Hwachas +1 range, fire additional projectiles"
level = 2
change = "new"
replaces = "Shinkichon (Rocket Carts and Turtle Ships +1 range, fire additional projectiles)"
precedent = "Shinkichon (Rocket Carts and Turtle Ships +1 range, fire additional projectiles) (Koreans): both effects, ‘+1 range’ and ‘fire additional projectiles’, applied to Rocket Carts (Hwachas) only, as the owner’s sketch decides. A narrowed effect is not identical, so this is a new tech (level 2): the design keeps the sketch’s narrowing rather than Shinkichon’s full effect under the new name at level 1."
basis = "Singijeon (神機箭) were rocket arrows derived from Goryeo’s juhwa, renamed and standardised in 1448 and fired in volleys of up to 100 from Munjong’s hwacha (1451); their specifications are in the Gukjo oryeui seorye (1474). The romanisation is corrected (Revised Romanization), and the Turtle Ship part is removed because the ships fired large arrows from cannon, not singijeon. The Rocket Cart it improves takes its Korean name (see the renames)."
relevance = "Rocket arrows fired in mass from the hwacha were Joseon’s distinctive weapon, used against the Japanese at Haengju (1593)."

[tree]
add = ["Heavy Scorpion", "Plate Barding Armor", "Mangonel", "Onager", "Traction Trebuchet"]
remove = ["Trebuchet", "Siphons", "Incendiaries"]

[tree.basis]
"Heavy Scorpion" = "Owner’s decision. Silla’s heavy crossbows were famous: the Samguk Sagi (year 669) says the Tang emperor summoned the artisan Gu Jinchon, whose crossbows were said to reach 1,000 paces; those he made in China reached only 30, then 60 paces, he blamed the timber, and he was suspected of hiding his secret. The civ had the Scorpion without its upgrade. The same Silla crossbow tradition is the evidence on which the Arbalester, kept from the game, stays (RULES 6.16.3)."
"Plate Barding Armor" = "Owner’s decision. The fully armoured horses (gaema) of the Goguryeo murals; it also serves the Gaema Musa."
"Mangonel" = "Owner’s decision, read as the light traction stone-thrower and renamed Pocha (see the renames and contested): in 618 Goguryeo presented stone-throwers captured from the Sui to Japan (Nihon Shoki), and both sides used traction engines at Gwiju in 1231 (Goryeosa). Without it Korea from 500 to c. 1400, before the hwacha, would have no throwing artillery."
"Onager" = "Owner’s decision: the upgrade of the light stone-thrower, an abstraction with no distinct Korean referent (see contested)."
"Traction Trebuchet" = "The heavy multi-pole engines of the same pocha tradition (Gwiju, 1231, Goryeosa) replace the counterweight Trebuchet as the long-range siege weapon (RULES 6.11), beside the Bombard Cannon of late Goryeo and Joseon. Not in the owner’s sketch: added under the traction test (RULES 6.16.5), since heavy traction engines are attested at Gwiju, and for consistency with the Chinese, Japanese, Jurchen and Khitan designs, as the counterweight engine reached China only in 1273."
"Trebuchet" = "The counterweight trebuchet reached China only in 1273 (Xiangyang), and the Korean sources record traction engines only; Korea then turned to guns (Choe Mu-seon’s Office of Firearms, 1377)."
"Siphons" = "Named after the Byzantine fire siphon, a state secret never given to other nations (De Administrando Imperio 13); no ship-borne liquid-fire weapon is documented for this civ."
"Incendiaries" = "Requires Siphons, which this design removes."

[[rename]]
from = "Rocket Cart"
to = "Hwacha"
level = 1
basis = "The hwacha (火車, ‘fire cart’) is the Korean name of this launcher. First recorded in 1409 as a cart firing arrows from gun tubes, it took its best-known form in Munjong’s model of 1451, which could carry a frame of 100 singijeon rockets (or one of gun barrels), the form the game’s Rocket Cart shows (Joseon Wangjo Sillok; Gukjo oryeui seorye, 1474). Same unit and function (RULES 6.10); the Chinese keep the generic name."

[[rename]]
from = "Heavy Rocket Cart"
to = "Munjong Hwacha"
level = 1
basis = "The improved hwacha of 1451, built under King Munjong, which could fire a hundred singijeon at once; ‘Munjong hwacha’ is the modern name for that model. Same unit, identical effect."

[[rename]]
from = "Mangonel"
to = "Pocha"
level = 1
basis = "Pocha (砲車) is the general word of the Korean sources for the traction stone-thrower: the Goryeosa uses it for the engines of both sides at the siege of Gwiju (1231). It covered engines of every size and here names the light one, as the Khitan design’s Whirlwind Pao does (RULES 6.10); the heavy engines stay as the Traction Trebuchet. Same unit and effect."

[[rename]]
from = "Elite Cataphract"
to = "Elite Gaema Musa"
level = 1
basis = "Follows the unique unit (Cataphract → Gaema Musa), for the Koreans only; the Byzantines keep the Cataphract."

[architecture]
set = "East Asian"
change = "kept"
basis = "Korean palaces, temples and fortress gates belong to the East Asian timber-frame tradition."
