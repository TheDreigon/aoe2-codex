civ = "Tatars"
name = "Tatars"
status = "reviewed"
label = "Cavalry Archer civilization"
summary = "Tatars refocused on the Golden Horde (1242–1502) without Timur: herds, horse archery and the Keshik stay, the Kipchak levy, Araba wagon camps, yarlyk and tamga revenues, the Beglerbeg (Silk Armor renamed), the traction trebuchet and the khans' patents to the Russian Church enter, and the Timurid Flaming Camel and Siegecraft, the counterweight Trebuchet, guns and camels leave."
ideas = [
  "N3: A Timurid variant of the Persians, or a Timurid civ carved out of their window (1370–1507), with the Flaming Camel, Timurid Siegecraft and the elephants Timur took from Delhi and used at Ankara (1402).",
  "N2: Ulan light lancer, after oğlan, the title of the Horde's Chinggisid princes, a word that through the Lipka Tatars gave the Polish ułan and the European uhlan.",
  "N2: A Monastery tech for Özbeg's adoption of Islam as the state religion (1313), once an effect fits a state conversion better than the generic Monastery techs. Decision: no fourth unique tech in N1; Islam is carried by the tree (Faith, Sanctity), since no existing effect expresses a state conversion and a fourth tech would add power to a rebalanced design.",
  "N3: The ordu as a moving city: Town Centers that pack and move, as Ibn Battuta saw Özbeg's camp, which he likened to a city on the move with mosques and bazaars.",
  "N3: A “Steppe” architecture set shared with the Avars, Mongols and Cumans.",
]
contested = [
  "“Golden Horde” (Zolotaya Orda) is a 16th-century Russian name (the Kazan History, 1560s); contemporaries spoke of the Ulus of Jochi, the Ulugh Ulus or the Desht-i Qipchaq, and “Tatar” is an exonym that moved from an eastern Mongolian confederation (destroyed in 1202) to the Mongols and then to the Turkic-speaking peoples of the Horde. Decision: the civ keeps the game's name, Tatars, which contemporaries used in Rus', Latin and Mamluk sources and which the Horde's Turkic-speaking heirs came to bear, while the site shows the entity; “Golden Horde” would be anachronistic, and “Ulus of Jochi” or “the Horde” (M. Favereau's choice, 2021) are the scholarly alternatives (RULES section 4, 6.16.15).",
  "That the Jochid khans kept a kheshig guard like the Yuan and the Ilkhans is likely but not directly documented.",
  "Gunpowder: in 1376 the defenders of Bolghar on the Volga, then under the Horde, let loose “thunder” from the walls against the Russians (Rus' chronicles); whether these were guns is disputed. The first reliable mention of firearms in Rus' is Moscow's defence against Tokhtamysh in 1382, when the townsmen fired tyufyaki and pushki from the walls (the chronicle tale of Tokhtamysh's invasion; A. N. Kirpichnikov, Voennoe delo na Rusi v XIII–XV vv., 1976). The firearms of Kazan and Crimea belong to successor khanates, and none are securely recorded for the Great Horde itself (at the Ugra in 1480 the guns were Muscovy's). This design therefore removes the Hand Cannoneer and the Bombard Tower.",
  "Siege engines: porok, the Rus' chronicles' word for the engines of Batu's sieges (Vladimir 1238, Kiev 1240, just before the window, in the campaign that founded the Horde), is usually read as a stone-thrower but sometimes as a ram, and the chronicles do not record what type of engine these were. The 1237–1241 campaign was fought by an imperial army of all the Chinggisid branches, which could draw on the siege skills the Mongols had taken from north China and Central Asia, at a time when the counterweight engine was already known in the Near East (from the 1160s–1180s, RULES 6.16.5); that the Horde had no counterweight engines is therefore an argument from silence. The one reading of the type of a Horde engine is Zanders': the engines destroyed at Caffa in 1344 were man-powered (J. P. Zanders, “de Mussi and the Siege of Caffa: Origin of a Biological Warfare Allegation”, Historical Notes 1, The Trench, 2021, as reported by M. Field, “Catapulting corpses? A famous case of medieval biological warfare probably never happened”, Bulletin of the Atomic Scientists, August 2023; the man-powered reading is not confirmed at first hand in Zanders' paper). The Rus' design reads the Rus' poroki of the same era as counterweight engines, a reading it also flags as contested. Decision: the Horde gets the Traction Trebuchet on the one type reading there is (level-1 review, 3.1), not the counterweight Trebuchet (see the tree).",
  "How heavy the Rus' tribute was and how far Muscovite institutions grew out of the Horde's (C. Halperin, 1985; D. Ostrowski, 1998) are debated. The khans' patents to the Russian Church survive only in later Russian translations, in two collections: the Short Collection, on which scholars rely, and the Expanded (Long) Collection, which adds texts, notably Özbeg's patent to Metropolitan Peter, and expanded wording that many scholars take for later Russian reworkings or forgeries (editions and studies: M. D. Priselkov, Khanskie yarlyki russkim mitropolitam, 1916; A. P. Grigor'ev, Sbornik khanskikh yarlykov russkim mitropolitam, 2004). Mengu-Temür's patent, the earliest, is dated only to a year of the hare: it is usually placed in 1267, but 1279, the other hare year of his reign, is also possible.",
  "The relative weight of the Black Death (U. Schamiloglu) and of Timur's campaigns of 1391 and 1395 in the Horde's decline.",
  "The identification of Sarai Batu, Sarai Berke and Sarai al-Jadid, and which khan moved the capital.",
  "The presence of Genoese infantry in Mamai's army at Kulikovo (1380).",
  "The Flaming Camel stratagem at Delhi (1398) is reported in Timurid and later narratives whose earliest attestation is uncertain: a modern summary attributes it to Nizam al-Din Shami's Zafarnama (1404), the analysis to the later Malfuzat-i Timuri, and the Timurid chroniclers stress ditches, tethered buffaloes and caltrops.",
  "Qazaq, a Turkic word recorded early in the Codex Cumanicus, compiled in the Horde's lands, with an uncertain sense there, came to mean a freebooter who had left his ruler's service, the source of “Cossack”: the qazaqlïq of Kerey and Janibek, who broke away from Abu'l-Khayr in the mid-15th century (Mirza Haidar Dughlat, Tarikh-i Rashidi), and the Tatar cossacks of 15th-century Rus' sources (J.-Y. Lee, Qazaqlïq, or Ambitious Brigandage, and the Formation of the Qazaqs, 2016). That sense falls partly inside the window, but it named men outside the khans' armies, never the khans' light cavalry, so the word fails the same-function test. Decision: the Hussar keeps the game's name, as in the Cumans' design (RULES 6.16.15).",
]
open_questions = []

[profile]
entity = "Ulus of Jochi (the “Golden Horde”), to the fall of the Great Horde"
region = "Pontic-Caspian steppe (Desht-i Qipchaq), the Volga, Crimea and northern Khwarazm, with the left wing (Orda's ulus) reaching the Irtysh and the Syr Darya; overlord of the Rus' principalities"
window = "1242–1502 (from Batu's return to the lower Volga to the fall of the Great Horde, a terminal event soon after 1500 as RULES 6.16.17 allows; core 1242–1419, from Batu to the death of Edigu; nothing in the design originates after 1500, the generic skeleton items of RULES 6.16.2 aside)"
sources = [
  "William of Rubruck, Itinerarium (1253–1255; trans. P. Jackson, 1990)",
  "Ibn Battuta, Rihla (trans. H. A. R. Gibb, vol. 2, 1962)",
  "Ibn Fadlallah al-Umari, Masalik al-absar",
  "Francesco Balducci Pegolotti, La pratica della mercatura (c. 1340; trans. in H. Yule and H. Cordier, Cathay and the Way Thither, vol. III, 1914)",
  "Rus' chronicles (Laurentian, Hypatian, Novgorod First, Rogozh, Nikon); the khans' patents (yarlyks) to the Russian metropolitans",
  "C. J. Halperin, Russia and the Golden Horde (1985)",
  "D. Ostrowski, Muscovy and the Mongols (1998)",
  "U. Schamiloglu, “The Qaraçi Beys of the Later Golden Horde: Notes on the Organization of the Mongol World Empire”, Archivum Eurasiae Medii Aevi 4 (1984)",
  "R. Amitai-Preiss, Mongols and Mamluks: The Mamluk-Ilkhanid War, 1260–1281 (1995)",
  "G. A. Fedorov-Davydov, The Culture of the Golden Horde Cities (1984)",
  "I. Vásáry, Cumans and Tatars (2005)",
  "M. Favereau, The Horde: How the Mongols Changed the World (2021)",
  "J. P. Zanders, “de Mussi and the Siege of Caffa: Origin of a Biological Warfare Allegation”, Historical Notes 1 (The Trench, 2021); M. Field, “Catapulting corpses? A famous case of medieval biological warfare probably never happened”, Bulletin of the Atomic Scientists (August 2023)",
]
replaces = "Tatars as a merger of the Golden Horde with Timur's empire (1370–1507), its enemy"

[[bonus]]
text = "Livestock animals last +50% longer"
kind = "economic"
level = 1
change = "kept"
precedent = "Livestock animals last +50% longer (Tatars)"
basis = "Rubruck (1253) and Ibn Battuta (1332–1333) describe immense herds of sheep, horses and cattle, with mutton and kumis as staples; Ibn Battuta says horses were so many that merchants drove them to India in droves of about six thousand (Rihla)."
relevance = "Pastoral nomadism was the economic base and the way of life of the Horde's ruling people throughout its history."

[[bonus]]
text = "Cavalry Archers cost -10/20% in Castle/Imperial Age"
kind = "military"
level = 1
change = "new"
replaces = "New Town Centers spawn 2 Sheep starting in Castle Age"
precedent = "Cavalry Archers cost -10/20% in Castle/Imperial Age (Huns; also in the Avars', Rus' and Hindustanis' designs)"
basis = "The Horde's armies were levies of the Kipchak nomads under a Mongol elite: al-Umari (c. 1340) says that the Mongols who took the Desht-i Qipchaq mixed and intermarried with the Kipchaks, their subjects, until they became like them, as if of one race, and from Nogai's campaigns in the 1280s to Tokhtamysh's and Edigu's every Horde host was a mass of Kipchak horse archers. The nomads served with their own horses and bows, as Carpini describes for the Mongol armies of the 1240s, so the khan's archers cost him little. A structural trait, so a passive bonus (RULES 6.2). It replaces the Town Center sheep bonus, a game abstraction of seasonal migration that added nothing to the herds and wagon camps the other passives already express (RULES 6.9); the design keeps this levy passive rather than restoring the sheep."
relevance = "The levy of the Kipchak steppe gave the Horde its armies for two and a half centuries, from Batu's conquests to the Vorskla."

[[bonus]]
text = "Thumb Ring, Parthian Tactics free"
kind = "military"
level = 1
change = "kept"
precedent = "Thumb Ring, Parthian Tactics free (Tatars)"
basis = "The thumb draw and shooting backwards in feigned flight were the Horde's way of war, as of every steppe army: at the Vorskla (1399) a feigned retreat and an attack by Temür Qutlugh's reserve encircled Vytautas's army; archers' rings are known from Mongol-period steppe burials."
relevance = "Horse archery and the feigned retreat won the Horde its battles, from the conquest of Rus' to the Vorskla."

[[bonus]]
text = "Can build Arabas"
kind = "economic"
level = 1
change = "new"
precedent = "Mule Cart: unique mobile dropsite (Armenians, Georgians); Start with a Mule Cart (Georgians); the form of “Can build Caravanserai in Imperial Age” (Hindustanis, Persians)"
basis = "Rubruck, describing the Tartars he travelled among from the Crimea onwards (1253), saw felt houses carried whole on carts, one drawn by 22 oxen, and rich households with a hundred or two hundred carts; Ibn Battuta (1332–1333) travelled in the wagons the people of the Kipchak steppe called ʿaraba, and likened Özbeg's camp to a city on the move, with mosques and bazaars (Rihla, trans. Gibb, vol. 2, 1962; R. E. Dunn, The Adventures of Ibn Battuta, 1986, p. 167). The Mule Cart, renamed, is the game's existing mobile camp, and the Tatars are one of its four holders (RULES 6.16.7). It stands beside the Lumber and Mining Camps, as the Ethiopians' does, rather than replacing them as in the Armenian and Georgian pattern (see the tree basis)."
relevance = "The khan's moving camp (ordu, the origin of the word horde), carried on wagons (araba), was the setting of the Horde's life and court."
contested = "Wagon dwellings were shared by all Pontic nomads (the Polovtsian vezhi of the Rus' chronicles; Rubruck's description covers the Tartars in general), so the Araba is not unique to the Horde."

[team_bonus]
text = "Relics generate +33% gold"
level = 1
change = "new"
replaces = "Mounted Archers +2 line of sight"
precedent = "Relics generate +33% gold (Aztecs team bonus, which the Aztecs' design replaces; the Muisca's design has it as a passive). No other design has it as a team bonus."
basis = "The khans protected the Church of the Rus' principalities they ruled as overlords and spared its clergy the Horde's levies, after the Chinggisid custom of exempting the clergy who prayed for the khan. Their patents (yarlyks) to the metropolitans of Rus', from Mengu-Temür's to Metropolitan Kirill (usually dated 1267) onwards, renewed by later khans and khatuns, freed the clergy and the Church's people from the tribute, the tamga, the plough tax, the post-horse duty (yam) and military service, and guarded church lands, waters and mills, in return for prayers for the khan and his house; a bishopric for the Orthodox at Sarai was founded in 1261 (Halperin 1985). Under that protection the Russian Church held its lands free of the tribute through two centuries of Horde overlordship, and the metropolitans, settled in Moscow from the 1320s, lent their weight to its princes. More gold from Relics stands for church income spared from the tribute. RULES 6.2: a religious benefit to the Horde's Rus' neighbours: the Rus' principalities kept their own princes and church under the khans' suzerainty, outside the ulus proper, so the benefit went to autonomous neighbouring polities (the Rus' design), not to the Horde itself. The Horde's alliance with Mamluk Egypt (from 1261–1263; Amitai-Preiss 1995), whose regiments were filled with Kipchak boys bought in the Horde's lands, is the other trait that benefited an ally, but its natural effect, “Mounted Archers train +25% faster”, is already the team bonus of the Magyars and the Turks, and identical team effects count once per team (RULES 6.16.12); the Kipchak mamluks are the Arabs' unique unit. The old line-of-sight bonus benefited only the Horde."
relevance = "The khans' patents let the Russian Church keep its lands and income untouched by the tribute for two centuries, so that it came out of the Horde period as a great landowner and a pillar of Moscow, one of the most lasting effects of the khans' rule on their neighbours."
contested = "How much the Church gained is debated: the patents bound the clergy to pray for the khans, and the Church's own writers kept silent about, or were hostile to, the khans who protected it (Halperin 1985). The patents survive only in later Russian translations, the Expanded Collection's additions are suspected of being later reworkings, and the year of Mengu-Temür's patent is uncertain (civ-level contested list). The Muisca's design has the same effect as a passive, which is not team-wide, so on a team with a Tatar player the Muisca player's relics take both bonuses, as the game stacks them; the design accepts this stack (RULES 6.16.12)."

[[unique_unit]]
name = "Keshik"
model = "Keshik"
building = "Castle"
level = 1
change = "kept"
basis = "The armoured horsemen of the khans' and begs' households fought beside the Kipchak horse archers. Carpini, who crossed Batu's lands in 1246–1247, describes the lancers and the lamellar armour of hardened leather or iron that protected the richer warriors and their horses, a description that covers the Horde's founding army; the khans kept a Mongol military elite of princes (oghlans) and begs over the Kipchak levies for two centuries (Vásáry 2005). The name is that of the Chinggisid guard (kheshig), documented for the Yuan and the Ilkhans; a Jochid guard is likely but not directly documented, so the name stands for the institution's model rather than a recorded Jochid corps. Shared with the Mongols; the gold earned in combat stands for booty."
relevance = "The armoured Mongol elite of the khans' and begs' households led the Horde's Kipchak levies in every campaign, from Batu's to Edigu's, and took the lion's share of the booty."
contested = "A Jochid kheshig is plausible but not directly documented (civ-level contested list). Decision: the Keshik is kept, shared with the Mongols, rather than the Kipchak, which is better grounded for the Horde's army as a whole (al-Umari) but would make the Tatars the sixth civ with Kipchaks (the Cumans' and Georgians' Kipchak, the Hindustanis' Ghulam and the Arabs' Mamluk on the same model, and the Bulgarians' free Kipchaks through Cuman Alliance); the Kipchak levy is carried by the Cavalry Archer passive."

[[unique_tech]]
name = "Yarlyk"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Farmers slowly generate gold in addition to food"
level = 1
change = "new"
precedent = "Burgundian Vineyards (Farmers slowly generate gold in addition to food) (Burgundians): an existing unique tech, moved, shared and renamed with an identical effect and age; the Aztecs (Calpixqueh), Berbers (Taksir) and Persians (Kharaj) share it at the Town Center for tribute and land taxes, and the Bengalis' design uses it as a passive"
basis = "The khan's patent (yarlyk) made and unmade the princes of Rus': Yaroslav Vsevolodovich received the seniority from Batu in 1243 and Alexander Nevsky the throne of Vladimir in 1252, while princes who displeased the khan were put to death at his camp (Mikhail of Chernigov 1246, Mikhail of Tver 1318). In return the khans took the tribute (vykhod): the censuses of 1257–1259 registered the population for tribute and levy (Laurentian and Novgorod chronicles); Muslim tax-farmers collected it until the risings of 1262 and baskaks oversaw it into the early 14th century, after which the grand princes delivered it themselves, which made the fortune of Moscow (Halperin 1985; Ostrowski 1998). The khans' patents to the Church, known from Russian translations from Mengu-Temür's onwards, list a plough tax among the levies they spared: gold from farmers abstracts tribute raised from a farming population. Government and taxation of the subject principalities, so the Town Center (RULES 6.2), where the project's other tribute and land-tax techs also sit."
relevance = "The yarlyk system made the khans overlords of Rus' for over two centuries and decided the rise of Moscow."
contested = "See the civ-level contested list on the weight of the tribute and the transmission of the patents. The Rus' design renders Moscow's collection of the same tribute with a different effect (Kalita: Lumberjacks slowly generate gold in addition to wood), so that the two sides of the tribute do not share one effect; the Town Center techs are due for the N2 diversification pass (RULES 6.16.12)."

[[unique_tech]]
name = "Tamga"
building = "Town Center"
kind = "civil"
age = "Imperial"
effect = "Trade Units generate +25% gold"
level = 2
change = "new"
precedent = "Trade Units generate +25% gold (Spanish team bonus): a new tech with an existing effect, so level 2. No existing tech is a tax on trade: Silk Road (Trade Units cost -50%) would contradict a tax, and it is the Italians' Commenda."
basis = "The tamga was the Mongol tax on commerce. In the Horde it was levied at Sarai and on the trade of the ports where the khans let the Italians hold colonies and quarters (Caffa, traditionally from the 1260s; Tana from 1332), and the khans' patents to the Church, from Mengu-Temür's onwards, name it among the levies the clergy were spared. Pegolotti (c. 1340), relaying merchants' reports, called the road from Tana to Cathay safe by day and by night, and even its worst stretch, Tana to Sarai, safe for a company of about sixty men (trans. Yule, Cathay and the Way Thither, vol. III, 1914); the Russian word for customs, tamozhnya, comes from tamga (Favereau 2021). A state revenue levied on trade, so at the Town Center (RULES 6.2), like the Danes' Øresundstold, and an institution distinct from the Rus' tribute, so a third tech (RULES 6.3) and the civ's second at the Town Center; Imperial Age for the trade boom of the 14th century."
relevance = "Taxing the trade of Sarai and of the Italian Black Sea ports was one of the main revenues of the khans' state."
contested = "Decision: the Tamga is the Tatar player's own tech, so it adds to the same effect when it is a team bonus (the Mongols' and the Castilians'), and a Tatar player allied with them reaches +50% trade gold; the design accepts this, since only team-wide effects count once per team (RULES 6.16.12)."

[[unique_tech]]
name = "Beglerbeg"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Scout Cavalry-line, Steppe Lancers and Cavalry Archers +1 melee/+1 pierce armor"
level = 1
change = "changed"
replaces = "Silk Armor (Scout Cavalry-line, Steppe Lancers and Cavalry Archers +1 melee/+1 pierce armor), the game's Castle Age unique tech"
precedent = "Silk Armor (Scout Cavalry-line, Steppe Lancers and Cavalry Archers +1 melee/+1 pierce armor) (Tatars): the game's own Tatar tech, renamed and moved from the Castle Age to the Imperial Age, a later age (RULES 6.16.11), with an identical effect, so level 1"
basis = "In the 14th century the Horde's army and government were led by four great begs, the first of whom, the beglerbeg (‘bey of beys’, Arabic amir al-umara), commanded the host (Schamiloglu 1984). After Berdibeg's death (1359) beglerbegs ruled through khans of their own choosing: Mamai, whom the Rus' chronicles call a temnik, sent Begich to the Vozha (1378) and led the Horde at Kulikovo (1380), and Edigu, with Temür Qutlugh, won the Vorskla (1399) and besieged Moscow (1408) (Vásáry 2005; Favereau 2021). The effect is the game's own Tatar tech, Silk Armor, under the office's name: better-protected light horse and horse archers stand for the hosts that the begs raised and led, an abstraction said openly. Armour alone would not pass the relevance test (RULES 6.9): it was common to every steppe army (Carpini describes lamellar of hardened leather or iron for the Mongol armies of the 1240s, Batu's included), and the old name rested on a modern myth, silk shirts that helped draw out arrows, first found in M. Prawdin, Tschingis-Chan: der Sturm aus Asien (1934). The office that commanded the host passes it. A datable office of command, so the Castle (RULES 6.2); Imperial Age for the 14th century."
relevance = "The beglerbegs commanded the Horde's armies and, from Mamai to Edigu, ruled the Horde itself in its last great century."
contested = "When the office took its classic form (under Özbeg or only in the later 14th century) and how far the four-beg system goes back to the Mongol empire are debated; the armour effect abstracts the begs' hosts, not the office itself. Aznauri Cavalry (Mounted Units take -20% population space) (Georgians) would also fit the begs' self-supplied tümens, but the Georgians' design keeps that effect as its aznauri passive, so the two designs do not share it."

[tree]
add = ["Mule Cart", "Traction Trebuchet", "Faith", "Sanctity", "Architecture"]
remove = ["Camel Rider", "Heavy Camel Rider", "Hand Cannoneer", "Bombard Tower", "Trebuchet", "Fortified Wall", "Block Printing", "Galleon", "Fast Fire Ship", "Carrack", "Galleon, Fast Fire Ship and Carrack", "Cannon Galleon", "Elite Cannon Galleon"]

[tree.basis]
"Mule Cart" = "Added and renamed Araba (see the bonus): the Horde's wagon camps. It stands beside the Lumber and Mining Camps instead of replacing them; the Tatars are one of the Mule Cart's four holders (RULES 6.16.7)."
"Traction Trebuchet" = "Heavy stone-throwers are attested for the Horde and its founding campaign, and the counterweight type is not. Batu's army, the Horde's founding host, set up poroki (the chronicles' word for siege engines, usually read as stone-throwers; the chronicles do not record their type) against Vladimir (February 1238; Laurentian Chronicle) and at the Polish Gate of Kiev, where they battered the walls day and night until they broke them (December 1240; Hypatian Chronicle), both just before the window, in the campaign that founded the Horde. Janibeg besieged Genoese Caffa with engines that an Italian relief force destroyed in February 1344 (M. Wheelis, “Biological Warfare at the 1346 Siege of Caffa”, Emerging Infectious Diseases 8, 2002); J. P. Zanders, who has studied the siege, takes them for man-powered engines, the one reading of the type of a Horde engine (Zanders 2021, as reported by Field 2023, both in the sources; the man-powered reading is not confirmed at first hand in Zanders' paper). On that reading the Traction Trebuchet is the Horde's long-range siege weapon and replaces the counterweight Trebuchet (RULES 6.16.5, 6.11), as for the Avars; the type rests on one reading and on the silence of the other sources (civ-level contested list). Trained at the Siege Workshop in the Imperial Age."
"Faith" = "Islam became the Horde's state religion under Özbeg (from 1313), after Berke's personal conversion before his reign (1257–1266); the khans also protected the Orthodox Church, with a bishopric at Sarai from 1261."
"Sanctity" = "As Faith: the mosques, madrasas and Sufi lodges of Sarai, Bolghar and Solkhat, where Özbeg's mosque was built in 1314."
"Architecture" = "The Horde built and rebuilt cities: Sarai and Sarai al-Jadid on the lower Volga, a revived Bolghar, Azak, Hajji Tarkhan and Solkhat, with palaces and mosques of fired brick and glazed tile at Sarai and Urgench and of cut stone at Bolghar and Solkhat (G. A. Fedorov-Davydov, The Culture of the Golden Horde Cities, 1984); Architecture stands for this urban building."
"Fortified Wall" = "The Horde defended its realm with field armies rather than fortresses, and most of its towns were unwalled until the troubles of the later 14th century, when some received ramparts (Fedorov-Davydov 1984). The Stone Wall and the Guard Tower stand for those late defences; the top tiers, the Fortified Wall and the Keep (which the Tatars already lack), are left out."
"Camel Rider" = "Camels carried baggage and caravan goods in the Horde and Khwarazm; there is no record of camel cavalry."
"Heavy Camel Rider" = "As Camel Rider."
"Hand Cannoneer" = "No firearms are securely recorded in the Horde's own armies: the “thunder” of Bolghar (1376) is a disputed reading, the first reliable firearms in Rus' were Moscow's, against Tokhtamysh in 1382, and the guns of Kazan and Crimea belong to successor khanates outside the entity (RULES 6.16.19(d)), while none are securely recorded for the Great Horde (at the Ugra in 1480 the guns were Muscovy's)."
"Bombard Tower" = "As Hand Cannoneer: no gun towers are recorded in the Horde's towns."
"Trebuchet" = "The counterweight trebuchet is not attested in the Horde's own armies: the chronicles do not say what kind Batu's poroki were, the one reading of the type, for Caffa (1344), is of man-powered engines (Zanders; see Traction Trebuchet), and besieging Moscow in 1408 Edigu ordered the prince of Tver to bring his artillery, which never arrived (Rus' chronicles). Its absence is an argument from silence (civ-level contested list); on the evidence as it stands it is removed under the codex rule for engines that never reached a civ (RULES 6.16.5) and replaced by the Traction Trebuchet (RULES 6.11); the Mangonel and Onager stay as the generic stone-thrower."
"Block Printing" = "No printing in the window: in the Horde's lands documents and books, from the khans' yarlyks to the Codex Cumanicus, were written by hand."
"Galleon" = "The Horde had no war fleet: the khans let Genoese and Venetians hold colonies and quarters in their ports (Caffa, Tana) and kept their own customs officials there, and its wars were fought on land and across rivers. So the basic navy only, under the codex navy rule (RULES 6.16.1): the Galley-line to War Galley, the Fire Galley and Fire Ship, the Hulk-line as the game's generic melee warship, the demolition ships and the Dock techs, with no Galleon, Carrack, Fast Fire Ship or siege warship."
"Fast Fire Ship" = "As Galleon."
"Carrack" = "As Galleon: no ocean-going ships."
"Galleon, Fast Fire Ship and Carrack" = "Nothing left to upgrade once the three ships are removed."
"Cannon Galleon" = "No naval artillery is recorded for the Horde."
"Elite Cannon Galleon" = "As Cannon Galleon."

[[rename]]
from = "Mule Cart"
to = "Araba"
model = "Ox Wagon"
level = 1
basis = "Ibn Battuta's word (ʿaraba) for the wagons of the Kipchak steppe, which carried felt tents and goods; araba is still the Turkic word for a cart. The look is the Scenario Editor's Ox Wagon (The Last Khans), existing game content (RULES section 5), which fits Rubruck's ox-drawn house-carts better than the mule of the Armenian and Georgian cart; only the look is used, so the cart keeps the Mule Cart's function, and the Ox Wagon's art must be checked in the game."

[architecture]
set = "Central Asian"
level = 1
change = "kept"
basis = "The Horde's towns used fired brick and glazed tile at Sarai and Urgench, in the Khwarazmian and Iranian tradition, and cut stone at Bolghar and Solkhat (Fedorov-Davydov 1984); the Central Asian set approximates the brick-and-tile towns, and a Steppe set would fit the wagon camps (N3; the steppe civs keep stopgap sets until then, RULES 6.16.8)."

[[dropped]]
item = "Units deal +25% damage when fighting from higher elevation"
kind = "bonus"
reason = "Unfounded: the advantage of high ground is universal, and steppe warfare was fought mostly on open plains; nothing ties it to the Horde."

[[dropped]]
item = "Flaming Camel"
kind = "unique_unit"
reason = "A Timurid unit: Timur's stratagem against the elephants of the Delhi sultanate (17 December 1398), reported in Timurid and later narratives whose earliest attestation is uncertain (civ-level contested list; the Malfuzat-i Timuri, a later pseudo-memoir of doubtful authenticity, is translated in Elliot and Dowson, History of India, vol. 3, 1871); the Timurid chroniclers stress ditches, tethered buffaloes and caltrops. Timur devastated the Horde in 1391 and 1395, so it has no place here; it is left to the Persians, who carry the Timurids but leave it out of N1, keeping it for an N3 Timurid variant (see their ideas)."

[[dropped]]
item = "Timurid Siegecraft"
kind = "unique_tech"
reason = "Trebuchets +2 range. Timur's siegecraft (Urgench 1388, Baghdad 1401, Smyrna 1402) belonged to the Horde's enemy and devastator, and the Horde had no counterweight Trebuchet for it to improve. It is not for the Persians either (RULES 6.16.18); its best home would be a Mongol Huihui Pao (1273), which the Mongols' design records as an idea, and a Timurid civ or variant is an N3 idea. Its Imperial Castle slot goes to the Beglerbeg."
