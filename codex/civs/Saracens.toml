civ = "Saracens"
name = "Saracens"
status = "draft"
label = "Cavalry Archer and Naval civilization"
summary = "Saracens as the Arab caliphates and Ayyubid–Mamluk Egypt and Syria (632–1517): a horse-archer Mamluk replaces the camel Mameluke, Iqta' land grants and Arabic science passed to neighbours are new, Bimaristan moves to the Town Center, and the Hand Cannoneer and Cannon Galleons leave."
ideas = [
  "N2: Give the Mamluk its own model: an armoured horse archer who can switch to the lance (the Ratha's mode switch), costlier than the light Kipchak it borrows now. The same model would serve the Hindustanis' Ghulam, since ghulam and mamluk name one institution (Turkish military slaves).",
  "N2: A Naffat unit (naphtha thrower) with a short-range blast attack strong against buildings and siege engines, built from the existing grenade and fire mechanics, for the naffatun of Abbasid, Ayyubid and Mamluk armies (Acre, 1190: Baha al-Din ibn Shaddad).",
  "N2: Barid: the state post with relay stations and carrier pigeons (Umayyads and Abbasids; revived by Baybars in the 1260s) as a line-of-sight technology.",
  "N3: Split the civ into Arabs (the caliphates, 632 to c. 1050, naval and commercial) and Mamluks (Egypt and Syria, 1250–1517, cavalry and siege), as Age of Empires IV separates the Abbasids and the Ayyubids.",
]
contested = [
  "Origin of the counterweight trebuchet: Byzantine (Chevedden: in use by c. 1165) or Islamic (Murda al-Tarsusi's treatise for Saladin, c. 1187).",
  "Ayalon's thesis (1956) that the Mamluk cavalry elite despised hand firearms, and that this weighed in the defeats of Marj Dabiq (1516) and Raydaniyya (1517), has been nuanced by later studies; the Mamluks did field guns and arquebusiers at Raydaniyya.",
  "Watson's ‘Arab agricultural revolution’ (1974, 1983) against Decker (2009): Crop Rotation stays out of the tree.",
  "Craft guilds (asnaf) in Islamic cities before the Ottomans: S. M. Stern (1970) against Massignon; Guilds stays out of the tree.",
  "Dating of the first Arab siege of Constantinople (674–678 in Theophanes; 667–669 for Jankowiak; denied by Howard-Johnston) and of Poitiers/Tours (732 or 733).",
  "The House of Wisdom (Bayt al-Hikma) of al-Ma'mun: a scientific academy or mainly a palace library (Dimitri Gutas, Greek Thought, Arabic Culture, 1998).",
  "Block Printing stays in the tree for the printed amulets (tarsh), paper strips with Qur'anic verses and prayers made in Egypt from about the 10th to the 14th century (Richard W. Bulliet, ‘Medieval Arabic Ṭarsh’, Journal of the American Oriental Society 107, 1987; Karl R. Schaefer, Enigmatic Charms, 2006). No block survives, so whether they were cut in wood or engraved in tin is inferred from the prints and from poems; books were not printed.",
]
open_questions = [
  "Name: keep ‘Saracens’ (a Greco-Latin exonym that medieval Christians applied to all Muslims) or rename to ‘Arabs’, as the analysis and the names theme recommend? Not decided, so the current name is kept. Note that ‘Arabs’ would sit awkwardly with a Turkic (Kipchak, later Circassian) ‘Mamluk’ unique unit, the analysis' own argument for splitting Arabs and Mamluks (see the N3 idea). The renames are decided together in codex-wide question CQ16 (see codex/civs/README.md).",
  "Unique unit: the camel-riding Mameluke (rated wrong: Mamluks rode horses and fought as horse archers and lancers; the thrown scimitar is a game invention) is replaced by the Cuman Kipchak renamed ‘Mamluk’, since the Bahri mamluks were largely Kipchaks; it loses the anti-cavalry role, which the camels keep. The Kipchak model thus serves four civs (the Cumans' Kipchak, the Georgians' Kipchak, the Hindustanis' Ghulam and these Mamluks), besides the free Elite Kipchaks of the Cumans' Cuman Mercenaries and the Bulgarians' Cuman Alliance. Accept the four-way share, restore the Mameluke unchanged until an N2 remodel, or use the Persian Savar renamed (heavy cavalry strong against ranged units, but without a bow)? Also: the spelling ‘Mamluk’ (modern scholarship) or ‘Mameluke’ (the game)?",
  "Codex-wide question CQ19 (see codex/civs/README.md): labels (here ‘Cavalry Archer and Naval’ for ‘Camel and Naval’).",
  "Heavy Cavalry Archer upgrade: -50% (the Khitan magnitude), to keep the power budget. Alternative: free (magnitude precedents ‘Militia-line upgrades free’, Bulgarians, and the Turks' free Scout Cavalry-line upgrades). Keep -50%?",
  "Naval package: the Transport Ships bonus is dropped, and the Fast Fire Ship, which the game's Saracens lack, is not added, to keep the power budget, not for lack of history: Arab landings and island conquests (Cyprus 649, Crete c. 827, Sicily 827–902, the Balearics 902/903) were major enterprises, and Muslim fleets had a named fire ship, the ḥarrāqa, which carried naphtha throwers. Restore the bonus or add the Fast Fire Ship? If one of them comes in, the Fast Fire Ship as the ḥarrāqa has the more specific referent; the Tamils' and Burmese designs already use the identical Transport Ships bonus.",
  "Codex-wide question CQ1 (see codex/civs/README.md): navy rule (without the Cannon Galleon this naval civ has no siege warship).",
  "Iqta' shares the Turks' Sipahi (their Timar), because the Ottoman timar grew out of the Seljuk iqta': the Saracens and the Turks hold the same Town Center tech, and the Hindustanis hold it at the Castle as Dagh (reuse in general is codex-wide question CQ11, see codex/civs/README.md). Keep the shared tech? Alternative: a new tech (level 2) such as ‘Knight-line and Cavalry Archers cost -25% gold’, which also covers the armoured lancers the iqta' paid.",
  "Priorities: the mamluk horse archer now fills three slots (the Mamluk, the Heavy Cavalry Archer bonus and Iqta'), while the early caliphate (632 to c. 1050) has only passives and the team bonus. Should one slot carry an early caliphal moment instead, for example Abd al-Malik's Arabic coinage and chancery reform (696–700) as a Town Center tech?",
  "Codex-wide question CQ6 (see codex/civs/README.md): religious vocabulary (for the Muslim civs, e.g. Sufi and Khanqah).",
]

[profile]
entity = "The Arab caliphates and the Arabic-speaking Islamic states of the Near East: Rashidun, Umayyad, Abbasid and Fatimid caliphates, the Ayyubids and the Mamluk Sultanate of Egypt and Syria"
region = "Arabia, Syria, Iraq, Egypt and the southern and eastern Mediterranean; of al-Andalus only the Umayyad conquest and province (711–750) are included, its Almoravid and Almohad periods belonging to the Berbers; Iraq under the Buyid and Seljuk sultans (945 to the 1150s) is shared with the Persians"
window = "632–1517 (from the Rashidun caliphate to the Ottoman conquest of Egypt; military core 1171–1517: Ayyubid and Mamluk Egypt and Syria)"
sources = [
  "al-Tabari, Ta'rikh al-rusul wa'l-muluk",
  "al-Baladhuri, Futuh al-buldan",
  "Baha al-Din ibn Shaddad, al-Nawadir al-sultaniyya (trans. D. S. Richards, The Rare and Excellent History of Saladin, 2001)",
  "Murda al-Tarsusi, Tabsirat arbab al-albab (c. 1187)",
  "al-Maqrizi, Kitab al-suluk; al-Khitat",
  "Hugh Kennedy, The Great Arab Conquests (2007); The Prophet and the Age of the Caliphates (3rd ed., 2016)",
  "Fred M. Donner, The Early Islamic Conquests (1981)",
  "David Ayalon, Gunpowder and Firearms in the Mamluk Kingdom (1956); The Mamluk Military Society (1979)",
  "Reuven Amitai-Preiss, Mongols and Mamluks: The Mamluk-Ilkhanid War, 1260–1281 (1995)",
  "Christophe Picard, La mer des califes (2015)",
  "Michael W. Dols, ‘The Origins of the Islamic Hospital: Myth and Reality’, Bulletin of the History of Medicine 61 (1987)",
  "J. D. Latham and W. F. Paterson, Saracen Archery (1970; Taybugha's manual, c. 1368)",
  "Dimitri Gutas, Greek Thought, Arabic Culture (1998)",
  "Claude Cahen, ‘L'évolution de l'iqta' du IXe au XIIIe siècle’, Annales 8 (1953)",
  "Halil İnalcık, The Ottoman Empire: The Classical Age 1300–1600 (1973)",
]

[[bonus]]
text = "Market trading fee only 5%; Markets cost -100 wood"
kind = "economic"
level = 1
change = "kept"
precedent = "Market trading fee only 5%; Markets cost -100 wood (Saracens)"
basis = "The Islamic world joined the Mediterranean, the Indian Ocean and the Sahara with a stable coinage (dinar and dirham), credit and transfer instruments (sakk, hawala, suftaja), suqs and funduqs; the Cairo Geniza letters show dense merchant networks (S. D. Goitein, A Mediterranean Society, 1967–1993). A low trading fee is a fair abstraction."
relevance = "Long-distance trade financed the caliphates and Mamluk Egypt and carried Islam along the routes; without it the civ loses its economic identity."

[[bonus]]
text = "Camel Units +25% HP"
kind = "military"
level = 1
change = "kept"
precedent = "Camel Units +25% HP (Saracens)"
basis = "The dromedary gave the conquest armies their strategic mobility, as in Khalid ibn al-Walid's desert crossing to Syria in 634 (al-Baladhuri, al-Tabari), and remained the transport animal of every Arab and Mamluk army. An abstraction of the camel's hardiness."
relevance = "Camel-borne mobility made the conquests of 632–651 possible across the deserts between Arabia, Syria and Iraq; it is also the trait most associated with the Arabs."
contested = "In battle the conquerors fought mostly on horseback or on foot (Yarmuk and Qadisiyya, 636); the camel served above all for transport."

[[bonus]]
text = "Galley-line attacks +25% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Galley-line attacks +25% faster (Saracens)"
basis = "Rashidun-era fleets of Egypt and Syria (Mu'awiya being governor of Syria) beat the Byzantines at the Battle of the Masts (654/655); Umayyad fleets attacked Constantinople (717–718); Aghlabid and Fatimid fleets held much of the central and eastern Mediterranean until the 11th century (Picard, 2015). Mamluk sea power was intermittent but real (Cyprus 1426, Rhodes 1440 and 1444, the Indian Ocean fleet of 1505–1509)."
relevance = "Arab galley fleets broke Byzantine control of the eastern Mediterranean, raided Cyprus and carried the conquest of Sicily; without them the caliphate stays a land power."

[[bonus]]
text = "Heavy Cavalry Archer upgrade costs -50%"
kind = "military"
level = 1
change = "new"
precedent = "Heavy Cavalry Archer upgrade available in Castle Age and costs -50% (Khitans)"
basis = "From the Turkish ghilman of Samarra (830s) to the Mamluks, the core of these armies was the armoured horse archer, trained also with lance and sword in the furusiyya of the barracks schools (tibaq) and the training grounds (maydan) of Cairo; manuals such as Taybugha's on archery (c. 1368; Latham and Paterson, 1970) codify the training. These troops beat the Mongols at Ain Jalut (1260) and Homs (1281) (Ayalon; Amitai-Preiss, 1995). The tree already had Cavalry Archer, Heavy Cavalry Archer, Thumb Ring and Parthian Tactics, but no bonus expressed the civ's best-documented military trait."
relevance = "The trained horse archer was the military base of the Abbasid ghilman and of the Mamluk state, which stopped the Mongols; erase it and the Mamluk era makes no sense."

[team_bonus]
text = "Technologies research +25% faster"
level = 1
change = "new"
replaces = "Foot Archers and Skirmishers +2 attack vs. buildings"
precedent = "Technologies research +25% faster (Portuguese team bonus, which the Portuguese design replaces; the Vietnamese design uses the same effect for its Văn Miếu tech)"
basis = "Arabic was the language through which Greek, Persian and Indian science, and Islamic advances in mathematics, astronomy and medicine, reached the neighbours: the translation movement patronised by the Abbasid caliphs (al-Ma'mun, 813–833; Gutas, 1998), paper made in Baghdad from c. 794 and in al-Andalus by the 12th century, and the Latin translations of Arabic works at Toledo and in Sicily (Gerard of Cremona, d. 1187, translated al-Khwarizmi and Avicenna's Canon). Neighbours researched faster with what the Arabic world passed on. The original team bonus (rated unfounded) had no referent."
relevance = "Transmitting science and techniques to Europe and Asia is one of the defining legacies of the Arabic-speaking world, and it benefited neighbours, as RULES 6.2 requires."

[[unique_unit]]
name = "Mamluk"
model = "Kipchak"
building = "Castle"
level = 1
change = "new"
replaces = "Mameluke"
basis = "Mamluks were slave soldiers bought young and trained as the elite of the Ayyubid and Mamluk armies; al-Salih Ayyub's Bahriyya (1240s) and the early Mamluk sultans' troops were mostly Kipchak Turks from the steppe (from 1382 mostly Circassians). They stopped the Mongols at Ain Jalut (1260) and Homs (1281) and took Acre (1291), fighting above all as horse archers trained to shoot rapidly in volleys (Ayalon; Amitai-Preiss, 1995; Latham and Paterson, 1970). The Cuman Kipchak, a horse archer who looses several arrows at once, is the same people and the nearest existing unit; the game's camel-riding Mameluke with a thrown scimitar had the depiction wrong (analysis: ‘wrong’)."
relevance = "The mamluk institution produced the soldiers who ruled Egypt and Syria for 267 years, defeated the Mongols and ended the Crusader states."
contested = "The Kipchak is a light, cheap horse archer, while the royal mamluks were armoured and costly (see the N2 idea; Iqta' partly makes up for it). The Kipchak model is also the Cumans' and the Georgians' Kipchak and the Hindustanis' Ghulam: sharing it with the Cumans is deliberate (the Bahri mamluks and the Cumans were both Kipchaks), and the Ghulam is the same institution in Delhi."

[[unique_tech]]
name = "Counterweights"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Trebuchets and Mangonel-line +15% attack"
level = 1
change = "kept"
precedent = "Counterweights (Trebuchets and Mangonel-line +15% attack) (Saracens)"
basis = "Murda al-Tarsusi's treatise for Saladin (c. 1187) contains one of the earliest clear descriptions of counterweight trebuchets, and the Mamluks massed them against the Crusader fortresses, above all Acre (1291). The technique also travelled east: Muslim engineers sent by the Ilkhan Abaqa built such engines for Kublai at Xiangyang (1273), where they were called huihui pao, ‘Muslim trebuchets’ (a secondary illustration, also used in the Mongols' design)."
relevance = "Massed engines, together with mines, let the Mamluks take the last Crusader strongholds (Tripoli 1289, Acre 1291) and end the Crusader states."
contested = "A Byzantine origin is argued by Chevedden; extending the effect to the Mangonel-line is a game liberty. Other strongholds fell mainly to mining (Margat, 1285), which Sappers and Siege Engineers carry."

[[unique_tech]]
name = "Bimaristan"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Monks passively heal multiple nearby units"
level = 1
change = "changed"
precedent = "Bimaristan (Monks passively heal multiple nearby units) (Saracens): an existing unique tech, moved from the Castle to the Town Center; the Khmer design shares the effect as Arogyashala, also at the Town Center"
basis = "The bimaristan (Persian bimar ‘sick’ + stan ‘place’) was the great Islamic hospital: Dols (1987) places the first in Baghdad in the early 9th century, where al-Razi later practised; Nur al-Din's in Damascus (1154) and Qalawun's al-Mansuri in Cairo (1284–1285), part of a pious foundation with a madrasa and the sultan's mausoleum, followed with specialised wards and medical teaching. They were royal foundations, so the tech sits at the Town Center (RULES 6.2), like the Khmer Arogyashala."
relevance = "The endowed hospital with medical teaching is a signature institution of Islamic civilisation, the setting of al-Razi's and Ibn al-Nafis's medicine."
contested = "Bimaristans were staffed by physicians and funded by waqf endowments, not run by clergy; tying them to Monks is an abstraction."

[[unique_tech]]
name = "Iqta'"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Mounted Archers +20 HP"
level = 1
change = "new"
precedent = "Sipahi (Mounted Archers +20 HP) (Turks, who keep it at the Town Center as Timar; the Hindustanis share it at the Castle as Dagh): an existing unique tech, shared and renamed with an identical effect and age"
basis = "The iqta' assigned the revenue of a district to a soldier or officer in return for service: introduced on a large scale by the Buyids (946), it paid the cavalry of Saladin and of the Mamluks, whose cadastral surveys (al-Rawk al-Husami, 1298; al-Rawk al-Nasiri, 1313–1325) redistributed the land of Egypt among the sultan, the amirs and their mamluks (Cahen, 1953; al-Maqrizi). The revenue kept the mamluk horse archers mounted, armoured and equipped; sturdier mounted archers, the Mamluk among them, translate it. The Ottoman timar grew out of the Seljuk iqta' (İnalcık, 1973), so the tech shares the Turks' Sipahi, which they keep as Timar (level 1). Szlachta Privileges (Knight-line costs -60% gold) is not used because it leaves out the horse archers the iqta' paid."
relevance = "The iqta' financed the cavalry armies of the Ayyubid and Mamluk states and shaped their politics; without it their military order could not have been paid."

[tree]
add = ["Cavalier", "Shipwright", "Architecture"]
remove = ["Hand Cannoneer", "Cannon Galleon", "Elite Cannon Galleon"]

[tree.basis]
"Cavalier" = "Heavy mail-clad cavalry with lance and sword, sometimes on armoured horses (tijfaf), was the core of Ayyubid and Mamluk armies and an important arm of the Fatimids, whose armies also relied on Kutama Berber cavalry, black infantry ('abid) and Turkish and Armenian contingents (Yaacov Lev, State and Society in Fatimid Egypt, 1991). Stopping at the Knight contradicted the civ's best-documented military identity. The Paladin stays out."
"Shipwright" = "Renamed Dar al-Sina'a (see the rename): the state arsenals of Tunis (c. 698), Alexandria and Rawda island at Fustat built the caliphal fleets. Its absence was ironic in a naval civ."
"Architecture" = "Monumental building from the Dome of the Rock (691/692) and the Great Mosque of Damascus (705–715) to Samarra (836–892), al-Azhar (970–972) and Mamluk Cairo (Sultan Hasan, 1356–1363), and military works such as Saladin's Citadel of Cairo (from 1176). Treadmill Crane, which the analysis pairs with Architecture, stays out: treadwheel cranes are documented for Roman and later European building sites, not for Islamic ones."
"Hand Cannoneer" = "The Mamluks used cannon in sieges from the 1360s (the Bombard Cannon stays), but their cavalry elite refused hand firearms: a corps of black slaves armed with arquebuses under al-Nasir Muhammad ibn Qaytbay was attacked by the royal mamluks and broken up (1498), and the arquebusier corps raised under al-Ghawri (c. 1510) stayed small, low-status and outside the mamluk elite (Ayalon, 1956). Tumanbay still had guns and arquebusiers at Raydaniyya (1517), so the removal models the elite's refusal, not a lack of handguns (see contested). It also sets the Saracens apart from the Turks."
"Cannon Galleon" = "Gun-armed Mamluk warships are attested only for the Red Sea fleets of the sultanate's last years (from 1505: Chaul 1508, Diu 1509). It is a post-1500 element whose fame is that of the Portuguese victory at Diu, while the Mamluks are known for their reluctance to adopt firearms (Ayalon 1956), so it fails the clear-fame test of RULES section 2, as the Bengalis' guns do."
"Elite Cannon Galleon" = "As Cannon Galleon."

[[rename]]
from = "Shipwright"
to = "Dar al-Sina'a"
level = 1
basis = "Dār al-ṣināʿa, ‘house of manufacture’, the state naval arsenal (Tunis, Alexandria, Rawda); through Venetian it gave European languages the word ‘arsenal’. The function (a state shipyard that builds ships faster and cheaper) is a real equivalent; the effect is identical."

[[rename]]
from = "Elite Kipchak"
to = "Elite Mamluk"
level = 1
basis = "Follows the unique unit (Kipchak → Mamluk) for the Saracens only."

[architecture]
set = "Middle Eastern"
change = "kept"
basis = "Arab-Islamic building of Syria, Iraq and Egypt (domes, courtyards, minarets) is what the Middle Eastern set represents."

[[dropped]]
item = "Transport Ships +100% HP, +20 carry capacity"
kind = "bonus"
reason = "Power budget, not relevance: dropped to offset the new Heavy Cavalry Archer bonus, the Cavalier and Iqta' (for the same reason the Fast Fire Ship, which the game's Saracens lack, is not added). The trait itself is weighty (Arab landings and island conquests: Cyprus 649, Crete c. 827, Sicily 827–902, Bari 847–871, the Balearics 902/903, Fraxinetum c. 890–972), so its return is an open question; the Tamils' and Burmese designs use the identical bonus."
