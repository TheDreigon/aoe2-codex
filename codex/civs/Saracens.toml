civ = "Saracens"
name = "Saracens"
status = "draft"
label = "Cavalry and Naval civilization"
summary = "Saracens kept as the Arab caliphates and Ayyubid–Mamluk Egypt and Syria (c. 630–1517): the trade, camel and galley bonuses, Counterweights (Castle) and Bimaristan (now at the Monastery) stay; a horse-archer Mamluk (the Kipchak model) replaces the camel-riding Mameluke, a cheaper Heavy Cavalry Archer upgrade and the Iqta' land grants (new Town Center tech) carry the Mamluk cavalry, Arabic science passed to neighbours becomes the team bonus, and Cavalier, Dar al-Sina'a (Shipwright), Architecture and Treadmill Crane enter while the Hand Cannoneer and the Transport Ships bonus leave."
ideas = [
  "N2: Give the Mamluk its own model: a horse archer who can switch to the lance (the Ratha's mode switch) on an existing heavy horse-archer graphic, armoured and costlier than the light Kipchak it borrows now.",
  "N2: A Naffat unit (naphtha thrower) with a short-range blast attack strong against buildings and siege engines, built from the existing grenade and fire mechanics, for the naffatun of Abbasid, Ayyubid and Mamluk armies (Acre, 1190: Baha al-Din ibn Shaddad).",
  "N2: Barid: the state post with relay stations and carrier pigeons (Umayyads and Abbasids; revived by Baybars in the 1260s) as a line-of-sight technology.",
  "N3: Split the civ into Arabs (the caliphates, c. 630–1050, naval and commercial) and Mamluks (Egypt and Syria, 1250–1517, cavalry and siege), as Age of Empires IV separates the Abbasids and the Ayyubids.",
]
contested = [
  "Origin of the counterweight trebuchet: Byzantine (Chevedden: in use by c. 1165) or Islamic (Murda al-Tarsusi's treatise for Saladin, c. 1187).",
  "Ayalon's thesis (1956) that the Mamluk cavalry elite despised hand firearms, and that this weighed in the defeats of Marj Dabiq (1516) and Raydaniyya (1517), has been nuanced by later studies.",
  "Watson's ‘Arab agricultural revolution’ (1974, 1983) against Decker (2009): Crop Rotation stays out of the tree.",
  "Craft guilds (asnaf) in Islamic cities before the Ottomans: S. M. Stern (1970) against Massignon; Guilds stays out of the tree.",
  "Dating of the first Arab siege of Constantinople (674–678 in Theophanes; 667–669 for Jankowiak; denied by Howard-Johnston) and of Poitiers/Tours (732 or 733).",
  "The House of Wisdom (Bayt al-Hikma) of al-Ma'mun: a scientific academy or mainly a palace library (Dimitri Gutas, Greek Thought, Arabic Culture, 1998).",
]
open_questions = [
  "Name: keep ‘Saracens’ (a Greco-Latin exonym that medieval Christians applied to all Muslims) or rename to ‘Arabs’, as the analysis and the names theme recommend? Not decided, so the current name is kept.",
  "Unique unit: this revision replaces the camel-riding Mameluke (rated wrong: Mamluks rode horses and fought as horse archers and lancers; the thrown scimitar is a game invention) with the Cuman Kipchak renamed ‘Mamluk’, since the Bahri mamluks were largely Kipchaks; it loses the anti-cavalry role, which the camels keep. Options: (a) this choice; (b) restore the Mameluke unchanged until an N2 remodel (note that the kept ‘Camel Units +25% HP’ also strengthens its camel depiction); (c) the Persian Savar renamed (heavy cavalry strong against ranged units, but without a bow and blurring Saracens and Persians). Also: the spelling ‘Mamluk’ (modern scholarship) or ‘Mameluke’ (the game)?",
  "Label: changed from ‘Camel and Naval’ to ‘Cavalry and Naval’, since the military identity is now the horse-mounted furusiyya and camels count as cavalry. Keep the old label instead?",
  "Heavy Cavalry Archer upgrade: -50% (the Khitan magnitude) after the power review; the first draft made it free (magnitude precedents: ‘Militia-line upgrades free’, Bulgarians; Turkish free Scout Cavalry-line upgrades). Which do you prefer?",
  "Naval package: Dar al-Sina'a (Shipwright) is added and the Fast Fire Ship is not (its basis was generic); the Transport Ships bonus is dropped under the relevance test. Restore either?",
  "Team bonus: ‘Technologies research +25% faster’ is the current Portuguese team bonus, which the owner judged wrong for the Portuguese; here it stands for Arabic science passed to neighbours. Alternative: ‘Universities work +80% faster’ (Malians), already used by several drafts.",
  "Religious vocabulary: rename Monk and Monastery for the Muslim civs of this region (e.g. Sufi and Khanqah, Ribat for the Berbers)? Not done, to keep the vocabulary consistent across regions until the owner decides.",
]

[profile]
entity = "The Arab caliphates and the Arabic-speaking Islamic states of the Near East: Rashidun, Umayyad, Abbasid and Fatimid caliphates, the Ayyubids and the Mamluk Sultanate of Egypt and Syria"
region = "Arabia, Syria, Iraq, Egypt and the southern and eastern Mediterranean"
window = "c. 630–1517 (military core 1171–1517: Ayyubid and Mamluk Egypt and Syria)"
sources = [
  "al-Tabari, Ta'rikh al-rusul wa'l-muluk",
  "al-Baladhuri, Futuh al-buldan",
  "Baha al-Din ibn Shaddad, al-Nawadir al-sultaniyya (trans. D. S. Richards, The Rare and Excellent History of Saladin, 2001)",
  "Murda al-Tarsusi, Tabsirat arbab al-albab (c. 1187)",
  "al-Maqrizi, Kitab al-suluk; al-Khitat",
  "Hugh Kennedy, The Great Arab Conquests (2007); The Prophet and the Age of the Caliphates (3rd ed., 2016)",
  "Fred M. Donner, The Early Islamic Conquests (1981)",
  "David Ayalon, Gunpowder and Firearms in the Mamluk Kingdom (1956); The Mamluk Military Society (1979)",
  "Reuven Amitai-Preiss, Mongols and Mamluks: The Mamluk-Ilkhanid War, 1260–1281 (1995)",
  "Christophe Picard, La mer des califes (2015)",
  "Michael W. Dols, ‘The Origins of the Islamic Hospital: Myth and Reality’, Bulletin of the History of Medicine 61 (1987)",
  "J. D. Latham and W. F. Paterson, Saracen Archery (1970; Taybugha's manual, c. 1368)",
  "Dimitri Gutas, Greek Thought, Arabic Culture (1998)",
  "Claude Cahen, ‘L'évolution de l'iqta' du IXe au XIIIe siècle’, Annales 8 (1953)",
]

[[bonus]]
text = "Market trading fee only 5%; Markets cost -100 wood"
kind = "economic"
level = 1
change = "kept"
precedent = "Market trading fee only 5%; Markets cost -100 wood (Saracens)"
basis = "The Islamic world joined the Mediterranean, the Indian Ocean and the Sahara with a stable coinage (dinar and dirham), credit and transfer instruments (sakk, hawala, suftaja), suqs and funduqs; the Cairo Geniza letters show dense merchant networks (S. D. Goitein, A Mediterranean Society, 1967–1993). A low trading fee is a fair abstraction."
relevance = "Long-distance trade financed the caliphates and Mamluk Egypt and carried Islam along the routes; without it the civ loses its economic identity."

[[bonus]]
text = "Camel Units +25% HP"
kind = "military"
level = 1
change = "kept"
precedent = "Camel Units +25% HP (Saracens)"
basis = "The dromedary gave the conquest armies their strategic mobility, as in Khalid ibn al-Walid's desert crossing to Syria in 634 (al-Baladhuri, al-Tabari), and remained the transport animal of every Arab and Mamluk army. An abstraction of the camel's hardiness."
relevance = "Camel-borne mobility made the conquests of 632–651 possible across the deserts between Arabia, Syria and Iraq; it is also the trait most associated with the Arabs."
contested = "In battle the conquerors fought mostly on horseback or on foot (Yarmuk and Qadisiyya, 636); the camel served above all for transport."

[[bonus]]
text = "Galley-line attacks +25% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Galley-line attacks +25% faster (Saracens)"
basis = "Rashidun-era fleets of Egypt and Syria (Mu'awiya being governor of Syria) beat the Byzantines at the Battle of the Masts (654/655); Umayyad fleets attacked Constantinople (717–718); Aghlabid and Fatimid fleets held much of the central and eastern Mediterranean until the 11th century (Picard, 2015). Mamluk sea power was intermittent but real (Cyprus 1426, Rhodes 1440 and 1444, the Indian Ocean fleet of 1505–1509)."
relevance = "Arab galley fleets broke Byzantine control of the eastern Mediterranean, raided Cyprus and carried the conquest of Sicily; without them the caliphate stays a land power."

[[bonus]]
text = "Heavy Cavalry Archer upgrade costs -50%"
kind = "military"
level = 1
change = "new"
precedent = "Heavy Cavalry Archer upgrade available in Castle Age and costs -50% (Khitans)"
basis = "From the Turkish ghilman of Samarra (830s) to the Mamluks, the core of these armies was the armoured horse archer, trained also with lance and sword in the furusiyya of the barracks schools (tibaq) and the training grounds (maydan) of Cairo; manuals such as Taybugha's on archery (c. 1368; Latham and Paterson, 1970) codify the training. These troops beat the Mongols at Ain Jalut (1260) and Homs (1281) (Ayalon; Amitai-Preiss, 1995). The original design had no trace of this, the civ's best-documented military trait."
relevance = "The trained horse archer was the military base of the Abbasid ghilman and of the Mamluk state, which stopped the Mongols; erase it and the Mamluk era makes no sense."

[team_bonus]
text = "Technologies research +25% faster"
level = 1
change = "new"
replaces = "Foot Archers and Skirmishers +2 attack vs. buildings"
precedent = "Technologies research +25% faster (Portuguese team bonus)"
basis = "Arabic was the language through which Greek, Persian and Indian science, and Islamic advances in mathematics, astronomy and medicine, reached the neighbours: the translation movement patronised by the Abbasid caliphs (al-Ma'mun, 813–833; Gutas, 1998), paper made in Baghdad from c. 794 and in al-Andalus by the 12th century, and the Latin translations of Arabic works at Toledo and in Sicily (Gerard of Cremona, d. 1187, translated al-Khwarizmi and Avicenna's Canon). Neighbours researched faster with what the Arabic world passed on."
relevance = "Transmitting science and techniques to Europe and Asia is one of the defining legacies of the Arabic-speaking world, and it benefited neighbours, as RULES 6.2 requires."

[[unique_unit]]
name = "Mamluk"
model = "Kipchak"
building = "Castle"
level = 1
change = "new"
replaces = "Mameluke"
basis = "Mamluks were slave soldiers bought young and trained as the elite of the Ayyubid and Mamluk armies; al-Salih Ayyub's Bahriyya (1240s) and the early Mamluk sultans' troops were mostly Kipchak Turks from the steppe (from 1382 mostly Circassians). They stopped the Mongols at Ain Jalut (1260) and Homs (1281) and took Acre (1291), fighting above all as horse archers trained to shoot rapidly in volleys (Ayalon; Amitai-Preiss, 1995; Latham and Paterson, 1970). The Cuman Kipchak, a horse archer who looses several arrows at once, is the same people and the nearest existing unit; the game's camel-riding Mameluke with a thrown scimitar had the depiction wrong (analysis: ‘wrong’)."
relevance = "The mamluk institution produced the soldiers who ruled Egypt and Syria for 267 years, defeated the Mongols and ended the Crusader states."
contested = "The Kipchak is a light, cheap horse archer, while the royal mamluks were armoured and costly (see the N2 idea). Sharing it with the Cumans is deliberate: the Bahri mamluks and the Cumans were both Kipchaks."

[[unique_tech]]
name = "Counterweights"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Trebuchets and Mangonel-line +15% attack"
level = 1
change = "kept"
precedent = "Counterweights (Trebuchets and Mangonel-line +15% attack) (Saracens)"
basis = "Murda al-Tarsusi's treatise for Saladin (c. 1187) contains one of the earliest clear descriptions of counterweight trebuchets, and the Mamluks massed them against the Crusader fortresses, above all Acre (1291). The technique also travelled east: Muslim engineers sent by the Ilkhan Abaqa built such engines for Kublai at Xiangyang (1273), where they were called huihui pao, ‘Muslim trebuchets’ (a secondary illustration, also used in the Mongols' draft)."
relevance = "Massed siege engines let the Ayyubids and Mamluks take the Crusader fortresses one by one (Margat 1285, Tripoli 1289, Acre 1291) and end the Crusader states."
contested = "A Byzantine origin is argued by Chevedden; extending the effect to the Mangonel-line is a game liberty."

[[unique_tech]]
name = "Bimaristan"
building = "Monastery"
kind = "civil"
age = "Castle"
effect = "Monks passively heal multiple nearby units"
level = 1
change = "changed"
precedent = "Bimaristan (Monks passively heal multiple nearby units) (Saracens): an existing unique tech, moved from the Castle to the Monastery"
basis = "The bimaristan (Persian bimar ‘sick’ + stan ‘place’) was the great Islamic hospital: Dols (1987) places the first in Baghdad in the early 9th century, where al-Razi later practised; Nur al-Din's in Damascus (1154) and Qalawun's al-Mansuri in Cairo (1284–1285), part of a pious foundation with mosque and madrasa, followed with specialised wards and medical teaching. Moved to the Monastery, where the game keeps healing and medicine (Herbal Medicine)."
relevance = "The endowed hospital with medical teaching is a signature institution of Islamic civilisation, the setting of al-Razi's and Ibn al-Nafis's medicine."
contested = "Bimaristans were staffed by physicians and funded by waqf endowments, not run by clergy; tying them to Monks is an abstraction."

[[unique_tech]]
name = "Iqta'"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Knight-line and Cavalry Archers cost -25% gold"
level = 2
change = "new"
precedent = "A new tech copying one effect type: ‘Szlachta Privileges (Knight-line costs -60% gold)’ (Poles) and ‘Ordonnance Companies (Mounted Crossbowmen cost -40% gold)’ (Franks), here at a lower magnitude"
basis = "The iqta' assigned the revenue of a district to a soldier or officer in return for service: introduced on a large scale by the Buyids (946), it paid the cavalry of Saladin and of the Mamluks, whose cadastral surveys (al-Rawk al-Husami, 1298; al-Rawk al-Nasiri, 1313–1325) redistributed the land of Egypt among the sultan, the amirs and their mamluks (Cahen, 1953; al-Maqrizi). Revenue in place of cash pay made the armoured cavalry cheaper for the treasury. No existing unique tech of the civ fits the Town Center, so this is a new tech (level 2)."
relevance = "The iqta' financed the cavalry armies of the Ayyubid and Mamluk states and shaped their politics; without it their military order could not have been paid."

[tree]
add = ["Cavalier", "Shipwright", "Architecture", "Treadmill Crane"]
remove = ["Hand Cannoneer"]

[tree.basis]
"Cavalier" = "Heavy mail-clad cavalry with lance and sword, sometimes on armoured horses (tijfaf), was the core of Ayyubid and Mamluk armies and an important arm of the Fatimids, whose armies also relied on Kutama Berber cavalry, black infantry ('abid) and Turkish and Armenian contingents (Yaacov Lev, State and Society in Fatimid Egypt, 1991). Stopping at the Knight contradicted the civ's best-documented military identity. The Paladin stays out."
"Shipwright" = "Renamed Dar al-Sina'a (see the rename): the state arsenals of Tunis (c. 698), Alexandria and Rawda island at Fustat built the caliphal fleets. Its absence was ironic in a naval civ."
"Architecture" = "Monumental building from the Dome of the Rock (691/692) and the Great Mosque of Damascus (705–715) to Samarra (836–892), al-Azhar (970–972) and Mamluk Cairo (Sultan Hasan, 1356–1363), and military works such as Saladin's Citadel of Cairo (from 1176)."
"Treadmill Crane" = "The analysis lists it with Architecture as a contradiction of the same monumental building programme (Samarra, Fatimid and Mamluk Cairo); the tech only makes Villagers build faster."
"Hand Cannoneer" = "The Mamluks used cannon in sieges from the 1360s (the Bombard Cannon stays), but their cavalry elite despised hand firearms, which were left to a small, low-status arquebusier corps raised only in the sultanate's last years (under al-Ghawri, c. 1510) and recruited outside the mamluk elite (Ayalon, 1956); Ottoman firearms weighed in Marj Dabiq (1516) and Raydaniyya (1517). Removing it also sets the Saracens apart from the Turks."

[[rename]]
from = "Shipwright"
to = "Dar al-Sina'a"
level = 1
basis = "Dār al-ṣināʿa, ‘house of manufacture’, the state naval arsenal (Tunis, Alexandria, Rawda); through Venetian it gave European languages the word ‘arsenal’. The function (a state shipyard that builds ships faster and cheaper) is a real equivalent; the effect is identical."

[[rename]]
from = "Elite Kipchak"
to = "Elite Mamluk"
level = 1
basis = "Follows the unique unit (Kipchak → Mamluk) for the Saracens only."

[architecture]
set = "Middle Eastern"
change = "kept"
basis = "Arab-Islamic building of Syria, Iraq and Egypt (domes, courtyards, minarets) is what the Middle Eastern set represents."

[[dropped]]
item = "Transport Ships +100% HP, +20 carry capacity"
kind = "bonus"
reason = "Relevance test (RULES 6.9): the amphibious expansion it was read as (Cyprus 649, Crete c. 827, Sicily 827–902) belongs to Arab sea power, which the Galley-line bonus and Dar al-Sina'a already carry; sturdier transports are a detail with no referent of their own (analysis: ‘abstraction’)."
