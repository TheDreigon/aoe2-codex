civ = "Varangians"
name = "Swedes"
original_name = "Varangians"
status = "draft"
label = "Cavalry and Naval civilization"
summary = "Varangians renamed Swedes (500–1500): fur-hunting gold and the Jarl stay, the Varangian Guard stays Byzantine, so its bonus and Gothikon leave, Vendel Legacy gives way to Engelbrekt's Rising, Alsnö Stadga becomes the Town Center tech, Swedish iron and copper carry the team bonus, an armed peasantry gets a new passive, and hand guns and printing enter."
ideas = [
  "N2: An armed trading fellowship (félag, named on runestones) as a Market unit that carries gold like a Trade Cart but fights back, for the merchant-warriors of Birka and Gotland.",
  "N2: Kopparberget, a Mining Camp tech for the Falun copper mine (share letter of 1288; Magnus Eriksson's charter of 1347), if the team bonus ever goes to another trait.",
  "N2: A Bridgettine Monastery tech for St Birgitta (d. 1373) and the order of Vadstena (1384), whose houses spread abroad (Syon in England, 1415).",
  "N3: Trading stations of the eastern ventures (Grobiņa, Staraya Ladoga) as Markets that can be built in neutral or enemy territory.",
  "N3: A late Nordic brick-Gothic architecture set (Uppsala, Roskilde), shared with the Danes: creating a set is N3 (RULES 6.15).",
]
contested = [
  "The Normanist debate over the Scandinavian part in the origins of the Rus'. Under RULES section 4 the Rus' civ holds the founding elite and the Kievan state, and the Swedes keep the Scandinavians who stayed Scandinavian (traders, raiders, mercenaries).",
  "Etymology of Rus': usually derived, through Finnish Ruotsi (‘Sweden’), from Old Norse róðr (‘rowing’), the root of the coastal district of Roden (Roslagen); anti-Normanist scholars reject it.",
  "Whether Jordanes' Suehans (Getica 21) are the Svear, as is usually assumed.",
  "Why the Salme dead were abroad: isotope analysis links them to central Sweden (Price et al., Antiquity 90, 2016), but whether they fell on a raid or on an elite or diplomatic voyage is debated.",
  "Whether the Alsnö statute (1279 or 1280) created the secular nobility or regulated a practice already in place.",
  "The free, armed Swedish peasant is also a theme of 19th-century national history (Geijer), and Engelbrekt became a national hero in the same tradition; the peasantry's political weight in the 15th century is real, its idealisation debated. The risings were not peasant affairs alone: nobles and the council soon joined Engelbrekt, and the Stures were magnates who used the peasant levies in their own struggle for the regency.",
  "Jarl: in medieval Sweden a single office of state (Birger Jarl was its last great holder), not a troop type; the Rígsþula, which makes Jarl the ancestor of the nobles, is a West Norse poem of uncertain date (10th–13th century) preserved in Iceland, a literary type rather than Swedish evidence.",
  "Christian I's wound at Brunkeberg (1471): in the Swedish tradition of the battle a shot from the Swedish side struck him in the mouth and broke several of his teeth. The design could cite no contemporary witness that names the weapon; the hook gun (hakebössa) of the usual retelling rests on later Swedish tradition, so the Hand Cannoneer rests on that tradition and on the general spread of handguns in the Sture period.",
]
open_questions = []

[profile]
entity = "The Swedes (Svear and Götar): the Svear kingship of Uppland, the eastern ventures of the Viking Age and the medieval kingdom of Sweden"
region = "The Mälaren region and Uppland, Götaland and, from the 13th century, Finland; with the Viking-age routes across the eastern Baltic (Grobiņa, Salme, Staraya Ladoga) and Gotland in its Viking-age role"
window = "500–1500 (the bounds of the time frame: Vendel-period Uppland to the struggle with the Kalmar Union)"
sources = [
  "Tacitus, Germania 44 (c. 98; background before the window)",
  "Jordanes, Getica (551)",
  "Annales Bertiniani (s.a. 839)",
  "Rimbert, Vita Anskarii (c. 870)",
  "The runestones of Uppland and Södermanland (the Greece and Ingvar stones)",
  "Ibn Khordadbeh, Book of Roads and Kingdoms; Ibn Fadlan, Risala (922)",
  "Rígsþula (a West Norse poem)",
  "The Swedish provincial laws (Upplandslagen, 1296; Södermannalagen), ed. and trans. Å. Holmbäck and E. Wessén, Svenska landskapslagar (1933–1946); Magnus Eriksson's Landslag (c. 1350)",
  "Erikskrönikan (c. 1320s–1330s); Engelbrektskrönikan (1430s, later part of the Karlskrönikan); Sturekrönikan (the rhymed Sture Chronicle)",
  "T. D. Price et al., ‘Isotopic provenancing of the Salme ship burials in Pre-Viking Age Estonia’, Antiquity 90 (2016)",
  "Simon Franklin and Jonathan Shepard, The Emergence of Rus 750–1200 (1996)",
  "Knut Helle (ed.), The Cambridge History of Scandinavia, vol. 1 (2003)",
  "Philip Line, Kingship and State Formation in Sweden, 1130–1290 (2007)",
]
replaces = "Varangians (the Greek, Rus' and Arab name for Scandinavians abroad, mixing Vendel-period Sweden, the Rus' and the Byzantine Guard)"

[[bonus]]
text = "Hunting also generates gold"
kind = "economic"
level = 1
change = "changed"
replaces = "Shepherding, fishing, and hunting also generate gold"
precedent = "Shepherding, fishing, and hunting also generate gold (Varangians): the hunting part only (RULES section 5)"
basis = "Jordanes (Getica 21, 551) already knew the Suehans as the people who sent dark furs to the Romans through many other peoples. In the Viking Age furs from the northern forests, hunted or taken from Finnic and Sami neighbours, bought the Islamic silver of the eastern trade (Ibn Khordadbeh; Ibn Fadlan), whose dirhams fill the hoards of the Mälaren region and Gotland (Spillings, c. 870s, some 14,000 coins). Slaves, the other staple of that trade, are not represented. Shepherding passes to the Castilians (the Mesta) and fishing to the Norwegians (stockfish) and the Tamils (pearl fishing); hunting is shared with the Rus', whose fur trade grew out of the same eastern routes (RULES 6.7)."
relevance = "Furs were the Svear's export from Jordanes' day to the Hanse, and the silver they bought made Viking-age Uppland rich, and Gotland through its own trade."
contested = "The bonus abstracts furs bought or taken as tribute from forest peoples as much as furs hunted by Swedes."

[[bonus]]
text = "Bloodlines and Caravan effects +50%"
kind = "other"
level = 1
change = "kept"
precedent = "Bloodlines and Caravan effects +50% (Varangians)"
basis = "Horses: Jordanes says the Suehans ‘like the Thuringians, use excellent horses’ (Getica 21), and the boat graves of Vendel and Valsgärde (c. 550–800) hold the horses, riding gear and helmets of a mounted elite, the warrior aristocracy of the formative age of the Svear kingship. Routes: Birka on Lake Mälaren (c. 750–975) and the Scandinavian stations of the east (Grobiņa in Courland, Staraya Ladoga) linked Sweden to the Volga and Dnieper trade; in 839 the Rhos who reached the Frankish court from Constantinople turned out to be ‘of the people of the Swedes’ (Annales Bertiniani)."
relevance = "A horse-owning aristocracy and the eastern trade routes are the two foundations of early Swedish wealth and power."

[[bonus]]
text = "Longships attack +15% faster"
kind = "military"
level = 1
change = "changed"
replaces = "Longships and Catapult Galleons attack +15% faster"
precedent = "Longships and Catapult Galleons attack +15% faster (Varangians): Longships only"
basis = "The ship burials of Salme on Saaremaa (c. 750) hold over forty men who died abroad, perhaps on a raid, whom isotope analysis links to central Sweden (Price et al. 2016); some 26 runestones remember the men lost with Ingvar's fleet in the east (c. 1041); and the coast of Uppland was organised in ship districts for the levy (the Roden, later Roslagen; Upplandslagen, 1296). Tacitus' Suiones ‘strong in fleets’ (Germania 44, c. 98) are background, four centuries before the window. Navy tier (RULES 6.16.1): a fleet of ships, the clinker-built warships of Salme, the ledung and the later royal fleet. The game's gap of the Varangians, no demolition ships, is kept, the Longship covering the anti-building role, and the Galleon is a flagged abstraction (RULES 6.16.2). Catapult Galleons are dropped: no ship-borne catapults are known in Scandinavian fleets."
relevance = "The Svear's expansion to the east, from Grobiņa and Salme to Ingvar's expedition, was carried by oared warships."

[[bonus]]
text = "Villagers affected by Infantry Blacksmith upgrades starting in Castle Age"
kind = "other"
level = 1
change = "new"
precedent = "Villagers affected by Infantry Blacksmith upgrades starting in Castle Age (Incas)"
basis = "Sweden's peasants stayed free and armed. The provincial laws tied the right and duty to bear the ‘people's weapons’ (folkvapn) to free status, and the levy rested on them: in the ledung of Svealand each hamna, the oar-place unit of the ship district (skeppslag), armed the man it sent to the levy fleet (Upplandslagen; Södermannalagen; Holmbäck and Wessén, Svenska landskapslagar). Villagers who share the infantry's armour render a peasantry that kept its own weapons and could go to war; the risings in which it did so are rendered by Engelbrekt's Rising."
relevance = "An armed, free peasantry with a voice of its own set medieval Sweden apart from most of Europe and made the peasant armies of the 15th century possible; it is a defining trait of medieval Sweden."
contested = "The image of the free, armed peasant also owes much to 19th-century national history (see the civ-level notes)."

[team_bonus]
text = "Blacksmiths work +80% faster"
level = 1
change = "new"
replaces = "Knight-line +1 attack vs. Infantry"
precedent = "Blacksmiths work +80% faster (Bulgarians team bonus, which the Bulgarians' design replaces)"
basis = "Swedish iron and copper supplied the smiths of the Baltic: the osmund iron of Bergslagen, smelted in some of Europe's earliest blast furnaces (Lapphyttan, 12th–14th centuries), and the copper of the Stora Kopparberg at Falun (first recorded in a share letter of 1288; chartered by Magnus Eriksson in 1347) were shipped through Stockholm to Lübeck and the other Hanse towns. Faster allied blacksmiths render the metal Sweden sold to its neighbours (RULES 6.2: trade). The replaced team bonus had no historical basis; the Goths' design reuses its effect as a passive."
relevance = "Copper and iron were medieval Sweden's chief exports and its bond with the Hanse."

[[unique_unit]]
name = "Jarl"
model = "Jarl"
building = "Castle"
level = 1
change = "kept"
basis = "The mounted aristocracy of the medieval kingdom: the knights and squires of the Erikskrönikan (c. 1320s–1330s), the frälse who served the crown on horseback under the Alsnö statute. The name follows the Rígsþula, a West Norse poem, whose Jarl, ancestor of the nobles, learns to ride, bend the bow and throw the spear; and jarl was the title of the realm's first officer, held by Birger Jarl (1248–1266), who founded Stockholm (first named in 1252). The reach of its attack renders the lance."
relevance = "Mounted aristocrats led Swedish war and politics from the Vendel chieftains to the frälse nobility, and Birger Jarl is one of the best-known figures of medieval Sweden."
contested = "Jarl was an office rather than a troop type or a class (see the civ-level notes). The game's name is kept for its fame and for the Rígsþula's Jarl; a name after the mounted frälse (for example ‘Frälseman’) would be more literal but is a modern coinage."

[[unique_tech]]
name = "Alsnö Stadga"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Knight-line costs -60% gold"
level = 1
change = "new"
precedent = "Szlachta Privileges (Knight-line costs -60% gold) (Poles): shared and renamed, identical effect and age (Castle Age, as in the game). The Poles' design also moves Szlachta Privileges to the Town Center, so the two civs share effect and building on purpose (RULES 6.7), and the Lithuanians' Horodło (Boyars cost -40% gold) is a third rendering of privileges for mounted service."
basis = "At Alsnö (1279 or 1280) King Magnus Ladulås exempted from taxes everyone who served the crown with a war horse (rusttjänst), creating the secular frälse, the Swedish nobility, and forbade the great men's forced hospitality (gästning) on the peasants, the protection traditionally linked to his byname Ladulås, ‘barn-lock’. Cheaper knights render mounted service paid for by tax exemption, as with the Polish privileges. A royal statute on taxation and estates, so at the Town Center (RULES 6.2); the earlier of the civ's two datable moments, so the Castle Age tech."
relevance = "The statute made the Swedish nobility a tax-exempt mounted estate, the frame of Swedish society for the rest of the Middle Ages."
contested = "Its date, and whether it created the nobility or regulated an existing practice (see the civ-level notes)."

[[unique_tech]]
name = "Engelbrekt's Rising"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Barracks work +100% faster"
level = 1
change = "new"
replaces = "Vendel Legacy (Knight-line deals trample damage)"
precedent = "Perfusion (Barracks work +100% faster) (Goths): an existing unique tech, shared and renamed with an identical effect, at the Castle in the Imperial Age as in the game; the Goths' design drops Perfusion"
basis = "The peasant armies of the 15th century decided Sweden's struggle with the Kalmar kings. In the summer of 1434 the mine owner Engelbrekt Engelbrektsson led the miners and peasants of Bergslagen and Dalarna against Erik of Pomerania's bailiffs; within a few months the rising had spread across Svealand and Götaland and taken most of the royal castles, and in January 1435 an assembly at Arboga made Engelbrekt captain of the realm (rikshövitsman), before his murder in 1436 (Engelbrektskrönikan). A generation later the regent Sten Sture the Elder called out the peasant levies again and, with the burghers of Stockholm and the horsemen of his noble allies, routed Christian I's army at Brunkeberg outside Stockholm (10 October 1471), a victory commemorated by the St George group in Stockholm's great church, commonly attributed to Bernt Notke (1489). Barracks that work twice as fast render levies of armed peasants called out within weeks. A military moment, so at the Castle (RULES 6.2); the later of the civ's two datable moments, so the Imperial Age tech."
relevance = "The risings of 1434–1471 broke the Kalmar kings' hold on Sweden, gave the peasantry a political voice, and made Engelbrekt and Brunkeberg central memories of the struggle for Swedish self-rule, cultivated by the regents themselves (the Karlskrönikan; the St George group that Sten Sture commissioned for Brunkeberg)."
contested = "How far the risings were the peasants' own and how national they were is debated (see the civ-level notes)."

[tree]
add = ["Champion", "Arbalester", "Keep", "Gold Shaft Mining", "Sanctity", "Hand Cannoneer", "Block Printing"]
remove = ["Varangian Guard", "Elite Varangian Guard", "Hussar", "Mounted Crossbowman", "Heavy Mounted Crossbowman", "Cranequins", "Incendiaries", "Siphons", "Catapult Galleon"]

[tree.basis]
"Champion" = "Substitute for the removed Varangian Guard as heavy infantry (RULES 6.11); the top swordsman tier is a generic abstraction."
"Arbalester" = "The crossbow was the common missile weapon of 14th–15th-century Scandinavian warfare, in castle garrisons and in the armies of the Union wars; lacking the top tier was incoherent for a civ whose window runs to 1500 (RULES 6.16.3)."
"Keep" = "Stone castles of the medieval kingdom: Stockholm (from the 1250s), Kalmar, Stegeborg and Nyköpingshus, scene of the Nyköping Banquet (1317); Engelbrekt's men took the royal castles in 1434–1436."
"Gold Shaft Mining" = "Sweden's medieval mines: the copper of Falun (Stora Kopparberg, first recorded in 1288) and the iron of Bergslagen, whose miners rose with Engelbrekt in 1434."
"Sanctity" = "The cults of St Erik (king, d. 1160) at Uppsala and of St Birgitta (d. 1373, canonised 1391), whose order was founded at Vadstena (consecrated 1384)."
"Hand Cannoneer" = "The unit stands for the handguns of the Sture armies. Firearms were in Swedish hands by the Sture period: in the Swedish tradition of Brunkeberg (1471), a battle the rhymed Sture Chronicle narrates, a shot from the Swedish side struck Christian I in the mouth and broke several of his teeth, the weapon, a hook gun (hakebössa) in the usual retelling, resting on later tradition (see contested). Under RULES 6.16.19(d) the tree follows the represented period, and the struggle with the Union kings to 1500 is part of it, so the Imperial Age unit enters. Further gun items (Bombard Cannon, Bombard Tower, Cannon Galleon) are left out: the Swedish cases weighed for them, the defence of Vyborg against the Muscovite siege of 1495 under Knut Posse and the Swedish storming of Ivangorod (1496), could not be tied to documented Swedish guns in this design. The Danes' guns rest on cases of 1495–1500, and the Norwegians, whose window ends in 1469, have none."
"Block Printing" = "Johann Snell printed the first book in Sweden at Stockholm, the Dialogus creaturarum (dated 20 December 1483), and then the Missale Upsalense for the archbishop of Uppsala (1484). The same printing-date test keeps Block Printing for the Danes, for whom Snell had printed at Odense in 1482, and removes it from the Norwegians (to 1469) and the Rus' (to 1505)."
"Varangian Guard" = "The Varangian Guard stays with the Byzantines (RULES section 4): it was an institution of the Byzantine state, though some thirty runestones, most of them in Uppland, name Swedes who went to or died in ‘Greece’. The Champion takes over its heavy infantry role."
"Elite Varangian Guard" = "Same as the Varangian Guard."
"Hussar" = "Hungarian and Serbian light cavalry of the 15th century, a type medieval Sweden never fielded; Light Cavalry stays as its top light cavalry."
"Mounted Crossbowman" = "Shared basis (level-1 review, section 3.2): the Mounted Crossbowman line stays only where shooting from the saddle is documented. No Swedish mounted crossbowmen shooting from the saddle are recorded; Swedish crossbowmen are represented by the Arbalester, and the Danes' and Norwegians' designs drop the line on the same test."
"Heavy Mounted Crossbowman" = "As for the Mounted Crossbowman, and later still (15th century)."
"Cranequins" = "A 15th-century spanning device for the mounted crossbow line, which the Swedes no longer have."
"Incendiaries" = "Requires Siphons, which this design removes."
"Siphons" = "The fire siphon was a Byzantine state secret never to be given to other nations (De Administrando Imperio 13)."
"Catapult Galleon" = "No ship-borne catapults are known in Scandinavian fleets; the Longship (strong vs buildings) keeps the anti-building naval role, as for the Norwegians and Danes."

[architecture]
set = "Northern European"
change = "kept"
basis = "The set the Viking Sagas expansion gave the Danes, Varangians and Vikings according to its official FAQ (not recorded in the repository data): its timber halls and clinker ships fit Uppland, Birka and Sigtuna. The brick Gothic of the later kingdom (Uppsala Cathedral, consecrated 1435) fits it less well; historical fit decides (RULES 6.16.8), and the set is kept because it fits the larger part of the window. A late Nordic brick-Gothic set is an N3 idea, since creating a set is N3 (RULES 6.15)."

[[dropped]]
item = "Varangian Guards attack +25% faster and generate +50% gold"
kind = "bonus"
reason = "The Varangian Guard stays with the Byzantines (RULES section 4), so the bonus has no unit; its basis (the guardsmen's wealth in Haralds saga harðráða) concerned the Byzantine institution and a Norwegian prince. Its slot goes to the armed-peasantry passive."

[[dropped]]
item = "Gothikon (Varangian Guards throw axes periodically)"
kind = "unique_tech"
reason = "The Gothikon was a Christmas court performance by members of the circus factions dressed as ‘Goths’ (De Ceremoniis I.83), unrelated to the Varangians, and axe-throwing has no source; it also applied to the Varangian Guard, which stays Byzantine."

[[dropped]]
item = "Vendel Legacy (Knight-line deals trample damage)"
kind = "unique_tech"
reason = "It named a period, not a reform: the riders riding down a fallen foe on the helmet plates of Vendel and Valsgärde (from c. 550) are display art on a motif taken from Roman cavalry tombstones, not evidence of shock tactics. The Castle slot goes to a datable military moment, Engelbrekt's Rising (1434–1471), the Vendel horses stay in the Bloodlines bonus, and the trample goes to the Rus' Druzhina, the mounted retinue it renders better (the owner's decision)."
