replaces = "Huns (Attila's empire, c. 370–469, before the game's time frame)"

[[bonus]]
text = "Do not need houses, but start with -100 wood"
kind = "economic"
level = 1
change = "kept"
precedent = "Do not need houses, but start with -100 wood (Huns)"
basis = "The Avar elite lived in felt tents and wagons: the Strategikon (I.2) recommends Avar-type tents for Roman cavalry squads, for their practicality and good appearance (G. T. Dennis glosses them as round and roomy), and the khagan's seat, which the Franks called the Ring (hring), was a fortified enclosure rather than a town (Royal Frankish Annals 795–796; Pohl 2018)."
relevance = "For two centuries the khaganate was ruled by a mounted, tent-dwelling steppe aristocracy, the trait that set it apart from its Roman, Frankish and Lombard neighbours."
contested = "Middle and Late Avar cemeteries and villages show a growing settled population, much of it Slavic or mixed; the bonus reflects the nomadic ruling elite."

[[bonus]]
text = "Cavalry Archers cost -10/20% in Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Cavalry Archers cost -10/20% in Castle/Imperial Age (Huns)"
basis = "Horse archery was the core of Avar warfare: the Strategikon (XI.2) says the Avars train above all in archery on horseback and go into battle with the lance on the shoulder and the bow in the hand, and the bone stiffeners of reflex bows are common finds in Avar warrior graves of the Carpathian Basin (Pohl 2018)."
relevance = "The mounted archer was the Avar army; Maurice wrote his chapter on the Avars to teach Roman cavalry how to meet it."

[[bonus]]
text = "Traction Trebuchets cost -25%"
kind = "military"
level = 1
change = "changed"
replaces = "Trebuchets fire more accurately at units and small targets"
precedent = "Traction Trebuchets and Lou Chuans cost -25% (Wei), narrowed to the Traction Trebuchet, so level 1 (RULES section 5, narrowing). It replaces the Huns' accuracy bonus for the counterweight Trebuchet, which the Avars could not have had (RULES section 4)."
basis = "The owner's trebuchet bonus (RULES section 4), moved to the engine the Avars actually used and given the effect the sources support: the counterweight Trebuchet is a late-12th-century weapon, four centuries after the khaganate, and what the sources stress about the Avar engines is their number and the size of their stones, not their aim (S. McCotter, Byzantines, Avars and the Introduction of the Trebuchet, 2003). The Avars set traction artillery against the Empire's cities in numbers: Archbishop John describes the many rope-pulled stone-throwers (petroboloi) of the Avar-Slav siege of Thessalonica (586 or 597; Miracles of St Demetrius I), the first clear description of the traction trebuchet in the Mediterranean world; the khagan besieged Thessalonica again for 33 days with engines (c. 617/618; Miracles II); and before Constantinople in 626 he set up stone-throwers, hide-covered siege towers and armoured shelters, with a mass of Slav foot and dugouts (Chronicon Paschale; Theodore Synkellos). Cheaper engines render that mass of artillery."
relevance = "Traction artillery brought in numbers made the khaganate the first steppe power known to set such engines against the Empire's cities, Thessalonica and Constantinople."
contested = "Archbishop John is read (McCotter 2003) as contrasting the inaccurate Avar engines with the Roman torsion artillery; the bonus therefore lowers the engines' cost rather than raising their accuracy. Theophylact's story of Busas, who is said to have taught the Avars to build a siege engine, is not used (civ-level contested list)."

[[bonus]]
text = "Spearman-line and Skirmishers +1/+2 pierce armor in Castle/Imperial Age"
kind = "military"
level = 1
change = "new"
precedent = "Spearman-line: Barracks Units +1/+2/+3 pierce armor in Feudal/Castle/Imperial Age (Malians), narrowed to the Spearman-line at a lower magnitude and a later age. Skirmishers, which are Archery Range units outside the Malian bonus: for the Castle Age step, Padded Archer Armor (Ranged Soldiers +1 melee/+1 pierce armor, a Feudal Age tech), narrowed to the Skirmishers' pierce armour; for the Imperial Age step, Tower Shields (Spearman-line and Skirmishers +2 pierce armor; Lithuanians, whose design drops it), at its game age. Each step keeps the game's age or a later one (RULES section 5, narrowing; 6.16.11)."
basis = "The Slav subjects were the khaganate's foot. Fredegar (IV.48) says the Wends had long been befulci of the “Huns”: in battle the Slavs fought in front while the Avars waited by their camp, taking the booty if the Slavs won and coming to their aid if they gave way; the Strategikon (XI.4) arms the Slavs with two short javelins each, some also with strong but heavy shields, and with bows; Slav levies also manned the dugouts at Constantinople in 626 (Chronicon Paschale). Slav levies armed with javelins, some with shields, thus screened and supported the Avar host; the pierce armour stands for those shields. A standing social relationship rather than a datable reform, so a passive bonus (RULES 6.2)."
relevance = "A large share of the khaganate's people were Slavs; their levies fought in its battles and manned its boats, and their revolt under Samo (623/624) shrank it."
contested = "The meaning of befulci and the share of Slavs in the khaganate are debated (civ-level contested list); Fredegar's picture is one-sided (Pohl 2018)."

[team_bonus]
text = "Stables work +20% faster"
level = 1
change = "kept"
precedent = "Stables work +20% faster (Huns)"
basis = "Roman cavalry was partly re-equipped on the Avar model: the Strategikon (I.2, c. 600) prescribes cavalry lances of the Avar type, with leather thongs in the middle of the shaft and with pennons, breast and neck coverings for the horses “such as the Avars use”, tunics cut on the Avar pattern and Avar-type tents, and the same chapter, without naming the Avars, gives the first European mention of iron stirrups, which archaeology links to them. RULES 6.2: a transferred technique. The Avars' own herds and horse burials are not the basis, since they benefited only the Avars."
relevance = "The Avar horse-and-rider kit, probably including the stirrup, is the khaganate's most lasting legacy to the cavalry of its neighbours."
contested = "The dating of the earliest Avar-age stirrups (Curta 2008) and the military weight of the stirrup; the Strategikon does not call the stirrups Avar."

[[unique_unit]]
name = "Tarkan"
model = "Tarkan"
building = "Castle"
level = 1
change = "kept"
basis = "The armoured Avar nobility: the Strategikon (XI.2) says that the Avars wear mail and that the horses of their illustrious men are covered in front with iron or felt; these leaders headed the raids and sacks of Balkan and Italian towns. Tarkhan, a title of the Göktürks, Khazars and Bulgars (of disputed Turkic or East Iranian origin), is counted among the Avar titles known from the written sources (Pohl 2018); its function among the Avars is unknown, but it fits them far better than Attila's Huns, in whose world it is not attested."
relevance = "The armoured mounted nobility, lancers and archers at once, was the striking arm of the khaganate and the model the Romans copied."
contested = "The function of the Avar tarkhan is unknown, and the anti-building role is an abstraction: most Avar conquests fell to blockade, engines and Slavic foot (Sirmium, 579/580–582) rather than to cavalry."

[[unique_tech]]
name = "Marauders"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Tarkans can be trained at Stables"
level = 1
change = "kept"
precedent = "Marauders: Tarkans can be trained at Stables (Huns)"
basis = "Large-scale raiding was the khaganate's lever on its neighbours: after taking Sirmium (582) the khagan sacked Singidunum, Viminacium and Anchialus (583–584); Avar hosts repeatedly struck Moesia and Thrace (583–587, 592–599), invaded Friuli c. 610, taking Cividale (Paul the Deacon IV.37), and ravaged Thrace again around 619–623, with both the armoured elite and the general host. Training the elite horse at ordinary Stables stands for that scale. Raiding was a long tradition, a structural trait that RULES 6.2 would make a passive, so Marauders keeps the Castle slot as a flagged fallback (RULES 6.16.19(b)). Decision: the khaganate's one clearly datable military moment, the adoption of siege engines in the 580s or 590s, stays with the trebuchet passive that RULES section 4 sets, rather than becoming an Imperial Age Castle tech (a ‘Petroboloi’ carrying the engine effect) with Marauders' effect turned into a passive."
relevance = "Raids forced the Empire to pay and raise its tribute (574–623) and brought in the captives the khagans ransomed."

[[unique_tech]]
name = "Byzantine Tribute"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "All gold income +10% faster"
level = 2
change = "new"
precedent = "Grand Trunk Road (All gold income +10% faster; Market trading fee reduced to 10%) (Hindustanis), first effect only: a new tech (level 2), since the market-fee half has no Avar basis. The same new tech is the Bulgarians' Peace of 927, the Danes' Øresundstold and the Arabs' Dinar (Abd al-Malik's coinage reform), all at the Town Center, and the Byzantines' design has the effect as a passive; each rests on its own payments, and the reuse is accepted in N1 (RULES 6.7, 6.16.12)."
basis = "Byzantine gold was the khaganate's main revenue. After defeating the future Tiberius II the Avars obtained 80,000 solidi a year (574, attested by 578; Menander); Sirmium surrendered in 582 after a three-year blockade, and the treaty restored the 80,000-solidi tribute with its arrears (Menander); it rose to 100,000 in 584/585, to 120,000 around 598–600 and to 200,000 by 623/624 (Howard-Johnston 2021). The gold shows in the Byzantine solidi of Early Avar graves, and when payments stopped after 626 the khaganate entered a crisis (Pohl 2018); a numismatic study finds them resumed on a smaller scale in the 680s (Zapolska 2017). Tribute was a structural economic base, formalised by the treaty of 574 and renewed by later treaties, so it is promoted to the Town Center tech under RULES 6.3. The name follows the project's Byzantines; the payers called themselves Romans (Rhomaioi), as the site notes."
relevance = "Tribute paid for the khagan's power and his followers' loyalty; its end after 626 marks the turning point of Avar history."
contested = "Tribute figures and dates vary between sources (see the civ-level contested list); ransoms and plunder added to it."

[tree]
add = ["Traction Trebuchet", "Steppe Lancer", "Elite Steppe Lancer"]
remove = ["Trebuchet", "Dromon", "Galleon", "Galleon, Fast Fire Ship and Carrack"]

[tree.basis]
"Traction Trebuchet" = "The rope-pulled engine of the Avar sieges of Thessalonica (586 or 597; c. 617/618) and Constantinople (626); it replaces the counterweight Trebuchet as the Avars' heavy siege weapon (RULES 6.11), as it does for the out-of-scope Three Kingdoms, under the traction test (RULES 6.16.5), and carries the cost bonus. Trained at the Siege Workshop in the Imperial Age."
"Steppe Lancer" = "The Strategikon (XI.2) describes most Avar riders as doubly armed, the lance slung on the shoulder and the bow in the hand; the regional lancer unit (RULES 6.1) stands for the lance-armed riders of the host."
"Elite Steppe Lancer" = "Upgrade of the Steppe Lancer: the warriors of the host wore mail (Strategikon XI.2); the leaders on armoured horses belong to the Tarkan."
"Trebuchet" = "The counterweight trebuchet appears only in the late 12th century, four centuries after the khaganate; replaced by the Traction Trebuchet."
"Dromon" = "A Byzantine warship, the type of the imperial fleet that destroyed the khagan's dugouts in the Golden Horn in 626 (Chronicon Paschale); the Avars never had one, and their navy is the boat tier (see Galleon)."
"Galleon" = "Navy tier (RULES 6.16.1): the boat tier. It rests on the Slav dugouts (monoxyla) of the khagan's assault on the Golden Horn in 626, manned by the khaganate's Slav levies (Chronicon Paschale; see the Slav-levy passive), and on the khaganate's river boats; the ships that Lombard shipwrights, sent by King Agilulf, built for the khagan, who then took an island in Thrace (Paul the Deacon IV.20), are a single episode and do not make a fleet of ships. The boat tier keeps the generic Galley line, on the canoe model of the Slav dugouts (see the renames), and the Fire Ship, Demolition and Hulk lines as the game gives the Huns, as an abstraction for water maps, and removes the high-seas sailing warships: the Galleon here, the Huns already lacking the Carrack and the Fast Fire Ship."
"Galleon, Fast Fire Ship and Carrack" = "Nothing is left for this upgrade once the Galleon is removed (the Huns already lacked the Fast Fire Ship and the Carrack)."

[[rename]]
from = "Galley"
to = "Canoe"
model = "Canoe"
level = 1
basis = "The boat tier rests on dugouts (see the Galleon): before Constantinople in 626 the khagan launched Slav dugouts (monoxyla, ‘single-trunk’ boats), manned by the Slav levies, on the Golden Horn, where the imperial fleet destroyed them (Chronicon Paschale; Theodore Synkellos). The Scenario Editor Canoe (RULES section 5; codex/tools/scenario-units.md), a light boat that shoots arrows like the Galley, gives the Galley the look of a dugout, which fits the boat tier far better than a Mediterranean galley, the type of the fleet that sank the monoxyla; the Galley keeps its stats, and the Canoe's look (its crew included), scale, attack and role must be checked in game. Same rename as in the Aztec, Malian, Mapuche, Maya and Tupi designs. The sources' word, monoxylon, is the Byzantines' Greek, and no Slav or Avar word for the boats is recorded in the window, so the generic English name of those renames goes with the look."

[[rename]]
from = "War Galley"
to = "War Canoe"
model = "Canoe"
level = 1
basis = "Upgrade tier of the renamed Galley, with the same Canoe look (see Galley)."

[architecture]
set = "Eastern European"
level = 1
change = "changed"
replaces = "Central European"
basis = "A stopgap until an N3 Steppe set exists (RULES 6.15, 6.16.8): much of the khaganate's population lived in villages of sunken huts much like those of their Slavic neighbours, and no Avar stone towns are known (Pohl 2018). The Central European set had no Avar or Hunnic basis."

[[dropped]]
item = "On Nomadic maps, the first Town Center spawns a scouting Horse"
kind = "bonus"
reason = "Fails the relevance test (RULES 6.9): a trivial, map-specific effect with no particular Avar content; the horse theme is carried by the team bonus, the Steppe Lancer and the Tarkan."

[[dropped]]
item = "Atheism"
kind = "unique_tech"
reason = "Enemy Relics generate -50% resources; Wonder and Relic victory takes +100 years. Wrong for Huns and Avars alike: in 579/580 the khagan Bayan swore in the Avar manner over a drawn sword before swearing on the Gospels (Menander), and Avar graves show a rich pagan funerary cult (Pohl 2018). Its slot goes to the Byzantine Tribute tech."
