civ = "Persians"
name = "Persians"
status = "draft"
label = "Cavalry and Archer civilization"
summary = "Persians as Iran from the late Sasanians to the Timurids (500–1507): qanat farming and fast-shooting archers become passives, Khosrow I's land tax the Town Center tech Kharaj and Persian learning the team bonus; gunpowder leaves and the architecture becomes Central Asian."
ideas = [
  "N2: A Daylamite with its own model (sword, javelins and shield; Procopius, Wars VIII.14; the founders of the Buyid dynasty), instead of the Saxon Hearth Troop's graphic offered for N1 (see open questions).",
  "N2: Persian archery as Procopius (Wars I.18) and the Strategikon (XI.1: rapid but not powerful) describe it: Archer-line attacks faster with -1 attack (a negative attack effect does not exist in the game).",
  "N2: A ‘Wall of Gorgan’ technology: Stone Walls and towers +20% HP and built faster (Sauer et al., 2013).",
  "N2: Asvaran who both shoot and charge, using the Ratha's mode switch on a heavy cavalry graphic.",
  "N3: A Timurid variant of the Persians, or a Timurid civ carved out of their window (1370–1507), with the Flaming Camel and Timurid Siegecraft, which the Tatars' draft drops. In N1 the Persians, who carry the Timurids as rulers of Iran, leave out the Flaming Camel, a one-battle stratagem (Delhi, 1398) reported in Timurid and later narratives whose earliest attestation is uncertain, too slight for a unique unit; Timurid Siegecraft, for Timur's sieges (Herat 1381, Urgench 1388, Baghdad 1401, Smyrna 1402), is put to the owner (see open questions). The Persianate Timurid phase, the Herat of Shahrukh and Husayn Bayqara, also shows in the architecture.",
  "N3: Split late antique Sasanian Iran and Islamic Persianate Iran into two civs; a Safavid civ (1501–1736) would carry the qizilbash and the firearms adopted after Chaldiran.",
]
contested = [
  "Dating and attribution of the Wall of Gorgan (5th or 6th century; Sauer et al., 2013, favour the 5th).",
  "Tactical weight of the Sasanian elephants: a decisive arm or mainly prestige.",
  "End of the Sasanian empire: Qadisiyya (636/637), Nahavand (642) or the death of Yazdegerd III near Merv (651); regional resistance (Tabaristan) lasted into the 8th century.",
  "Procopius' comparisons of Roman and Persian archery serve his praise of Belisarius' army and may be biased.",
  "Pre-Islamic or Islamic origin of the caravanserai; the dating of the road stations attributed to the Sasanians.",
  "Including Persianate dynasties of Turkic and Mongol origin (Ghaznavids, Great Seljuks, Ilkhanids, Timurids, the Turkmen Qara Qoyunlu and Aq Qoyunlu) in ‘Persians’ is a choice: they ruled Iran and Khorasan and patronised Persian letters, administration and building, but were not Persians. This civ carries them as rulers of Iran; the Turks carry the Seljuk conquest of Anatolia and the sultanate of Rum, the Mongols the Ilkhanate as a Mongol state, and the Hindustanis the Ghaznavids' Indian campaigns. In Iraq the Abbasid caliphate belongs to the Saracens; the Buyid and Seljuk sultans who ruled Baghdad in its name (945 to the 1150s, when the caliphs regained it) are counted here.",
  "The character of Sasanian religious policy: a Zoroastrian state church persecuting apostates, or an empire that integrated the Church of the East (Richard Payne, A State of Mixture, 2015).",
  "Firearms in Iran before 1507: light guns are reported for the Timurids and the Aq Qoyunlu, but the evidence is thin; Iranian armies adopted firearms on a large scale only under the Safavids after Chaldiran (1514), and why Ismail I's army fought there without significant firearms (supply or the qizilbash's contempt for guns) is debated.",
  "Crossbows in Iranian armies: the charkh is described in Persian military writing of the Ghaznavid–Ghurid tradition (Fakhr-i Mudabbir, early 13th century), but that manual was written for the Delhi sultan Iltutmish, on the Hindustanis' side of the Ghaznavid split, and battle accounts say little about the weapon, so how common it was in Iran is unclear.",
  "How far camels served Iranian armies as mounts in battle rather than as baggage animals: the regional analysis sees them as mainly logistic, the tech-tree audit rates the Camel Rider plausible for Iran. The Camel Rider and Heavy Camel Rider stay as a regional abstraction.",
]
open_questions = [
  "Kamandaran is dropped: under RULES 6.3 a unique tech needs a datable moment, and Persian mass archery is a structural trait now carried by the archer passive. Restore it as a third tech at the Archery Range anyway?",
  "Gunpowder (scope): Hand Cannoneer, Bombard Cannon and both Cannon Galleons are removed, because the window ends with the Timurids (1507) and Iranian firearms became common only under the Safavids after Chaldiran (1514). Alternative: extend the window to Ismail I (to 1524), add the early Safavids to the entity and restore the Hand Cannoneer as the civ's one late element (RULES section 2 allows only one, in the Imperial Age), with a note on how thin Safavid firearms were before 1514.",
  "The Town Center bonus is the Persians' best-known feature, replaced here as stretched. Keep it instead of the archer bonus?",
  "Daylamites: Two-Handed Swordsman and Champion stay out (the Sasanian peasant infantry had low status), but the Daylamites (sword, shield and javelins; Procopius, Wars VIII.14; the founders of the Buyid dynasty) would justify an infantry unit. The nearest N1 option is the Saxon Hearth Troop renamed ‘Daylamite’ (it throws a javelin before melee and is strong against ranged units), which needs one of the two unique-unit slots (War Elephant or Savar) or an exception to the cap; the out-of-scope Romans' Legionary is a second choice (no javelins). Take one?",
  "A fifth passive for the frontier walls of Gorgan, Tammisha and Derbent: ‘Walls and Watch Tower-line +30% HP’ (precedent: Great Wall, Chinese)? Not added: Keep, Fortified Wall, Arrowslits and Citadels already carry the fortification theme.",
  "Team bonus: re-based on Persian learning passed to neighbours with ‘Universities work +80% faster’, which the Chinese, Franks, Khmer, Malians and Poles also use as their team bonus (and the Georgians' Gelati Academy contains); the repetition itself is codex-wide question CQ11 (see codex/civs/README.md). Keep it, use ‘Monasteries work +20% faster’ instead for religious influence (the Church of the East's missions from Sasanian Iran, whose churches the Tang called ‘Persian temples’ until 745, and the Persian Sufis of India and Anatolia), or keep the original ‘Knight-line +2 attack vs. Ranged Soldiers’ as an exception, although its benefit to allies is weak?",
  "Codex-wide question CQ11 (see codex/civs/README.md): reuse and stacking (here Kharaj, which is Burgundian Vineyards, shared with five other designs).",
  "Codex-wide question CQ24 (see codex/civs/README.md): Timur's siege warfare (Timurid Siegecraft, Trebuchets +2 range, has no holder: the Tatars drop it, and this civ carries the Timurids).",
  "Codex-wide question CQ19 (see codex/civs/README.md): labels (here ‘Cavalry and Archer’ for ‘Cavalry’).",
]

[profile]
entity = "Iran (Ērānshahr): the late Sasanian Empire and the Persian-speaking and Persianate states of Islamic Iran and Khorasan, from the Samanids, Buyids and Ghaznavids through the Great Seljuks and Ilkhanids to the Timurids and the Turkmen Qara Qoyunlu and Aq Qoyunlu"
region = "Iranian plateau, Mesopotamia, Khorasan and Transoxiana"
window = "500–1507 (from the start of the time frame, under Kavad I; Sasanian core 500–651; ends with the fall of Timurid Herat in 1507)"
sources = [
  "Procopius of Caesarea, Wars (Persian Wars)",
  "Maurice, Strategikon (c. 600; trans. G. T. Dennis, 1984)",
  "al-Tabari, Ta'rikh (Sasanian section, trans. C. E. Bosworth, 1999)",
  "al-Baladhuri, Futuh al-buldan",
  "Ferdowsi, Shahnameh (c. 1010)",
  "Ammianus Marcellinus, Res Gestae (4th century: background for the Sasanian army before the window)",
  "Touraj Daryaee, Sasanian Persia: The Rise and Fall of an Empire (2009)",
  "Parvaneh Pourshariati, Decline and Fall of the Sasanian Empire (2008)",
  "Richard E. Payne, A State of Mixture (2015)",
  "Eberhard W. Sauer et al., Persia's Imperial Power in Late Antiquity: The Great Wall of Gorgan (2013)",
  "Robert McC. Adams, Land Behind Baghdad (1965)",
  "George Makdisi, The Rise of Colleges (1981)",
  "Farhad Daftary, The Ismāʿīlīs: Their History and Doctrines (1990)",
  "Beatrice Forbes Manz, The Rise and Rule of Tamerlane (1989)",
  "John E. Woods, The Aqquyunlu: Clan, Confederation, Empire (rev. ed., 1999)",
  "Rudi Matthee, ‘Unwalled Cities and Restless Nomads: Firearms and Artillery in Safavid Iran’, in C. Melville (ed.), Safavid Persia (1996)",
  "Encyclopaedia Iranica (entries ‘Aswārān’, ‘Caravansary’, ‘Elephant’, ‘Kāriz’ by X. de Planhol)",
]

[[bonus]]
text = "Farms +10% food; Mill technologies cost -50%"
kind = "economic"
level = 1
change = "new"
replaces = "Start with +50 wood and +50 food"
precedent = "Farms +10% food (Chinese team bonus); Mill technologies free (Franks); Stable technologies cost -50% (Burgundians)"
basis = "Qanats (kāriz), gently sloping tunnels that bring groundwater to the surface, watered the farms and towns of the Iranian plateau from at least the Achaemenid period; al-Karaji wrote a treatise on finding and digging them (Inbat al-miyah al-khafiya, early 11th century; Iranica, ‘Kāriz’). The Sasanian kings extended the canals of the Sawad of Iraq, the empire's granary (Adams, 1965), and after the Mongol devastation Ghazan Khan's reforms (1295–1304) and the farming treatise attributed to his vizier Rashid al-Din (Athar va ahya, c. 1300) set out to restore cultivation. The cheaper Mill technologies, which improve ploughing and crop rotation, stand for this farming knowledge; the starting resources had no historical referent."
relevance = "Irrigated farming made a dense population and a rich state possible on an arid plateau; without the qanat and the canals, Iran's history is unthinkable."

[[bonus]]
text = "Archer-line and Cavalry Archers attack +10% faster"
kind = "military"
level = 1
change = "new"
replaces = "Town Centers and Docks +100% HP and work +5/10/15/20% faster in Dark/Feudal/Castle/Imperial Age"
precedent = "Foot Archers attack +18% faster (Ethiopians); Cavalry Archers attack +25% faster (Mongols)"
basis = "Procopius (Wars I.18, Callinicum 531) says almost all Persians were archers and shot much faster than the Romans, though their slacker bows made each arrow less dangerous. Maurice's Strategikon (c. 600) teaches rapid shooting ‘in the Roman or the Persian manner’ (I.1) and calls the Persians more practised in rapid, although not powerful, archery than all the warlike nations (XI.1, trans. Dennis, 1984). Later Iranian armies kept the bow at the centre (Turkmen and Timurid horse archers). The Town Center and Dock bonus had only a stretched link with Sasanian city foundations and the Gulf ports."
relevance = "Massed archery was the Persian way of war for Roman observers and stayed central to every army of Iran; it defines the civ's fighting style."
contested = "Procopius may exaggerate the contrast to praise Roman archery."

[[bonus]]
text = "Parthian Tactics available in Castle Age"
kind = "military"
level = 1
change = "kept"
precedent = "Parthian Tactics available in Castle Age (Persians)"
basis = "The Iranian tradition of mounted archery runs from the Parthians to the Sasanian asvaran, who also shot from horseback, and to the Turkmen horsemen of later Iran. The name refers to the Arsacid Parthians whom the Sasanians overthrew in 224, but the technique is Iranian."
relevance = "Horse archery is the oldest and most lasting Iranian military tradition, and its name (the ‘Parthian shot’) is Iran's best-known contribution to the vocabulary of war."

[[bonus]]
text = "Can build Caravanserai in Imperial Age"
kind = "economic"
level = 1
change = "kept"
precedent = "Can build Caravanserai in Imperial Age (Persians)"
basis = "Kārvānsarā is a Persian word and Iran is the home of the type: road stations attributed to the Sasanians, Samanid and Great Seljuk ribats such as Ribat-i Sharaf (1114/15, restored 1154) on the Merv–Nishapur road; Iran lay across the Silk Road between China, India and the Mediterranean. Shared with the Hindustanis (and with the Turks in this region's revision)."
relevance = "Iran profited from the transit trade between China, India and the Mediterranean, and its road stations made that trade possible."
contested = "The dating of the Sasanian road stations is debated."

[team_bonus]
text = "Universities work +80% faster"
level = 1
change = "new"
replaces = "Knight-line +2 attack vs. Ranged Soldiers"
precedent = "Universities work +80% faster (Malians team bonus)"
basis = "Persian learning reached Iran's neighbours. The madrasa grew up in Khorasan and spread west with the Seljuks, above all through the Nizamiyya colleges of the Persian vizier Nizam al-Mulk (Baghdad, 1067), the model for later Sunni colleges (Makdisi, 1981). Persian astronomy travelled further: Jamal al-Din of Bukhara brought astronomical instruments and a calendar to Kublai (1267), Gregory Chioniades took Persian astronomical tables to Byzantium in Greek after studying at Tabriz (c. 1300), and Ali Qushji, Ulugh Beg's astronomer, taught in Mehmed II's Istanbul (1472–1474). The original bonus, which the previous draft had re-based on Persian cavalry serving the Lakhmids at al-Hira and the Asawira who went over to the Arabs, showed no lasting benefit to neighbours (RULES 6.2, 6.9)."
relevance = "Persianate learning and its schools shaped scholarship from Anatolia to China; it is one of Iran's most lasting gifts to its neighbours within the window, as RULES 6.2 requires."

[[unique_unit]]
name = "War Elephant"
model = "War Elephant"
building = "Castle"
level = 1
change = "kept"
basis = "Sasanian armies brought Indian elephants to Avarayr (451), the Battle of the Bridge (634) and Qadisiyya (636/637), where they at first frightened the Arab horses (al-Tabari); later rulers of Iran used them too, from the Ghaznavids to Timur, who fought with elephants taken from Delhi at Ankara (1402). Trample damage is a reasonable abstraction."
relevance = "Elephants were the Sasanian shock arm in the decisive battles against Rome and the Arabs and stayed a royal arm of Persianate rulers; they are also strongly associated with the Persians."

[[unique_unit]]
name = "Savar"
model = "Savar"
building = "Stable"
level = 1
change = "kept"
basis = "Savār means ‘horseman’ in Persian; the asvaran were the armoured noble cavalry of the Sasanians, the clibanarii of Roman sources. Heavy cavalry strong against ranged units is a reasonable role; these horsemen also used the bow."
relevance = "The asvaran were the Sasanian army and its social elite; the civ cannot be told without them."

[[unique_tech]]
name = "Kharaj"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Farmers slowly generate gold in addition to food"
level = 1
change = "new"
precedent = "Burgundian Vineyards (Farmers slowly generate gold in addition to food) (Burgundians, kept there at the Mill): an existing unique tech, shared and renamed with an identical effect and age; the Berbers (Taksir), Aztecs (Calpixqueh) and Tatars (Yarlyk) share it too, and the Bengalis have it as a passive"
basis = "Kavad I began and Khosrow I (531–579) completed a survey of the cultivated land and fixed the land tax (Middle Persian harāg) in silver per jarib according to the crop (wheat and barley, vines, date palms), collected in instalments; it paid a standing army, and the Arab conquerors kept it as the kharāj of Iraq and Iran (al-Tabari, trans. Bosworth, 1999; Daryaee, 2009). Farmers whose fields yield coin to the treasury translate it directly. The tech takes the Arabic name, under which the tax ran through the whole Islamic part of the window. Neither Kamandaran nor Citadels fits the Town Center, so another civ's existing tech is shared (level 1)."
relevance = "Khosrow's fiscal reform financed the late Sasanian state and, as the kharaj, the caliphate's administration of Iraq and Iran: a turning point of Iranian statecraft."

[[unique_tech]]
name = "Citadels"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Castles +4 attack, +3 vs. Rams, +3 vs. Infantry and receive -25% bonus damage"
level = 1
change = "kept"
precedent = "Citadels (Castles +4 attack, +3 vs. Rams, +3 vs. Infantry and receive -25% bonus damage) (Persians)"
basis = "Hasan-i Sabbah's seizure of Alamut (1090) began the Nizari Ismaili castle network of Iran (Alamut, Lamasar, Girdkuh and the forts of Quhistan). Its mountain strongholds largely held out against the Seljuks for generations, though Muhammad Tapar took Shahdiz near Isfahan in 1107, until the Mongol conquest (Alamut, 1256) (Daftary, 1990). It continues the Sasanian tradition of fortress cities and frontier forts (Nisibis, Persian from 363; the forts of Khosrow I's Derbent walls). Keep, Fortified Wall and Arrowslits now enter the tree, removing the contradiction the analysis noted."
relevance = "Fortresses decided Iran's wars with Rome over Nisibis and Dara and kept the Nizari state alive for 166 years; strongholds are a constant of Iranian history."

[tree]
add = ["Bracer", "Arbalester", "Keep", "Fortified Wall", "Arrowslits", "Heresy"]
remove = ["Hand Cannoneer", "Bombard Cannon", "Cannon Galleon", "Elite Cannon Galleon", "Siphons", "Incendiaries", "Block Printing"]

[tree.basis]
"Bracer" = "Archery was the Persian arm par excellence (Procopius; the Strategikon), so the archers' Blacksmith line should be complete, as the analysis asks."
"Arbalester" = "The project gives the Arbalester, the crossbow tier, only where crossbows are attested, keeping the Crossbowman as the generic Castle Age bow upgrade until the N2 bow/crossbow split. The crossbow (charkh) was known in the Persianate east: Fakhr-i Mudabbir's manual of war (Adab al-harb wa'l-shaja'a, early 13th century), written in the Ghaznavid–Ghurid tradition for the Delhi sultan Iltutmish, describes it; it belongs to the Indian side of the Ghaznavid split and is also the basis of the Hindustanis' Arbalester, so for Iran it is indirect evidence (see contested). With it the Persians' archery gets the full line, as the analysis asks."
"Keep" = "The Wall of Gorgan (c. 195 km with more than 30 forts; Sauer et al., 2013), the Tammisha wall and the walls of Derbent (Khosrow I, 6th century) were among the largest fortification works of late antiquity; Citadels without Keeps was incoherent."
"Fortified Wall" = "As Keep: the great Sasanian barrier walls against the northern nomads (Gorgan, Tammisha, Derbent)."
"Arrowslits" = "The analysis lists it with Keep and Fortified Wall: the towers of the Derbent walls and the forts of the Gorgan wall were garrisoned firing points of an archer army."
"Heresy" = "Apostasy from Zoroastrianism was a capital crime in Sasanian law: Mihr-Mah-Gushnasp, a noble baptised as Giwargis, was executed under Khosrow II in 615 (Babai the Great, Life of Giwargis); the charge was pressed during a quarrel between Christian factions at court (Payne, 2015). Its absence was ironic."
"Hand Cannoneer" = "The window ends with the Timurids (1507). Light guns are reported for Timurid and Aq Qoyunlu armies, but thinly: Uzun Hasan lost at Otlukbeli (1473) to Ottoman guns (Woods, 1999), and Ismail I's army fought at Chaldiran (1514), after the window, without significant firearms (Matthee, 1996; the reason is contested). See the open question on an early Safavid extension."
"Bombard Cannon" = "As Hand Cannoneer. Trebuchet, Onager, Siege Ram, Petard and the War Elephant (strong against buildings) still destroy buildings (RULES 6.11)."
"Cannon Galleon" = "No gunpowder warships: Iran had no ocean-going gun fleet, and even the Safavids needed English East India Company ships to take Hormuz from the Portuguese in 1622. The Galley, Galleon and Fire Ship lines keep the navy."
"Elite Cannon Galleon" = "As Cannon Galleon."
"Siphons" = "Named after the Byzantine fire siphon, a state secret never given to other nations (De Administrando Imperio 13); no ship-borne liquid-fire weapon is documented for this civ."
"Incendiaries" = "Requires Siphons, which this design removes."
"Block Printing" = "No printing in the window: the paper money that the Ilkhan Geikhatu had block-printed at Tabriz on the Chinese model (1294) was withdrawn within months and was not book printing, and printed amulets (tarsh) survive mostly from Egypt (see the Saracens)."

[architecture]
set = "Central Asian"
change = "changed"
replaces = "Middle Eastern"
basis = "Owner's decision. The Central Asian set draws on Timurid brick and glazed-tile building (Samarkand, Herat), the latest phase the civ represents, and suits Iranian domes and iwans, from the Sasanian Taq Kasra at Ctesiphon to the Seljuk mosques of Isfahan, better than the generic Middle Eastern set."

[[dropped]]
item = "Kamandaran"
kind = "unique_tech"
reason = "Archer-line gold cost replaced by additional wood cost. Rated plausible, but under RULES 6.3 a unique tech needs a distinct datable moment, and Persian mass archery is a structural trait, now carried by the passive ‘Archer-line and Cavalry Archers attack +10% faster’ (Procopius, the Strategikon) together with Bracer and Arbalester. See the open question."
