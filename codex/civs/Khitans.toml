civ = "Khitans"
name = "Khitans"
status = "draft"
label = "Cavalry and Cavalry Archer civilization"
summary = "The Khitan Liao empire (907–1125) as an armoured horse-archer power: the Pishi Guard replaces the Liao Dao, Bloodlines comes free, the dual administration becomes the Town Center tech and the Chanyuan Treaty a Market tech, foraging plunder is added, and Lamellar Armor, rockets, fire lances, camels and the Mounted Trebuchet go."
ideas = [
  "N3: The Ordo as a mobile court and fortification that packs and moves between seasonal camps (nabo), beside or instead of the Castle.",
  "N2: Farms beside Pastures, with the farming techs, as a second effect of the Dual Administration, for the Han and Bohai prefectures and the captive farming towns of the steppe; the tech's population effect is already exclusive, so it would not merely give back what the Pastures took (RULES 6.6). In N1 the Pastures stay exclusive (see the Pastures bonus).",
  "N2: A guard horseman who switches between bow and lance, closer to the Liao shi's armoured soldier than any existing unit (the Scenario Editor's Khan is a mounted archer only; see the Pishi Guard).",
  "N2: The Khitan large (920) and small (c. 925) scripts as a University tech.",
  "N3: A Tangut (Western Xia, 1038–1227) civ that takes the Mounted Trebuchet, after the camel-borne trebuchet corps (poxi) of the Song shi.",
  "N3: A Qara Khitai phase (1124/1132–1218) for the Western Liao of Central Asia (victory over the Seljuks at Qatwan, 1141).",
  "N3: A “Steppe” architecture set shared with the steppe civs.",
  "N3: Camel-drawn carts (Liao tomb murals) for the baggage trains and the court that moved between seasonal camps (nabo), as a camel version of the Mule Cart (RULES section 10 and 6.16.7: the Mule Cart keeps its four holders in N1, and other pack animals are N3). The Scenario Editor's Bactrian Camel and Cart are existing art that could lower the cost of this idea (RULES section 5; their look must be checked in game).",
]
contested = [
  "The founding date of the Liao: 907 (Abaoji proclaimed khagan) or 916 (emperor); the dynastic name alternated between Liao and Great Khitan.",
  "The nature of the Liao state: a “conquest dynasty” (Wittfogel and Feng, 1949), a sinicised dynasty, or a permeable frontier society (Standen, 2007).",
  "Military use of gunpowder by the Liao is scarcely documented; the Song forbade the sale of saltpetre and sulphur to foreigners in the 11th century.",
  "The size of the state herds and of the guard armies in the Liao shi, compiled under the Yuan two centuries later; the authenticity of the Qidan guozhi.",
  "The Liao shi's kit list for the regular soldier (three horses, a forager and a camp guard, armour and weapons, all self-provided; Liao shi 34) is a regulation in a history compiled under the Yuan: it prescribes what a soldier should bring rather than proving that every soldier did. The Bloodlines, Heavy Cavalry Archer, foraging and Ordo Cavalry elements lean on it, with tomb finds and the Song experience of Liao armies as support.",
  "The two Khitan scripts (large, 920; small, c. 925) remain largely undeciphered (Kane, 2009), which limits what is known of Khitan terms such as ordo and pishi: the usual gloss of pishi as “vajra” (jingang, “diamond”) goes back to the Qing scholar Li E (Liao shi shiyi), not to the Liao shi.",
  "Reading the game's Mangonel as a light traction pao: in many medieval sources “mangonel” meant the traction trebuchet (P. Chevedden; P. Purton), a widely but not universally accepted reading, while the game's art shows a torsion engine.",
  "Liao camels are known as draft and pack animals (tomb murals of camel-drawn carts); no Khitan camel cavalry is recorded, so the Camel Rider is removed.",
  "The dual administration. The Liao shi (45, Baiguan zhi) describes officials divided into north and south: the northern officials ran the palace camps (ordo), the tribes and the dependent states, the southern ones the Han prefectures and counties, their taxes and their troops, “governing each according to its custom”. The same preface itself warns that the chief ministers, the Chancelleries and other offices, down to the gentlemen and the guards, were all divided into north and south, yet “in fact all of them handled northern affairs” (qi shi suo zhi jie beimian zhi shi), and modern scholars debate how far the Liao shi's neat north–south scheme reflects how Liao government worked in practice; that tribes and Han prefectures answered to separate channels is not in doubt. The office names do not map neatly onto the two halves either: in the Liao shi's scheme the Northern and Southern Chancelleries (bei shumiyuan, nan shumiyuan) are both listed among the northern offices (j. 45), the southern one handling civil appointments, the tribes and the levies of the Khitan people, while a separate Han Chancellery (hanren shumiyuan) is listed among the southern offices (j. 47); whether the Southern Chancellery and the Han Chancellery were really two distinct offices is itself debated. The design follows the separate government of tribes and of Han prefectures, which no side of the debate denies, and names the tech “Dual Administration” after the modern term.",
  "Label: the game's “Infantry and Cavalry civilization” had no support in the sources, since Liao armies were overwhelmingly cavalry (the guard, the ordo cavalry, the tribal armies); the label follows the redesign as “Cavalry and Cavalry Archer civilization” (RULES 6.16.16).",
]
open_questions = []

[profile]
