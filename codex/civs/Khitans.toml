window = "907–1125"
sources = [
  "Toghto et al., Liao shi (1344), especially the Bingwei zhi, Baiguan zhi and Shihuo zhi",
  "Qidan guozhi (attributed to Ye Longli; authenticity debated)",
  "Sima Guang, Zizhi tongjian (1084)",
  "Shen Kuo, Mengxi bitan (c. 1088)",
  "Song shi (1345); Goryeosa (1451)",
  "Li E, Liao shi shiyi (18th century)",
  "K. Wittfogel and Feng Chia-sheng, History of Chinese Society: Liao (907–1125) (1949)",
  "D. Twitchett and K.-P. Tietze, “The Liao”, Cambridge History of China, vol. 6 (1994)",
  "N. Standen, Unbounded Loyalty: Frontier Crossings in Liao China (2007)",
  "N. Steinhardt, Liao Architecture (1997)",
  "D. Kane, The Kitan Language and Script (2009)",
  "M. Biran, The Empire of the Qara Khitai in Eurasian History (2005)",
]

[[bonus]]
text = "Pastures replace Farms"
kind = "economic"
level = 1
change = "kept"
precedent = "Pastures replace Farms (Khitans)"
basis = "The Khitan economy was pastoral: horses, cattle, sheep and camels, with state herds (qunmu) that the Liao shi counts in the hundreds of thousands, and an imperial court that moved with the seasons between camps (nabo) (Wittfogel and Feng 1949). The Pasture is the game's most faithful pastoral mechanic."
relevance = "Pastoralism was the base of Khitan life, wealth and military power."
contested = "The empire also had an agricultural half, the Southern Region and the Sixteen Prefectures, and towns of Han and Bohai captives settled as farmers in the steppe; full replacement of Farms erases that dual economy. Decision (the level-1 review's default): the Pastures stay exclusive, so the civ keeps its single pastoral economy and the farming techs stay out for the power budget; the Dual Administration renders the governed farming population instead, and Farms beside Pastures, with the farming techs, is an N2 idea (see ideas)."

[[bonus]]
text = "Bloodlines free"
kind = "military"
level = 1
change = "new"
replaces = "Melee attack upgrade effects are doubled"
precedent = "Thumb Ring, Parthian Tactics free (Tatars); Conscription free (Vietnamese); Bloodlines and Scout Cavalry-line upgrades cost -50% food (Poles)"
basis = "The Khitans were among the great horse-breeders of the steppe. By regulation each regular soldier went to war with three horses of his own, a forager and a camp guard, and armour and weapons, all self-provided (Liao shi 34, Bingwei zhi; see contested); behind this private horse wealth stood the vast state herds (qunmu) described in the Shihuo zhi, Liao tombs are rich in horse gear, such as the gilt-silver saddlery buried with the Princess of Chen (1018), and the Song, cut off from the northern pastures, suffered a chronic shortage of horses. Bloodlines was missing from the tree; the doubling of melee attack upgrades had no identifiable basis."
relevance = "Horse wealth gave the Liao their military edge over the horse-poor Song for two centuries."

[[bonus]]
text = "Scout Cavalry-line and Steppe Lancers train and upgrade +15% faster"
kind = "military"
level = 1
change = "changed"
replaces = "Skirmishers, Spearman-, and Scout Cavalry-line train and upgrade +15% faster"
precedent = "Skirmishers, Spearman-, and Scout Cavalry-line train and upgrade +15% faster (Khitans), narrowed to the Scout Cavalry-line; for the Steppe Lancers, which that bonus does not cover, Military Units train +15% faster (Aztecs), narrowed to them at the same magnitude, and Technologies research +25% faster (Portuguese team bonus), narrowed to the Elite Steppe Lancer upgrade at a lower magnitude (RULES section 5, narrowing). Steppe Husbandry (Scout Cavalry-line, Steppe Lancers and Cavalry Archers train +100% faster) (Cumans) groups the two mounted lines the same way"
basis = "Every Khitan tribe was a reserve of light horsemen, and Liao armies advanced behind far-ranging mounted scouts (Liao shi, Bingwei zhi; Wittfogel and Feng 1949). The faster training now applies to the light and lancer cavalry; foot skirmishers and spearmen came from the Han and Bohai militias and had no particular basis."
relevance = "The tribal levies of light horsemen and lancers formed the mass of Liao armies."

[[bonus]]
text = "Heavy Cavalry Archer upgrade available in Castle Age and costs -50%"
kind = "military"
level = 1
change = "kept"
precedent = "Heavy Cavalry Archer upgrade available in Castle Age and costs -50% (Khitans)"
basis = "The Liao shi (34, Bingwei zhi) prescribes the regular soldier's kit: three horses, a forager and a camp guard, nine pieces of iron armour, leather or iron barding for the horse according to his means, four bows and 400 arrows, long and short spears, a mace (guduo) and an axe (a regulation; see contested). This is the definition of a heavy cavalry archer (Wittfogel and Feng 1949)."
relevance = "The armoured horse archer of the Liao shi was the core of every Liao army."

[[bonus]]
text = "Loot 25% of the resource cost of each destroyed building"
kind = "economic"
level = 1
change = "new"
precedent = "Loot 25% of the resource cost of each destroyed building (Danes); also the second effect of the English design's Chevauchée tech; reused effects are accepted in N1, each on its own history (RULES 6.16.12)"
basis = "Liao armies on campaign were not issued grain or fodder: each regular soldier brought a forager, and every day “foraging riders” rode out in all directions to plunder for men and horses (da cao gu, “beating the grass and grain”; Liao shi 34, Bingwei zhi), as in the deep raids into Song Hebei before Chanyuan (1004). In 947, after Taizong had taken Kaifeng, the plundering provoked risings that forced the Liao to abandon the Central Plains, and Taizong himself listed “letting the troops plunder fodder and grain” (zong bing lüe chu su) among his three errors (Liao shi 4, Taizong benji); the Zizhi tongjian (286) gives the same error as “letting the people of the superior state beat the grass and grain” (ling shangguo ren da cao gu), that is, letting the Khitans forage by plunder, and describes the practice under that name, riders sent out in shifts on the pretext of grazing their horses. A standing campaign practice, not a datable reform, so a passive bonus (RULES 6.2)."
relevance = "Living off the enemy's land shaped every Liao campaign, and the plundering of 947 cost the Liao their hold on the Central Plains."
contested = "Plunder was a supplement: after 1005 the Song payments mattered far more to Liao finances. Whether the practice was curtailed under Shengzong is uncertain: encyclopaedias say so, but the only primary text found is a truncated edict of 986 forbidding plunder."

[team_bonus]
text = "Monasteries work +20% faster"
level = 1
change = "new"
replaces = "Infantry +2 attack vs. Ranged Soldiers"
precedent = "Monasteries work +20% faster (Lithuanians team bonus)"
basis = "Liao Buddhism reached Korea. The Liao printed its own Buddhist canon, the Khitan canon (carving begun c. 1031; fragments found in 1974 inside the Yingxian wooden pagoda of 1056), and presented a copy to Goryeo in 1063 (Goryeosa); Liao scholastic works entered Goryeo Buddhism through the monk Uicheon, whose catalogue of 1090 lists many of them, and Sugi, the editor of the Tripitaka Koreana (1236–1251), collated its text against the Khitan edition (Sugi's collation record). A team bonus because Liao Buddhism shaped a neighbour's canon (RULES 6.2: religious influence). At home the court built the Guanyin Pavilion of the Dule Temple (984) and the Yingxian pagoda (Steinhardt 1997). The infantry bonus it replaces had no basis. The effect is reused by other designs; reuse is accepted in N1, identical team effects count once per team, and a less common religious effect is left to the N2 diversification pass for team bonuses (RULES 6.16.12)."
relevance = "Buddhism and its printed canon were a lasting achievement of the Liao, and through Goryeo they outlived the dynasty."
contested = "The Liao shi's figures for Daozong's piety (360,000 monks fed in a year, 3,000 ordained in a day) belong to a moralising Yuan verdict on Buddhist excess and are rhetorical. When the Khitan canon was completed is debated (dates from the 1050s to the late 1060s are proposed); the copy sent in 1063 shows that its main part was finished by then."

[[unique_unit]]
name = "Pishi Guard"
model = "Tiger Cavalry"
building = "Castle"
level = 1
change = "new"
replaces = "Liao Dao"
basis = "The Pishi army (pishi jun) was the Liao imperial guard. Abaoji picked over a thousand strong warriors from the tribes for his trusted guard (fuxin bu), which the Liao shi identifies with the Pishi army, and Taizong enlarged it with picked troops from across the realm into the core of the emperor's cavalry (Liao shi, Bingwei zhi and Baiguan zhi; Wittfogel and Feng 1949). The Liao shi uses pishi only as the name of the guard units (Southern, Northern, Left, Right and Yellow Pishi); its usual gloss as “vajra” (jingang, “diamond”) goes back to the Qing scholar Li E (Liao shi shiyi). The model is the Tiger Cavalry of the out-of-scope Wei, Cao Cao's guard (hubao qi): an elite guard cavalry whose growth with victories abstracts veteran status, and a model no in-scope civ shares. The Keshik is already shared by the Mongols' and Tatars' designs, and the Hei Guang Cavalry is a regional unit that would not count as a unique unit (RULES 6.16.10), so the Tiger Cavalry stays (the level-1 review's default). The Scenario Editor's Khan and Sogdian Cataphract (RULES section 5) were also weighed and not used: the Khan is a mounted archer only, a role the Heavy Cavalry Archer bonus already carries for the Liao armoured horse archer, and the Sogdian Cataphract is by name and origin a Central Asian heavy horseman, a worse fit for the Liao guard than the Chinese-style Tiger Cavalry; either would also need its in-game look and stats checked first. The Liao Dao (“Liao blade”) named no documented unit, and infantry was secondary in Liao armies."
relevance = "The guard cavalry was the emperor's striking force and the core of Liao military power."
contested = "The guard's size and its relation to the ordo cavalry are uncertain; the Liao shi's figures are late and inflated."

[[unique_tech]]
name = "Dual Administration"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Town Centers provide +10 population space"
level = 2
change = "new"
precedent = "Town Centers +7 line of sight and provide +15 population space (Chinese): its population half, at a lower magnitude, as a new tech (RULES 6.5)"
basis = "When Taizong had gained the Sixteen Prefectures (936–938) and, briefly, Kaifeng (947), the Liao divided its officials into north and south: “the Khitan were governed by the national system, and the Han were treated by the Han system” (Liao shi 45, Baiguan zhi). The northern officials ran the palace camps (ordo), the tribes and the dependent states; the southern ones ran the Han prefectures and counties (zhou, xian), their land tax and their troops, “governing each according to its custom” (see contested). Abaoji had already given his Han subjects officials and advisers of their own, such as Han Yanhui, but the system took shape under Taizong (Wittfogel and Feng 1949; Twitchett and Tietze 1994). Through it a Khitan minority ruled a mostly settled empire: Wittfogel and Feng estimate the Liao population at some 750,000 Khitans beside 2.4 million Han, 450,000 Bohai and 200,000 others (a modern estimate; the Liao shi gives only partial figures). Extra population space at each Town Center stands for the settled Han and Bohai subjects, registered in the prefectural seats, whom the southern officials governed under their own law; governing them let a pastoral state sustain far more people than its herds alone could. The Chinese bonus uses the same mechanic for the grid of county and prefectural seats; here it renders a different institution, the separate government of a settled majority. Population space rather than a gathering or trade effect, because what the system added to the Liao was governed people, not a resource; Farms beside Pastures as a second effect is the more specific rendering, left to N2 (see ideas). At the Town Center because the system was the frame of the Liao state (RULES 6.2). A new tech (level 2), because no existing tech expresses it; the level-1 review made it the Town Center tech and moved the Chanyuan Treaty to the Market (review section 9)."
relevance = "The dual administration let a Khitan minority govern a settled Han and Bohai majority for two centuries; it is the Liao's best-known institution and the core of the “conquest dynasty” that Wittfogel and Feng (1949) modelled on the Liao."
contested = "Whether the Liao shi's north–south scheme describes the real structure of Liao government is debated by modern scholars, and the Liao shi itself notes that many offices divided into north and south in fact all handled northern affairs (j. 45; see the contested list); the separate government of tribes and of Han prefectures is not in doubt. Population space is an abstraction of governed households, not a mechanism the sources describe."

[[unique_tech]]
name = "Chanyuan Treaty"
building = "Market"
kind = "civil"
age = "Castle"
effect = "All gold income +10% faster; Market trading fee reduced to 10%"
level = 1
change = "new"
precedent = "Grand Trunk Road (All gold income +10% faster; Market trading fee reduced to 10%) (Hindustanis): an existing unique tech, shared, moved to the Market and renamed, identical effect and age; five other designs hold the full effect at the Town Center (the Anglo-Saxons' Edgar's Recoinage, the Burgundians' Vierlander Coinage, the Hindustanis' Tanka, the Malay Syahbandar and the Muisca Cotton Mantles; reuse accepted in N1, RULES 6.16.12)"
basis = "In January 1005, after a Liao invasion had stalled before Chanyuan, where the Liao commander Xiao Talin was killed by a bed-crossbow bolt, the Song agreed to pay 100,000 taels of silver and 200,000 bolts of silk a year, raised in 1042 to 200,000 taels and 300,000 bolts, and the two courts treated each other as equals; border markets (quechang) were opened at Xiongzhou, Bazhou and other border towns (Song shi, Shihuo zhi; Twitchett and Tietze 1994). The yearly silver becomes extra gold income and the border markets the lower market fee. At the Market (RULES 6.2: trade), because what the covenant brought the Liao was silver, silk and border trade; the Town Center slot goes to the Dual Administration, the Liao's weightiest state trait (level-1 review, section 9)."
relevance = "The covenant fixed Song–Liao relations for 120 years of peace and gave the Liao a steady income in silver and silk."
contested = "How much the payments weighed in Liao finances is debated; the Song presented them as annual payments (suibi) between equals, and later writers as tribute."

[[unique_tech]]
name = "Ordo Cavalry"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Cavalry regenerates HP in combat"
level = 1
change = "kept"
precedent = "Ordo Cavalry: Cavalry regenerates HP in combat (Khitans)"
basis = "The tech is anchored on the founding of the ordo system. Abaoji (r. 907–926) set up the first ordo, the Suan ordo (Hongyi palace), as his own palace camp, built on his trusted guard, and every later emperor set up his own at his accession, until the Liao shi counts twelve palace camps and one residence (shi'er gong yi fu) (Liao shi 31, Yingwei zhi). The ordo (wolüduo) was thus each emperor's own camp-household, with attached households, herds and guard cavalry that outlived him: at his death it served his tomb while its able-bodied men still went to war. By regulation the regular soldier's three horses, forager and camp guard kept him mounted and supplied (Liao shi 34; Wittfogel and Feng 1949). Regeneration in combat is an abstraction of remounts and camp support. Imperial Age, the game's age (RULES 6.16.11), for the system at its full extent."
relevance = "The ordo camp-households were the personal power base of every Liao emperor and the source of his guard cavalry."
contested = "The game's history text overstates the ordo's share of Liao armies: tribal armies, prefectural militias and vassal troops also fought."

[tree]
add = ["Bloodlines", "Block Printing", "Architecture", "Keep", "Traction Trebuchet", "Mangonel", "Halberdier"]
remove = ["Trebuchet", "Rocket Cart", "Heavy Rocket Cart", "Fire Lancer", "Elite Fire Lancer", "Cannon Galleon", "Carrack", "Fast Fire Ship", "Galleon, Fast Fire Ship and Carrack", "Camel Rider", "Heavy Camel Rider"]

[tree.basis]
"Bloodlines" = "Missing despite the Liao horse herds; now free (see bonuses)."
"Block Printing" = "The Liao printed the Buddhist canon (carving begun c. 1031; fragments found in the Yingxian pagoda in 1974), and Shen Kuo notes that Liao law punished with death the export of books to the Song (Mengxi bitan)."
"Architecture" = "Liao timber architecture survives: the Guanyin Pavilion of the Dule Temple (984) and the Yingxian wooden pagoda (1056), about 67 m high, the tallest surviving premodern timber pagoda (Steinhardt 1997)."
"Keep" = "The Liao had five walled capitals (Shangjing, Dongjing, Nanjing at Beijing, Zhongjing, Xijing) and many walled prefectural towns."
"Traction Trebuchet" = "The man-powered traction pao was the heavy stone-thrower of every army in the region until the counterweight engine arrived in 1273 (Needham and Yates 1994), and the Liao besieged walled towns from the Bohai capital (926) to Yingzhou (1004). It replaces the counterweight Trebuchet (RULES 6.11)."
"Mangonel" = "Added as the light traction pao and renamed Whirlwind Pao (see the rename): it replaces the removed Rocket Cart as the civ's Castle-Age blast weapon (RULES 6.11), since the Khitans have no Bomb Thrower or other substitute. One such weapon per civ is a design convention of this region, not a historical finding: the Chinese keep the Rocket Cart, the Jurchens the Bomb Thrower, the Khitans this pao. The convention mirrors the game, where none of the four civs that train the Rocket Cart (Chinese, Jurchens, Khitans, Koreans) has the Mangonel line; so the Khitans field that line as the Whirlwind Pao, a name from the Song manuals, while the Chinese, who keep the Rocket Cart, lack it (the Koreans' design, on the owner's sketch, keeps both). Only the Mangonel tier is added: the Onager tier, the generic upgrade of the stone-thrower line, is left out by the same convention and for power."
"Halberdier" = "The anti-cavalry substitute for the removed camels (RULES 6.11), as in the Mongols' design. Liao foot soldiers came mainly from the militias of the Han and Bohai prefectures and of the capitals (Liao shi, Bingwei zhi); the Halberdier stands for their spear and polearm infantry."
"Trebuchet" = "The counterweight trebuchet reached China in 1273, a century and a half after the fall of the Liao (1125)."
"Rocket Cart" = "Multiple-rocket carts are Ming and Joseon (15th century); there is no evidence of Liao rockets."
"Heavy Rocket Cart" = "Upgrade of the removed Rocket Cart."
"Fire Lancer" = "The fire lance appears in a mid-10th-century Dunhuang painting, but its first recorded use in battle is Song (De'an, 1132), after the fall of the Liao, and no Liao gunpowder weapon is documented."
"Elite Fire Lancer" = "Upgrade of the removed Fire Lancer."
"Cannon Galleon" = "No gun-armed ships: the Liao had neither a war fleet of note nor gunpowder artillery, so the gun ship was doubly anachronistic (the game's Khitans already lack the Galleon)."
"Carrack" = "No war fleet: the Liao had none of note, so the civ keeps the basic navy only (RULES 6.16.1): the Galley-line to War Galley, Fire Galley and Fire Ship, Hulk and War Hulk, demolition ships and the generic Dock techs."
"Fast Fire Ship" = "As Carrack."
"Galleon, Fast Fire Ship and Carrack" = "Nothing is left for this upgrade once the Fast Fire Ship and Carrack are removed."
"Camel Rider" = "Liao camels drew carts and carried baggage (tomb murals of camel-drawn carts), but no Khitan camel cavalry is recorded (see contested); the Mongols' and Tatars' designs remove theirs for the same reason. The Halberdier replaces it as the anti-cavalry unit (RULES 6.11), since the Pishi Guard is strong against ranged soldiers and weak against the Spearman-line and so is no substitute. Keeping the camels as a declared abstraction was the alternative; the level-1 review's default removes them."
"Heavy Camel Rider" = "Upgrade of the removed Camel Rider."

[[rename]]
from = "Mangonel"
to = "Whirlwind Pao"
level = 1
basis = "Same unit, East Asian name. The Wujing Zongyao (1044) describes the “whirlwind” pao (xuanfeng pao), a light single-pole traction trebuchet on a pivoting post that could turn in any direction and threw light stones at troops (Needham and Yates 1994), and the Song shi (486) has the Tangut poxi corps mount whirlwind pao on camel saddles. The name is thus Song and Tangut: no Liao source names a pao type, so for the Khitans it is a regional name for the light traction engine that every army of the region used. The function, a light anti-personnel stone-thrower with area damage, has this historical equivalent (RULES 6.10); in many medieval sources “mangonel” itself meant the traction trebuchet, but the game's Mangonel shows a torsion engine, which neither China nor the steppe used. The Traction Trebuchet stands for the heavy multi-pole pao, so the two units do not overlap."

[[rename]]
from = "Elite Tiger Cavalry"
to = "Elite Pishi Guard"
level = 1
basis = "Follows the unique unit (Tiger Cavalry → Pishi Guard)."

[architecture]
set = "East Asian"
level = 1
change = "kept"
basis = "The Liao capitals, temples and pagodas were built by Han craftsmen in a Chinese idiom (Dule Temple, Yingxian pagoda; Steinhardt 1997), so historical fit keeps the East Asian set (RULES 6.16.8); Central Asian would stress the steppe side but fits the buildings less well, and felt tents and the moving court would suit an N3 Steppe set."

[[dropped]]
item = "Mounted Trebuchet"
kind = "unique_unit"
reason = "No Khitan record of mounted trebuchets. The documented parallel is Tangut: the Song shi (j. 486) describes some 200 Western Xia artillerists, called poxi, who mounted “whirlwind” trebuchets on camel saddles and threw fist-sized stones. The lingering fire is also unfounded. Left for a future Tangut civ (N3)."

[[dropped]]
item = "Lamellar Armor"
kind = "unique_tech"
reason = "Infantry and Skirmishers reflect 25% melee damage back to the attacker. Lamellar armour was the common armour of Eurasia (Liao, Song, Tibetans, Byzantines), so it says nothing distinctive about the Khitans (RULES 6.9), and reflection for infantry and skirmishers inverted the Khitan reality, whose armour was above all cavalry armour; the armoured horseman is carried by the Heavy Cavalry Archer bonus and the Pishi Guard. A cavalry-armour version (such as the Tatars' Silk Armor) would fail the same test here, since lamellar was the common armour of the whole region. Ordo Cavalry remains the Castle tech, the Dual Administration takes the mandatory Town Center slot and the Chanyuan Treaty is at the Market."
