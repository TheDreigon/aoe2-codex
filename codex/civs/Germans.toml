civ = "Teutons"
name = "Germans"
original_name = "Teutons"
status = "reviewed"
label = "Cavalry and Defensive civilization"
summary = "Teutons renamed Germans (919–1500): the Teutonic Knight becomes the mounted brother-knight (Crusader Knight art) and the Landsknecht a second unique unit (Heavy Pikeman art), both with adapted stats, the Ministerialen, the Golden Bull and the Hanse replace Ironclad and Crenellations, conversion resistance becomes a passive, German miners the team bonus, and the tree gains Arbalester, Light Cavalry, Architecture and the mining and shipyard upgrades."
ideas = [
  "N2: Gutenberg's Press, a University tech (University technologies cost -25%, the Italians' Dock and University discount narrowed, as the Bengalis' design uses it): Johann Gutenberg printed with movable metal type at Mainz around 1450 (the 42-line Bible by about 1454–55), and German printers carried the technique to Subiaco (1465), Venice (1469), Paris (1470), Buda and Kraków (1473), and by 1500 presses had worked in more than two hundred towns (Febvre and Martin 1958; Eisenstein 1979). Left out of the N1 design: the German sketch has three techs, printing's spread abroad is team-bonus material under RULES 6.2 while the single team-bonus slot holds the miners, and the civ already gains two unique units and seven tree items; its largest consequence, the Reformation, also falls after 1500. The generic Block Printing stays in the tree.",
  "N2: Reichskirche: Knight-line trainable at the Monastery, after the Indiculus loricatorum (981), in which most of the armoured horsemen Otto II summoned to Italy were owed by bishoprics and abbeys (Leyser 1979; Reuter 1991). A building-trains-unit effect exists (Mapuche Settlements), but a Monastery training cavalry is a new pairing.",
  "N2: Bergrecht as an economic tech at the Mining Camp (Gold and Stone Miners work faster), should the team bonus ever change.",
  "N3: Hanseatic cog and hulk models for the Germans' ships, and Landsknecht art (pike, slashed doublet and hose, two-handed sword for the Doppelsöldner).",
  "N3: Old Prussians and the other Baltic peoples fought by the Order (Prussians, Curonians, Semigallians, Estonians) have no civ; at most a variant or campaign faction.",
]
contested = [
  "When ‘Germany’ begins: 843 (Verdun), 911/919, or only in the 11th–12th centuries (Brühl, Ehlers, Reuter); and how far the name regnum Teutonicorum, mostly an Italian and papal usage that Gregory VII turned against Henry IV’s Roman title, reflected the kingdom’s own sense of itself (Müller-Mertens 1970).",
  "The nature of Ottonian armies: dominated by heavy cavalry (Leyser) or mixed forces with strong infantry and siege capacity (Bernard and David Bachrach). Decision: the label is ‘Cavalry and Defensive’, not the game’s ‘Infantry and Defensive’, because armoured horsemen were the elite arm of German armies from the 10th to the 14th century and the Order’s brethren fought mounted; infantry keeps its place through the melee-armour passive, the Champion and the Landsknecht of the late 15th century.",
  "Whether Henry I issued a systematic ‘Burgenordnung’ (a term of modern historians) and what Widukind meant by agrarii milites (Bachrach 2012).",
  "How distinctive the Ottonian and Salian ‘imperial church system’ was: the older view of a deliberate royal system against Reuter’s reconsideration (1982).",
  "Whether the Order’s hospital at Acre (1190) continued the older German hospital in Jerusalem (c. 1127, placed under the Hospitallers in 1143); the Order’s own foundation account presents it as a new foundation.",
  "The scale and significance of the Battle on the Ice (1242): the Soviet/Russian tradition against the minimalist reading of Fennell, Christiansen and Urban, based on the Livonian Rhymed Chronicle.",
  "The late Empire as ‘fragmentation and failure’ (Prussian national historiography) or as a functioning political system (Whaley, Wilson).",
  "The Mounted Crossbowman line (kept, with Heavy Mounted Crossbowman). Shared basis (level-1 review, section 3.2): the line stays only where shooting from the saddle is documented. German and Order armies of the 14th–15th centuries fielded mounted crossbowmen, and the clearest evidence of shooting from the saddle that the codex has is German: Hans Talhoffer’s fight book of 1467 shows mounted combat with the crossbow, a depiction from the civ’s own lands, so here it bears on the civ’s own practice. As in France, most mounted crossbowmen probably rode to the fight and shot on foot, so the fit is flagged as thin; the line keeps the game’s two tiers. The Germans’ design is the only one that keeps it: the designs of the other civs that hold it in the game, the Franks’ and Burgundians’ among them, drop it on the same test, since their sources show no crossbowman shooting from the saddle.",
]
open_questions = []

[profile]
entity = "The East Frankish, later German kingdom (regnum Teutonicorum in Italian and papal usage), the core of the Empire from 962, with German-speaking society beyond its old borders (towns, settlers, miners) and the German-recruited Teutonic Order and its state in Prussia and much of Livonia"
region = "German-speaking lands of the Empire, from both banks of the Rhine and the Alps to the North Sea and the Baltic, with Prussia and much of Livonia under the Teutonic Order"
window = "919–1500 (from the election of Henry I to the end of the time frame; the Teutonic Order in Prussia 1226/30–1525)"
sources = [
  "Widukind of Corvey, Res gestae Saxonicae (c. 967–973)",
  "Thietmar of Merseburg, Chronicon (c. 1012–1018)",
  "Indiculus loricatorum (981)",
  "Narratio de primordiis ordinis Theutonici (early 13th century)",
  "Peter of Dusburg, Chronicon terrae Prussiae (1326)",
  "The Golden Bull of Charles IV (1356), ed. Wolfgang D. Fritz, MGH Fontes iuris Germanici antiqui 11 (1972)",
  "Eckhard Müller-Mertens, Regnum Teutonicum (1970)",
  "Karl Bosl, Die Reichsministerialität der Salier und Staufer (1950–51)",
  "Karl Leyser, Rule and Conflict in an Early Medieval Society (1979)",
  "Timothy Reuter, ‘The “Imperial Church System” of the Ottonian and Salian Rulers: a Reconsideration’, Journal of Ecclesiastical History 33 (1982)",
  "Timothy Reuter, Germany in the Early Middle Ages c. 800–1056 (1991)",
  "David S. Bachrach, Warfare in Tenth-Century Germany (2012)",
  "Benjamin Arnold, German Knighthood 1050–1300 (1985)",
  "Len Scales, The Shaping of German Identity: Authority and Crisis, 1245–1414 (2012)",
  "Robert Bartlett, The Making of Europe (1993)",
  "Philippe Dollinger, The German Hansa (1964; English translation 1970)",
  "Beata Możejko, Peter von Danzig: The Story of a Great Caravel, 1462–1475 (2020)",
  "Eric Christiansen, The Northern Crusades (2nd ed. 1997)",
  "Sven Ekdahl, ‘Horses and Crossbows: Two Important Warfare Advantages of the Teutonic Order in Prussia’, in H. Nicholson (ed.), The Military Orders 2 (1998)",
  "William Urban, The Teutonic Knights: A Military History (2003)",
  "Reinhard Baumann, Landsknechte (1994)",
  "Hans Talhoffer, fight book (1467; Munich, Bayerische Staatsbibliothek, Cod.icon. 394a)",
  "Lucien Febvre and Henri-Jean Martin, L’apparition du livre (1958)",
  "Elizabeth L. Eisenstein, The Printing Press as an Agent of Change (1979)",
  "Peter H. Wilson, Heart of Europe (2016); Joachim Whaley, Germany and the Holy Roman Empire (2012), relevant only from 1493",
]
replaces = "Teutons: the game’s blend of the Holy Roman Empire and the Teutonic Order, under the name of the ancient Teutones (RULES section 4)"

[[bonus]]
text = "Farms cost -40%"
kind = "economic"
level = 1
change = "kept"
precedent = "Farms cost -40% (Teutons); the Goths’ design copies it"
basis = "Read as the Ostsiedlung (12th–14th centuries): locators settled peasants east of the Elbe and in Silesia, Bohemia and Poland under ‘German law’ (ius Teutonicum), with standard holdings (Hufen), the heavy plough and several rent-free years (Freijahre) to clear and sow new land (Bartlett 1993). An abstraction: cheap farms stand for the low start-up cost of these settlements. The Ostsiedlung also benefited the neighbouring rulers who invited the settlers, but the team-bonus slot goes to the miners (see the team bonus)."
relevance = "The Ostsiedlung moved the German-speaking frontier from the Elbe to the Baltic and the Carpathians and reshaped the map of Central Europe for seven centuries."

[[bonus]]
text = "Town Centers +10 garrison capacity; Towers +5 garrison capacity"
kind = "military"
level = 1
change = "kept"
precedent = "Town Centers +10 garrison capacity; Towers +5 garrison capacity (Teutons); the Anglo-Saxons’ design takes the Town Center half"
basis = "The tradition starts with Henry I’s burgs: during the truce with the Magyars (926–933) he had fortified refuges (urbes) built and ordered that one in nine of the agrarii milites live in them permanently, that a third of the harvest be stored there and that councils, gatherings and feasts be held there (Widukind I.35); in the marches between the Saale and the Elbe the later burgwards, districts grouped around a fort, served for defence, administration and tithes. The German lands went on to have one of the densest networks of castles in Europe (estimates run to more than ten thousand Burgen) and hundreds of walled towns, where the people of the countryside took refuge in war; the Teutonic Order ruled Prussia and its share of Livonia from convent-castles, brick in Prussia and stone in Livonia, each held by a convent of brothers with their men-at-arms. Henry I’s burgs (926–933) stay as the root of this passive: the Town Center slot goes to the Golden Bull, the weightier state moment (level-1 review, section 3.1), and whether Henry issued a systematic ordinance is debated (Bachrach 2012; see contested)."
relevance = "The castle and the walled town are the defining features of the German medieval landscape and the root of the civ’s ‘Defensive’ label; the burgs let Henry I’s young kingdom withstand the Magyar raids and defeat them at Riade (933)."

[[bonus]]
text = "Infantry and Mounted Units +1/+2 melee armor in Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Infantry and Mounted Units +1/+2 melee armor in Castle/Imperial Age (Teutons); the English design narrows it to the Militia-line"
basis = "Nuremberg, Augsburg and Landshut were among the great armour-making centres of 15th-century Europe (‘Gothic’ plate; the Helmschmid workshop of Augsburg worked for Maximilian I), and Passau and Solingen blades were exported widely. The link is strongest for the Imperial Age."
relevance = "German plate armour was an export industry and a European byword; the heavily armoured German knight and Landsknecht are part of the civ’s identity."

[[bonus]]
text = "Units more resistant to conversion"
kind = "military"
level = 1
change = "changed"
replaces = "Murder Holes, Herbal Medicine free (its slot; the effect is the game’s Teutons team bonus, Units more resistant to conversion, moved to a passive)"
precedent = "Units more resistant to conversion (Teutons team bonus; also the Inca design’s team bonus): the same effect as a passive. The Lithuanians’ design also makes it a passive, on a different reading (faith); the Burgundians’ design gives the same resistance to the Knight-line and Coustilliers through a tech (Order of the Golden Fleece), and the game’s First Crusade (Sicilians) includes it."
basis = "The German sketch (recorded in the level-1 review, section 9) moves the game’s team bonus to a passive: it benefited only the civ, so it cannot stay a team bonus (RULES 6.2). The reading is commitment by vow and by service to the Church. The Order’s brother-knights were professed religious, bound by vows of poverty, chastity and obedience under a rule confirmed by Innocent III in 1199, and fought a crusade preached and renewed for two centuries (Christiansen 1997; Urban 2003). Beyond the Order, German armies were bound to the Church and the crusade: most of the armoured horsemen Otto II summoned to Italy in 981 were owed by bishoprics and abbeys (Indiculus loricatorum; Leyser 1979; Reuter 1991); German kings led or sent great crusading hosts (Conrad III in 1147, Frederick I in 1189–90, Henry VI’s crusade of 1197–98, during which the Order became a military order, Frederick II in 1228–29); and the Baltic crusades of the 13th century drew most of their crusaders from the Empire. The mounted Teutonic Knight, on the Crusader Knight model, cannot be converted at all, so a passive narrowed to it would do nothing; the civ-wide passive serves the rest of the army."
relevance = "Without its professed brethren and their vows the Order would not exist, and the imperial Church and the crusade shaped German warfare from the Ottonians to Grunwald."
contested = "The game’s conversion is a change of allegiance, and a civ-wide passive stretches the vows of a few hundred brethren and the crusade vow over every German soldier: an abstraction. The Lithuanians’ design reads the same effect as a people holding to its faith; the two readings differ (vows against faith)."

[[bonus]]
text = "Monks +100% healing range"
kind = "other"
level = 1
change = "kept"
precedent = "Monks +100% healing range (Teutons)"
basis = "According to the Order’s own foundation account (Narratio de primordiis ordinis Theutonici), it began as a field hospital set up by burghers of Bremen and Lübeck at the siege of Acre (1190) and became a military order only in 1198; its full name remained the Hospital of St Mary of the Germans, its Grand Hospitaller was one of its great officers, and in 1234 it took over St Elisabeth’s hospital at Marburg. Monastic and town medicine add to it: Hildegard of Bingen’s medical writings (12th century) and the Holy Spirit hospitals (Heilig-Geist-Spitäler) of many German towns from the 13th century. Kept as the fifth passive beside the four of the German sketch."
relevance = "Care of the sick was the Order’s founding purpose and stayed in its name and rule; without it the Order’s identity would be different."

[team_bonus]
text = "Natural gold sources last +15% longer"
level = 1
change = "new"
replaces = "Units more resistant to conversion (now a passive)"
precedent = "Natural gold sources last +15% longer (Muisca team bonus; the Muisca design replaces it, so in the codex only the Germans hold it)"
basis = "Bergrecht, the German sketch’s team bonus: German miners opened and ran mines all over Central Europe: Rammelsberg near Goslar (silver, traditionally from 968) and Freiberg (1168) at home, then Jihlava and Kutná Hora in Bohemia, Kremnica and Banská Štiavnica in Hungary, and Novo Brdo in Serbia, carrying the mining law of Freiberg and Jihlava with them; their drainage adits and shaft techniques kept deep mines working (Bartlett 1993; Agricola codified this knowledge in De re metallica, 1556). Mines ‘lasting longer’ abstract deeper and longer exploitation, not larger ore bodies. As a team bonus it reflects German mining expertise working for the neighbours (RULES 6.2: transferred techniques). Three other German traits also benefited neighbours, the Ostsiedlung (here the Farms passive), the Hanse’s trade (the Dock tech) and printing (an N2 idea); a civ has one team bonus, and the miners keep it, as the German sketch has it."
relevance = "German mining made Central Europe the silver and gold supplier of the continent and spread German law and settlers; it benefited Bohemia, Hungary and Serbia as much as the Empire."

[[unique_unit]]
name = "Teutonic Knight"
model = "Crusader Knight"
building = "Castle"
level = 2
change = "changed"
replaces = "Teutonic Knight (Infantry): slow infantry with exceptional melee armor, resistant to conversion"
stats = "Teutonic Knight (Castle, Castle Age): 100 HP, 12 attack, 4/2 armour, speed 1.2, reload 2.0 s, 70 food and 70 gold, train time 20 s; no bonus damage; cannot be converted (the model’s property). Elite Teutonic Knight (the game’s Elite Teutonic Knight upgrade at the Castle, Imperial Age, 950 food and 500 gold, which stays in the tree and now leads to this tier): 130 HP, 14 attack, 6/3 armour, the other values unchanged."
basis = "The brother-knights of the Order fought mounted, as heavy cavalry: at Durbe (1260) and at Grunwald (1410) a few hundred brothers per campaign led sergeants, guest crusaders and Prussian auxiliaries (Christiansen 1997; Urban 2003); making them infantry inverted their role and fitted at most dismounted knights in sieges and garrisons. Owner’s decision: the model is the Scenario Editor Crusader Knight (Dawn of the Dukes), a mounted knight in the white mantle with the black cross of the Teutonic Order that cannot be converted (RULES section 5), which keeps the old unit’s resistance to Monks for the professed brethren. It is trained at the Castle from the Castle Age, like other unique units. Its stats are adapted (level 2, RULES section 5; see stats). The model’s campaign values (codex/tools/scenario-units-stats.md: 100 HP, 18 attack, 4/4 armour, speed 1.2, 80 food and 50 gold, no bonus damage and no Elite version) would put its attack above that of every mounted melee unit in the game (Paladin 14, Elite Leitis 16), beyond the class ceiling of RULES 6.16.11, and let it outclass the Knight (100 HP, 10 attack, 2/2 armour, speed 1.35, 60 food and 75 gold) in the Castle Age for less gold, an absurdity of the kind RULES 6.14 rules out. The adapted values are anchored on the Boyar (100 HP, 12 attack, 4/2 armour, speed 1.3, 60 food and 70 gold) and the Elite Boyar (130 HP, 14 attack, 8/3 armour), the game’s heavy cavalry with exceptional melee armour. The unit keeps the model’s slower speed (1.2), for the brethren’s heavy warhorses (Ekdahl 1998), and its immunity to conversion, for which it pays 10 more food than the Boyar. Its Elite melee armour is 2 below the Elite Boyar’s, so that with the Germans’ melee-armour passive (+2 in the Imperial Age) it matches the Elite Boyar’s 8 and with the barding upgrades reaches 11/7, as a fully upgraded Elite Boyar does, while its 14 attack (18 with the Blacksmith) equals the Paladin’s: no value goes beyond the class ceiling. The Elite tier, which the model lacks, keeps the brethren’s unit worth training in the Imperial Age, where the Paladin would otherwise outclass it; it uses the game’s Elite Teutonic Knight upgrade, the Castle upgrade of the unit this one replaces. The game’s Castle Age Teutonic Knight had 90 HP, 14 attack and 7/2 armour for 85 food and 30 gold, at speed 0.8. The in-game role of the adapted unit must still be checked in the game. The Boyar stays with the Rus' and the Lithuanians. The name also belongs to a different game unit, the infantry Teutonic Knight, which this design replaces: a reused name, allowed with a note on the site (RULES 6.16.15); the site keys units by model."
relevance = "The brother-knights were the best-known German soldiers of the period and the core of the Order’s state; the mounted knight was the elite of German armies for four centuries."

[[unique_unit]]
name = "Landsknecht"
model = "Heavy Pikeman"
building = "Barracks"
age = "Imperial"
level = 2
change = "new"
stats = "Landsknecht (Barracks, Imperial Age; no Elite tier): 80 HP, 8 attack, 0/1 armour, speed 1.0, reload 3.0 s, 50 food and 35 gold, train time 20 s; +28 against cavalry, +25 against war elephants, +20 against camels and +16 against ships, the model’s minor bonuses otherwise unchanged."
basis = "From about 1486–87 Maximilian I, King of the Romans, raised German foot on the Swiss model, the Landsknechte: a block of pikemen, with halberdiers and two-handed swordsmen (the double-pay Doppelsöldner) in the front ranks and, more and more, handgunners. Captains recruited them under contract, mustered them, swore them to articles of war and paid them by the month, so that a prince with money could raise thousands of foot within weeks; within a few years they fought for Maximilian in the Low Countries, in Hungary (1490) and in Italy (1496), and other princes hired them too (Baumann 1994). Not a late element (RULES section 2): the Landsknechte originate inside the window, in its last fifteen years. As a troop of the 1480s–90s the design makes the unit available only in the Imperial Age, a design choice rather than a requirement of section 2. Owner’s decision: the Landsknecht is a unit. The model is the Scenario Editor Heavy Pikeman (The Forgotten), a pikeman with its own look, whose art is edited from the Pikeman’s, and its stats are adapted (level 2, RULES section 5; see stats). As it is, the model has the Pikeman’s values with +20 HP and +2 against cavalry (codex/tools/scenario-units-stats.md: 75 HP, 4 attack, 0/0 armour, speed 1.0, 35 food and 25 wood, +24 against cavalry, +25 against war elephants, +18 against camels and +16 against ships), which would make the civ’s second unique unit weaker in its own role than the Halberdier the Germans train beside it at the same cost (60 HP, 6 attack, +32 against cavalry), an absurdity of the kind RULES 6.14 rules out. The adapted values are anchored on the Elite Kamayuk, the game’s long-spear unique infantry (80 HP, 8 attack, 1/1 armour), and on the Halberdier’s bonus table: 36 damage per hit against cavalry (8 + 28) stays just below the Halberdier’s 38, while the higher base attack renders the halberds and two-handed swords of the double-pay men in the front ranks, the first to meet the enemy’s pikes; the unit has no bonus against the Spearman-line, which no melee unit in the game has. The measure is the game’s anti-cavalry infantry (RULES 6.16.11), checked fully upgraded: the base armour is 0/1, so that with the Germans’ melee-armour passive (+2 in the Imperial Age, the only age in which the unit exists) and the Blacksmith’s infantry armour (+3/+4) it reaches 5/5, the melee armour of the Teutons’ fully upgraded Halberdier (0 + 2 + 3) and of the Incas’ Elite Kamayuk with Fabric Shields (1 + 3 + 1), with a pierce armour below the latter’s 6 (1 + 4 + 1); its 80 HP and its fully upgraded 12 attack (8 + 4) equal the Elite Kamayuk’s. No value goes beyond what the game gives anti-cavalry infantry. The cost is that of the game’s Condottiero, its Imperial Age mercenary infantry at the Barracks (50 food and 35 gold), for foot paid by the month: a tougher pikeman paid in gold, so a choice beside the Halberdier rather than a strict upgrade. Its in-game role must still be checked in the game. Trained at the Barracks, as mustered foot rather than a castle garrison, as the game’s Condottiero is for the Italians’ allies (Condottiero available at the Barracks in Imperial Age, Italians team bonus, which the Italians’ design replaces with the Genoese Crossbowman). The model has no Elite version, and the unit, which arrives only in the Imperial Age, has no Elite tier either, like the game’s Condottiero."
relevance = "The Landsknechte were the German answer to the Swiss pike: inside the window they fought in the Low Countries, in Hungary (1490), in Italy (1496) and in the Swabian War (1499), which the Swiss won (Dornach). Their greatest fame, as the most widely hired infantry of Europe (Pavia, 1525), lies after the window, which RULES section 2 allows for an element that originated inside it."
contested = "Origins: Maximilian’s German and Flemish pike foot already fought in the Swiss manner in his Burgundian wars, at Guinegate (1479) with Maximilian and his nobles on foot among the pikemen, so the date of the first Landsknecht companies proper, about 1486–87 in Baumann (1994), marks a gradual formation rather than a founding act. Choice of model, compared by look, role and stats: every pike or sword model sits close to a generic unit, so the choice rests on weapon, look and role, and the stats are adapted in any case (see stats). The Condottiero (by its icon a plumed, armoured swordsman with a shield; in the game the Italians’ Imperial Age mercenary infantry: 80 HP, 10 attack, +10 against gunpowder units, fast) is stronger, but its sword and shield and its anti-gunpowder role misrepresent a pike-and-shot block; the model is free in the codex, since the Italians’ design drops the unit (the condottiero was a captain, not a soldier type), but its look stays that of an Italian swordsman. The Halberdier (a generic armoured soldier with a halberd: 60 HP, 6 attack, +32 against cavalry) is the strongest pike model, but a unique unit on it would be the very unit the Germans already train, look included, while the Heavy Pikeman at least looks different. The Two-Handed Swordsman (a generic armoured soldier with a two-handed sword: 65 HP, 12 attack, 1/1 armour) carries the Doppelsöldner’s weapon, but the two-handed sword was the weapon of a minority in the front ranks, and it too is a generic unit the civ has. The Scenario Editor Heavy Swordsman uses the art of the original Age of Empires’ Broad Swordsman, an ancient look, and is weaker than the Two-Handed Swordsman in attack and armour despite more hit points (75 HP, 7 attack, 0/0 armour). The Heavy Pikeman has the right weapon and role, and its adapted stats give it the strength the model lacks."

[[unique_tech]]
name = "Ministerialen"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Stables work +20% faster"
level = 2
change = "new"
replaces = "Crenellations (Castles +3 range, garrisoned Infantry fires arrows)"
precedent = "Stables work +20% faster (Huns team bonus; the Avars’ design keeps it as its team bonus), as a tech for the civ alone, in the Castle Age, later than the game’s team bonus (RULES 6.16.11); the Castilians’ design uses the same effect for its Caballería de Cuantía"
basis = "The ministeriales were unfree knights: legally the servants of a lord, bound by written service customs (Dienstrechte, the earliest Bamberg’s of the mid-11th century), yet armed, enfeoffed with service fiefs and employed as household knights, castellans and officials. By the later 12th century they made up most of the knighthood of the German kings, bishops and princes, at once unfree and noble, professional warriors in a kingdom where violence for political ends prevailed (Arnold 1985); the Salians and the Staufen built their power on the imperial ministeriales (Reichsministerialen), who held royal castles and estates (Bosl 1950–51), and one of them, Markward of Annweiler, was a leading commander of Henry VI’s conquest of the Kingdom of Sicily (1194). Faster Stables abstract a lord’s own hereditary household of knights, raised and replaced without bargaining with free vassals. The kingdom’s own knighthood had no element in the game’s design; the tech takes the Castle slot of Crenellations (see [[dropped]]), while the Landsknechte are a unit rather than a tech. A new tech (level 2): no existing unique tech renders an unfree knighthood."
relevance = "The ministeriales were the bulk of German knighthood in the High Middle Ages and the instrument of Salian and Staufen royal power; their rise from servitude into the lesser nobility set German knighthood apart from that of its western neighbours."
contested = "Whether the ministeriales formed a distinct estate or were simply knights of unfree origin, and when they merged into the lesser nobility (13th–14th centuries), is debated (Bosl; Arnold 1985)."

[[unique_tech]]
name = "Golden Bull"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Gold and stone miners work +15% faster"
level = 2
change = "new"
precedent = "Gold miners work +20% faster (Magyars) and Stone miners work +20% faster (Koreans), combined at +15% as a Town Center tech"
basis = "Effect revised on 18 October 2026 at the owner’s request: the earlier cheaper Imperial Age advance only discounted a one-time purchase, paid for with Town Center time. Chapters IX and X of the Golden Bull granted the electors the regalian rights over every mine (gold, silver, tin, copper, lead, iron) and salt in their lands and the right to coin money, which the faster miners render. The Golden Bull of Charles IV, issued at the diets of Nuremberg (January 1356) and Metz (December 1356), fixed the election of the King of the Romans, who was still to be crowned emperor, by seven electors (the archbishops of Mainz, Cologne and Trier, the King of Bohemia, the Count Palatine of the Rhine, the Duke of Saxony and the Margrave of Brandenburg) by majority vote at Frankfurt, made the secular electorates indivisible, confirmed the electors’ regalian rights (mines, tolls, coinage) and banned urban leagues; it remained a fundamental law of the Empire until 1806 (Golden Bull, ed. Fritz 1972; Scales 2012; Wilson 2016). It fixed the procedure to prevent double elections such as those of 1198, 1257 and 1314, the wars between rival kings that followed the first and the last (Philip of Swabia against Otto IV; Louis IV against Frederick the Fair, to Mühldorf, 1322), and rival kingships such as Charles IV’s own election at Rhens (1346) against Louis IV. It did not end every dispute (Wenceslas deposed in 1400; the double election of 1410, see contested), but from 1411 the elections followed it until the Empire’s end. A cheaper advance to the Imperial Age stands for a settled royal election, the gateway to the imperial crown: an abstraction, and the link with the game’s ‘Imperial’ Age is a play on the word. Henry I’s burgs (926–933), the other candidate, stay as the root of the garrison passive: the Town Center slot goes to the Golden Bull, the weightier state moment (level-1 review, section 3.1), and whether Henry issued a systematic ordinance is debated (Bachrach 2012). Tigui’s effect (Town Centers fire arrows without garrison) stays with the Italians’ Comune. A state constitution, so at the Town Center (RULES 6.2); Castle Age, so that it precedes the advance it eases. A new tech (level 2): no existing unique tech renders an electoral constitution."
relevance = "The Golden Bull was a fundamental law of the Empire until 1806: it fixed the electoral college that shaped German politics for four and a half centuries."
contested = "How far the Bull strengthened the princes at the crown’s expense or mainly recorded existing practice (the electors’ declaration of Rhens, 1338, that a king chosen by them needed no papal approval) is debated, and so is how far it settled the succession: in 1400 four electors deposed Wenceslas and elected Rupert, which Wenceslas never accepted, and in 1410 Sigismund and Jobst of Moravia were elected in rival elections while Wenceslas still claimed the crown, until Jobst’s death and Sigismund’s re-election in 1411 (Scales 2012; Wilson 2016)."

[[unique_tech]]
name = "Hanse"
building = "Dock"
kind = "civil"
age = "Castle"
effect = "Trade Cogs generate +25% gold; Hulk-line +20% HP"
level = 2
change = "new"
replaces = "Ironclad (Siege Weapons +4 melee armor)"
precedent = "Effect 1: Trade Units generate +25% gold (Spanish team bonus; the Castilians’ and Mongols’ team bonus in their designs, and the Tatars’ Tamga as a Town Center tech), narrowed to Trade Cogs, as the Japanese design’s team bonus and the Malay design’s passive narrow it at lower magnitudes; effect 2: Longships and Catapult Galleons +20% HP (Saxons; the Anglo-Saxons’ design narrows it to Longships), with the Hulk-line as the target"
basis = "The Hanse (c. 1250–1500; first general diet 1356) linked Lübeck, Hamburg, Cologne, Danzig and dozens of other German towns, with Kontore at Novgorod, Bergen, London and Bruges; its cogs and later hulks (the ship type that gives the game’s Hulk-line its name) also fought: the towns’ Cologne Confederation forced Denmark to the Peace of Stralsund (1370), the Teutonic Order took Gotland from the Victual Brothers in 1398, and the towns fought England at sea in 1470–74 (Dollinger 1964). Its trade also served its partners, as the Rus’, Norwegians’, Swedes’, Danes’ and Lithuanians’ designs note (furs, stockfish, copper and iron, herring and wax sold to Hanseatic merchants), but a civ has one team bonus and the German sketch gives it to the miners (see the team bonus); as a datable institution the Hanse becomes a unique tech (RULES 6.2). At the Dock, as in the German sketch, because its power rested on its ships; the effect is narrowed to sea trade. Ironclad is dropped: it is the mid-19th-century term for armoured warships (La Gloire 1859, Monitor 1862), and covering siege engines with hides and boards was universal."
relevance = "The Hanse dominated the trade of northern Europe for three centuries and is one of the best-known German institutions of the Middle Ages."
contested = "How far the Hanse served or exploited its partners is debated: it gave them a market and credit, but it enforced its privileges with embargoes (Norway 1284, Flanders 1358) and wars (Denmark 1367–70, England 1470–74), and it held its Kontore at Bergen and Novgorod on terms that local merchants resented (Dollinger 1964)."

[tree]
add = ["Arbalester", "Light Cavalry", "Architecture", "Treadmill Crane", "Gold Shaft Mining", "Dry Dock", "Shipwright"]
remove = ["Siege Onager", "Siphons"]

[tree.basis]
"Arbalester" = "Crossbowmen were central to the Order’s garrisons and arsenals in Prussia (Ekdahl 1998) and to the urban militias of the German towns, whose shooting guilds (Schützengilden) appear from the 14th century. The Germans already have the Heavy Mounted Crossbowman; the foot upgrade completes the crossbow line."
"Light Cavalry" = "The Order used native Prussian light horsemen, riding the small native horses beside the brothers’ heavy warhorses, on its raids (Reisen) through the wilderness against Lithuania (Ekdahl 1998; Christiansen 1997)."
"Architecture" = "Romanesque Speyer, Gothic Cologne, the brick Gothic of the Baltic towns and the Order’s castles (Marienburg) make the absence hard to justify for a defensive civilization."
"Treadmill Crane" = "The medieval treadwheel crane is almost a German emblem: the crane of Cologne cathedral stood on the unfinished south tower from the 15th century until 1868, and the Krantor of Danzig (1442–44) was built under the Order."
"Gold Shaft Mining" = "Germany was the mining heart of medieval Europe (Rammelsberg, Freiberg, the Harz and the Erzgebirge, Schwaz in Tyrol) (Bartlett 1993); lacking the late mining upgrade contradicted that."
"Dry Dock" = "Navy (RULES 6.16.1): a fleet of ships, resting on the Hanse’s cogs and hulks and later carvel-built ships, which dominated the Baltic and the North Sea, defeated Denmark (1367–70) and carried the Order to Gotland (1398) (Dollinger 1964); a weak navy contradicted this. The Galleon stays as a flagged abstraction (RULES 6.16.2), and the Carrack and Fast Fire Ship as generic tiers that a fleet of ships keeps (RULES 6.16.1). The Cannon Galleon stays for a documented gun-armed Hanseatic warship: the great caravel Peter von Danzig, a French ship left at Danzig in 1462 and taken over by the town, was fitted out with guns for the Hanse’s war against England (1470–74), cruised the North Sea in 1471–73 and under Paul Beneke took a galley carrying Memling’s Last Judgment (1473) (Możejko 2020). Danzig was then a city of the Polish crown (from 1454, confirmed in 1466), and the ship served the Hanse’s war rather than the crown’s, so it counts for the Hanse first; the Poles’ design also cites it for Gdańsk, a city of the crown (shared evidence, RULES 6.7)."
"Shipwright" = "The Hanseatic towns built their own cogs and hulks in town shipyards (the Lastadie of Lübeck and Danzig), and the hulk and the carvel-built ship were adopted in the Baltic in the 15th century (Dollinger 1964); the Dock upgrade completes the Hanseatic navy."
"Siege Onager" = "Removed to offset the additions. There is no specific German basis for the top tier of the stone-thrower line (held by only 15 of the game’s 56 civs); the Germans keep the Onager, Capped Ram, Trebuchet and Bombard Cannon."
"Siphons" = "Named after the Byzantine fire siphon, a state secret never given to other nations (De Administrando Imperio 13); no ship-borne liquid-fire weapon is documented for this civ."

[architecture]
set = "Central European"
change = "kept"
basis = "The Central European set is the one modelled on the German lands: Romanesque and Gothic churches, timber-framed and brick town houses. The Bohemians, Poles and Magyars join it in this redesign, on the criterion of historical fit (RULES 6.16.8): they too built in Latin Romanesque and Gothic, with towns under German law (Peter Parler’s workshop in Prague, Veit Stoss in Kraków)."

[[dropped]]
item = "Murder Holes, Herbal Medicine free"
kind = "bonus"
reason = "Fails the relevance test (RULES 6.9): both techniques were common to all of Latin Europe, so the bonus is flavour rather than a distinctive trait. Monastic medicine (Hildegard of Bingen) is carried by the Monks’ healing bonus. Its slot goes to conversion resistance, moved from the team bonus."

[[dropped]]
item = "Crenellations (Castles +3 range, garrisoned Infantry fires arrows)"
kind = "unique_tech"
reason = "Fails RULES 6.2 and 6.9. Castle density is a structural trait and is already the garrison passive; what remained for a datable tech was one architectural feature (battlements, found everywhere) and one siege. Even that siege does not support the effect: Marienburg held for some eight weeks in 1410 (26 July to 19 September) because of Heinrich von Plauen’s leadership, the besiegers’ lack of a heavy siege train, disease and the Lithuanians’ departure, not because of its battlements (Urban 2003). The Castle slot goes to the Ministerialen, the kingdom’s own knighthood; the Order’s convent-castles stay in the garrison passive."

[[dropped]]
item = "Ironclad (Siege Weapons +4 melee armor)"
kind = "unique_tech"
reason = "An anachronistic name (the armoured warships of 1859–62) for a generic practice (covering engines with hides and boards). Its slot goes to the Hanse. The effect stays in the codex as the Bulgarians’ Krum’s Siege Train (Ironclad renamed, level 1), and the Bohemians’ Wagenburg Tactics narrows it to Hussite Wagons."
