civ = "Teutons"
name = "Germans"
original_name = "Teutons"
status = "draft"
label = "Cavalry and Defensive civilization"
summary = "Teutons renamed Germans: the Teutonic Knight becomes the mounted brother-knight, German miners the team bonus and Henry I’s burgs the Town Center tech, the Hanse and the Landsknechte replace Ironclad and Crenellations, Gutenberg's Press joins, and the tree gains Arbalester and Architecture."
ideas = [
  "N2: Give the mounted Teutonic Knight its own data (slow heavy cavalry with very high melee armour and extra resistance to conversion) instead of borrowing the Boyar’s stats.",
  "N2: A Landsknecht unit for the Barracks in the Imperial Age (pike and two-handed sword, a small bonus against the Spearman-line), beside the N1 Landsknechte tech.",
  "N2: Reichskirche: Knight-line trainable at the Monastery, after the Indiculus loricatorum (981), in which most of the armoured horsemen Otto II summoned to Italy were owed by bishoprics and abbeys (Leyser 1979; Reuter 1991). A building-trains-unit effect exists (Mapuche Settlements), but a Monastery training cavalry is a new pairing.",
  "N2: Bergrecht as a separate economic tech at the Mining Camp (Gold and Stone Miners work faster) if the team bonus proposed here is not accepted.",
  "N3: Proper art for the mounted Teutonic Knight (white mantle with black cross) and a cog/hulk model for the Hanseatic ships.",
  "N3: Old Prussians and the other Baltic peoples fought by the Order (Prussians, Curonians, Semigallians, Estonians) have no civ; at most a variant or campaign faction.",
]
contested = [
  "When ‘Germany’ begins: 843 (Verdun), 911/919, or only in the 11th–12th centuries (Brühl, Ehlers, Reuter); and how far the name regnum Teutonicorum, mostly an Italian and papal usage that Gregory VII turned against Henry IV’s Roman title, reflected the kingdom’s own sense of itself (Müller-Mertens 1970).",
  "The nature of Ottonian armies: dominated by heavy cavalry (Leyser) or mixed forces with strong infantry and siege capacity (Bernard and David Bachrach).",
  "Whether Henry I issued a systematic ‘Burgenordnung’ (a term of modern historians) and what Widukind meant by agrarii milites.",
  "How distinctive the Ottonian and Salian ‘imperial church system’ was: the older view of a deliberate royal system against Reuter’s reconsideration (1982).",
  "Whether the Order’s hospital at Acre (1190) continued the older German hospital in Jerusalem (c. 1127, placed under the Hospitallers in 1143); the Order’s own foundation account presents it as a new foundation.",
  "The scale and significance of the Battle on the Ice (1242): the Soviet/Russian tradition against the minimalist reading of Fennell, Christiansen and Urban, based on the Livonian Rhymed Chronicle.",
  "The late Empire as ‘fragmentation and failure’ (Prussian national historiography) or as a functioning political system (Whaley, Wilson).",
]
open_questions = [
  "Label: ‘Infantry and Defensive’ becomes ‘Cavalry and Defensive’, because heavy cavalry was the elite arm of German armies from the 10th to the 14th century and the Order’s brothers fought mounted. Infantry keeps a place (the melee-armour bonus, Champion, and the Landsknechte tech for the foot of the late 15th century). Keep ‘Cavalry and Defensive’ or return to ‘Infantry and Defensive’?",
  "Teutonic Knight: changed from infantry to cavalry on the Boyar model, the foot version dropped. In N1 it has the Boyar’s stats, like the Rus' Boyar and the Lithuanians’ Boyar (the boyar banners the Order met at Grunwald); the conversion-resistance passive is what sets it apart. Accept, keep the foot Teutonic Knight until the N2 unit, or keep it as a second unique unit for dismounted knights in siege and garrison?",
  "Conversion resistance: the game’s civ-wide team bonus cannot stay a team bonus (RULES 6.2: it benefited only the civ), and as a civ-wide passive it would stretch the vows of a few hundred professed brethren over the whole kingdom, so it is narrowed to the Teutonic Knight and takes the slot of ‘Murder Holes, Herbal Medicine free’. Keep this passive, or give the slot to another German trait?",
  "Town Center tech: Henry I’s burgs reuse Tigui (Town Centers fire arrows without garrison), renamed ‘Burgenordnung’ (level 1). The Italians’ Comune shares it too and the Malians’ design drops Tigui, so two civs hold it, each renamed (RULES 6.7 allows repeats). Historically the Golden Bull of 1356, which fixed the royal election by seven electors until 1806, is the stronger state moment of the German kingdom; it would need a new level-2 tech, and the choice of its effect is the owner’s. Keep Burgenordnung, or switch to a Golden Bull tech (or the Imperial Reform of 1495), with Henry I’s burgs staying as the root of the garrison passive?",
  "Team bonus: two more German traits benefited neighbours. The Ostsiedlung: Polish, Bohemian and Hungarian rulers invited German settlers under German law (ius Teutonicum, Magdeburg law); here it is a passive (Farms -40%). Printing, here a University tech: German printers set up the first presses of Italy (Subiaco 1465, Venice 1469), France (Paris 1470), Hungary and Poland (Buda and Kraków 1473). Keep the miners as the only team bonus, add one of these if civs may have two, or swap (printing would then leave the University)?",
  "Light Cavalry: the Order used native Prussian light horse on its raids into Lithuania. Add Light Cavalry to the tree (not done here, to keep the power budget)?",
  "Shipwright: the analysis also proposes it for the Hanseatic fleets; only Dry Dock is added here. Add Shipwright too?",
  "Shared parts (RULES 6.7): Farms -40% is also a passive in the Goths’ design, the Saxons’ design takes the Town Center half of the garrison bonus, Tigui is shared with the Italians’ Comune, Hanse’s trade effect is the game’s Spanish team bonus (kept by the Castilians, and also the Mongols’ team bonus and the Tatars’ Tamga in their designs), Landsknechte is the Goths’ Perfusion (dropped in their design), Gutenberg's Press has the effect of a Bengali passive and of half of the Georgians’ Gelati Academy, and the Teutonic Knight has the Boyar’s stats. Each repeat has a German basis, but much of the civ is built from shared parts. Acceptable?",
  "Composition: 5 passive bonuses + 4 unique techs = 9, the proposed cap (RULES 6.1). Keep Gutenberg's Press as the fourth tech, or move printing to the team-bonus question or to the ideas and stay at 8?",
  "Codex-wide question CQ18 (see codex/civs/README.md): Reused names (the mounted Teutonic Knight, on the Boyar model, and its Elite tier share their names with the game’s infantry Teutonic Knight).",
]

[profile]
entity = "The East Frankish, later German kingdom (regnum Teutonicorum in Italian and papal usage), the core of the Empire from 962, with German-speaking society beyond its old borders (towns, settlers, miners) and the German-recruited Teutonic Order and its state in Prussia and much of Livonia"
region = "German-speaking lands of the Empire, from both banks of the Rhine and the Alps to the North Sea and the Baltic, with Prussia and much of Livonia under the Teutonic Order"
window = "919–1500 (from the election of Henry I to the end of the time frame; the Teutonic Order in Prussia 1226/30–1525)"
sources = [
  "Widukind of Corvey, Res gestae Saxonicae (c. 967–973)",
  "Thietmar of Merseburg, Chronicon (c. 1012–1018)",
  "Indiculus loricatorum (981)",
  "Narratio de primordiis ordinis Theutonici (early 13th century)",
  "Peter of Dusburg, Chronicon terrae Prussiae (1326)",
  "Eckhard Müller-Mertens, Regnum Teutonicum (1970)",
  "Karl Leyser, Rule and Conflict in an Early Medieval Society (1979)",
  "Timothy Reuter, ‘The “Imperial Church System” of the Ottonian and Salian Rulers: a Reconsideration’, Journal of Ecclesiastical History 33 (1982)",
  "Timothy Reuter, Germany in the Early Middle Ages c. 800–1056 (1991)",
  "David S. Bachrach, Warfare in Tenth-Century Germany (2012)",
  "Benjamin Arnold, German Knighthood 1050–1300 (1985)",
  "Len Scales, The Shaping of German Identity: Authority and Crisis, 1245–1414 (2012)",
  "Robert Bartlett, The Making of Europe (1993)",
  "Philippe Dollinger, The German Hansa (1964; English translation 1970)",
  "Eric Christiansen, The Northern Crusades (2nd ed. 1997)",
  "William Urban, The Teutonic Knights: A Military History (2003)",
  "Lucien Febvre and Henri-Jean Martin, L’apparition du livre (1958)",
  "Elizabeth L. Eisenstein, The Printing Press as an Agent of Change (1979)",
  "Reinhard Baumann, Landsknechte (1994)",
  "Peter H. Wilson, Heart of Europe (2016); Joachim Whaley, Germany and the Holy Roman Empire (2012), relevant only from 1493",
]
replaces = "Teutons: the game’s blend of the Holy Roman Empire and the Teutonic Order, under the name of the ancient Teutones (RULES section 4)"

[[bonus]]
text = "Farms cost -40%"
kind = "economic"
level = 1
change = "kept"
precedent = "Farms cost -40% (Teutons); the Goths’ design copies it"
basis = "Read as the Ostsiedlung (12th–14th centuries): locators settled peasants east of the Elbe and in Silesia, Bohemia and Poland under ‘German law’ (ius Teutonicum), with standard holdings (Hufen), the heavy plough and several rent-free years (Freijahre) to clear and sow new land (Bartlett 1993). An abstraction: cheap farms stand for the low start-up cost of these settlements."
relevance = "The Ostsiedlung moved the German-speaking frontier from the Elbe to the Baltic and the Carpathians and reshaped the map of Central Europe for seven centuries."

[[bonus]]
text = "Town Centers +10 garrison capacity; Towers +5 garrison capacity"
kind = "military"
level = 1
change = "kept"
precedent = "Town Centers +10 garrison capacity; Towers +5 garrison capacity (Teutons); the Saxons’ design takes the Town Center half"
basis = "The German lands had one of the densest networks of castles in Europe (estimates run to more than ten thousand Burgen) and hundreds of walled towns, where the people of the countryside took refuge in war; the Teutonic Order ruled Prussia and its share of Livonia from convent-castles, brick in Prussia and stone in Livonia, each held by a convent of brothers with their men-at-arms. The datable start of this tradition, Henry I’s burgs of 926–933, is the Town Center tech."
relevance = "The castle and the walled town are the defining features of the German medieval landscape and the root of the civ’s ‘Defensive’ label."

[[bonus]]
text = "Infantry and Mounted Units +1/+2 melee armor in Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Infantry and Mounted Units +1/+2 melee armor in Castle/Imperial Age (Teutons); the Britons’ design narrows it to the Militia-line"
basis = "Nuremberg, Augsburg and Landshut were among the great armour-making centres of 15th-century Europe (‘Gothic’ plate; the Helmschmid workshop of Augsburg worked for Maximilian I), and Passau and Solingen blades were exported widely. The link is strongest for the Imperial Age."
relevance = "German plate armour was an export industry and a European byword; the heavily armoured German knight and Landsknecht are part of the civ’s identity."

[[bonus]]
text = "Teutonic Knights more resistant to conversion"
kind = "military"
level = 1
change = "changed"
replaces = "Murder Holes, Herbal Medicine free"
precedent = "Elephant Units receive -25% bonus damage and are more resistant to conversion (Bengalis), conversion part, with the Teutonic Knight as the target; Units more resistant to conversion (Teutons team bonus, now the Inca design’s team bonus). The Castilians’ design gives its military-order Freire the same resistance through a tech (Órdenes Militares)."
basis = "The brother-knights were professed religious: they took vows of poverty, chastity and obedience, lived in convents under a rule taken from the Templars and the Hospitallers (confirmed by Innocent III in 1199, with the Order’s own statutes compiled in the 13th century), and fought a crusade preached and renewed for two centuries (Christiansen 1997; Urban 2003). The game’s infantry Teutonic Knight was itself resistant to conversion; this passive keeps that trait for the mounted unit. The game’s conversion is a change of allegiance, so the bonus stands for religious commitment, not for a documented immunity. It narrows the game’s civ-wide team bonus, which cannot stay a team bonus under RULES 6.2 and as a civ-wide passive would stretch the vows of a few hundred brethren over the whole kingdom."
relevance = "Without its professed brethren and their vows the Order would not exist; the brother-knights were its core and its fighting elite."

[[bonus]]
text = "Monks +100% healing range"
kind = "other"
level = 1
change = "kept"
precedent = "Monks +100% healing range (Teutons)"
basis = "According to the Order’s own foundation account (Narratio de primordiis ordinis Theutonici), it began as a field hospital set up by burghers of Bremen and Lübeck at the siege of Acre (1190) and became a military order only in 1198; its full name remained the Hospital of St Mary of the Germans, its Grand Hospitaller was one of its great officers, and in 1234 it took over St Elisabeth’s hospital at Marburg. Monastic and town medicine add to it: Hildegard of Bingen’s medical writings (12th century) and the Holy Spirit hospitals (Heilig-Geist-Spitäler) of many German towns from the 13th century."
relevance = "Care of the sick was the Order’s founding purpose and stayed in its name and rule; without it the Order’s identity would be different."

[team_bonus]
text = "Natural gold sources last +15% longer"
level = 1
change = "new"
replaces = "Units more resistant to conversion"
precedent = "Natural gold sources last +15% longer (Muisca team bonus; the Muisca design replaces it, so in the codex only the Germans hold it)"
basis = "German miners opened and ran mines all over Central Europe: Rammelsberg near Goslar (silver, traditionally from 968) and Freiberg (1168) at home, then Jihlava and Kutná Hora in Bohemia, Kremnica and Banská Štiavnica in Hungary, and Novo Brdo in Serbia, carrying the mining law of Freiberg and Jihlava with them; their drainage adits and shaft techniques kept deep mines working (Bartlett 1993; Agricola codified this knowledge in De re metallica, 1556). Mines ‘lasting longer’ abstract deeper and longer exploitation, not larger ore bodies. As a team bonus it reflects German mining expertise working for the neighbours (RULES 6.2: transferred techniques)."
relevance = "German mining made Central Europe the silver and gold supplier of the continent and spread German law and settlers; it benefited Bohemia, Hungary and Serbia as much as the Empire."

[[unique_unit]]
name = "Teutonic Knight"
model = "Boyar"
building = "Castle"
level = 1
change = "changed"
replaces = "Teutonic Knight (Infantry): slow infantry with exceptional melee armor, resistant to conversion"
basis = "The brother-knights of the Order fought mounted, as heavy cavalry: at Durbe (1260) and at Grunwald (1410), a few hundred brothers per campaign led sergeants, guest crusaders and Prussian auxiliaries (Christiansen 1997; Urban 2003). The Boyar profile (cavalry with exceptional melee armour, weak against the Spearman-line and Monks) is the closest existing match; making them infantry inverted their role and fitted at most dismounted knights in sieges and garrisons. The conversion-resistance passive gives back the old unit’s resistance to Monks. The Boyar model is shared with the Rus' and Lithuanian Boyars. The name also belongs to a different game unit, the infantry Teutonic Knight (its own model), which this design replaces; the site keys units by model."
relevance = "The brother-knights were the best-known German soldiers of the period and the core of the Order’s state; the mounted knight was the elite of German armies for four centuries."

[[unique_tech]]
name = "Burgenordnung"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Town Centers fire arrows without garrison"
level = 1
change = "new"
precedent = "Tigui (Town Centers fire arrows without garrison) (Malians): an existing unique tech, moved to the Town Center, shared and renamed with an identical effect; the Italians’ Comune shares it too, and the Malians’ design drops Tigui, so two civs hold it, each renamed"
basis = "During the truce with the Magyars (926–933) Henry I had fortified refuges (urbes) built and ordered that one in nine of the agrarii milites live in them permanently, that a third of the harvest be stored there and that councils, gatherings and feasts be held there (Widukind I.35): the burgs were seats of assembly and supply as well as of defence. In the marches between the Saale and the Elbe the later burgwards, districts grouped around a fort, served for defence, administration and the collection of tithes. A permanent garrison is what lets the Town Center shoot without villagers inside. Castle Age, Tigui’s original age, rather than Feudal."
relevance = "The burgs let Henry I’s young kingdom withstand the Magyar raids and defeat them at Riade (933), the start of the defence that culminated at the Lechfeld (955)."
contested = "‘Burgenordnung’ is a modern historians’ name; whether Henry issued a systematic ordinance, and who the agrarii milites were, is debated (Bachrach 2012)."

[[unique_tech]]
name = "Hanse"
building = "Market"
kind = "civil"
age = "Castle"
effect = "Trade Units generate +25% gold; Hulk-line +20% HP"
level = 2
change = "new"
replaces = "Ironclad (Siege Weapons +4 melee armor)"
precedent = "Effect 1: Trade Units generate +25% gold (Spanish team bonus; kept by the Castilians’ design, and also the Mongols’ team bonus and the Tatars’ Tamga in their designs); effect 2: Longships and Catapult Galleons +20% HP (Saxons)"
basis = "The Hanse (c. 1250–1500; first general diet 1356) linked Lübeck, Hamburg, Cologne, Danzig and dozens of other German towns, with Kontore at Novgorod, Bergen, London and Bruges; its cogs and later hulks (the ship type that gives the game’s Hulk-line its name) also fought, and the towns forced Denmark to the Peace of Stralsund (1370). The Teutonic Order took part in the Hanse with its Prussian towns and conquered Gotland from the Victual Brothers in 1398 (Dollinger 1964). Ironclad is dropped: it is the mid-19th-century term for armoured warships (La Gloire 1859, Monitor 1862), and covering siege engines with hides and boards was universal."
relevance = "The Hanse dominated the trade of northern Europe for three centuries and is one of the best-known German institutions of the Middle Ages."

[[unique_tech]]
name = "Landsknechte"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Barracks work +100% faster"
level = 1
change = "new"
replaces = "Crenellations (Castles +3 range, garrisoned Infantry fires arrows)"
precedent = "Perfusion (Barracks work +100% faster) (Goths): an existing unique tech, shared and renamed with an identical effect, at the Castle in the Imperial Age as in the game; the Goths’ design drops Perfusion"
basis = "From about 1486–87 Maximilian I, King of the Romans, raised German foot on the Swiss model, the Landsknechte: pikemen with halberdiers and two-handed swordsmen (the double-pay Doppelsöldner) and, more and more, handgunners. Colonels and captains recruited them under contract, mustered them, swore them to articles of war and paid them by the month, so that a prince with money could raise thousands of foot within weeks; within a few years they fought for Maximilian in the Low Countries, in Hungary (1490) and in Italy, and other princes hired them too (Baumann 1994). Barracks that work twice as fast abstract this contract recruitment. It takes the Castle slot of Crenellations (see [[dropped]])."
relevance = "The Landsknechte were the German answer to the Swiss pike and became the most widely hired infantry of Europe; they are among the best-known German soldiers of any age."

[[unique_tech]]
name = "Gutenberg's Press"
building = "University"
kind = "civil"
age = "Imperial"
effect = "University technologies cost -25%"
level = 2
change = "new"
precedent = "Dock and University technologies cost -25% (Italians), University part only, as the Georgians’ Gelati Academy also uses it and the Bengalis’ design has it as a passive"
basis = "In Mainz Johann Gutenberg developed printing with movable metal type around 1450; the 42-line Bible was finished by about 1454–55. German printers carried the technique across Europe within a generation: Sweynheym and Pannartz at Subiaco (1465), Johann of Speyer at Venice (1469), Gering, Friburger and Crantz at Paris (1470), Andreas Hess at Buda and Kasper Straube at Kraków (1473); by 1500 presses had worked in more than two hundred towns (Febvre and Martin 1958; Eisenstein 1979). Cheaper University technologies stand for knowledge made cheap by print. A new tech (level 2): no existing unique tech represents printing, and the generic Block Printing is a Monastery tech for the Monks’ conversion range."
relevance = "Printing with movable type was the most consequential German invention of the Middle Ages and changed how knowledge travelled across Europe within fifty years."

[tree]
add = ["Arbalester", "Architecture", "Treadmill Crane", "Gold Shaft Mining", "Dry Dock"]
remove = ["Siege Onager", "Siphons"]

[tree.basis]
"Arbalester" = "Crossbowmen were central to the Order’s garrisons and arsenals in Prussia and to the urban militias of the German towns, whose shooting guilds (Schützengilden) appear from the 14th century. The Germans already have the Heavy Mounted Crossbowman; the foot upgrade completes the crossbow line."
"Architecture" = "Romanesque Speyer, Gothic Cologne, the brick Gothic of the Baltic towns and the Order’s castles (Marienburg) make the absence hard to justify for a defensive civilization."
"Treadmill Crane" = "The medieval treadwheel crane is almost a German emblem: the crane of Cologne cathedral stood on the unfinished south tower from the 15th century until 1868, and the Krantor of Danzig (1442–44) was built under the Order."
"Gold Shaft Mining" = "Germany was the mining heart of medieval Europe (Rammelsberg, Freiberg, the Harz and the Erzgebirge, Schwaz in Tyrol) (Bartlett 1993); lacking the late mining upgrade contradicted that."
"Dry Dock" = "Hanseatic fleets dominated the Baltic and the North Sea, defeated Denmark (1367–70) and carried the Order to Gotland (1398) (Dollinger 1964); a weak navy contradicted this."
"Siege Onager" = "Removed to offset the additions. There is no specific German basis for the top tier of the stone-thrower line (held by only 15 of the game’s 56 civs); the Germans keep the Onager, Capped Ram, Trebuchet and Bombard Cannon."
"Siphons" = "Named after the Byzantine fire siphon, a state secret never given to other nations (De Administrando Imperio 13); no ship-borne liquid-fire weapon is documented for this civ."

[[rename]]
from = "Elite Boyar"
to = "Elite Teutonic Knight"
level = 1
basis = "Follows the unique unit (Boyar → Teutonic Knight), for the Germans only; the Rus' and Lithuanians keep the Boyar. The name is also that of the game’s infantry Elite Teutonic Knight, which this design replaces."

[architecture]
set = "Central European"
change = "kept"
basis = "The Central European set is the one modelled on the German lands: Romanesque and Gothic churches, timber-framed and brick town houses. The Bohemians, Poles and Magyars join it in this redesign, on the criterion of historical fit: they too built in Latin Romanesque and Gothic, with towns under German law (Peter Parler’s workshop in Prague, Veit Stoss in Kraków)."

[[dropped]]
item = "Murder Holes, Herbal Medicine free"
kind = "bonus"
reason = "Fails the relevance test (RULES 6.9): both techniques were common to all of Latin Europe, so the bonus is flavour rather than a distinctive trait. Monastic medicine (Hildegard of Bingen) is carried by the Monks’ healing bonus. Its slot goes to the Teutonic Knights’ conversion resistance."

[[dropped]]
item = "Crenellations (Castles +3 range, garrisoned Infantry fires arrows)"
kind = "unique_tech"
reason = "Fails RULES 6.2 and 6.9. Castle density is a structural trait and is already the garrison passive; what remained for a datable tech was one architectural feature (battlements, found everywhere) and one siege. Even that siege does not support the effect: Marienburg held for some eight weeks in 1410 (26 July to 19 September) because of Heinrich von Plauen’s leadership, the besiegers’ lack of a heavy siege train, disease and the Lithuanians’ departure, not because of its battlements (Urban 2003). The Castle slot goes to the Landsknechte, a weightier datable military moment; the Order’s convent-castles stay in the garrison passive."
