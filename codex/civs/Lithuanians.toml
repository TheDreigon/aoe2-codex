civ = "Lithuanians"
name = "Lithuanians"
status = "draft"
label = "Cavalry and Counter-Units civilization"
summary = "Lithuanians recentred on the Grand Duchy from its pagan rise to the Jagiellonian union: forest foraging and a pagan resistance to conversion replace the food and relic bonuses, the hill forts become a passive, the Boyar replaces the Leitis, the regional javelin horse arrives as the Sulica Rider, Horodło and Vytautas’ Tatars are new techs, and the navy shrinks to a basic fleet."
ideas = [
  "N2: Krikštas (the conversion of 1387): before the tech the civ trains pagan priests, on the Scenario Editor Pagan Priest (existing art; a variant of the Monk with the Monk’s base values; its abilities must be checked in the game, and whether its look, added in 2025 together with Monastery visuals for ‘shamanistic’ civs, suits Baltic religion is unverified), and lacks the Christian Monastery techs; after it, Monks and the Monastery techs unlock. Needs a new mechanic (a unit and techs swapped by a tech). Sources for the priesthood are thin: Peter of Dusburg’s Prussian Criwe, whose authority he says reached the Lithuanians (contested); the name vaidila comes from the 16th-century Prussian ‘Waidelotten’ (Simon Grunau) and was popularised by Romanticism (Mickiewicz’s Konrad Wallenrod, 1828).",
  "N2: Grobis (plunder): a passive for the raiding economy that benefited the Lithuanians themselves, with loot from the enemy buildings that cavalry destroys and food for the enemy villagers it kills, for the captives, cattle and plunder that raids into Prussia, Livonia, Masovia and the Rus’ brought home (Peter of Dusburg; Wigand of Marburg). The captives part needs a new mechanic; in N1 a Loot passive (the Danes’ effect) beside the team bonus would recreate the English design’s Chevauchée.",
  "N2: A javelin light horseman of its own for the sulica riders, who also fought hand to hand and dismounted, instead of the regional Genitour, which cannot attack at close range.",
  "N3: Sacred-grove or sacred-fire buildings for the Baltic religion (Perkūnas, the sacred fire of Vilnius).",
  "N3: Own art for a Lithuanian light horseman with shield and javelins instead of the Genitour model.",
]
contested = [
  "Who commanded at Saule (1236), the first great victory of Lithuanians and Samogitians over the crusaders, won while Mindaugas was uniting the Lithuanian lands: Vykintas and the Samogitians or Mindaugas.",
  "Whether Mindaugas apostatised c. 1261.",
  "The Lithuanian withdrawal at Grunwald (1410): a feigned retreat (supported, among others, by a document identified by Sven Ekdahl) or a real flight (Długosz).",
  "The depth of the conversion of 1387 (Rowell, Baronas) and the pace of the Polonisation of the nobility. Decision: the civ keeps the generic Christian Monastery tree (Theocracy, Redemption, Atonement and the rest, under their generic names, RULES 6.16.9) for the Christian period (1387–1500) and the Orthodox Ruthenian lands, while the pagan state is carried by the conversion-resistance passive; Block Printing alone leaves (no printing in the window), and the switch from pagan to Christian is the N2 Krikštas idea.",
  "The etymology of Lietuva from the leičiai (Dubonis, Karaliūnas) or from the river name Lietava.",
  "Whether a pavise-type shield developed on the Baltic–Rus'–Polish frontier before the Bohemian pavise.",
  "The existence and functions of the pagan high priest (Kriwe) described by Peter of Dusburg, and whether his authority reached the Lithuanians.",
  "The Sulica Rider’s javelin: the core of Lithuanian armies was light horse, but that its riders threw javelins is inferred from the regional sulica tradition (the Rus’ sulitsa, the Polish sulica), not shown for Lithuanian horsemen in the sources consulted; the codex’s historical-accuracy analysis rests the claim on the game’s own text. The owner’s decision to extend the regional Genitour (RULES 6.16.10) stands on the light-horse role.",
  "Power budget (RULES 6.14 and 6.16.13), decided: the civ loses ‘Each Town Center provides +100 food’, the relic bonus, the Leitis, the Winged Hussar, Tower Shields, the Monastery team bonus, Block Printing and, under the navy rule, the Galleon, Fast Fire Ship and Cannon Galleon; it gains Foragers +15%, pagan conversion resistance, the hill-fort range as a free passive from the Castle Age, the Boyar with cheaper gold after Horodło, a one-off horse-archer spawn and the Sulica Rider (the regional Genitour). Accepted for N1 without compensation, since the codex gives no blanket compensation for kits that history leaves weak (RULES 6.16.13).",
]
open_questions = []

[profile]
entity = "Grand Duchy of Lithuania (pagan until 1387, Samogitia until 1413–17) with the Ruthenian lands it ruled, whose Orthodox people were the majority from the mid-14th century; in union with Poland from 1385"
region = "Baltic lands of the Neris and the Neman, expanding over the Ruthenian lands of the upper Dnieper and, under Vytautas, to the Black Sea steppe"
window = "1236–1500 (from the victory of Saule to the end of the time frame)"
sources = [
  "Peter of Dusburg, Chronicon terrae Prussiae (1326)",
  "Livonian Rhymed Chronicle (late 13th century)",
  "Galician-Volhynian Chronicle (Hypatian Codex)",
  "Letters of Gediminas (1323)",
  "Wigand of Marburg, Chronica nova Prutenica (late 14th century)",
  "Jan Długosz, Annales seu cronicae incliti Regni Poloniae (15th century)",
  "Stanisław Kryczyński, Tatarzy litewscy (1938)",
  "Sven Ekdahl, Die Schlacht bei Tannenberg 1410 (1982)",
  "Jan Tyszkiewicz, Tatarzy na Litwie i w Polsce: studia z dziejów XIII–XVIII w. (1989)",
  "S. C. Rowell, Lithuania Ascending: A Pagan Empire within East-Central Europe, 1295–1345 (1994)",
  "Gintautas Zabiela, Lietuvos medinės pilys (1995)",
  "Eric Christiansen, The Northern Crusades (2nd ed. 1997)",
  "Sven Ekdahl, ‘Horses and Crossbows: Two Important Warfare Advantages of the Teutonic Order in Prussia’, in H. Nicholson (ed.), The Military Orders 2 (1998)",
  "Artūras Dubonis, Lietuvos didžiojo kunigaikščio leičiai (1998)",
  "Zigmantas Kiaupa, Jūratė Kiaupienė and Albinas Kuncevičius, The History of Lithuania Before 1795 (2000)",
  "Darius Baronas and S. C. Rowell, The Conversion of Lithuania (2015)",
  "Eligijus Šmidtas, ‘Su kokia kavalerija Lietuva pasitiko kryžiuočius XIII amžiuje?’, Lietuvos istorijos studijos 44 (2019), 8–30",
]

[[bonus]]
text = "Foragers work +15% faster"
kind = "economic"
level = 1
change = "new"
replaces = "Each Town Center provides +100 food"
precedent = "Foragers work +15% faster (Franks)"
basis = "Lithuania lived from arable farming and livestock, but its exports were forest products: wax above all, honey and furs, sold through Riga and Königsberg, to Danzig and to the Hanseatic merchants who kept an office at Kaunas from 1441 (Rowell 1994; Kiaupa et al. 2000). Tree-hive beekeeping in the forests, later regulated in detail by the Lithuanian Statute (1529), is the part of this economy that foraging abstracts. The +100 food per Town Center it replaces had no identifiable historical basis. ‘Meat of hunted and livestock animals doesn’t decay’ is not used (RULES 6.9): it would rest on a single episode, the royal hunt in the Białowieża forest in December 1409 to provision the Grunwald campaign (Długosz)."
relevance = "The forests that sheltered the pagan state also supplied its main exports and its trade with the Hanse."

[[bonus]]
text = "Spearman-line and Skirmisher-line move +10% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Spearman-line and Skirmisher-line move +10% faster (Lithuanians)"
basis = "War in the forests and marshes of the wilderness (Wildnis) between Prussia and Lithuania favoured light troops: Lithuanian horsemen rode small native horses, while the Order relied on heavy warhorses (Ekdahl 1998); the Lithuanian riders often dismounted and sought forest and broken ground where heavy Western cavalry could not use its advantages, so that they were often taken for infantry (Šmidtas 2019), and the Order’s chroniclers describe a war of raids and ambushes (Peter of Dusburg; Christiansen 1997). These light troops and the Sulica Rider give the label: ‘Cavalry and Counter-Units’, a game category (the Mapuche’s), replaces ‘Cavalry and Monk’, which inverted the religion of the pagan state."
relevance = "The light, mobile war of the Wildnis is how pagan Lithuania held off two crusading orders for over a century."

[[bonus]]
text = "Units more resistant to conversion"
kind = "military"
level = 1
change = "new"
replaces = "Each garrisoned Relic provides +1 attack to Knight-line and Leitis (maximum +4)"
precedent = "Units more resistant to conversion (Teutons team bonus; the Inca design’s team bonus), as a passive; the Germans’ design also makes it a passive, on a different reading (vows)"
basis = "Lithuania was the last pagan state of Europe. Its rulers kept the old religion, with its gods (Perkūnas among them), sacred groves and the sacred fire of Vilnius, against two crusading orders for a century and a half: Mindaugas’ baptism (1251) did not last, Gediminas’ letters of 1323 inviting friars were disowned before the papal legates in 1324, and Kęstutis was cremated with horses and arms in a pagan rite in 1382 (Długosz); the grand duchy was baptised only after the Union of Krewo (1387), and Samogitia only in 1413–17 (Rowell 1994; Baronas and Rowell 2015). The game’s conversion is a change of allegiance, so the bonus stands for a people holding to its own faith against conversion by the sword: an abstraction, the faith reading. Raiding, the civ’s other defining trait, is carried by the team bonus (the raiding done for its allies), so paganism takes this passive slot; the relic bonus it replaces inverted the history of a state whose rulers stayed pagan until 1387. The Scenario Editor Pagan Priest was considered as a unique unit for the pagan priesthood but not adopted: the priesthood’s organisation is thinly and contestedly attested (see contested), its base values in the game data are the Monk’s (30 HP, conversion range 9, 100 gold; codex/tools/scenario-units-stats.md), so as a unique unit it would most likely duplicate the Monk under another look (its abilities, such as healing and carrying Relics, must still be checked in the game), and as the look of the Lithuanian Monk it would erase the civ’s Christian century and its Orthodox majority; whether its look, added in 2025 together with Monastery visuals for ‘shamanistic’ civs, suits Baltic religion is also unverified. It is kept for the N2 Krikštas idea."
relevance = "Paganism defined Lithuania’s place in Europe for a century and a half: it was the reason for the crusades against it, and baptism was the price of the Polish crown at Krewo."
contested = "Lithuanian rulers also offered or accepted baptism when it served them (Mindaugas 1251; Gediminas 1323; Vytautas 1383 and 1386), which supports the allegiance reading of conversion; the design follows the faith reading. The Germans’ design reads the same effect as the vows of the Order’s brethren: the two readings differ."

[[bonus]]
text = "Town Centers +3 range starting in Castle Age"
kind = "military"
level = 1
change = "changed"
replaces = "Hill Forts (unique tech): Town Centers +3 range"
precedent = "Hill Forts (Town Centers +3 range) (Lithuanians), the same effect as a passive; for the age gate, Town Centers cost -50% wood starting in Castle Age (Britons)"
basis = "Lithuania has hundreds of hill forts (piliakalniai), most of them Iron Age sites; in the 13th–14th centuries many were refortified as timber castles: the line along the Neman facing the Order (Veliuona, Bisenė, Punia, Merkinė, and Kaunas, rebuilt in masonry before the Order took it in 1362) and the centres of the Neris valley (Kernavė, Vilnius) (Zabiela 1995). These castles were the refuges of the population and the seats of the grand duke’s power in their districts. A long, structural trait, so a passive under RULES 6.2 rather than a unique tech; from the Castle Age, the age of the original Hill Forts tech."
relevance = "The castle network of the Neman and the Neris was the backbone of the defence that kept the Order out of the Lithuanian heartland for over a century, despite the fall of Kaunas (1362) and the sieges of Vilnius (1390, 1394)."

[team_bonus]
text = "Scout Cavalry-line +2 attack vs. buildings"
level = 1
change = "new"
replaces = "Monasteries work +20% faster"
precedent = "Scout Cavalry-line and Camel Units +2 attack vs. buildings (Hindustanis team bonus, dropped in their design), without the Camel Units; also half of a tech in the English design (Chevauchée)"
basis = "In the joint Polish–Lithuanian campaigns against the Order (1410; the ‘Hunger War’ of 1414; 1422) Lithuanian, Ruthenian and Tatar light horse ravaged the Order’s countryside for the allied army, and the Order denounced the burning of churches by Jogaila’s pagan, Orthodox and Tatar troops at the Council of Constance (Długosz; Christiansen 1997): raiding done for an ally, an alliance contribution under RULES 6.2. Raiding was also the Lithuanian way of war and an economy at home: raids into Prussia, Livonia, Masovia and the Rus’ brought back captives, cattle and plunder and left burned villages behind, as the Order’s chroniclers describe (Peter of Dusburg, Wigand of Marburg), and the Order’s own ‘Reisen’ into Lithuania were the mirror image (Rowell 1994). That plunder economy benefited the Lithuanians alone, so it is not this team bonus (RULES 6.2), and it has no N1 element: a Loot passive (the Danes’ effect) beside this team bonus would recreate the English design’s Chevauchée (see the N2 Grobis idea). Monasteries mattered only after 1387, or in the Orthodox Ruthenian lands, so the replaced team bonus did not fit the core of the civ. Kept over a narrower service to neighbours: Daumantas, who led the defence of Pskov against the Livonian Order as its prince (1266–99), and Narimantas, granted Novgorod’s frontier towns against Sweden in 1333, though he failed to come when the Swedes attacked in 1338 (Novgorod First Chronicle)."
relevance = "The alliance with Poland (Krewo 1385, Grunwald 1410) was the turning point of Lithuanian history, and ravaging the enemy’s land was a distinctive Lithuanian contribution to the joint wars."

[[unique_unit]]
name = "Boyar"
model = "Boyar"
building = "Castle"
level = 1
change = "new"
replaces = "Leitis (Heavy Cavalry that ignores armor)"
basis = "From the 14th century the Grand Duchy’s heavy cavalry came from its boyars, Lithuanian and Ruthenian, who served with their retinues in banners; as the state grew over the old Rus' principalities (Polotsk, Vitebsk, Kiev, Smolensk), most of its nobility became Orthodox Ruthenian boyars. At Grunwald (1410) Vytautas led some forty banners, many raised in Ruthenian lands, among them the three Smolensk banners that held their ground beside the Poles (Długosz; Ekdahl 1982). The Rus' Boyar (cavalry with exceptional melee armour) is shared because these were the same class (RULES 6.7); the model is shared only with the Rus', and the Horodło discount sets the Lithuanian Boyar apart. It takes the slot of the Leitis (see [[dropped]])."
relevance = "The boyars were the Grand Duchy’s ruling class and its heavy cavalry, and through the Ruthenian boyars the civ shows the Orthodox majority of its people after c. 1350."

[[unique_tech]]
name = "Horodło"
building = "Town Center"
kind = "civil"
age = "Imperial"
effect = "Boyars cost -40% gold"
level = 2
change = "new"
precedent = "Szlachta Privileges (Knight-line costs -60% gold) (Poles), with the Boyar as the target; Ordonnance Companies (Mounted Crossbowmen cost -40% gold) (Franks), for the magnitude on a single unit"
basis = "At Horodło (2 October 1413) Jogaila and Vytautas renewed the union and reshaped the Grand Duchy on the Polish model: palatines and castellans of Vilnius and Trakai, joint assemblies with the Polish nobility, and the privileges of the Polish nobles extended to the Lithuanian boyars, 47 of whose families were adopted into Polish heraldic clans. The privileges were at first for Catholics only; Sigismund Kęstutaitis extended them to the Orthodox boyars in 1434, and Casimir’s privilege of 1447 widened them for the whole nobility (Kiaupa et al. 2000). Cheaper Boyars translate privileges paid for by service at the boyars’ own expense, as Szlachta Privileges does for the Poles. A new tech (level 2): sharing Szlachta Privileges itself would give the Lithuanians, who have the Paladin, very cheap knights and blur the Polish and Lithuanian identities. Chosen over Jogaila’s privilege to the Catholic boyars (1387), which Horodło renewed and widened, and over Vytautas’ replacement of the appanage princes of Kiev, Podolia, Novgorod-Seversky and Vitebsk by his own lieutenants (1390s), a strengthening of the grand duke’s power that left no lasting constitution."
relevance = "Horodło turned the Lithuanian boyars into a privileged nobility on the Polish model and fixed the form of the union until 1569."

[[unique_tech]]
name = "Lipka Tatars"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Up to 5 Town Centers spawn 3 Cavalry Archers each"
level = 2
change = "new"
replaces = "Tower Shields (Spearman-line and Skirmishers +2 pierce armor)"
precedent = "First Crusade (Up to 5 Town Centers spawn 5 Serjeants each; units more resistant to conversion) (Sicilians), spawn effect only, with Cavalry Archers and a smaller number. A new tech: sharing Cuman Mercenaries would make a third identical copy (Cumans, Bulgarians) of the same team-wide effect."
basis = "After his campaigns against the Golden Horde (1397–98) Vytautas settled Tatar captives and the followers of the exiled khan Tokhtamysh around Vilnius and Trakai, and a Tatar contingent under Jalal ad-Din fought on the Polish–Lithuanian side at Grunwald (1410) (Długosz; Tyszkiewicz 1989). The Tatars served the grand duke for land rather than pay, and their horse archers explain the civ’s Cavalry Archers; a one-off spawn of horse archers stands for the settlement of one body of steppe horsemen without making Cavalry Archers a cheap, dominant late unit. The Thumb Ring stays on the same ground, given for an archery tradition the civ’s armies demonstrably used: the steppe archery, which drew with the thumb, of the Tatars in the grand duke’s service. ‘Lipka’ (from the Tatar name for Lithuania) is the community’s later name, from the 16th–17th centuries (Kryczyński 1938). Gold-free Cavalry Archers, or ‘Cavalry Archers cost -40% gold’ (Ordonnance Companies), are not used: they would make a secondary element the civ’s dominant late unit. Tower Shields is dropped: the pavise is above all Bohemian and Italian, and Lithuanian infantry was secondary; the pavise theme goes to the Bohemians’ N2 Pavéza idea."
relevance = "The settlement of 1397–98 gave the grand dukes a body of steppe horsemen serving for land, who fought at Grunwald, and left a community that still exists."

[tree]
add = ["Genitour", "Elite Genitour"]
remove = ["Cannon Galleon", "Elite Cannon Galleon", "Galleon", "Fast Fire Ship", "Galleon, Fast Fire Ship and Carrack", "Block Printing"]

[tree.basis]
"Genitour" = "Owner’s decision (RULES 6.16.10): the regional Genitour extends to the Lithuanians, whose light horse was the core of their raiding. Lithuanian armies relied on light horsemen riding small native horses (Ekdahl 1998), who raided fast and often dismounted to fight in forest and broken ground (Šmidtas 2019 on Lithuanian light cavalry; Peter of Dusburg and Wigand of Marburg on the raids). The javelin is inferred from the regional tradition: the sulica (the sulitsa of the Rus’ chronicles) was the short throwing spear of the light horse of the Rus’ and Polish lands, and the sources consulted do not describe Lithuanian riders throwing it (see contested). The Genitour, a javelin-throwing light horseman, is the closest existing unit. At the Archery Range from the Castle Age, as for the Berbers, Castilians and Portuguese; a regional unit, so not counted as a unique unit (RULES 6.1). It shares with the Light Cavalry the light-cavalry role of the dropped Winged Hussar. The Genitour cannot fight at close range, while the Lithuanian riders also fought hand to hand and dismounted (see ideas)."
"Elite Genitour" = "The Elite upgrade of the Sulica Rider (Archery Range), for the same light horsemen."
"Cannon Galleon" = "No naval tradition: no gun-armed warships. The Grand Duchy’s Baltic coast was the Palanga strip (confirmed at Melno, 1422), and its Black Sea littoral under Vytautas (Kachibey, from which grain was shipped to Constantinople in 1415, according to Długosz) was a steppe frontier without a fleet."
"Elite Cannon Galleon" = "As Cannon Galleon."
"Galleon" = "Navy (RULES 6.16.1): no war fleet of its own (see Cannon Galleon), so the civ keeps the basic navy (Galley-line to War Galley, Fire Galley and Fire Ship, Hulk and War Hulk, demolition ships and the generic Dock techs), with no substitute siege warship."
"Fast Fire Ship" = "As Galleon."
"Galleon, Fast Fire Ship and Carrack" = "Nothing is left for this upgrade once the Galleon and Fast Fire Ship are removed (the Lithuanians already lacked the Carrack)."
"Block Printing" = "No printing in the window: the first press in the Grand Duchy was Francysk Skaryna’s in Vilnius (1522)."

[[rename]]
from = "Genitour"
to = "Sulica Rider"
level = 1
basis = "The regional Genitour named after the sulica, the short throwing spear of the light horse of the Rus’ and Polish lands, which the Lithuanian riders are inferred to have used (see contested); the generic name (the English and French borrowing of Spanish jinete) is foreign to Lithuania. ‘Sulica Rider’ is a modern descriptive coinage, not a troop name found in the sources, and is flagged as such on the site (RULES 6.16.15); no period name for these riders is known. The Castilians and Portuguese rename the same unit Jinete and Ginete, and the Berbers keep ‘Genitour’."

[[rename]]
from = "Elite Genitour"
to = "Elite Sulica Rider"
level = 1
basis = "Follows the Sulica Rider, for the Lithuanians only; a modern coinage, flagged (RULES 6.16.15)."

[architecture]
set = "Eastern European"
change = "kept"
basis = "Historical fit (RULES 6.16.8): after the mid-14th century most of the Grand Duchy’s people were Orthodox Ruthenians, Vilnius had Orthodox churches beside the Catholic ones, and building was largely in timber; the Eastern European set fits that majority better than a Latin one. The grand dukes also built brick Gothic castles on the Order’s model (Trakai Island, Kaunas, Medininkai, Vilnius Upper Castle), which this set does not show: a known gap."

[[dropped]]
item = "Winged Hussar"
kind = "unique_unit"
reason = "Anachronistic and of the wrong type: a heavy lancer of the late 16th and 17th centuries (Kircholm, 1605, under the Lithuanian hetman Chodkiewicz) that the game used as a light raider. Its light-cavalry role passes to the Light Cavalry and to the regional Genitour, here the Sulica Rider."

[[dropped]]
item = "Leitis"
kind = "unique_unit"
reason = "Fails the relevance test (RULES 6.9), whose bar is highest for a unique unit. The leičiai existed: first named in 1407, they were servitors settled on the grand duke’s estates with guard, military and horse duties (Dubonis 1998). But nothing shows that they were an elite heavy cavalry, the armour-ignoring attack is invented, and the unit’s fame was made by the game itself (2021), so it cannot tip the case; the tie to the etymology of Lietuva is itself debated. The unique-unit slot goes to the Boyar, for the boyar banners that were the Grand Duchy’s real heavy cavalry, and the Leitis is not kept as a second unique unit."
