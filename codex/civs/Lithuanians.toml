civ = "Lithuanians"
name = "Lithuanians"
status = "draft"
label = "Cavalry and Counter-Units civilization"
summary = "Lithuanians recentred on the Grand Duchy from its pagan rise to the Jagiellonian union: forest and raiding bonuses replace the food and relic bonuses, the hill forts become a passive, the Boyar replaces the Leitis, Horodło and Vytautas’ Tatars are new techs, and the navy shrinks to a basic fleet."
ideas = [
  "N2: Krikštas (the conversion of 1387): before the tech the civ uses pagan priests without the Christian Monastery techs; after it, the Monastery techs unlock. Needs new mechanics.",
  "N2: A javelin cavalry unit of its own that can also fight hand to hand and dismount, instead of borrowing the Genitour (which cannot attack at close range).",
  "N3: A pagan priest unit and sacred-grove or sacred-fire buildings; the Baltic religion (Perkūnas, the sacred fire of Vilnius) has no representation. Sources: Peter of Dusburg’s Prussian Criwe, whose authority he says reached the Lithuanians (contested); the name vaidila comes from the 16th-century Prussian ‘Waidelotten’ (Simon Grunau) and was popularised by Romanticism (Mickiewicz’s Konrad Wallenrod, 1828).",
  "N3: Own art for the Sulica Rider (Lithuanian light horseman with shield and javelins) instead of the Berber Genitour model.",
]
contested = [
  "Who commanded at Saule (1236), the first great victory of Lithuanians and Samogitians over the crusaders, won while Mindaugas was uniting the Lithuanian lands: Vykintas and the Samogitians or Mindaugas.",
  "Whether Mindaugas apostatised c. 1261.",
  "The Lithuanian withdrawal at Grunwald (1410): a feigned retreat (supported, among others, by a document identified by Sven Ekdahl) or a real flight (Długosz).",
  "The depth of the conversion of 1387 (Rowell, Baronas) and the pace of the Polonisation of the nobility.",
  "The etymology of Lietuva from the leičiai (Dubonis, Karaliūnas) or from the river name Lietava.",
  "Whether a pavise-type shield developed on the Baltic–Rus'–Polish frontier before the Bohemian pavise.",
  "The existence and functions of the pagan high priest (Kriwe) described by Peter of Dusburg, and whether his authority reached the Lithuanians.",
]
open_questions = [
  "Label: ‘Cavalry and Counter-Units civilization’ (a category the game uses, for the Mapuche) replaces ‘Cavalry and Monk’, because the core of the civ is the last pagan state of Europe (baptism 1387, Samogitia 1413–17); ‘Cavalry and Skirmisher’ is not used because it is not a game category. Accept, or plain ‘Cavalry civilization’, the label of six designs, among them the Poles and the Magyars?",
  "Codex-wide question CQ23 (see codex/civs/README.md): Regional Genitour (the Sulica Rider is added pending the owner’s extension of the regional-unit decision to Lithuania; without it, the Light Cavalry stays the top light cavalry and javelin cavalry goes to N2).",
  "Leitis: dropped under the relevance test (a minor servitor group, an invented armour-ignoring attack, and fame made by the game itself) and replaced by the Boyar for the boyar banners. Keep the Leitis anyway as a second unique unit?",
  "Boyar: shared with the Rus', whose unit it is, and the model of the Germans’ mounted Teutonic Knight, so three civs would field the same heavy cavalry in N1 (the Germans’ conversion-resistance passive and the Horodło discount set two of them apart). Accept, or wait for an N2 unit of its own?",
  "Monastery tree: the civ keeps the Christian Monastery tree (Theocracy, Redemption, Atonement, Illumination…) although its core was pagan until 1387; the Christian period (1387–1500) and the Orthodox Ruthenian lands justify part of it. Block Printing is removed (no printing in the window). Remove Theocracy too, or wait for the N2 Krikštas tech?",
  "Paganism has no N1 element. ‘Units more resistant to conversion’ (the game’s Teutons team bonus, now the team bonus of the Inca design) could stand for a century and a half of resistance to forced conversion (the faith reading), although the game’s conversion is a change of allegiance and Lithuanian rulers offered or accepted baptism when it served them (Mindaugas 1251; Gediminas’ letters of 1323, disowned before the papal legates in 1324; Vytautas 1383 and 1386: the allegiance reading). Add it as a fifth passive, or wait for the N2 Krikštas tech?",
  "Town Center tech: the hill forts are a structural trait and now a passive (RULES 6.2), so the Town Center gets a new level-2 tech for the Union of Horodło (1413), with cheaper Boyars for the privileges extended to the boyars. Alternatives: Jogaila’s privilege to the Catholic boyars (1387), or Vytautas’ replacement of the appanage princes of Kiev, Podolia, Novgorod-Seversky and Vitebsk by his own lieutenants (1390s). Which?",
  "Lipka Tatars: a one-off spawn of 3 Cavalry Archers at each of up to 5 Town Centers (the First Crusade pattern) for the settlement of 1397–98. Gold-free Cavalry Archers are not used: they would go beyond every precedent and make a secondary element the civ’s dominant late unit. Alternative: ‘Cavalry Archers cost -40% gold’ (Ordonnance Companies) for land granted in return for service. Which?",
  "Team bonus: ‘Scout Cavalry-line +2 attack vs. buildings’ is close to the Hindustanis’ game team bonus (dropped in their design), and the Britons’ design gives its own Knights and Scouts +2 more through a tech (Chevauchée). Keep it, or use another trait that benefited neighbours: the Lithuanian princes who led the defence of Pskov and Novgorod against the Livonian Order and Sweden (Daumantas, prince of Pskov 1266–99; Narimantas in Novgorod from 1333), for example with ‘Repairers work +25% faster’ (the Saxons’ game team bonus)? (‘Scout Cavalry-line +2 line of sight’, the Mongols’ game team bonus, is now half of the Mongols’ Yam tech.)",
  "Power budget: the civ loses ‘Each Town Center provides +100 food’, the relic bonus, the Leitis, the Winged Hussar, Tower Shields, the Monastery team bonus, Block Printing and, under the codex navy rule, the Galleon, Fast Fire Ship and Cannon Galleon; it gains Foragers +15%, Loot, the hill-fort range as a free passive from the Castle Age, the Boyar with cheaper gold after Horodło, a one-off spawn of horse archers and, pending CQ23, the Sulica Rider. Is the balance acceptable?",
  "Tower Shields is replaced by Lipka Tatars. The freed pavise theme could go to the Bohemians in N2 (Pavéza). Agree?",
  "Codex-wide question CQ1 (see codex/civs/README.md): Navy rule (no war fleet, so under the default rule the civ keeps the basic navy only: the Cannon Galleon, Galleon and Fast Fire Ship leave, with no substitute siege warship).",
]

[profile]
entity = "Grand Duchy of Lithuania (pagan until 1387, Samogitia until 1413–17) with the Ruthenian lands it ruled, whose Orthodox people were the majority from the mid-14th century; in union with Poland from 1385"
region = "Baltic lands of the Neris and the Neman, expanding over the Ruthenian lands of the upper Dnieper and, under Vytautas, to the Black Sea steppe"
window = "1236–1500 (from the victory of Saule to the end of the time frame)"
sources = [
  "Peter of Dusburg, Chronicon terrae Prussiae (1326)",
  "Livonian Rhymed Chronicle (late 13th century)",
  "Galician-Volhynian Chronicle (Hypatian Codex)",
  "Letters of Gediminas (1323)",
  "Wigand of Marburg, Chronica nova Prutenica (late 14th century)",
  "Jan Długosz, Annales seu cronicae incliti Regni Poloniae (15th century)",
  "Stanisław Kryczyński, Tatarzy litewscy (1938)",
  "Sven Ekdahl, Die Schlacht bei Tannenberg 1410 (1982)",
  "Jan Tyszkiewicz, Tatarzy na Litwie i w Polsce: studia z dziejów XIII–XVIII w. (1989)",
  "S. C. Rowell, Lithuania Ascending: A Pagan Empire within East-Central Europe, 1295–1345 (1994)",
  "Gintautas Zabiela, Lietuvos medinės pilys (1995)",
  "Eric Christiansen, The Northern Crusades (2nd ed. 1997)",
  "Sven Ekdahl, ‘Horses and Crossbows: Two Important Warfare Advantages of the Teutonic Order in Prussia’, in H. Nicholson (ed.), The Military Orders 2 (1998)",
  "Artūras Dubonis, Lietuvos didžiojo kunigaikščio leičiai (1998)",
  "Zigmantas Kiaupa, Jūratė Kiaupienė and Albinas Kuncevičius, The History of Lithuania Before 1795 (2000)",
  "Darius Baronas and S. C. Rowell, The Conversion of Lithuania (2015)",
  "Eligijus Šmidtas, ‘Su kokia kavalerija Lietuva pasitiko kryžiuočius XIII amžiuje?’, Lietuvos istorijos studijos 44 (2019), 8–30",
]

[[bonus]]
text = "Foragers work +15% faster"
kind = "economic"
level = 1
change = "new"
replaces = "Each Town Center provides +100 food"
precedent = "Foragers work +15% faster (Franks)"
basis = "Lithuania lived from arable farming and livestock, but its exports were forest products: wax above all, honey and furs, sold through Riga and Königsberg, to Danzig and to the Hanseatic merchants who kept an office at Kaunas from 1441 (Rowell 1994; Kiaupa et al. 2000). Tree-hive beekeeping in the forests, later regulated in detail by the Lithuanian Statute (1529), is the part of this economy that foraging abstracts. The +100 food per Town Center it replaces had no identifiable historical basis. ‘Meat of hunted and livestock animals doesn’t decay’ is not used (RULES 6.9): it would rest on a single episode, the royal hunt in the Białowieża forest in December 1409 to provision the Grunwald campaign (Długosz)."
relevance = "The forests that sheltered the pagan state also supplied its main exports and its trade with the Hanse."

[[bonus]]
text = "Spearman-line and Skirmisher-line move +10% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Spearman-line and Skirmisher-line move +10% faster (Lithuanians)"
basis = "War in the forests and marshes of the wilderness (Wildnis) between Prussia and Lithuania favoured light troops: Lithuanian horsemen rode small native horses, while the Order relied on heavy warhorses (Ekdahl 1998); the Lithuanian riders often dismounted and sought forest and broken ground where heavy Western cavalry could not use its advantages, so that they were often taken for infantry (Šmidtas 2019), and the Order’s chroniclers describe a war of raids and ambushes (Peter of Dusburg; Christiansen 1997)."
relevance = "The light, mobile war of the Wildnis is how pagan Lithuania held off two crusading orders for over a century."

[[bonus]]
text = "Loot 25% of the resource cost of each destroyed building"
kind = "economic"
level = 1
change = "new"
replaces = "Each garrisoned Relic provides +1 attack to Knight-line and Leitis (maximum +4)"
precedent = "Loot 25% of the resource cost of each destroyed building (Danes); also a passive in the Khitans’ design and half of a tech in the Britons’ design (Chevauchée)"
basis = "Raiding was an economy: Lithuanian raids into Prussia, Livonia, Masovia and the Rus' brought back captives, cattle and plunder and left burned villages behind, as the Order’s chroniclers describe (Peter of Dusburg, Wigand of Marburg); the Order’s own ‘Reisen’ into Lithuania were the mirror image (Rowell 1994). The relic bonus it replaces inverted the history of a state whose rulers stayed pagan until 1387."
relevance = "Plunder and captives were a main resource of the pagan grand dukes and part of how their state grew."

[[bonus]]
text = "Town Centers +3 range starting in Castle Age"
kind = "military"
level = 1
change = "changed"
replaces = "Hill Forts (unique tech): Town Centers +3 range"
precedent = "Hill Forts (Town Centers +3 range) (Lithuanians), the same effect as a passive; for the age gate, Town Centers cost -50% wood starting in Castle Age (Britons)"
basis = "Lithuania has hundreds of hill forts (piliakalniai), most of them Iron Age sites; in the 13th–14th centuries many were refortified as timber castles: the line along the Neman facing the Order (Veliuona, Bisenė, Punia, Merkinė, and Kaunas, rebuilt in masonry before the Order took it in 1362) and the centres of the Neris valley (Kernavė, Vilnius) (Zabiela 1995). These castles were the refuges of the population and the seats of the grand duke’s power in their districts. A long, structural trait, so a passive under RULES 6.2 rather than a unique tech; from the Castle Age, the age of the original Hill Forts tech."
relevance = "The castle network of the Neman and the Neris was the backbone of the defence that kept the Order out of the Lithuanian heartland for over a century, despite the fall of Kaunas (1362) and the sieges of Vilnius (1390, 1394)."

[team_bonus]
text = "Scout Cavalry-line +2 attack vs. buildings"
level = 1
change = "new"
replaces = "Monasteries work +20% faster"
precedent = "Scout Cavalry-line and Camel Units +2 attack vs. buildings (Hindustanis team bonus, dropped in their design); half of a tech in the Britons’ design (Chevauchée)"
basis = "In the joint Polish–Lithuanian campaigns against the Order (1410; the ‘Hunger War’ of 1414; 1422) Lithuanian, Ruthenian and Tatar light horse ravaged the Order’s countryside for the allied army, and the Order denounced the burning of churches by Jogaila’s pagan, Orthodox and Tatar troops at the Council of Constance (Długosz; Christiansen 1997). RULES 6.2: an alliance contribution. Monasteries mattered only after 1387, or in the Orthodox Ruthenian lands, so the replaced team bonus did not fit the core of the civ."
relevance = "The alliance with Poland (Krewo 1385, Grunwald 1410) was the turning point of Lithuanian history, and ravaging the enemy’s land was a distinctive Lithuanian contribution to the joint wars."

[[unique_unit]]
name = "Boyar"
model = "Boyar"
building = "Castle"
level = 1
change = "new"
replaces = "Leitis (Heavy Cavalry that ignores armor)"
basis = "From the 14th century the Grand Duchy’s heavy cavalry came from its boyars, Lithuanian and Ruthenian, who served with their retinues in banners; as the state grew over the old Rus' principalities (Polotsk, Vitebsk, Kiev, Smolensk), most of its nobility became Orthodox Ruthenian boyars. At Grunwald (1410) Vytautas led some forty banners, many raised in Ruthenian lands, among them the three Smolensk banners that held their ground beside the Poles (Długosz; Ekdahl 1982). The Rus' Boyar (cavalry with exceptional melee armour) is shared because these were the same class. It takes the slot of the Leitis (see [[dropped]])."
relevance = "The boyars were the Grand Duchy’s ruling class and its heavy cavalry, and through the Ruthenian boyars the civ shows the Orthodox majority of its people after c. 1350."

[[unique_tech]]
name = "Horodło"
building = "Town Center"
kind = "civil"
age = "Imperial"
effect = "Boyars cost -40% gold"
level = 2
change = "new"
precedent = "Szlachta Privileges (Knight-line costs -60% gold) (Poles), with the Boyar as the target; Ordonnance Companies (Mounted Crossbowmen cost -40% gold) (Franks), for the magnitude on a single unit"
basis = "At Horodło (2 October 1413) Jogaila and Vytautas renewed the union and reshaped the Grand Duchy on the Polish model: palatines and castellans of Vilnius and Trakai, joint assemblies with the Polish nobility, and the privileges of the Polish nobles extended to the Lithuanian boyars, 47 of whose families were adopted into Polish heraldic clans. The privileges were at first for Catholics only; Sigismund Kęstutaitis extended them to the Orthodox boyars in 1434, and Casimir’s privilege of 1447 widened them for the whole nobility (Kiaupa et al. 2000). Cheaper Boyars translate privileges paid for by service at the boyars’ own expense, as Szlachta Privileges does for the Poles. A new tech (level 2): sharing Szlachta Privileges itself would give the Lithuanians, who have the Paladin, very cheap knights and blur the Polish and Lithuanian identities."
relevance = "Horodło turned the Lithuanian boyars into a privileged nobility on the Polish model and fixed the form of the union until 1569."

[[unique_tech]]
name = "Lipka Tatars"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Up to 5 Town Centers spawn 3 Cavalry Archers each"
level = 2
change = "new"
replaces = "Tower Shields (Spearman-line and Skirmishers +2 pierce armor)"
precedent = "First Crusade (Up to 5 Town Centers spawn 5 Serjeants each; units more resistant to conversion) (Sicilians), spawn effect only, with Cavalry Archers and a smaller number. A new tech: sharing Cuman Mercenaries would make a third identical copy (Cumans, Bulgarians) of the same team-wide effect."
basis = "After his campaigns against the Golden Horde (1397–98) Vytautas settled Tatar captives and the followers of the exiled khan Tokhtamysh around Vilnius and Trakai, and a Tatar contingent under Jalal ad-Din fought on the Polish–Lithuanian side at Grunwald (1410) (Długosz; Tyszkiewicz 1989). The Tatars served the grand duke for land rather than pay, and their horse archers explain the civ’s Cavalry Archers; a one-off spawn of horse archers stands for the settlement of one body of steppe horsemen without making Cavalry Archers a cheap, dominant late unit. The Thumb Ring stays on the same ground, given for an archery tradition the civ’s armies demonstrably used: the steppe archery, which drew with the thumb, of the Tatars in the grand duke’s service. ‘Lipka’ (from the Tatar name for Lithuania) is the community’s later name, from the 16th–17th centuries (Kryczyński 1938). Tower Shields is dropped: the pavise is above all Bohemian and Italian, and Lithuanian infantry was secondary."
relevance = "The settlement of 1397–98 gave the grand dukes a body of steppe horsemen serving for land, who fought at Grunwald, and left a community that still exists."

[tree]
add = ["Genitour", "Elite Genitour"]
remove = ["Cannon Galleon", "Elite Cannon Galleon", "Galleon", "Fast Fire Ship", "Galleon, Fast Fire Ship and Carrack", "Block Printing"]

[tree.basis]
"Genitour" = "Pending the owner’s extension of the regional-unit decision to Lithuania (codex-wide question CQ23); without it, the Light Cavalry stays the top light cavalry and javelin cavalry goes to N2. Lithuanian armies relied on light horsemen with shield, spear and javelins, the sulitsa of the Rus' chronicles (Polish sulica); they raided fast and fought mounted or on foot (Šmidtas 2019 on Lithuanian light cavalry; Peter of Dusburg and Wigand of Marburg on the raids). The Genitour, a javelin-throwing light horseman, is the closest existing unit; as a regional unit it does not count as a unique unit (RULES 6.1). Trained at the Archery Range from the Castle Age, as for the Berbers’ allies, and renamed Sulica Rider. It takes over the light-cavalry role of the dropped Winged Hussar."
"Elite Genitour" = "The Elite upgrade of the Sulica Rider (Archery Range), for the same light horsemen; pending with the Genitour."
"Cannon Galleon" = "No naval tradition: no gun-armed warships. The Grand Duchy’s Baltic coast was the Palanga strip (confirmed at Melno, 1422), and its Black Sea littoral under Vytautas (Kachibey, from which grain was shipped to Constantinople in 1415, according to Długosz) was a steppe frontier without a fleet."
"Elite Cannon Galleon" = "As Cannon Galleon."
"Galleon" = "No war fleet: the basic navy only, under the codex navy rule (Galley-line to War Galley, Fire Galley and Fire Ship, Hulk and War Hulk, demolition ships and the generic Dock techs)."
"Fast Fire Ship" = "As Galleon."
"Galleon, Fast Fire Ship and Carrack" = "Nothing is left for this upgrade once the Galleon and Fast Fire Ship are removed (the Lithuanians already lacked the Carrack)."
"Block Printing" = "No printing in the window: the first press in the Grand Duchy was Francysk Skaryna’s in Vilnius (1522)."

[[rename]]
from = "Genitour"
to = "Sulica Rider"
level = 1
basis = "A descriptive name after the sulica (Rus' sulitsa), the throwing spear of Lithuanian and Ruthenian light horsemen; it is a modern coinage, not a troop name found in the sources."

[[rename]]
from = "Elite Genitour"
to = "Elite Sulica Rider"
level = 1
basis = "Same rename for the Elite upgrade."

[architecture]
set = "Eastern European"
change = "kept"
basis = "After the mid-14th century most of the Grand Duchy’s people were Orthodox Ruthenians, Vilnius had Orthodox churches beside the Catholic ones, and building was largely in timber; the Eastern European set fits that majority better than a Latin one. The grand dukes also built brick Gothic castles on the Order’s model (Trakai Island, Kaunas, Medininkai, Vilnius Upper Castle), which this set does not show: a known gap."

[[dropped]]
item = "Winged Hussar"
kind = "unique_unit"
reason = "Anachronistic and of the wrong type: a heavy lancer of the late 16th and 17th centuries (Kircholm, 1605, under the Lithuanian hetman Chodkiewicz) that the game used as a light raider. Its light-cavalry role passes to the Sulica Rider (the regional Genitour) and the Light Cavalry."

[[dropped]]
item = "Leitis"
kind = "unique_unit"
reason = "Fails the relevance test (RULES 6.9), whose bar is highest for a unique unit. The leičiai existed: first named in 1407, they were servitors settled on the grand duke’s estates with guard, military and horse duties (Dubonis 1998). But nothing shows that they were an elite heavy cavalry, the armour-ignoring attack is invented, and the unit’s fame was made by the game itself (2021), so it cannot tip the case; the tie to the etymology of Lietuva is itself debated. The unique-unit slot goes to the Boyar, for the boyar banners that were the Grand Duchy’s real heavy cavalry. The owner may keep the Leitis as a second unique unit (see open questions)."
