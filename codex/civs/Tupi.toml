civ = "Tupi"
name = "Tupi"
status = "draft"
label = "Archer and Infantry civilization"
summary = "The coastal Tupi (1000–1567): manioc farming, war-canoe fleets and allied flotillas replace the unfounded bonuses, Morubixaba and collective work (Motyrõ) become the techs, the Blackwood Archers reach the Archery Range in the Imperial Age, and slingers, Keeps, stone walls and siege engines go."
ideas = [
  "N3: An igara war-canoe line (bark or dugout canoes carrying a war party and firing arrows) replacing the Galley-line; in N1 the Canoe and War Canoe renames give the Galley line the look of the Scenario Editor Canoe.",
  "N2: Capture and renaming: warriors who kill or capture enemies gain lasting bonuses, as the executioner of a captive took new names and prestige (Fernandes 1952; Carneiro da Cunha & Viveiros de Castro 1985); capture warfare, the central Tupinambá institution, needs a mechanic that N1 does not have (the Morubixaba tech carries it in N1).",
  "N2: Fire arrows: Foot Archers deal fire damage over time to buildings, after the burning arrows of cotton soaked in wax that Staden saw the native besiegers of Igarassu shoot at the houses in 1548 (left out of N1 by the relevance test as one arrow type).",
  "N2: The moquém: hunted meat and fish that keep, smoked on the wooden grill whose French name, boucan, gave ‘buccaneer’ (left out of N1 so as not to stack a second strong economic bonus).",
  "N2: A bow line split from the Crossbowman (RULES section 10); the Blackwood Archers at the Archery Range in the Imperial Age are the N1 stop-gap.",
  "N3: A caiçara (palisaded village) replacing the Castle and the towers.",
  "N3: Re-theme the Monk as the pajé and the wandering karaí prophets.",
  "N3: A victory condition other than Wonders and Relics for stateless societies (game-model theme).",
  "N3: Feather work (the Tupinambá feather cloaks) and cauim feasts as cultural content for the history text and site.",
]
contested = [
  "The reality and meaning of anthropophagy: Arens' denial (1979) is rejected by most; readings by Fernandes, Viveiros de Castro and Fausto.",
  "The ‘Land without Evil’ migrations: pre-colonial (H. Clastres) or a reaction to colonialism (Pompa; Noelli).",
  "The chronology and routes of the Tupi-Guarani expansion to the coast (Brochado against Noelli).",
  "The reliability and rhetorical shaping of Staden and Léry (Whitehead), including the length of Staden's captivity (about nine months in 1554, or 1552–1555).",
  "The identity of Cunhambebe (Thevet speaks of a father and son of the same name).",
  "The civ's name: ‘Tupi’ names a language family and works as an umbrella term; for the peoples described here (Tupinambá, Tupiniquim, Temiminó, Potiguara, Caeté) ‘Tupinambá’ or ‘Coastal Tupi’ would be more exact (analysis). Decision: the name stays, since English scholarship uses ‘Tupi’ for these coastal peoples (Hemming 1978) and the civ renames are limited to the English, Anglo-Saxons and Arabs (RULES section 4 and 6.16.15); the profile and the summary name the coastal Tupi.",
  "Almost all written evidence dates from 1550–1570; that the traits of this design (bows, clubs, canoe raids, manioc, palisaded villages, chiefs, collective work) originated before 1500 is inferred from archaeology and from the sources' description of them as native custom (RULES section 2).",
]
open_questions = []

[profile]
entity = "The Tupi-speaking peoples of the Brazilian coast: Tupinambá (including the Tamoio of Rio de Janeiro and São Paulo), Tupiniquim, Temiminó, Potiguara and Caeté"
region = "Atlantic coast of Brazil"
window = "1000–1567 (the coastal Tupi from archaeology; the core is the pre-contact coastal Tupi, c. 1000–1500, as the written record from 1500, centred on Guanabara Bay in 1555–1567, describes them)"
sources = [
  "Hans Staden, Warhaftige Historia (Marburg, 1557); ed. N. Whitehead & M. Harbsmeier (2008)",
  "Hans Staden, The Captivity of Hans Stade of Hesse, in A.D. 1547–1555, trans. Albert Tootal, annotated by Richard F. Burton (Hakluyt Society, 1874)",
  "André Thevet, Les Singularitez de la France Antarctique (1557)",
  "Jean de Léry, Histoire d'un voyage faict en la terre du Brésil (1578)",
  "Gabriel Soares de Sousa, Tratado descritivo do Brasil em 1587",
  "José de Anchieta, letters; Arte de grammatica da lingoa mais usada na costa do Brasil (1595)",
  "Simão de Vasconcelos, Crônica da Companhia de Jesus do Estado do Brasil (1663)",
  "Alfred Métraux, La civilisation matérielle des tribus Tupi-Guarani (1928); La religion des Tupinamba (1928)",
  "Florestan Fernandes, A organização social dos Tupinambá (1949); A função social da guerra na sociedade Tupinambá (1952)",
  "Manuela Carneiro da Cunha & Eduardo Viveiros de Castro, ‘Vingança e temporalidade: os Tupinambás’, Journal de la Société des Américanistes 71 (1985)",
  "Eduardo Viveiros de Castro, A inconstância da alma selvagem (2002)",
  "Carlos Fausto, ‘Fragmentos de história e cultura tupinambá’ (1992)",
  "John Hemming, Red Gold (1978)",
]

[[bonus]]
text = "Villagers can garrison in Settlements"
kind = "other"
level = 1
change = "kept"
precedent = "Villagers can garrison in Settlements (Tupi); Villagers can garrison in Houses (Khmer)"
basis = "Tupinambá villages (taba) of a few great communal houses (oca) were ringed by palisades, sometimes double, as the woodcuts of Staden's book (1557) show."
relevance = "Palisaded villages were the units of the endemic war of capture and vengeance: they raided, were raided and defended themselves as a whole."

[[bonus]]
text = "Farmers work +15% faster"
kind = "economic"
level = 1
change = "new"
replaces = "Archery Range and Barracks upgrades cost -50% food"
precedent = "Farmers work +15% faster (Slavs)"
basis = "The Tupinambá staple was manioc, grown by women in slash-and-burn gardens and made into flours, including a dry ‘war flour’ that kept for months and was carried on campaigns, and into cauim beer (Léry 1578; Soares de Sousa 1587); it yields much food for little labour. The bonus it replaces had no direct basis (rated unfounded), though the analysis suggests reading it as war flour."
relevance = "Manioc fed Tupi villages and war parties; Tupi society rested on it."

[[bonus]]
text = "Warships cost -10/15/20% in Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "new"
replaces = "Fallen units return 15% of their cost"
precedent = "Warships cost -10/15/20% in Feudal/Castle/Imperial Age (Vikings)"
basis = "War parties travelled in fleets of bark and dugout canoes (igara, ubá), each carrying many warriors: Staden, a captive of the Tupinambá in 1554, describes a raiding fleet of several dozen canoes against the Tupiniquim near Bertioga (38 in a summary of his account). A ‘battle of the canoes’ in Guanabara Bay in 1566 is a later Jesuit tradition, told by Simão de Vasconcelos (1663) and bound up with the legend of Saint Sebastian. The bonus it replaces had no clear link and, if it alluded to anthropophagy, inverted it: the Tupinambá ate captive enemies, not their own dead (rated unfounded)."
relevance = "Coastal raiding by canoe fleets was, with the taking of captives, the defining form of Tupinambá war."
contested = "Staden's canoe count and the size of the crews have not been checked against the 2008 edition; the 1566 battle is known only from the later Jesuit tradition."

[[bonus]]
text = "Blackwood Archers available at the Archery Range in Imperial Age"
kind = "military"
level = 1
change = "new"
precedent = "Condottiero available at the Barracks in Imperial Age (Italians team bonus); Genitour available at the Archery Range starting in Castle Age (Berbers team bonus)"
basis = "This bonus is a RULES 6.11 substitution rather than a separate trait. Massed archery with great bows of hard dark woods was the core of Tupinambá war (Staden; Léry). The crossbow was unknown in Brazil, so the Crossbowman and Arbalester are removed; the Blackwood Archers take their place as the Imperial-Age foot archer of the Archery Range. The Imperial Age follows the Italian precedent, since the unit is trained in pairs at half population and is strong in numbers. It is also the Tupi's fourth passive, the RULES 6.1 minimum. Decision: this substitution is kept rather than Castle Age availability, which would make a half-population unit from every Archery Range very strong, or a level-2 Archery Range tech, which would then need another passive (the pajé healers were the candidate)."
relevance = "Massed archery decided Tupi battles, and an Imperial-Age foot archer at the Archery Range keeps that weight in the late game."

[team_bonus]
text = "Transport Ships +5 line of sight and cost -50%"
level = 1
change = "new"
replaces = "Towers and Castles provide +10 population space"
precedent = "Transport Ships +5 line of sight and cost -50% (Sicilians team bonus)"
basis = "Tupi villages made war in alliances, and allied villages joined their canoes for raids along the coast: Staden saw the Tupinambá villages of the Ubatuba region gather a fleet for a raid on their Tupiniquim enemies (1554). The same practice later carried the Tamoio confederation alongside its French allies and the Temiminó of Araribóia alongside the Portuguese in Guanabara Bay (1560s). RULES 6.2: alliances. Each village (taba) under its own chief was an autonomous polity, so alliances between villages are alliances between independent allies (RULES 6.16.14). The bonus it replaces assumed towers and castles the Tupi never built (rated unfounded). The Sicilians have the same team bonus, and with the warships discount the Tupi share both naval elements with the Sicilians' design; the overlap is accepted, since each element rests on its own history (RULES 6.7, 6.16.12)."
relevance = "Alliances between autonomous villages, joined for canoe raids along the coast, were how the Tupi made war on any scale."
contested = "The alliances the sources document before the colonial wars are among Tupi villages. The alliances with the French (the Tamoio confederation, 1554–1567) and the Portuguese (the Temiminó, 1560s) are post-1500, and a post-1500 element is allowed only in the Imperial Age (RULES section 2), so they illustrate the practice but do not carry this always-on team bonus."

[[unique_unit]]
name = "Blackwood Archers"
model = "Blackwood Archers"
building = "Castle"
level = 1
change = "kept"
basis = "The chroniclers describe bows taller than European ones, made of hard dark woods (the airi palm, pau-d'arco), and massed archery was central to Tupinambá war (Léry 1578; Métraux 1928). Training the Blackwood Archers in pairs at half population abstracts these masses. Also trainable at the Archery Range in the Imperial Age (see bonuses). The model is shared with the Malians' Tontajon."
relevance = "The great bow was the main Tupi weapon, and massed archers decided Tupi battles."

[[unique_unit]]
name = "Ibirapema Warrior"
model = "Ibirapema Warrior"
building = "Barracks"
level = 1
change = "kept"
basis = "The ibirapema, a decorated wooden club, is the most iconic Tupinambá object: it served in the ritual execution of captives and also in battle (Staden; Léry). The frontal area attack is an acceptable abstraction of the heavy two-handed club."
relevance = "The club of ritual execution is the emblem of the Tupinambá war of capture and vengeance, the central institution of their society."

[[unique_tech]]
name = "Morubixaba"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Tacape Warriors and Ibirapema Warriors attack +25% faster"
level = 2
change = "new"
replaces = "Caciques"
precedent = "Effect type of Caciques (Tupi: Champi Warriors and Slingers attack +25% faster), with the targets changed; Paiks (Bengalis: Rathas and Elephant Units attack +20% faster). Caciques kept as it is would be half dead, since the Slinger leaves the Tupi tree (it passes unchanged to the Mapuche as Toqui)."
basis = "‘Cacique’ is a Taíno word from the Antilles; the Tupi called their chiefs morubixaba, like Cunhambebe, whose authority was greatest in war and rested on prestige won in combat (Staden; Thevet; Fernandes 1949). That prestige came from enemies killed and captives taken: the warrior who killed a captive in the ritual execution took a new name, and the tacape and the ibirapema were the instruments of capture and execution (Fernandes 1952; Carneiro da Cunha & Viveiros de Castro 1985). The effect keeps the kind of Caciques but applies it to the Tupi club fighters instead of the Andean mace and the sling, which the Tupi did not use; it carries capture warfare in N1 until the N2 renaming mechanic exists (see ideas)."
relevance = "Chiefs whose authority came from war and from the captives they took led every Tupi expedition; the morubixaba embodies a society organised for war and vengeance."

[[unique_tech]]
name = "Motyrõ"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Builders work +30% faster"
level = 2
change = "new"
precedent = "Builders work +30% faster (Spanish). No existing unique tech renders collective labour."
basis = "Village men cleared the forest together for new manioc gardens and built the great longhouses and the palisades in common work parties, and villages were moved and rebuilt every few years (Métraux 1928; Fernandes 1949); Old Tupi motyrõ, ‘work in common’, is the source of Brazilian Portuguese ‘mutirão’. Faster building renders the work parties that raised and rebuilt the villages; the clearing of the gardens already carries the Coivara rename, and a wood-gathering effect would stack a second gathering bonus on manioc farming (RULES 6.14). For a people without a state the Town Center tech represents a community institution (RULES 6.3); its basis is thin, since the 16th-century sources describe the communal clearing and building but not the institution's name, which is known from colonial Tupi. Decision: Motyrõ is kept rather than a level-2 tech for the council of elders and principal men that decided war, village moves and the fate of captives (Léry 1578; Thevet 1557; Fernandes 1949), which is better attested but has no fitting existing effect."
relevance = "Collective work raised and moved the villages and cleared their gardens, and the institution and its Tupi name live on in Brazil as the mutirão."

[tree]
add = []
remove = [
  "Siege Workshop", "Battering Ram", "Capped Ram", "Siege Ram", "Mangonel", "Onager",
  "Scorpion", "Heavy Scorpion", "Siege Tower", "Trebuchet",
  "Crossbowman", "Arbalester",
  "Halberdier", "Slinger",
  "Galleon", "Catapult Galleon",
  "Keep", "Stone Wall", "Gate",
]

[tree.basis]
"Siege Workshop" = "The Tupi built no siege engines: villages were attacked by surprise, by assault on the palisade and with fire. At the siege of the Portuguese settlement of Igarassu in 1548 Staden saw the native besiegers, on a coast held by Tupi-speaking peoples, shoot burning arrows of cotton and wax at the houses; Staden does not call them Caeté, an identification that comes from Richard Burton's footnote to the Hakluyt Society edition (1874). Removing the workshop removes all its units; the Tacape line (strong against buildings), Arson, Sappers and Petards replace them (owner's decision, RULES 6.16.5; RULES 6.11 and section 10). Every Castle must then be taken by units standing in its arrow fire, so castle-breaking is slow; this is accepted until an N2/N3 assault unit exists, with no compensating bonus (RULES 6.16.13). The Petard, a 16th-century gunpowder charge, stays unrenamed as a flagged generic abstraction of assault parties with fire, outside the one-late-element limit (RULES 6.16.2)."
"Battering Ram" = "Removed with the Siege Workshop: there were no rams and no wheeled vehicles."
"Capped Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Siege Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Mangonel" = "Removed with the Siege Workshop: no torsion or traction artillery existed in the Americas."
"Onager" = "Removed with the Siege Workshop (see Mangonel)."
"Scorpion" = "Removed with the Siege Workshop: no bolt-throwers existed in the Americas."
"Heavy Scorpion" = "Removed with the Siege Workshop (see Scorpion)."
"Siege Tower" = "Removed with the Siege Workshop: a wheeled assault tower."
"Trebuchet" = "Counterweight artillery never existed in the Americas."
"Crossbowman" = "The crossbow was unknown in Brazil, and the Americas have neither crossbow tier (RULES 6.16.3); Tupi warfare rested on great bows. The Blackwood Archers become available at the Archery Range in the Imperial Age in its place (bonus). In the current game the Bulgarians also lack crossbows."
"Arbalester" = "Removed with the Crossbowman (see there)."
"Halberdier" = "Removed under the codex convention for the American civs (RULES 6.16.6, the owner's decision on their power budget): a playability line, not a historical one, since the kept Pikeman bears as European a name; the American spear line stops at the Pikeman, as the game already does for the Aztecs and Muisca. The Tupi fought with bows and clubs, and Spearman and Pikeman remain as a generic abstraction."
"Slinger" = "The sling is not a characteristic Tupinambá weapon in the 16th-century sources, and the Andean slinger belongs to the Inca world (analysis: wrong)."
"Galleon" = "Ocean-going sailing warships were unknown; the Tupi navy was a fleet of bark and dugout canoes (see the warships bonus). Boat tier (RULES 6.16.1), resting on these canoes: the high-seas sailing ships (the Galleon; the Tupi never had the Carrack) are removed and the siege ship goes with the siege engines, while the Galley (renamed Canoe), Fire Ship, Demolition and Hulk lines stay with their tiers as a generic abstraction of canoe fleets for water maps; the demolition ships are generic post-1500 items kept as flagged abstractions (RULES 6.16.2)."
"Catapult Galleon" = "A sailing ship carrying a catapult: both a European ship type and a siege engine."
"Keep" = "Region-wide tower policy: only the Keep, a stone tower, needs documented stone towers, so it stays only where they are documented (the Inca); the Guard Tower stays as a generic tier wherever the Watch Tower stays. The Tupi built no towers: their defences were palisades and stakes (Staden's woodcuts), and their Watch Tower and Guard Tower are abstractions of a defended village. The Castle itself stays for structural reasons (it trains the unique unit, researches the Castle tech and is needed for the Imperial Age) until an N3 caiçara replaces it (ideas)."
"Stone Wall" = "There was no stone building; palisades, sometimes double, were the Tupi fortification. Stone walls are removed (in the current game the Cumans and Goths also lack them; the Goths' design adds them) and Palisade Walls remain."
"Gate" = "Removed with the Stone Wall; the Palisade Gate remains."

[[rename]]
from = "Champi Scout"
to = "Tacape Scout"
level = 1
basis = "The tacape was the Tupi wooden war club. Champi is the Quechua name of the Andean stone or bronze mace, and the Tupi had no metal before contact (analysis: wrong). For the same reason the Blacksmith tiers (Forging, Iron Casting, Scale Mail, Chain Mail and Plate Mail Armor, Ring Archer Armor) keep their generic names as a flagged generic equipment level (RULES 6.16.6): the Tupi fought without metal or body armour. Chemistry stays for its +1 ranged attack as a flagged abstraction. The Tupi lack Blast Furnace in the game, and the design leaves it so."

[[rename]]
from = "Champi Runner"
to = "Tacape Runner"
level = 1
basis = "Same rename as Champi Scout."

[[rename]]
from = "Champi Warrior"
to = "Tacape Warrior"
level = 1
basis = "Same rename as Champi Scout."

[[rename]]
from = "Elite Champi Warrior"
to = "Elite Tacape Warrior"
level = 1
basis = "Same rename as Champi Scout."

[[rename]]
from = "Horse Collar"
to = "Coivara"
level = 1
basis = "There were no draft animals. Fields were cleared by felling and burning the forest (coivara, a word of Tupi origin), and the ash fertilised each new plot: a real equivalent of ‘new Farms provide more food’. Heavy Plow keeps its generic name as a flagged abstraction (RULES 6.16.6), as do Coinage and Banking, since the Tupi had no money; the Tupi already lacked Crop Rotation."

[[rename]]
from = "Wheelbarrow"
to = "Panacu"
level = 1
basis = "Same effect as Wheelbarrow. There were no wheeled vehicles, and loads were carried in large baskets: Léry (1578) describes Tupinambá women bringing fruit to the ships at Guanabara in great baskets, which he calls by their Tupi name (panacu in the modern spelling, Old Tupi panaku), the word that survives in Brazilian Portuguese for a large basket. The forehead strap (tumpline) of the Mesoamerican renames is used by lowland peoples of the interior (the waturá of the Rio Negro), but no 16th-century source on the coast was found to describe it, so the rename follows the basket that the coastal source names. Hand Cart keeps its generic name as a flagged abstraction (RULES 6.16.6)."

[[rename]]
from = "Galley"
to = "Canoe"
model = "Canoe"
level = 1
basis = "Tupi war parties travelled in fleets of bark and dugout canoes (igara, ubá), each carrying many warriors (Staden; see the warships bonus). The Scenario Editor Canoe, a light boat that shoots arrows like the Galley (RULES section 5), gives the Galley the look of a war canoe; the Galley keeps its stats, and the Canoe's look and scale must be checked in game. Same rename as for the Aztecs, Maya and Mapuche; the igara war-canoe line proper is an N3 idea."

[[rename]]
from = "War Galley"
to = "War Canoe"
model = "Canoe"
level = 1
basis = "Upgrade tier of the renamed Galley, with the same Canoe look (see Galley)."

[architecture]
set = "South American"
level = 1
change = "kept"
basis = "The South American set fits best among the existing ones; a set of thatched longhouses and palisades would be N3."

[[dropped]]
item = "Start with +25 of each resource"
kind = "bonus"
reason = "A balance device with no historical basis (rated unfounded). The moquém (meat that does not decay) is not used as its replacement: a food-processing detail (RULES 6.9) that would stack a second strong economic bonus on manioc farming (RULES 6.14); it is kept as an N2 idea."

[[dropped]]
item = "Curare"
kind = "unique_tech"
reason = "Curare is a Carib word for a hunting poison of Amazonia and the Guianas, not documented among the coastal Tupi, whose arrowheads were of cane, bone, shark teeth and stingray spines; fortifications with poison damage were invented (rated stretched). Fire Arrows are not used as its replacement because they fail the relevance test (one arrow type, RULES 6.9), although Staden saw the native besiegers of Igarassu shoot burning arrows of cotton and wax in 1548; they are kept as an N2 idea."
