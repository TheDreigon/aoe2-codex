[[bonus]]
text = "Buildings +10/20/30/40% HP in Dark/Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Buildings +10/20/30/40% HP in Dark/Feudal/Castle/Imperial Age (Byzantines)"
basis = "The Theodosian Walls (408–413, rebuilt after the earthquake of 447) were never breached by a land assault before 1453: they held against Avars and Persians (626), Arabs (717–718) and Bulgars (813, 913, 924); entries such as those of 1081, 1204 and 1261 (and several in the 14th-century civil wars) came through treachery, the sea walls or surprise. From the 7th century fortified kastra anchored the defence of Anatolia (Haldon, 1999)."
relevance = "Without the walls of Constantinople and the Anatolian kastra the empire would probably have fallen in 626 or 717–718; they are one of the traits that best explain its survival."

[[bonus]]
text = "Skirmishers and Spearman-line cost -25%"
kind = "military"
level = 1
change = "changed"
replaces = "Camel Riders, Skirmishers and Spearman-line cost -25%"
precedent = "Camel Riders, Skirmishers and Spearman-line cost -25% (Byzantines)"
basis = "Byzantine heavy infantry were shield-bearing spearmen: the skutatoi of the Strategikon with the kontarion, and the hoplitai of the Praecepta Militaria, among whom the menavlatoi with the heavier menavlion met the enemy's heavy cavalry; light archers and javelinmen (psiloi, akontistai) backed them (Strategikon XII.B; McGeer, 1995). The camels go: the regular camel units (alae dromedariorum) of the Notitia Dignitatum (c. 400) are not attested afterwards, the loss of Syria and Egypt (636–642) took away the lands that bred and used them, and camels then appear only as pack animals."
relevance = "Spear-and-missile infantry garrisoned the kastra and formed the hollow square from which the 10th-century kataphraktoi sallied, and the menavlatoi were the army's answer to enemy heavy horse; a long military tradition from the Strategikon to the Praecepta, not a detail."

[[bonus]]
text = "Town Watch, Town Patrol free"
kind = "other"
level = 1
change = "kept"
precedent = "Town Watch, Town Patrol free (Byzantines)"
basis = "Frontier intelligence: the scouts and spies (kataskopoi, trapezitai) of the De velitatione (10th century) and the beacon chain attributed to Leo the Mathematician under Theophilos (829–842), which linked the fortress of Loulon near the Cilician Gates to the Great Palace."
relevance = "For three centuries of Arab raids (c. 650–950) Anatolia survived by early warning and retreat into the kastra (De velitatione); the intelligence network, not one beacon anecdote, is the trait."

[[bonus]]
text = "All gold income +10%"
kind = "economic"
level = 1
change = "new"
replaces = "Advancing to Imperial Age costs -33%"
precedent = "Grand Trunk Road: All gold income +10% faster; Market trading fee reduced to 10% (Hindustanis; gold half only); Villagers drop off +10% more gold (Malians)"
basis = "Byzantium was a tax state that ran on gold: the solidus or nomisma kept its weight and fineness from Constantine I to the debasements of the mid-11th century, the land tax and the 10% customs duty (kommerkion) of Constantinople were paid largely in coin, and the treasury paid salaries (roga), the fleet and the subsidies of its diplomacy in coin. Justinian inherited the reserve of 320,000 lb of gold that Anastasius I had left (Procopius, Secret History 19.7–8), and Basil II left 200,000 talents in the treasury (Psellos, Chronographia I.31). The original bonus was a play on the word “Imperial”, with no historical content (Haldon, 1999; Treadgold, 1995)."
relevance = "The gold-based fiscal state paid the army, bought peace and ransomed defeats for eight centuries; it is one of the foundations of the empire's long survival."
contested = "An abstraction: the bonus rewards mining, trade and relics, whereas the treasury's coin came above all from the land tax (see the open question on the economic slot); the gold dinar of the caliphate competed with the nomisma from 696/697."

[[bonus]]
text = "Fire Ships and Dromons attack +25% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Fire Ships and Dromons attack +25% faster (Byzantines)"
basis = "The empire kept standing war fleets: the Karabisianoi of the late 7th century, then the thematic fleet of the Kibyrrhaiotai (its droungarios is attested in 698) and the imperial fleet of Constantinople (Ahrweiler, 1966; Pryor & Jeffreys, 2006). In 626 the fleet sank the Slavs' dugouts in the Golden Horn and kept the Persian army on the Asian shore (Chronicon Paschale), and it carried the expeditions that retook Crete (960–961) and Cyprus (965). The game's Fire Ship, the unit closest to the siphon-armed dromon, stands for this fleet; the Dromon half applies to the game's anachronistic Imperial Age bombardment ship and is kept only until the N2 change of the Dromon's role (see the ideas). The fire weapon itself, with the battles of 717–718 and 941, belongs to the Greek Fire tech."
relevance = "Standing fleets kept the sea approaches of Constantinople in imperial hands in 626 and in the Arab attacks of the 670s (or c. 667–669) and 717–718, and carried the reconquests of Crete and Cyprus; naval power is a structural trait of the empire, separate from its one datable weapon, Greek fire."
contested = "Byzantine naval superiority was real but intermittent: defeat at the Battle of the Masts (655), loss of Crete to a corsair emirate (c. 824/827–961), sack of Thessalonica by Leo of Tripoli (904)."

[team_bonus]
text = "Monks heal +100% faster"
level = 1
change = "kept"
precedent = "Monks heal +100% faster (Byzantines team bonus)"
basis = "Byzantium exported its monasticism, and the care of the sick that went with it, to the peoples it converted (Bulgaria 864/865, the Rus' 988; Obolensky, 1971). The Kiev Caves monastery adopted the rule of the Constantinopolitan Stoudios monastery under Theodosius, who built beside it a house for the poor and the sick (Nestor, Life of Theodosius), and its monk Agapit healed the sick with herbs (Kievan Caves Patericon); Sava of Serbia's typika for Hilandar (1199) and Studenica (1208), largely translated from the typikon of the Evergetis monastery in Constantinople, provided for monastery hospitals. At home the model ran from Basil of Caesarea's foundation (c. 370) to the xenon of the Pantokrator (typikon of 1136) (Miller, 1997)."
relevance = "The conversion of Bulgarians, Serbs and Rus', with Byzantine monastic institutions, is the empire's most lasting legacy (the “Byzantine Commonwealth”); healing monks stand for its charitable monasticism."
contested = "How far the Serbian typika reflect real hospitals rather than translated prescriptions is unclear."

[[unique_unit]]
name = "Cataphract"
model = "Cataphract"
building = "Castle"
level = 1
change = "kept"
basis = "The Praecepta Militaria of Nikephoros II Phokas (c. 965) and the Taktika of Nikephoros Ouranos (c. 1000) describe the kataphraktoi: horse and rider armoured in felt and iron, armed with iron maces, sabres and lances, formed in a blunt wedge to break the enemy centre (McGeer, 1995); Leo the Deacon shows Nikephoros II placing his ironclad horsemen in the van before Tarsus (965). A small, short-lived elite (c. 950–1050), with horse archers inside the formation."
relevance = "The armoured horseman, from the late Roman clibanarii to the kataphraktoi of Nikephoros II and John I (before Tarsus in 965, at Dorostolon in 971, both in Leo the Deacon), is the emblem of the Byzantine army in the offensive age that reconquered Crete, Cilicia and Antioch."

[[unique_unit]]
name = "Varangian Guard"
model = "Varangian Guard"
building = "Barracks"
level = 1
change = "kept"
basis = "The guard grew from the c. 6,000 Rus' warriors whom Vladimir of Kiev sent to Basil II in 988/989 (Stepanos Taronetsi), who fought for him at Chrysopolis and Abydos (Psellos; Skylitzes). Scandinavians served in it, Harald Hardrada among them (1034–1043), and after 1066 many Englishmen (Orderic Vitalis); Anna Komnene calls them the axe-bearing barbarians and shows them fighting on foot at Dyrrachium (1081) (Alexiad; Blöndal, 1978). Generating gold abstracts their high pay and the right to plunder the palace treasury at an emperor's death (pólútasvarf, in Haralds saga harðráða, Heimskringla). Already a Byzantine Barracks unit, now listed with its own basis; the Danes, Saxons and Gaels use the same model under other names."
relevance = "The emperor's most trusted guard from Basil II to the early 13th century and the emblem of Byzantium's foreign professionals; RULES section 4 keeps the unit with the Byzantines."
contested = "When the Rus' contingent of 988/989 became the emperor's formal bodyguard; some date its formalisation later."

[[unique_tech]]
name = "Themata"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Military Units cost -25% food"
level = 1
change = "new"
precedent = "Kshatriyas (Military Units cost -25% food) (Gurjaras, who keep it renamed Samantas; the Ethiopians' Gult and the Jurchens' Meng'an Mouke share it too): an existing unique tech, shared, moved to the Town Center and renamed, identical effect"
basis = "The themes (themata) were the late Roman field armies, withdrawn into Anatolia after the Arab conquests (630s–640s) and quartered in districts that took their names: the Anatolikon from the army of the magister militum per Orientem, the Armeniakon from that per Armeniam, the Thrakesion from that per Thracias and the Opsikion from the praesental Obsequium; their strategoi gradually took over civil authority. By the 9th–10th century many thematic soldiers held lands registered for military service (stratiotika ktemata), which supported them, their equipment and their horses, so the state paid only modest periodic roga; 10th-century novels (Constantine VII, Nikephoros II) forbade the alienation of these lands (Haldon, 1999; Lemerle, 1979). In the 10th–11th centuries thematic service was increasingly commuted into cash."
relevance = "The theme system is the institutional backbone that carried the empire through the 7th–10th centuries; it passes the test for a state tech by any measure."
contested = "When the themes took shape and whether soldiers held military lands before the 10th century (see the civ-level contested list)."

[[unique_tech]]
name = "Greek Fire"
building = "Dock"
kind = "military"
age = "Castle"
effect = "Fire Ships +1 range; Dromons and Bombard Towers increased blast radius"
level = 1
change = "changed"
replaces = "Greek Fire (same effect), formerly at the Castle"
precedent = "Greek Fire (Fire Ships +1 range; Dromons and Bombard Towers increased blast radius) (Byzantines): moved to the Dock, identical effect; its Bombard Tower clause has no target, since the tree drops the Bombard Tower"
basis = "Theophanes says that Kallinikos, an architect who had fled from Heliopolis in Syria, devised (kataskeuasas) the sea fire c. 672; projected from siphons, it burned the Arab and Rus' fleets (717–718, 941), and Anna Komnene describes its last secure naval use, against the Pisans (1099). Constantine VII told his son never to give it to any other nation (De Administrando Imperio 13). It moves to the Dock because it was a naval weapon. Its Bombard Tower clause, which tied a petroleum incendiary to gunpowder, no longer applies, because the Byzantines lose the Bombard Tower (see the tree)."
relevance = "Greek fire helped turn the siege of 717–718 (with the winter, famine in the Arab camp and Tervel's Bulgars) and the Rus' attack of 941, and it is the most famous Byzantine technique; datable (c. 672), so it is a tech, at the Dock where the sea belongs."

[[unique_tech]]
name = "Praecepta Militaria"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Cataphracts and Varangian Guards deal trample damage"
level = 1
change = "changed"
replaces = "Logistica (Cataphracts and Varangian Guards deal trample damage)"
precedent = "Logistica (Cataphracts and Varangian Guards deal trample damage) (Byzantines): renamed, identical effect"
basis = "Logistica uses the 19th-century military sense of logistics (Jomini) and has nothing to do with trample damage. The effect is the shock of the kataphraktoi wedge, whose front ranks carried iron maces (siderorabdia), described in the treatise of Nikephoros II Phokas (c. 965), known by its editors' conventional Latin title Praecepta Militaria (its Greek title is Stratēgikē ekthesis kai syntaxis Nikēphorou despotou; McGeer, 1995). The Varangian half rests not on the treatise, which predates the Guard (c. 988), but on Anna Komnene's “axe-bearing barbarians” (Alexiad; Blöndal, 1978)."
relevance = "The doctrine of the 10th-century offensive army of Nikephoros II, John I and Basil II, which reconquered Crete, Cilicia, Antioch and Bulgaria; a datable military moment at the Castle."

[tree]
add = ["Bloodlines", "Herbal Medicine", "Siege Engineers", "Heavy Scorpion", "Siege Onager"]
remove = ["Camel Rider", "Heavy Camel Rider", "Bombard Cannon", "Hand Cannoneer", "Bombard Tower"]

[tree.basis]
"Bloodlines" = "The logothete of the herds ran imperial stud farms (mētata) in Asia and Phrygia, and the imperial stable (under the komes tou staulou) kept remounts at Malagina in Bithynia, the first assembly camp of eastern expeditions (Three Treatises on Imperial Military Expeditions, ed. Haldon, 1990). Denying horse breeding to a heavy cavalry civ contradicts the sources."
"Herbal Medicine" = "Hospitals (xenones) with salaried doctors, such as the Pantokrator (1136) (Miller, 1997), and the paid rescuers (deputatoi) of the Strategikon (II.9), who carried wounded men off the field for a nomisma each; its absence clashed with the healing team bonus."
"Siege Engineers" = "Byzantium kept Roman siegecraft alive: the siege treatise of the so-called Heron of Byzantium (10th century) and the siege chapter of Leo VI's Taktika; formal sieges took Chandax in Crete (960–961), Mopsuestia and Tarsus (965)."
"Heavy Scorpion" = "Bolt-shooting engines stayed in service: Leo VI's Taktika (c. 905) has torsion or tension bolt-throwers carried in the infantry baggage (ed. Dennis, 2010)."
"Siege Onager" = "The Mangonel line stands for the traction stone-throwers (manganika, petroboloi) that Byzantium used throughout, and the Siege Onager is its generic top tier. The empire whose engineering Krum's engines copied (812, through an engineer from Byzantine service) and whose Komnenian army battered Zeugminon with great stone-throwers (1165, Niketas Choniates) gets it on the same grounds as the Bulgarians, who keep it."
"Camel Rider" = "No regular camel units after the late Roman dromedarii of the Notitia Dignitatum (c. 400); the loss of Syria and Egypt (636–642) took away the lands that bred and used them."
"Heavy Camel Rider" = "Removed with the Camel Rider (see above)."
"Bombard Cannon" = "Byzantium never had a siege artillery train: according to Doukas, the founder Orban first offered his services to Constantine XI, who could not pay him, and then cast Mehmed II's great guns. The Trebuchet, rams, Siege Onager and Siege Engineers keep the civ's siege."
"Hand Cannoneer" = "Gunpowder appears only at the very end of the window: in 1453 the defenders had a few small guns and handguns on the walls, partly brought and manned by the Genoese and Venetian contingents (Giustiniani's c. 700 men), and the recoil of the larger pieces shook the walls (Doukas; Leonard of Chios; Barbaro). Gunpowder destroyed Byzantium rather than defined it, so under the regional rule that the tree follows the period a civ represents (as for the Georgians' firearms) the handgun goes; the Arbalester covers ranged infantry."
"Bombard Tower" = "Removed with the Hand Cannoneer (see above); the Keep and Guard Tower remain, and Greek Fire's Bombard Tower clause loses its target."

[architecture]
set = "Mediterranean"
change = "kept"
basis = "Stone and brick Mediterranean building is the closest existing set to Constantinople; a proper Byzantine set is N3."
