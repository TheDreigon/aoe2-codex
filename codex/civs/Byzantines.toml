civ = "Byzantines"
name = "Byzantines"
status = "reviewed"
label = "Defensive civilization"
summary = "Byzantium (527–1453): walls and Cataphracts stay; a gold-income passive replaces the Imperial Age discount, the themes become the Town Center tech, Greek Fire moves to the Dock, Logistica becomes Praecepta Militaria, camels and late gunpowder leave, the Traction Trebuchet replaces the Trebuchet, and horse breeding, hospitals and siege engines return."
ideas = [
  "N2: Move the Dromon to the Castle Age as a short-range oared war galley (its real role from the 6th to the 12th century, armed with fire siphons from the late 7th) instead of an Imperial Age bombardment ship replacing the Cannon Galleon (Pryor & Jeffreys, The Age of the Dromon, 2006).",
  "N2: A horse-archer tech for the 6th-century army (hippotoxotai: Procopius, Wars I.1; Strategikon I.1–2), e.g. Cavalry Archer-line +20 HP and +1/+1 armor (on Parthian Tactics, see the power-budget entry of the contested list).",
  "N2: A Komnenian siege tech that unlocks the counterweight Trebuchet with a second, exclusive effect (RULES 6.6), for the great stone-throwers with which Manuel I's army battered Zeugminon (1165; Niketas Choniates), if P. E. Chevedden's reading of them as counterweight engines holds against M. S. Fulton's later dating (see the contested list and the tree).",
  "N2: A real “Logistica”: units heal slowly near Castles and Siege Workshops, standing for the assembly camps (aplekta) and baggage train (touldon) of the Three Treatises on Imperial Military Expeditions.",
  "N2: A De Administrando Imperio tech (c. 948–952): free tributes and cheaper Spies/Treason, for the diplomacy of subsidies paid to Pechenegs, Rus', Magyars and Bulgars.",
  "N2: Imperial sericulture as a Market tech (silkworm eggs smuggled in c. 552, Procopius, Wars VIII.17; the silk guilds of the Book of the Eparch, c. 911/912; the export ban on the purple silks reserved for imperial favour, the kekolymena, which Liudprand of Cremona ran into in 968, Legatio 53–55); the economic passive stays the gold income.",
  "N2: Greek fire on land: hand-siphons and ceramic grenades from walls and towers (Leo VI, Taktika), instead of any link with gunpowder towers.",
  "N3: A heavy spearman unit to show that Byzantine heavy infantry were spearmen, not swordsmen: the skutatos with the kontarion (Strategikon) and the menavlatos with the heavier menavlion (Praecepta Militaria).",
  "N3: A Byzantine architecture set, shared with the Bulgarians (their Balkan-Byzantine idea); the Mediterranean set is Italian-Romanesque. The Armenians and Georgians propose a Caucasian set of their own.",
]
contested = [
  "Origin and date of the theme system: a planned reform of Heraclius (G. Ostrogorsky's classic view, now largely abandoned) or a gradual development from the field armies withdrawn into Anatolia in the 630s–640s, on whose stages and dates Haldon, Treadgold and Kaegi differ.",
  "Whether thematic soldiers held military lands before the 10th century: Treadgold (land grants under Constans II, c. 659–662) versus Haldon, Lemerle and Oikonomides (gradual development, formalised only in the 10th century).",
  "Chronology of the first Arab attack on Constantinople: Theophanes' seven-year siege of 674–678 or a campaign of c. 667–669 (Jankowiak, 2013).",
  "Composition of Greek fire (crude petroleum with resins; saltpetre is now doubted), whether Kallinikos really devised it (Theophanes mentions fire-carrying ships slightly earlier) and when the secret was lost.",
  "Whether Byzantium had an essentially defensive “grand strategy” (Luttwak, 2009) or a reactive, opportunistic policy (Haldon, Kaldellis).",
  "Byzantine origin of the counterweight trebuchet (P. E. Chevedden, “The Invention of the Counterweight Trebuchet: A Study in Cultural Diffusion”, Dumbarton Oaks Papers 54, 2000) or diffusion from the Islamic world, and its date. On Chevedden's reading of the great stone-throwers with which the Komnenian army battered Zeugminon (Niketas Choniates) as counterweight engines, the engine was in Byzantine use by 1165; M. S. Fulton (Artillery in the Era of the Crusades: Siege Warfare and the Development of Trebuchet Technology, 2018) places its appearance only at the end of the 12th century. It was certainly in use in the region by c. 1187 (al-Tarsusi's treatise for Saladin). Decision: the Traction Trebuchet, Byzantium's heavy engine from the late 6th century to the end of the window and the only one of its core, replaces the game's Trebuchet in the one Imperial Age heavy-engine slot (see the tree); the Mangonel line is the light stone-thrower (RULES 6.16.5). The decision holds on either dating, since it rests on the core (c. 670–1100).",
  "Thumb Ring stays in the tree under the second case of RULES 6.16.4, an archery tradition the army demonstrably used: steppe horse archers fought for the empire throughout the window, from Belisarius' Hun (Massagetae) allies, all of them mounted archers (Procopius, Wars III.11), through the Pecheneg and Uze contingents of Romanos IV's army at Manzikert (1071; Michael Attaleiates) and the Cumans with whom Alexios I destroyed the Pechenegs at Levounion (1091; Anna Komnene, Alexiad VIII), to the Cumans whom John III Vatatzes settled in Thrace, Macedonia and Asia Minor (c. 1242). That the empire's own archers drew with the thumb (the first case) is only a reading: the Strategikon (I.1) trains the soldier to shoot rapidly on foot “either in the Roman or the Persian manner” without describing either, and Dennis (1984), after A. D. H. Bivar, reads the Roman manner as a draw with thumb and forefinger taken from the steppe nomads and the Persian as one with the lower three fingers.",
  "Crossbows (RULES 6.16.3): the Crossbowman is the generic Castle Age bow tier, and the Arbalester stays as the Imperial Age tier, flagged as an abstraction for the core (c. 670–1100). The crossbow (tzangra) reached Byzantium with the Latins: Anna Komnene still calls it a barbarian bow unknown to the Greeks in the 1090s (Alexiad X.8), and it stayed in the Byzantine world from then on, down to 1453, when Genoese and Venetian crossbowmen held the land walls beside Giustiniani (Barbaro; Leonard of Chios). How far native Byzantine troops took it up is less clear. Unlike the guns of 1453 (see the Hand Cannoneer), the crossbow was present for the last three and a half centuries of the window, not only at its edge (RULES 6.16.19(d)).",
  "Power budget (RULES 6.14), the level-1 review's default: Parthian Tactics stays out of the N1 tree as a power-budget choice, not a historical claim, and the site labels it as such. The design gains Themata, the gold income, Bloodlines, Herbal Medicine, Siege Engineers, the Heavy Scorpion and the Siege Onager against the lost Imperial Age discount, camels, Bombard Cannon, Hand Cannoneer, Bombard Tower and Block Printing, and Themata stacks with the Skirmisher and Spearman-line discount (about -44% food on those units). The evidence would support the tech: the Strategikon (I.1) drills the cavalryman to shoot at the gallop to the front, the rear and both flanks, Leo VI's Taktika (c. 905) laments the neglect of archery and orders young Romans to practise it, and the Praecepta Militaria put horse archers inside the kataphraktoi wedge. The swap of the counterweight Trebuchet for the Traction Trebuchet (see the tree) lowers the late siege power a little and leaves this default unchanged.",
  "When the Rus' contingent of 988/989 became the emperor's formal bodyguard, the Varangian Guard; some date its formalisation later.",
  "The name “Byzantine” (Hieronymus Wolf, 1557) and the nature of Byzantine Roman identity (Kaldellis vs “Greek” or multi-ethnic readings). Its people called themselves Rhomaioi (Romans) and the state Basileia tōn Rhōmaiōn; the design keeps “Byzantines”, the convention of English scholarship, since RULES section 4 renames a civ only where that scholarship does not use the game's name (RULES 6.16.15).",
]
