civ = "Byzantines"
name = "Byzantines"
status = "draft"
label = "Defensive civilization"
summary = "The Eastern Roman Empire (527–1453, core c. 670–1100): walls, Cataphracts and Greek fire are kept and the Varangian Guard is listed as a second unique unit; the Imperial Age pun gives way to the gold-based fiscal state, the theme system becomes the Town Center tech (Themata), Greek Fire moves to the Dock, Logistica is renamed after the Praecepta Militaria, the naval bonus now rests on the standing fleets, camels and the gunpowder of the last decades leave, and the tree regains horse breeding, hospitals and siege engineering."
ideas = [
  "N2: Move the Dromon to the Castle Age as a short-range oared war galley (its real role from the 6th to the 12th century, armed with fire siphons from the late 7th) instead of an Imperial Age bombardment ship replacing the Cannon Galleon (Pryor & Jeffreys, The Age of the Dromon, 2006).",
  "N2: A horse-archer tech for the 6th-century army (hippotoxotai: Procopius, Wars I.1; Strategikon I.1–2), e.g. Cavalry Archer-line +20 HP and +1/+1 armor.",
  "N2: A real “Logistica”: units heal slowly near Castles and Siege Workshops, standing for the assembly camps (aplekta) and baggage train (touldon) of the Three Treatises on Imperial Military Expeditions.",
  "N2: A De Administrando Imperio tech (c. 948–952): free tributes and cheaper Spies/Treason, for the diplomacy of subsidies paid to Pechenegs, Rus', Magyars and Bulgars.",
  "N2: Imperial sericulture as a Market tech (silkworm eggs smuggled in c. 552, Procopius, Wars VIII.17; the silk guilds of the Book of the Eparch, c. 911/912; the export ban on the purple silks reserved for imperial favour, the kekolymena, which Liudprand of Cremona ran into in 968, Legatio 53–55), if the economic slot is not used for it (see the open questions).",
  "N2: Greek fire on land: hand-siphons and ceramic grenades from walls and towers (Leo VI, Taktika), instead of any link with gunpowder towers.",
  "N3: A heavy spearman unit to show that Byzantine heavy infantry were spearmen, not swordsmen: the skutatos with the kontarion (Strategikon) and the menavlatos with the heavier menavlion (Praecepta Militaria).",
  "N3: A Byzantine (or Balkan-Caucasian) architecture set; the Mediterranean set is Italian-Romanesque.",
]
contested = [
  "Origin and date of the theme system: a planned reform of Heraclius (G. Ostrogorsky's classic view, now largely abandoned) or a gradual development from the field armies withdrawn into Anatolia in the 630s–640s, on whose stages and dates Haldon, Treadgold and Kaegi differ.",
  "Whether thematic soldiers held military lands before the 10th century: Treadgold (land grants under Constans II, c. 659–662) versus Haldon, Lemerle and Oikonomides (gradual development, formalised only in the 10th century).",
  "Chronology of the first Arab attack on Constantinople: Theophanes' seven-year siege of 674–678 or a campaign of c. 667–669 (Jankowiak, 2013).",
  "Composition of Greek fire (crude petroleum with resins; saltpetre is now doubted), whether Kallinikos really devised it (Theophanes mentions fire-carrying ships slightly earlier) and when the secret was lost.",
  "Whether Byzantium had an essentially defensive “grand strategy” (Luttwak, 2009) or a reactive, opportunistic policy (Haldon, Kaldellis).",
  "Byzantine origin of the counterweight trebuchet (Chevedden) or diffusion from the Islamic world.",
  "The name “Byzantine” (Hieronymus Wolf, 1557) and the nature of Byzantine Roman identity (Kaldellis vs “Greek” or multi-ethnic readings).",
]
open_questions = [
  "Rename the civ? Its people called themselves Rhomaioi (Romans) and the state Basileia tōn Rhōmaiōn. With the Romans civ out of scope, “Romans” or “Eastern Romans” would be possible; “Byzantines” remains the academic convention. Kept as “Byzantines” here.",
  "Mule Cart (owner's question): not given to the Byzantines; they keep the Lumber and Mining Camps. Mules carried the imperial baggage train (Three Treatises on Imperial Military Expeditions), but pack mules were universal in the Mediterranean and nothing makes them a Byzantine speciality. Other regions' drafts now give the Mule Cart alongside the camps to the Castilians, Portuguese, Ethiopians and Tatars. Should the Byzantines get it too, alongside the camps or replacing them?",
  "Economic slot: the Imperial Age discount (-33%, a play on the word “Imperial”) is replaced by “All gold income +10%” for the gold-based fiscal state, although the effect rewards mining, trade and relics while the treasury's coin came above all from the land tax. Alternatives: “Farmers slowly generate gold in addition to food” (Burgundian Vineyards' effect, the closest rendering of a land tax paid in coin; strong, so it would replace the +10% rather than join it; four other drafts already use it as a Town Center tech); restore the original as gameplay identity; “Coinage, Banking free” (the nomisma and tribute diplomacy, but very weak in play); or a silk economy (“Trade Units generate +x% gold”, or the N2 sericulture Market tech in the ideas). Which does the owner prefer?",
  "Camel Rider and Heavy Camel Rider are removed (no regular camel units after the late Roman dromedarii of the Notitia Dignitatum, c. 400). Alternative: keep them as a nod to those late Roman dromedarii.",
  "Masonry and Architecture are still missing because the building HP bonus covers them. An N1 option: restore both and lower the bonus (e.g. +10/15/20/25% HP), so that the builders of Hagia Sophia (Anthemios and Isidore, 532–537) and of hundreds of kastra get them.",
  "Power budget: Themata, the gold income bonus, Bloodlines, Herbal Medicine, Siege Engineers, Heavy Scorpion and Siege Onager against the lost Imperial Age discount, camels, Bombard Cannon, Hand Cannoneer and Bombard Tower. Themata also stacks with the Skirmisher and Spearman-line discount (about -44% food on those units if the two reductions multiply). As an offset, Parthian Tactics is not added, although horse archery is attested inside the core window: the Strategikon (I.1) drills the cavalryman to shoot at the gallop to the front, the rear and both flanks, Leo VI's Taktika (c. 900) laments the neglect of archery and orders young Romans to practise it, and the Praecepta Militaria put horse archers inside the kataphraktoi wedge. Restoring it is a question of power, not of history: add it, or cut something else?",
  "Gunpowder (regional rule): the tree follows the period a civ represents, so gunpowder that appears only marginally at the very end of a civ's window is left out. The Byzantines therefore lose the Hand Cannoneer and Bombard Tower (the few guns of 1453, partly Italian), as the Georgians lose their Hand Cannoneer. Under the alternative rule (anything attested inside the window), the Byzantines would keep both. Which rule does the owner prefer?",
  "Themata reuses Kshatriyas (Military Units cost -25% food), which four drafts now share under four names for four land-for-service systems: Samantas (Gurjaras, its current holder), Themata (Byzantines), Gult (Ethiopians) and Meng'an Mouke (Jurchens). RULES 6.7 allows it, and the Byzantine theme lands are the best-documented case. Accept the four-way share, or should one of the other civs change?",
  "Varangian Guard: listed here as the second unique unit. RULES section 4 keeps it Byzantine; the Danes and Saxons field the same model as the Housecarl and the Gaels as the Galloglass, while the Swedes and Norwegians drop it. It is the Barracks unit the civ already has, so nothing changes in play. Keep it as a unique unit, or treat it as a plain tree unit?",
  "Team bonus: “Monks heal +100% faster” is kept, now resting on the spread of Byzantine monastic medicine to the Orthodox neighbours (RULES 6.2). Alternative: a team bonus for the builders and craftsmen Byzantium sent abroad, with a building effect for allies (e.g. “Repairers work +25% faster”, the Saxons' current team bonus): Petronas Kamateros built Sarkel for the Khazars (c. 840, De Administrando Imperio 42), Greek masters built Kiev's Tithe Church (989–996, Russian Primary Chronicle), Nikephoros II sent al-Hakam II a mosaicist and tesserae for the mihrab of Córdoba (960s, Ibn Idhari), and Desiderius brought mosaicists from Constantinople to Monte Cassino (1066–1071, Leo of Ostia, Chronicle of Monte Cassino III.27). Which does the owner prefer?",
]

[profile]
