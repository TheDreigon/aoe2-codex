[[bonus]]
text = "Buildings +10/20/30/40% HP in Dark/Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Buildings +10/20/30/40% HP in Dark/Feudal/Castle/Imperial Age (Byzantines)"
basis = "The Theodosian Walls (408–413, rebuilt after the earthquake of 447) were never breached by a land assault before 1453: they held against Avars and Persians (626), Arabs (717–718) and Bulgars (813, 913, 924); entries such as those of 1081, 1204 and 1261 (and several in the 14th-century civil wars) came through treachery, the sea walls or surprise. From the 7th century fortified kastra anchored the defence of Anatolia (Haldon, 1999). Masonry and Architecture stay out of the tree, as in the game, because this bonus already renders the builders of the walls, of Hagia Sophia (Anthemios and Isidore, 532–537) and of hundreds of kastra; restoring them with a lower bonus was weighed and not taken."
relevance = "Without the walls of Constantinople and the Anatolian kastra the empire would probably have fallen in 626 or 717–718; they are one of the traits that best explain its survival."

[[bonus]]
text = "Skirmishers and Spearman-line cost -25%"
kind = "military"
level = 1
change = "changed"
replaces = "Camel Riders, Skirmishers and Spearman-line cost -25%"
precedent = "Camel Riders, Skirmishers and Spearman-line cost -25% (Byzantines)"
basis = "Byzantine heavy infantry were shield-bearing spearmen: the skutatoi of the Strategikon with the kontarion, and the hoplitai of the Praecepta Militaria, among whom the menavlatoi with the heavier menavlion met the enemy's heavy cavalry; light archers and javelinmen (psiloi, akontistai) backed them (Strategikon XII.B; McGeer, 1995). The camels go: camel riders served the empire only on its desert frontiers, from the alae dromedariorum of the Notitia Dignitatum (c. 400) to the camels and camel riders (dromedarioi) levied at Nessana in the Negev in the 6th century (P. Ness. 35, with the camel account P. Ness. 37; whether they formed a military camel corps is debated, see the tree), and the loss of Syria, Palestine and Egypt (636–642) ended them."
relevance = "Spear-and-missile infantry garrisoned the kastra and formed the hollow square from which the 10th-century kataphraktoi sallied, and the menavlatoi were the army's answer to enemy heavy horse; a long military tradition from the Strategikon to the Praecepta, not a detail."

[[bonus]]
text = "Town Watch, Town Patrol free"
kind = "other"
level = 1
change = "kept"
precedent = "Town Watch, Town Patrol free (Byzantines)"
basis = "Frontier intelligence: the scouts and spies (kataskopoi, trapezitai) of the De velitatione (10th century) and the beacon chain attributed to Leo the Mathematician under Theophilos (829–842), which linked the fortress of Loulon near the Cilician Gates to the Great Palace."
relevance = "For three centuries of Arab raids (c. 650–950) Anatolia survived by early warning and retreat into the kastra (De velitatione); the intelligence network, not one beacon anecdote, is the trait."

[[bonus]]
text = "All gold income +10% faster"
kind = "economic"
level = 1
change = "new"
replaces = "Advancing to Imperial Age costs -33%"
precedent = "Grand Trunk Road: All gold income +10% faster; Market trading fee reduced to 10% (Hindustanis; gold half only, a Castle Age tech). For the earlier ages: Villagers drop off +10% more gold (Malians, from the Dark Age) and Trade Units generate +25% gold (Spanish team bonus, from the Dark Age; here at a lower magnitude); relic gold starts only in the Castle Age, Grand Trunk Road's age, so no part of the effect comes earlier than an existing one (RULES 6.16.11)"
basis = "Byzantium was a tax state that ran on gold: the solidus or nomisma kept its weight and fineness from Constantine I to the debasements of the mid-11th century, the land tax and the 10% customs duty (kommerkion) of Constantinople were paid largely in coin, and the treasury paid salaries (roga), the fleet and the subsidies of its diplomacy in coin. Justinian inherited the reserve of 320,000 lb of gold that Anastasius I had left (Procopius, Secret History 19.7–8), and Basil II left 200,000 talents in the treasury (Psellos, Chronographia I.31). The original bonus was a play on the word “Imperial”, with no historical content (Haldon, 1999; Treadgold, 1995)."
relevance = "The gold-based fiscal state paid the army, bought peace and ransomed defeats for eight centuries; it is one of the foundations of the empire's long survival."
contested = "An abstraction: the bonus rewards mining, trade and relics, whereas the treasury's coin came above all from the land tax; the gold dinar of the caliphate competed with the nomisma from 696/697. The design keeps this effect over the alternatives weighed: “Farmers slowly generate gold in addition to food” (Burgundian Vineyards, the closest rendering of a land tax paid in coin, but strong, and already a Town Center tech in several designs), “Coinage, Banking free” (very weak in play) and a silk economy (left to the N2 sericulture idea). No Mule Cart is given: pack mules were common to the whole Mediterranean, so the civ keeps the Lumber and Mining Camps, and the Mule Cart stays with its four holders (RULES 6.16.7)."

[[bonus]]
text = "Fire Ships and Dromons attack +25% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Fire Ships and Dromons attack +25% faster (Byzantines)"
basis = "The empire kept standing war fleets: the Karabisianoi of the late 7th century, then the thematic fleet of the Kibyrrhaiotai (its droungarios is attested in 698) and the imperial fleet of Constantinople (Ahrweiler, 1966; Pryor & Jeffreys, 2006). In 626 the fleet sank the Slavs' dugouts in the Golden Horn and kept the Persian army on the Asian shore (Chronicon Paschale), and it carried the expeditions that retook Crete (960–961) and Cyprus (965). These standing fleets of oared war galleys (dromons and chelandia) make the civ a fleet of ships, which keeps every generic tier, the Galleon as a flagged abstraction (RULES 6.16.1, 6.16.2). The game's Fire Ship, the unit closest to the siphon-armed dromon, stands for this fleet; the Dromon half applies to the game's anachronistic Imperial Age bombardment ship and is kept only until the N2 change of the Dromon's role (see the ideas). The fire weapon itself, with the battles of 717–718 and 941, belongs to the Greek Fire tech."
relevance = "Standing fleets kept the sea approaches of Constantinople in imperial hands in 626 and in the Arab attacks of the 670s (or c. 667–669) and 717–718, and carried the reconquests of Crete and Cyprus; naval power is a structural trait of the empire, separate from its one datable weapon, Greek fire."
contested = "Byzantine naval superiority was real but intermittent: defeat at the Battle of the Masts (655), loss of Crete to a corsair emirate (c. 824/827–961), sack of Thessalonica by Leo of Tripoli (904)."

[team_bonus]
text = "Monks heal +100% faster"
level = 1
change = "kept"
precedent = "Monks heal +100% faster (Byzantines team bonus). The Mapuche's design uses the same effect as a passive, so a Mapuche player with a Byzantine ally gets both, stacked as the game stacks them; N1 accepts the stack and flags it here (RULES 6.16.12)"
basis = "Byzantium exported its monasticism, and the care of the sick that went with it, to the peoples it converted (Bulgaria 864/865, the Rus' 988; Obolensky, 1971). The Kiev Caves monastery adopted the rule of the Constantinopolitan Stoudios monastery under Theodosius, who built beside it a house for the poor and the sick (Nestor, Life of Theodosius), and its monk Agapit healed the sick with herbs (Kievan Caves Patericon); Sava of Serbia's typika for Hilandar (1199) and Studenica (1208), largely translated from the typikon of the Evergetis monastery in Constantinople, provided for monastery hospitals. At home the model ran from Basil of Caesarea's foundation (c. 370) to the xenon of the Pantokrator (typikon of 1136) (Miller, 1997)."
relevance = "The conversion of Bulgarians, Serbs and Rus', with Byzantine monastic institutions, is the empire's most lasting legacy (the “Byzantine Commonwealth”); healing monks stand for its charitable monasticism."
contested = "How far the Serbian typika reflect real hospitals rather than translated prescriptions is unclear. The design keeps the game's team bonus; the builders and craftsmen Byzantium sent abroad were weighed as an alternative, with a building effect for allies (“Repairers work +25% faster”, the Saxons' team bonus in the game, which the Anglo-Saxons' design drops): Petronas Kamateros built Sarkel for the Khazars (c. 840, De Administrando Imperio 42), Greek masters built Kiev's Tithe Church (989–996, Russian Primary Chronicle), Nikephoros II sent al-Hakam II a mosaicist and tesserae for the mihrab of Córdoba (960s, Ibn Idhari), and Desiderius brought mosaicists from Constantinople to Monte Cassino (1066–1071, Leo of Ostia, Chronicle of Monte Cassino III.27)."

[[unique_unit]]
name = "Cataphract"
model = "Cataphract"
building = "Castle"
level = 1
change = "kept"
basis = "The Praecepta Militaria of Nikephoros II Phokas (c. 965) and the Taktika of Nikephoros Ouranos (c. 1000) describe the kataphraktoi: horse and rider armoured in felt and iron, armed with iron maces, sabres and lances, formed in a blunt wedge to break the enemy centre (McGeer, 1995); Leo the Deacon shows Nikephoros II placing his ironclad horsemen in the van before Tarsus (965). A small, short-lived elite (c. 950–1050), with horse archers inside the formation. The model is shared with the Koreans' Gaema Musa (owner's decision)."
relevance = "The armoured horseman, from the late Roman clibanarii to the kataphraktoi of Nikephoros II and John I (before Tarsus in 965, at Dorostolon in 971, both in Leo the Deacon), is the emblem of the Byzantine army in the offensive age that reconquered Crete, Cilicia and Antioch."

[[unique_tech]]
name = "Themata"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Military Units cost -25% food"
level = 1
change = "new"
precedent = "Kshatriyas (Military Units cost -25% food) (Gurjaras, who keep it renamed Samantas; the Burmese Ahmudan, the Ethiopians' Gult, the Gaels' Buannacht, the Japanese Shugo-Jito and the Jurchens' Meng'an Mouke share it too: seven designs in all, each for its own system of service paid in land or kind, a reuse that RULES 6.7 and 6.16.12 accept): an existing unique tech, shared, moved to the Town Center and renamed, identical effect"
basis = "The themes (themata) were the late Roman field armies, withdrawn into Anatolia after the Arab conquests (630s–640s) and quartered in districts that took their names: the Anatolikon from the army of the magister militum per Orientem, the Armeniakon from that per Armeniam, the Thrakesion from that per Thracias and the Opsikion from the praesental Obsequium; their strategoi gradually took over civil authority. By the 9th–10th century many thematic soldiers held lands registered for military service (stratiotika ktemata), which supported them, their equipment and their horses, so the state paid only modest periodic roga; 10th-century novels (Constantine VII, Nikephoros II) forbade the alienation of these lands (Haldon, 1999; Lemerle, 1979). In the 10th–11th centuries thematic service was increasingly commuted into cash."
relevance = "The theme system is the institutional backbone that carried the empire through the 7th–10th centuries; it passes the test for a state tech by any measure."
contested = "When the themes took shape and whether soldiers held military lands before the 10th century (see the civ-level contested list)."

[[unique_tech]]
name = "Greek Fire"
building = "Dock"
kind = "military"
age = "Castle"
effect = "Fire Ships +1 range; Dromons increased blast radius"
level = 1
change = "changed"
replaces = "Greek Fire (Fire Ships +1 range; Dromons and Bombard Towers increased blast radius), formerly at the Castle"
precedent = "Greek Fire (Fire Ships +1 range; Dromons and Bombard Towers increased blast radius) (Byzantines): moved to the Dock, identical in play; the effect text leaves out the Bombard Tower clause, which has no target once the tree drops the Bombard Tower"
basis = "Theophanes says that Kallinikos, an architect who had fled from Heliopolis in Syria, devised (kataskeuasas) the sea fire c. 672; projected from siphons, it burned the Arab and Rus' fleets (717–718, 941), and Anna Komnene describes its last secure naval use, against the Pisans (1099). Constantine VII told his son never to give it to any other nation (De Administrando Imperio 13). It moves to the Dock because it was a naval weapon. The game's Bombard Tower clause, which tied a petroleum incendiary to gunpowder, is left out, because the Byzantines lose the Bombard Tower (see the tree)."
relevance = "Greek fire helped turn the siege of 717–718 (with the winter, famine in the Arab camp and Tervel's Bulgars) and the Rus' attack of 941, and it is the most famous Byzantine technique; datable (c. 672), so it is a tech, at the Dock where the sea belongs."

[[unique_tech]]
name = "Praecepta Militaria"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Cataphracts and Varangian Guards deal trample damage"
level = 1
change = "changed"
replaces = "Logistica (Cataphracts and Varangian Guards deal trample damage)"
precedent = "Logistica (Cataphracts and Varangian Guards deal trample damage) (Byzantines): renamed, identical effect"
basis = "Logistica uses the 19th-century military sense of logistics (Jomini) and has nothing to do with trample damage. The effect is the shock of the kataphraktoi wedge, whose front ranks carried iron maces (siderorabdia), described in the treatise of Nikephoros II Phokas (c. 965), known by its editors' conventional Latin title Praecepta Militaria (its Greek title is Stratēgikē ekthesis kai syntaxis Nikēphorou despotou; McGeer, 1995). The Varangian half rests not on the treatise, which predates the Guard, but on the guard itself, which stays in the tree under its own name as a regional unit that does not count as a unique unit (RULES section 4 and 6.16.10): it grew from the c. 6,000 Rus' warriors whom Vladimir of Kiev sent to Basil II in 988/989 (Stepanos Taronetsi), took in Scandinavians such as Harald Hardrada (1034–1043) and, after 1066, many Englishmen (Orderic Vitalis), and fought on foot at Dyrrhachium (1081), where Anna Komnene calls its men the axe-bearing barbarians (Alexiad; Blöndal, 1978)."
relevance = "The doctrine of the 10th-century offensive army of Nikephoros II, John I and Basil II, which reconquered Crete, Cilicia, Antioch and Bulgaria; a datable military moment at the Castle."

[tree]
add = ["Bloodlines", "Herbal Medicine", "Siege Engineers", "Heavy Scorpion", "Siege Onager", "Traction Trebuchet"]
remove = ["Camel Rider", "Heavy Camel Rider", "Trebuchet", "Bombard Cannon", "Hand Cannoneer", "Bombard Tower", "Block Printing"]

[tree.basis]
"Bloodlines" = "The logothete of the herds ran imperial stud farms (mētata) in Asia and Phrygia, and the imperial stable (under the komes tou staulou) kept remounts at Malagina in Bithynia, the first assembly camp of eastern expeditions (Three Treatises on Imperial Military Expeditions, ed. Haldon, 1990). Denying horse breeding to a heavy cavalry civ contradicts the sources."
"Herbal Medicine" = "Hospitals (xenones) with salaried doctors, such as the Pantokrator (1136) (Miller, 1997), and the paid rescuers (deputatoi) of the Strategikon (II.9), who carried wounded men off the field for a nomisma each; its absence clashed with the healing team bonus."
"Siege Engineers" = "Byzantium kept Roman siegecraft alive: the siege treatise of the so-called Heron of Byzantium (10th century) and the siege chapter of Leo VI's Taktika; formal sieges took Chandax in Crete (960–961), Mopsuestia and Tarsus (965)."
"Heavy Scorpion" = "Bolt-shooting engines stayed in service: Leo VI's Taktika (c. 905) has torsion or tension bolt-throwers carried in the infantry baggage (ed. Dennis, 2010)."
"Siege Onager" = "The Mangonel line is the light stone-thrower (RULES 6.16.5), here the light engines that Byzantine armies and garrisons used throughout the window, and the Siege Onager is its generic top tier. The empire whose engineering Krum's engines copied (812, through an engineer from Byzantine service) gets it on the same grounds as the Bulgarians, who keep it; the heavy engine is the Traction Trebuchet (see that entry)."
"Traction Trebuchet" = "The rope-pulled heavy stone-thrower was Byzantium's heavy engine from the late 6th century to the end of the window, and its only one in the core (c. 670–1100): the helepoleis of the late 6th- and 7th-century sources, which G. T. Dennis reads as heavy traction stone-throwers (“Byzantine Heavy Artillery: The Helepolis”, Greek, Roman and Byzantine Studies 39, 1998), and the stone-throwing engines of the siege warfare of the 10th-century reconquests (Haldon, 1999). The first clear description of the engine in the Mediterranean world is of the Avar-Slav siege of Thessalonica, dated 586 or 597 (Miracles of St Demetrius I). Theophylact Simocatta (II.16) says that a Roman captive, the soldier Busas, taught the Avars to build a helepolis at Appiaria (587), but what that engine was (ram, tower or stone-thrower) and how reliable the story is are debated, so the design does not rest on it. Whether the Byzantines knew the engine before the Avar sieges of the late 6th century or learned it from the Avars is debated (Dennis 1998; S. McCotter, Byzantines, Avars and the Introduction of the Trebuchet, 2003; see the Avars' contested list). Under the traction test (RULES 6.16.5) it replaces the counterweight Trebuchet as the long-range siege weapon (RULES 6.11), trained at the Siege Workshop in the Imperial Age, as for the Avars."
"Trebuchet" = "The counterweight engine joined the Byzantine arsenal only in the last third of the window, by 1165 on P. E. Chevedden's reading or at the end of the 12th century on M. S. Fulton's (see the civ-level contested list), beside the traction engine. Its removal is a game-role choice, as in the Chinese design, not a finding that the engine never reached Byzantium: both engines arrive in the Imperial Age (the Trebuchet at the Castle, the Traction Trebuchet at the Siege Workshop) with almost the same role, so the tree keeps one. RULES 6.16.19(d) alone would not remove the counterweight engine: it served for some two and a half to three centuries (from 1165 or the late 12th century to 1453), not only at the edge of the window, and the same reading keeps the Arbalester (see the crossbow entry of the contested list). The removal is the one-slot game-role choice, and the core (c. 670–1100) only breaks the tie between the two engines that share the slot: the tree keeps the traction engine, Byzantium's heavy engine from the late 6th century to 1453 and the only one of its core. Restoring the counterweight engine as a Komnenian siege tech with a second, exclusive effect is an N2 idea."
"Camel Rider" = "Camel riders are attested only on the desert frontiers of the late Roman East: the alae dromedariorum of the Notitia Dignitatum (c. 400) and, in the 6th century, a levy of camels and camel riders (dromedarioi) at Nessana in the Negev, apportioned among local institutions, among them churches and the church of the kastron (P. Ness. 35), with an account of military camels (P. Ness. 37). Their editor read them as a camel corps of the local garrison (C. J. Kraemer, Excavations at Nessana III, 1958); C. Whately (“Camels, Soldiers, and Pilgrims in Sixth Century Nessana”, Scripta Classica Israelica 35, 2016, 121–135) argues, against the earlier reading of the two terms as two kinds of camel, that dromedarios means a camel rider, and re-examines how far the papyri show a military camel unit and whether the kastron was a purely military space. Either way they were local troops of the desert limes, not an arm of the field armies, and they ended with the loss of Syria, Palestine and Egypt (636–642), three decades before the core of the design (c. 670–1100). With this evidence the camels still stay out. The tree follows the period the design represents (RULES 6.16.19(d)): the camel riders served only at the opening edge of the window, as local troops, and ended before its core, the same core period that breaks the tie between the two heavy engines (see Trebuchet). A camel line for the whole empire would also misrepresent its armies."
"Heavy Camel Rider" = "Removed with the Camel Rider (see above)."
"Bombard Cannon" = "Byzantium never had a siege artillery train: according to Doukas, the founder Orban first offered his services to Constantine XI, who could not pay him, and then cast Mehmed II's great guns. The Traction Trebuchet, rams, Siege Onager and Siege Engineers keep the civ's siege."
"Hand Cannoneer" = "Gunpowder appears only at the very end of the window: in 1453 the defenders had a few small guns and handguns on the walls, partly brought and manned by the Genoese and Venetian contingents (Giustiniani's c. 700 men), and the recoil of the larger pieces shook the walls (Doukas; Leonard of Chios; Barbaro). Gunpowder destroyed Byzantium rather than defined it, and the tree follows the period a civ represents (RULES 6.16.19(d), as for the Georgians' firearms), so the handgun goes; the Arbalester covers ranged infantry (see the crossbow entry of the contested list)."
"Bombard Tower" = "Removed with the Hand Cannoneer (see above); the Keep and Guard Tower remain, and Greek Fire's effect leaves out its Bombard Tower clause."
"Block Printing" = "No printing in the window: the first book printed entirely in Greek, Constantine Laskaris' Erotemata, appeared in Milan in 1476, after the fall of Constantinople."

