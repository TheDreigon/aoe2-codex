  "Leo VI, Taktika (c. 905; ed. and tr. G. T. Dennis, 2010)",
  "Nikephoros II Phokas, Praecepta Militaria (c. 965), in E. McGeer, Sowing the Dragon's Teeth (1995)",
  "Constantine VII Porphyrogennetos, De Administrando Imperio; Three Treatises on Imperial Military Expeditions (ed. J. Haldon, 1990)",
  "The Book of the Eparch (c. 911/912)",
