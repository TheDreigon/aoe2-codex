civ = "Byzantines"
name = "Byzantines"
status = "draft"
label = "Defensive civilization"
summary = "Byzantium (527–1453): walls and Cataphracts stay; a gold-income passive replaces the Imperial Age discount, the themes become the Town Center tech, Greek Fire moves to the Dock, Logistica becomes Praecepta Militaria, camels and late gunpowder leave, and horse breeding, hospitals and siege engines return."
ideas = [
  "N2: Move the Dromon to the Castle Age as a short-range oared war galley (its real role from the 6th to the 12th century, armed with fire siphons from the late 7th) instead of an Imperial Age bombardment ship replacing the Cannon Galleon (Pryor & Jeffreys, The Age of the Dromon, 2006).",
  "N2: A horse-archer tech for the 6th-century army (hippotoxotai: Procopius, Wars I.1; Strategikon I.1–2), e.g. Cavalry Archer-line +20 HP and +1/+1 armor.",
  "N2: A real “Logistica”: units heal slowly near Castles and Siege Workshops, standing for the assembly camps (aplekta) and baggage train (touldon) of the Three Treatises on Imperial Military Expeditions.",
  "N2: A De Administrando Imperio tech (c. 948–952): free tributes and cheaper Spies/Treason, for the diplomacy of subsidies paid to Pechenegs, Rus', Magyars and Bulgars.",
  "N2: Imperial sericulture as a Market tech (silkworm eggs smuggled in c. 552, Procopius, Wars VIII.17; the silk guilds of the Book of the Eparch, c. 911/912; the export ban on the purple silks reserved for imperial favour, the kekolymena, which Liudprand of Cremona ran into in 968, Legatio 53–55), if the economic slot is not used for it (see the open questions).",
  "N2: Greek fire on land: hand-siphons and ceramic grenades from walls and towers (Leo VI, Taktika), instead of any link with gunpowder towers.",
  "N3: A heavy spearman unit to show that Byzantine heavy infantry were spearmen, not swordsmen: the skutatos with the kontarion (Strategikon) and the menavlatos with the heavier menavlion (Praecepta Militaria).",
  "N3: A Byzantine (or Balkan-Caucasian) architecture set; the Mediterranean set is Italian-Romanesque.",
]
contested = [
  "Origin and date of the theme system: a planned reform of Heraclius (G. Ostrogorsky's classic view, now largely abandoned) or a gradual development from the field armies withdrawn into Anatolia in the 630s–640s, on whose stages and dates Haldon, Treadgold and Kaegi differ.",
  "Whether thematic soldiers held military lands before the 10th century: Treadgold (land grants under Constans II, c. 659–662) versus Haldon, Lemerle and Oikonomides (gradual development, formalised only in the 10th century).",
  "Chronology of the first Arab attack on Constantinople: Theophanes' seven-year siege of 674–678 or a campaign of c. 667–669 (Jankowiak, 2013).",
  "Composition of Greek fire (crude petroleum with resins; saltpetre is now doubted), whether Kallinikos really devised it (Theophanes mentions fire-carrying ships slightly earlier) and when the secret was lost.",
  "Whether Byzantium had an essentially defensive “grand strategy” (Luttwak, 2009) or a reactive, opportunistic policy (Haldon, Kaldellis).",
  "Byzantine origin of the counterweight trebuchet (Chevedden) or diffusion from the Islamic world.",
  "When the Rus' contingent of 988/989 became the emperor's formal bodyguard, the Varangian Guard; some date its formalisation later.",
  "The name “Byzantine” (Hieronymus Wolf, 1557) and the nature of Byzantine Roman identity (Kaldellis vs “Greek” or multi-ethnic readings).",
]
open_questions = [
  "Rename the civ? Its people called themselves Rhomaioi (Romans) and the state Basileia tōn Rhōmaiōn. With the Romans civ out of scope, “Romans” or “Eastern Romans” would be possible; “Byzantines” remains the academic convention. Kept as “Byzantines” here.",
  "Codex-wide question CQ4 (see codex/civs/README.md): Mule Cart (not given here: the Byzantines keep the Lumber and Mining Camps, since pack mules were common to the whole Mediterranean).",
  "Economic slot: the Imperial Age discount (-33%, a play on the word “Imperial”) is replaced by “All gold income +10% faster” for the gold-based fiscal state, although the effect rewards mining, trade and relics while the treasury's coin came above all from the land tax. Alternatives: “Farmers slowly generate gold in addition to food” (Burgundian Vineyards' effect, the closest rendering of a land tax paid in coin; strong, so it would replace the +10% rather than join it; the Aztecs, Berbers, Persians and Tatars already use it as a Town Center tech); restore the original as gameplay identity; “Coinage, Banking free” (the nomisma and tribute diplomacy, but very weak in play); or a silk economy (“Trade Units generate +x% gold”, or the N2 sericulture Market tech in the ideas). Which does the owner prefer?",
  "Camel Rider and Heavy Camel Rider are removed (no regular camel units after the late Roman dromedarii of the Notitia Dignitatum, c. 400). Alternative: keep them as a nod to those late Roman dromedarii.",
  "Masonry and Architecture stay out of the tree, as in the game, because the building HP bonus covers them. An N1 option: restore both and lower the bonus (e.g. +10/15/20/25% HP), so that the builders of Hagia Sophia (Anthemios and Isidore, 532–537) and of hundreds of kastra get them.",
  "Power budget: Themata, the gold income bonus, Bloodlines, Herbal Medicine, Siege Engineers, Heavy Scorpion and Siege Onager against the lost Imperial Age discount, camels, Bombard Cannon, Hand Cannoneer, Bombard Tower and Block Printing. Themata also stacks with the Skirmisher and Spearman-line discount (about -44% food on those units if the two reductions multiply). As an offset, Parthian Tactics is not added, although horse archery is attested inside the core window: the Strategikon (I.1) drills the cavalryman to shoot at the gallop to the front, the rear and both flanks, Leo VI's Taktika (c. 900) laments the neglect of archery and orders young Romans to practise it, and the Praecepta Militaria put horse archers inside the kataphraktoi wedge. Restoring it is a question of power, not of history: add it, or cut something else?",
  "Codex-wide question CQ25 (see codex/civs/README.md): Rule interpretations, point (d) on marginal gunpowder at the end of a window (the Hand Cannoneer and Bombard Tower, attested here only in 1453, are left out, as the Georgians' Hand Cannoneer is).",
  "Themata reuses Kshatriyas (Military Units cost -25% food), which seven designs share under seven names for seven systems of service paid in land or kind: Samantas (Gurjaras, its holder in the game), Themata (Byzantines), Gult (Ethiopians), Meng'an Mouke (Jurchens), Ahmudan (Burmese), Buannacht (Gaels) and Shugo-Jitō (Japanese). RULES 6.7 allows it, and the Byzantine theme lands are the best-documented case. Accept the seven-way share, or should one of the other civs change? (Codex-wide question CQ11 asks about the scale of reuse in general.)",
  "Codex-wide question CQ8 (see codex/civs/README.md): Regional units (the Varangian Guard, which the game classifies as a regional unit, stays in the Byzantine tree under its own name, as RULES section 4 decides, but does not count as a unique unit).",
  "Team bonus: “Monks heal +100% faster” is kept, resting on the spread of Byzantine monastic medicine to the Orthodox neighbours (RULES 6.2). Alternative: a team bonus for the builders and craftsmen Byzantium sent abroad, with a building effect for allies (e.g. “Repairers work +25% faster”, the Saxons' team bonus in the game, which their design drops): Petronas Kamateros built Sarkel for the Khazars (c. 840, De Administrando Imperio 42), Greek masters built Kiev's Tithe Church (989–996, Russian Primary Chronicle), Nikephoros II sent al-Hakam II a mosaicist and tesserae for the mihrab of Córdoba (960s, Ibn Idhari), and Desiderius brought mosaicists from Constantinople to Monte Cassino (1066–1071, Leo of Ostia, Chronicle of Monte Cassino III.27). Which does the owner prefer?",
]

[profile]
entity = "Eastern Roman Empire (Basileia tōn Rhōmaiōn), centred on Constantinople"
region = "Anatolia, the southern Balkans and the eastern Mediterranean"
window = "527–1453 (core c. 670–1100)"
sources = [
  "Procopius of Caesarea, Wars, Buildings and Secret History (6th century)",
  "Chronicon Paschale (7th century)",
  "Maurice (attrib.), Strategikon (c. 600; tr. G. T. Dennis, 1984)",
  "Theophanes the Confessor, Chronographia (c. 815; tr. C. Mango & R. Scott, 1997)",
  "Leo VI, Taktika (c. 905; ed. and tr. G. T. Dennis, 2010)",
  "Nikephoros II Phokas, Praecepta Militaria (c. 965), in E. McGeer, Sowing the Dragon's Teeth (1995)",
  "Constantine VII Porphyrogennetos, De Administrando Imperio; Three Treatises on Imperial Military Expeditions (ed. J. Haldon, 1990)",
  "The Book of the Eparch (c. 911/912)",
  "Leo the Deacon, History (tr. A.-M. Talbot & D. F. Sullivan, 2005); Michael Psellos, Chronographia; John Skylitzes, Synopsis Historion",
  "Anna Komnene, Alexiad; Niketas Choniates, History",
  "J. Haldon, Warfare, State and Society in the Byzantine World 565–1204 (1999)",
  "W. Treadgold, Byzantium and Its Army 284–1081 (1995) and “The military lands and the imperial estates in the Middle Byzantine Empire” (Harvard Ukrainian Studies 7, 1983)",
  "P. Lemerle, The Agrarian History of Byzantium (1979)",
  "H. Ahrweiler, Byzance et la mer (1966)",
  "J. Pryor & E. Jeffreys, The Age of the Dromon (2006)",
  "T. Miller, The Birth of the Hospital in the Byzantine Empire (1985; 2nd ed. 1997)",
  "S. Blöndal, The Varangians of Byzantium (tr. B. Benedikz, 1978)",
  "D. Obolensky, The Byzantine Commonwealth (1971)",
  "A. Kaldellis, Romanland (2019) and The New Roman Empire (2023)",
]

[[bonus]]
text = "Buildings +10/20/30/40% HP in Dark/Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Buildings +10/20/30/40% HP in Dark/Feudal/Castle/Imperial Age (Byzantines)"
basis = "The Theodosian Walls (408–413, rebuilt after the earthquake of 447) were never breached by a land assault before 1453: they held against Avars and Persians (626), Arabs (717–718) and Bulgars (813, 913, 924); entries such as those of 1081, 1204 and 1261 (and several in the 14th-century civil wars) came through treachery, the sea walls or surprise. From the 7th century fortified kastra anchored the defence of Anatolia (Haldon, 1999)."
relevance = "Without the walls of Constantinople and the Anatolian kastra the empire would probably have fallen in 626 or 717–718; they are one of the traits that best explain its survival."

[[bonus]]
text = "Skirmishers and Spearman-line cost -25%"
kind = "military"
level = 1
change = "changed"
replaces = "Camel Riders, Skirmishers and Spearman-line cost -25%"
precedent = "Camel Riders, Skirmishers and Spearman-line cost -25% (Byzantines)"
basis = "Byzantine heavy infantry were shield-bearing spearmen: the skutatoi of the Strategikon with the kontarion, and the hoplitai of the Praecepta Militaria, among whom the menavlatoi with the heavier menavlion met the enemy's heavy cavalry; light archers and javelinmen (psiloi, akontistai) backed them (Strategikon XII.B; McGeer, 1995). The camels go: the regular camel units (alae dromedariorum) of the Notitia Dignitatum (c. 400) are not attested afterwards, the loss of Syria and Egypt (636–642) took away the lands that bred and used them, and camels then appear only as pack animals."
relevance = "Spear-and-missile infantry garrisoned the kastra and formed the hollow square from which the 10th-century kataphraktoi sallied, and the menavlatoi were the army's answer to enemy heavy horse; a long military tradition from the Strategikon to the Praecepta, not a detail."

[[bonus]]
text = "Town Watch, Town Patrol free"
kind = "other"
level = 1
change = "kept"
precedent = "Town Watch, Town Patrol free (Byzantines)"
basis = "Frontier intelligence: the scouts and spies (kataskopoi, trapezitai) of the De velitatione (10th century) and the beacon chain attributed to Leo the Mathematician under Theophilos (829–842), which linked the fortress of Loulon near the Cilician Gates to the Great Palace."
relevance = "For three centuries of Arab raids (c. 650–950) Anatolia survived by early warning and retreat into the kastra (De velitatione); the intelligence network, not one beacon anecdote, is the trait."

[[bonus]]
text = "All gold income +10% faster"
kind = "economic"
level = 1
change = "new"
replaces = "Advancing to Imperial Age costs -33%"
precedent = "Grand Trunk Road: All gold income +10% faster; Market trading fee reduced to 10% (Hindustanis; gold half only); Villagers drop off +10% more gold (Malians)"
basis = "Byzantium was a tax state that ran on gold: the solidus or nomisma kept its weight and fineness from Constantine I to the debasements of the mid-11th century, the land tax and the 10% customs duty (kommerkion) of Constantinople were paid largely in coin, and the treasury paid salaries (roga), the fleet and the subsidies of its diplomacy in coin. Justinian inherited the reserve of 320,000 lb of gold that Anastasius I had left (Procopius, Secret History 19.7–8), and Basil II left 200,000 talents in the treasury (Psellos, Chronographia I.31). The original bonus was a play on the word “Imperial”, with no historical content (Haldon, 1999; Treadgold, 1995)."
relevance = "The gold-based fiscal state paid the army, bought peace and ransomed defeats for eight centuries; it is one of the foundations of the empire's long survival."
contested = "An abstraction: the bonus rewards mining, trade and relics, whereas the treasury's coin came above all from the land tax (see the open question on the economic slot); the gold dinar of the caliphate competed with the nomisma from 696/697."

[[bonus]]
text = "Fire Ships and Dromons attack +25% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Fire Ships and Dromons attack +25% faster (Byzantines)"
basis = "The empire kept standing war fleets: the Karabisianoi of the late 7th century, then the thematic fleet of the Kibyrrhaiotai (its droungarios is attested in 698) and the imperial fleet of Constantinople (Ahrweiler, 1966; Pryor & Jeffreys, 2006). In 626 the fleet sank the Slavs' dugouts in the Golden Horn and kept the Persian army on the Asian shore (Chronicon Paschale), and it carried the expeditions that retook Crete (960–961) and Cyprus (965). The game's Fire Ship, the unit closest to the siphon-armed dromon, stands for this fleet; the Dromon half applies to the game's anachronistic Imperial Age bombardment ship and is kept only until the N2 change of the Dromon's role (see the ideas). The fire weapon itself, with the battles of 717–718 and 941, belongs to the Greek Fire tech."
relevance = "Standing fleets kept the sea approaches of Constantinople in imperial hands in 626 and in the Arab attacks of the 670s (or c. 667–669) and 717–718, and carried the reconquests of Crete and Cyprus; naval power is a structural trait of the empire, separate from its one datable weapon, Greek fire."
contested = "Byzantine naval superiority was real but intermittent: defeat at the Battle of the Masts (655), loss of Crete to a corsair emirate (c. 824/827–961), sack of Thessalonica by Leo of Tripoli (904)."

[team_bonus]
text = "Monks heal +100% faster"
level = 1
change = "kept"
precedent = "Monks heal +100% faster (Byzantines team bonus)"
basis = "Byzantium exported its monasticism, and the care of the sick that went with it, to the peoples it converted (Bulgaria 864/865, the Rus' 988; Obolensky, 1971). The Kiev Caves monastery adopted the rule of the Constantinopolitan Stoudios monastery under Theodosius, who built beside it a house for the poor and the sick (Nestor, Life of Theodosius), and its monk Agapit healed the sick with herbs (Kievan Caves Patericon); Sava of Serbia's typika for Hilandar (1199) and Studenica (1208), largely translated from the typikon of the Evergetis monastery in Constantinople, provided for monastery hospitals. At home the model ran from Basil of Caesarea's foundation (c. 370) to the xenon of the Pantokrator (typikon of 1136) (Miller, 1997)."
relevance = "The conversion of Bulgarians, Serbs and Rus', with Byzantine monastic institutions, is the empire's most lasting legacy (the “Byzantine Commonwealth”); healing monks stand for its charitable monasticism."
contested = "How far the Serbian typika reflect real hospitals rather than translated prescriptions is unclear."

[[unique_unit]]
name = "Cataphract"
model = "Cataphract"
building = "Castle"
level = 1
change = "kept"
basis = "The Praecepta Militaria of Nikephoros II Phokas (c. 965) and the Taktika of Nikephoros Ouranos (c. 1000) describe the kataphraktoi: horse and rider armoured in felt and iron, armed with iron maces, sabres and lances, formed in a blunt wedge to break the enemy centre (McGeer, 1995); Leo the Deacon shows Nikephoros II placing his ironclad horsemen in the van before Tarsus (965). A small, short-lived elite (c. 950–1050), with horse archers inside the formation. The model is shared with the Koreans' Gaema Musa (owner's decision)."
relevance = "The armoured horseman, from the late Roman clibanarii to the kataphraktoi of Nikephoros II and John I (before Tarsus in 965, at Dorostolon in 971, both in Leo the Deacon), is the emblem of the Byzantine army in the offensive age that reconquered Crete, Cilicia and Antioch."

[[unique_tech]]
name = "Themata"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Military Units cost -25% food"
level = 1
change = "new"
precedent = "Kshatriyas (Military Units cost -25% food) (Gurjaras, who keep it renamed Samantas; the Burmese Ahmudan, the Ethiopians' Gult, the Gaels' Buannacht, the Japanese Shugo-Jitō and the Jurchens' Meng'an Mouke share it too: seven designs in all): an existing unique tech, shared, moved to the Town Center and renamed, identical effect"
basis = "The themes (themata) were the late Roman field armies, withdrawn into Anatolia after the Arab conquests (630s–640s) and quartered in districts that took their names: the Anatolikon from the army of the magister militum per Orientem, the Armeniakon from that per Armeniam, the Thrakesion from that per Thracias and the Opsikion from the praesental Obsequium; their strategoi gradually took over civil authority. By the 9th–10th century many thematic soldiers held lands registered for military service (stratiotika ktemata), which supported them, their equipment and their horses, so the state paid only modest periodic roga; 10th-century novels (Constantine VII, Nikephoros II) forbade the alienation of these lands (Haldon, 1999; Lemerle, 1979). In the 10th–11th centuries thematic service was increasingly commuted into cash."
relevance = "The theme system is the institutional backbone that carried the empire through the 7th–10th centuries; it passes the test for a state tech by any measure."
contested = "When the themes took shape and whether soldiers held military lands before the 10th century (see the civ-level contested list)."

[[unique_tech]]
name = "Greek Fire"
building = "Dock"
kind = "military"
age = "Castle"
effect = "Fire Ships +1 range; Dromons increased blast radius"
level = 1
change = "changed"
replaces = "Greek Fire (Fire Ships +1 range; Dromons and Bombard Towers increased blast radius), formerly at the Castle"
precedent = "Greek Fire (Fire Ships +1 range; Dromons and Bombard Towers increased blast radius) (Byzantines): moved to the Dock, identical in play; the effect text leaves out the Bombard Tower clause, which has no target once the tree drops the Bombard Tower"
basis = "Theophanes says that Kallinikos, an architect who had fled from Heliopolis in Syria, devised (kataskeuasas) the sea fire c. 672; projected from siphons, it burned the Arab and Rus' fleets (717–718, 941), and Anna Komnene describes its last secure naval use, against the Pisans (1099). Constantine VII told his son never to give it to any other nation (De Administrando Imperio 13). It moves to the Dock because it was a naval weapon. The game's Bombard Tower clause, which tied a petroleum incendiary to gunpowder, is left out, because the Byzantines lose the Bombard Tower (see the tree)."
relevance = "Greek fire helped turn the siege of 717–718 (with the winter, famine in the Arab camp and Tervel's Bulgars) and the Rus' attack of 941, and it is the most famous Byzantine technique; datable (c. 672), so it is a tech, at the Dock where the sea belongs."

[[unique_tech]]
name = "Praecepta Militaria"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Cataphracts and Varangian Guards deal trample damage"
level = 1
change = "changed"
replaces = "Logistica (Cataphracts and Varangian Guards deal trample damage)"
precedent = "Logistica (Cataphracts and Varangian Guards deal trample damage) (Byzantines): renamed, identical effect"
basis = "Logistica uses the 19th-century military sense of logistics (Jomini) and has nothing to do with trample damage. The effect is the shock of the kataphraktoi wedge, whose front ranks carried iron maces (siderorabdia), described in the treatise of Nikephoros II Phokas (c. 965), known by its editors' conventional Latin title Praecepta Militaria (its Greek title is Stratēgikē ekthesis kai syntaxis Nikēphorou despotou; McGeer, 1995). The Varangian half rests not on the treatise, which predates the Guard, but on the guard itself, which stays in the tree under its own name as a regional unit (RULES 6.1): it grew from the c. 6,000 Rus' warriors whom Vladimir of Kiev sent to Basil II in 988/989 (Stepanos Taronetsi), took in Scandinavians such as Harald Hardrada (1034–1043) and, after 1066, many Englishmen (Orderic Vitalis), and fought on foot at Dyrrhachium (1081), where Anna Komnene calls its men the axe-bearing barbarians (Alexiad; Blöndal, 1978)."
relevance = "The doctrine of the 10th-century offensive army of Nikephoros II, John I and Basil II, which reconquered Crete, Cilicia, Antioch and Bulgaria; a datable military moment at the Castle."

[tree]
add = ["Bloodlines", "Herbal Medicine", "Siege Engineers", "Heavy Scorpion", "Siege Onager"]
remove = ["Camel Rider", "Heavy Camel Rider", "Bombard Cannon", "Hand Cannoneer", "Bombard Tower", "Block Printing"]

[tree.basis]
"Bloodlines" = "The logothete of the herds ran imperial stud farms (mētata) in Asia and Phrygia, and the imperial stable (under the komes tou staulou) kept remounts at Malagina in Bithynia, the first assembly camp of eastern expeditions (Three Treatises on Imperial Military Expeditions, ed. Haldon, 1990). Denying horse breeding to a heavy cavalry civ contradicts the sources."
"Herbal Medicine" = "Hospitals (xenones) with salaried doctors, such as the Pantokrator (1136) (Miller, 1997), and the paid rescuers (deputatoi) of the Strategikon (II.9), who carried wounded men off the field for a nomisma each; its absence clashed with the healing team bonus."
"Siege Engineers" = "Byzantium kept Roman siegecraft alive: the siege treatise of the so-called Heron of Byzantium (10th century) and the siege chapter of Leo VI's Taktika; formal sieges took Chandax in Crete (960–961), Mopsuestia and Tarsus (965)."
"Heavy Scorpion" = "Bolt-shooting engines stayed in service: Leo VI's Taktika (c. 905) has torsion or tension bolt-throwers carried in the infantry baggage (ed. Dennis, 2010)."
"Siege Onager" = "The Mangonel line stands for the traction stone-throwers (manganika, petroboloi) that Byzantium used throughout, and the Siege Onager is its generic top tier. The empire whose engineering Krum's engines copied (812, through an engineer from Byzantine service) and whose Komnenian army battered Zeugminon with great stone-throwers (1165, Niketas Choniates) gets it on the same grounds as the Bulgarians, who keep it."
"Camel Rider" = "No regular camel units after the late Roman dromedarii of the Notitia Dignitatum (c. 400); the loss of Syria and Egypt (636–642) took away the lands that bred and used them."
"Heavy Camel Rider" = "Removed with the Camel Rider (see above)."
"Bombard Cannon" = "Byzantium never had a siege artillery train: according to Doukas, the founder Orban first offered his services to Constantine XI, who could not pay him, and then cast Mehmed II's great guns. The Trebuchet, rams, Siege Onager and Siege Engineers keep the civ's siege."
"Hand Cannoneer" = "Gunpowder appears only at the very end of the window: in 1453 the defenders had a few small guns and handguns on the walls, partly brought and manned by the Genoese and Venetian contingents (Giustiniani's c. 700 men), and the recoil of the larger pieces shook the walls (Doukas; Leonard of Chios; Barbaro). Gunpowder destroyed Byzantium rather than defined it, and the tree follows the period a civ represents (as for the Georgians' firearms; codex-wide question CQ25), so the handgun goes; the Arbalester covers ranged infantry."
"Bombard Tower" = "Removed with the Hand Cannoneer (see above); the Keep and Guard Tower remain, and Greek Fire's effect leaves out its Bombard Tower clause."
"Block Printing" = "No printing in the window: the first book printed entirely in Greek, Constantine Laskaris' Erotemata, appeared in Milan in 1476, after the fall of Constantinople."

[architecture]
set = "Mediterranean"
change = "kept"
basis = "Stone and brick Mediterranean building is the closest existing set to Constantinople; a proper Byzantine set is N3."
