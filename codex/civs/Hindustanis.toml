civ = "Hindustanis"
name = "Hindustanis"
status = "draft"
label = "Cavalry Archer and Elephant civilization"
summary = "Hindustanis refocused on the Delhi Sultanate and its Ghaznavid and Ghurid forerunners (c. 1000–1526): the Ghulam becomes the Turkish slave horse archer it was, the war-horse and the royal elephant replace the camel and Mughal-era gunpowder bonuses (Knight, Cavalier, Battle Elephant, Parthian Tactics, a cavalry HP bonus and the Pil-khana tech), Grand Trunk Road gets a Sultanate name (Tanka), the Chakram Thrower moves here from the Gurjaras, the great Sultanate building works enter the tree, and the Imperial Camel Rider and Shatagni go."
ideas = [
  "N2: Ghulam as a dedicated heavy horse archer with high armour and a melee secondary attack (lance or mace), as the analysis proposes; N1 can only borrow the light Kipchak.",
  "N2: Market Regulations: Market prices move less after each trade, for Alauddin Khalji’s fixed prices, state granaries and market inspectors in Delhi (Barani, Tarikh-i Firuz Shahi).",
  "N2: Manjaniq: a siege tech for the mangonels (manjaniq, maghribi) and the raised siege ramps that Amir Khusrau and Barani describe at Ranthambore (1301), Chittor (1303) and Warangal (1310); in N1 it could only be a renamed copy of the Saracens’ Counterweights.",
  "N3: An Indo-Islamic architecture set (true arches, domes and battered bastioned walls of the Alai Darwaza and Tughlaqabad), distinct from the South Asian set’s temple forms.",
  "N3: A Mughal civ, or a post-1526 epilogue, to take the gunpowder, the Grand Trunk Road, Sher Shah Suri’s sarais and the camel swivel-gun (zamburak) that leaked into the Hindustanis.",
]
contested = [
  "Whether the Delhi Sultanate was a ‘foreign’ conquest state or an Indian state: a debate between nationalist, communalist and secular historiographies (Jackson 1999; Kumar 2007; Eaton 2019).",
  "The ‘Slave dynasty’ label: historians prefer Mamluk, Shamsi or Ilbari; the legal status of the bandagan and whether Aibak or Iltutmish founded the Sultanate are debated (Kumar 2007).",
  "The identification of the Ilbari tribe of Iltutmish and Balban with a Qipchaq clan.",
  "When gunpowder reached north India: knowledge from contact with the Mongols in the 13th century (Iqtidar Alam Khan 2004) against effective military use only with Babur (Panipat, 1526).",
  "Mahmud of Ghazni’s motives (iconoclasm, plunder or political legitimacy) and the traditional count of about seventeen campaigns (Thapar 2004).",
  "Digby’s thesis that control of the supply of war-horses and elephants explains the Sultanate’s military superiority: influential, but schematic.",
  "The historicity of Timur’s burning camels against the Delhi elephants (1398), reported by the Timurid chronicles.",
]
open_questions = [
  "Rename the civ ‘Delhi Sultanate’ (the analysis’ preferred option; ‘Indo-Turks’ is an alternative), or keep ‘Hindustanis’, the Persian name the Sultanate’s own elite used for the north Indian plain? This draft keeps the displayed name and narrows the scope to c. 1000–1526, leaving the Guptas and Harsha to the general Indian background.",
  "Gunpowder: Hand Cannoneer and Bombard Cannon stay as plain Imperial Age units (the armour bonus and Shatagni are gone), as the analysis suggests; but Ibrahim Lodi fielded no guns at Panipat (1526). Remove them and leave land gunpowder to the Bengalis and the Gurjaras’ Gujarat?",
  "The Ghulam uses the Cuman Kipchak (a light horse archer), justified by the Qipchaq origin of the Ilbari Turks; the Kipchak model is now shared by the Cumans, Georgians and Hindustanis. Prefer a heavy cavalry model (Keshik, Savar) instead?",
  "The Chakram Thrower moves here from the Gurjaras (Barbosa places the weapon in the ‘kingdom of Delli’ c. 1516), giving the Hindustanis two unique units. Accept, or drop it from the game?",
  "Power budget: Knight, Cavalier, Battle Elephant, Parthian Tactics, a second unique unit and two cavalry bonuses are a net gain over the current civ. Trim it (for example no Cavalier, or Battle Elephants only through Pil-khana)?",
  "Name of the gold tech: Tanka (the Sultanate’s silver coin) or ‘Sultans’, the name the tech had from 2013 to 2022?",
  "Caravanserai is kept for the relay posts and inns of the Sultanate roads, although the systematic chain of sarais is Sher Shah Suri’s (1540s), just after the window. Keep?",
]

[profile]
entity = "The Delhi Sultanate (Mamluk or Shamsi, Khalji, Tughluq, Sayyid and Lodi dynasties) and its Ghaznavid and Ghurid forerunners in the Punjab"
region = "Northern India (Hindustan): the Punjab, Delhi and the Ganges–Yamuna Doab"
window = "c. 1000–1526 (the Sultanate 1206–1526)"
sources = [
  "Minhaj al-Siraj Juzjani, Tabaqat-i Nasiri (c. 1260)",
  "Ziya al-Din Barani, Tarikh-i Firuz Shahi (1357)",
  "Amir Khusrau, Khaza’in al-Futuh (c. 1311)",
  "Ibn Battuta, Rihla (in India 1333–42)",
  "Babur, Baburnama (tr. W. M. Thackston, 1996)",
  "Duarte Barbosa, Livro (c. 1516; tr. M. L. Dames, 1918–21)",
  "C. E. Bosworth, The Ghaznavids (1963)",
  "Simon Digby, War-Horse and Elephant in the Dehli Sultanate (1971)",
  "Dirk H. A. Kolff, Naukar, Rajput and Sepoy (1990)",
  "Peter Jackson, The Delhi Sultanate: A Political and Military History (1999)",
  "Iqtidar Alam Khan, Gunpowder and Firearms: Warfare in Medieval India (2004)",
  "Sunil Kumar, The Emergence of the Delhi Sultanate, 1192–1286 (2007)",
  "Richard M. Eaton, India in the Persianate Age, 1000–1765 (2019)",
]
replaces = "Hindustanis as written in 2022: from the Guptas and Harsha (4th–7th centuries) to Babur and Sher Shah Suri (16th century), with the camel-and-gunpowder skeleton of the 2013 ‘Indians’"

[[bonus]]
text = "Villagers cost -8/13/18/23% in Dark/Feudal/Castle/Imperial Age"
kind = "economic"
level = 1
change = "kept"
precedent = "Villagers cost -8/13/18/23% in Dark/Feudal/Castle/Imperial Age (Hindustanis)"
basis = "The Indo-Gangetic plain was among the most densely peopled lands of the age. Babur, who conquered it in 1526, marvels at its countless workmen of every trade (Baburnama), and Kolff (1990) describes a vast peasant military labour market that supplied men to every power of the plain. An abstraction, kept."

[[bonus]]
text = "Cavalry Archers cost -10/20% in Castle/Imperial Age"
kind = "military"
level = 1
change = "new"
replaces = "Camel Riders attack +20% faster"
precedent = "Cavalry Archers cost -10/20% in Castle/Imperial Age (Huns)"
basis = "Turkish mounted archers were the decisive arm of the Ghaznavids, the Ghurids and the Sultanate: Muhammad of Ghur’s horse archers defeated Prithviraj Chauhan at the second battle of Tarain (1192) (Minhaj). The slave markets of Central Asia and, after the 1220s, Turks driven south by the Mongols kept them numerous (Jackson 1999; Kumar 2007). The camel bonus it replaces had no basis: no Sultanate source describes camel shock cavalry."

[[bonus]]
text = "Mounted Units +15% HP starting in Castle Age"
kind = "military"
level = 1
change = "new"
replaces = "Gunpowder Units +1 melee/+1 pierce armor"
precedent = "Mounted Units +20% HP starting in Feudal Age (Franks)"
basis = "The Sultanate’s cavalry rode horses imported from Central Asia and through the Gulf, better than Indian-bred mounts, and Delhi’s grip on that trade was a pillar of its power (Digby 1971). Alauddin Khalji (1296–1316) introduced the dagh (branding of horses) and the chehra or huliya (descriptive roll of each trooper) so that no one could pass muster with a substitute man or a worn-out horse (Barani). The gunpowder bonus it replaces described the Mughals: the last sultan, Ibrahim Lodi, had no guns at Panipat (1526)."
contested = "Digby’s horse-and-elephant thesis is influential but schematic; the dagh and chehra are known mainly from Barani."

[[bonus]]
text = "Can build Caravanserai in Imperial Age"
kind = "economic"
level = 1
change = "kept"
precedent = "Can build Caravanserai in Imperial Age (Hindustanis, Persians)"
basis = "Ibn Battuta describes the horse and foot relay posts (ulaq and dawa) along the Sultanate’s roads, and the caravanserai was a Persianate institution shared with Iran, which keeps the building too. The great chain of sarais on the road from Bengal to the Punjab is Sher Shah Suri’s (1540–45), just after the window."
contested = "How many sarais the Sultanate itself built before Sher Shah is not clear from the sources used here."

[team_bonus]
text = "Scout Cavalry-line and Camel Units +2 attack vs. buildings"
level = 1
change = "kept"
precedent = "Scout Cavalry-line and Camel Units +2 attack vs. buildings (Hindustanis team bonus)"
basis = "Mounted raids on towns and temple-cities mark this world, from Mahmud of Ghazni’s expeditions (Somnath, 1025–26) to the Sultanate’s plundering campaigns in the Deccan (Devagiri 1296, Warangal 1310, Ma’bar 1311) (Thapar 2004; Jackson 1999). An abstraction of plunder warfare; the camels are its weak part."

[[unique_unit]]
name = "Ghulam"
model = "Kipchak"
building = "Castle"
level = 1
change = "changed"
replaces = "Ghulam (Infantry): unique Infantry that thrusts its spear through multiple targets"
basis = "The ghulams or bandagan of the Ghaznavids, the Ghurids and the Sultanate were Turkish slave soldiers bought young and trained above all as mounted archers and officers: Sabuktigin, founder of Ghaznavid power, and the sultans Aibak, Iltutmish and Balban had all been military slaves (Bosworth 1963; Jackson 1999; Kumar 2007). Minhaj makes Iltutmish and Balban Ilbari Turks, a tribe usually placed among the Qipchaqs, so the Cuman Kipchak, a horse archer firing several arrows, is the closest existing model. The old spear-thrusting infantry inverted their role; its model passes to the Bengalis’ Paik."
contested = "The Ilbari–Qipchaq identification; the Kipchak is lighter than the often armoured ghulam cavalry (see ideas)."

[[unique_unit]]
name = "Chakram Thrower"
model = "Chakram Thrower"
building = "Castle"
level = 1
change = "new"
basis = "The chakram, a steel ring sharpened on its outer edge, carried on the arm and thrown, is first described by Duarte Barbosa (c. 1516), who places it in the ‘kingdom of Delli’, the Lodi Sultanate; it later became the emblematic weapon of the Akali Nihangs of the Punjab (17th–19th centuries). Moved here from the Gurjaras, where no source links it to Pratihara or Rajput armies; the analysis notes that it fits the Hindustanis better."
contested = "Its use by Sultanate armies in battle is not documented: Barbosa’s is a single description at the very end of the window, and the pass-through damage is game invention."

[[unique_tech]]
name = "Tanka"
age = "Castle"
effect = "All gold income +10% faster; Market trading fee reduced to 10%"
level = 1
change = "changed"
replaces = "Grand Trunk Road (All gold income +10% faster; Market trading fee reduced to 10%)"
precedent = "Grand Trunk Road (All gold income +10% faster; Market trading fee reduced to 10%) (Hindustanis)"
basis = "Iltutmish (1211–36) gave the Sultanate a standard coinage, the silver tanka with the small jital, ancestor of the later rupee; Alauddin Khalji fixed prices and policed Delhi’s markets to pay a large standing army against the Mongols (Barani). Same effect, new name: ‘Grand Trunk Road’ is a 19th-century British name for a road that Sher Shah Suri rebuilt in the 1540s, and until 2022 the tech was called ‘Sultans’."

[[unique_tech]]
name = "Pil-khana"
age = "Imperial"
effect = "Battle Elephants cost -25% and can be trained at Castles"
level = 1
change = "new"
replaces = "Shatagni (Hand Cannoneers +2 range)"
precedent = "Battle Elephants cost -25/35% in Castle/Imperial Age (Malay); Settlements can train Spearman-line and Skirmishers (Mapuche); Donjon trains the Spearman-line (Sicilians)"
basis = "The sultans held war elephants as a royal monopoly, kept in the royal elephant stables (pil-khana) and replenished by tribute and capture from Bengal, Orissa and the Deccan (Digby 1971); Alauddin’s generals brought back hundreds from the southern campaigns of 1310–11, and in 1398 Mahmud Tughluq and Mallu Iqbal met Timur before Delhi with a line of war elephants. Shatagni, which it replaces, gave an ancient Sanskrit word for a spiked missile weapon to 16th-century hand-gunners: the ‘cannon’ reading goes back to Oppert (1880) and to the Śukranīti, shown by Lallanji Gopal (1962) to be a 19th-century text."

[tree]
add = ["Knight", "Cavalier", "Battle Elephant", "Parthian Tactics", "Architecture", "Treadmill Crane", "Keep"]
remove = []

[tree.basis]
"Knight" = "The Sultanate’s core was heavy Turkish cavalry on imported horses, armoured and fighting with lance, sword and mace as well as the bow; it defeated the Chagatai invasions of 1298–1306 (Jalandhar 1298, Kili 1299, Amroha 1305, the Ravi 1306) (Barani; Jackson 1999). The total lack of shock cavalry was the strangest gap of the old tree."
"Cavalier" = "Same basis. No Paladin, which the analysis agrees would overstate it."
"Battle Elephant" = "War elephants were, with the horse, the second pillar of Sultanate power (Digby 1971); Mahmud of Ghazni already used Indian elephants, and Delhi faced Timur with them in 1398. No Elite upgrade, so the Bengalis and Tamils, closer to the elephant forests, stay the elephant specialists; Pil-khana makes them cheaper."
"Parthian Tactics" = "Harassment and feigned flight were the stock tactics of the Turkish horse archers, as of the steppe peoples who already have the tech; later chronicles describe them at Tarain (1192)."
"Architecture" = "One of the great building cultures of the age: the Qutb Minar (begun c. 1199, finished under Iltutmish), the Alai Darwaza (1311) and the walled cities of Siri (c. 1303), Tughlaqabad (1321–25) and Firuz Shah’s Firozabad (1350s)."
"Treadmill Crane" = "Same basis: the Sultanate’s monumental programmes in stone, from the Quwwat al-Islam mosque to Firuz Shah Tughluq’s new towns and canals."
"Keep" = "The massive bastioned walls and towers of Siri and Tughlaqabad, and the hill-forts the sultans took and garrisoned (Ranthambore 1301, Chittor 1303)."

[architecture]
set = "South Asian"
change = "kept"
basis = "Kept: the South Asian set is the closest existing one. A distinct Indo-Islamic set would be N3 (see ideas)."

[[dropped]]
item = "Imperial Camel Rider"
kind = "unique_unit"
reason = "No Sultanate source describes an elite camel cavalry; camel corps (shutur-sawar) and the camel swivel-gun (zamburak) belong to the late Mughal period and to 18th–19th-century Rajputana. The generic Camel Rider and Heavy Camel Rider stay for the camels of Sind and the desert routes."
