civ = "Hindustanis"
name = "Hindustanis"
status = "draft"
label = "Cavalry Archer and Elephant civilization"
summary = "Hindustanis refocused on the Delhi Sultanate and its Ghaznavid and Ghurid forerunners (1001–1526): the Ghulam becomes a Turkish slave horse archer, Dagh and Tanka replace Shatagni and Grand Trunk Road, horse archers and elephants replace camels and gunpowder, and the Sufi orders are the team bonus."
ideas = [
  "N2: Ghulam as a dedicated armoured horse archer with a melee secondary attack (lance or mace), as the analysis proposes; N1 can only borrow the light Kipchak. The Saracens' design proposes the same model for its Mamluk, since ghulam and mamluk name one institution.",
  "N2: Muqti: the iqta' revenue assignments, whose holders (muqti) kept and led the Sultanate's cavalry from Iltutmish onwards (Jackson 1999; Kumar 2007), as a further state tech with a cavalry cost effect. It is named after the assignment holder because the codex's Iqta' is the Saracens' Town Center tech, whose effect (the Turks' Sipahi) this civ already holds as Dagh.",
  "N2: Market Regulations: Market prices move less after each trade, for Alauddin Khalji's fixed prices, state granaries and market inspectors in Delhi (Barani, Tarikh-i Firuz Shahi).",
  "N2: Manjaniq: a siege tech for the mangonels (manjaniq, maghribi) and the raised siege ramps that Amir Khusrau and Barani describe at Ranthambore (1301), Chittor (1303) and Warangal (1310); in N1 it could only be a renamed copy of the Saracens' Counterweights.",
  "N3: An Indo-Islamic architecture set (true arches, domes and battered bastioned walls of the Alai Darwaza and Tughlaqabad), distinct from the South Asian set's temple forms.",
  "N3: An Indo-Islamic civ for the regional sultanates that succeeded Delhi (Gujarat, Malwa, Jaunpur, the Bahmanis), shared with the Gurjaras' idea. The Mughal-era traits that had leaked into the Hindustanis (field artillery, the Grand Trunk Road, Sher Shah Suri's chain of sarais, the camel swivel-gun or zamburak) stay out of the project, since they come after the time frame (RULES section 2).",
]
contested = [
  "Whether the Delhi Sultanate was a ‘foreign’ conquest state or an Indian state: a debate between nationalist, communalist and secular historiographies (Jackson 1999; Kumar 2007; Eaton 2019).",
  "The ‘Slave dynasty’ label: historians speak of the Qutbi, Shamsi and Balbani sultans or of the ‘Mamluk’ sultans; the legal status of the bandagan and whether Aibak or Iltutmish founded the Sultanate are debated (Kumar 2007).",
  "When gunpowder reached north India: Iqtidar Alam Khan argues for knowledge of gunpowder (pyrotechnics, perhaps rockets) from contact with the Mongols in the 13th century (2004) and for cannon in north Indian warfare from the 1440s (1981), while effective use in the field begins with Babur (Panipat, 1526), whose account mentions no guns on Ibrahim Lodi's side. The tree follows the second reading for Delhi's own armies.",
  "Crossbows (charkh): Fakhr-i Mudabbir's manual of war for Iltutmish describes them, but battle accounts say little about them, so how common they were in Sultanate armies is unclear.",
  "Mahmud of Ghazni's motives (iconoclasm, plunder or political legitimacy) and the traditional count of about seventeen campaigns (Thapar 2004).",
  "Digby's thesis that control of the supply of war-horses and elephants explains the Sultanate's military superiority: influential, but schematic.",
]
open_questions = [
  "Name and scope: keep ‘Hindustanis’ or rename the civ ‘Delhi Sultanate’ (the analysis' preferred option) or ‘Indo-Turks’? Hindustan was the Sultanate elite's name for the north Indian plain, but in Sultanate Persian ‘Hindustani’ often meant Indian-born Muslims as distinct from the Turkish slave elite (the Indian-born eunuch Imad al-Din Rayhan displaced the Turkish nobles around Balban in 1253), while Amir Khusrau proudly called himself a ‘Turk-i Hindustani’. ‘Delhi Sultanate’ names the state but leaves out the Ghaznavid and Ghurid prelude. The design keeps the displayed name and the scope 1001–1526, leaves the Guptas and Harsha to the general Indian background, and splits the Ghaznavids with the Persians: Ghaznavid Iran and Khorasan there (as the Persians' design says), the Indian campaigns and the Ghaznavid Punjab (to 1186) here. Accept the name and the split? The renames are decided together in codex-wide question CQ16 (see codex/civs/README.md).",
  "Gunpowder (design only): the Hand Cannoneer, Bombard Cannon and both Cannon Galleons are removed on historical grounds (Babur's account of Panipat mentions no guns on Ibrahim Lodi's side; the guns of 1526 are Babur's). Overrule this for gameplay (RULES section 11), for example by keeping the Hand Cannoneer in the Imperial Age, knowing that it would represent no Sultanate weapon?",
  "Ghulam model: the Kipchak, a light horse archer, is the unique unit of four civs (the Cumans' and Georgians' Kipchak, the Saracens' Mamluk and this Ghulam), the parallel with the Saracens' Mamluk being deliberate (one institution, largely the same slave markets after the 1220s). Accept the share, or use a heavy cavalry model such as the Persian Savar, which shows the armour but loses the bow, until the N2 remodel?",
  "Power budget: the civ gets cheaper Cavalry Archers, Dagh (Castle Age), Parthian Tactics, the Knight (without Cavalier, as a power-budget trim; the Gurjaras get the Knight and Cavalier), the Battle Elephant with a -25% cost passive and the Arbalester, against the loss of all gunpowder and its armour bonus, the camel attack-speed bonus, the Imperial Camel Rider, Shatagni, Block Printing and the infantry Ghulam. Acceptable, or trim further (for example Dagh in the Imperial Age, or no Arbalester)?",
  "Name of the gold tech: Tanka (the Sultanate's silver coin) or ‘Sultans’, the name the tech had from 2013 to 2022?",
  "Plunder warfare (Mahmud's raids; the Khalji raids on Devagiri, Warangal and Ma'bar) leaves the team slot, which RULES 6.2 reserves for benefits to others. It could come back as a passive, for example the Danes' ‘Loot 25% of the resource cost of each destroyed building’; left out here for the power budget. Add it?",
  "Codex-wide question CQ1 (see codex/civs/README.md): Navy rule (here the Cannon Galleons go and no substitute siege warship is given).",
  "Codex-wide question CQ4 (see codex/civs/README.md): Mule Cart (not given here; this civ's candidate would be the pack-oxen caravans of the karwanis, who carried grain to Alauddin's Delhi (Barani), beside the Lumber and Mining Camps).",
  "Codex-wide question CQ11 (see codex/civs/README.md): Reuse and stacking (here the team bonus ‘Monasteries work +20% faster’, held by eight designs; Tanka, one of six Town Center techs with the Grand Trunk Road effect; Dagh, the Sipahi effect shared with the Turks' Timar and the Saracens' Iqta'; the Cavalry Archer discount, also a passive of the Avars, Rus' and Tatars; and the Caravanserai, shared with the Persians and Turks and, as the Dharmashala, with the Khmer). With less reuse, Dagh could become a new tech (level 2) with ‘Mounted Units +15% HP’, the Franks' bonus at a lower magnitude, which would also cover the lancers' horses, and the team bonus could render the institutions the successor sultanates took over from Delhi (the tanka coinage, the iqta', the Persian chancery).",
  "Codex-wide question CQ18 (see codex/civs/README.md): Reused names (the Ghulam, on the Kipchak model, and its Elite tier share their names with the game's infantry Ghulam, which the Tamils' design renames Velaikkarar).",
  "Codex-wide question CQ19 (see codex/civs/README.md): Labels (here the game's ‘Camel and Gunpowder civilization’ becomes ‘Cavalry Archer and Elephant civilization’, since the camel and gunpowder bonuses go and the horse archers and the sultan's elephants carry the civ).",
]

[profile]
entity = "The Delhi Sultanate (the so-called Mamluk sultans of the Qutbi, Shamsi and Balbani lines, then the Khaljis, Tughluqs, Sayyids and Lodis) and its Ghaznavid and Ghurid forerunners in their Indian campaigns and in the Punjab (Ghaznavid Iran and Khorasan belong to the Persians)"
region = "Northern India (Hindustan): the Punjab, Delhi and the Ganges–Yamuna Doab, with campaigns and provinces from Sind to Bengal and the Deccan"
window = "1001–1526 (from Mahmud of Ghazni's victory over Jayapala near Peshawar to Panipat; the Sultanate 1206–1526)"
sources = [
  "Minhaj al-Siraj Juzjani, Tabaqat-i Nasiri (c. 1260)",
  "Fakhr-i Mudabbir, Adab al-harb wa'l-shaja'a (dedicated to Iltutmish, 1211–36)",
  "Ziya al-Din Barani, Tarikh-i Firuz Shahi (1357)",
  "Amir Khusrau, Khaza'in al-Futuh (c. 1311)",
  "Ibn Battuta, Rihla (in India 1333–42)",
  "Muhammad Qasim Firishta, Tarikh-i Firishta (early 17th century), tr. J. Briggs (1829)",
  "Babur, Baburnama (tr. A. S. Beveridge, 1922; tr. W. M. Thackston, 1996)",
  "C. E. Bosworth, The Ghaznavids (1963)",
  "H. Nelson Wright, The Coinage and Metrology of the Sultans of Dehli (1936)",
  "Simon Digby, War-Horse and Elephant in the Dehli Sultanate (1971)",
  "Iqtidar Alam Khan, ‘Early Use of Cannon and Musket in India: A.D. 1442–1526’, Journal of the Economic and Social History of the Orient 24 (1981)",
  "Carl W. Ernst, Eternal Garden: Mysticism, History, and Politics at a South Asian Sufi Center (1992)",
  "P. B. Golden, ‘Cumanica IV: The Tribes of the Cuman-Qipčaqs’, Archivum Eurasiae Medii Aevi 9 (1995–97)",
  "Peter Jackson, The Delhi Sultanate: A Political and Military History (1999)",
  "Carl W. Ernst and Bruce B. Lawrence, Sufi Martyrs of Love: The Chishti Order in South Asia and Beyond (2002)",
  "Iqtidar Alam Khan, Gunpowder and Firearms: Warfare in Medieval India (2004)",
  "Sunil Kumar, The Emergence of the Delhi Sultanate, 1192–1286 (2007)",
  "Richard M. Eaton, The Rise of Islam and the Bengal Frontier, 1204–1760 (1993); India in the Persianate Age, 1000–1765 (2019)",
]
replaces = "Hindustanis as written in 2022: from the Guptas and Harsha (4th–7th centuries) to Babur and Sher Shah Suri (16th century), with the camel-and-gunpowder skeleton of the 2013 ‘Indians’"

[[bonus]]
text = "Villagers cost -8/13/18/23% in Dark/Feudal/Castle/Imperial Age"
kind = "economic"
level = 1
change = "kept"
precedent = "Villagers cost -8/13/18/23% in Dark/Feudal/Castle/Imperial Age (Hindustanis)"
basis = "The Indo-Gangetic plain was among the most densely peopled lands of the age. Ibn Battuta (1330s) calls Delhi the greatest city of India, indeed of all the cities of Islam in the East; Barani describes how Alauddin Khalji fed a great standing army in Delhi from the grain of the Doab; and Babur, who conquered the plain in 1526, marvels at its countless workmen of every trade (Baburnama). Kolff (1990) describes the vast peasant military labour market that supplied men to every power of the plain, though his evidence begins c. 1450. An abstraction, kept."
relevance = "The manpower of the Ganges plain fed the Sultanate's armies, building works and revenue; without it Delhi could not have ruled from the Punjab to the Deccan."

[[bonus]]
text = "Cavalry Archers cost -10/20% in Castle/Imperial Age"
kind = "military"
level = 1
change = "new"
replaces = "Camel Riders attack +20% faster"
precedent = "Cavalry Archers cost -10/20% in Castle/Imperial Age (Huns)"
basis = "Turkish mounted archers were the decisive arm of the Ghaznavids, the Ghurids and the Sultanate: Muhammad of Ghur's horse archers wore down and broke Prithviraj Chauhan's army at the second battle of Tarain (1192) (Minhaj). The slave markets of Central Asia and, after the 1220s, Turks driven south by the Mongols kept them numerous (Jackson 1999; Kumar 2007). The camel bonus it replaces had no basis: no Sultanate source describes camel shock cavalry."
relevance = "The Turkish horse archer won north India for the Ghurids and held it for the Sultanate; erase him and the conquest of 1192 does not happen."

[[bonus]]
text = "Battle Elephants cost -25%"
kind = "military"
level = 1
change = "new"
replaces = "Gunpowder Units +1 melee/+1 pierce armor"
precedent = "Battle Elephants cost -25/35% in Castle/Imperial Age (Malay), at its Castle Age value"
basis = "War elephants were a royal monopoly, kept in the sultan's elephant stables (pil-khana) and replenished by capture and tribute from Bengal, Orissa and the Deccan (Digby 1971). Mahmud of Ghazni already kept a corps of Indian elephants with Indian mahouts (Bosworth 1963); Alauddin's generals brought back several hundred from the southern campaigns of 1310–11 (Amir Khusrau; Barani); Mahmud Tughluq and Mallu Iqbal met Timur before Delhi with a line of war elephants in 1398; and Babur reckoned that Ibrahim Lodi brought nearly 1,000 elephants to Panipat (Baburnama). A structural institution with no founding date, hence a passive (RULES 6.2). The gunpowder bonus it replaces described the Mughals: Babur's account of Panipat mentions no guns on Ibrahim's side."
relevance = "With the war-horse, the royal elephant corps was the second pillar of Sultanate power and a symbol of sovereignty, from Mahmud of Ghazni to Panipat (Digby 1971)."
contested = "Digby's horse-and-elephant thesis is influential but schematic (see contested)."

[[bonus]]
text = "Can build Caravanserai in Imperial Age"
kind = "economic"
level = 1
change = "kept"
precedent = "Can build Caravanserai in Imperial Age (Hindustanis, Persians)"
basis = "The Sultanate's roads carried a great caravan trade. Horse dealers drove herds of thousands of horses from the Kipchak steppe and Khorasan to India, paying duty on each horse on the way (Ibn Battuta, 1330s; Digby 1971); Alauddin Khalji had the grain carriers (karwanis) registered and settled with their families along the Yamuna to keep Delhi supplied (Barani); and Firishta (early 17th century) counts caravanserais among the public works of Firuz Shah Tughluq (1351–88). The caravanserai was a Persianate institution shared with Iran, which keeps the building too, and the great chain of sarais from Bengal to the Punjab is Sher Shah Suri's (1540–45), the later culmination of this tradition, just after the window. The relay posts of mounted and foot couriers (ulaq and dawa) that Ibn Battuta describes carried the state's news, not trade."
relevance = "The caravan trade in war-horses and grain fed Delhi's armies and markets; the Caravanserai, which heals and speeds Trade Carts, is the existing building closest to the sarais on its routes."
contested = "How many sarais the Sultanate itself built before Sher Shah is unclear: Firishta wrote two and a half centuries after Firuz Shah, and later chronicles may project Sher Shah's network backwards."

[team_bonus]
text = "Monasteries work +20% faster"
level = 1
change = "new"
precedent = "Monasteries work +20% faster (Lithuanians team bonus, which their design gives up); the team bonus of eight designs (Bulgarians, Burmese, Danes, Gaels, Hindustanis, Khitans, Malay, Saxons)"
basis = "The Sufi orders that grew up under the Sultanate spread from Delhi to its neighbours, often in the wake of the Sultanate itself. The Chishtis of Delhi (Qutb al-Din Bakhtiyar Kaki, d. 1235; Nizam al-Din Awliya, d. 1325) sent disciples who rooted the order in the independent kingdoms: Akhi Siraj al-Din returned to Bengal, where his successors at Pandua, Ala al-Haqq and Nur Qutb-i Alam, weighed in the politics of the Bengal Sultanate (Eaton 1993); when Muhammad bin Tughluq moved Delhi's elite to Daulatabad (1327), Nizam al-Din's disciples went with it, above all Burhan al-Din Gharib (d. 1337), whose tomb at Khuldabad became the Deccan's great Chishti centre (Ernst 1992); and Sayyid Muhammad Gisu Daraz left Delhi in 1398 and settled c. 1400 at Gulbarga, the Bahmani capital (Ernst and Lawrence 2002; Eaton 2019). The Suhrawardis of Multan and Uch likewise reached Gujarat (the Bukhari saints of Ahmedabad). RULES 6.2: religious influence. The old team bonus, plunder raids by Scout Cavalry and camels, benefited only the raider."
relevance = "Sufism, above all the Chishti order of Delhi, shaped Indian Islam, and its spread to Bengal, the Deccan and Gujarat is one of the Sultanate's most lasting legacies to its neighbours."

[[unique_unit]]
name = "Ghulam"
model = "Kipchak"
building = "Castle"
level = 1
change = "changed"
replaces = "Ghulam (Infantry): unique Infantry that thrusts its spear through multiple targets"
basis = "The ghulams or bandagan of the Ghaznavids, the Ghurids and the Sultanate were Turkish slave soldiers bought young and trained above all as mounted archers and officers: Sabuktigin, founder of Ghaznavid power, and the sultans Aibak, Iltutmish and Balban had all been military slaves (Bosworth 1963; Jackson 1999; Kumar 2007). The system is older than the Mongol invasions (Aibak bought Iltutmish in the 1190s, according to Minhaj), and Delhi's bandagan also included other Turks and Indian-born slaves; but from the 1220s the Mongol conquest of the Kipchak steppe filled the slave markets that supplied both Delhi's Shamsi bandagan and Cairo's Bahri mamluks (Jackson 1999), and Minhaj gives Iltutmish and Balban an Ilbari origin. So the Cuman Kipchak, a horse archer firing several arrows, is the nearest existing model, as for the Saracens' Mamluk (a deliberate parallel: one institution, largely the same supply after the 1220s). The old spear-thrusting infantry inverted their role. The name also belongs to a different game unit, the infantry Ghulam (its own model), which passes to the Tamils' Velaikkarar; the site keys units by model."
relevance = "The slave soldiers founded the Sultanate's first dynasties (Aibak, Iltutmish, Balban) and formed its cavalry core; without them the 13th-century Sultanate makes no sense."
contested = "Minhaj's Ilbari are usually identified with the Ölberli, a Kipchak tribe (Golden 1995–97; Jackson 1999), though the clan's ultimate origin is debated. The Kipchak is lighter and cheaper than the often armoured ghulam cavalry (see ideas)."

[[unique_tech]]
name = "Tanka"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "All gold income +10% faster; Market trading fee reduced to 10%"
level = 1
change = "changed"
replaces = "Grand Trunk Road (All gold income +10% faster; Market trading fee reduced to 10%)"
precedent = "Grand Trunk Road (All gold income +10% faster; Market trading fee reduced to 10%) (Hindustanis): an existing unique tech, moved to the Town Center and renamed, identical effect and age. Five other designs use the full effect (the Burgundians' Vierlander Coinage, the Khitans' Chanyuan Treaty, the Malay's Syahbandar, the Muisca's Cotton Mantles and the Saxons' Edgar's Recoinage) and four its gold half (the Avars' Byzantine Tribute, the Bulgarians' Peace of 927, the Danes' Øresundstold and a Byzantine passive)."
basis = "Iltutmish (1211–36) gave the Sultanate a standard coinage, the silver tanka with the billon jital, struck at Delhi and the provincial mints; the successor sultanates of Bengal, Gujarat and the Deccan kept the tanka, and Sher Shah's silver rupiya (1540s) took over its role (Wright 1936; Jackson 1999). Same effect, new name: ‘Grand Trunk Road’ is a 19th-century British name for a road that Sher Shah Suri rebuilt in the 1540s, and until 2022 the tech was called ‘Sultans’."
relevance = "A uniform silver and billon coinage carried the Sultanate's cash economy, in which troopers' pay and market prices were reckoned (Barani), and outlived it in the rupee."

[[unique_tech]]
name = "Dagh"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Mounted Archers +20 HP"
level = 1
change = "new"
replaces = "Shatagni (Hand Cannoneers +2 range)"
precedent = "Sipahi (Mounted Archers +20 HP) (Turks, who move it to the Town Center as Timar; the Saracens share it there as Iqta'): an existing unique tech, shared and renamed, at the Castle as in the game, identical effect and age"
basis = "After the Mongol siege of Delhi (1303) Alauddin Khalji raised a large standing cavalry on fixed cash pay (Barani gives 234 tankas a year for a trooper with one horse) and, to stop men passing muster with a borrowed or worn-out horse or with a substitute, had every horse branded (dagh) and a descriptive roll (huliya) kept of every trooper (Barani; Jackson 1999). The horses so checked were largely war-horses imported from Central Asia, Afghanistan and the Gulf, larger and stronger than Indian-bred mounts, and Delhi's hold on that trade was a pillar of its power over its Indian rivals (Digby 1971). Sturdier mounted archers, the bulk of the cavalry and the Ghulam among them, render sound, inspected horses; the same effect stands for the Ottoman timar and the Mamluk iqta', two other institutions that kept Turkish horse archers mounted. The datable reform takes the Castle slot, while the structural elephant stables are a passive (RULES 6.2). Shatagni, which it replaces, gave an ancient Sanskrit word for a spiked missile weapon (śataghnī) to 16th-century hand-gunners: the firearm reading was popularised by Oppert (1880) on the strength of the Śukranīti, which Lallanji Gopal (1962) showed to be a 19th-century text. The paired term ‘dagh-o-chehra’ belongs to Akbar's revival of the system in the 1570s."
relevance = "Alauddin's army reforms gave Delhi the standing cavalry that defeated the Mongols at Amroha (1305) and on the Ravi (1306) and carried Malik Kafur's campaigns to Warangal, Dwarasamudra and Ma'bar (1309–11); Sher Shah and Akbar revived the dagh."
contested = "Barani, the main source for the reforms, wrote half a century later and with a moralising purpose; how strictly the branding was enforced, and for how long after Alauddin, is unclear (Jackson 1999)."

[tree]
add = ["Knight", "Battle Elephant", "Parthian Tactics", "Arbalester", "Architecture", "Treadmill Crane", "Keep"]
remove = ["Hand Cannoneer", "Bombard Cannon", "Cannon Galleon", "Elite Cannon Galleon", "Block Printing"]

[tree.basis]
"Knight" = "Besides the horse archers, the Sultanate fielded armoured horsemen fighting with lance, sword and mace: Fakhr-i Mudabbir's manual of war, dedicated to Iltutmish, sets out their arms (a normative text), and Jackson (1999) shows such cavalry in the Sultanate's field armies. The army that repelled the Chagatai invasions of 1297–1306 (Jaran-Manjur 1298, Kili 1299, the siege of Delhi survived in 1303, Amroha 1305, the Ravi 1306) combined both arms (Barani; Jackson 1999). No Cavalier: a power-budget trim (see open questions), not a historical ranking, since Delhi's imported war-horses made its heavy cavalry no lighter than that of the Rajput kingdoms."
"Battle Elephant" = "War elephants were, with the horse, the second pillar of Sultanate power (Digby 1971; see the cost passive). No Elite upgrade: Delhi's elephants came by capture and tribute from the elephant countries (Bengal, Orissa, the Deccan and the Pandya Ma'bar), and the codex civs among them, the Bengalis and the Tamils, have the Elite Battle Elephant; the Hindustani elephant arm is the sultan's stable, rendered by the cost passive."
"Parthian Tactics" = "Harassment from all sides was the stock tactic of the Turkish horse archers, as of the steppe peoples who already have the tech: Minhaj describes the Ghurid mounted divisions wearing down the Rajput army at Tarain (1192); the feigned retreat appears in later chronicles such as Firishta."
"Arbalester" = "The project gives the Arbalester, the crossbow tier, only where crossbows are attested. Fakhr-i Mudabbir's manual of war, written for Iltutmish (1211–36), describes the crossbow (charkh) among the Sultanate's weapons; battle accounts say little about it, so how common it was is unclear (see contested). The same manual is the basis of the Persians' Arbalester."
"Architecture" = "One of the great building cultures of the age: the Qutb Minar (begun c. 1199, finished under Iltutmish), the Alai Darwaza (1311) and the walled cities of Siri (c. 1303), Tughlaqabad (1321–25) and Firuz Shah's Firozabad (1350s)."
"Treadmill Crane" = "An abstraction of faster building: no treadwheel cranes are attested in India, and the tech stands for the scale of the Sultanate's building programmes in stone, from the Quwwat al-Islam mosque to Firuz Shah Tughluq's new towns and canals."
"Keep" = "The massive bastioned walls and towers of Siri and Tughlaqabad, and the hill-forts the sultans took and garrisoned (Ranthambore 1301, Chittor 1303)."
"Hand Cannoneer" = "No hand-guns are documented in Delhi's armies: Babur's account of Panipat (1526) mentions no guns on Ibrahim Lodi's side, and the matchlocks of that day were Babur's. Iqtidar Alam Khan argues for 13th-century knowledge of gunpowder from the Mongols, as pyrotechnics rather than firearms (2004), and for cannon in north India from the 1440s (1981) (see contested); guns weigh in north Indian battle only from Babur, and they belong to the Mughals, after the time frame."
"Bombard Cannon" = "Same basis: no artillery of Delhi's own is documented before Babur's guns at Panipat. The Trebuchet, attested in the maghribi engines of Alauddin's sieges (see ideas), the Mangonel-line, the Siege and Armored Elephants and the Petard keep the civ able to break buildings (RULES 6.11)."
"Cannon Galleon" = "No gun-armed ships for a land power of the Ganges plain. The Galley and Fire Ship lines keep the anti-ship role at sea and the single-use Demolition Ship the anti-building role; no substitute siege warship is added (codex-wide question CQ1: Navy rule)."
"Elite Cannon Galleon" = "Same basis."
"Block Printing" = "No printing in the window: the first press in India was set up by the Jesuits at Goa in 1556."

[[rename]]
from = "Elite Kipchak"
to = "Elite Ghulam"
level = 1
basis = "Follows the unique unit (Kipchak → Ghulam), for the Hindustanis only, as the Saracens' design renames it Elite Mamluk."

[architecture]
set = "South Asian"
change = "kept"
basis = "Kept: the South Asian set is the closest existing one. A distinct Indo-Islamic set would be N3 (see ideas)."

[[dropped]]
item = "Imperial Camel Rider"
kind = "unique_unit"
reason = "No Sultanate source describes an elite camel cavalry; camel corps (shutur-sawar) and the camel swivel-gun (zamburak) belong to the late Mughal period and to 18th–19th-century Rajputana. The generic Camel Rider and Heavy Camel Rider stay for the camels of Sind and the desert routes."

[[dropped]]
item = "Scout Cavalry-line and Camel Units +2 attack vs. buildings"
kind = "team_bonus"
reason = "RULES 6.2: it rested on plunder raids on towns and temples (Mahmud of Ghazni at Somnath, 1025–26; the Khalji raids on Devagiri 1296, Warangal 1310 and Ma'bar 1311), which benefited only the raider, and the camels had no basis. The team slot goes to the Sufi orders; plunder as a passive is left to the owner (see open questions)."
