civ = "Ethiopians"
name = "Ethiopians"
status = "draft"
label = "Archer and Infantry civilization"
summary = "Ethiopians as the Christian highland kingdom from late Aksum to the Adal war (500–1543): chewa spearmen replace the Shotel Warrior, gult grants and the chewa regiments become the techs, mules, ambas and monasteries passives, Aksum's Red Sea trade the team bonus, and Hand Cannoneers the late element."
ideas = [
  "N2: A Lalibela church: a rock-hewn Monastery variant (no wood cost, more HP, Monks heal inside) for the Zagwe churches of Lalibela (c. 1200).",
  "N2: An Aksumite naval technology for the port of Adulis and Kaleb's expedition across the Red Sea to Himyar (c. 525).",
  "N2: The tabot carried with the army by the clergy, as a morale aura around Monks.",
  "N2: A dismountable Ethiopian horseman with lance and javelins, for the cavalry Amda Seyon raised in Gojjam and Damot.",
  "N2: A Chewa Spearman with its own model (a highland spearman with shield) instead of the Andean Kamayuk graphic.",
  "N2: A sword-armed unit with its own model and stats for the swordsmen Amda Seyon raised (Taddesse Tamrat, 1972), which could take the shotel's name if its medieval use is shown; in N1 the Shotel Warrior is out (see dropped).",
  "N3: A pack-mule caravan model instead of the Caucasian Mule Cart, since the highlands had almost no wheeled transport (shared with the Portuguese idea of other pack animals).",
  "N3: An Adal (Harar) civ as the Ethiopians' rival, with the Ottoman-supported musketeers of 1542 and the cannon used from 1531.",
  "N3: Aksumite war elephants, if better evidence is found: Malalas describes the king on an elephant-drawn platform, but Cosmas says the Ethiopians tamed only a few elephants for the king.",
]
contested = [
  "The medieval antiquity of the shotel and how it was used; secure examples and descriptions are mostly 18th–19th century, and nothing shows that Amda Seyon's swords were shotels.",
  "The weight of the bow against the spear in Solomonic armies: al-Umari makes the spear the main weapon, while the Glorious Victories of Amda Seyon name archers, spearmen and horsemen.",
  "When the confinement of royal princes on Amba Geshen began (early Solomonic period, date uncertain).",
  "The identity of Queen Gudit and the date of the Zagwe takeover (c. 940 or 1137).",
  "The causes of Aksum's decline: environmental (Butzer) or the loss of the Red Sea trade.",
  "The historical value of the Kebra Nagast (14th century) as Solomonic legitimation.",
  "When Debre Asbo was renamed Debre Libanos under Zara Yaqob (1434 or 1445 in different accounts).",
  "Ethiopian use of firearms before 1543: a handful of guns under Lebna Dengel; the musket spread only under Galawdewos and Sarsa Dengel.",
  "How far Constantinople directed Kaleb's expedition to Himyar (c. 525): Procopius gives the king's own motive, while the Martyrium Arethae has Byzantine encouragement.",
  "Who sailed against Jeddah in 702: the sources speak of Abyssinian raiders or pirates, so whether they still sailed for the declining Aksumite state is uncertain.",
]
open_questions = []

[profile]
entity = "The Christian kingdom of the Ethiopian highlands: late Aksum, the Zagwe and the Solomonic dynasty"
region = "The Ethiopian and Eritrean highlands (Tigray, Lasta, Amhara, Shewa), with the Red Sea port of Adulis in the Aksumite period"
window = "500–1543 (from the start of the time frame, in late Aksum; Aksumite Red Sea power to c. 630; the post-Aksumite kingdom and the Zagwe, to 1270; Solomonic core 1270–1543)"
sources = [
  "Cosmas Indicopleustes, Christian Topography (c. 550)",
  "Procopius, Wars I.20 (Kaleb's expedition to Himyar; Justinian's request about the silk trade)",
  "The Martyrdom of Arethas (Martyrium Arethae)",
  "The Glorious Victories of 'Amda Seyon, King of Ethiopia (trans. G. W. B. Huntingford, 1965)",
  "Ibn Fadlallah al-Umari, Masalik al-absar",
  "Shihab al-Din Arab Faqih, Futuh al-Habasha (trans. P. L. Stenhouse, 2003)",
  "Francisco Álvares, Verdadeira informação das terras do Preste João das Índias (1540)",
  "Miguel de Castanhoso, História das cousas que o mui esforçado capitão Dom Cristóvão da Gama fez nos reinos do Preste João (Lisbon, 1564; ed. Esteves Pereira, Dos feitos de D. Christovam da Gama em Ethiopia, 1898)",
  "Taddesse Tamrat, Church and State in Ethiopia, 1270–1527 (1972)",
  "Stuart Munro-Hay, Aksum: An African Civilisation of Late Antiquity (1991)",
  "G. W. Bowersock, The Throne of Adulis (2013)",
  "Timothy Insoll, ‘Dahlak Kebir, Eritrea: From Aksumite to Ottoman’, Adumatu 3 (2001)",
  "Donald Crummey, Land and Society in the Christian Kingdom of Ethiopia (2000)",
  "Richard Pankhurst, An Introduction to the Economic History of Ethiopia (1961)",
]

[[bonus]]
text = "Can build Mule Carts"
kind = "economic"
level = 1
change = "new"
replaces = "Receive +100 gold and +100 food when advancing to the next Age"
precedent = "Start with a Mule Cart (Georgians); Mule Carts cost -25% (Armenians); Can build Caravanserai in Imperial Age (Persians)"
basis = "Mules were the riding and pack animals of the highland nobility, clergy and travellers, and the Solomonic kings had no fixed capital: the royal camp moved through the provinces with its baggage, as Francisco Álvares saw in the 1520s (Taddesse Tamrat, 1972). A mobile drop site abstracts this mobile kingdom; the cart model is a stand-in, since highland transport was by pack mule and porter, with almost no wheeled vehicles (Pankhurst, 1961). The Age-up resources had no historical referent."
relevance = "The itinerant royal camp, moved by mules and porters, was how the Solomonic kings governed the highlands for more than three centuries."
contested = "The prominence of mules is clearest in early modern accounts (Álvares and later Portuguese writers); medieval evidence is thinner."

[[bonus]]
text = "Foot Archers attack +18% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Foot Archers attack +18% faster (Ethiopians)"
basis = "The Glorious Victories of Amda Seyon name archers among his troops, and al-Umari lists the bow beside the spear among Ethiopian weapons (Taddesse Tamrat, 1972). An abstraction: no specific trait of Ethiopian archery (rate, bow type) is attested."
relevance = "Archers were a standing arm of the Solomonic army beside the spearmen; the trait passes, though more modestly than the spear."

[[bonus]]
text = "Pikeman upgrade free"
kind = "military"
level = 1
change = "kept"
precedent = "Pikeman upgrade free (Ethiopians)"
basis = "According to al-Umari (cited by Taddesse Tamrat) the spear was the Ethiopians' main weapon, and highland infantry often had to stand against the cavalry of the Muslim sultanates of Ifat and Adal; there were no European-style pike blocks."
relevance = "The spear was the main weapon of the Christian kingdom's armies; the bonus carries its most basic military trait."

[[bonus]]
text = "Units and buildings receive -15% damage when located on higher elevation"
kind = "military"
level = 1
change = "new"
precedent = "Units and buildings receive -15% damage when located on higher elevation (Georgians)"
basis = "The Christian kingdom was a highland state: the plateau and its ambas, flat-topped mountains with sheer sides, served as natural fortresses, treasuries, royal prisons (Amba Geshen) and refuges, and the highland heartland outlasted repeated wars with the lowland sultanates of Ifat and Adal (Taddesse Tamrat, 1972). The Georgians' and Gurjaras' designs use the same bonus, each on its own history (RULES 6.16.12)."
relevance = "Geography made the kingdom: the highlands and their ambas sheltered Christian Ethiopia for a thousand years against lowland enemies."

[[bonus]]
text = "Monastery technologies cost -50%"
kind = "other"
level = 1
change = "new"
precedent = "Monastery technologies cost -50% (Burmese)"
basis = "Monasteries were the schools and scriptoria of the kingdom: Debre Damo (traditionally founded in the 6th century), Debre Asbo (later Debre Libanos), founded by Takla Haymanot c. 1284, and the houses of the Ewostatewos movement carried the faith and Ge'ez learning across the highlands, and monks evangelised the newly conquered south under Amda Seyon and Zara Yaqob (Taddesse Tamrat, 1972). It is a passive, not the team bonus, because its benefit stayed within the kingdom (RULES 6.2). The Monk keeps the game's generic name and look (RULES 6.16.9); the Scenario Editor's Priest, whose art repeats the priest of the first Age of Empires, would not show Ethiopian clergy any better."
relevance = "The Church and its monasteries are the core of Ethiopian identity, from the Kebra Nagast to the rock churches of Lalibela."

[team_bonus]
text = "Trade Units generate +10% gold"
level = 1
change = "new"
replaces = "Outposts +3 line of sight and cost no stone"
precedent = "Trade Units generate +25% gold (Spanish team bonus), here at a lower magnitude"
basis = "Late Aksum was Rome's partner on the Red Sea. Cosmas Indicopleustes traded through Adulis at the beginning of Justin I's reign (c. 518–525; he wrote c. 550), when the king was preparing his expedition against the Himyarites; Kaleb crossed to Himyar (c. 525) against the persecutor of the Christians of Najran, with Byzantine encouragement according to the Martyrium Arethae (see contested); and Justinian asked the Aksumites to buy Indian silk for the Romans so as to bypass Persia (Procopius, Wars I.20). Aksum's gold coinage served that trade (Munro-Hay, 1991). The Outposts bonus had only a tenuous link with amba lookouts. The team bonus rests on the Aksumite part of the window; a monastic team bonus (‘Monasteries work +20% faster’) is not used because the monasteries' benefit stayed within the kingdom, and they are a passive instead. Identical team-wide effects count once per team, and trade-gold team bonuses count as one at the highest value present (RULES 6.16.12)."
relevance = "The Red Sea trade made Aksum a great power, and it was shared with its Byzantine ally; it benefits allies, as RULES 6.2 requires."
contested = "Procopius says the silk scheme failed because Persian merchants controlled the Indian ports; the bonus rests on the Aksumite part of the window."

[[unique_unit]]
name = "Chewa Spearman"
model = "Kamayuk"
building = "Castle"
level = 1
change = "new"
replaces = "Shotel Warrior"
basis = "From Amda Seyon (1314–1344) onward the core of the royal army were the chewa, standing regiments raised and maintained by the king (Glorious Victories of Amda Seyon; Taddesse Tamrat, 1972), and al-Umari (cited by Taddesse Tamrat) names the spear as the Ethiopians' main weapon, with swords rare. The Inca Kamayuk, an infantryman with a long spear strong against cavalry and infantry, is the nearest existing unit: the highland spearmen had to stand against the cavalry of Ifat and Adal. The model is shared with the Inca Awqa Kamayuq, the Berbers' Murabit and the Mapuche Colihue Lancer."
relevance = "The spear was the main weapon of the Christian kingdom (al-Umari), and the spear-armed chewa regiments carried Amda Seyon's and Zara Yaqob's wars; the unit stands for the army that made the Solomonic state."
contested = "The Kamayuk model is Andean (see the N2 idea), and the regiments mixed spearmen, archers and horsemen; the unit stands for their spear infantry. The Scenario Editor's Heavy Pikeman, a Pikeman with 20 more HP and a European look, was considered and fits no better."

[[unique_tech]]
name = "Gult"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Military Units cost -25% food"
level = 1
change = "new"
replaces = "Royal Heirs (Shotel Warriors and Camel Riders receive -3 damage from Mounted Units)"
precedent = "Kshatriyas (Military Units cost -25% food) (Gurjaras, kept there renamed as Samantas; also the Burmese Ahmudan, the Byzantines' Themata, the Gaels' Buannacht, the Japanese Shugo-Jitō and the Jurchens' Meng'an Mouke): an existing unique tech, shared and renamed with an identical effect and age. Reuse is accepted in level 1, each copy resting on its own history (RULES 6.16.12)."
basis = "Gult was the right to collect tribute, largely in kind, from the peasants of a district, granted by the king to soldiers, nobles and churches; it fed the regiments without cash wages (Taddesse Tamrat, 1972; Crummey, 2000). A royal grant of land revenue belongs at the Town Center. Royal Heirs named a real institution (the princes held on Amba Geshen to prevent succession wars) but its effect had nothing to do with it."
relevance = "Gult grants were the fiscal base of the Solomonic state, its army and its church; land tenure shaped Ethiopian society until the 20th century."
contested = "Gult tenure is documented mostly from land charters of the 14th century onward."

[[unique_tech]]
name = "Chewa"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Spearman-line, Chewa Spearmen and Archer-line +10 HP and train +50% faster"
level = 2
change = "new"
replaces = "Torsion Engines (Siege Workshop Units' blast radius increased)"
precedent = "A new tech with two existing effect types: training speed from ‘Comitatenses (Militia-line, Knight-line, and Centurions train +50% faster and receive a charge attack)’ (Romans), whose targets also name a unique unit; extra HP from ‘Infantry, Slingers and Skirmishers +5/10/15 HP in Feudal/Castle/Imperial Age’ (Mapuche)"
basis = "From Amda Seyon (1314–1344) onward the core of the army were the chewa, standing regiments raised and maintained by the king and later settled on land (Glorious Victories; Taddesse Tamrat, 1972). al-Umari (cited by Taddesse Tamrat) names the spear as the Ethiopians' main weapon, with the bow beside it, so the tech covers spearmen, the Chewa Spearmen among them, and archers. No existing Ethiopian tech fits (Torsion Engines evoked Greco-Roman torsion artillery, never attested in Ethiopia), so this is a new tech (level 2)."
relevance = "The chewa regiments carried Amda Seyon's and Zara Yaqob's expansion and were the kingdom's army until the Adal war."

[tree]
add = ["Hand Cannoneer", "Mule Cart"]
remove = ["Bombard Cannon", "Siege Onager", "Trebuchet", "Cannon Galleon", "Camel Rider", "Heavy Camel Rider", "Cavalry Archer", "Heavy Cavalry Archer", "Arbalester", "Thumb Ring"]

[tree.basis]
"Hand Cannoneer" = "Late element, RULES section 2, and the civ's only one (the unit is Imperial Age only). The great firearms episode of Ethiopian history is the war of 1529–1543: Adal received Arab and Ottoman musketeers from Zabid (1542), Cristóvão da Gama landed with c. 400 Portuguese musketeers (1541; Castanhoso, 1564), and after Wayna Daga (1543) the Ethiopians took up the musket. Before 1541 the kingdom had only a handful of guns, so Ethiopian musketeers proper come after 1500, but the war of 1541–1543 gives the unit clear fame. The game's tree had it the other way round (Bombard Cannon without Hand Cannoneer)."
"Mule Cart" = "See the Mule Cart bonus: it stands beside the Lumber and Mining Camps instead of replacing them, as in the Tatars' design, where it is the Araba; the cart model stands in for pack mules. The Ethiopians are one of the Mule Cart's four holders (RULES 6.16.7)."
"Bombard Cannon" = "There were no Ethiopian siege guns before 1543: the highland kingdom took places by blockade and assault, and it was Adal that used a cannon (from 1531, according to Arab Faqih)."
"Siege Onager" = "The top tier of the stone-thrower line is dropped (the tech tree audit rates it unfounded); the Mangonel and Onager stay as a generic abstraction of assault and blockade, since mountain warfare turned on ambas and blockades (RULES 6.16.5)."
"Trebuchet" = "No torsion or traction artillery is attested in Ethiopia, where the highland kingdom took places by blockade and assault, so the counterweight engine never reached the civ and is removed (RULES 6.16.5); the Mangonel and Onager stay as the generic stone-thrower, and the Siege Ram as the late anti-building engine. The civ has no long-range anti-building weapon, as RULES 6.16.5 allows where none is attested."
"Cannon Galleon" = "The navy is a fleet of ships (RULES 6.16.1), resting on late Aksum: for Kaleb's expedition to Himyar (c. 525) the king had ten ships built in the local Red Sea manner, beside the sixty or so merchant ships of Roman, Persian, Indian and Farasan traders gathered at Gabaza, the harbour below Adulis (Martyrium Arethae), and Abyssinian raiders still struck Jeddah in 702, after which the Umayyads occupied the Dahlak islands (Insoll, 2001, after Tedeschi and Munro-Hay; see contested). So the generic tiers stay (galleys, the Galleon as a flagged abstraction under RULES 6.16.2, Carrack, Shipwright). After Aksum the kingdom had no navy of its own, and the coast was held only loosely through the Bahr Negash until the Ottomans took Massawa (1557). No gunpowder warships, so the Cannon Galleon goes."
"Camel Rider" = "Camels belonged to the lowlands (Afar, Somali, Adal), not to the Christian highland army, which rode horses and mules."
"Heavy Camel Rider" = "As Camel Rider."
"Cavalry Archer" = "No horse archery is attested in the Christian army, whose horsemen fought with spears (tech tree audit)."
"Heavy Cavalry Archer" = "As Cavalry Archer."
"Arbalester" = "No crossbow is attested in Ethiopia, so the crossbow tier goes (RULES 6.16.3); the Crossbowman stays as the generic Castle Age bow upgrade until the N2 bow/crossbow split, and the archers rest on the +18% fire rate, Bracer and Chewa (RULES 6.11). The tech tree audit rates the Ethiopian Arbalester unfounded; no blanket compensation makes up for the power it takes from this archer civ (RULES 6.16.13)."
"Thumb Ring" = "No thumb draw or thumb rings are attested for Ethiopian archery (RULES 6.16.4); the thumb draw belongs to the steppe and Asian traditions (names theme), and other designs drop the tech on the same ground (among them the Malians, Malay, Maya, Inca and Muisca)."

[[rename]]
from = "Elite Kamayuk"
to = "Elite Chewa Spearman"
level = 1
basis = "Follows the unique unit (Kamayuk → Chewa Spearman) for the Ethiopians only."

[architecture]
set = "African"
change = "kept"
basis = "The African set is the nearest existing one; Aksumite stelae and stone-and-timber walls and the rock-hewn churches of Lalibela would need an Ethiopian set (N3). Treadmill Crane stays out, as in the game, under the region's one reading of the tech (see the Arabs' design), which gives it only where large building programmes are a documented trait: the Solomonic kings, the civ's core, ruled from a moving camp and built little in stone, and the Zagwe churches of Lalibela were cut down into the rock rather than raised."

[[dropped]]
item = "Shotel Warrior"
kind = "unique_unit"
reason = "Fails RULES 6.9 on weight: al-Umari makes the spear the main weapon and swords rare, and Amda Seyon's sword-armed troops were secondary to the spearmen and archers. Being securely attested only from the 18th century (see contested), the shotel would also be a second post-1500 element, outside the Imperial Age, beside the Hand Cannoneer (RULES section 2). The Chewa Spearman takes the unique-unit slot, and the Shotel Warrior gets no exception for fame (fame alone does not justify a slot, RULES 6.9); a sword-armed unit is an N2 idea."
