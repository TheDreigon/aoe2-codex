civ = "Poles"
name = "Poles"
status = "draft"
label = "Cavalry civilization"
summary = "Poles moved back into Piast and Jagiellonian Poland (966–1500): the 17th-century Winged Hussar and the Obuch give way to the Kopijnik, the armoured lancer of the knightly banners, Szlachta Privileges moves to the Town Center as the bargain of privileges for the noble levy, Lechitic Legacy gives way to the hired companies of the Thirteen Years’ War (Wojsko Zaciężne, Chivalry renamed) at the Castle, villager regeneration to the kingdom’s fortifications from the Piast strongholds to Casimir the Great, and the tree gains Plate Barding Armor, Hand Cannoneer, Architecture and the Hussar."
ideas = [
  "N2: Chorągiew (banner): a tech giving the Knight-line extra armour when several knights fight together, to make the banner explicit for generic knights as well as for the Kopijnik.",
  "N2: Tabor: Town Centers or Castles deploy a temporary wagon laager that protects units from missiles, after the Polish use of Czech mercenaries with wagons and guns in the Thirteen Years’ War (Świecino, 1462) and the later Polish tabor against the Tatars.",
  "N2: If the time frame is ever extended to c. 1600, the Winged Hussar returns as what it was: an expensive Imperial Age heavy lancer with a strong first charge (kopia), not a Light Cavalry replacement.",
  "N3: Own art for the Kopijnik (Polish knight with lance and banner) instead of the Georgian Monaspa model.",
]
contested = [
  "Whether the Slavs of the Polish lands were newcomers in the 6th century (Godłowski) or autochthonous (Kostrzewski and the Poznań school).",
  "Whether the Polanie existed as a tribe before Mieszko I (Urbańczyk).",
  "The impact of the Black Death on Poland (lower mortality is supported by pollen data, Izdebski et al. 2022; Guzowski) and Casimir III’s supposed quarantine, for which there is no contemporary evidence.",
  "The causes and chronology of the ‘second serfdom’ behind the folwark economy (Małowist, Topolski and later critics).",
  "Jadwiga’s personal role in the Union of Krewo (1385) and the meaning of her coronation as ‘rex’.",
]
open_questions = [
  "Kopijnik: the Polish unique unit is rebuilt on the Georgian Monaspa (heavy cavalry that becomes stronger when other Kopijniks or Knight-line units are nearby), the closest existing match for knights fighting in banners. The Monaspa then has three holders (Georgians, the Castilians’ Freire by the owner’s decision, and the Poles). Accept, or prefer keeping the Obuch as the unique unit for now?",
  "The Obuch is dropped: the obuch or nadziak was a nobleman’s war hammer, often used on horseback and mostly in the 16th–17th centuries, never an infantry troop type. Keep it anyway as a second unique unit (e.g. dismounted knights with war hammers)?",
  "The generic Hussar is added for the Rascian-style light horse of the late 15th-century court banner, from which the hussar banners of c. 1500 grew. Accept, or leave the Poles with Light Cavalry as their top light cavalry?",
  "Castle tech: the previous draft’s Pospolite Ruszenie (free Knights) is folded into Szlachta Privileges, because the levy was a standing obligation and the other side of the privileges (RULES 6.2 and 6.3), and the Castle slot goes to the hired companies of the Thirteen Years’ War (Wojsko Zaciężne: the Franks’ Chivalry shared and renamed, level 1; the Italians’ Condotta shares it too). Alternatives: the Union of Krewo (1385), although an alliance is a team-bonus trait under RULES 6.2, or the levy back as a Castle Age tech that spawns Knights (the First Crusade pattern). Accept?",
  "Hussite Wagon: Poland also used Czech mercenaries with wagons and guns (the Orphans beside the Poles in 1433, Świecino 1462) and later its own tabor, yet only the Magyars share the Hussite Wagon. The Hungarian case is earlier and better documented (Hunyadi’s wagon forts at Varna 1444 and Kosovo 1448). Share it with the Poles as well, or keep the tabor as an N2 idea?",
  "Architecture: historically the Central European set fits Poland better than the Eastern European one (see the architecture basis). Moving both the Poles and the Magyars would put four civs on Central European (Germans, Bohemians, Poles, Magyars) and three on Eastern European (Rus’, Lithuanians, Avars), against two and five now, but Poles and Germans would look alike. Change it? (To be decided with the Magyars.)",
  "Team bonus: ‘Universities work +80% faster’ is now the team bonus of six drafts (Malians, Franks, Poles, Chinese, Khmer, Persians) and part of the Georgians’ Gelati Academy, and identical team bonuses presumably stack in team games. Keep it, or choose another trait that benefited neighbours, such as Wieliczka and Bochnia salt sold to Silesia and Lithuania, or the union with Lithuania (Krewo, 1385)?",
  "Guilds: missing from the tree although Kraków was a Hanseatic town and Gdańsk and Toruń came under the crown in 1454/66. Add it?",
  "Two-Man Saw: the first draft added it (timber, pitch and potash floated down the Vistula to Gdańsk); it is held back here to offset the other additions (Plate Barding Armor, Hand Cannoneer, Hussar, Architecture). Add it?",
  "Power budget: the Poles keep Folwark, stone-to-gold and Szlachta Privileges (Knight-line -60% gold, which now pairs with Plate Barding Armor) and gain faster Stables in the Imperial Age (Wojsko Zaciężne), cheaper fortifications and four tree items, losing villager regeneration, the Obuch, the Winged Hussar, Lechitic Legacy and the old team bonus. Is the balance acceptable?",
]

[profile]
entity = "The Piast duchy and Kingdom of Poland (Corona Regni Poloniae from the 14th century) under the Piasts and the Jagiellonians, in personal union with Lithuania from 1385–86"
region = "Greater and Lesser Poland, Kuyavia and Sieradz–Łęczyca, with Red Ruthenia (from the 1340s), Masovia as a fief and Royal Prussia after 1454/1466; Silesia until the 1330s"
window = "966–1500 (from the baptism of Mieszko I to the end of the time frame; royal coronations in 1025 and 1076, then from 1295/1320; divided 1138–1320; focus: the reunited kingdom, 1320–1500)"
sources = [
  "Gallus Anonymus, Gesta principum Polonorum (c. 1115)",
  "Vincent Kadłubek, Chronica Polonorum (c. 1200)",
  "Jan Długosz, Annales seu cronicae incliti Regni Poloniae (15th century)",
  "Paul W. Knoll, The Rise of the Polish Monarchy: Piast Poland in East Central Europe, 1320–1370 (1972)",
  "Norman Davies, God’s Playground, vol. 1 (1981)",
  "Sven Ekdahl, Die Schlacht bei Tannenberg 1410 (1982)",
  "Andrzej Nadolski, Grunwald 1410 (Historyczne Bitwy; 2nd ed. 2008)",
  "Sławomir Jóźwiak, Krzysztof Kwiatkowski, Adam Szweda and Sobiesław Szybkowski, Wojna Polski i Litwy z Zakonem Krzyżackim w latach 1409–1411 (2010)",
  "Jędrzej Tomasz Kałużny, ‘U boku króla. Chorągiew nadworna królów Polski u schyłku XV wieku’, Folia Historica 103 (2019)",
  "Jędrzej Tomasz Kałużny, ‘Uzbrojenie i wyposażenie członków chorągwi nadwornej królów Polski w drugiej połowie XV w.’, Oblicza wojny 9 (2023)",
  "Przemysław Urbańczyk, Mieszko Pierwszy Tajemniczy (2012)",
]

[[bonus]]
text = "Folwark replaces Mill"
kind = "economic"
level = 1
change = "kept"
precedent = "Folwark replaces Mill (Poles)"
basis = "The folwark (from German Vorwerk) was the lord’s demesne farm worked with peasant labour services, attested from the 13th–14th centuries and spreading in the 15th with grain exports through Gdańsk (statute of Piotrków 1496; statute of Toruń 1520 fixed a minimum of one day of labour service a week). Collecting part of the food of the nearby farms translates it well."
relevance = "The folwark grain economy shaped Polish society (the ‘second serfdom’) and its trade with the West for three centuries."
contested = "The dominant folwark economy is mainly a post-1450 reality, at the end of the time frame."

[[bonus]]
text = "Stone Miners generate gold in addition to stone"
kind = "economic"
level = 1
change = "kept"
precedent = "Stone Miners generate gold in addition to stone (Poles); the Muisca draft copies it for their salt"
basis = "A good abstraction of the rock-salt mines of Wieliczka and Bochnia (the żupy krakowskie), a royal monopoly regulated by Casimir III’s ordinance of 1368; salt is traditionally estimated to have brought in about a third of the crown’s revenue in his reign (Knoll 1972). The silver and lead of Olkusz add to it."
relevance = "Salt was one of the crown’s main revenues and financed the reunited kingdom of the 14th century."

[[bonus]]
text = "Bloodlines and Scout Cavalry-line upgrades cost -50% food"
kind = "military"
level = 1
change = "kept"
precedent = "Bloodlines and Scout Cavalry-line upgrades cost -50% food (Poles)"
basis = "The weight of light cavalry in the wars against Lithuanians, Tatars and the Order: registers of the royal court banner in the second half of the 15th century list, beside riders in kopijnik armour and in ‘shooter’s’ armour, light horsemen equipped ‘in the Rascian or Tatar manner’ (Kałużny 2023). The Bloodlines half is a generic abstraction for a cavalry kingdom: the evidence is about light horse, not horse breeding."
relevance = "Poland was a cavalry kingdom throughout the period, and light horse on the Tatar frontier was structural."

[[bonus]]
text = "Fortifications cost -15% stone"
kind = "other"
level = 1
change = "new"
replaces = "Villagers regenerate 10/15/20 HP in Feudal/Castle/Imperial Age"
precedent = "Buildings cost -15% stone (Incas)"
basis = "The Polish state was built on fortification from the start: dendrochronology dates the great earth-and-timber strongholds (grody) of Gniezno, Poznań, Giecz and Ostrów Lednicki to the mid-10th century, the frame of Mieszko I’s state (Urbańczyk 2012). Casimir III the Great (1333–1370) built or fortified dozens of royal castles and town walls in brick and stone; Długosz lists those attributed to him (Knoll 1972). The tradition that he ‘found Poland made of wood and left it made of brick’ is a saying modelled on Suetonius’ Augustus (Divus Augustus 28.3), not a measurement. The villager regeneration it replaces had no direct historical basis: it stretched the hypothesis of a lower Black Death mortality in Poland."
relevance = "The strongholds carried the first Piast state, and Casimir’s castles and walls consolidated the kingdom reunited in 1320; they are the image of his reign."

[team_bonus]
text = "Universities work +80% faster"
level = 1
change = "new"
replaces = "Scout Cavalry-line +1 attack vs. Ranged Soldiers"
precedent = "Universities work +80% faster (Malians team bonus); the Franks’, Chinese, Khmer and Persians’ drafts use the same team bonus, and the Georgians’ Gelati Academy contains it"
basis = "Casimir III founded the University of Kraków in 1364 and it was refounded in 1400 with Queen Jadwiga’s bequest; by the late 15th century it was a leading centre of astronomy and mathematics (Copernicus studied there in 1491–95) and drew many students from Silesia, Hungary and the German lands, so its teaching served the neighbours as well (RULES 6.2: transferred knowledge). The replaced team bonus had only a vague link to light cavalry fighting Tatar horse archers."
relevance = "The Kraków Academy was the intellectual centre of the Jagiellonian lands and the school of Copernicus."

[[unique_unit]]
name = "Kopijnik"
model = "Monaspa"
building = "Castle"
level = 1
change = "new"
replaces = "Obuch (Infantry)"
basis = "Late-medieval Polish cavalry fought in banners (chorągwie) made up of ‘lances’ (kopie): an armoured knight with his retainers. Registers of the royal court banner distinguish heavily armed riders in kopijnik armour (zbroja kopijnicza, arma plena) from medium ‘shooters’ and light horse; in the register drawn up after the Moldavian campaign of 1497 only about 13% of 288 riders had kopijnik armour (Kałużny 2019; 2023), and Jan Ostroróg required a kopijnik to have full armour (cited in Kałużny 2023). At Grunwald (1410) Długosz lists about fifty Polish banners. The Monaspa profile (heavy cavalry that becomes stronger when other Kopijniks or Knight-line units are nearby) translates banner fighting. It takes the slot of the Obuch, a nobleman’s war hammer of the 16th–17th centuries above all, never an infantry type (see open questions)."
relevance = "The armoured knights of the banners bore the brunt at Grunwald (1410) beside the Lithuanian army of the union; every lance was built around a kopijnik with his retainers, which is why the registers count few kopijnicy among many riders."

[[unique_tech]]
name = "Szlachta Privileges"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Knight-line costs -60% gold"
level = 1
change = "changed"
replaces = "Szlachta Privileges (Castle unique tech, same effect)"
precedent = "Szlachta Privileges (Knight-line costs -60% gold) (Poles): moved to the Town Center, identical effect; the Swedes’ draft shares it as Alsnö stadga"
basis = "The privilege of Košice (1374) freed the nobility from almost all taxes and bound the king to pay compensation for service beyond the borders; Czerwińsk (1422) and Jedlnia–Kraków (1430/1433) protected noble property and person; and in 1454 the nobles mustered for the Thirteen Years’ War extorted the privileges of Cerekwica and Nieszawa, by which no levy could be called without the land assemblies (Davies 1981). The Buda privilege of 1355, granted for the Angevin succession, prefigured Košice (Knoll 1972). In exchange the nobles owed mounted service at their own expense within the realm in the general levy (pospolite ruszenie), mustered for Grunwald (1410) and for the Thirteen Years’ War. The levy belongs to this tech, not to a tech of its own: it was a standing obligation (RULES 6.2) and the other side of the same bargain (RULES 6.3). Cheaper knights translate the bargain; the tech moves to the Town Center because the privileges were the constitution of the noble state."
relevance = "The privileges created the noble ‘nation’ of the szlachta, the defining feature of Polish political history, and the levy was their price."

[[unique_tech]]
name = "Wojsko Zaciężne"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Stables work +40% faster"
level = 1
change = "new"
replaces = "Lechitic Legacy (Scout Cavalry-line deals trample damage)"
precedent = "Chivalry (Stables work +40% faster) (Franks): an existing unique tech, shared and renamed with an identical effect, at the Castle as in the game; the Italians’ Condotta shares it too, for the same kind of contract hiring"
basis = "The noble levy was beaten at Chojnice (1454), and in the Thirteen Years’ War (1454–66) the crown turned to hired companies (roty) of horse and foot, Polish, Silesian, Moravian and Czech, raised by captains (rotmistrze) under contract and paid from taxes the nobles voted and from loans; in 1457 it even bought Marienburg from the Order’s own unpaid mercenaries, and a hired army under Piotr Dunin won at Świecino (1462), which turned the war (Długosz; Davies 1981). By the 1490s a small standing force of hired horse (obrona potoczna) guarded the south-eastern border against the Tatars, while the levy failed again in the Bukovina forest (1497). Faster Stables abstract the companies of horse that a paying crown could raise. Lechitic Legacy is dropped: Kadłubek already called the Poles ‘Lechitae’, but nothing links that name to trampling light cavalry."
relevance = "Hired companies won the Thirteen Years’ War, which gave Poland Royal Prussia and Gdańsk (1466), and replaced the noble levy as the kingdom’s field army."

[tree]
add = ["Plate Barding Armor", "Hand Cannoneer", "Hussar", "Architecture"]
remove = []

[tree.basis]
"Plate Barding Armor" = "Western-style armoured knights (Zawisza the Black of Garbów) formed the core of the Polish army at Grunwald. For a cavalry civilization, lacking the last cavalry armour upgrade (held by 36 civs) was the most significant gap in the tree, while the Lithuanians had it."
"Hand Cannoneer" = "Firearms are recorded in Poland from the 1380s, and in the 15th century towns such as Kraków kept hook guns and handguns (hakownice, later rusznice) in their arsenals. In 1433 the Hussite Orphans fought beside the Polish army against the Order, and in the Thirteen Years’ War (1454–66) the crown hired foot with handguns and wagons, many of them Czech (Świecino, 1462). The Poles already had the Bombard Cannon."
"Hussar" = "Light horsemen equipped ‘in the Rascian or Tatar manner’ already served in the royal court banner in the second half of the 15th century (Kałużny 2023), and hussar banners of Rascian (Serbian) horse appear by name in the crown’s pay registers from c. 1500–03; they stayed light cavalry until the reign of Stephen Báthory (1576–86). The type originated inside the time frame, so it is not a late element under RULES section 2. Added to replace the light cavalry upgrade the Winged Hussar used to provide."
"Architecture" = "Casimir III’s building programme and the brick Gothic of Kraków, Toruń and Gdańsk, the last two under the Polish crown from 1454 (confirmed in 1466)."

[architecture]
set = "Eastern European"
change = "kept"
basis = "Kept for now for visual distinctness, not for historical fit: medieval Polish building was Latin Romanesque and Gothic like Bohemia’s (Wawel cathedral, 1320–64; the brick Gothic of Kraków, Toruń and Gdańsk; towns under German law; Veit Stoss of Nuremberg carving the St Mary’s altarpiece in Kraków, 1477–89), so historically the Central European set fits better. Whether to accept its cost in visual distinctness is the owner’s choice (see open questions)."

[[dropped]]
item = "Winged Hussar"
kind = "unique_unit"
reason = "Anachronistic and of the wrong type. The winged hussars are a cavalry of the late 16th and 17th centuries (Kircholm 1605, Kłuszyn 1610, Vienna 1683), and they were heavy shock lancers, while the game uses them as a light scouting and raiding upgrade of the Light Cavalry. The early Polish hussars of c. 1500 are represented by the generic Hussar added to the tree."
