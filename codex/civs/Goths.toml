civ = "Goths"
name = "Goths"
status = "draft"
label = "Cavalry and Infantry civilization"
summary = "Goths redefined as the Visigothic (418–711) and Ostrogothic (493–553) kingdoms, Roman successor states rather than a ‘barbarian horde’: the lance-armed Gothic Lancer (Coustillier model), a lance-charge tech and a federate team bonus replace the cheap infantry flood; the Visigothic military laws give a levied infantry; Roman towns, estates and building skills carry the economy; walls return, and the anachronistic gunpowder, horse archers, Huskarl, Anarchy and Perfusion leave."
ideas = [
  "N2: Two mutually exclusive Monastery techs, ‘Homoian Church’ and ‘Third Council of Toledo’ (589): Arian loyalty (Heresy free, stronger Monks) or Catholic conversion (Atonement and Redemption, cheaper Monastery techs).",
  "N3: Carrago, the Gothic wagon laager (Ammianus 31.7.7, 31.12.11), as a cheap garrisonable field fortification built by Villagers.",
  "N3: Split into Visigoths and Ostrogoths, whose trajectories differ (Catholic, law-giving Toledo versus Arian, Roman-Gothic Ravenna).",
  "N3: A late-antiquity chronological ceiling for the Goths (and Avars): no counterweight Trebuchet, Galleon, Carrack, Halberdier, Hussar, Petard or Demolition Ships, with torsion-artillery and fire-raft substitutes.",
]
contested = [
  "How decisive the Gothic cavalry was at Adrianople (378): the classic ‘victory of cavalry’ (Oman) is questioned by revisionists, though Ammianus (31.12.17) gives the returning Greuthungian and Alan horse the decisive blow.",
  "How the Goths were settled in 418 and after: division of estates (the Code of Euric's Gothic sortes and Roman tertiae) or assignment of tax revenues (Goffart, Barbarians and Romans, 1980).",
  "Whether the thiufa (nominally a thousand men) was ever mustered or existed mainly on paper.",
  "The prosperity of Theodoric's Italy rests partly on the Anonymus Valesianus, a text with a clear partisan slant.",
]
open_questions = [
  "Unique unit name: ‘Gothic Lancer’ is descriptive, since no Gothic word for a lancer is attested; gardingi and buccellarii were royal or private retainers, not a troop type. Keep it, or use a Latin term?",
  "Unique unit model: the Coustillier (a powerful lance charge) was chosen over the Cataphract (whose 6th-century Byzantine counterpart was a mounted archer, the very opposite of the bowless Gothic lancer in Procopius) and the Leitis. Agree?",
  "Remaining late-antiquity anachronisms are kept as generic abstractions: counterweight Trebuchet, Galleon, Carrack, Halberdier, Hussar, Petard and Demolition Ships. Remove some in N1 (the Avars draft swaps the Trebuchet for the Traction Trebuchet, which is not attested for the Goths either)?",
  "Liber Iudiciorum has the same effect as the Avars' Befulci (the Malay Forced Levy): both stand for forced levies. Accept the repetition?",
  "Theodoric's thousand dromons (Cassiodorus, Variae V.16–17) are represented only by keeping the regional Dromon; add a Dromon cost bonus instead of one of the economic bonuses?",
  "The Crimean Goths (Theodoro, to 1475) are left out of the profile. Agree?",
  "Architecture: the current set is assumed to be Central European (not recorded in the repository data).",
]

[profile]
entity = "Visigothic kingdom of Toulouse and Toledo and Ostrogothic kingdom of Italy"
region = "Aquitaine, Septimania and Hispania; Italy and Dalmatia"
window = "418–711"
sources = [
  "Procopius, Wars V–VIII (the Gothic War)",
  "Cassiodorus, Variae",
  "Anonymus Valesianus II",
  "Jordanes, Getica (551)",
  "Isidore of Seville, Historia Gothorum; John of Biclaro, Chronicle",
  "Liber Iudiciorum (654, revised 681)",
  "Herwig Wolfram, History of the Goths (1988)",
  "Peter Heather, The Goths (1996)",
  "Roger Collins, Visigothic Spain 409–711 (2004)",
  "Jonathan J. Arnold, Theoderic and the Roman Imperial Restoration (2014)",
]
replaces = "Goths as a generic ‘barbarian horde’ from the 3rd to the 8th century"

[[bonus]]
text = "Knight-line +1 attack vs. Infantry"
kind = "military"
level = 1
change = "new"
precedent = "Knight-line +1 attack vs. Infantry (Varangians team bonus)"
basis = "Gothic horsemen fought with lance and sword and rode down infantry: the return of the Greuthungian and Alan cavalry decided Adrianople (Ammianus 31.12.17), and Procopius says the Gothic horse used only spears and swords (Wars V.27); at Taginae (552) it charged the Roman centre (Wars VIII.32)."

[[bonus]]
text = "Town Centers cost -50% stone"
kind = "economic"
level = 1
change = "new"
precedent = "Town Centers cost -50% stone (Bulgarians)"
basis = "The Gothic kings ruled from Roman cities (Toulouse, Ravenna, Toledo), and the Visigoths were among the few early medieval founders of new towns: Leovigild's Reccopolis (578) and Victoriacum (581) (John of Biclaro) and Suinthila's Ologicus (621, Isidore)."

[[bonus]]
text = "Farms cost -40%"
kind = "economic"
level = 1
change = "new"
replaces = "Hunters carry +15; hunted animals last +20% longer"
precedent = "Farms cost -40% (Teutons)"
basis = "The Goths settled on working Roman estates, as federates in Aquitaine (418) and as rulers of Italy and Hispania; under Theodoric a solidus bought sixty measures of wheat (Anonymus Valesianus 73) and marshes were drained for farmland (Variae II.32–33). The replaced hunting bonus repeated the ‘barbarian hunter’ trope against the evidence of a farming people."
contested = "Whether the Goths received land or tax revenues (see the civ-level notes)."

[[bonus]]
text = "Masonry, Architecture free"
kind = "other"
level = 1
change = "new"
precedent = "Town Watch, Town Patrol free (Byzantines); Murder Holes, Herbal Medicine free (Teutons)"
basis = "The Gothic kings built in the Roman manner: Theodoric's palace, churches and mausoleum at Ravenna and his funds for Rome's walls and palace (Anonymus Valesianus 67); the palace church of Reccopolis and Visigothic churches such as San Juan de Baños (661)."

[team_bonus]
text = "Gothic Lancer available at the Stable starting in Castle Age"
level = 1
change = "new"
replaces = "Barracks work +20% faster"
precedent = "Genitour available at the Archery Range starting in Castle Age (Berbers team bonus); Condottiero available at the Barracks in Imperial Age (Italians team bonus)"
basis = "The Goths fought as federates (foederati) of their allies: the foedus of 418 settled the Visigoths in Aquitaine as a Roman army, and their cavalry fought beside Aetius against Attila at the Catalaunian Plains (451, Jordanes, Getica); before taking Italy, Theodoric served the emperor Zeno as magister militum. The replaced team bonus had no historical basis."

[[unique_unit]]
name = "Gothic Lancer"
model = "Coustillier"
building = "Castle"
level = 1
change = "new"
replaces = "Huskarl"
basis = "Heavy horsemen armed with lance and sword and without bows, the core of Gothic armies (Procopius, Wars V.27); the Coustillier's charged attack renders the lance charge of Adrianople and Taginae. The Huskarl is dropped: húskarl is an Old Norse word for the household troops of 10th–11th-century Scandinavian kings, five centuries after the Gothic kingdoms."

[[unique_tech]]
name = "Thiufa"
age = "Castle"
effect = "Knight-line train +50% faster and receive a charge attack"
level = 1
change = "new"
precedent = "Militia-line, Knight-line, and Centurions train +50% faster and receive a charge attack (Comitatenses, Romans, out of scope): Knight-line only"
basis = "The thiufa, the largest unit of the Visigothic host under its thiufadus, appears in the Liber Iudiciorum as the frame in which the army was mustered; the charge is that of the Gothic lancers (Procopius)."
contested = "The thiufa may have been an administrative rather than a field unit."

[[unique_tech]]
name = "Liber Iudiciorum"
age = "Imperial"
effect = "Militia-line gold cost is replaced by additional food cost"
level = 1
change = "new"
replaces = "Perfusion"
precedent = "Militia-line gold cost is replaced by additional food cost (Forced Levy, Malay): identical effect, renamed"
basis = "The Visigothic law code (654, revised by Ervig in 681) contains the military laws of Wamba (673) and Ervig (681), which obliged free men, clergy and magnates to answer the call to arms and to bring a share of their slaves armed (Liber Iudiciorum IX.2.8–9): an unpaid levy rather than a paid army. Perfusion, a medical term, had no Gothic referent."
contested = "Whether Ervig's law replaced Wamba's or both stayed in force (Céline Martin argues for the latter)."

[tree]
add = ["Stone Wall", "Gate", "Guard Tower", "Fortified Wall", "Plate Mail Armor", "Plate Barding Armor", "Heresy"]
remove = ["Hand Cannoneer", "Bombard Cannon", "Cavalry Archer", "Heavy Cavalry Archer", "Siphons", "Incendiaries"]

[tree.basis]
"Stone Wall" = "Theodoric restored the walls of Rome and other cities (Anonymus Valesianus 67; Cassiodorus, Variae), Leovigild founded walled Reccopolis (578), and Toledo, Septimania and the Pyrenean passes had Visigothic fortifications; a wall-less ‘nomad’ tree is the barbarian stereotype."
"Gate" = "Comes with the Stone Wall."
"Guard Tower" = "Late Roman city walls, which the Goths kept and repaired, were studded with towers."
"Fortified Wall" = "The Aurelian walls of Rome and the walls of Ravenna and Toledo were held and repaired by Gothic kings."
"Plate Mail Armor" = "Gothic warriors were not unarmoured peasants: the elite wore mail and Roman-type segmented helmets; the top armour tier is a generic abstraction."
"Plate Barding Armor" = "Completes the armour line of a civ whose core is heavy lance cavalry."
"Heresy" = "The Goths kept their Homoian (‘Arian’) church as a mark of identity, the Ostrogoths to the end and the Visigoths until Reccared's conversion at the Third Council of Toledo (589); units dying rather than changing sides renders that confessional loyalty."
"Hand Cannoneer" = "Gunpowder reached Europe c. 1320, six centuries after the last Gothic kingdom fell (553/711)."
"Bombard Cannon" = "As for the Hand Cannoneer; the Goths' siege engines were rams and towers (Vitiges at Rome, 537)."
"Cavalry Archer" = "Belisarius explained his victories by the Goths' lack of mounted archers: their horsemen used only spears and swords and their bowmen fought on foot (Procopius, Wars V.27)."
"Heavy Cavalry Archer" = "As for the Cavalry Archer."
"Siphons" = "The fire siphon was a Byzantine invention of c. 672 and a state secret (De Administrando Imperio 13), after the Ostrogoths and never shared with the Visigoths."
"Incendiaries" = "No incendiary or exploding ships are attested in Gothic fleets."

[architecture]
set = "Mediterranean"
change = "changed"
replaces = "Central European"
basis = "The Goths built in the late Roman Mediterranean tradition at Ravenna (Theodoric's mausoleum, Sant'Apollinare Nuovo) and in Hispania (Reccopolis, San Juan de Baños); the Central European set evokes the later ‘Gothic’ style, a Renaissance label unrelated to the Goths."

[[dropped]]
item = "Loom is researched instantly"
kind = "bonus"
reason = "No historical basis; a balance device."

[[dropped]]
item = "Infantry costs -15/20/25/30% in Dark/Feudal/Castle/Imperial Age"
kind = "bonus"
reason = "Rests on the image of innumerable cheap barbarians: modern estimates put the Tervingi and Greuthungi of 376 at some 15,000–20,000 warriors (Heather 1996), and the elite was the cavalry. The levied infantry of the Visigothic laws is represented by the Liber Iudiciorum tech."

[[dropped]]
item = "Infantry +1/+2/+3 attack vs. buildings in Feudal/Castle/Imperial Age"
kind = "bonus"
reason = "The Goths were notoriously poor at storming walls: Fritigern declared himself ‘at peace with walls’ (Ammianus 31.6.4), and they failed before Adrianople and Constantinople (378) and Rome (537–538)."

[[dropped]]
item = "+10 population space in Imperial Age"
kind = "bonus"
reason = "No historical basis; it reinforced the ‘horde’ stereotype."

[[dropped]]
item = "Anarchy"
kind = "unique_tech"
reason = "It only let the anachronistic Huskarl be trained at the Barracks; the link to the Visigothic habit of deposing kings (Fredegar IV.82, the ‘morbus Gothorum’ of modern historians) was in the name only."
