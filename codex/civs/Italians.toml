replaces = "A pan-Italian civ stretched into the Italian Wars (1494–1559), with an anti-gunpowder Condottiero"

[[bonus]]
text = "Advancing to the next Age costs -15%"
kind = "economic"
level = 1
change = "kept"
precedent = "Advancing to the next Age costs -15% (Italians)"
basis = "An abstraction of the precocious urban, commercial and communal society of 11th–15th-century northern Italy (Lopez, 1971; Jones, 1997): there is no specific mechanism behind it, but the trait is real."
relevance = "Northern and central Italy was the most urbanised and commercialised region of Latin Europe from the 12th century; that precocity is the civ's defining trait, abstracted as a whole."

[[bonus]]
text = "Foot Archers +1 melee/+1 pierce armor"
kind = "military"
level = 1
change = "changed"
replaces = "Foot Archers and Condottieri +1 melee/+1 pierce armor"
precedent = "Foot Archers and Condottieri +1 melee/+1 pierce armor (Italians), without the Condottieri"
basis = "The pavise, the crossbowman's large shield (its name probably from Pavia), carried by pavesari who covered the crossbowmen of the communal militias and of Genoa's forces and fleets (Mallett, 1974). The Condottieri leave the target with the unit, and Milanese armour now belongs to the heavy cavalry (see the Condotta)."
relevance = "The crossbowman behind his pavise was the standard Italian missile soldier from the 13th to the 15th century, in the communal militias, in Genoa's forces and fleets and in mercenary service; the bonus rests on that crossbow tradition, with the pavise as its emblem."
contested = "At Crécy (1346) the Genoese reportedly fought without their pavises, left with the baggage."

[[bonus]]
text = "Dock and University technologies cost -25%"
kind = "economic"
level = 1
change = "kept"
precedent = "Dock and University technologies cost -25% (Italians)"
basis = "Cheaper Dock technologies stand for the seafaring craft of the maritime republics at home, Pisa, Genoa and Venice: their shipwrights, crews and pilots, the regular convoys of merchant galleys that Venice sent each year to Romania, Syria, Alexandria and, from the early 14th century, Flanders (the mude), and the portolan charts drawn in Italy from the late 13th century, of which the Carta Pisana is the oldest to survive (Lane, 1973; Epstein, 1996; Campbell, 1987). The same skill made Italian admirals and galleys sought abroad, a benefit to other states that belongs to the team bonus, whose basis counts the Genoese galleys in foreign service (RULES 6.2). Cheaper University technologies stand for some of Europe's oldest universities, Bologna (conventionally 1088), Padua (1222), Siena (1240), Perugia (1308), the Florentine Studium (1321, chartered 1349) and Pavia (1361), and a strong tradition of engineering. The Arsenal of Venice, on which the Dock half used to rest, is now a tech of its own (Arsenale), so that one institution is not split between a passive and a tech (RULES 6.3)."
relevance = "Italian seamanship and the Italian universities sustained the naval and intellectual primacy of medieval Italy: the republics' fleets and charts and their universities set the standard for Latin Europe."
contested = "The date and place of the Carta Pisana (late 13th century; Genoa or Pisa) are uncertain."

[[bonus]]
text = "Gunpowder Units cost -20%"
kind = "military"
level = 1
change = "kept"
precedent = "Gunpowder Units cost -20% (Italians)"
basis = "A Florentine document of 11 February 1326 is, with Walter de Milemete's English manuscript of the same year, one of the two earliest European records of metal cannon; the Venetians used bombards in the war of Chioggia (1379–1380), on land and aboard their ships (see the Siphons line of the tree); Brescia and Milan were great arms centres and Italian founders were among the best; and by the later 15th century the armies of Milan and Venice included large companies of handgunners (schioppettieri) (Mallett, 1974; Mallett and Hale, 1984), the troops the discount mostly affects in play."
relevance = "Adoption from 1326 and the handgunner companies of 15th-century Milan and Venice made firearms a lasting part of Italian warfare; a real trait of moderate weight. It stays as the civ's second military passive, the heavy cavalry being expressed through the Condotta rather than a Knight-line passive (level-1 review decision)."
contested = "In the 15th century Burgundy, France and Germany were at least as advanced in artillery; Charles VIII's guns impressed the Italians in 1494."

[[bonus]]
text = "Market technologies free"
kind = "economic"
level = 1
change = "new"
replaces = "Fishing Ships cost -15% (dropped for relevance, RULES 6.9: the maritime republics were merchant and naval powers, not great fishing powers, so fishing did not shape their identity)"
precedent = "Mill technologies free (Franks); Lumber Camp technologies free (Burmese); Mining Camp technologies free (Bohemians)"
basis = "Italy's commercial revolution: the bill of exchange; double-entry book-keeping, in use by c. 1300 (the Farolfi company ledger of 1299–1300; the accounts of the Genoese commune's massari from 1340) and codified in print by Pacioli (1494); the gold florin (1252) and ducat (1284); merchant and banking guilds such as Florence's Calimala and Arte del Cambio; and the great companies of the Bardi, Peruzzi and Medici (Lopez, 1971; de Roover, 1963)."
relevance = "Banking and commercial techniques are the most influential Italian innovation of the period: Italian banks financed popes and kings across Europe."

[team_bonus]
text = "Genoese Crossbowman (without the Elite upgrade) available at the Archery Range in Imperial Age"
level = 1
change = "changed"
replaces = "Condottiero available at the Barracks in Imperial Age"
precedent = "Condottiero available at the Barracks in Imperial Age (Italians team bonus); Genitour available at the Archery Range starting in Castle Age (Berbers team bonus). Without the Elite upgrade, like the Condottiero, which has no Elite tier, to stay within the magnitude of these precedents"
basis = "Genoese crossbowmen were the most sought-after mercenary marksmen of Latin Europe. Several thousand formed the French vanguard at Crécy (1346) under Ottone Doria and Carlo Grimaldi (Ayton and Preston, 2005; Sumption, 1990), proof that they were in demand rather than of their success that day. Genoese war galleys, whose crews included crossbowmen, served the French crown (Zierikzee, 1304; Sluys, 1340) and Castile under Egidio Boccanegra (the siege of Algeciras, 1342–1344), and Genoese soldiers served Byzantium and the Italian states; Giovanni Giustiniani Longo's 700 well-armed men from Genoa and Chios at the defence of Constantinople (1453) are an example of Genoese military service in general, not of crossbowmen as such (Epstein, 1996). Hiring them benefited Genoa's employers, as RULES 6.2 requires; the Condottiero it replaces had no basis as a unit type. The crossbowmen are kept as the team bonus rather than the naval alternative, Docks of the team working faster for the Genoese admirals and galleys in foreign service, which the Arsenale and the Dock passive already reflect at home (level-1 review decision). The Portuguese Besteiro do Conto uses the same model, so a Portuguese–Italian team fields the Genoese Crossbowman twice under two names, which the design accepts (RULES 6.16.12)."
relevance = "Genoese crossbowmen were Italy's most famous military export, hired by France, Castile, Byzantium and the Italian states; their service abroad is a benefit to allies by definition."
contested = "Their numbers at Crécy vary widely in the sources (c. 2,000–6,000)."

[[unique_unit]]
name = "Genoese Crossbowman"
model = "Genoese Crossbowman"
building = "Castle"
level = 1
change = "kept"
basis = "Genoese crossbowmen formed the core of Genoa's own forces and fleets and served France (Crécy, 1346), Castile, Byzantium and the Italian states (Epstein, 1996). Behind their pavises they stood up well to cavalry, so 'strong vs. cavalry' is an abstraction. The model is shared with the Portuguese Besteiro do Conto."
relevance = "The core of Genoa's forces and fleets and the most sought-after mercenary marksmen of Latin Europe and Byzantium, the Genoese crossbowman is also the best-known Italian soldier of the Middle Ages."

[[unique_tech]]
name = "Commenda"
building = "Market"
kind = "civil"
age = "Castle"
effect = "Trade Units cost -50%"
level = 1
change = "changed"
replaces = "Silk Road"
precedent = "Silk Road (Italians): identical effect, moved from the Castle to the Market (trade, RULES 6.2) and renamed"
basis = "The commenda (colleganza in Venice), in which a sedentary investor financed a travelling merchant's voyage for a share of the profit, appears in series in the cartulary of the Genoese notary Giovanni Scriba (1154–1164) and financed Italian long-distance trade from Caffa and Tana to Alexandria and Acre (Lopez, 1971; Epstein, 1996). 'Silk Road' is a term coined by Richthofen in 1877, and Italian trade with Asia went mostly through the Levant and the Black Sea."
relevance = "The commenda was the contract that financed the maritime trade of the Italian republics and spread commercial partnership across the Mediterranean; a defining institution of the commercial revolution."
contested = "Its origins are debated: the Roman and Byzantine sea loan, the Jewish isqa and the Islamic qirad have all been proposed (Udovitch, 1962; Pryor, 1977); the contract was used across the Latin Mediterranean (Marseille, Barcelona), but the Italian notarial records are the earliest and densest."

[[unique_tech]]
name = "Comune"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Town Centers fire arrows without garrison"
level = 1
change = "new"
precedent = "Tigui (Malians in the game; the Malians' design drops it): identical effect and age, moved to the Town Center and renamed (an existing unique tech, RULES 6.5). No other design holds the effect"
basis = "From the late 11th century the cities of the Regnum Italiae became communes: sworn associations of citizens led by elected consuls (attested from the 1080s–1130s at Pisa, Genoa, Milan and elsewhere) and, from the late 12th century, by a foreign podestà, which governed, taxed, legislated and defended themselves. Citizens owed watch on the walls and service in the militia; the communes of the Lombard League defeated Frederick Barbarossa at Legnano (1176), and at the Peace of Constance (25 June 1183) he recognised their consuls and regalian rights, including the right to fortify their cities and to keep their league (Wickham, 2015; Jones, 1997). A Town Center that defends itself without sheltering villagers abstracts the city held by its own sworn citizens. The commune keeps the Town Center rather than a fiscal institution (the funded public debt of Venice, 1262, and Florence, 1345; the Catasto, 1427; the Casa di San Giorgio, 1407) or the podestà (level-1 review decision)."
relevance = "The commune is the defining institution of medieval northern and central Italy: without it there are no city-states."
contested = "How the communes arose, by rupture or by continuity with earlier urban institutions (Wickham, 2015)."

[[unique_tech]]
name = "Condotta"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Knight-line trains +50% faster"
level = 2
change = "new"
replaces = "Pirotechnia"
precedent = "Comitatenses (Romans, an out-of-scope civ whose techs remain in the game): Militia-line, Knight-line, and Centurions train +50% faster and receive a charge attack; the Knight-line training part only"
basis = "Italian states hired their heavy cavalry by contract (condotta): companies of lances, each a man-at-arms with a mounted squire and a page, under captains such as John Hawkwood, Francesco Sforza and Bartolomeo Colleoni, whom Venice made captain-general in 1455, a post he held until his death in 1475. In the 15th century Venice and Milan kept many companies on long contracts, quasi-permanent forces that could take the field as soon as a campaign was decided (Mallett, 1974; Mallett and Hale, 1984; for the 14th-century companies, Caferro, 2006). Their men-at-arms wore Milanese plate from workshops such as the Missaglia's, which with the South German centres made the best armour of 15th-century Europe. Faster Knight-line training abstracts the readiness of these contracted lances. Pirotechnia, which it replaces, is Biringuccio's treatise of 1540 on metallurgy and cannon-founding, outside the window and unrelated to hand cannoneers. The tech is the civ's expression of its heavy cavalry (level-1 review decision): Chivalry (Stables work +40% faster) would also speed the Stradiots and Light Cavalry; the Paladin and the Siege Ram stay out of the tree, as in the game, as counterweights to the stronger economy, although the lances in Milanese plate and the communal sieges (Crema, 1159–1160) could justify them, and Italian siegecraft of the 15th century relied on bombards, which the civ has; the mounted crossbowmen of the 15th-century armies (balestrieri a cavallo) do not keep the regional Mounted Crossbowman, which leaves the tree on the shared test of shooting from the saddle (see the tree)."
relevance = "The lances of the condotte were the core of Italian armies in the 14th and 15th centuries, and the condottieri are among the most famous figures of Renaissance Italy; the tech is the civ's targeted expression of its heavy cavalry."
contested = "Readiness belongs to the 15th-century standing companies: the 14th-century companies were slow to take the field until paid, and their effectiveness and loyalty are debated (see the civ-level list)."

[[unique_tech]]
name = "Arsenale"
building = "Dock"
kind = "military"
age = "Castle"
effect = "Galley-line and Fire Ships train +33% faster; Docks cost -15%"
level = 2
change = "new"
precedent = "Effect 1: Circumnavigation (Sets the entire map to explored; Ships train +33% faster) (Portuguese; the Portuguese design keeps it as Volta do Mar): the training part only, narrowed to the Galley-line and Fire Ships. Effect 2: Docks cost -15% (Vikings team bonus; the Norwegians' design keeps it as its team bonus), as a tech for the civ alone, in the Castle Age, later than the game's team bonus (RULES 6.16.11). A new tech built from existing effects, so level 2 (RULES 6.5)"
basis = "The Arsenal of Venice, traditionally founded in 1104, was the commune's own shipyard. Enlarged as the Arsenale Nuovo (c. 1303–1325) and later the Novissimo (from 1473), it built the state's war galleys and the great galleys of the merchant convoys (mude), kept hulls in reserve and stored their oars, rigging and arms, so that fleets could be fitted out at speed (Lane, 1934 and 1973). Dante took its winter work, the pitch boiling to caulk damaged hulls, as the image of the fifth pit of Malebolge (Inferno XXI, 7–15), and in the late 1430s the Castilian traveller Pero Tafur watched ten galleys come out fully armed between three and nine o'clock, towed past the windows from which their stores were handed out (Tafur, tr. Letts, 1926, ch. XX: the passage belongs to his description of Venice, which follows his return from the East in May 1438, though it is often dated 1436). The galley fleets of the republics decided their wars: Genoa broke Pisa at Meloria (1284) and beat Venice at Curzola (1298), and the two fought the war of Chioggia (1378–1381). Faster training of galleys and fire ships abstracts the series production and rapid fitting-out of the state yard; cheaper Docks, the second half of the tech as the level-1 review proposed it (section 7, Italians Q7), abstract a yard that kept its hulls, timber and fittings in stock. From the Castle Age the discount does little for the fishing economy, whose bonus the design drops for relevance (see Market technologies free)."
relevance = "The Arsenal, one of the largest industrial establishments of pre-modern Europe, was the base of Venetian sea power; with it the naval primacy of the maritime republics has an institution of its own instead of half a passive (owner's decision, level-1 review section 9). It brings the civ to 5 passive bonuses and 4 unique techs, the cap of 9 (RULES 6.1)."
contested = "No document fixes the foundation in 1104, which is a later tradition, and how far the Arsenal worked in series before the 16th century is debated. Genoa, the other great naval power, raised its war fleets largely through private shipowners and contracts rather than one state yard, so the tech is Venetian in substance (Lane, 1973; Epstein, 1996)."

[tree]
add = ["Halberdier", "Siege Engineers"]
remove = ["Mounted Crossbowman", "Thumb Ring", "Siphons", "Incendiaries"]

[tree.basis]
"Halberdier" = "Communal infantry with polearms was decisive in medieval Italy: the Milanese foot held around the carroccio against Barbarossa's knights at Legnano (1176), and Italian polearms (roncone, partisan) were widespread; in the game 43 of the 56 civs have it, but not the Italians."
"Siege Engineers" = "Italy's military engineering (Taccola, Francesco di Giorgio Martini) was exported across Europe: the Bolognese Aristotele Fioravanti built the Dormition Cathedral in Moscow and served Ivan III as master of artillery after 1475. Its absence contradicted the civ's own University bonus."
"Thumb Ring" = "The Thumb Ring is given where the thumb draw is attested for a civ's own archers or for an archery tradition its armies demonstrably used (the steppe, Islamic and East Asian traditions); civs whose archers used the European draw, or whose missile troops were crossbowmen, do not get it. The Italian states do not: their archers used the European draw and their missile troops the crossbow (see the Genoese Crossbowman) (RULES 6.16.4)."
"Siphons" = "Named after the Byzantine fire siphon, a state secret never given to other nations (De Administrando Imperio 13); no ship-borne liquid-fire weapon is documented for this civ. The Italians keep the fleet-of-ships tier (RULES 6.16.1): the war galleys of Venice, Genoa and Pisa and the round ships of their merchant fleets (Lane, 1973; Epstein, 1996), with the Galleon as the skeleton's flagged abstraction (RULES 6.16.2). The Cannon Galleon rests on gun-armed warships inside the window (RULES 6.16.1): in the fighting in the lagoon of Chioggia (1379–1380), Venetians and Genoese mounted bombards on galleys, cogs and the boats called ganzaroli, which Lombardo, from the contemporary chronicles, reads as the first massive use of shipborne artillery (Lombardo, 2021; see contested). These were bombards aboard oared galleys and round ships, not the broadside guns of the game's unit, so the line is an abstraction, as for the Castilians and the Vietnamese."
"Incendiaries" = "Requires Siphons, which this design removes."
"Mounted Crossbowman" = "Shared basis (level-1 review, section 3.2): the Mounted Crossbowman line stays only where shooting from the saddle is documented. Mounted crossbowmen (balestrieri a cavallo) were a regular part of the armies of Milan and Venice in the 15th century (Mallett, 1974; the level-1 analysis rates them plausible), but no source found for this design shows them shooting from the saddle rather than riding to the fight and shooting on foot. Removed; the line returns if a source shows Italian crossbowmen shooting from horseback. Nothing the civ needs to play is lost (RULES 6.11): the Genoese Crossbowman and the foot Archer line keep the missile role, the Stradiot and the Light Cavalry the light-horse role."

[[rename]]
from = "Hussar"
to = "Stradiot"
level = 1
basis = "The stradioti, Albanian and Greek light horsemen in Venetian service in the Morea (Nauplia, Modon, Coron), were brought into Italy in the 1470s against the Ottoman raids into Friuli; they harried the French at Fornovo (1495, just after the window) and were then hired across Europe (Pappas). 'Hussar' is a 15th-century Hungarian name; the function, light raiding cavalry, is identical. The rename meets RULES 6.16.15: the same function inside the window, a period term (stradioti, the Venetian name of these horsemen), and a generic name foreign to the civ."

[architecture]
set = "Mediterranean"
level = 1
change = "kept"
basis = "Italian Romanesque and Gothic communal architecture (towers, loggias, brick and marble) is the core of the Mediterranean set."

[[dropped]]
item = "Condottiero"
kind = "unique_unit"
reason = "The condottiero was the captain who signed the contract, not a soldier type; the companies of the 14th–15th centuries were mainly heavy cavalry, and the fast anti-gunpowder infantry role has no basis (only the 16th-century Bande Nere come close, and they were themselves arquebusiers) (Mallett, 1974). The condottieri are now the Condotta tech and the mercenary team bonus; one unique unit (the Genoese Crossbowman) remains."
