civ = "Italians"
name = "Italians"
status = "draft"
label = "Archer and Naval civilization"
summary = "Italians (1000–1494, from the rise of the maritime republics to the French invasion) keep the Genoese Crossbowman and their maritime, university and gunpowder bonuses; the invented anti-gunpowder Condottiero gives way to the Condotta at the Castle (the Franks' Chivalry renamed), Silk Road becomes the Commenda at the Market, the commune gets the Town Center tech (Comune, the Malians' Tigui renamed), a banking bonus replaces the fishing one, the Genoese Crossbowman becomes the team's mercenary, the Hussar is renamed Stradiot, and Halberdier and Siege Engineers join the tree."
ideas = [
  "N2: A heavy-cavalry unit of its own for the lance of the condotte (a man-at-arms in Milanese plate, paid almost only in gold and trainable by allies), instead of borrowing a model; the analysis proposes it for the Condottiero.",
  "N2: Carroccio: a slow, non-combat wagon giving armour to nearby infantry with the Centurion's aura mechanism, for the Milanese carroccio at Legnano (1176) and Cortenuova (1237).",
  "N3: Venice, Genoa, Milan and Florence as variants of one Italian civ.",
]
contested = [
  "Effectiveness and loyalty of the condottieri: Machiavelli's picture of disloyal, bloodless mercenary war against the revision of Mallett, Caferro and Covini; 'bloodless battles' such as Anghiari (1440) and Molinella (1467).",
  "The 'Renaissance' as a break (Burckhardt, 1860) or a continuation of the Middle Ages (Haskins, 1927); the origins of the communes (Wickham, 2015).",
  "Bologna's founding date of 1088 is conventional, fixed in the 19th century for the 1888 celebration.",
  "Earliest European cannon: Florence and the Milemete manuscript (both 1326) against earlier, contested references.",
  "Why the Genoese failed at Crécy: missing pavises, wet strings or the French order of battle.",
]
open_questions = [
  "Town Center tech: 'Comune' shares the Malians' Tigui (Town Centers fire arrows without garrison, level 1) for the commune as a sworn association of armed citizens. Alternatives: a fiscal institution as a level-2 tech, the funded public debt (Venice's Monte, 1262; Florence's Monte, 1345), the Florentine Catasto (1427) or Genoa's Casa di San Giorgio (1407), with 'All gold income +10%' (Grand Trunk Road, Hindustanis), at the price of an even stronger economy; or the Podestà; or Commenda moved to the Town Center (level 1). Which?",
  "Heavy cavalry and power: the Condotta now shares the Franks' Chivalry (Stables work +40% faster, level 1) instead of the first draft's '+50% Knight-line training and Paladin upgrade'. The Paladin and the Siege Ram stay out as counterweights to the stronger economy (Market technologies free), the new Halberdier, Siege Engineers and Town Center tech, although lances in Milanese plate and the communal sieges of the 12th–13th centuries (Crema, 1159–1160) could justify them; in the Imperial Age (the 15th century for this civ) Italian siegecraft relied on bombards, which the civ has. Add either? A heavy-cavalry unit on the Burgundian Coustillier model ('Lancia', N1) is possible, but historically the coustillier was the lightly armed attendant of the man-at-arms, named after his short blade, so the model would invert the lance; the Condotta keeps the condottieri as a tech.",
  "Team bonus: the Genoese Crossbowman for the team (as drafted) or the naval alternative, Docks of the team work faster, for the Genoese admirals and galleys that served Portugal (Manuel Pessanha, 1317), Castile (Egidio Boccanegra, 1341) and France (Zierikzee, 1304; Sluys, 1340)? With the Portuguese Besteiro do Conto on the same model, a Portuguese–Italian team fields the Genoese Crossbowman twice under two names.",
  "Mule Cart: not given. Mule trains over the Alpine passes (the Gotthard, opened c. 1230; the Brenner; the Mont Cenis) carried Italian goods to the Champagne fairs and Germany, but the carriers were mostly Alpine communities and the civ's identity is maritime. Give it alongside the camps, as for the Castilians and Portuguese?",
  "Thumb Ring: the thumb draw is a steppe and Asian archery technique, out of place for a crossbow civ (names theme). Keep it (as most civs do), remove it, or rename it for a crossbow spanning device (cranequin, goat's-foot lever) if the function is accepted as equivalent? The same question applies to the Castilians and Portuguese, who also have it.",
  "Label: back to the game's 'Archer and Naval civilization', shared with the Portuguese; the first draft's 'Archer and Trade' is not a category the game uses. Change it?",
  "Optional fourth tech, N1 at level 2: Arsenale at the Dock (Galley-line and Fire Ships train faster, Docks cheaper; the Arsenal of Venice) or the trace italienne at the Castle (Castles and towers stronger against siege; Francesco di Giorgio Martini, the Sangallo, 1480s–1490s). Either would bring the civ to 5 passive bonuses + 4 unique techs = 9, at the proposed cap, and the Arsenal already supports the Dock-technology bonus.",
  "Light-cavalry names: the Hussar is renamed Stradiot here, while the Castilians keep the generic Hussar. One policy for regional names across civs (see the Castilians)?",
]

[profile]
entity = "The city-states and maritime republics of northern and central Italy (Venice, Genoa, Pisa, Milan, Florence)"
region = "Northern and central Italy, with the Venetian and Genoese colonies of the eastern Mediterranean and the Black Sea"
window = "1000–1494"
sources = [
  "Giovanni Villani, Nuova Cronica (14th century)",
  "Robert S. Lopez, The Commercial Revolution of the Middle Ages, 950–1350 (1971)",
  "Frederic C. Lane, Venice: A Maritime Republic (1973)",
  "Steven A. Epstein, Genoa and the Genoese, 958–1528 (1996)",
  "Philip Jones, The Italian City-State: From Commune to Signoria (1997)",
  "Chris Wickham, Sleepwalking into a New World: The Emergence of Italian City Communes in the Twelfth Century (2015)",
  "Michael Mallett, Mercenaries and Their Masters: Warfare in Renaissance Italy (1974)",
  "William Caferro, John Hawkwood: An English Mercenary in Fourteenth-Century Italy (2006)",
  "Raymond de Roover, The Rise and Decline of the Medici Bank, 1397–1494 (1963)",
  "Abraham L. Udovitch, 'At the Origins of the Western Commenda: Islam, Israel, Byzantium?', Speculum 37 (1962)",
  "John H. Pryor, 'The Origins of the Commenda Contract', Speculum 52 (1977)",
  "Andrew Ayton and Philip Preston, The Battle of Crécy, 1346 (2005)",
  "N. C. J. Pappas, 'Stradioti: Balkan Mercenaries in Fifteenth and Sixteenth Century Italy'",
]
replaces = "A pan-Italian civ stretched into the Italian Wars (1494–1559), with an anti-gunpowder Condottiero"

[[bonus]]
text = "Advancing to the next Age costs -15%"
kind = "economic"
level = 1
change = "kept"
precedent = "Advancing to the next Age costs -15% (Italians)"
basis = "An abstraction of the precocious urban, commercial and communal society of 11th–15th-century northern Italy (Lopez, 1971; Jones, 1997): there is no specific mechanism behind it, but the trait is real."
relevance = "Northern and central Italy was the most urbanised and commercialised region of Latin Europe from the 12th century; that precocity is the civ's defining trait, abstracted as a whole."

[[bonus]]
text = "Foot Archers +1 melee/+1 pierce armor"
kind = "military"
level = 1
change = "changed"
replaces = "Foot Archers and Condottieri +1 melee/+1 pierce armor"
precedent = "Foot Archers and Condottieri +1 melee/+1 pierce armor (Italians), without the Condottieri"
basis = "The pavise, the crossbowman's large shield (its name probably from Pavia), carried by pavesari who covered the crossbowmen, and the armour industry of Milan (the Missaglia workshops in the 15th century) (Mallett, 1974). The Condottieri leave the target with the unit."
relevance = "The crossbowman behind his pavise was the standard Italian missile soldier and Milanese armour the best in Europe; together they define Italian foot troops."
contested = "At Crécy (1346) the Genoese reportedly fought without their pavises, left with the baggage."

[[bonus]]
text = "Dock and University technologies cost -25%"
kind = "economic"
level = 1
change = "kept"
precedent = "Dock and University technologies cost -25% (Italians)"
basis = "The Arsenal of Venice, traditionally founded in 1104 and enlarged as the Arsenale Nuovo in the early 14th century and the Novissimo from 1473, built and kept galleys in series (Lane, 1973); northern and central Italy had some of Europe's oldest universities, Bologna (conventionally 1088), Padua (1222), Siena (1240), Perugia (1308), the Florentine Studium (1321, chartered 1349) and Pavia (1361), and a strong tradition of engineering."
relevance = "Venice's Arsenal and the Italian universities are among the best-known institutions of medieval Italy and sustained its naval and intellectual primacy."
contested = "No document fixes the Arsenal's foundation in 1104; the date is a tradition."

[[bonus]]
text = "Gunpowder Units cost -20%"
kind = "military"
level = 1
change = "kept"
precedent = "Gunpowder Units cost -20% (Italians)"
basis = "A Florentine document of 11 February 1326 is, with Walter de Milemete's English manuscript of the same year, one of the two earliest European records of metal cannon; Brescia and Milan were great arms centres, and Italian founders were among the best."
relevance = "The Italian cities adopted firearms among the first in Europe and made them in great numbers; a real trait of moderate weight, kept from the game."
contested = "In the 15th century Burgundy, France and Germany were at least as advanced in artillery; Charles VIII's guns impressed the Italians in 1494."

[[bonus]]
text = "Market technologies free"
kind = "economic"
level = 1
change = "new"
replaces = "Fishing Ships cost -15% (dropped for relevance, RULES 6.9: the maritime republics were merchant and naval powers, not great fishing powers, so fishing did not shape their identity)"
precedent = "Mill technologies free (Franks); Lumber Camp technologies free (Burmese); Mining Camp technologies free (Bohemians)"
basis = "Italy's commercial revolution: the bill of exchange; double-entry book-keeping, in use by c. 1300 (the Farolfi company ledger of 1299–1300; the accounts of the Genoese commune's massari from 1340) and codified in print by Pacioli (1494); the gold florin (1252) and ducat (1284); merchant and banking guilds such as Florence's Calimala and Arte del Cambio; and the great companies of the Bardi, Peruzzi and Medici (Lopez, 1971; de Roover, 1963)."
relevance = "Banking and commercial techniques are the most influential Italian innovation of the period: Italian banks financed popes and kings across Europe."

[team_bonus]
text = "Genoese Crossbowman available at the Archery Range in Imperial Age"
level = 1
change = "changed"
replaces = "Condottiero available at the Barracks in Imperial Age"
precedent = "Condottiero available at the Barracks in Imperial Age (Italians team bonus); Genitour available at the Archery Range starting in Castle Age (Berbers team bonus)"
basis = "Genoese crossbowmen were the most sought-after mercenary marksmen of Europe: several thousand formed the French vanguard at Crécy (1346) under Ottone Doria and Carlo Grimaldi (Ayton and Preston, 2005; Sumption, Trial by Battle, 1990), others served Castile, Byzantium and the Italian states, and Giovanni Giustiniani Longo brought some 700 well-armed men from Genoa and Chios to the defence of Constantinople in 1453 (Epstein, 1996). Hiring them benefited Genoa's employers, as RULES 6.2 requires; the Condottiero it replaces had no basis as a unit type. The Portuguese Besteiro do Conto uses the same model (see the open question)."
relevance = "Genoese crossbowmen were Italy's most famous military export; their service abroad is a benefit to allies by definition."
contested = "Their numbers at Crécy vary widely in the sources (c. 2,000–6,000)."

[[unique_unit]]
name = "Genoese Crossbowman"
model = "Genoese Crossbowman"
building = "Castle"
level = 1
change = "kept"
basis = "Genoese crossbowmen served France (Crécy, 1346), Castile, Byzantium and the Italian states, and formed the core of Genoa's own forces (Epstein, 1996). Behind their pavises they stood up well to cavalry, so 'strong vs. cavalry' is an abstraction. The model is shared with the Portuguese Besteiro do Conto."
relevance = "The Genoese crossbowman is the best-known Italian soldier of the Middle Ages."

[[unique_tech]]
name = "Commenda"
building = "Market"
kind = "civil"
age = "Castle"
effect = "Trade Units cost -50%"
level = 1
change = "changed"
replaces = "Silk Road"
precedent = "Silk Road (Italians): identical effect, moved from the Castle to the Market (trade, RULES 6.2) and renamed"
basis = "The commenda (colleganza in Venice), in which a sedentary investor financed a travelling merchant's voyage for a share of the profit, appears in series in the cartulary of the Genoese notary Giovanni Scriba (1154–1164) and financed Italian long-distance trade from Caffa and Tana to Alexandria and Acre (Lopez, 1971; Epstein, 1996). 'Silk Road' is a term coined by Richthofen in 1877, and Italian trade with Asia went mostly through the Levant and the Black Sea."
relevance = "The commenda was the contract that financed the maritime trade of the Italian republics and spread commercial partnership across the Mediterranean; a defining institution of the commercial revolution."
contested = "Its origins are debated: Islamic qirad and Byzantine or Jewish antecedents (Udovitch, 1962) against an Italian development (Pryor, 1977); the contract was used across the Latin Mediterranean (Marseille, Barcelona), but the Italian notarial records are the earliest and densest."

[[unique_tech]]
name = "Comune"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Town Centers fire arrows without garrison"
level = 1
change = "new"
precedent = "Tigui (Malians): identical effect, shared and renamed (an existing unique tech, RULES 6.5)"
basis = "From the late 11th century the cities of the Regnum Italiae became communes: sworn associations of citizens led by elected consuls (attested from the 1080s–1130s at Pisa, Genoa, Milan and elsewhere) and, from the late 12th century, by a foreign podestà, which governed, taxed, legislated and defended themselves. Citizens owed watch on the walls and service in the militia, and the communes of the Lombard League defeated Frederick Barbarossa at Legnano (1176) (Wickham, 2015; Jones, 1997). A Town Center that defends itself without sheltering villagers abstracts the city held by its own sworn citizens."
relevance = "The commune is the defining institution of medieval northern and central Italy: without it there are no city-states."
contested = "How the communes arose, by rupture or by continuity with earlier urban institutions (Wickham, 2015)."

[[unique_tech]]
name = "Condotta"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Stables work +40% faster"
level = 1
change = "new"
replaces = "Pirotechnia"
precedent = "Chivalry (Franks): identical effect, shared and renamed (an existing unique tech, RULES 6.5)"
basis = "Italian states hired their armies by contract (condotta): companies of lances (a man-at-arms with a squire and a page) under captains such as John Hawkwood, Francesco Sforza and Bartolomeo Colleoni, whom Venice made captain-general for life in 1455; by the 15th century Venice and Milan kept many companies on long contracts, quasi-permanent forces in the best plate of Europe that could take the field as soon as a campaign was decided (Mallett, 1974; Caferro, 2006). Faster Stables abstract that readiness. Pirotechnia, which it replaces, is Biringuccio's treatise of 1540 on metallurgy and cannon-founding, outside the window and unrelated to hand cannoneers."
relevance = "The condotta organised Italian warfare for two centuries, and the condottieri are among the most famous figures of Renaissance Italy."

[tree]
add = ["Halberdier", "Siege Engineers"]
remove = []

[tree.basis]
"Halberdier" = "Communal infantry with polearms was decisive in medieval Italy: the Milanese foot held around the carroccio against Barbarossa's knights at Legnano (1176), and Italian polearms (roncone, partisan) were widespread; 43 of 56 civs have it, but not the Italians."
"Siege Engineers" = "Italy's military engineering (Taccola, Francesco di Giorgio Martini) was exported across Europe: the Bolognese Aristotele Fioravanti built the Dormition Cathedral in Moscow and served Ivan III as master of artillery after 1475. Its absence contradicted the civ's own University bonus."

[[rename]]
from = "Hussar"
to = "Stradiot"
level = 1
basis = "The stradioti, Albanian and Greek light horsemen in Venetian service in the Morea (Nauplia, Modon, Coron), were brought into Italy in the 1470s against the Ottoman raids into Friuli; they harried the French at Fornovo (1495, just after the window) and were then hired across Europe (Pappas). 'Hussar' is a 15th-century Hungarian name; the function, light raiding cavalry, is identical."

[architecture]
set = "Mediterranean"
level = 1
change = "kept"
basis = "Italian Romanesque and Gothic communal architecture (towers, loggias, brick and marble) is the core of the Mediterranean set."

[[dropped]]
item = "Condottiero"
kind = "unique_unit"
reason = "The condottiero was the captain who signed the contract, not a soldier type; the companies of the 14th–15th centuries were mainly heavy cavalry, and the fast anti-gunpowder infantry role has no basis (only the 16th-century Bande Nere come close, and they were themselves arquebusiers) (Mallett, 1974). The condottieri are now the Condotta tech and the mercenary team bonus; one unique unit (the Genoese Crossbowman) remains."
