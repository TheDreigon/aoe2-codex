civ = "Italians"
name = "Italians"
status = "draft"
label = "Archer and Naval civilization"
summary = "Italians as the communes and maritime republics (1000–1494): the Genoese Crossbowman stays and becomes the team's mercenary, the Condottiero gives way to the Condotta, Silk Road becomes the Commenda, the commune takes the Town Center, the Arsenal of Venice comes to the Dock, banking replaces fishing, the Hussar becomes the Stradiot, and the Mounted Crossbowman leaves the tree."
ideas = [
  "N2: A heavy-cavalry unit for the lance of the condotte (a man-at-arms in Milanese plate, paid almost only in gold and trainable by allies), on an existing unit's art with adapted stats (RULES section 5); a model of its own would be N3. The analysis proposes it for the Condottiero.",
  "N2: Carroccio: a slow, non-combat wagon giving armour to nearby infantry with the Centurion's aura mechanism, for the Milanese carroccio at Legnano (1176) and Cortenuova (1237).",
  "N3: Venice, Genoa, Milan and Florence as variants of one Italian civ.",
]
contested = [
  "Effectiveness and loyalty of the condottieri: Machiavelli's picture of disloyal, bloodless mercenary war against the revision of Mallett, Caferro and Covini; 'bloodless battles' such as Anghiari (1440) and Molinella (1467).",
  "The 'Renaissance' as a break (Burckhardt, 1860) or a continuation of the Middle Ages (Haskins, 1927); the origins of the communes (Wickham, 2015).",
  "Bologna's founding date of 1088 is conventional, fixed in the 19th century for the 1888 celebration.",
  "Earliest European cannon: Florence and the Milemete manuscript (both 1326) against earlier, contested references.",
  "Why the Genoese failed at Crécy: missing pavises, wet strings or the French order of battle.",
  "Where guns first went to sea: Lombardo (2021) reads the fighting in the lagoon of Chioggia (1379–1380) as the first massive use of shipborne artillery, in the Mediterranean rather than in the northern seas, against part of the historiography; guns aboard single ships are reported earlier in the north (the English cog Christopher, 1338).",
]
open_questions = []

[profile]
