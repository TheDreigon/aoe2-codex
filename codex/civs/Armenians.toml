civ = "Armenians"
name = "Armenians"
status = "draft"
label = "Cavalry and Archer civilization"
summary = "Refocused on Greater Armenia (Bagratid Ani, Vaspurakan, 884–1045): the Cilician navy, the infantry bonuses, the Warrior Priest, Fereters and the Byzantine Dromon and Siphons go; the nakharar noble cavalry (lance and bow) gets a gold discount, Paladin, Plate Barding, the horse-archer line and the Sparapet tech (Hauberk's effect, Imperial Age), Bagratid Ani becomes the Town Center tech, stone architecture replaces the Mule Cart tech boost, the archer UU takes its Armenian name (Agheghnavor) and a Catapult Galleon stands in as the siege warship."
ideas = [
  "N2: Replace the Warrior Priest with a priest support unit modelled on the yerets Ghevond at Avarayr (451), who exhorted the army: an aura that strengthens nearby troops, with no melee role (Yeghishe).",
  "N2: A noble cavalry unit that switches between lance and bow, like the Ratha, for the azat horsemen of the Parthian-Sasanian tradition.",
  "N3: Cilician Armenia (c. 1080–1375) as a separate civ or variant: Latin-style knights and military orders, crossbows, the castles studied by R. W. Edwards and the port of Ayas.",
  "N3: A Caucasian architecture set shared with the Georgians, and separate Armenian and Georgian church buildings instead of one shared Fortified Church (the churches split c. 607–609).",
  "N3: Caravan-city trade (Dvin, Ani, Artsn) as a market or caravan building of its own.",
]
contested = [
  "Date of the conversion of Armenia: 301 by tradition, c. 314 for most scholars; the claim to be the first Christian state is itself a national tradition (Edessa/Osroene has an older legendary claim).",
  "Date and figures of the Military List (Zoranamak): an Arsacid-period list (4th century) or a later compilation, and how literally its cavalry numbers can be read (Adontz; Toumanoff).",
  "The composition of 9th–11th-century Bagratid and Artsruni armies is largely extrapolated from Arsacid and Sasanian-era sources (Buzandaran, Zoranamak); in-window sources give musters and battles, rarely equipment. This applies above all to horse armour (Plate Barding), the horse-archer line and Parthian Tactics.",
  "Date of Movses Khorenatsi: the 5th century he claims, or the 8th–9th century (R. W. Thomson and others).",
  "Ashot I's coronation: 884 or 885, with a crown sent by Caliph al-Muʿtamid and a second one from Basil I.",
  "Whether Mesrop Mashtots also created the Georgian and Caucasian Albanian alphabets (Koryun's claim, rejected by Georgian scholarship).",
  "Armenian origin of several Byzantine emperors (Heraclius, Basil I).",
  "The degree of Armenian autonomy under the Abbasids and the role of the Bagratids in it.",
  "The size of Bagratid Ani (estimates of its population vary widely) and the exact dates of the catholicosal moves from Aghtamar to Argina (mid-10th century) and from Argina into Ani (usually 992).",
]
open_questions = [
  "Mule Cart (owner's question): this draft keeps the status quo, the Mule Cart replacing the Lumber and Mining Camps for Armenians and Georgians, with Mule Carts -25% as a generic abstraction of highland haulage. Pack mules were universal (the Byzantine file refuses the Mule Cart for that reason), and other regions' drafts now give it alongside the camps to the Castilians, Portuguese, Ethiopians and Tatars. “Mule Cart technology effects +40%” is dropped for relevance (it has no historical content), and that costs the camp-less economy noticeably: the gathering technologies researched at the Mule Cart lose their 40% boost (Double-Bit Axe and Bow Saw give +20% each instead of +28%), so at full upgrades wood, gold and stone are gathered roughly a tenth more slowly than now, and the civ still lacks Two-Man Saw and Crop Rotation. An N1 compensation, if wanted: restore Crop Rotation (the nakharar houses lived from grain estates on the Ararat plain and in Shirak) or Two-Man Saw. Should the Mule Cart stand alongside the camps instead, and should the economy get a compensation?",
  "Window: 884–1045, as the owner decided (Bagratid Ani). The sack of Artsn (1048–1049) and the Seljuk capture of Ani (1064) are treated as epilogue. Agree, or extend to 1064–1065, when the Bagratid kingdom of Kars was also ceded? (The Kiurikid kingdom of Lori and the kingdom of Syunik survived into the 12th century.)",
  "Power budget of the noble cavalry: Paladin, Plate Barding Armor, -15% gold and Sparapet (Hauberk's effect, in the Imperial Age like Hauberk) make a strong Knight-line. As offsets, Thumb Ring is not added (it would greatly strengthen the armour-ignoring archer UU) and the Hussar stays out (light cavalry is covered by the Light Cavalry and the horse-archer line). Historically, Plate Barding is the weakest of the three cavalry items: no 884–1045 source describes Armenian horse armour, which is extrapolated from the Arsacid–Sasanian tradition, while Paladin (the top of a noble heavy cavalry) and the discount (self-equipped nobles) rest on in-window musters. Sparapet's effect also reappears in the Burgundians' level-2 Order of the Golden Fleece, and the Sicilian design drops Hauberk, which leaves the Armenians as its only level-1 holder. Accept, or drop Plate Barding (or another item) for power?",
  "Trdat the Architect (first-draft Imperial tech) is dropped for relevance: one architect is a detail, while Armenian stone architecture is a structural trait, now a passive (Masonry, Architecture free) with Trdat in its basis. Restore Trdat as a University tech instead?",
  "Unique unit: the Agheghnavor (Composite Bowman renamed, Classical ałełnawor) is kept as a borderline case on identity weight alone (the archer of the Hayk founding myth); no 884–1045 source singles out Armenian archers, and the owner's chosen core, the noble cavalry, has no unique unit. N1 alternative: an existing heavy-cavalry unique unit shared and renamed for the azat cavalry (for example the Cataphract, which the Koreans' Gaema Musa already shares); N2 alternative: a mounted noble archer that switches between lance and bow (see the ideas). Keep the Agheghnavor, or switch?",
  "The Warrior Priest is dropped (no documented Armenian troop of fighting priests), so the civ has one unique unit. Keep it as an abstraction of the clergy at Avarayr instead?",
  "Cilicia leaves the core (owner's decision). Should Cilician Armenia later become its own civ or variant (N3), taking crossbows, Latin knights and the port of Ayas with it?",
  "The Arbalester is withheld: both crossbow tiers are generic abstractions here, there is no evidence of crossbows in Greater Armenia before 1045, and the Agheghnavor fills the elite foot-archer role. Acceptable?",
  "Repeated bonuses (RULES 6.7): the team bonus “Trade Units generate +10% gold” is now shared by five drafts (Armenians, Ethiopians, Maya, Rus' and Tamils), and “Masonry, Architecture free” is also the Goths' bonus. Should one civ keep the trade team bonus exclusively, or should the Armenians take a relic or monastery team bonus instead?",
  "Siege warship: a non-gunpowder Catapult Galleon replaces the Dromon (RULES 6.11), with the same policy and wording as for the Bulgarians and Georgians, although Greater Armenia had no navy; without it, coastal buildings would fall only to Demolition Ships and landed siege. Keep it, or leave the civ without a siege warship?",
]

[profile]
entity = "Greater Armenia: the Bagratid kingdom of Ani, the Artsruni kingdom of Vaspurakan and the nakharar principalities"
region = "Armenian Highlands: Shirak and Ani, Vaspurakan around Lake Van, Taron, Syunik"
window = "884–1045 (Bagratid Ani; roots in the Arsacid and nakharar centuries, 4th–9th; epilogue to the fall of Ani in 1064)"
sources = [
  "Movses Khorenatsi, History of the Armenians (tr. R. W. Thomson, 1978)",
  "Buzandaran Patmutʻiwnkʻ (The Epic Histories), tr. and commentary N. Garsoïan (1989)",
  "Yeghishe, History of Vardan and the Armenian War; Ghazar Parpetsi",
  "Hovhannes Draskhanakerttsi, History of Armenia (10th century; tr. K. H. Maksoudian, 1987)",
  "Tovma Artsruni, History of the House of the Artsrunik (10th century; tr. R. W. Thomson, 1985)",
  "Stepanos Taronetsi (Asoghik), Universal History (c. 1004; tr. T. Greenwood, The Universal History of Stepʻanos Tarōnecʻi, 2017)",
  "Aristakes Lastivertsi, History (11th century; tr. R. Bedrosian, 1985)",
  "Matthew of Edessa, Chronicle (12th century; tr. A. E. Dostourian, 1993)",
  "N. Adontz, Armenia in the Period of Justinian (1908; tr. N. Garsoïan, 1970)",
  "N. Garsoïan, Armenia between Byzantium and the Sasanians (1985)",
  "C. Toumanoff, Studies in Christian Caucasian History (1963)",
  "R. Hovannisian (ed.), The Armenian People from Ancient to Modern Times (1997)",
  "R. H. Hewsen, Armenia: A Historical Atlas (2001)",
  "H. Manandian, The Trade and Cities of Armenia in Relation to Ancient World Trade (tr. N. Garsoïan, 1965)",
  "J.-M. Thierry and P. Donabédian, Armenian Art (1989)",
]
replaces = "Armenians of Greater Armenia and of the Armenian Kingdom of Cilicia (c. 451–1375)"

[[bonus]]
text = "Mule Carts cost -25%"
kind = "economic"
level = 1
change = "kept"
precedent = "Mule Carts cost -25% (Armenians)"
basis = "Pack mules and horses carried timber, stone and ore along the mountain tracks of a plateau whose roads climb above 2,000 m; the Mule Cart's mobile drop site abstracts this highland haulage. It is a generic abstraction, kept under the owner's decision on the Caucasian Mule Cart; the caravan trade belongs to the team bonus."
relevance = "A borderline pass: pack transport shaped economic life on the Armenian plateau, but pack animals were universal (see the open question); it stays as the economic side of the owner's Mule Cart decision."

[[bonus]]
text = "Masonry, Architecture free"
kind = "other"
level = 1
change = "new"
replaces = "Mule Cart technology effects +40% (dropped for relevance: a mechanical companion of the Mule Cart with no historical content)"
precedent = "Town Watch, Town Patrol free (Byzantines); Caravan, Guilds free (Muisca)"
basis = "Armenia was one of the great building cultures of the medieval East, in dressed tuff and mortared rubble: Zvartnots (643–652), Gagik Artsruni's church of the Holy Cross on Aghtamar (915–921), the monasteries of Sanahin (966) and Haghpat (976), and Ani, whose cathedral (989–1001) was built by the architect Trdat, who according to Stepanos Taronetsi also drew up the plan and model for repairing the dome of Hagia Sophia after the earthquake of 989 (completed 994) (Hovannisian, 1997; Thierry & Donabédian, 1989)."
relevance = "Church building in stone is one of the defining traits of Armenian identity over five centuries, not one feature; it replaces a mechanical bonus and the first draft's tech named after a single architect."

[[bonus]]
text = "First Fortified Church receives a free Relic"
kind = "other"
level = 1
change = "kept"
precedent = "First Fortified Church receives a free Relic (Armenians)"
basis = "Armenia's Christian identity, traditionally the oldest of any state (Trdat III and Gregory the Illuminator), had a strong cult of relics inside the window: the Holy Sign of Varag in Vaspurakan, a relic of the True Cross venerated since the 7th century (tradition dates its finding to 653), kept in a monastery that the Artsruni kings rebuilt and endowed; devotion to the Cross also shows in Gagik Artsruni's church of the Holy Cross on Aghtamar (915–921). The Holy Lance kept at Geghard is attested only later (13th century)."
relevance = "The Church was the institution that kept Armenian identity alive through Persian, Arab and Byzantine rule; relics were a prominent part of its devotion."
contested = "The conversion is dated 301 by tradition and c. 314 by most scholars; the dating of the Varag tradition rests on later Armenian sources."

[[bonus]]
text = "Knight-line and Cavalry Archers cost -15% gold"
kind = "military"
level = 1
change = "new"
replaces = "Spearman- and Militia-line upgrades (except Man-at-Arms) available one age earlier"
precedent = "Szlachta Privileges: Knight-line costs -60% gold (Poles); All units cost -20% gold (Portuguese)"
basis = "The army of Greater Armenia was the sum of the contingents of the nakharar houses, whose noble horsemen (azatkʻ) armed and kept themselves from their own domains; the Military List (Zoranamak) records the cavalry each house owed the crown (Adontz, 1908/1970; Toumanoff, 1963), and the older sources count Armenian armies in horsemen who fought with lance and bow (Buzandaran). The system continued under the Bagratids, though the houses often fought one another: in 1042 the nakharars of Shirak assembled their contingents under the sparapet Vahram Pahlavuni and beat a Byzantine army before Ani (Matthew of Edessa, whose figures are unreliable), and earlier Ashot II Yerkat had won back his kingdom from Yusuf's Sajid armies with Byzantine help and some of the princes, against others whom Yusuf backed (Draskhanakerttsi). No source singles out Armenian infantry as precocious, as the replaced bonus did."
relevance = "The self-equipped noble cavalry of the nakharar houses was the main arm of Armenian armies for a millennium and the reason Persians and Byzantines recruited Armenians; it is the owner's chosen core of the civ."
contested = "The date and the figures of the Military List are debated, and much of the cavalry evidence predates the window (see the civ-level contested list)."

[team_bonus]
text = "Trade Units generate +10% gold"
level = 1
change = "new"
replaces = "Infantry +2 line of sight"
precedent = "Trade Units generate +25% gold (Spanish team bonus); Trade Units generate +10% food in addition to gold (Bengalis team bonus)"
basis = "Armenian cities were relays of the trade between Byzantium and the Caliphate, towards Iran and Mesopotamia and through Trebizond on the Black Sea: 10th-century Arab geographers (al-Istakhri, Ibn Hawqal, al-Muqaddasi) describe Dabil (Dvin) as a great market, and Armenian woollen textiles and the red dye qirmiz were sought-after exports (Manandian, 1965). Dvin was held by Muslim emirs for most of the window, and Artsn, a rich merchant town near Theodosiopolis sacked by the Seljuks in 1048–1049, lay in Byzantine territory after 949 (Aristakes Lastivertsi), so the trade enriched Muslim and Byzantine neighbours as well as Bagratid Ani. The line-of-sight bonus had no identifiable basis."
relevance = "Caravan trade through Armenia enriched its Byzantine and Muslim partners as well as Ani itself, a benefit to neighbours as RULES 6.2 requires."

[[unique_unit]]
name = "Agheghnavor"
model = "Composite Bowman"
building = "Castle"
level = 1
change = "changed"
replaces = "Composite Bowman"
basis = "Renamed with the Classical Armenian word for archer (ałełnawor, from ałełn, “bow”: Bedrossian's Armenian-English dictionary; modern spelling աղեղնավոր, romanized agheghnavor, since ղ is gh both times). Archery is the oldest image of Armenian warfare: in the founding myth Hayk kills Bel with an arrow (Movses Khorenatsi I.11), and the Arsacid-era sources count the nobles' horsemen as lancers and bowmen (Buzandaran). No source of 884–1045 singles out Armenian foot archers, so the unit is an abstraction resting on that tradition; Armenian troops in the Fatimid army of Badr al-Jamali (from the 1070s) fall after the window. “Composite Bowman” named nothing Armenian, since the composite bow was common to the whole Near East, and it was not adopted in the 11th century as the original history text claims. Ignoring armor remains a game abstraction."
relevance = "The archer is central to Armenian self-image through the founding myth of Hayk, who killed the tyrant Bel with an arrow; a borderline pass on identity weight alone, the weakest of the civ's special slots (see the open question)."
contested = "Most Armenian archers of the period were probably mounted, and no in-window source describes Armenian archers as a distinct troop; a foot archer is an abstraction."

[[unique_tech]]
name = "Bagratid Ani"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Town Centers +100% HP and work +10% faster"
level = 2
change = "new"
replaces = "Fereters (Infantry (except Spearman-line) +30 HP; Warrior Priests heal +100% faster)"
precedent = "Town Centers and Docks +100% HP and work +5/10/15/20% faster in Dark/Feudal/Castle/Imperial Age (Persians): both effect types, Town Centers only, with the work rate at its Feudal Age value (+10%)"
basis = "Ashot III made Ani the royal seat in 961, was crowned there and walled it; Smbat II (977–989/990) built its outer double walls; the catholicos, resident at nearby Argina since the mid-10th century, moved the see into Ani in 992; and under Gagik I (989/990–1017/1020) the kingdom and its capital reached their height, Ani becoming one of the great cities of the Christian East, until Byzantium annexed it (1045) and the Seljuks took it (1064) (Stepanos Taronetsi; Aristakes Lastivertsi; N. Garsoïan in Hovannisian, 1997; Hewsen, 2001). Fereters is a Latin-English church word (feretory, from feretrum) with no Armenian institution behind it."
relevance = "Ani was the seat and the symbol of Bagratid statehood: its rise marks the restored kingdom, and its loss ended the main Bagratid kingdom."

[[unique_tech]]
name = "Sparapet"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Knight-line +1 melee/+2 pierce armor"
level = 1
change = "new"
replaces = "Cilician Fleet (Demolition Ships +20% blast radius; Galley-line and Dromons +1 range)"
precedent = "Hauberk (Knight-line +1 melee/+2 pierce armor) (Sicilians, whose design drops it): an existing unique tech, moved and renamed, identical effect and the same age"
basis = "The sparapet was the commander-in-chief of the Armenian host, an office hereditary in the Mamikonian house from the 4th to the 8th century and held by the Bagratids in the 9th (Smbat the Confessor, sparapet 826–855); his son Ashot I held it too and rose, with the caliph's title of prince of princes (862), to the crown in 884/885 (Toumanoff, 1963). Within the window, Vahram Pahlavuni, sparapet of Ani, led the nakharars against the Byzantine army in 1042 and had Gagik II crowned (Matthew of Edessa); the Imperial Age placement follows him. The armour effect abstracts the noble host the sparapet commanded. Cilician Fleet belongs to the Cilician kingdom, which leaves the core of the civ and had no significant war fleet."
relevance = "The office of sparapet commanded the noble cavalry for seven centuries and was one of the offices through which the Bagratids rose to kingship, with the caliph's title of prince of princes in 862; a military and royal institution at the Castle."

[tree]
add = ["Paladin", "Plate Barding Armor", "Heavy Cavalry Archer", "Parthian Tactics", "Architecture", "Keep", "Stone Shaft Mining", "Catapult Galleon"]
remove = ["Dromon", "Siphons", "Bombard Tower", "Arbalester"]

[tree.basis]
"Paladin" = "The noble heavy cavalry was the main arm of Armenian armies, recruited as such by the Sasanians and the Byzantines (Garsoïan, 1985; Hovannisian, 1997), and still mustered in 1042 (see the gold discount bonus); denying the top of the Knight-line was the main inversion of the original design."
"Plate Barding Armor" = "Armoured horsemen of the Iranian tradition, as in the Sasanian heavy cavalry with which the Armenian nobility served (Buzandaran, with N. Garsoïan's commentary in The Epic Histories, 1989). No 884–1045 source describes Armenian horse armour: the item is extrapolated from the Arsacid–Sasanian tradition (see the civ-level contested list) and is the weakest of the cavalry additions."
"Heavy Cavalry Archer" = "The azat horsemen fought with lance and bow (Buzandaran); the civ had Cavalry Archer without its upgrade. The equipment is extrapolated into the Bagratid period from the Arsacid–Sasanian sources, since in-window sources give musters and battles, rarely equipment."
"Parthian Tactics" = "The Parthian-Sasanian horse-archery tradition of the Armenian nobility, whose kings were an Arsacid branch until 428 (Garsoïan, 1985); extrapolated into the Bagratid period, like the rest of the cavalry equipment."
"Architecture" = "Needed for the Masonry, Architecture free bonus: Zvartnots (643–652), the church of Aghtamar (915–921) and the cathedral of Ani by Trdat (989–1001) (see that bonus)."
"Keep" = "Mountain fortresses such as Amberd, fortified by Vahram Pahlavuni, who built its church in 1026, and Bjni, and the walled cities of Ani and Kars (Hewsen, 2001)."
"Stone Shaft Mining" = "Building in dressed tuff and the carving of khachkars (cross-stones, the earliest dated example at Garni, 879) made stone working central to Armenian culture (Hovannisian, 1997)."
"Catapult Galleon" = "Substitute for the removed Dromon (RULES 6.11): a generic non-gunpowder siege warship, so that the civ can still attack coastal buildings from the water. Greater Armenia had no war fleet, so it is a playability abstraction, like the Galley-line and Galleon the civ keeps; the same policy as for the Bulgarians and Georgians (see the open question)."
"Dromon" = "A Byzantine ship type; Greater Armenia had no war fleet, and Cilicia, which leaves the core, relied on Genoese, Venetian and Cypriot ships."
"Siphons" = "Named after the Byzantine fire siphon, a state secret that Constantine VII told his son never to give to any other nation (De Administrando Imperio 13); Greater Armenia had no fleet, and the tech was a leftover of the Cilician naval identity. Fire Ships stay as the generic fire ship."
"Bombard Tower" = "No gunpowder before 1045; even Cilicia fell (1375) before gunpowder mattered in the region."
"Arbalester" = "Both crossbow tiers are generic abstractions here: there is no evidence of crossbows in Greater Armenia before 1045, and the hand crossbow was still a Latin novelty to Byzantium in the 1090s (Anna Komnene calls the tzangra a barbarian bow unknown to the Greeks, Alexiad X.8). The Crossbowman stays as the generic archer upgrade; the Arbalester is withheld because the Agheghnavor fills the elite foot-archer role."

[[rename]]
from = "Elite Composite Bowman"
to = "Elite Agheghnavor"
level = 1
basis = "Follows the rename of the unique unit (Composite Bowman → Agheghnavor)."

[architecture]
set = "Mediterranean"
change = "kept"
basis = "Stone architecture is closer to Armenian churches and fortresses than the other existing sets, though Armenian conical domes and tuff walls are not Romanesque; a Caucasian set is N3."

[[dropped]]
item = "Galley-line and Dromons fire an additional projectile"
kind = "bonus"
reason = "Its only basis was the Cilician coast, which leaves the core identity; Greater Armenia was landlocked and the Cilician kingdom never had a significant war fleet."

[[dropped]]
item = "Warrior Priest"
kind = "unique_unit"
reason = "No documented Armenian troop of fighting priests: the clergy at Avarayr (451), such as the priest Ghevond, exhorted the army and were later martyred (Yeghishe), and the military orders in Cilicia were Latin. Replaced in spirit by the N2 support-priest idea."
