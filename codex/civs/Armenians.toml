civ = "Armenians"
name = "Armenians"
status = "draft"
label = "Cavalry and Archer civilization"
summary = "Refocused on Greater Armenia (Bagratid Ani, Vaspurakan, 884–1045): the Cilician navy, the infantry bonuses, the Warrior Priest and Fereters go; the nakharar noble cavalry (lance and bow) gets a gold discount, Paladin, Plate Barding, the horse-archer line and the Sparapet tech (Hauberk's effect, Imperial Age), Bagratid Ani becomes the Town Center tech, stone architecture replaces the Mule Cart tech boost, and the archer UU takes its Armenian name (Agheghnavor)."
ideas = [
  "N2: Replace the Warrior Priest with a priest support unit modelled on the yerets Ghevond at Avarayr (451), who exhorted the army: an aura that strengthens nearby troops, with no melee role (Yeghishe).",
  "N2: A noble cavalry unit that switches between lance and bow, like the Ratha, for the azat horsemen of the Parthian-Sasanian tradition.",
  "N3: Cilician Armenia (c. 1080–1375) as a separate civ or variant: Latin-style knights and military orders, crossbows, the castles studied by R. W. Edwards and the port of Ayas.",
  "N3: A Caucasian architecture set shared with the Georgians, and separate Armenian and Georgian church buildings instead of one shared Fortified Church (the churches split c. 607–609).",
  "N3: Caravan-city trade (Dvin, Ani, Artsn) as a market or caravan building of its own.",
]
contested = [
  "Date of the conversion of Armenia: 301 by tradition, c. 314 for most scholars; the claim to be the first Christian state is itself a national tradition (Edessa/Osroene has an older legendary claim).",
  "Date and figures of the Military List (Zoranamak): an Arsacid-period list (4th century) or a later compilation, and how literally its cavalry numbers can be read (Adontz; Toumanoff).",
  "The composition of 9th–11th-century Bagratid and Artsruni armies is largely extrapolated from Arsacid and Sasanian-era sources (Buzandaran, Zoranamak); in-window sources give musters and battles, rarely equipment.",
  "Date of Movses Khorenatsi: the 5th century he claims, or the 8th–9th century (R. W. Thomson and others).",
  "Ashot I's coronation: 884 or 885, with a crown sent by Caliph al-Muʿtamid and a second one from Basil I.",
  "Whether Mesrop Mashtots also created the Georgian and Caucasian Albanian alphabets (Koryun's claim, rejected by Georgian scholarship).",
  "Armenian origin of several Byzantine emperors (Heraclius, Basil I).",
  "The degree of Armenian autonomy under the Abbasids and the role of the Bagratids in it.",
  "The size of Bagratid Ani (estimates of its population vary widely) and the date when the Catholicosate settled at Argina near Ani (usually 992).",
]
open_questions = [
  "Mule Cart (owner's question): this draft keeps the status quo, the Mule Cart replacing the Lumber and Mining Camps for Armenians and Georgians, with Mule Carts -25%. “Mule Cart technology effects +40%” is dropped because it fails the relevance test (it has no historical content), which makes the camp-less economy a little weaker. Should the Mule Cart instead stand alongside the camps, and should other pack-animal civs get it?",
  "Window: 884–1045, as the owner decided (Bagratid Ani). The sack of Artsn (1048–1049) and the Seljuk capture of Ani (1064) are treated as epilogue. Agree, or extend to 1064, when Kars, the last Bagratid kingdom of the line, was also ceded?",
  "Power budget of the noble cavalry: Paladin, Plate Barding Armor, -15% gold and Sparapet (Hauberk's effect, now in the Imperial Age like Hauberk) make a strong Knight-line. As offsets, Thumb Ring is not added (it would greatly strengthen the armour-ignoring archer UU) and the Hussar stays out (light cavalry is covered by the Light Cavalry and the horse-archer line, and the name is 15th-century Hungarian). Accept, or drop one of Paladin, Plate Barding or the Knight-line half of the discount?",
  "Trdat the Architect (first-draft Imperial tech) is dropped for relevance: one architect is a detail, while Armenian stone architecture is a structural trait, now a passive (Masonry, Architecture free) with Trdat in its basis. Restore Trdat as a University tech instead?",
  "Unique unit: the Agheghnavor (Composite Bowman renamed, corrected romanization of Classical ałełnawor) is kept as a borderline case on weight plus fame; the core of Armenian armies was mounted. Accept, or rebuild the archer on a mounted model in N2?",
  "The Warrior Priest is dropped (no documented Armenian troop of fighting priests), so the civ has one unique unit. Keep it as an abstraction of the clergy at Avarayr instead?",
  "Cilicia leaves the core (owner's decision). Should Cilician Armenia later become its own civ or variant (N3), taking crossbows, Latin knights and the port of Ayas with it?",
  "Arbalester is removed (no evidence of crossbows in Greater Armenia before 1045). Acceptable, given that the archer UU covers the elite archer role?",
  "Team bonus: Armenian caravan trade (+10% gold for Trade Units) replaces the unfounded Infantry line of sight. It is identical to the Tamils' team bonus in the Indian region. Alternatives: a relic or monastery team bonus.",
  "No siege warship: the Dromon is removed (Greater Armenia had no navy) and the Armenians never had the Cannon Galleon, so on water maps coastal buildings fall only to Demolition Ships and landed siege. Acceptable?",
]

[profile]
entity = "Greater Armenia: the Bagratid kingdom of Ani, the Artsruni kingdom of Vaspurakan and the nakharar principalities"
region = "Armenian Highlands: Shirak and Ani, Vaspurakan around Lake Van, Taron, Syunik"
window = "884–1045 (Bagratid Ani; roots in the Arsacid and nakharar centuries, 4th–9th; epilogue to the fall of Ani in 1064)"
sources = [
  "Movses Khorenatsi, History of the Armenians (tr. R. W. Thomson, 1978)",
  "Buzandaran Patmutʻiwnkʻ (The Epic Histories), tr. and commentary N. Garsoïan (1989)",
  "Yeghishe, History of Vardan and the Armenian War; Ghazar Parpetsi",
  "Hovhannes Draskhanakerttsi, History of Armenia (10th century; tr. K. H. Maksoudian, 1987)",
  "Tovma Artsruni, History of the House of the Artsrunik (10th century; tr. R. W. Thomson, 1985)",
  "Stepanos Taronetsi (Asoghik), Universal History (c. 1004)",
  "Aristakes Lastivertsi, History (11th century)",
  "Matthew of Edessa, Chronicle (12th century; tr. A. E. Dostourian, 1993)",
  "N. Adontz, Armenia in the Period of Justinian (1908; tr. N. Garsoïan, 1970)",
  "N. Garsoïan, Armenia between Byzantium and the Sasanians (1985)",
  "C. Toumanoff, Studies in Christian Caucasian History (1963)",
  "R. Hovannisian (ed.), The Armenian People from Ancient to Modern Times (1997)",
  "R. H. Hewsen, Armenia: A Historical Atlas (2001)",
  "H. Manandian, The Trade and Cities of Armenia in Relation to Ancient World Trade (tr. N. Garsoïan, 1965)",
]
replaces = "Armenians of Greater Armenia and of the Armenian Kingdom of Cilicia (c. 451–1375)"

[[bonus]]
text = "Mule Carts cost -25%"
kind = "economic"
level = 1
change = "kept"
precedent = "Mule Carts cost -25% (Armenians)"
basis = "Pack mules and horses moved goods across a plateau whose roads climb above 2,000 m; the caravan cities of Dvin, Ani and Artsn lived on pack-animal traffic between Byzantium and the Caliphate, to Iran and Mesopotamia, via Trebizond on the Black Sea (Manandian, 1965). An abstraction, kept as part of the Caucasian mobile-dropsite economy."
relevance = "The caravan traffic across the plateau made Dvin and Ani rich and is what the Bagratid economy rested on; a borderline pass, since pack animals themselves were universal."

[[bonus]]
text = "Masonry, Architecture free"
kind = "other"
level = 1
change = "new"
replaces = "Mule Cart technology effects +40% (dropped for relevance: a mechanical companion of the Mule Cart with no historical content)"
precedent = "Town Watch, Town Patrol free (Byzantines); Caravan, Guilds free (Muisca)"
basis = "Armenia was one of the great building cultures of the medieval East, in dressed tuff and mortared rubble: Zvartnots (643–652), Gagik Artsruni's church of the Holy Cross on Aghtamar (915–921), the monasteries of Sanahin (966) and Haghpat (976), and Ani, whose cathedral (989–1001) was built by the architect Trdat, who according to Stepanos Taronetsi also drew up the plan and model for repairing the dome of Hagia Sophia after the earthquake of 989 (completed 994) (Hovannisian, 1997)."
relevance = "Church building in stone is one of the defining traits of Armenian identity over five centuries, not one feature; it replaces a mechanical bonus and the first draft's tech named after a single architect."

[[bonus]]
text = "First Fortified Church receives a free Relic"
kind = "other"
level = 1
change = "kept"
precedent = "First Fortified Church receives a free Relic (Armenians)"
basis = "Armenia's Christian identity, traditionally the oldest of any state (Trdat III and Gregory the Illuminator), had a strong cult of relics inside the window: the Holy Sign of Varag in Vaspurakan, a relic of the True Cross venerated since the 7th century (tradition dates its finding to 653; the Artsruni rebuilt the monastery in 981), and Gagik Artsruni's church of the Holy Cross on Aghtamar (915–921), besides the relics of Etchmiadzin. The Holy Lance kept at Geghard is attested only later (13th century)."
relevance = "The Church was the institution that kept Armenian identity alive through Persian, Arab and Byzantine rule; relics were at its centre."
contested = "The conversion is dated 301 by tradition and c. 314 by most scholars; the dating of the Varag tradition rests on later Armenian sources."

[[bonus]]
text = "Knight-line and Cavalry Archers cost -15% gold"
kind = "military"
level = 1
change = "new"
replaces = "Spearman- and Militia-line upgrades (except Man-at-Arms) available one age earlier"
precedent = "Szlachta Privileges: Knight-line costs -60% gold (Poles); All units cost -20% gold (Portuguese)"
basis = "The army of Greater Armenia was the sum of the contingents of the nakharar houses, whose noble horsemen (azatkʻ) armed and kept themselves from their own domains; the Military List (Zoranamak) records the cavalry each house owed the crown (Adontz, 1908/1970; Toumanoff, 1963), and the older sources count Armenian armies in horsemen who fought with lance and bow (Buzandaran). The system continued under the Bagratids: Ashot II Yerkat fought Yusuf's Sajid armies with the princes' forces (Draskhanakerttsi), and in 1042 the nakharars of Shirak assembled their contingents under the sparapet Vahram Pahlavuni and beat a Byzantine army before Ani (Matthew of Edessa, whose figures are unreliable). No source singles out Armenian infantry as precocious, as the replaced bonus did."
relevance = "The self-equipped noble cavalry of the nakharar houses was the main arm of Armenian armies for a millennium and the reason Persians and Byzantines recruited Armenians; it is the owner's chosen core of the civ."
contested = "The date and the figures of the Military List are debated, and much of the cavalry evidence predates the window (see the civ-level contested list)."

[team_bonus]
text = "Trade Units generate +10% gold"
level = 1
change = "new"
replaces = "Infantry +2 line of sight"
precedent = "Trade Units generate +25% gold (Spanish team bonus); Trade Units generate +10% food in addition to gold (Bengalis team bonus)"
basis = "Armenian cities were relays of the trade between Byzantium and the Caliphate, towards Iran and Mesopotamia, through Trebizond on the Black Sea: Dvin (Arab Dabil), Ani under the Bagratids and Artsn, a rich merchant town near Theodosiopolis sacked by the Seljuks in 1048–1049 (Aristakes Lastivertsi; Manandian, 1965). The line-of-sight bonus had no identifiable basis."
relevance = "Caravan trade through Armenia enriched its Byzantine and Muslim partners as well as Ani itself, a benefit to neighbours as RULES 6.2 requires."

[[unique_unit]]
name = "Agheghnavor"
model = "Composite Bowman"
building = "Castle"
level = 1
change = "changed"
replaces = "Composite Bowman"
basis = "Renamed with the Classical Armenian word for archer (ałełnawor, from ałełn, “bow”: Bedrossian's Armenian-English dictionary; modern spelling աղեղնավոր, romanized agheghnavor, since ղ is gh both times). Armenian archery is ancient: in the founding myth Hayk kills Bel with an arrow (Movses Khorenatsi I.11), and Armenian soldiers served in the armies of the Byzantine Armenian themes (10th–11th centuries) and, from the 1070s, in the Fatimid army of Badr al-Jamali. “Composite Bowman” named nothing Armenian, since the composite bow was common to the whole Near East, and it was not adopted in the 11th century as the original history text claims. Ignoring armor remains a game abstraction."
relevance = "Archery is the oldest and most persistent image of Armenian warfare, from Hayk to the archers of the nakharar hosts, and the unit is the civ's best-known element; a borderline case that passes on weight plus fame."
contested = "Most Armenian archers of the period were probably mounted; a foot archer is an abstraction."

[[unique_tech]]
name = "Bagratid Ani"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Town Centers +100% HP and work +10% faster"
level = 2
change = "new"
replaces = "Fereters (Infantry (except Spearman-line) +30 HP; Warrior Priests heal +100% faster)"
precedent = "Town Centers and Docks +100% HP and work +5/10/15/20% faster in Dark/Feudal/Castle/Imperial Age (Persians): both effect types, Town Centers only, Castle Age magnitude"
basis = "Ashot III moved the royal seat to Ani in 961 and walled it; Smbat II (977–989) built its outer double walls and had himself crowned there; the Catholicosate settled at Argina beside it (992), and under Gagik I (989–1020) Ani became the capital of the Bagratid state and one of the great cities of the Christian East, until Byzantium annexed it (1045) and the Seljuks took it (1064) (Stepanos Taronetsi; Aristakes Lastivertsi; Hewsen, 2001). Fereters is a Latin-English church word (feretory, from feretrum) with no Armenian institution behind it."
relevance = "Ani was the seat and the symbol of Bagratid statehood: its rise marks the restored kingdom and its loss ended Armenian statehood in Greater Armenia."

[[unique_tech]]
name = "Sparapet"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Knight-line +1 melee/+2 pierce armor"
level = 1
change = "new"
replaces = "Cilician Fleet (Demolition Ships +20% blast radius; Galley-line and Dromons +1 range)"
precedent = "Hauberk (Knight-line +1 melee/+2 pierce armor) (Sicilians): an existing unique tech, shared and renamed, identical effect and the same age"
basis = "The sparapet was the commander-in-chief of the Armenian host, an office hereditary in the Mamikonian house from the 4th to the 8th century and held by the Bagratids in the 9th (Smbat the Confessor, sparapet 826–855), from which they rose to kingship in 884/885 (Toumanoff, 1963). Within the window, Vahram Pahlavuni, sparapet of Ani, led the nakharars against the Byzantine army in 1042 and had Gagik II crowned (Matthew of Edessa). The tech stands for the armoured noble cavalry he led. Cilician Fleet belongs to the Cilician kingdom, which leaves the core of the civ and had no significant war fleet."
relevance = "The office of sparapet commanded the noble cavalry for seven centuries and carried the Bagratids to the throne; a military and royal institution at the Castle."

[tree]
add = ["Paladin", "Plate Barding Armor", "Heavy Cavalry Archer", "Parthian Tactics", "Architecture", "Keep", "Stone Shaft Mining"]
remove = ["Dromon", "Bombard Tower", "Arbalester"]

[tree.basis]
"Paladin" = "The noble heavy cavalry was the main arm of Armenian armies, recruited as such by the Sasanians and the Byzantines (Garsoïan, 1985; Hovannisian, 1997); denying the top of the Knight-line was the main inversion of the original design."
"Plate Barding Armor" = "Armoured horsemen of the Iranian tradition, as in the Sasanian heavy cavalry with which the Armenian nobility served (Buzandaran, with N. Garsoïan's commentary in The Epic Histories, 1989)."
"Heavy Cavalry Archer" = "The azat horsemen fought with lance and bow (Buzandaran); the civ had Cavalry Archer without its upgrade."
"Parthian Tactics" = "The Parthian-Sasanian horse-archery tradition of the Armenian nobility, whose kings were an Arsacid branch until 428 (Garsoïan, 1985)."
"Architecture" = "Needed for the Masonry, Architecture free bonus: Zvartnots (643–652), the church of Aghtamar (915–921) and the cathedral of Ani by Trdat (989–1001) (see that bonus)."
"Keep" = "Mountain fortresses such as Amberd, fortified by Vahram Pahlavuni, who built its church in 1026, and Bjni, and the walled cities of Ani and Kars (Hewsen, 2001)."
"Stone Shaft Mining" = "Building in dressed tuff and the carving of khachkars (cross-stones, the earliest dated example at Garni, 879) made stone working central to Armenian culture (Hovannisian, 1997)."
"Dromon" = "A Byzantine ship type; Greater Armenia had no war fleet, and Cilicia, which leaves the core, relied on Genoese, Venetian and Cypriot ships."
"Bombard Tower" = "No gunpowder before 1045; even Cilicia fell (1375) before gunpowder mattered in the region."
"Arbalester" = "No evidence of crossbows in Greater Armenia before 1045; crossbows appear in the Armenian world with Cilicia's Latin contacts, outside the core, and Anna Komnene still calls the tzangra a barbarian bow unknown to the Greeks in 1097 (Alexiad X.8). Crossbowman stays as the generic archer upgrade."

[[rename]]
from = "Elite Composite Bowman"
to = "Elite Agheghnavor"
level = 1
basis = "Follows the rename of the unique unit (Composite Bowman → Agheghnavor)."

[architecture]
set = "Mediterranean"
change = "kept"
basis = "Stone architecture is closer to Armenian churches and fortresses than the other existing sets, though Armenian conical domes and tuff walls are not Romanesque; a Caucasian set is N3."

[[dropped]]
item = "Galley-line and Dromons fire an additional projectile"
kind = "bonus"
reason = "Its only basis was the Cilician coast, which leaves the core identity; Greater Armenia was landlocked and the Cilician kingdom never had a significant war fleet."

[[dropped]]
item = "Warrior Priest"
kind = "unique_unit"
reason = "No documented Armenian troop of fighting priests: the clergy at Avarayr (451), such as the priest Ghevond, exhorted the army and were later martyred (Yeghishe), and the military orders in Cilicia were Latin. Replaced in spirit by the N2 support-priest idea."

[[dropped]]
item = "Trdat the Architect (first-draft tech: Fortified Churches and Castles +30% HP and built +50% faster; not in the current game)"
kind = "unique_tech"
reason = "Relevance test (RULES 6.9): a tech named after one architect is a detail, the build-speed half had no source, and the Castle half belonged to Smbat II's walls. Armenian stone architecture moves to the Masonry, Architecture free bonus (with Trdat in its basis), and Ani's walls to the Bagratid Ani tech."
