civ = "Burgundians"
name = "Burgundians"
status = "draft"
label = "Cavalry and Gunpowder civilization"
summary = "Valois Burgundy (1363–1477): the economic, Cavalier and gunpowder bonuses stay, archers replace the stable discount, the Bruges trade becomes the team bonus, the 1433–34 common coinage the Town Center tech, Vineyards moves to the Mill and the Order of the Golden Fleece replaces Flemish Revolution, while the Cannon Galleon leaves the tree."
ideas = [
  "N2: ‘Charles’s Ordinances’ (1471–73): Castles spawn a mixed lance (Coustillier, mounted archers, crossbowman, hand-gunner, pikeman) with the First Crusade’s spawning mechanism; spawning several unit types at once is not yet in the game.",
  "N2: Distinct art for the Flemish Militia’s goedendag and pike, and a pike variant for Charles the Bold’s attempt to field pikemen on the Swiss model (1476).",
  "N2: Split the Archer and Crossbowman lines (RULES section 10): the towns had separate crossbow guilds (Saint George) and handbow guilds (Saint Sebastian), and the lance of 1471 set three mounted archers with bows beside one crossbowman.",
  "N3: The early-medieval Burgundians (the kingdom of Worms c. 413–436 and of Sapaudia and the Rhône, 443–534) and the kingdom of Arles (933–1032) are not represented by this design; at most a history-text section.",
]
contested = [
  "Whether the Valois lands formed a state in the making (Vaughan; Schnerb, L’État bourguignon) or a composite of territories held in personal union; Blockmans and Prevenier stress the dukes’ role in integrating the Low Countries; and Huizinga’s ‘autumn of the Middle Ages’ reading of the court.",
  "The exact make-up of the 1471–73 lance (ordinances of Abbeville 1471, Bohain 1472 and Saint-Maximin of Trier 1473): whether the foot crossbowman, hand-gunner and pikeman were members of the lance or formed separate companies, and whether one of these ordinances made the crossbowman mounted; the mounted archers usually fought on foot (Vaughan, Charles the Bold, 1973).",
  "How far the dukes’ artillery amounted to a ‘military revolution’ (Smith and DeVries 2005); much of it was lost at Grandson (1476), though the popular figure of c. 400 guns is unconfirmed.",
  "Philip the Good’s share of responsibility for handing Joan of Arc to the English (she was captured and sold by his vassal John of Luxembourg).",
  "The Mounted Crossbowman (kept at its first tier only). Shared basis (level-1 review, section 3.2): the line stays only where shooting from the saddle is documented. Decision: the test is met only indirectly, on the same regional reading as the Franks’ design (the 15th-century crossbow cavalry of the cranequin, set out there), and no Burgundian source used for this design shows a crossbowman shooting from the saddle. Burgundian armies had mounted crossbowmen: cranequiniers, a troop named after the rack-and-pinion cranequin, a spanning device that a rider could work in the saddle, are reported in the army of 1465 (Finot), and the Italian companies Charles the Bold hired from 1472 brought mounted crossbowmen (Vaughan 1973). But at Montlhéry (1465) the cranequiniers stood on foot behind the men-at-arms, and most mounted crossbowmen, like the mounted archers of the lances (Vaughan 1973), seem to have fought on foot. The line is kept for this troop named after a saddle-spanning device, on thin evidence, and at its first tier only: Heavy Mounted Crossbowman and Cranequins are not added, which also keeps it distinct from the Franks’ fuller line (the recommended default of the differentiation question, level-1 review, section 7). The English design drops the line, since English field armies had given up the crossbow by c. 1300 and raised no such troop.",
]
open_questions = []

[profile]
entity = "The Valois Burgundian state: the duchy and county of Burgundy with Flanders, Artois, Brabant, Hainaut, Holland, Zeeland, Luxembourg and other lordships"
region = "Burgundy and the Low Countries"
window = "1363–1477 (from the grant of the duchy to Philip the Bold to Charles the Bold’s death at Nancy)"
sources = [
  "Olivier de La Marche, Mémoires; Georges Chastellain, Chronique; Philippe de Commynes, Mémoires",
  "Richard Vaughan, Philip the Bold (1962); John the Fearless (1966); Philip the Good (1970); Charles the Bold (1973)",
  "Bertrand Schnerb, L’État bourguignon 1363–1477 (1999)",
  "Wim Blockmans and Walter Prevenier, The Promised Lands: The Low Countries under Burgundian Rule, 1369–1530 (1999)",
  "Peter Spufford, Monetary Problems and Policies in the Burgundian Netherlands 1433–1496 (1970)",
  "Robert D. Smith and Kelly DeVries, The Artillery of the Dukes of Burgundy, 1363–1477 (2005)",
  "Laura Crombie, Archery and Crossbow Guilds in Medieval Flanders, 1300–1500 (2016)",
  "Raymond de Roover, Money, Banking and Credit in Mediaeval Bruges (1948); The Rise and Decline of the Medici Bank, 1397–1494 (1963)",
  "James M. Murray, Bruges, Cradle of Capitalism, 1280–1390 (2005)",
  "D’Arcy J. D. Boulton, The Knights of the Crown: The Monarchical Orders of Knighthood in Later Medieval Europe (1987)",
  "Monique Sommé, Isabelle de Portugal, duchesse de Bourgogne (1998)",
  "Roger Dion, Histoire de la vigne et du vin en France des origines au XIXe siècle (1959)",
  "Jules Finot, L’artillerie bourguignonne à la bataille de Montlhéry",
]
replaces = "Burgundians as a 411–1477 sweep (the Germanic kingdom, the kingdom of Arles, the Capetian duchy and the Valois state); the design represents only the Valois state"

[[bonus]]
text = "Economic upgrades available one age earlier and cost -40% food"
kind = "economic"
level = 1
change = "kept"
precedent = "Economic upgrades available one age earlier and cost -40% food (Burgundians)"
basis = "The Low Countries were the most urbanised and commercial region north of the Alps (Bruges, Ghent, Ypres, Antwerp, Brussels), with the great Flemish cloth industry, and most ducal revenue came from them (Blockmans and Prevenier 1999)."
relevance = "The wealth of the Low Countries paid for the Burgundian state and made the dukes the richest princes of the West."

[[bonus]]
text = "Archer-line costs -10/20% in Castle/Imperial Age"
kind = "military"
level = 1
change = "new"
replaces = "Stable technologies cost -50%"
precedent = "Foot Archers cost -10/20/30% in Feudal/Castle/Imperial Age (Mayans), narrowed to the Archer-line in Castle and Imperial Age"
basis = "Burgundian armies were archer-heavy: the dukes drew archers from noble retinues, above all from Picardy, and from town levies; Charles the Bold’s ordinance lance of 1471 set three mounted archers beside each man-at-arms, with a crossbowman on foot; and in the 1470s he also hired English archers (Vaughan 1973). The towns’ sworn shooting guilds (schuttersgilden, in French serments), the crossbowmen of Saint George and the archers of Saint Sebastian, trained, held shooting contests and were a further reservoir of marksmen (Laura Crombie, Archery and Crossbow Guilds in Medieval Flanders, 1300–1500, 2016). A lasting feature of the dukes’ armies, so a passive (RULES 6.2). The stable discount it replaces had no specific basis. The hired English archers, who served at Neuss and Morat after Charles’s alliance with Edward IV and his marriage to Margaret of York (1468), are part of this bonus; a tech to train Longbowmen (an analysis proposal) is not used, so that the Longbowman stays the English design’s unit."
relevance = "Archers outnumbered the men-at-arms in the dukes’ armies from Philip the Good to Charles the Bold’s ordinance companies, and the shooting guilds were an institution of every Flemish and Brabantine town."
contested = "The guilds were a small elite within the town contingents, more prominent in civic ritual, contests and urban revolts than in ducal campaigns (Crombie 2016); the archers of the lances were professional ordinance troops, not guildsmen."

[[bonus]]
text = "Cavalier upgrade available in Castle Age"
kind = "military"
level = 1
change = "kept"
precedent = "Cavalier upgrade available in Castle Age (Burgundians)"
basis = "The dukes’ wealth paid for one of the best-equipped nobilities of Europe, steeped in tournament culture: Jacques de Lalaing’s Pas de la Fontaine des Pleurs (Chalon-sur-Saône, 1449–50) and the Pas de l’Arbre d’Or at the wedding of Charles the Bold and Margaret of York (Bruges, 1468) (Vaughan 1970, 1973)."
relevance = "The Burgundian court was the most lavish centre of late chivalric culture and its nobility rode in the best armour of the age; a borderline pass on that weight, which overlaps the Golden Fleece’s armour half (see contested)."
contested = "Rated ‘stretched’: the Burgundian standing companies (1471) came after the French ones (1445), so ‘early’ heavy cavalry has no institutional basis. The bonus is kept for the equipment and tournament culture of the nobility, and its overlap with the armour half of the Order of the Golden Fleece is accepted."

[[bonus]]
text = "Gunpowder Units +25% attack"
kind = "military"
level = 1
change = "kept"
precedent = "Gunpowder Units +25% attack (Burgundians)"
basis = "The Valois dukes gathered one of the largest artillery parks in Europe, including great bombards such as Mons Meg (made at Mons in 1449 for Philip the Good), and put hand-gunners (couleuvriniers) in the lances of 1471 (Smith and DeVries 2005)."
relevance = "The ducal artillery was one of the largest in Europe and a main instrument of the dukes’ wars, from the Ghent war to Neuss."
contested = "The other great Flemish bombard, Dulle Griet, was used by rebel Ghent against the duke (1452), and the ducal guns did not prevent the defeats of 1476–77."

[team_bonus]
text = "Trade Units generate +15% gold"
level = 1
change = "new"
replaces = "Relics generate food in addition to gold"
precedent = "Trade Units generate +25% gold (Spanish team bonus), at +15%"
basis = "Under the dukes Bruges was the entrepôt of northern Europe: seat of one of the four great Kontore of the Hanse and home to Venetian, Genoese, Florentine, Castilian and Portuguese merchant nations, with the Ter Beurze square where Italian merchant-bankers dealt in bills of exchange (de Roover 1948; Murray 2005); the Medici branch under Tommaso Portinari lent heavily to Charles the Bold (de Roover 1963). Its trade profited the partners as much as Flanders, and the dukes defended it: Isabella of Portugal, mediating at the Anglo-French peace conference at Gravelines (1439), obtained an Anglo-Flemish commercial truce that reopened trade between England and Flanders (Sommé 1998). Bruges remained the leading market under the dukes, while the Brabant fairs of Antwerp, which they favoured, were rising. A team bonus because the trade benefited neighbours and allies (RULES 6.2). Trade-gold team bonuses count as one per team, at the highest value present (RULES 6.16.12); in this region trade gold is reserved for the Burgundians, so the English Calais Staple and the Franks’ Champagne fairs do not use it (level-1 review, section 3.2)."
relevance = "Low Countries trade made the dukes the richest princes of the West and tied Burgundy to England, the Hanse and the Italian and Iberian merchants."
contested = "The dating of Bruges’ peak is debated (Murray’s 1280–1390 against the traditional 15th-century apogee); its decline came mostly after the window (the revolt against Maximilian in 1488, the move of the foreign merchants to Antwerp, the silting of the Zwin), and its relations with the dukes were stormy (the revolt of 1436–38)."

[[unique_unit]]
name = "Coustillier"
model = "Coustillier"
building = "Castle"
level = 1
change = "kept"
basis = "The coustillier (coutilier), named after his coustille (long knife or short sword), was the armed attendant of the man-at-arms in each lance of Charles the Bold’s ordinances (1471–73); the post already existed in the French companies of 1445."
relevance = "The coustillier belongs to the lance of Charles the Bold’s standing army (1471–77), the instrument of his wars from Neuss to Nancy."
contested = "He was a lighter auxiliary than the man-at-arms; the ‘powerful charged attack’ is a game invention."

[[unique_unit]]
name = "Flemish Militia"
model = "Flemish Militia"
building = "Barracks"
level = 1
change = "kept"
basis = "The urban militias of Flanders with goedendag and pike defeated the French knights at Courtrai (1302), before the Burgundian period. The dukes called up town contingents, as for the siege of Calais (1436), which the men of Ghent and Bruges abandoned; the pikemen of the 1471 lances were professional ordinance troops, not militia."
relevance = "The armed towns were the great political force of the Burgundian Low Countries, for and against the dukes, and Courtrai made the Flemish militia famous."
contested = "They were more famous for fighting the dukes (Bruges 1436–38, Ghent 1449–53, crushed at Gavere) than for serving them. The name is kept all the same: the armed townsmen were the best-known soldiers of the Low Countries, and the unit renders them, not their loyalty."

[[unique_tech]]
name = "Vierlander Coinage"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "All gold income +10% faster; Market trading fee reduced to 10%"
level = 1
change = "new"
precedent = "Grand Trunk Road (All gold income +10% faster; Market trading fee reduced to 10%) (Hindustanis): an existing unique tech, shared and renamed with an identical effect and age; several designs reuse it for coinage and revenue reforms, among them the Hindustanis’ Tanka, the Anglo-Saxons’ Edgar's Recoinage, the Malay Syahbandar and the Muisca Cotton Mantles, each on its own history (RULES 6.16.12)"
basis = "Philip the Good’s monetary ordinance of 1433 gave Flanders, Brabant, Hainaut and Holland-Zeeland a common coinage from 1434, struck to one standard in the mints of the four lands, whose silver pieces were known as vierlanders, ‘four-lands’ coins (Spufford, Monetary Problems and Policies in the Burgundian Netherlands 1433–1496, 1970). With the Chambres des comptes of Dijon and Lille (1386), the first States General (1464) and the Parlement of Mechelen (1473), it was one of the institutions that bound the Burgundian Netherlands together (Blockmans and Prevenier 1999). Gold income renders the mint profits and the revenues of a richer, more integrated state, the lower trading fee one trusted coin across the markets of the Low Countries. A state reform, so at the Town Center (RULES 6.2). The coinage takes the slot rather than the Chambres des comptes or the Parlement, which would need a new (level-2) tech with an effect no one uses, or Burgundian Vineyards, which moves to the Mill; the civ thus has three techs (four passives and three techs, within the cap of RULES 6.1)."
relevance = "The common coinage was one of the first institutions shared by the Burgundian Netherlands, the core of the dukes’ state and of the later Low Countries."
contested = "Whether the Valois lands formed a state (see the civ-level contested list); the common coinage covered the Low Countries, not the duchy and county of Burgundy."

[[unique_tech]]
name = "Burgundian Vineyards"
building = "Mill"
kind = "civil"
age = "Castle"
effect = "Farmers slowly generate gold in addition to food"
level = 1
change = "changed"
replaces = "Burgundian Vineyards (Castle unique tech, same effect)"
precedent = "Burgundian Vineyards (Farmers slowly generate gold in addition to food) (Burgundians): moved to the Mill, identical effect and age"
basis = "Philip the Bold’s ordinance of 31 July 1395 banned the ‘disloyal’ Gamay grape in favour of Pinot Noir to protect the quality and name of Burgundy wine (Dion 1959); Cistercian viticulture (Clos de Vougeot) had made it a prestige export, and the dukes used it as a diplomatic gift. At the Mill because the ordinance and the effect concern farming (RULES 6.2); the Town Center slot goes to the common coinage, a weightier act of the state."
relevance = "The 1395 ordinance is the founding text later cited for the Pinot Noir identity of Burgundy wine, the duchy’s best-known product to this day."
contested = "Most ducal revenue came from the Low Countries, not from wine, and the ordinance did not eliminate the Gamay, which stayed widely planted in Burgundy for centuries."

[[unique_tech]]
name = "Order of the Golden Fleece"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Knight-line and Coustilliers +1 melee/+1 pierce armor and more resistant to conversion"
level = 2
change = "new"
replaces = "Flemish Revolution (All existing Villagers are transformed to Flemish Militia)"
precedent = "Effect 1: Knight-line armour as in Hauberk (Knight-line +1 melee/+2 pierce armor) (Sicilians; the Armenians’ Sparapet), at the magnitude of Silk Armor (Scout Cavalry-line, Steppe Lancers and Cavalry Archers +1 melee/+1 pierce armor) (Tatars), and extended to the Coustillier: the Paladin then reaches 6/8, within the game’s current Knight-line maximum (7 melee for the Teutons’ Paladin, 8 pierce for the Sicilians’ Cavalier with Hauberk), where Hauberk’s +1/+2 would make a 6/9 Paladin, above the class ceiling (RULES 6.16.11); effect 2: units more resistant to conversion (First Crusade, Sicilians; Teutons team bonus). Level 2 because Hauberk alone renders only the generic plate, the half least specific to the Order (the Sicilians’ design drops Hauberk for that reason), while the Order’s documented function, the sworn loyalty of a scattered nobility, has no existing tech; no existing tech joins the two."
basis = "Philip the Good founded the Order at Bruges on 10 January 1430, during the festivities for his marriage to Isabella of Portugal, daughter of John I. Its knights (24 under the statutes of 1431, 30 from 1433) swore loyalty to the duke as sovereign of the Order, could not belong to another order without his consent, had their conduct examined at each chapter and could be expelled for treason (Boulton 1987; Vaughan, Philip the Good, 1970): the Order bound the nobility of the scattered lands to the duke, and that sworn loyalty is what the resistance to conversion, the game’s defection, renders. Its statutes also invoked the defence of the faith, and its knights took crusading vows at the Feast of the Pheasant (Lille, 17 February 1454), never fulfilled. The extra armour stands for the nobility the Order headed, equipped in Milanese and Low Countries plate; Coustilliers benefit as part of the lance, not as members. Armour rather than HP keeps it distinct from the Franks’ mounted HP bonus. It replaces Flemish Revolution, which turned the duke’s own subjects into the militias that historically rebelled against him. Hauberk shared and renamed (level 1) would render only the plate and break the ceiling, and a ‘Great Bombards’ tech for the ducal artillery park would repeat the gunpowder passive, so the new tech is preferred. Imperial Age at the Castle, the slot of Flemish Revolution; the chronological order of RULES 6.4 binds only two Castle techs (RULES 6.16.19(a)), so the later common coinage (1433–34) can be a Castle Age tech at the Town Center."
relevance = "The Golden Fleece bound the nobility of the scattered Burgundian lands to the duke and was the emblem of his court; it outlived the state under the Habsburgs."

[tree]
add = ["Arbalester", "Siege Engineers", "Dry Dock"]
remove = ["Hussar", "Siphons", "Incendiaries", "Cannon Galleon", "Elite Cannon Galleon"]

[tree.basis]
"Arbalester" = "The towns of Flanders and Brabant had sworn crossbow guilds (the Saint George guilds among the schuttersgilden) that supplied contingents to urban and ducal armies, and Charles the Bold’s lances included crossbowmen; their absence was the most anti-historical gap of the tree (RULES 6.16.3: crossbow evidence). Ring Archer Armor is not added, a design choice for differentiation rather than a gap in evidence (the ordinance archers did wear brigandines or jacks): the archer discount does not come with the English design’s full archery upgrades (the recommended default of the differentiation question, level-1 review, section 7)."
"Siege Engineers" = "The dukes besieged with great artillery: Dinant (August 1466) was breached after about a week’s bombardment, and in the Ghent war of 1452–53 the ducal guns took the castles of Schendelbeke, Poeke (where Jacques de Lalaing was killed by a cannon shot, July 1453) and Gavere; the eleven-month siege of Neuss (1474–75) failed despite the great artillery park (Vaughan 1970, 1973; Smith and DeVries 2005)."
"Dry Dock" = "Philip the Good kept a fleet based at Sluis and sent crusading galleys to the Black Sea (Waleran de Wavrin, 1444–45). Navy tier (RULES 6.16.1): a fleet of ships, from these ducal ships and galleys to Charles the Bold’s fleet against Warwick (1470), under Hendrik van Borselen, lord of Veere; it keeps every generic tier, without the Cannon Galleon (see there)."
"Cannon Galleon" = "RULES 6.16.1 keeps the Cannon Galleon only where gun-armed warships are documented inside the window. The ducal fleets are documented as fleets of ships and galleys (see the Dry Dock), but the sources used for this design record no guns aboard them and no Burgundian sea fight with guns, and an inference from the size of the ducal artillery does not meet the rule, so the line is removed. The ducal guns are carried by the gunpowder passive, the Bombard Cannon and Siege Engineers."
"Elite Cannon Galleon" = "Same reason as the Cannon Galleon."
"Hussar" = "Hussars appear in Hungary in the later 15th century and in western Europe later still, while the Burgundian window ends in 1477. Light Cavalry remains, so no substitute is needed; the Franks also lack the Hussar."
"Siphons" = "Named after the Byzantine fire siphon, the projector of Greek fire, a state secret never to be given to another nation (De Administrando Imperio 13); its game effect, an explosive charge for fire ships, has no medieval Western equivalent. The fire-ship line itself stays as the engine’s convention for close-range incendiary warships."
"Incendiaries" = "Requires Siphons, which this design removes."

[architecture]
set = "Western European"
change = "kept"
basis = "Burgundian and Flemish Gothic: the Hôtel-Dieu at Beaune (1443), the belfry and cloth hall of Bruges, the town halls of Brussels and Leuven, and the ducal palace at Dijon."

[[dropped]]
item = "Relics generate food in addition to gold"
kind = "team_bonus"
reason = "Relevance test (RULES 6.9) and RULES 6.2: its basis lay almost entirely outside the 1363–1477 window and outside the Low Countries, where the state’s weight lay (Cluny 910, Cîteaux 1098, Vézelay’s Magdalene cult, eclipsed after the ‘discovery’ of her body at Saint-Maximin in 1279); the only case inside the window, the Charterhouse of Champmol (1383), was a ducal mausoleum that benefited no ally, and the step from relics to food was rated ‘stretched’. The team slot goes to the Bruges trade."
