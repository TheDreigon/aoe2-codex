civ = "Mongols"
name = "Mongols"
status = "reviewed"
label = "Cavalry Archer civilization"
summary = "The Mongol Empire (1206–1368) keeps its horse archers, hunt, remounts, Mangudai and Drill and gains the Keshik, the decimal levy (Conscription free), the yam relay as the Town Center tech and the Pax Mongolica as the team bonus, while camels, the Champion and the Cannon Galleon leave."
ideas = [
  "N2: A Noyan command unit with an aura for nearby mounted units, for the decimal organisation (arban, jaghun, minggan, tümen), the regrouping of 1206 into 95 thousands under Chinggis's companions (Secret History §202) and its signals by standard and drum (the Secret History; the great naccara that opened Kublai's battle against Nayan in 1287, Marco Polo; May 2007). The Khan, a mounted archer of the Scenario Editor (The Last Khans), could give it its look; its in-game art and stats would have to be checked in the game.",
  "N2: Huihui Pao, a Siege Workshop tech in the Imperial Age for the counterweight engines that Ismail and Ala al-Din, sent by the Ilkhan Abaqa, built for Kublai before Fancheng and Xiangyang (1273; Yuan shi, their biographies). It is a distinct datable adoption of a technique (RULES 6.2), and its effect should render the weight of the stones, which the Yuan shi stresses (stones of 150 jin that sank seven chi into the ground), rather than range. The level-1 variant was considered and set aside as the fallback: Timurid Siegecraft (Trebuchets +2 range) moved and renamed at level 1, the tech's best home (RULES 6.16.18), which would fit the slots (4 passives + 3 techs). It is not adopted because its only existing effect, range, does not render what the sources stress, so a fitting effect needs N2, and because the design's gains over the game's civ are already large (power budget, RULES 6.14). The Chinese design leaves the name to the Mongols and calls its own idea Xiangyang Pao.",
  "N3: Gers that are packed onto carts and set up elsewhere, keeping their population space (Rubruck), instead of the dropped Nomads. The Mule Cart stays with its four holders (RULES 6.16.7), so the Mongols get no wagon dropsite in N1.",
  "N2: Darqan: religious tolerance and tax exemptions for clergy (Changchun, 1223; Möngke's debate at Karakorum, 1254) as a Monastery effect instead of conversion. The Tatars' design renders the same policy, in the Horde's patents to the Russian Church, as its team bonus.",
  "N2: Hashar: captive levies driven ahead of the army at sieges (Juvaini), as a cheap expendable infantry or siege-labour effect.",
  "N2: Borts and dried milk: each rider's own preserved rations (Marco Polo; Carpini), as a campaign-supply effect.",
  "N3: A “Steppe” architecture set shared with the Avars, Tatars and Cumans.",
]
contested = [
  "The Mangudai as a “suicide squad”: the Manggud tribe and its role in the vanguard are real (Secret History §170–171), but the popular story has no known primary source.",
  "Gunpowder: Yuan armies used early guns: the Heilongjiang hand gun is dated by context to Li Ting's campaign against Nayan (1287–1288; Yuan shi), and the Xanadu gun (1298) is the earliest dated example; but the gun troops were largely Han and Jurchen units in Yuan service and firearms were marginal to Mongol warfare as a whole; claims of Mongol gunpowder in the West (Mohi, 1241) are doubtful (K. Chase, Firearms, 2003; T. Andrade, The Gunpowder Age, 2016). Decision: the Hand Cannoneer is not added, for those reasons and because the Chinese design already carries the same Yuan evidence; the Yuan's ship-borne bombs are rendered by the Catapult Galleon.",
  "Army sizes and the number of remounts per man are modern estimates (T. May suggests three to five horses).",
  "Whether the ideology of universal rule goes back to Chinggis or only to his successors (Güyük's letter of 1246).",
  "The Yuan and the Ilkhanate are carried here as Mongol states; the Chinese take from the Yuan years only what the Ming inherited, and the Persians count the Ilkhanids among the rulers of Iran.",
]
open_questions = []

[profile]
entity = "Mongol Empire (Yeke Mongγol Ulus) and its Toluid successors, the Yuan and the Ilkhanate"
region = "Mongolian plateau, with conquests from China and Korea to Iran, the Caucasus and the Pontic steppe"
window = "1206–1368"
sources = [
  "The Secret History of the Mongols (trans. I. de Rachewiltz, 2004)",
  "ʿAta-Malik Juvaini, History of the World-Conqueror (trans. J. A. Boyle, 1958)",
  "Rashid al-Din, Jamiʿ al-tawarikh (trans. W. M. Thackston, 1998–1999)",
  "John of Plano Carpini, Ystoria Mongalorum (1247)",
  "William of Rubruck, Itinerarium (1253–1255; trans. P. Jackson, 1990)",
  "Marco Polo, Description of the World",
  "Yuan shi (official history of the Yuan)",
  "T. May, The Mongol Art of War (2007)",
  "T. Allsen, Mongol Imperialism (1987); “Mongolian Princes and Their Merchant Partners, 1200–1260”, Asia Major 2 (1989)",
  "Hsiao Ch'i-ch'ing, The Military Establishment of the Yuan Dynasty (1978)",
  "D. Morgan, The Mongols (2nd ed., 2007)",
  "P. Jackson, The Mongols and the West (2005)",
  "R. Sasaki, The Origin of the Lost Fleet of the Mongol Empire (2015)",
]

[[bonus]]
text = "Hunters work +40% faster"
kind = "economic"
level = 1
change = "kept"
precedent = "Hunters work +40% faster (Mongols)"
basis = "Juvaini describes the great battue (jerge), in which the army ringed the game for weeks with the discipline of a campaign, and says Chinggis held hunting to be the proper training of commanders; hunting also kept Temüjin's abandoned family alive (Secret History)."
relevance = "The great hunt was both food and the school of Mongol warfare, and it is among the best-known Mongol traits."
contested = "Pastoralism (horses, sheep, milk) was the economic base, which Rubruck and Carpini describe at length; hunting was a supplement and a school of war. Decision: the design keeps the game's hunting bonus as its one economic passive and adds no herding bonus, which the Tatars' and Cumans' designs carry (“Livestock animals last +50% longer”), so as not to add power to a design that already gains much over the game's civ."

[[bonus]]
text = "Cavalry Archers attack +25% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Cavalry Archers attack +25% faster (Mongols)"
basis = "Carpini (1247) says each warrior had to carry two or three bows, or at least one good one, and three large quivers; the Mongols softened the enemy with sustained arrow fire before closing in (May 2007). An abstraction of volume of fire."
relevance = "Massed horse archery was the core of every Mongol army from Chinggis to the Ilkhans."

[[bonus]]
text = "Scout Cavalry-line and Steppe Lancers +20/30% HP in Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Scout Cavalry-line and Steppe Lancers +20/30% HP in Castle/Imperial Age (Mongols)"
basis = "Each rider led several remounts and changed horses on the march, which gave Mongol horsemen exceptional endurance (May 2007); the lancers wore lamellar armour (Carpini)."
relevance = "The remount system let Mongol armies cover distances and fight campaigns that their enemies could not match."

[[bonus]]
text = "Conscription free"
kind = "military"
level = 1
change = "new"
precedent = "Conscription free (Vietnamese)"
basis = "Every adult man of the steppe peoples was liable to serve, in decimal units of tens, hundreds, thousands and ten thousands (arban, jaghun, minggan, tümen). Decimal command was an old steppe structure: Sima Qian describes Xiongnu chiefs of thousands, hundreds and tens (Shiji 110), and the Jin organised the Jurchens in meng'an and mouke. Two later steps are datable and distinct from it: in 1206 Chinggis regrouped the people into 95 thousands under his own companions and noyad, breaking up the defeated Kereyid, Naiman, Merkit and Tatar groupings (Secret History §202; it is folded into the N2 Noyan idea rather than given a Castle tech of its own), and the censuses of north China (1235–1236), Rus' (1257–1259) and Iran registered men for levy and tax (Allsen 1987). This passive stands for the old structure of universal service, a structural trait (RULES 6.2)."
relevance = "Universal service in decimal units made the whole Mongol people an army that could be raised and replaced quickly; it was the base of Mongol military power."
contested = "How far the 1206 reorganisation broke the old tribes is debated; some groups kept their identity inside the new thousands."

[team_bonus]
text = "Trade Units generate +25% gold"
level = 1
change = "new"
replaces = "Scout Cavalry-line +2 line of sight"
precedent = "Trade Units generate +25% gold (Spanish team bonus)"
basis = "The Pax Mongolica: the khans protected the caravan roads across Eurasia and took foreign merchants into partnership. Muslim and Uighur merchants traded as ortoq partners with capital from the princely households (Allsen 1989), paiza tablets gave safe conduct and the right to post horses, and Latin merchants such as the Polos crossed the empire under Mongol protection (Marco Polo; Jackson 2005). RULES 6.2: a benefit to trading partners. The old team bonus (scouting) helped only the Mongols; its effect moves to the Yam tech."
relevance = "The trade the Mongols opened and protected across Eurasia is among the empire's most lasting legacies, and foreign merchants and states profited from it as much as the khans."
contested = "The balance of the Pax Mongolica, protected trade against the destruction of the conquests, is debated (Allsen; Favereau; Jackson). The same effect is the Castilians' team bonus; trade-gold team bonuses count as one, at the highest value present (RULES 6.16.12). The Tatars' Tamga, a tech of the Tatar player's own, still adds to it, so a Tatar ally reaches +50% trade gold; the design accepts this."

[[unique_unit]]
name = "Mangudai"
model = "Mangudai"
building = "Castle"
level = 1
change = "kept"
basis = "Named after the Manggud, who with the Uru'ud formed Chinggis's vanguard against the Kereyid at Qalaqaljit Elet in 1203 (Secret History §170–171); an elite horse archer is a faithful picture of the Mongol core."
relevance = "The elite horse archer was the Mongol army; the Manggud vanguard of 1203 gives the unit a documented name."
contested = "The modern reading of the Mangudai as a suicide squad has no primary source."

[[unique_unit]]
name = "Keshik"
model = "Keshik"
building = "Castle"
level = 1
change = "new"
basis = "The kheshig, Chinggis's guard, was created in 1204 with day guards, night guards and quiver-bearers, and expanded to 10,000 men in 1206 (Secret History §191, §224–234); it served as the school of the empire's commanders and governors and survived under the Yuan and the Ilkhans. The game gives it only to the Tatars; here the Mongols share it with them, and the gold earned in combat stands for the booty distributed through the khan's household. Decision: the unit is shared rather than made Mongol-only, since the Tatars' design keeps it for the armoured elite of the Horde's households (RULES 6.7)."
relevance = "The guard was the core of Chinggis's state, his household and the training school of the empire's elite, and the Mongol institution par excellence."

[[unique_tech]]
name = "Yam"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Outposts +3 line of sight and cost no stone; Scout Cavalry-line +2 line of sight"
level = 2
change = "new"
replaces = "Nomads (Lost Houses do not decrease population space)"
precedent = "Outposts +3 line of sight and cost no stone (Ethiopians team bonus, which their design replaces); Scout Cavalry-line +2 line of sight (Mongols team bonus). A new tech that combines two existing effects, so level 2."
basis = "Ögödei organised the yam, a network of relay stations with fresh horses and supplies, around 1234–1235 (Secret History §279–281). Marco Polo describes posts every 25 to 30 miles, and holders of a paiza tablet (envoys, officials and licensed merchants) could claim mounts and lodging, so that urgent orders covered in weeks journeys that took caravans months: express riders made 200 to 250 miles a day (Marco Polo; Allsen 1987; A. Silverstein, Postal Systems in the Pre-Modern Islamic World, 2007). The stations are the outposts; the riders and the intelligence they carried take over the old scouting team bonus. A state institution, so the Town Center (RULES 6.2). Nomads had little effect and caught little of the moving ger camps it alluded to (see N3 idea)."
relevance = "The yam held the empire together: without it the khans could not have governed, gathered intelligence or moved envoys from Karakorum to Iran and Rus'."

[[unique_tech]]
name = "Drill"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Siege Workshop Units move +50% faster"
level = 1
change = "kept"
precedent = "Drill: Siege Workshop Units move +50% faster (Mongols); the Franks' design shares it as Bureau Brothers (Castle, Imperial Age), each on its own history (RULES 6.16.12)"
basis = "The Mongols kept corps of Chinese and Muslim engineers with the army: engines, ladders and stones were hauled to Nishapur in 1221 by the thousand (Juvaini); Hülegü took a thousand households of Chinese catapult men, naphtha-throwers and crossbowmen west in 1253 (Juvaini; Rashid al-Din), crews of siege crossbows such as the “ox's bow” that Khitan craftsmen built at Maymun-Diz (1256), which Juvaini says shot 2,500 paces (the Heavy Scorpion, which the Mongols keep, stands for them too); and Muslim engineers sent from the Ilkhanate built the engines that took Xiangyang for Kublai in 1273 (Yuan shi). A mobile siege train is a fair abstraction."
relevance = "Captured Chinese and Muslim siegecraft turned a steppe cavalry army into one that could take the great walled cities of north China, Khwarazm and Song China."
contested = "The name is the game's; engines were also built on the spot from local timber and forced labour. The basis names the Xiangyang engines of 1273 as part of the siege train; a separate Huihui Pao tech for them is an N2 idea (see ideas). Traction test (RULES 6.16.5): the Mongols' engines in north China before 1273 were traction pao, and the counterweight engine is attested for them from Xiangyang (1273), built by engineers from the Ilkhanate; the Mongol evidence spans both eras, and both engines fill the same Imperial Age slot. The tree keeps the counterweight Trebuchet, as RULES 6.16.5 records for the Mongols: it is the engine of Xiangyang, the siege that opened the way to the conquest of the Song, brought across the Mongol world, from the Ilkhanate to Kublai's China, by engineers in Mongol service, and the engine that the Huihui Pao idea, the home RULES 6.16.18 gives Timurid Siegecraft, would improve. This is the one-engine choice that the Chinese, Byzantine and Bulgarian designs also make, here for the counterweight engine; the traction pao of the conquest's first decades is not added beside it."

[tree]
add = ["Plate Barding Armor", "Halberdier", "Guilds", "Catapult Galleon", "Block Printing"]
remove = ["Camel Rider", "Heavy Camel Rider", "Champion", "Cannon Galleon", "Siphons"]

[tree.basis]
"Plate Barding Armor" = "Carpini (1247) describes armour for horses made of leather strips laid in several layers and shaped to the body; the absence of the last horse-armour upgrade contradicted the sources."
"Halberdier" = "The anti-cavalry substitute for the removed camels (RULES 6.11), rather than keeping the Heavy Camel Rider as a declared abstraction. The Mongol army proper had no infantry; its foot came from subject peoples: the north Chinese “Han armies” raised from the 1230s and, under the Yuan, the Han and “newly submitted” (xinfu) troops of the former Song, heirs of Song spear and crossbow infantry (Hsiao 1978). Their polearms match the game's Halberdier (the Chinese ji); the kept Two-Handed Swordsman and Arbalester stand for the same troops, the Arbalester also for the crossbow bolts in the wreck of the 1281 fleet off Takashima (Sasaki 2015)."
"Guilds" = "The khans' merchant partners (ortoq), trading with capital from the princely households (Allsen 1989), and the Yuan paper money (chao) made the Mongol courts great patrons of commerce; the absence of Guilds was odd for the empire of the Pax Mongolica."
"Catapult Galleon" = "Yuan war fleets fought with bombs and crossbows rather than guns: the wreck of the 1281 invasion fleet off Takashima yielded ceramic bombs (tetsuhō), crossbow bolts, arrowheads, spears and swords, but no cannon (Sasaki 2015). The non-gunpowder siege warship fits these ship-borne bombs, usually read as catapult-thrown, better than a gun ship and replaces the Cannon Galleon (RULES 6.11). Navy tier (RULES 6.16.1): a fleet of ships, resting on the planked ships from Chinese and Korean yards of the Yuan fleets against Song China, Japan (1274, 1281) and Java (1293). The tree keeps the game's Mongol navy, without the Carrack, Dry Dock and Heated Shot that the game already withholds, and the Galleon stays as a flagged abstraction of the game's skeleton (RULES 6.16.2); special warships stay only where their type or function is documented (RULES 6.16.1)."
"Block Printing" = "Printing inside the window, under the Yuan: the state printed its paper money (chao), which Marco Polo describes (see Guilds), Buddhist scriptures were printed under the khans' patronage, and the Yuan official Wang Zhen described the wooden movable type with which he printed a county gazetteer (Nong shu, 1313). The same printing-date test gives Block Printing to the Khitans for Liao printing; the Persians' design does not count the Ilkhanid paper money of Tabriz (1294), which was not book printing, so the test rests here on Yuan printing."
"Camel Rider" = "Bactrian camels carried the Mongols' baggage and dismantled gers; there is no record of camel-mounted combat troops."
"Heavy Camel Rider" = "As Camel Rider."
"Champion" = "A power-budget decision that history tolerates: Mongol infantry came from subject levies, which the Two-Handed Swordsman and the Halberdier stand for, and the top swordsman tier is withheld to offset the second unique unit and Plate Barding."
"Cannon Galleon" = "No ship-borne guns are recorded for the Yuan fleets of 1274, 1281 or 1293; replaced by the Catapult Galleon."
"Siphons" = "Named after the Byzantine fire siphon, a state secret never given to other nations (De Administrando Imperio 13); no ship-borne liquid-fire weapon is documented for this civ."

[architecture]
set = "East Asian"
level = 1
change = "kept"
basis = "Karakorum's palace and the Yuan capital Dadu were built largely by Chinese craftsmen, and Rubruck describes Karakorum's Chinese and Muslim quarters; a Steppe set would fit the gers and wagon camps better (N3; the steppe civs keep stopgap sets until then, RULES 6.16.8)."
