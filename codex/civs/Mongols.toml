civ = "Mongols"
name = "Mongols"
status = "draft"
label = "Cavalry Archer civilization"
summary = "The Mongol Empire (1206–1368) keeps its horse archers, hunt, remounts, Mangudai and Drill and gains the Keshik, the decimal levy (Conscription free), the yam relay as the Town Center tech and the Pax Mongolica as the team bonus, while camels, the Champion and the Cannon Galleon leave."
ideas = [
  "N2: A Noyan command unit with an aura for nearby mounted units, for the decimal organisation (arban, jaghun, minggan, tümen) and its signals by standard and drum (the Secret History; the great naccara that opened Kublai's battle against Nayan in 1287, Marco Polo; May 2007).",
  "N3: Gers that are packed onto carts and set up elsewhere, keeping their population space (Rubruck), instead of the dropped Nomads.",
  "N2: Darqan: religious tolerance and tax exemptions for clergy (Changchun, 1223; Möngke's debate at Karakorum, 1254) as a Monastery effect instead of conversion.",
  "N2: Hashar: captive levies driven ahead of the army at sieges (Juvaini), as a cheap expendable infantry or siege-labour effect.",
  "N2: Borts and dried milk: each rider's own preserved rations (Marco Polo; Carpini), as a campaign-supply effect.",
  "N3: A “Steppe” architecture set shared with the Avars, Tatars and Cumans.",
]
contested = [
  "The Mangudai as a “suicide squad”: the Manggud tribe and its role in the vanguard are real (Secret History §170–171), but the popular story has no known primary source.",
  "Gunpowder: Yuan armies used early guns: the Heilongjiang hand gun is dated by context to Li Ting's campaign against Nayan (1287–1288; Yuan shi), and the Xanadu gun (1298) is the earliest dated example; but the gun troops were largely Han and Jurchen units in Yuan service and firearms were marginal to Mongol warfare as a whole; claims of Mongol gunpowder in the West (Mohi, 1241) are doubtful (K. Chase, Firearms, 2003; T. Andrade, The Gunpowder Age, 2016). The Hand Cannoneer is therefore not added (see open questions).",
  "Army sizes and the number of remounts per man are modern estimates (T. May suggests three to five horses).",
  "Whether the ideology of universal rule goes back to Chinggis or only to his successors (Güyük's letter of 1246).",
  "The Yuan and the Ilkhanate are carried here as Mongol states; the Chinese take from the Yuan years only what the Ming inherited, and the Persians count the Ilkhanids among the rulers of Iran.",
]
open_questions = [
  "Keshik: shared with the Tatars, since the kheshig was Chinggis's own institution, documented for the Yuan and the Ilkhans but only inferred for the Horde. Make it Mongol-only, with the Tatars getting another unit? (The Tatars' file notes that the Kipchak is better grounded for the Horde's army as a whole, at the cost of a sixth civ with Kipchaks.)",
  "Hand Cannoneer for the Yuan phase: held back to offset the power gains (the guns are documented, but were marginal to Mongol warfare and the Chinese design already carries the same Yuan evidence). Add it, as the analysis proposes?",
  "Castle techs (RULES 6.4: with two Castle techs one is Castle Age and one Imperial Age, in chronological order): Drill, for the siege train of the Jin and Khwarazm campaigns (1211–1221), is the only one. Two datable candidates could join it, each adding power: (a) the regrouping of 1206 into 95 thousands under Chinggis's companions and noyad (Secret History §202), a military reform distinct from the old decimal levy of the Conscription passive, as a Castle Age tech with Drill in the Imperial Age (or folded into the N2 Noyan idea); (b) Huihui Pao, Timurid Siegecraft (Trebuchets +2 range, unclaimed since the Tatars drop it and the Persians, who carry the Timurids, put it to the owner as codex-wide question CQ24) renamed for the counterweight engines that Ismail and Ala al-Din, sent by the Ilkhan Abaqa, built for Kublai before Xiangyang (1273). For (b) the Siege Workshop variant is recommended, a third tech in the Imperial Age as in the game, since making Huihui Pao the Imperial Castle tech would move Drill to the Castle Age, earlier than its game age (codex-wide question CQ10). The Chinese design leaves the name Huihui Pao to the Mongols and calls its own N2 idea Xiangyang Pao, so the names do not clash. Add one of them?",
  "Power budget against the current civ: gains are the Keshik, Plate Barding, Conscription free, the Halberdier, Guilds and a stronger trade team bonus; losses are both camel units, the Champion, Nomads, Siphons and the Cannon Galleon (replaced by the weaker Catapult Galleon), and the Hand Cannoneer is not added. The Halberdier replaces the camels as anti-cavalry (RULES 6.11); the alternative is to keep the Heavy Camel Rider as a declared abstraction. Accept this balance?",
  "Economy: the only economic passive is the hunt (Hunters work +40% faster), the game's own bonus, kept for the battue's role as the school of war; pastoralism (horses, sheep and milk), the real economic base that Rubruck and Carpini describe at length, has no bonus, while the Tatars and Cumans both have “Livestock animals last +50% longer”. Add it as a fifth passive (and offset the power elsewhere), or let it replace the hunting bonus?",
  "Trade: the team bonus “Trade Units generate +25% gold” is also the Castilians' team bonus, the effect of the Tatars' Tamga and half of the Germans' Hanse. Identical team-wide effects count once per team, and trade-gold team bonuses count as one at the highest value present (codex rule pending the owner: codex-wide question CQ11, see codex/civs/README.md). The Tamga is the Tatar player's own tech and still adds to the team bonus, so a Tatar player allied with the Mongols, the Castilians or both has +50% trade gold. Accept this, or give the Tamga another existing effect (same question in the Tatars' file)?",
  "Codex-wide question CQ4 (see codex/civs/README.md): Mule Cart.",
]

[profile]
entity = "Mongol Empire (Yeke Mongγol Ulus) and its Toluid successors, the Yuan and the Ilkhanate"
region = "Mongolian plateau, with conquests from China and Korea to Iran, the Caucasus and the Pontic steppe"
window = "1206–1368"
sources = [
  "The Secret History of the Mongols (trans. I. de Rachewiltz, 2004)",
  "ʿAta-Malik Juvaini, History of the World-Conqueror (trans. J. A. Boyle, 1958)",
  "Rashid al-Din, Jamiʿ al-tawarikh (trans. W. M. Thackston, 1998–1999)",
  "John of Plano Carpini, Ystoria Mongalorum (1247)",
  "William of Rubruck, Itinerarium (1253–1255; trans. P. Jackson, 1990)",
  "Marco Polo, Description of the World",
  "Yuan shi (official history of the Yuan)",
  "T. May, The Mongol Art of War (2007)",
  "T. Allsen, Mongol Imperialism (1987); “Mongolian Princes and Their Merchant Partners, 1200–1260”, Asia Major 2 (1989)",
  "Hsiao Ch'i-ch'ing, The Military Establishment of the Yuan Dynasty (1978)",
  "D. Morgan, The Mongols (2nd ed., 2007)",
  "P. Jackson, The Mongols and the West (2005)",
  "R. Sasaki, The Origin of the Lost Fleet of the Mongol Empire (2015)",
]

[[bonus]]
text = "Hunters work +40% faster"
kind = "economic"
level = 1
change = "kept"
precedent = "Hunters work +40% faster (Mongols)"
basis = "Juvaini describes the great battue (jerge), in which the army ringed the game for weeks with the discipline of a campaign, and says Chinggis held hunting to be the proper training of commanders; hunting also kept Temüjin's abandoned family alive (Secret History)."
relevance = "The great hunt was both food and the school of Mongol warfare, and it is among the best-known Mongol traits."
contested = "Pastoralism (horses, sheep, milk) was the economic base; hunting was a supplement and a school of war (see open questions)."

[[bonus]]
text = "Cavalry Archers attack +25% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Cavalry Archers attack +25% faster (Mongols)"
basis = "Carpini (1247) says each warrior had to carry two or three bows, or at least one good one, and three large quivers; the Mongols softened the enemy with sustained arrow fire before closing in (May 2007). An abstraction of volume of fire."
relevance = "Massed horse archery was the core of every Mongol army from Chinggis to the Ilkhans."

[[bonus]]
text = "Scout Cavalry-line and Steppe Lancers +20/30% HP in Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Scout Cavalry-line and Steppe Lancers +20/30% HP in Castle/Imperial Age (Mongols)"
basis = "Each rider led several remounts and changed horses on the march, which gave Mongol horsemen exceptional endurance (May 2007); the lancers wore lamellar armour (Carpini)."
relevance = "The remount system let Mongol armies cover distances and fight campaigns that their enemies could not match."

[[bonus]]
text = "Conscription free"
kind = "military"
level = 1
change = "new"
precedent = "Conscription free (Vietnamese)"
basis = "Every adult man of the steppe peoples was liable to serve, in decimal units of tens, hundreds, thousands and ten thousands (arban, jaghun, minggan, tümen). Decimal command was an old steppe structure: Sima Qian describes Xiongnu chiefs of thousands, hundreds and tens (Shiji 110), and the Jin organised the Jurchens in meng'an and mouke. Two later steps are datable and distinct from it: in 1206 Chinggis regrouped the people into 95 thousands under his own companions and noyad, breaking up the defeated Kereyid, Naiman, Merkit and Tatar groupings (Secret History §202; see open questions), and the censuses of north China (1235–1236), Rus' (1257–1259) and Iran registered men for levy and tax (Allsen 1987). This passive stands for the old structure of universal service, a structural trait (RULES 6.2)."
relevance = "Universal service in decimal units made the whole Mongol people an army that could be raised and replaced quickly; it was the base of Mongol military power."
contested = "How far the 1206 reorganisation broke the old tribes is debated; some groups kept their identity inside the new thousands."

[team_bonus]
text = "Trade Units generate +25% gold"
level = 1
change = "new"
replaces = "Scout Cavalry-line +2 line of sight"
precedent = "Trade Units generate +25% gold (Spanish team bonus)"
basis = "The Pax Mongolica: the khans protected the caravan roads across Eurasia and took foreign merchants into partnership. Muslim and Uighur merchants traded as ortoq partners with capital from the princely households (Allsen 1989), paiza tablets gave safe conduct and the right to post horses, and Latin merchants such as the Polos crossed the empire under Mongol protection (Marco Polo; Jackson 2005). RULES 6.2: a benefit to trading partners. The old team bonus (scouting) helped only the Mongols; its effect moves to the Yam tech."
relevance = "The trade the Mongols opened and protected across Eurasia is among the empire's most lasting legacies, and foreign merchants and states profited from it as much as the khans."
contested = "The balance of the Pax Mongolica, protected trade against the destruction of the conquests, is debated (Allsen; Favereau; Jackson)."

[[unique_unit]]
name = "Mangudai"
model = "Mangudai"
building = "Castle"
level = 1
change = "kept"
basis = "Named after the Manggud, who with the Uru'ud formed Chinggis's vanguard against the Kereyid at Qalaqaljit Elet in 1203 (Secret History §170–171); an elite horse archer is a faithful picture of the Mongol core."
relevance = "The elite horse archer was the Mongol army; the Manggud vanguard of 1203 gives the unit a documented name."
contested = "The modern reading of the Mangudai as a suicide squad has no primary source."

[[unique_unit]]
name = "Keshik"
model = "Keshik"
building = "Castle"
level = 1
change = "new"
basis = "The kheshig, Chinggis's guard, was created in 1204 with day guards, night guards and quiver-bearers, and expanded to 10,000 men in 1206 (Secret History §191, §224–234); it served as the school of the empire's commanders and governors and survived under the Yuan and the Ilkhans. The game gives it only to the Tatars; here the Mongols share it with them, and the gold earned in combat stands for the booty distributed through the khan's household."
relevance = "The guard was the core of Chinggis's state, his household and the training school of the empire's elite, and the Mongol institution par excellence."

[[unique_tech]]
name = "Yam"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Outposts +3 line of sight and cost no stone; Scout Cavalry-line +2 line of sight"
level = 2
change = "new"
replaces = "Nomads (Lost Houses do not decrease population space)"
precedent = "Outposts +3 line of sight and cost no stone (Ethiopians team bonus, which their design replaces); Scout Cavalry-line +2 line of sight (Mongols team bonus). A new tech that combines two existing effects, so level 2."
basis = "Ögödei organised the yam, a network of relay stations with fresh horses and supplies, around 1234–1235 (Secret History §279–281). Marco Polo describes posts every 25 to 30 miles, and holders of a paiza tablet (envoys, officials and licensed merchants) could claim mounts and lodging, so that urgent orders covered in weeks journeys that took caravans months: express riders made 200 to 250 miles a day (Marco Polo; Allsen 1987; A. Silverstein, Postal Systems in the Pre-Modern Islamic World, 2007). The stations are the outposts; the riders and the intelligence they carried take over the old scouting team bonus. A state institution, so the Town Center (RULES 6.2). Nomads had little effect and caught little of the moving ger camps it alluded to (see N3 idea)."
relevance = "The yam held the empire together: without it the khans could not have governed, gathered intelligence or moved envoys from Karakorum to Iran and Rus'."

[[unique_tech]]
name = "Drill"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Siege Workshop Units move +50% faster"
level = 1
change = "kept"
precedent = "Drill: Siege Workshop Units move +50% faster (Mongols)"
basis = "The Mongols kept corps of Chinese and Muslim engineers with the army: engines, ladders and stones were hauled to Nishapur in 1221 by the thousand (Juvaini); Hülegü took a thousand households of Chinese catapult men, naphtha-throwers and crossbowmen west in 1253 (Juvaini; Rashid al-Din), crews of siege crossbows such as the “ox's bow” that Khitan craftsmen built at Maymun-Diz (1256), which Juvaini says shot 2,500 paces (the Heavy Scorpion, which the Mongols keep, stands for them too); and Muslim engineers sent from the Ilkhanate built the engines that took Xiangyang for Kublai in 1273 (Yuan shi). A mobile siege train is a fair abstraction."
relevance = "Captured Chinese and Muslim siegecraft turned a steppe cavalry army into one that could take the great walled cities of north China, Khwarazm and Song China."
contested = "The name is the game's; engines were also built on the spot from local timber and forced labour."

[tree]
add = ["Plate Barding Armor", "Halberdier", "Guilds", "Catapult Galleon"]
remove = ["Camel Rider", "Heavy Camel Rider", "Champion", "Cannon Galleon", "Siphons"]

[tree.basis]
"Plate Barding Armor" = "Carpini (1247) describes armour for horses made of leather strips laid in several layers and shaped to the body; the absence of the last horse-armour upgrade contradicted the sources."
"Halberdier" = "The anti-cavalry substitute for the removed camels (RULES 6.11). The Mongol army proper had no infantry; its foot came from subject peoples: the north Chinese “Han armies” raised from the 1230s and, under the Yuan, the Han and “newly submitted” (xinfu) troops of the former Song, heirs of Song spear and crossbow infantry (Hsiao 1978). Their polearms match the game's Halberdier (the Chinese ji); the kept Two-Handed Swordsman and Arbalester stand for the same troops, the Arbalester also for the crossbow bolts in the wreck of the 1281 fleet off Takashima (Sasaki 2015)."
"Guilds" = "The khans' merchant partners (ortoq), trading with capital from the princely households (Allsen 1989), and the Yuan paper money (chao) made the Mongol courts great patrons of commerce; the absence of Guilds was odd for the empire of the Pax Mongolica."
"Catapult Galleon" = "Yuan war fleets fought with bombs and crossbows rather than guns: the wreck of the 1281 invasion fleet off Takashima yielded ceramic bombs (tetsuhō), crossbow bolts, arrowheads, spears and swords, but no cannon (Sasaki 2015). The non-gunpowder siege warship fits these ship-borne bombs, usually read as catapult-thrown, better than a gun ship and replaces the Cannon Galleon (RULES 6.11); under the codex navy rule, special warships stay only where their type or function is documented (codex-wide question CQ1)."
"Camel Rider" = "Bactrian camels carried the Mongols' baggage and dismantled gers; there is no record of camel-mounted combat troops."
"Heavy Camel Rider" = "As Camel Rider."
"Champion" = "A power-budget decision that history tolerates: Mongol infantry came from subject levies, which the Two-Handed Swordsman and the Halberdier stand for, and the top swordsman tier is withheld to offset the second unique unit and Plate Barding."
"Cannon Galleon" = "No ship-borne guns are recorded for the Yuan fleets of 1274, 1281 or 1293; replaced by the Catapult Galleon."
"Siphons" = "Named after the Byzantine fire siphon, a state secret never given to other nations (De Administrando Imperio 13); no ship-borne liquid-fire weapon is documented for this civ."

[architecture]
set = "East Asian"
level = 1
change = "kept"
basis = "Karakorum's palace and the Yuan capital Dadu were built largely by Chinese craftsmen, and Rubruck describes Karakorum's Chinese and Muslim quarters; a Steppe set would fit the gers and wagon camps better (N3; the steppe stopgaps are codex-wide question CQ5)."
