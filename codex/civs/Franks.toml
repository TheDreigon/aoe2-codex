[[bonus]]
text = "Masonry, Architecture free"
kind = "other"
level = 1
change = "new"
replaces = "Foragers work +15% faster"
precedent = "Town Watch, Town Patrol free (Byzantines), the game’s ‘X, Y free’ bonus type; the Armenians’ and Goths’ designs use the same pair"
basis = "Gothic building was a French creation: Abbot Suger’s choir at Saint-Denis (1140–44) and the cathedrals of the Île-de-France and Champagne (Sens, Laon, Paris, Chartres, Reims, Amiens) set the style that Latin Europe followed for three and a half centuries, and a German chronicler of c. 1280 called it opus francigenum, ‘French work’ (Burchard of Hall, at Wimpfen im Tal; Frankl, Gothic Architecture, 1962, rev. Crossley 2000). Free Masonry and Architecture render the skill of the French master masons and the scale of their building. A long building tradition, so a passive (RULES 6.2). It replaces the game’s forager bonus, which had no identifiable historical link. A bonus for Philip Augustus’ royal towers is not used: a single architectural type fails the relevance test and would repeat the castle bonus (the towers stay in the Keep’s basis)."
relevance = "Gothic, the ‘French work’, is France’s best-known contribution to medieval art and the setting of its religious and royal life from Saint-Denis to Reims."
contested = "A loose rendering: the game’s Masonry and Architecture give buildings HP and armour, whereas Gothic’s advance lay in height and light. The spread of the style abroad by French masters is a team-bonus-type trait, but the team slot goes to the University of Paris (see the team bonus), and Gothic stays a passive for French building at home."

[[bonus]]
text = "Mill technologies free"
kind = "economic"
level = 1
change = "kept"
precedent = "Mill technologies free (Franks)"
basis = "Carolingian estate management is well documented: the bipartite manor and the Polyptych of Irminon of Saint-Germain-des-Prés (c. 823–829), which records dozens of water mills (farinarii) on the abbey’s estates; the heavy plough and three-field rotation spread in northern France, and later came the seigneurial mill (moulin banal) that tenants had to use (Bloch 1935)."
relevance = "The manorial grain economy of northern France fed the most populous kingdom of Latin Europe and paid for its knights."
contested = "The pace at which the heavy plough and three-field rotation spread."

[[bonus]]
text = "Mounted Units +20% HP starting in Feudal Age"
kind = "military"
level = 1
change = "kept"
precedent = "Mounted Units +20% HP starting in Feudal Age (Franks)"
basis = "Frankish and French heavy cavalry: the capitulary of Thionville (805) required a mail shirt (brunia) from every holder of twelve mansi; Philip Augustus’s knights decided the battle of Bouvines (1214; William the Breton). Their protection grew by stages: mail, then, from the later 13th century and through the 14th, mail with a coat of plates and plate limb defences, and full plate harness only from about 1400–1420, in which the men-at-arms of the 15th-century ordinance companies rode; horse armour, earlier of mail or padded cloth and in the 15th century of plate (chanfron, peytral, crupper), was worn by the horses of the wealthier men-at-arms, not by those of most riders, and the archers and coutiliers of the lances wore brigandines or padded jacks (Blair, European Armour, 1958; Contamine 1980). The knightly ethos of chivalry, French above all in its literature (the romances of Chrétien de Troyes, c. 1170–90; Geoffroi de Charny’s Livre de chevalerie, c. 1350), belongs to the same trait (Keen, Chivalry, 1984; Kaeuper and Kennedy, The Book of Chivalry of Geoffroi de Charny, 1996)."
relevance = "The armoured knight and his chivalric ethos are the image of medieval France, from the crusades to the gendarmerie."
contested = "An abstraction: +20% HP for every mounted unit from the Feudal Age generalises what was true of the best-equipped men-at-arms, whose plate and barded horses belong mostly to the 15th century; light horse and the mounted archers of the lances were much less protected."

[[bonus]]
text = "Castles cost -15/25% in Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Castles cost -15/25% in Castle/Imperial Age (Franks)"
basis = "Castles multiplied in France from the late 10th century, when counts such as Fulk Nerra of Anjou ringed their lands with them; the Capetian kings built the Louvre, Dourdan and the great donjon of Vincennes, whose works resumed under John II in 1361 and were completed under Charles V c. 1369–70 (Mesqui 1991–93)."
relevance = "The spread of castles around the year 1000 reshaped French lordship and society; France is the classic land of the castle."
contested = "How sudden and how ‘revolutionary’ the spread of castles around 1000 was (Duby against Barthélemy)."

[team_bonus]
text = "Universities work +80% faster"
level = 1
change = "new"
replaces = "Knight-line +2 line of sight"
precedent = "Universities work +80% faster (Malians team bonus); several other designs reuse it for their schools, each on its own history, and identical team-wide effects count once per team (RULES 6.16.12)"
basis = "The University of Paris, recognised by Philip Augustus’ privilege of 1200 and given its first statutes by the legate Robert de Courçon in 1215, drew masters and students from all of Latin Christendom: its arts faculty was organised in four ‘nations’, one of them the English (later German) nation, foreign masters such as Albert the Great and Thomas Aquinas taught there, and it was the model for the universities of the Empire (Prague 1348, Vienna 1365, Heidelberg 1386) (Rashdall, The Universities of Europe in the Middle Ages, 1895, ed. Powicke and Emden 1936; Verger, Les universités au Moyen Âge, 1973). A team bonus because Paris trained the clerics and scholars of its neighbours and allies (RULES 6.2: transferred knowledge). The line-of-sight bonus it replaces had no identifiable basis."
relevance = "Paris was the intellectual centre of Latin Christendom for three centuries and trained much of its learned clergy."
contested = "Other French traits that benefited neighbours were weighed and not used: the analysis’ ‘Oriflamme’ fails RULES 6.2, since the royal banner benefited only the French; the Champagne fairs of the 12th–13th centuries, where Italian and Flemish merchants met, would need a trade-gold effect, which in this region is reserved for the Burgundians’ Bruges trade (level-1 review, section 3.2), so the fairs stay in the basis of Guilds; and the French knights of the crusades and the Reconquista would weigh less across the window than Paris."

[[unique_unit]]
name = "Throwing Axeman"
model = "Throwing Axeman"
building = "Castle"
level = 1
change = "kept"
basis = "The francisca, the Frankish throwing axe: Procopius describes it (Wars VI.25, the Frankish invasion of Italy in 539), Gregory of Tours shows axes in Frankish hands (Histories II.27, the ewer of Soissons), Isidore of Seville explains the name (Etymologiae XVIII.6.9), and axes are found in graves such as Childeric I’s at Tournai (481/482)."
relevance = "The francisca, named after the Franks (Isidore of Seville), is the emblem of the people who conquered Gaul under Clovis and their best-known weapon."
contested = "The francisca went out of use around the 7th–8th centuries, so the unit represents the Merovingian origins of the civ, not the France of the knights."

[[unique_tech]]
name = "Ordonnance Companies"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Knight-line costs -60% gold"
level = 1
change = "changed"
replaces = "Ordonnance Companies (Castle unique tech, Mounted Crossbowmen cost -40% gold)"
precedent = "Szlachta Privileges (Knight-line costs -60% gold) (Poles): an existing unique tech, shared with an identical effect and age (Castle Age, as in the game) and moved to the Town Center under the name of the Franks’ own Ordonnance Companies, whose game effect targeted the Mounted Crossbowman line, and gives the discount to the men-at-arms, the companies’ better-documented core; the Poles’ design keeps Szlachta Privileges at the Town Center and the Swedes’ design shares it as Alsnö Stadga, each on its own history (RULES 6.7, 6.16.12)"
basis = "The Ordinance of Orléans (2 November 1439) reserved to the king the raising of troops and the taille that paid them, which was thereafter levied every year without the Estates’ consent; on that basis Charles VII’s ordinance of 1445 created fifteen companies of 100 ‘lances’ (a man-at-arms, a coutilier, a page and two mounted archers, some with bows and some with crossbows, plus a valet), keeping the best of the écorcheurs in pay and dismissing the rest: the first permanent royal army of France and one of the first standing armies in Europe (Contamine 1972; cf. Mallett 1974). At the Town Center because the reform rested on the crown’s monopoly of armed force and of the tax that paid for it, a state matter (RULES 6.2); the effect renders the army that tax paid for, its gold discount a force paid by the crown, and the Knight-line renders the men-at-arms (gendarmes) at the head of each lance, the heavy cavalry at the core of the companies; the mounted archers of the lances, who usually dismounted to shoot, stay with the foot Archer line. The francs-archers of 1448, one archer per parish exempted from the taille, are not given a tech of their own: an uneven militia, mocked in the ‘Franc-archer de Bagnolet’ and disbanded after Guinegate (1479), they fail the relevance test beside the companies."
relevance = "The tax-paid companies gave the French crown its first standing army and a monopoly of armed force, curbed the plundering écorcheurs and, with the royal artillery, won back Normandy (1449–50) and Guyenne (1453)."
contested = "The fiscal reading and the 1439 taille (see the civ-level contested list). The game’s Ordonnance Companies discounted the Mounted Crossbowman line, which this design keeps without the discount: the men-at-arms are the companies’ better-documented core. With the mounted HP passive, the discount makes the Frankish Knight-line very cost-efficient; N1 does not promise balance (RULES 6.14), and the N2 diversification pass of Town Center techs (RULES 6.16.12) can revisit the shared effect."

[[unique_tech]]
name = "Bureau Brothers"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Siege Workshop Units move +50% faster"
level = 1
change = "new"
replaces = "Chivalry (Stables work +40% faster), in the Castle slot"
precedent = "Drill (Siege Workshop Units move +50% faster) (Mongols): an existing unique tech, shared and renamed with an identical effect and age"
basis = "Jean Bureau and his brother Gaspard, who ran Charles VII’s artillery from the 1440s, built up the royal siege train: in the reconquest of Normandy (1449–50) its guns forced the surrender of town after town, among them Harfleur, Caen and Cherbourg, so that the duchy fell in about a year, and at Castillon (17 July 1453) Jean Bureau’s entrenched artillery park broke Talbot’s attack and ended the English hold on Guyenne (Contamine 1972). Faster Siege Workshop units render the speed with which the train moved from siege to siege. A datable military reform, so at the Castle (RULES 6.2), in the Imperial Age after the Ordonnance Companies (1445), which also puts the civ’s techs in chronological order; the analysis proposed the tech."
relevance = "The royal artillery won back Normandy and Guyenne and decided Castillon (1453), the last battle of the Hundred Years War; the Bureau brothers are its best-known names."
contested = "How much the guns decided: many Norman towns also fell to blockade, negotiation and their own townsmen (Rouen rose against its English garrison in 1449), and the artillery’s part at Formigny (1450) was less direct."

[tree]
add = ["Keep", "Arbalester", "Ring Archer Armor", "Guilds"]
remove = ["Siphons"]

[tree.basis]
"Keep" = "France has some of the earliest stone halls and keeps (Doué-la-Fontaine, a hall turned into a keep c. 950; Langeais; Loches), and Philip Augustus (1180–1223) carried the great tower across the royal domain with round towers built to a common design, the ‘tours philippiennes’: the Grosse Tour of the Louvre (c. 1190–1202), Gisors and, after the conquest of 1204, Rouen and Falaise (Mesqui 1991–93; Baldwin 1986). In the game the Franks were the only civ of their region without the Keep."
"Arbalester" = "France fielded crossbowmen in numbers: the Master of Crossbowmen (maître des arbalétriers) commanded the king’s foot and engineers from Louis IX’s reign until the office was abolished in 1534, towns kept crossbow companies, and Genoese crossbowmen were hired in thousands in the 14th century (Contamine 1980). French missile troops were numerous despite the English image of Crécy (RULES 6.16.3: crossbow evidence)."
"Ring Archer Armor" = "Late medieval crossbowmen and archers wore brigandines or padded jacks and fought behind large pavises. Added although it brings the tree closer to the English one: the item rests on this period evidence, and no trim for differentiation was applied to it (the recommended default of the region’s differentiation question, level-1 review, section 7). Bracer is not added, because Arbalester and Ring Archer Armor already bring the archers of this cavalry civ close to the archer civs’, and Bracer would also strengthen its cheap castles."
"Guilds" = "Étienne Boileau’s Livre des métiers (c. 1268) recorded the statutes of about a hundred Paris crafts, and the Champagne fairs of the counts of Champagne (Troyes, Provins, Lagny, Bar-sur-Aube) were the great market of 12th–13th-century Europe, before they declined after the county passed to the Crown."
"Siphons" = "Named after the Byzantine fire siphon, the projector of Greek fire, a state secret never to be given to another nation (De Administrando Imperio 13); its game effect, an explosive charge for fire ships, has no medieval Western equivalent. The fire-ship line itself stays as the engine’s convention for close-range incendiary warships. Navy tier (RULES 6.16.1): a fleet of ships, from the royal galleys built at the Clos des Galées of Rouen (founded under Philip IV in the 1290s) and the fleets of the Hundred Years War (Arnemuiden, 1338; Sluys, 1340) to the fleet of Charles VIII, whose ship guns bombarded the Aragonese (Neapolitan) landing force at Rapallo while Swiss and French infantry attacked it (1494; Guicciardini, Storia d’Italia I), the basis of the Cannon Galleon. The Galleon stays as the skeleton’s flagged abstraction (RULES 6.16.2)."

[architecture]
set = "Western European"
change = "kept"
basis = "Gothic was a French creation (Abbot Suger’s Saint-Denis, 1140s; the cathedrals of the Île-de-France; a German chronicler of c. 1280, Burchard of Hall, called it opus francigenum), and France was a major centre of Romanesque (Cluny, the pilgrimage churches), a pan-European style with early centres also in Lombardy, Catalonia and Ottonian Germany; add the Loire keeps and the castles of the Capetian kings."

[[dropped]]
item = "Chivalry (Stables work +40% faster)"
kind = "unique_tech"
reason = "RULES 6.2: chivalry is a structural ethos, formed over the 11th–12th centuries and expressed in literature from Chrétien de Troyes (c. 1170–90) to Charny (c. 1350) (Keen, Chivalry, 1984), not a datable reform, and a structural trait belongs in a passive; the knightly tradition already holds one (Mounted Units +20% HP), whose basis names it. The stable speed was a generic translation (rated ‘abstraction’). Its Castle slot goes to the Bureau Brothers, a datable military reform the civ lacked; its fame in the game does not keep it as a third tech (RULES 6.9). The Poles’ design takes over the same effect as Wojsko Zaciężne."
