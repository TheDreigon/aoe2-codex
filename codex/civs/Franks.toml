civ = "Franks"
name = "Franks"
status = "reviewed"
label = "Cavalry civilization"
summary = "The Frankish kingdoms and France (481–1500): knights, mills, cheap castles and the Throwing Axeman stay, Gothic building replaces the forager bonus, the University of Paris the team bonus, Ordonnance Companies moves to the Town Center and makes the men-at-arms cheaper and the Bureau Brothers take Chivalry’s Castle slot."
ideas = [
  "N3: Split into ‘Franks’ (481–987: Throwing Axeman, Carolingian elite cavalry, capitularies, infantry-based Merovingian armies) and ‘French’ (987–1500: knights and castles, crusades, Ordonnance Companies, francs-archers, the Bureau brothers’ artillery).",
  "N2: A Carolingian elite cavalry unit (the scarae of the Royal Frankish Annals, equipped as the capitulary of Thionville, 805, demands) and an angon throw for the Throwing Axeman (Agathias).",
  "N2: Split the Archer and Crossbowman lines (RULES section 10): French missile troops were mostly crossbowmen in the 13th–14th centuries (the Master of Crossbowmen, the town companies, the hired Genoese), while the bow spread in the 15th (the archers of the ordinance companies; the francs-archers of 1448, ‘archer ou arbalestrier’).",
  "N2: A couched-lance technique tech for cavalry (Blacksmith granularity, RULES section 10): the couched lance of the Frankish and Norman knights of the 11th century lies behind the irresistible charge that Anna Komnene describes.",
]
contested = [
  "The name: ‘Franks’ fuses the Frankish kingdoms and medieval France. The codex keeps the game’s name (level-1 review, sections 6 and 9, CQ16; RULES 6.16.15): the renames decided in the level-1 review were limited to the English, Anglo-Saxons and Arabs (the game’s Britons, Saxons and Saracens), beside the earlier renames of RULES section 4, and every other civ keeps its game name. The name is a compromise: ‘Franks’ is standard for the Merovingian and Carolingian kingdoms, and Byzantines and Muslims called the Latins of the crusading era Franks (Frangoi, Ifranj), while English scholarship calls the kingdom of 987–1500, the design core, French. Splitting Franks and French is the N3 idea.",
  "Heinrich Brunner’s and Lynn White’s theses (Charles Martel’s cavalry, the stirrup and the origins of feudalism), now largely rejected (Bachrach, 1970; Fouracre, 2000): Frankish heavy cavalry grew gradually in the 8th–9th centuries.",
  "The ‘feudal revolution’ or ‘castle revolution’ around the year 1000 (Duby, Bois, Bonnassie and Bisson against Barthélemy; the Past & Present debate opened by Thomas Bisson, 1994–97).",
  "Langeais (c. 994): a keep or a residential hall (aula)? Impey and Lorans (1998) read the stone building as a late 10th-century hall, and Doué-la-Fontaine was a hall turned into a keep c. 950 (Michel de Boüard’s excavations); the date of Langeais is also debated (Fulk Nerra’s c. 994 or a late 11th-century rebuilding).",
  "The date (732 or 733), aim and meaning of the battle of Poitiers; the Franks fought it on foot (Mozarabic Chronicle of 754).",
  "The speed with which the heavy plough and three-field rotation spread.",
  "Whether the compagnies d’ordonnance were the first standing army in Europe: they were the first permanent royal army of France, but Venice and Milan kept permanent forces earlier in the 15th century (Mallett 1974); the ordinance of 1445 is known only from chroniclers.",
  "Whether 1439 made the taille permanent: the Ordinance of Orléans (2 November 1439) reserved the raising of troops and of the taille to the king, and the taille for the army was then levied every year without the Estates’ consent; no single act made it permanent (Contamine 1972). This design reads the ordinance companies as above all a fiscal and governmental reform, hence the Town Center.",
  "The Mounted Crossbowman line (kept, with Heavy Mounted Crossbowman and Cranequins). Shared basis (level-1 review, section 11): the line stays where mounted crossbowmen are documented as a regular troop type of the civ’s armies. Most of them rode to the fight and shot on foot, as everywhere in Europe; the line stands for mobile crossbowmen, and level 2 can give it a mode that dismounts to shoot, as the English design proposes for its mounted archers. France had crossbow cavalry as a troop type, from Philip Augustus’ balistarii equites (Baldwin 1986) to the arbalestriers à cheval of the royal armies (Contamine 1972) and the cranequiniers of the later 15th century, named after the rack-and-pinion cranequin, which keeps Cranequins. A lead for shooting from the saddle is still unchecked: a passage of Jean d’Auton’s Chroniques de Louis XII for 1500 (ed. R. de Maulde La Clavière, 1889–95), put forward as showing a French horseman aiming a spanned crossbow. Ordonnance Companies, whose game effect targeted the line, targets the Knight-line instead (see the tech).",
]
open_questions = []

