window = "581–1500 (design core: the Song, 960–1279, and the early Ming, 1368–c. 1450)"
sources = [
  "Zeng Gongliang et al., Wujing Zongyao (1044)",
  "Du You, Tongdian (801)",
  "Chen Gui and Tang Shou, Shoucheng lu (12th century)",
