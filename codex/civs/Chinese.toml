[[bonus]]
text = "Start with +3 Villagers, but -50 wood and -200 food"
kind = "economic"
level = 1
change = "kept"
precedent = "Start with +3 Villagers, but -50 wood and -200 food (Chinese); Start with +1 Villager, but -50 food (Mayans)"
basis = "The largest registered population of the medieval world: the Tang census of 754 counted about 53 million people, and Song registers of c. 1100 imply more than 100 million (Cambridge History of China, vols. 3 and 5). A fair abstraction of demographic weight."
relevance = "Demographic weight underlies the whole of Chinese history: it filled the tax registers and the mass armies of every dynasty."

[[bonus]]
text = "Technologies cost -5/10/15% in Feudal/Castle/Imperial Age"
kind = "economic"
level = 1
change = "kept"
precedent = "Technologies cost -5/10/15% in Feudal/Castle/Imperial Age (Chinese)"
basis = "An abstraction of the state's technical and documentary apparatus: woodblock printing (the dated Diamond Sutra of 868), movable type (Bi Sheng, c. 1040, recorded by Shen Kuo), the magnetic compass at sea (Zhu Yu, 1119) and state arsenals such as the Directorate of Weapons (Junqi jian, 1073) (Needham)."
relevance = "Printing, state arsenals and a literate bureaucracy are among the defining achievements of Tang–Song China."
contested = "It risks the stereotype of a timelessly “inventive China”; the link is legitimate as long as it stands for institutions (printing, arsenals, the examination-recruited bureaucracy of the Song) rather than for national genius."

[[bonus]]
text = "Town Centers +7 line of sight and provide +15 population space"
kind = "other"
level = 1
change = "kept"
precedent = "Town Centers +7 line of sight and provide +15 population space (Chinese)"
basis = "Walled county and prefectural seats (xian, zhou) were the nodes of a dense administrative and fiscal grid, and frontier beacon towers (fenghuo) relayed warnings over long distances. An abstraction of administrative and demographic density; the line-of-sight link is weak but harmless."
relevance = "The grid of walled county seats was the frame of the bureaucratic empire, China's most enduring institution."

[[bonus]]
text = "Archer-line attacks +15% faster starting in Castle Age"
kind = "military"
level = 1
change = "new"
replaces = "Fire Lancers and Fire Ships move +5/10% faster in Castle/Imperial Age"
precedent = "Foot Archers attack +18% faster (Ethiopians); Thumb Ring: Archery Units attack +15% faster (generic tech)"
basis = "The heavy single-shot crossbow was China's main infantry missile weapon: the Wujing Zongyao (1044) calls it the strong weapon of China that the surrounding peoples fear, and the Tongdian (801) prescribes ranks that shoot, step back to span and step forward again so that the shooting never stops. Song armies shot such volleys in the field: at Heshangyuan (1131) Wu Jie had picked men with strong bows and crossbows shoot in relays, the “standing-team arrows” (zhudui shi), and held off the Jin attacks (Song shi, biography of Wu Jie); the “divine-arm bow” (shenbi gong, 1068) added range and power (Needham and Yates 1994; Andrade 2016). Faster fire from the Castle Age stands for these rotating volleys, kept distinct from the repeating Chu Ko Nu. Nothing ties faster movement to fire-lance infantry or to fire ships: the replaced bonus was a balance device with no identifiable basis."
relevance = "The crossbow was China's signature infantry weapon for a millennium and the arm Song armies relied on against the horsemen of the north."
contested = "How widely rotating crossbow volleys were practised in the field, rather than prescribed in manuals, is debated; Wu Jie's “standing-team arrows” are among the clearest field cases, and Andrade (2016) presents the technique as a forerunner of the musket countermarch."

[team_bonus]
text = "Universities work +80% faster"
level = 1
change = "new"
replaces = "Farms +10% food"
precedent = "Universities work +80% faster (Malians team bonus)"
basis = "China schooled its neighbours. When Tang Taizong enlarged the Imperial Academy (Guozijian), Goguryeo, Baekje, Silla, Gaochang and Tibet sent the sons of their chiefs to study in it (Jiu Tang shu, Ruxue zhuan); Silla students passed the Tang examination for foreigners (Choe Chiwon, 874), and Japanese students such as Kibi no Makibi (in China 717–735) carried books and learning home. Goryeo adopted civil-service examinations in 958 on the advice of Shuang Ji, a Later Zhou official who had stayed in Korea (Goryeosa), and Đại Việt founded its Temple of Literature in 1070 and held its first examinations in 1075. A team bonus because Chinese schools, books and examinations shaped the states of Korea, Japan and Vietnam (RULES 6.2: transferred knowledge). The farm team bonus it replaces rested on Champa rice, a crop China received from Champa, not one it gave; the Song agricultural expansion goes to the tree instead (Champa Rice). The effect is reused by other designs; reuse is accepted in N1 and identical team effects count once per team (RULES 6.16.12). The other candidates with a benefit to neighbours, a trade effect for Song copper coin (the everyday money of 13th-century Japan) and “Monasteries work +20% faster” for the printed Song canon given to Goryeo (991), would repeat other designs' effects too."
relevance = "Chinese learning and the examination state, carried abroad by students and books, made the shared written culture of East Asia; China's role as its neighbours' teacher is part of its identity."

[[unique_unit]]
name = "Chu Ko Nu"
model = "Chu Ko Nu"
building = "Castle"
level = 1
change = "kept"
basis = "The repeating crossbow (lian nu) is attested from a 4th-century BC Chu tomb at Qinjiazui (Hubei) to the Wubei zhi (1621). The Sanguozhi credits Zhuge Liang with improving it, and Pei Songzhi's commentary describes his yuanrong, which shot ten iron bolts at once; hence the later name zhuge nu. It was light and short-ranged, used above all to defend walls and houses, sometimes with poisoned bolts (Needham and Yates 1994). Kept at the level-1 review's default, since the repeating crossbow's fame tips the borderline case (see relevance). A “Shenbi Crossbowman” on the Genoese Crossbowman model (strong against cavalry, as the Song heavy crossbow was against the Jin horse), after the “divine-arm bow” of 1068, remains the N1 alternative; sharing the model would be allowed (RULES section 5, reusing a unit's art: the unit as it is, with only a new name, is N1). Until then the heavy crossbow is carried by the Archer-line bonus and the N2 idea."
relevance = "Attested for two thousand years and tied to Zhuge Liang since the Sanguozhi, the repeating crossbow is the best-known form of China's signature weapon; it weighed less in battle than the heavy single-shot crossbow (see the Archer-line bonus), so this is a borderline case that its long fame tips (RULES 6.9)."
contested = "The decisive Chinese crossbow was the heavy single-shot type (see the Archer-line bonus and the N2 idea); the name duplicates the out-of-scope Shu's Bolt Magazine, and its romanisation is Wade-Giles (pinyin: Zhuge nu). The game's name is kept (the level-1 review's default); a rename would follow the plain pinyin of RULES 6.16.15."

[[unique_unit]]
name = "Dragon Ship"
model = "Dragon Ship"
building = "Dock"
level = 1
change = "kept"
basis = "Fire-throwing warships are real: the Wujing Zongyao (1044) describes the double-acting piston pump for “fierce fire oil” (menghuo you), and the Wuyue fleet used such oil against its rival in 919 (Needham). A longer-reaching, harder-hitting fire ship in place of the Fast Fire Ship is a fair abstraction of Chinese incendiary naval warfare, from Tangdao and Caishi (1161), where Song fleets burned and bombed the Jin invasion fleets, to Lake Poyang (1363), where Zhu Yuanzhang burned Chen Youliang's fleet with fire ships. Navy tier: a fleet of ships (RULES 6.16.1), resting on the Song standing river and coastal fleets (tower ships, haihu and paddle-wheel chechuan) and the early Ming fleets."
relevance = "Fleets fighting largely with fire saved the Southern Song from the Jin crossing in 1161 and won Zhu Yuanzhang, the future Hongwu emperor, mastery of the Yangtze at Poyang (1363)."
contested = "The name is misleading: “dragon boats” (longzhou) were imperial barges, such as Sui Yangdi's on the Grand Canal (605), or racing boats; the Song war types were the louchuan, mengchong, doujian, haihu and the paddle-wheel chechuan, and no name for a flamethrower ship type is attested before 1500 (the Wubei zhi of 1621 lists dragon-named fire craft such as the huolong chuan, “fire-dragon ship”, a late attestation). The game's name is kept with this note (the level-1 review's default)."

[[unique_tech]]
name = "Great Wall"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Walls, Watch Tower-line and Bombard Towers +30% HP"
level = 1
change = "kept"
precedent = "Great Wall: Walls, Watch Tower-line and Bombard Towers +30% HP (Chinese); the Koreans' design shares it as Eupseong, at the Town Center, and the Japanese design as Genko Borui, at the Castle (without the Bombard Towers)"
basis = "Walls were a constant of Chinese defence, but the tech is anchored on one datable moment: the Sui long walls, raised with mass levies against the Türks between 585 and 608 (Sui shu). Later works carry the same tradition: Song walled cities and Yu Jie's mountain fortresses in Sichuan, such as Diaoyucheng, which held the Mongols from 1243 to 1279 and before which Möngke died in 1259; Nanjing's brick-faced city wall (1366–1393); and, after the Tumu disaster (1449), Yu Zijun's rammed-earth line across the Ordos (1474) (Waldron 1990). The Bombard Tower clause fits the Ming. Walls as a whole are a structural trait; the tech stays paid rather than becoming a passive because the effect is large (RULES 6.2, step 4), and no separate walls passive is added, for the power budget."
relevance = "Walls were the backbone of Chinese defence and city life (cheng means both wall and city), and the Great Wall is the best-known emblem of China; weight and fame both pass the bar."
contested = "Waldron (1990): a single continuous Great Wall is a modern myth; the Tang and Song built no long walls, the largest border works of the 12th century were Jin (jiehao), and the Ming called their frontier walls bianqiang (“border walls”)."

[[unique_tech]]
name = "Rocketry"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Scorpions, Rocket Carts and Lou Chuans +25% attack; Lou Chuans fire rockets"
level = 1
change = "kept"
precedent = "Rocketry: Scorpions, Rocket Carts and Lou Chuans +25% attack; Lou Chuans fire rockets (Chinese)"
basis = "Gunpowder rockets are a Chinese invention. The Huolongjing (attributed to Jiao Yu and Liu Ji; preface 1412) describes rocket arrows and launchers, although its text grew after the preface (see contested), and the Wubei zhi (1621) shows the later Ming multiple launchers. In Korea, which took its gunpowder from China, rocket arrows (singijeon, standardised in 1448) were fired up to a hundred at a time from Munjong's hwacha of 1451; the first hwacha (1409) shot iron-fletched arrows from gun tubes. Bed crossbows (chuangzi nu), the Scorpions, were front-line Song weapons: a bolt from one killed the Liao commander Xiao Talin at Chanyuan in 1004. Tower ships (louchuan), documented from the Han to the Ming, carried the river fleets; they are the river-navy element that RULES 4 brings from the Three Kingdoms, and as siege warships they also fill the anti-building role of the Cannon Galleon, which is held back as a power choice, not a historical one: gun-armed early Ming warships are documented (a bowl-mouth gun of 1372 is inscribed for the Navy Left Guard, and Andrade reads shipboard guns at Lake Poyang in 1363), so RULES 6.16.1 would allow it (Needham 1986, 1994). Wu's Sitting Tiger (Traction Trebuchets and Lou Chuan trebuchet weapons fire additional projectiles), whose name matches the crouching-tiger pao of the Wujing Zongyao, stays with the out-of-scope Wu for the power budget (the level-1 review's default)."
relevance = "China invented gunpowder and the rocket, its gunpowder missile weapons are part of its identity, and the bed crossbow helped force the settlement of 1005."
contested = "When true rockets appeared is debated: the “fire arrows” (huojian) presented at court in 970 (Feng Jisheng) and 1000 (Tang Fu) were probably incendiary arrows. Tying rockets to bed crossbows mixes categories (an abstraction)."

[[unique_tech]]
name = "Tuntian"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Soldiers passively produce food"
level = 1
change = "new"
precedent = "Tuntian: Soldiers passively produce food (Wei); an existing unique tech of the out-of-scope Wei, moved to the Chinese and to the Town Center with an identical effect, as RULES 4 decides"
basis = "Military-agricultural colonies run through the history of imperial China: Cao Cao's of 196, revived on the Tang frontiers, and made the backbone of the early Ming garrison system (weisuo), in which soldiers farmed state land, about seven farming for three on guard on the frontier and eight for two in the interior (Ming shi, Shihuo zhi; Brook 2010). The Hongwu emperor is credited with the boast that he fed a million soldiers without costing the people a grain of rice. At the Town Center because the colonies were a state institution of land and revenue (RULES 6.2)."
relevance = "The colonies fed China's frontier armies from Cao Cao to the Ming; RULES 6.9 names the Tuntian as a trait that passes on weight alone."
contested = "The Ming military farms decayed during the 15th century through desertion and the seizure of land by officers; the system worked best in its first decades. The exact source of the Hongwu boast is uncertain."

[tree]
add = ["Hand Cannoneer", "Bombard Cannon", "Traction Trebuchet", "Siege Engineers", "Guilds", "Crop Rotation"]
remove = ["Trebuchet"]

[tree.basis]
"Hand Cannoneer" = "China invented the metal-barrelled gun: the Xanadu gun, inscribed 1298, is the oldest securely dated, and the Heilongjiang hand gun is dated by its context to c. 1288. Under the Hongwu emperor the Ming shi allots ten firearms to every company of a hundred men, and the Yongle emperor (r. 1402–1424) founded a firearms division, the Shenjiying, which the Ming shi says was set up to drill with the “divine-mechanism” gun methods obtained in the conquest of Jiaozhi (Đại Việt, 1407) (Ming shi, Bing zhi; Andrade 2016; see contested). Its absence was the most serious error of the current tree."
"Bombard Cannon" = "Early Ming foundries cast iron cannon: three cast-iron “general” guns dated 1377 survive in Shanxi, the oldest cast-iron cannon found in China (Hu Zhenqi 1982), and such pieces armed city walls and passes (Needham 1986; Andrade 2016). It also removes the incoherence of a Bombard Tower without a Bombard Cannon."
"Traction Trebuchet" = "The man-powered traction trebuchet (pao) was China's siege artillery from the Warring States until 1273 and stayed in use beside the counterweight engine afterwards: the Wujing Zongyao (1044) illustrates heavy engines with up to seven poles worked by large teams of pullers, and Chen Gui's Shoucheng lu, drawn from his defence of De'an (1132), sets the defenders' pao behind the walls against the besiegers' engines (Needham and Yates 1994). Moved from the out-of-scope Three Kingdoms (RULES 4); it replaces the counterweight Trebuchet. The light “whirlwind” pao of the same manual, the Song-era counterpart of the Ming Rocket Cart, is left out only by a design convention of this region (one Castle-Age blast weapon per civ: the Chinese Rocket Cart, the Jurchen Bomb Thrower, the Khitans' Whirlwind Pao), not for want of evidence. The convention mirrors the game, where none of the four civs that train the Rocket Cart (Chinese, Jurchens, Khitans, Koreans) has the Mangonel line; so the Khitans field that line as the Whirlwind Pao, a name from the Song manuals, while the Chinese, who keep the Rocket Cart, lack it (the Koreans' design, on the owner's sketch, keeps both). The Chinese stay without the Mangonel line (the level-1 review's default)."
"Siege Engineers" = "Chinese siegecraft was among the most advanced of its time: the Wujing Zongyao (1044) catalogues siege engines, assault towers and rams; Chen Gui's Shoucheng lu records the counter-siege craft of De'an (1132); and the early Ming took Suzhou (1366–1367) from wooden towers and three-storey platforms that overlooked the city, armed with crossbows and guns (Ming shi, biography of Zhang Shicheng)."
"Guilds" = "Song cities were organised in merchant and craft guilds (hang), and the state issued the first government paper money (jiaozi, 1024); a lower market fee is a fair abstraction of the Song commercial economy (Elvin 1973). Its absence was incoherent."
"Crop Rotation" = "Added and renamed Champa Rice (see the rename) for the Song agricultural expansion, which the game's farm team bonus stood for although it fails RULES 6.2 (see the team bonus). Twenty of the 56 current civs lack Crop Rotation; with it the Chinese farm economy is stronger in the Imperial Age than the current civ's (+175 food per new farm, against the 10% extra farm food of the lost team bonus). Power budget: against the current civ the design gains the Hand Cannoneer, Bombard Cannon, Traction Trebuchet, Siege Engineers, Guilds, Champa Rice, Tuntian and the Archer-line bonus, and loses the fire-lancer speed bonus, the counterweight Trebuchet and the farm team bonus; the Cannon Galleon, Elite Cannon Galleon, Carvel Hull and a walls passive stay out as power choices. No further trim (the level-1 review's default; N1 avoids absurdities but does not promise balance, RULES 6.14)."
"Trebuchet" = "The counterweight trebuchet reached China in 1273, when the Muslim engineers Ismail and Ala al-Din, sent to Kublai by the Ilkhan Abaqa, built the engines that broke Fancheng and Xiangyang (huihui pao, “Muslim trebuchet”; Yuan shi). The Song border prefectures copied it the same year (Song shi, Bing zhi), and it served for about a century, to the founding of the Ming: at Suzhou in 1367 Xu Da's army still set up “Xiangyang trebuchets” beside its guns (Ming shi). Its removal is a game-role choice, not a historical finding: both engines arrive in the Imperial Age with almost the same role, the native traction pao served China for the whole window (alone until 1273, beside the counterweight engine afterwards), and the Bombard Cannon carries early Ming siegecraft (RULES 6.11). Removed in N1 (the level-1 review's default): keeping it beside the pao would cost power, since it outranges and outhits it (range 16 against 14); restoring it as Xiangyang Pao, with a second, exclusive effect, is an N2 idea."

[[rename]]
from = "Crop Rotation"
to = "Champa Rice"
level = 1
basis = "In 1012 the Song court had 30,000 hu of Champa rice fetched from Fujian and given out as seed in the Jiangnan, Huainan and Liangzhe circuits, to be sown on the people's higher, drier fields (Song shi, Shihuo zhi): an earlier-ripening, drought-tolerant rice that extended paddy to higher ground and, in places, allowed two crops a year, while agricultural treatises spread the new methods (Chen Fu, Nongshu, 1149; Wang Zhen, Nongshu, 1313) (Elvin 1973; Bray 1984; see contested). Same effect (more food from each farm), as with Crop Rotation → Milpa."

[architecture]
set = "East Asian"
level = 1
change = "kept"
basis = "The set's timber halls, bracketing and glazed roofs are modelled on Chinese architecture itself."
