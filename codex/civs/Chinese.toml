civ = "Chinese"
name = "Chinese"
status = "draft"
label = "Archer and Gunpowder civilization"
summary = "One umbrella civ for China from the Sui to the early Ming (581–1500), weighted to the Song and early Ming: the demographic and technical economy, Chu Ko Nu, Dragon Ship, Great Wall and Rocketry are kept; the Chinese gain the hand cannon and bombard they invented, gun-armed ships, the native traction pao in place of the counterweight trebuchet, Siege Engineers, Guilds, Champa Rice and the Three Kingdoms' Tuntian as their Town Center tech; rotating crossbow volleys replace the unfounded fire-lancer speed bonus, and the team bonus now rests on China's schooling of its neighbours instead of Champa rice, which China received from Champa."
ideas = [
  "N3: Split the Chinese into Tang (581–907: Turkic, Sogdian and Korean generals, frontier cavalry, the Directorate of Herds), Song (960–1279: crossbows, early gunpowder, standing navy, horse shortage) and Ming (1368–: firearms divisions, Zheng He's fleets), as RULES 4 proposes.",
  "N2: A heavy crossbowman unique unit after Li Hong's “divine-arm bow” (shenbi gong, 1068): more range and attack, slower reload, stronger when ranks shoot together; the Chu Ko Nu would then become a cheap defensive unit (Wubei zhi, 1621).",
  "N2: A paddle-wheel warship (chechuan), independent of the wind, for the Song river fleets that stopped the Jin crossing of the Yangtze at Caishi (1161).",
  "N2: Shenjiying, the firearms division of the Yongle emperor: Hand Cannoneers fire faster in large groups (Mu Ying's successive lines of gunners against war elephants, 1388; Andrade 2016).",
  "N2: Huihui Pao, an Imperial tech that unlocks the counterweight Trebuchet with a second, exclusive effect (RULES 6.6), for 1273, when Ismail and Ala al-Din built it for Kublai before Xiangyang and the Song border prefectures copied it the same year (Yuan shi; Song shi, Bing zhi).",
  "N2: Mo dao infantry: Tang long two-handed blades used against cavalry (Li Siye at Xiangji, 757).",
  "N3: The Grand Canal (Sui, 605–611) as a unique trade structure linking Markets and Docks.",
  "N3: The examination system (keju) and state paper money (jiaozi, 1024) as distinct economic and administrative mechanics.",
]
contested = [
  "The date of the invention of gunpowder (a Daoist alchemical warning attributed to the 9th century is hard to date; the first published formulas are in the Wujing Zongyao, 1044) and of the first true rockets (12th–13th century).",
  "The scale of the Song “medieval economic revolution”, its agriculture included (M. Elvin, R. Hartwell), against more moderate readings.",
  "Whether the Yuan (1271–1368) counts as a Chinese dynasty or as part of the Mongol empire; this civ takes from the Yuan years only what the Ming inherited (the metal-barrelled gun), not the Yuan rulers.",
  "The continuous “Great Wall” as a modern construct: A. Waldron (1990) argues that the brick wall of the icon is largely 16th-century Ming and that the Tang and Song built no long walls.",
  "Population figures (Tang census of 754; Song registers of c. 1100) are fiscal registrations, not head counts.",
  "Firearms aboard ship at Lake Poyang (1363) are T. Andrade's reading (2016) of terse sources that also describe fire ships and incendiaries.",
  "The Yuan shi biography of Guo Kan, said to have gone west with Hülegü, is embellished (it has him take Mecca and reach Egypt); the Persian sources are the firmer evidence for Chinese siege crews in the Mongol west.",
]
open_questions = [
  "Power budget: against the current civ the Chinese gain Hand Cannoneer, Bombard Cannon, Cannon Galleon, Traction Trebuchet, Siege Engineers, Guilds, Crop Rotation (as Champa Rice), Tuntian and a free Archer-line attack-speed bonus, and lose the fire-lancer speed bonus, the counterweight Trebuchet and the Farms +10% team bonus. Already held back: the walls passive of the first draft (the Great Wall stays a paid tech), the Elite Cannon Galleon and Carvel Hull. Trim further? In order of historical weakness: hold back the Cannon Galleon (its heavy-gun role is 16th-century), scale the Archer-line bonus to +10/15% in Castle/Imperial Age, or hold back Siege Engineers.",
  "Team bonus: “Universities work +80% faster”, for the Tang academy and the examinations copied by Korea and Vietnam, makes it the team bonus of four civs (Malians, Franks, Poles, Chinese). Alternatives that also show a benefit to neighbours: “Trade Units generate +10% gold” for Song copper coin, the everyday money of 13th-century Japan; “Monasteries work +20% faster” for the printed Song canon given to Goryeo (991) and brought to Japan by Chōnen (986), an effect the Khitans already use; or the old “Farms +10% food” re-based on crops and methods that went abroad (cotton seed taken from Yuan China to Goryeo by Mun Ik-jeom, 1363), a thinner case. Which?",
  "Counterweight Trebuchet: removed, so that the native Traction Trebuchet and the new Bombard Cannon carry Chinese siege (the Huihui Pao becomes an N2 idea). Alternative: keep it beside the Traction Trebuchet, renamed Huihui Pao, for the Yuan and early Ming; both arrive in the Imperial Age, and it outclasses the pao for sieges.",
  "Names: the Chu Ko Nu keeps its Wade-Giles name (the pinyin “Zhuge Nu” would match Lou Chuan and Tuntian), and the Dragon Ship keeps its name for want of an attested name for a flamethrower ship (longzhou were barges). Rename either?",
  "Cavalry: the tree keeps the Song–Ming picture (no Hussar, no Heavy Cavalry Archer), which under-represents Tang cavalry. Accept until the N3 Tang/Song/Ming split?",
]

[profile]
entity = "China under the Sui, Tang, Song and early Ming dynasties, including the Five Dynasties and the Yuan interval"
region = "China proper: the Yellow River and Yangtze basins and the south"
window = "581–1500 (design core: the Song, 960–1279, and the early Ming, 1368–c. 1450)"
sources = [
  "Zeng Gongliang et al., Wujing Zongyao (1044)",
  "Du You, Tongdian (801)",
  "Chen Gui and Tang Shou, Shoucheng lu (12th century)",
  "Jiao Yu and Liu Ji (attrib.), Huolongjing (preface 1412)",
  "Jiu Tang shu (945); Song shi (1345); Yuan shi (1370)",
  "Ming shi, Bing zhi and Shihuo zhi (1739)",
  "J. Needham et al., Science and Civilisation in China, vol. 5 part 7, The Gunpowder Epic (1986), and part 6, Missiles and Sieges (1994)",
  "T. Andrade, The Gunpowder Age: China, Military Innovation, and the Rise of the West in World History (2016)",
  "D. Graff, Medieval Chinese Warfare, 300–900 (2002)",
  "P. Lorge, War, Politics and Society in Early Modern China, 900–1795 (2005)",
  "M. Elvin, The Pattern of the Chinese Past (1973)",
  "A. Waldron, The Great Wall of China: From History to Myth (1990)",
  "T. Brook, The Troubled Empire: China in the Yuan and Ming Dynasties (2010)",
  "The Cambridge History of China, vols. 3, 5, 6, 7",
]

[[bonus]]
text = "Start with +3 Villagers, but -50 wood and -200 food"
kind = "economic"
level = 1
change = "kept"
precedent = "Start with +3 Villagers, but -50 wood and -200 food (Chinese); Start with +1 Villager, but -50 food (Mayans)"
basis = "The largest registered population of the medieval world: the Tang census of 754 counted about 53 million people, and Song registers of c. 1100 imply more than 100 million (Cambridge History of China, vols. 3 and 5). A fair abstraction of demographic weight."
relevance = "Demographic weight underlies the whole of Chinese history: it filled the tax registers and the mass armies of every dynasty."

[[bonus]]
text = "Technologies cost -5/10/15% in Feudal/Castle/Imperial Age"
kind = "economic"
level = 1
change = "kept"
precedent = "Technologies cost -5/10/15% in Feudal/Castle/Imperial Age (Chinese)"
basis = "An abstraction of the state's technical and documentary apparatus: woodblock printing (the dated Diamond Sutra of 868), movable type (Bi Sheng, c. 1040, recorded by Shen Kuo), the magnetic compass at sea (Zhu Yu, 1119) and state arsenals such as the Directorate of Weapons (Junqi jian, 1073) (Needham)."
relevance = "Printing, state arsenals and a literate bureaucracy are among the defining achievements of Tang–Song China."
contested = "It risks the stereotype of a timelessly “inventive China”; the link is legitimate as long as it stands for institutions (printing, arsenals, the examination-recruited bureaucracy of the Song) rather than for national genius."

[[bonus]]
text = "Town Centers +7 line of sight and provide +15 population space"
kind = "other"
level = 1
change = "kept"
precedent = "Town Centers +7 line of sight and provide +15 population space (Chinese)"
basis = "Walled county and prefectural seats (xian, zhou) were the nodes of a dense administrative and fiscal grid, and frontier beacon towers (fenghuo) relayed warnings over long distances. An abstraction of administrative and demographic density; the line-of-sight link is weak but harmless."
relevance = "The grid of walled county seats was the frame of the bureaucratic empire, China's most enduring institution."

[[bonus]]
text = "Archer-line attacks +15% faster starting in Castle Age"
kind = "military"
level = 1
change = "new"
replaces = "Fire Lancers and Fire Ships move +5/10% faster in Castle/Imperial Age"
precedent = "Foot Archers attack +18% faster (Ethiopians); Thumb Ring: Archery Units attack +15% faster (generic tech)"
basis = "The heavy single-shot crossbow was China's main infantry missile weapon: the Wujing Zongyao (1044) calls it the strong weapon of China that the surrounding peoples fear, and the Tongdian (801) prescribes ranks that shoot, step back to span and step forward again so that the shooting never stops; the Song “divine-arm bow” (shenbi gong, 1068) added range and power (Needham and Yates 1994; Andrade 2016). Faster fire from the Castle Age stands for these rotating volleys, kept distinct from the repeating Chu Ko Nu. The speed bonus for fire lances and fire ships had no basis: the fire lance was a short-range, single-shot weapon of sieges and sorties (De'an, 1132)."
relevance = "The crossbow was China's signature infantry weapon for a millennium and the arm Song armies relied on against the horsemen of the north."
contested = "How far rotating crossbow volleys were practised in the field, rather than prescribed in manuals, is debated; Andrade (2016) presents them as a forerunner of the musket countermarch."

[team_bonus]
text = "Universities work +80% faster"
level = 1
change = "new"
replaces = "Farms +10% food"
precedent = "Universities work +80% faster (Malians team bonus)"
basis = "China schooled its neighbours. When Tang Taizong enlarged the Imperial Academy (Guozijian), Goguryeo, Baekje, Silla, Gaochang and Tibet sent the sons of their chiefs to study in it (Jiu Tang shu, Ruxue zhuan); Silla students passed the Tang examination for foreigners (Choe Chiwon, 874), and Japanese students such as Kibi no Makibi (in China 717–735) carried books and learning home. Goryeo adopted civil-service examinations in 958 on the advice of Shuang Ji, a Later Zhou official who had stayed in Korea (Goryeosa), and Đại Việt founded its Temple of Literature in 1070 and held its first examinations in 1075. A team bonus because Chinese schools, books and examinations shaped the states of Korea, Japan and Vietnam (RULES 6.2: transferred knowledge). The old farm bonus rested on Champa rice, a crop China received from Champa, not one it gave; the Song agricultural expansion now goes to the tree (Champa Rice)."
relevance = "Chinese learning and the examination state, carried abroad by students and books, made the shared written culture of East Asia; China's role as its neighbours' teacher is part of its identity."

[[unique_unit]]
name = "Chu Ko Nu"
model = "Chu Ko Nu"
building = "Castle"
level = 1
change = "kept"
basis = "The repeating crossbow (lian nu, zhuge nu) is attested from a 4th-century BC Chu tomb at Qinjiazui (Hubei) to the Wubei zhi (1621); tradition links it to Zhuge Liang, who improved it (Sanguozhi), hence the name. It was light and short-ranged, used above all to defend walls and houses, sometimes with poisoned bolts (Needham and Yates 1994)."
relevance = "It stands for the crossbow, China's signature weapon for a millennium, in its most famous form; the repeating crossbow itself was secondary, so its fame with players tips the case (RULES 6.9)."
contested = "The decisive Chinese crossbow was the heavy single-shot type (see the Archer-line bonus and the N2 idea); the name duplicates the out-of-scope Shu's Bolt Magazine, and its romanisation is Wade-Giles (pinyin: Zhuge nu)."

[[unique_unit]]
name = "Dragon Ship"
model = "Dragon Ship"
building = "Dock"
level = 1
change = "kept"
basis = "Fire-throwing warships are real: the Wujing Zongyao (1044) describes the double-acting piston pump for “fierce fire oil” (menghuo you), and the Wuyue fleet used such oil against its rival in 919 (Needham). A faster, longer-reaching fire ship in place of the Fast Fire Ship is a fair abstraction of Chinese incendiary naval warfare, from Tangdao and Caishi (1161), where Song fleets burned and bombed the Jin invasion fleets, to Lake Poyang (1363), where Zhu Yuanzhang burned Chen Youliang's fleet with fire ships."
relevance = "Fleets fighting largely with fire saved the Southern Song in 1161 and won the Ming its empire at Poyang (1363)."
contested = "The name is misleading: “dragon boats” (longzhou) were imperial barges, such as Sui Yangdi's on the Grand Canal (605), or racing boats; the Song war types were the louchuan, mengchong, doujian, haihu and the paddle-wheel chechuan, and no attested name for a flamethrower ship type has been found."

[[unique_tech]]
name = "Great Wall"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Walls, Watch Tower-line and Bombard Towers +30% HP"
level = 1
change = "kept"
precedent = "Great Wall: Walls, Watch Tower-line and Bombard Towers +30% HP (Chinese)"
basis = "China's rulers walled both cities and frontiers. The Sui raised long walls with mass levies against the Türks (585–608, Sui shu); Song walled cities and Yu Jie's mountain fortresses in Sichuan held the Mongols for decades, Diaoyucheng from 1243 to 1279, with Möngke dying before it in 1259; the early Ming gave Nanjing a brick-faced city wall (1366–1393) and, after the Tumu disaster (1449), went back to frontier walls with Yu Zijun's rammed-earth line across the Ordos (1474) (Waldron 1990). The Bombard Tower clause fits the Ming. Kept as a paid Castle tech rather than turned into a free passive: long walls were datable state campaigns, not a constant trait (RULES 6.2)."
relevance = "Walls were the backbone of Chinese defence and city life (cheng means both wall and city), and the Great Wall is the best-known emblem of China; weight and fame both pass the bar."
contested = "Waldron (1990): a single continuous Great Wall is a modern myth; the Tang and Song built no long walls, and the largest border works of the 12th century were Jin (jiehao)."

[[unique_tech]]
name = "Rocketry"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Scorpions, Rocket Carts and Lou Chuans +25% attack; Lou Chuans fire rockets"
level = 1
change = "kept"
precedent = "Rocketry: Scorpions, Rocket Carts and Lou Chuans +25% attack; Lou Chuans fire rockets (Chinese)"
basis = "Gunpowder rockets are a Chinese invention: the Huolongjing (attributed to Jiao Yu and Liu Ji; preface 1412) describes true rockets, among them the two-stage “fire dragon issuing from the water”, and the Korean hwacha (1409, improved 1451), a contemporary derivative, already fired rocket arrows by the dozen from a cart; the Wubei zhi (1621) shows the later Ming multiple launchers. Bed crossbows (chuangzi nu), the Scorpions, were front-line Song weapons: a bolt from one killed the Liao commander Xiao Talin at Chanyuan in 1004. Tower ships (louchuan), documented from the Han to the Ming, carried the river fleets; they are the river-navy element that RULES 4 brings from the Three Kingdoms, and the Chinese already have the Lou Chuan (Needham 1986, 1994)."
relevance = "China invented gunpowder and the rocket; its gunpowder missile weapons are part of its identity, and the bed crossbow decided the war of 1004."
contested = "When true rockets appeared is debated: the “fire arrows” (huojian) presented at court in 969 and 1000 were probably incendiary arrows. Tying rockets to bed crossbows mixes categories (an abstraction)."

[[unique_tech]]
name = "Tuntian"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Soldiers passively produce food"
level = 1
change = "new"
precedent = "Tuntian: Soldiers passively produce food (Wei); an existing unique tech of the out-of-scope Wei, moved to the Chinese and to the Town Center with an identical effect, as RULES 4 decides"
basis = "Military-agricultural colonies run through the history of imperial China: Cao Cao's of 196, revived on the Tang frontiers, and made the backbone of the early Ming garrison system (weisuo), in which soldiers farmed state land, about seven farming for three on guard on the frontier and eight for two in the interior (Ming shi, Shihuo zhi; Brook 2010). The Hongwu emperor is credited with the boast that he fed a million soldiers without costing the people a grain of rice. At the Town Center because the colonies were a state institution of land and revenue (RULES 6.2)."
relevance = "The colonies fed China's frontier armies from Cao Cao to the Ming; RULES 6.9 names the Tuntian as a trait that passes on weight alone."
contested = "The Ming military farms decayed during the 15th century through desertion and the seizure of land by officers; the system worked best in its first decades. The exact source of the Hongwu boast is uncertain."

[tree]
add = ["Hand Cannoneer", "Bombard Cannon", "Cannon Galleon", "Traction Trebuchet", "Siege Engineers", "Guilds", "Crop Rotation"]
remove = ["Trebuchet"]

[tree.basis]
"Hand Cannoneer" = "China invented the metal-barrelled gun: the Heilongjiang hand gun (c. 1288) and the Xanadu gun dated 1298 are the oldest securely dated; under the Hongwu emperor the Ming shi allots ten firearms to every company of a hundred men, and the Yongle emperor (r. 1402–1424) created a firearms division, the Shenjiying (Andrade 2016). Its absence was the most serious error of the current tree."
"Bombard Cannon" = "Early Ming foundries cast iron cannon: three cast-iron “general” guns dated 1377 survive in Shanxi, the oldest cast-iron cannon found in China (Hu Zhenqi 1982), and such pieces armed city walls and passes (Needham 1986; Andrade 2016). It also removes the incoherence of a Bombard Tower without a Bombard Cannon."
"Cannon Galleon" = "An abstraction. Guns went to sea early in China: a bowl-mouth gun (wankou chong) dated 1372 is inscribed for the Navy Left Guard (shuijun zuowei), and Andrade reads the sources on Lake Poyang (1363) as showing firearms aboard ship (Andrade 2016). These were small anti-personnel pieces; warships that bombarded forts with heavy guns belong to the 16th century (the folangji copied after Tunmen, 1521, and Xicaowan, 1522), so the Elite Cannon Galleon is not added. Carvel Hull is not added either: its name belongs to a northern-European planking sequence and its speed effect has no specific Chinese counterpart."
"Traction Trebuchet" = "The man-powered traction trebuchet (pao) was China's siege artillery from the Warring States until 1273: the Wujing Zongyao (1044) illustrates heavy engines with up to seven poles worked by large teams of pullers, and Chen Gui's Shoucheng lu, drawn from his defence of De'an (1132), sets the defenders' pao behind the walls against the besiegers' engines (Needham and Yates 1994). Moved from the out-of-scope Three Kingdoms (RULES 4); it replaces the counterweight Trebuchet. In this region each civ keeps one Castle-Age blast weapon: the Chinese keep the Rocket Cart (the existing Mangonel substitute), the Jurchens the Bomb Thrower and the Khitans the light pao (see the Khitans' Whirlwind Pao), so the light pao is not added here."
"Siege Engineers" = "Song siegecraft was among the most advanced of its time: the Wujing Zongyao, Chen Gui's defence of De'an (1132, Shoucheng lu) and the siege of Xiangyang (1268–1273). Chinese siege crews were sought abroad: Möngke sent with Hülegü in 1253 a thousand households of Chinese catapult-men and naphtha-throwers (Juvaini; Rashid al-Din)."
"Guilds" = "Song cities were organised in merchant and craft guilds (hang), and the state issued the first government paper money (jiaozi, 1024); a lower market fee is a fair abstraction of the Song commercial economy (Elvin 1973). Its absence was incoherent."
"Crop Rotation" = "Added and renamed Champa Rice (see the rename): the Song agricultural expansion, which the old farm team bonus stood for. The Chinese were one of the few civs without it, and it offsets the loss of the Farms +10% team bonus."
"Trebuchet" = "The counterweight trebuchet reached China in 1273, when the Muslim engineers Ismail and Ala al-Din, sent to Kublai by the Ilkhan Abaqa, built the engines that broke Fancheng and Xiangyang (huihui pao, “Muslim trebuchet”; Yuan shi); the Song border prefectures copied it the same year (Song shi, Bing zhi). It served the Yuan and the early Ming for a few decades before guns replaced it, while the traction pao was China's artillery for most of the window. Both engines arrive in the Imperial Age and the counterweight one outclasses the pao for sieges, so keeping both would leave the native engine without a role; the Traction Trebuchet and the Bombard Cannon replace it (RULES 6.11), and the Huihui Pao becomes an N2 idea."

[[rename]]
from = "Crop Rotation"
to = "Champa Rice"
level = 1
basis = "In 1012 the Song court had 30,000 hu of early-ripening, drought-resistant Champa rice fetched from Fujian and given out as seed in the Jiang-Huai and Liangzhe circuits (Song shi, Shihuo zhi); quick-ripening rice let southern farmers take two crops a year, and agricultural treatises spread the new methods (Chen Fu, Nongshu, 1149; Wang Zhen, Nongshu, 1313) (Elvin 1973). Same effect (more food from each farm), as with Crop Rotation → Milpa."

[architecture]
set = "East Asian"
level = 1
change = "kept"
basis = "The set's timber halls, bracketing and glazed roofs are modelled on Chinese architecture itself."
