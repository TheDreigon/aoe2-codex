  "F. Bray, Agriculture, Science and Civilisation in China, vol. 6 part 2 (1984)",
  "Ho Ping-ti, “Early-Ripening Rice in Chinese History” (1956)",
  "T. Andrade, The Gunpowder Age: China, Military Innovation, and the Rise of the West in World History (2016)",
  "D. Graff, Medieval Chinese Warfare, 300–900 (2002)",
