civ = "Chinese"
name = "Chinese"
status = "draft"
label = "Archer and Gunpowder civilization"
summary = "One civ for China from the Sui to the early Ming (581–1500): it gains the hand cannon and bombard, the traction pao in place of the counterweight Trebuchet, Tuntian at the Town Center and crossbow volleys in place of the fire-lancer bonus, and its team bonus now rests on schooling its neighbours."
ideas = [
  "N3: Split the Chinese into Tang (581–907: Turkic, Sogdian and Korean generals, frontier cavalry, the Directorate of Herds), Song (960–1279: crossbows, early gunpowder, standing navy, horse shortage) and Ming (1368–: firearms divisions, Zheng He's fleets), as RULES 4 proposes.",
  "N2: A heavy crossbowman unique unit after Li Hong's “divine-arm bow” (shenbi gong, 1068): more range and attack, slower reload, stronger when ranks shoot together, as with Wu Jie's “standing-team arrows” at Heshangyuan (1131); the Chu Ko Nu would then become a cheap defensive unit (Wubei zhi, 1621).",
  "N2: A paddle-wheel warship (chechuan), independent of the wind, for the Song river fleets that stopped the Jin crossing of the Yangtze at Caishi (1161).",
  "N2: Shenjiying, the firearms division of the Yongle emperor: Hand Cannoneers fire faster in large groups (Mu Ying's successive lines of gunners against war elephants, 1388; Andrade 2016).",
  "N2: Xiangyang Pao, an Imperial tech that unlocks the counterweight Trebuchet with a second, exclusive effect (RULES 6.6), for the engines Ismail and Ala al-Din built for Kublai before Xiangyang (1273), copied by the Song border prefectures the same year (Song shi, Bing zhi) and still set up by Xu Da's army at Suzhou in 1367 (Ming shi); the Song and Yuan name, huihui pao, is left to the Mongols, for whom a Huihui Pao tech is a design option (RULES 6.16.18).",
  "N2: Guns at sea: a Dock tech that gives the Lou Chuan and the Galley-line a short-range gun attack against ships and crews, for the bowl-mouth guns of the early Ming navy (one dated 1372 is inscribed for the Navy Left Guard, shuijun zuowei) and the shipboard firearms Andrade reads at Lake Poyang (1363); it would render these documented ship guns while the Cannon Galleon stays out as a power choice (the Lou Chuan already fills the siege-warship role).",
  "N2: Mo dao infantry: Tang long two-handed blades used against cavalry (Li Siye at Xiangji, 757).",
  "N3: The Grand Canal (Sui, 605–611) as a unique trade structure linking Markets and Docks.",
  "N3: The examination system (keju) and state paper money (jiaozi, 1024) as distinct economic and administrative mechanics.",
  "N3: For the Song civ of the split, the Scenario Editor Flamethrower (RULES section 5; a slow, short-ranged siege weapon in the game data, whose look and role must be checked in game) as a model for the pump for “fierce fire oil” (menghuo you) that the Wujing Zongyao (1044) sets on city walls. Weighed for N1 and not used: both unique-unit slots are filled, no current borrowing fits poorly, and at sea the Dragon Ship already renders the pump.",
]
contested = [
  "The date of the invention of gunpowder (a Daoist alchemical warning attributed to the 9th century is hard to date; the first published formulas are in the Wujing Zongyao, 1044) and of the first true rockets (12th–13th century).",
  "The scale of the Song “medieval economic revolution”, its agriculture included (M. Elvin, R. Hartwell), against more moderate readings.",
  "How far Champa rice brought double cropping: Ho Ping-ti (1956) saw early-ripening rice spreading two harvests a year across the south from the Song on; F. Bray (1984) finds rice double cropping still limited in the Song. This design follows the cautious reading (more land and more food, double cropping only in places).",
  "Whether the Yuan (1271–1368) counts as a Chinese dynasty or as part of the Mongol empire; this civ takes from the Yuan years only what the Ming inherited (the metal-barrelled gun), not the Yuan rulers.",
  "The continuous “Great Wall” as a modern construct: A. Waldron (1990) argues that the brick wall of the icon is largely 16th-century Ming, that the Tang and Song built no long walls, and that the Ming themselves called their frontier walls bianqiang (“border walls”), not changcheng.",
  "Population figures (Tang census of 754; Song registers of c. 1100) are fiscal registrations, not head counts.",
  "Firearms aboard ship at Lake Poyang (1363) are T. Andrade's reading (2016) of terse sources that also describe fire ships and incendiaries.",
  "The received Huolongjing grew by accretion after its preface of 1412 (later parts are 17th-century), so its individual devices are hard to date; the two-stage “fire dragon issuing from the water” is best known from the Wubei zhi (1621) (Needham 1986).",
  "Where the Ming “divine-mechanism” guns came from: the Ming shi says the Yongle emperor obtained their method in the conquest of Jiaozhi (Đại Việt, 1407) and founded the Shenjiying to drill with them, while Sun Laichen (2003) argues that the main flow of gun technology ran from China to Đại Việt.",
  "Cavalry: the tree keeps the Song–Ming picture (no Hussar, no Heavy Cavalry Archer), which under-represents the frontier cavalry of the Tang, with its Turkic and Sogdian generals and the state horse herds (Graff 2002). Accepted until the N3 split into Tang, Song and Ming (the level-1 review's default; see ideas).",
]
open_questions = []

[profile]
