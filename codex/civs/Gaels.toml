civ = "Celts"
name = "Gaels"
original_name = "Celts"
status = "reviewed"
label = "Infantry civilization"
summary = "Celts reworked as the Gaels of Ireland and Scotland with the medieval Scottish kingdom (563–1500): a cattle-and-dairy economy and castle-taking infantry replace the invented siege identity, the Kern (Woad Raider renamed) is the unique unit, the Galloglass joins the Barracks, the Schiltron and Buannacht are the techs and the Irish missions the team bonus."
ideas = [
  "N2: Give the Kern a javelin thrown before melee (the Hearth Troop’s mechanism): kerns were javelin-armed light infantry (Gerald of Wales; English 16th-century descriptions).",
  "N3: Kern art without woad body paint (new art, RULES section 5): no medieval source describes Gaelic warriors painting themselves (see the unique unit).",
  "N2: A dedicated Galloglass unit (mail shirt, padded aketon, iron helmet, long-hafted sparth axe) instead of the renamed Varangian Guard, without its gold generation.",
  "N2: A cattle-raid (creach) mechanic: Infantry and Light Cavalry capture enemy livestock from a distance (Táin Bó Cúailnge; Kelly, Early Irish Farming, 1997).",
  "N3: A ‘Tower House’ building in Castle Age, for the thousands of small fortified towers built in Ireland and Scotland in the 15th and 16th centuries.",
  "N3: The West Highland galley (birlinn) as a regional warship for the Isles (Somerled, the Lords of the Isles).",
  "N3: A Brythonic civ (Welsh, Cornish, Bretons) beside the Gaels: Welsh archery and mountain warfare (Gerald of Wales), Owain Glyndŵr, the Breton captains of the Hundred Years War. It can take the name ‘Britons’, which the English rename frees (RULES section 4).",
]
contested = [
  "Whether ‘Celts’ is a useful category at all (Simon James, The Atlantic Celts, 1999; John Collis, The Celts, 2003); the reason for the narrower ‘Gaels’.",
  "How Gaelic the medieval kingdom of Scotland was: it was multilingual (Gaelic, Scots, the French of the elite, Norse in the north) and its 12th–14th-century aristocracy was largely of Anglo-Norman or Flemish origin (Bruce, Balliol, Comyn). The design includes the kingdom (RULES section 4): Bruce’s war had a Gaelic side (Carrick, Argyll and the Isles at Bannockburn in Barbour’s account; Edward Bruce’s Irish campaign of 1315–18 with Domnall Ó Néill), and without the kingdom the civ would lose its Castle tech and its only long-range siege. The elements that rest on the kingdom rather than on Gaelic Ireland are the Schiltron, the Bombard Cannon and the Cannon Galleon, the Knight and Cavalier, the siege engines kept in the tree (Trebuchet, Onager, Capped Ram, Siege Tower, Scorpions; the Trebuchet rests on the stone-throwers the Scots built at Carlisle in 1315 and for the defence of Berwick in 1319, whose type is not recorded and which the design reads as counterweight engines of the age of Edward I’s great trebuchets, an inference) and the stone-castle items (Keep, Arrowslits, Hoardings), which in Gaelic terms would rest only on the West Highland castles and the later tower houses; the Town Center tech (Buannacht) follows the Gaelic lordships.",
  "The migration of the Scotti from Ireland to Argyll (Ewan Campbell, ‘Were the Scots Irish?’, 2001) and the passage from Pictland to Alba (Alex Woolf, 2007; Dauvit Broun).",
  "The conversion of the Picts: Bede credits Columba with converting the northern Picts, while modern work sees a gradual conversion, partly earlier and from several directions (James E. Fraser, From Caledonia to Pictland, 2009).",
  "Clontarf (1014) as Irish against Vikings or as an Irish civil war (Seán Duffy, 2013).",
  "The hobelar, the light horseman of English records from 1296, when the justiciar John Wogan brought the first to Edward I’s Scottish campaign: J. E. Morris (1914) and James Lydon (1954) traced the type to Irish light horse, but Robert Jones (‘Re-thinking the origins of the “Irish” hobelar’, Cardiff Historical Papers, 2008) places its origin among the Anglo-Norman settlers rather than in Gaelic light horse. Either way the hobelar was a troop type of the English lordship of Ireland, raised for the king’s wars and soon imitated in England (the English design’s Chevauchée counts the hobelars among its light horse), not a Gaelic one, so this design does not use the name for a Gaelic unit.",
  "Where the Book of Kells and the Book of Durrow were made: Iona, Ireland, Northumbria or Pictland.",
  "Navy (RULES 6.16.1): a fleet of ships, resting on the planked West Highland galleys (birlinns) of Somerled and the Lords of the Isles and on the ships of the Scottish kings; the Galleon stays as the skeleton’s flagged abstraction (RULES 6.16.2). The Cannon Galleon rests on the armed ships of the late 15th century, Andrew Wood’s Flower and Yellow Carvel, which took English ships off Dunbar (1489) and beat Stephen Bull’s squadron in the Firth of Forth (1490); the details of these fights, their guns included, come largely from later tradition (Lindsay of Pitscottie), so the evidence is thin, and James IV’s great gun-armed ships (the Michael, 1511) fall after the window. Decision: the Cannon Galleon is kept on this late-sourced evidence, since the fights themselves, between armed ships in Scottish royal service and English ships, fall inside the window and the tradition describes them as gun fights; no contemporary Scottish record of guns aboard was found for this design, so the special warship rests on that tradition alone.",
]
open_questions = []

[profile]
entity = "The Gaelic world and the medieval kingdom of Scotland: the Irish kingdoms, Dál Riata, the kingdom of Alba and its successor, the kingdom of Scotland, and the Lordship of the Isles"
region = "Ireland and Scotland, with the Hebrides (under Norwegian overlordship until 1266; see the Norwegians)"
window = "563–1500 (from Columba’s foundation of Iona to the end of the time frame; the Scottish kingdom from Alba to James IV; Gaelic Ireland lasted until the Tudor conquest of 1603)"
sources = [
  "Adomnán, Life of Columba (c. 700)",
  "Bede, Historia ecclesiastica gentis Anglorum (731)",
  "Annals of Ulster; Annals of Connacht; Annals of Inisfallen",
  "Gerald of Wales, Topographia Hibernica and Expugnatio Hibernica (1180s)",
  "John Barbour, The Brus (1375); Lanercost Chronicle; Jean le Bel, Chronique",
  "Records of the Parliaments of Scotland to 1707 (statutes of Robert I’s parliament at Scone, 1318)",
  "Fergus Kelly, A Guide to Early Irish Law (1988); Early Irish Farming (1997)",
  "T. M. Charles-Edwards, Early Christian Ireland (2000)",
  "Katharine Simms, From Kings to Warlords (1987)",
  "Kenneth Nicholls, Gaelic and Gaelicised Ireland in the Middle Ages (1972; 2nd ed. 2003)",
  "James Lydon, ‘The hobelar: an Irish contribution to medieval warfare’, The Irish Sword 2 (1954); Robert Jones, ‘Re-thinking the origins of the “Irish” hobelar’, Cardiff Historical Papers (2008)",
  "G. W. S. Barrow, Robert Bruce and the Community of the Realm of Scotland (1965; 4th ed. 2005)",
  "Colm McNamee, The Wars of the Bruces: Scotland, England and Ireland 1306–1328 (1997)",
  "Seán Duffy (ed.), The World of the Galloglass: Kings, Warlords and Warriors in Ireland and Scotland, 1200–1600 (2007)",
  "James E. Fraser, From Caledonia to Pictland: Scotland to 795 (2009)",
  "Alex Woolf, From Pictland to Alba 789–1070 (2007)",
]
replaces = "Celts: an umbrella for the Celtic-speaking peoples of the British Isles (Irish, Scots, Welsh, implicitly Cornish), mixed with Iron Age imagery (woad, ‘furor’) and built around William Wallace’s Scotland"

[[bonus]]
text = "Can garrison livestock in Mills to passively produce food"
kind = "economic"
level = 1
change = "new"
replaces = "Lumberjacks work +15% faster"
precedent = "Can garrison livestock in Mills to passively produce food (Gurjaras)"
basis = "Gaelic value was reckoned in cattle: the units of the law tracts, the sét (about half a milch cow) and the cumal (literally a bondwoman, worth three milch cows), were expressed in cows, and cows were kept above all for milk: milk, butter and curds were staples of the diet (Kelly, A Guide to Early Irish Law, 1988; Early Irish Farming, 1997). Livestock that yields food without being slaughtered is the dairy economy. The lumberjack bonus it replaces rested on the stereotype of Celts as forest people (rated ‘stretched’)."
relevance = "Milk, not meat, made cattle the measure of wealth, law and status in Gaelic society."

[[bonus]]
text = "Livestock animals within Gael unit line of sight cannot be stolen"
kind = "economic"
level = 1
change = "kept"
replaces = "Livestock animals within Celt unit line of sight cannot be stolen"
precedent = "Livestock animals within Celt unit line of sight cannot be stolen (Celts)"
basis = "Cattle were the stake of Gaelic warfare: the cattle raid (creach) was the ordinary form of war in Ireland and the Highlands, and the great epic is the Táin Bó Cúailnge, ‘The Cattle Raid of Cooley’ (Kelly 1997; Simms 1987). Guarding one’s herds was a first duty. Only ‘Celt’ is changed to ‘Gael’ in the wording."
relevance = "Herds were the capital of Gaelic lordship: lords advanced cattle to their clients (the fief, rath) and took renders (bés) in return, so a lord who could not shield his clients’ herds from the creach lost them; this bonus is the war over cattle, the dairy bonus the economy that made them worth raiding."

[[bonus]]
text = "Infantry moves +5/10/15/20% faster in Dark/Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Infantry moves +5/10/15/20% faster in Dark/Feudal/Castle/Imperial Age (Celts)"
basis = "Gaelic armies were mostly light, fast-moving foot: the kerns, with little or no armour, armed with darts, short spears and axes, moving through bog and wood (Gerald of Wales; Simms 1987), raiding for cattle and withdrawing before heavier enemies."
relevance = "Light, fast foot in bog and wood was how Gaelic armies fought from the early Middle Ages to the 16th century."
contested = "The Scottish raids into northern England (1311–1322, and the Weardale campaign of 1327) were famously fast but mounted: Jean le Bel, who served against the Scots in 1327, describes them riding small hackneys, and Bruce’s raiders extorted tribute from the northern counties (McNamee 1997). They are therefore not part of this bonus’s basis. The schiltron spearmen fought in close order rather than as light skirmishers, and the galloglass were heavy infantry."

[[bonus]]
text = "Infantry +1/+2/+3 attack vs. buildings in Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "new"
replaces = "Siege Weapons attack +25% faster"
precedent = "Infantry +1/+2/+3 attack vs. buildings in Feudal/Castle/Imperial Age (Goths)"
basis = "Gaels and Scots took strongholds by surprise, escalade, fire and blockade rather than with engines, and then slighted them. In Ireland, after Callann (1261) Fínghin Mac Carthaigh destroyed Anglo-Norman castles in Desmond, and after Áth an Chip (1270) Áed Ó Conchobair razed royal castles in Connacht, among them Roscommon, begun in 1269 (its destruction is usually dated 1272; Annals of Inisfallen; Annals of Connacht; Simms 1987). In Scotland Bruce’s men took Perth (January 1313, by a night escalade in which Bruce himself waded the moat), Linlithgow (1313, by jamming the gate with a hay wain that hid armed men), Roxburgh (February 1314, Douglas’s men creeping up under black cloaks, taken for cattle) and Edinburgh (March 1314, Randolph’s climb), and pulled the castles down (Barbour; Lanercost; Barrow); their engines failed at Carlisle (1315). The bonus renders the taking and slighting of strongholds by infantry; the surprise and the escalade themselves have no game mechanic. It replaces the siege-speed bonus, which had no medieval basis (RULES 6.11: the civ keeps a way to destroy buildings)."
relevance = "Taking and razing castles without engines was how Gaelic lords rolled back the Anglo-Norman settlement in parts of Ireland, and how Bruce’s captains recovered the castles of Scotland in 1308–14, beside his campaigns in the field."
contested = "Barbour wrote his stories of these surprises (the night escalades of Perth, Roxburgh and Edinburgh; the hay-wain ruse at Linlithgow) some sixty years later, and their details may be embellished; the captures of Perth, Roxburgh and Edinburgh are also recorded by the Lanercost chronicler (Barrow)."

[team_bonus]
text = "Monasteries work +20% faster"
level = 1
change = "new"
replaces = "Siege Workshops work +20% faster"
precedent = "Monasteries work +20% faster (Lithuanians team bonus, which their design gives up); also the team bonus of the Anglo-Saxons’, Bulgarians’, Burmese, Danes’, Hindustanis’, Khitans’ and Malay designs, among them the Anglo-Saxons’ for their continental missions; reuse is accepted in N1, each copy resting on its own history, and identical team-wide effects count once per team (RULES 6.16.12)"
basis = "Irish monks converted and taught their neighbours in voluntary exile for God (peregrinatio pro Christo): Columba founded Iona (563), from which Aidan founded Lindisfarne (635) and completed the conversion of Northumbria that Paulinus’ Roman mission had begun with Edwin’s baptism (627); Columbanus founded Annegray, Luxeuil (c. 590) and Bobbio (614), and his companion Gall’s hermitage became the abbey of St Gall; and Irish scholars taught in the Carolingian world: Dicuil at the court of Louis the Pious, Dungal at Pavia (named master of its school in 825), Sedulius Scottus at Liège and John Scottus Eriugena at the court of Charles the Bald (Bede, HE II–III; Adomnán; Charles-Edwards 2000). Faster allied monasteries render the monks and houses the Irish founded and trained among their neighbours. A team bonus because it benefited neighbours (RULES 6.2: religious influence). The Anglo-Saxon mission, which the Anglo-Saxons’ design renders with the same bonus, grew partly out of it (Willibrord trained at Rath Melsigi in Ireland). The Auld Alliance with France (Treaty of Paris, 1295; the Scottish army in France, 1419–24, with Baugé, 1421, and Verneuil, 1424) is the other trait of this kind now that the kingdom is in scope; the missions keep the slot because they span the whole window and the whole Gaelic world."
relevance = "The Irish missions converted Northumbria after 635, shaped the Church of the Picts and founded monasteries from Iona to Bobbio: the Gaels’ greatest contribution to medieval Europe."
contested = "How far Columba and Iona converted the Picts (see the civ-level contested list)."

[[unique_unit]]
name = "Kern"
model = "Woad Raider"
building = "Castle"
level = 1
change = "changed"
replaces = "Woad Raider"
basis = "The kern, from Irish ceithern, a band of light foot (one soldier was a ceithernach), Englished as kern: the light foot of Gaelic armies, documented as a distinct type, often hired, from the 13th to the 16th century and rooted in the early war-band (Simms 1987; Nicholls 1972; eDIL s.v. ceithern), unarmoured, raiding and skirmishing with darts, spears and axes (Gerald of Wales). The Woad Raider’s fast, lightly protected infantry fits them; only the name changes (see the renames). No medieval source describes Gaelic warriors painting themselves: the motif is classical (Caesar on the Britons, De Bello Gallico V.14; Claudian and Isidore of Seville, Etymologiae XIX.23.7, on the Picts) and modern (the film Braveheart)."
relevance = "Light foot were the bulk of Gaelic armies, documented as kern from the 13th to the 16th century, and with the galloglass the kern is the Gaelic soldier of English imagination (‘kerns and gallowglasses’, Macbeth I.2)."
contested = "The kern’s typical weapon was the dart or javelin, which the model lacks (see the N2 idea); the art still shows woad until the N3 art idea. No Scenario Editor unit fits better (RULES section 5; codex/tools/scenario-units.md checked): the Iroquois Warrior has almost the Woad Raider’s stats but North American art, the Bandit is a slower brawler (speed 0.95 in the game data), and none carries the dart."

[[unique_tech]]
name = "Schiltron"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Spearman-line gain additional HP when near each other"
level = 1
change = "new"
replaces = "Furor Celtica (Siege Weapons +40% HP)"
precedent = "Coiled Serpent Array (Spearman-line and White Feather Guards gain additional HP when near each other) (Shu, out of scope): an existing unique tech, shared and renamed with the same effect and age, which here has no White Feather Guards to apply to"
basis = "The schiltron, the dense formation of Scottish spearmen in the wars of independence: at Falkirk (1298) Wallace’s schiltrons held off the English cavalry until archers and crossbowmen shot gaps in them; at Bannockburn (1314) Bruce used them to attack, and on the second day his schiltrons advanced on Edward II’s cavalry and pinned it on cramped ground by the Bannock Burn (on the carse or on the dry field of Balquhiderock; the exact site is debated), while the Scottish horse under Robert Keith scattered the English archers (Barbour; Vita Edwardi Secundi; Barrow). Scottish armies went on fighting in schiltrons, and were broken in them by the English archers at Dupplin Moor (1332) and Halidon Hill (1333) and beaten again at Neville’s Cross (1346). Robert I’s parliament at Scone (December 1318) fixed the arms of the host by wealth: every man with £10 in goods was to have an aketon, basinet, gloves of plate, sword and spear, and every man with goods worth one cow a good spear or a good bow with 24 arrows (Records of the Parliaments of Scotland). Why a tech when the Anglo-Saxons’ shield wall is a passive: the schiltron has a datable moment of adoption, Bruce’s use of it as an attacking formation at Bannockburn (1314), an adopted technique (RULES 6.2), and the Gaels have no other datable moment fit for the Castle slot, so the formation is promoted to a tech (RULES 6.3); the Anglo-Saxons’ Castle slot goes to their own datable reform, the Fyrd, and the shield wall, used for six centuries, stays a passive. The war had a Gaelic side: Bruce was Earl of Carrick, still largely Gaelic-speaking c. 1300, and in Barbour’s account Angus Óg of Islay stood with the men of Carrick, Argyll and the Isles in the king’s own division at Bannockburn. The effect renders the mutual protection of the massed spears; the Spearman-line’s own weakness to archers keeps the lesson of Falkirk. An existing tech fits, so no new (level-2) tech is needed (RULES 6.5). It replaces Furor Celtica, a classical stereotype of Gaulish fury (Polybius; ‘furor Teutonicus’ in Lucan) in faulty Latin, applied to siege engines."
relevance = "The schiltron fought the two great battles of the Scottish wars of independence and is the best-known Scottish formation; Bannockburn secured Bruce’s hold on his kingdom, although England recognised Scottish independence only in 1328 (Treaty of Edinburgh–Northampton) and the war resumed in 1332."
contested = "The schiltron belongs to the Scottish kingdom as a whole (Lowland and Gaelic), not to Ireland, and rests on the kingdom’s inclusion (see the civ-level contested list). How much Bannockburn owed to the schiltrons rather than to the ground, the Scottish horse and English disorder is debated, and Barbour’s order of battle was written some sixty years later. The split with the Anglo-Saxons’ shield-wall passive is a design reading: both peoples had arms ordinances (1008 in England, 1318 in Scotland), both formations were long traditions (the word schiltron itself comes from Old English scieldtruma, ‘shield-troop’), and the tech marks Bruce’s adoption of the attacking schiltron, not the half-century of its use (cf. RULES 6.16.19(b))."

[[unique_tech]]
name = "Buannacht"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Military Units cost -25% food"
level = 1
change = "new"
precedent = "Kshatriyas (Military Units cost -25% food) (Gurjaras): an existing unique tech, shared, moved to the Town Center and renamed with an identical effect and age; several other designs hold it for systems of service paid in land or kind (among them the Byzantines’ Themata, the Gurjaras’ Samantas and the Japanese Shugo-Jito), each on its own history (RULES 6.16.12)"
basis = "Buannacht (anglicised ‘bonaght’): Gaelic lords kept their hired soldiers, galloglass above all and later bands of kern too, by billeting them on their subjects, who owed them food and quarters; Anglo-Irish lords adopted the practice, which the Dublin government condemned as ‘coign and livery’ (Nicholls 1972; Simms 1987). Cheaper food renders soldiers fed by the land rather than paid from the lord’s purse; it leaves the gold cost alone, so the Galloglass (Varangian Guard model, which earns gold in combat) does not become a gold-free unit that earns gold. An exaction of lordship rather than a community institution (RULES 6.3): Gaelic Ireland was ruled through its lordships, and the Town Center tech follows them although the kingdom of Scotland is in scope. An existing tech fits, so no new (level-2) tech is needed (RULES 6.5); a new tech aimed at the hired soldiers alone (‘Kerns and Galloglasses cost -20%’) would be a level-2 item for a narrower reading of the same exaction and is not used."
relevance = "Buannacht paid for the galloglass and kerns who carried the Gaelic resurgence of the 14th and 15th centuries; Gaelic lordship as the English met it rested on it."
contested = "The term and its rules are documented mostly in 15th–16th-century sources; how far back the system goes is inferred (Nicholls; Simms)."

[tree]
add = ["Varangian Guard", "Elite Varangian Guard", "Bombard Cannon", "Illumination", "Theocracy", "Two-Man Saw"]
remove = ["Siege Onager", "Siege Ram", "Paladin", "Hussar", "Mounted Crossbowman", "Heavy Mounted Crossbowman"]

[tree.basis]
"Varangian Guard" = "Added at the Barracks as the Galloglass (see the renames): the galloglass (gallóglaigh, ‘foreign warriors’) were heavy infantry from the Hebrides and the West Highlands, of mixed Norse-Gaelic descent, in mail and iron helmet with a long-hafted axe, the steady core of Gaelic armies until the 16th century (Simms 1987; Duffy 2007). The model is axe-armed shock infantry strong against cavalry. A renamed regional unit at the Barracks, like the Anglo-Saxons’ and Danes’ Housecarl, not a unique unit (RULES 6.16.10), so the civ has one unique unit, the Kern; that the cheap kern trains at the Castle and the costly galloglass at the Barracks is a game convention. The infantry Teutonic Knight model, now unused by the Germans’ design, would give a slow heavy unit but a plate-armoured swordsman, and the Scenario Editor’s Norse Warrior and Heavy Swordsman (RULES section 5) are sword-armed too; the axe-armed Varangian Guard fits the galloglass’s weapon better, so the design keeps the renamed regional unit (the recommended default, level-1 review, section 7) and leaves a dedicated unit to the N2 idea."
"Elite Varangian Guard" = "Same as the Varangian Guard (Elite Galloglass)."
"Bombard Cannon" = "The one solid siege tradition of the civ, resting on the Scottish kingdom, which the design includes (RULES section 4): James II of Scotland used artillery against the Douglases (Threave, 1455), received Mons Meg (made at Mons in 1449 for Philip the Good of Burgundy) between 1454 and 1457 (the sources differ), and was killed at the siege of Roxburgh (3 August 1460) when one of his guns burst."
"Illumination" = "The name evokes Insular manuscript art (the Book of Kells, c. 800, the Book of Durrow and the Cathach), the best-known Gaelic achievement of the Middle Ages; the effect (faster recovery of faith) is generic. Atonement, Redemption and Block Printing stay out: the first two would add power without a Gaelic basis, and the Gaelic world printed nothing before John Carswell’s Gaelic Book of Common Order (1567)."
"Theocracy" = "The great monastic federations (familiae) of Iona and Armagh, ruled by abbots who were often of royal kin; the effect is generic. Added with Illumination for a civ whose monasticism shaped its history (see the team bonus)."
"Two-Man Saw" = "Substitute for the removed lumberjack bonus (RULES 6.11), so that the wood economy is not crippled; Ireland kept large oak woods until the 16th–17th-century plantations."
"Siege Onager" = "Scottish siege engineering was limited and mostly unsuccessful (the stone-thrower, belfry and sow that failed at Carlisle in 1315, Lanercost Chronicle; the Fleming John Crab’s engines in the defence of Berwick, 1319, Barbour; James I’s failed siege of Roxburgh with guns, 1436), and Gaelic Ireland had none to speak of; the elite siege upgrades rested on the invented ‘siege civilization’ identity. The lower siege units stay as the engine’s minimum abstraction, resting on the Scottish kingdom (see the civ-level contested list). The Trebuchet rests on the stone-throwers the Scots built at Carlisle (1315) and for the defence of Berwick (1319), whose type is not recorded; in the age of Edward I’s great counterweight engines (the Warwolf at Stirling, 1304) the design reads them as counterweight trebuchets, an inference (RULES 6.16.5)."
"Siege Ram" = "Same reason: castles were taken by surprise and escalade, then slighted (see the anti-building bonus); the Capped Ram is kept."
"Paladin" = "Gaelic cavalry was light: the Irish rode without saddle or spurs (Gerald of Wales, Topographia Hibernica III). Heavy cavalry existed only among the Anglo-Norman-descended nobility of Scotland, which the Knight and Cavalier cover now that the kingdom is in scope (RULES section 4)."
"Hussar" = "The Hussar is a 15th-century Hungarian and Serbian type, removed as in the Anglo-Saxons’ and Burgundians’ designs. Light Cavalry stays for the Gaelic horsemen, the lords’ mounted following in raids and pursuit, who rode without saddle or spurs (Gerald of Wales; Simms 1987). The top tier is not renamed ‘Hobelar’: the hobelar was a troop type of the English lordship of Ireland, not a Gaelic one (see contested)."
"Mounted Crossbowman" = "Shared basis (level-1 review, section 3.2): the Mounted Crossbowman line stays only where shooting from the saddle is documented. No mounted crossbowmen are recorded in Gaelic Ireland or Scotland, and the crossbow itself was marginal (Pictish sculpture shows crossbow hunters, as on the Drosten stone at St Vigeans); the foot Crossbowman stays as the generic Castle Age tier (RULES 6.16.3)."
"Heavy Mounted Crossbowman" = "Same reason as the Mounted Crossbowman."

