[architecture]
set = "Western European"
change = "kept"
basis = "Irish and Scottish stone churches, round towers, Romanesque (Cormac’s Chapel, Cashel, 1134) and Gothic abbeys, and the stone castles and tower houses of the later Middle Ages."

[[dropped]]
item = "Stronghold"
kind = "unique_tech"
reason = "Rated ‘stretched’, and it fails the relevance test (RULES 6.9): castle-holding was neither distinctive nor decisive in Gaelic warfare, whose best-known castle strategy was capture and slighting, and the healing aura is pure mechanics. Gaelic lords did build and hold castles, the West Highland castles of c. 1200 and the 13th century (Castle Sween, Dunstaffnage) and the tower houses of the 15th (Blarney, 1446), which are left to the N3 Tower House idea. Its Castle slot goes to the Schiltron."
