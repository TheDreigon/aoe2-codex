  "Jeffrey P. Mass, Warrior Government in Early Medieval Japan (1974)",
  "Thomas D. Conlan, State of War: The Violent Order of Fourteenth-Century Japan (2003)",
  "Charlotte von Verschuer, Across the Perilous Sea: Japanese Trade with China and Korea from the Seventh to the Sixteenth Centuries (2006)",
