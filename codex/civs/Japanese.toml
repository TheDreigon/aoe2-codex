civ = "Japanese"
name = "Japanese"
status = "draft"
label = "Infantry and Cavalry Archer civilization"
summary = "Japan from the ritsuryō state to the Sengoku (645–1600), fitted to the owner’s sketch: the Samurai and the fishing, infantry attack-speed and Cavalry Archer bonuses stay; nimōsaku farming, ō-yoroi armour (Cavalry Archers +20 HP) and cheap ashigaru spearmen replace the cheap camps; Tanegashima, the civ’s one late element, replaces Kataparuto at the Castle, the shugo–jitō system becomes the Town Center tech, Yasama is dropped for relevance while the generic Arrowslits stays, the kangō trade with the Ming gives the team bonus, and the tree gains Crop Rotation, Architecture and the Traction Trebuchet in place of the counterweight Trebuchet and loses the Cannon Galleons."
ideas = [
  "N2: A Samurai that switches between bow and sword (like the Ratha), so that one unit covers both the Heian–Kamakura mounted archer (kyūba no michi) and the later foot swordsman (owner’s list, RULES 10).",
  "N2: A heavy mounted archer (mounted samurai) trained at the Castle, with more melee armour and less speed than the Cavalry Archer, for the ō-yoroi warriors of the Genpei War (1180–85) and of the Mongol invasions (Friday 2004).",
  "N2 (owner’s list): Sōhei, the armed forces of the great temples. From the 10th–11th centuries Enryaku-ji on Mount Hiei and Kōfuku-ji at Nara pressed the court with armed demonstrations (gōso), with the naginata as their emblematic weapon; in the 16th century the armed community of Negoro-ji (Negoro-shū) were famous arquebusiers, and Oda Nobunaga burnt Enryaku-ji (1571) while fighting the Ikkō-ikki, leagues of lay Jōdo Shinshū believers led from Ishiyama Hongan-ji, for ten years (1570–80). The Warrior Priest, which the Armenian design drops, would make it N1 (see open questions).",
  "N2: Ashigaru with long spears (nagae-yari, 4.5–6.5 m): extra melee range for the Spearman-line, reusing the reach mechanic of the Kamayuk.",
  "N2: Ishigaki, stone-faced castle bases (+HP for Castles and walls), for the castles of the late 16th century (Azuchi, 1576). Kept out of this level although its walls part could share the Great Wall effect, because it would be a second late element (RULES section 2).",
  "N3: A wakō / Murakami suigun naval unit for the pirate and clan fleets, and a Ryūkyū civ (unified 1429).",
]
contested = [
  "The katana as the main battlefield weapon: the sword’s fame is late (15th–16th centuries), while 14th-century reward claims (gunchūjō) show that most wounds came from arrows (Conlan 2003).",
  "Bushidō as a medieval code or as a tradition built in the Edo and Meiji periods (Benesch 2014); medieval loyalty was contractual (go’on and hōkō) and warriors often changed sides.",
  "The date of the arrival of firearms at Tanegashima (1543 in the Teppōki, 1542 in António Galvão) and Fernão Mendes Pinto’s claim to have been there.",
  "The Teppōki tells how the gun spread to Sakai (Tachibanaya Matasaburō) and Negoro (Tsuda Kenmotsu); Kunitomo’s role comes from later local records.",
  "Rotating three-rank volleys at Nagashino (1575), not clearly described in the Shinchō kōki (Fujimoto Masayuki).",
  "A decisive typhoon in 1274 (the ‘kamikaze’); the typhoon of 1281 is well attested.",
  "How far Kuki Yoshitaka’s gun-armed ships for Oda Nobunaga (1578) were really iron-clad.",
  "The Ming treated the tally missions as costly tribute rather than a gain: under the Xuande emperor (1430s) it limited Japan to one mission every ten years, with three ships and 300 men, and it cut the prices it paid when the mission of 1453 brought swords in excess (von Verschuer 2006). The team bonus rests on what China did gain: the shoguns’ action against the wakō, and Japan’s sulphur and copper.",
  "Mangonel and Onager stay as abstractions of the default tree. The Mangonel is read as a light traction stone-thrower (in many medieval sources ‘mangonel’ meant the traction trebuchet, while the game’s art shows a torsion engine); the Onager has no Japanese counterpart and is kept as a pure abstraction, whereas the Khitan design takes the Mangonel tier only and leaves out the Onager as the late-Roman torsion engine (see open questions). Traction engines themselves stayed marginal in Japan: the firm evidence is Goguryeo’s gift of captured Sui stone-throwers in 618 (Nihon Shoki). Japanese studies of the Ōnin War also report a stone-thrower (hassekiboku) built for the Eastern army in Kyoto in 1468, citing the diary Hekizan nichiroku; this design could not check the passage and does not rely on it.",
  "The grant of late 1185: the contemporary diary Gyokuyō (Bunji 1.11.28) says that Hōjō Tokimasa and Yoritomo’s men were assigned the provinces of the Kinai, San’in, San’yō, Nankai and Saikai to levy commissariat rice of five shō per tan and to manage the land, without naming shugo; the Azuma kagami, compiled c. 1300, presents it as the appointment of shugo and jitō in every province. Whether it created provincial land stewards (kuni-jitō, Ishimoda Shō) rather than the later shugo and estate jitō, and how far it reached at first, is debated (Mass 1974); the rice levy was withdrawn in 1186 after protests.",
  "Sōhei is an Edo-period label: medieval sources speak of ‘evil monks’ (akusō) and of temple forces, many of them temple servants and affiliated warriors rather than ordained monks (Adolphson 2007, who prefers ‘monastic warriors’).",
]
open_questions = [
  "Label: ‘Infantry and Cavalry Archer civilization’ instead of ‘Infantry civilization’, to give back the four centuries of mounted warfare (c. 900–1350). Accept?",
  "Sōhei: your sketch keeps the warrior monks as an N2 idea, and this draft follows it (the first draft had made them a second unique unit). The Warrior Priest, which the Armenian design drops, would make them N1: a Monastery infantry unit that fights, heals and carries Relics. Promote them to a second unique unit?",
  "Power budget: six passive bonuses (two of them for the Cavalry Archer, both resting on the Heian–Kamakura mounted archer: the kept +2 attack vs. Ranged Soldiers and your +20 HP) plus Tanegashima and Shugo-Jitō, against the current four bonuses with the strong cheap-camps opening. One option: drop the older Cavalry Archer bonus, whose target the analysis calls arbitrary, and add Genkō Bōrui as a third unique tech: the stone wall that the Kyūshū housemen built along Hakata Bay in 1276, each in proportion to his land, and which kept the 1281 army from landing there. It would sit at the Castle in the Castle Age with the Great Wall effect shared, as the Korean Eupseong does (level 1), giving five passives and three techs, with the Castle techs in chronological order (1276, then Tanegashima in 1543). Apply this swap, trim in another way, or keep the six passives?",
  "Shugo-Jitō shares the Kshatriyas effect (Military Units cost -25% food) with six other drafts’ Town Center techs (the Burmese Ahmudan, Byzantine Themata, Ethiopian Gult, Gaelic Buannacht, Gurjara Samantas and Jurchen Meng’an Mouke). Keep the shared level-1 tech, or give Shugo-Jitō a different effect as a new tech (level 2)?",
  "Siege line: the Mangonel and Onager stay from the default tree beside the new Traction Trebuchet, although traction engines stayed marginal in Japan (see contested). Keep both, or remove the Onager tier, as the Khitan design does?",
]

[profile]
