[[bonus]]
text = "Fishing Ships work +5/10/15/20% faster in Dark/Feudal/Castle/Imperial Age; +100% HP"
kind = "economic"
level = 1
change = "kept"
precedent = "Fishing Ships work +5/10/15/20% faster in Dark/Feudal/Castle/Imperial Age; +100% HP (Japanese)"
basis = "Fish was the main animal protein of medieval Japan, the more so after Tenmu’s edict of 675, which forbade eating cattle, horses, dogs, monkeys and chickens during the farming months (Nihon Shoki), and the later spread of Buddhist meat taboos; coastal fisheries were intensive, and fish and shellfish were among the goods sent as tax under the ritsuryō codes (the wooden tax tags of Heijō-kyō). The +100% HP is a game mechanic."
relevance = "An island people that largely avoided meat lived on fish, and coastal fishing was a lasting part of Japan’s economy and diet; this is not a fishing bonus for a people that fishing did not shape (brief 5.5)."

[[bonus]]
text = "Farmers work +15% faster"
kind = "economic"
level = 1
change = "new"
replaces = "Mills, Lumber- and Mining Camps cost -50%"
precedent = "Farmers work +15% faster (Slavs)"
basis = "Owner’s decision (nimōsaku). Medieval Japanese farming intensified: from the 13th century western Japan spread the double cropping of rice with barley or wheat, and in 1264 the Kamakura bakufu forbade the land stewards (jitō) of Bizen and Bingo to take rent from the barley back-crop (tamugi); with more draught animals, green manure and ash, the Korean envoy Song Hŭi-gyŏng saw farmers near Amagasaki take three crops a year from the same fields in 1420 (Nosongdang ilbon haengnok). The cheap camps it replaces had no identifiable historical link. The first draft’s ‘Gold miners work +15% faster’ was dropped for relevance (brief 5.5): Mutsu gold, first presented in 749, helped gild the Great Buddha of Tōdai-ji and later went to Song China, but the strongest evidence, Iwami silver (found 1526, worked by cupellation from 1533), lies at the edge of the window."
relevance = "Double cropping and more intensive farming fed the growth of villages, markets and population on which the warrior era rested."

[[bonus]]
text = "Infantry attacks +33% faster starting in Feudal Age"
kind = "military"
level = 1
change = "kept"
precedent = "Infantry attacks +33% faster starting in Feudal Age (Japanese)"
basis = "An abstraction of the fame of Japanese swordsmanship: in the 15th–16th centuries tens of thousands of swords went to Ming China through the official trade, and Qi Jiguang put a Japanese sword manual (Kage-ryū) captured in 1561 into his military manual (Jixiao xinshu)."
relevance = "From the 14th century the sword and the foot warrior became the image of the samurai, and Japanese blades were a staple of the trade with the Ming; few traits are more associated with Japan."
contested = "For most of the period the bow, and later the spear and the arquebus, mattered more than the sword (Conlan 2003)."

[[bonus]]
text = "Cavalry Archers +2 attack vs. Ranged Soldiers (except Skirmishers)"
kind = "military"
level = 1
change = "kept"
precedent = "Cavalry Archers +2 attack vs. Ranged Soldiers (except Skirmishers) (Japanese)"
basis = "From c. 900 to the 14th century the elite warrior (bushi) was above all a mounted archer: the ‘way of bow and horse’ (kyūba no michi) of the Heian and Kamakura war tales and of the Mongol invasion scrolls (Mōko shūrai ekotoba, c. 1293), a skill trained from youth and tested in mounted archery (Friday 2004). The target of the bonus is a game choice."
relevance = "The trained skill of shooting from the saddle was what made a man a bushi in the Heian and Kamakura periods: without it there is no warrior class to fight the Genpei War or to meet the Mongols."
contested = "The long asymmetric Japanese bow (yumi) differs from the steppe composite bow of the generic unit. This bonus (the skill) and the +20 HP bonus (the armour) rest on the same mounted-archer tradition (see open questions)."

[[bonus]]
text = "Cavalry Archers +20 HP"
kind = "military"
level = 1
change = "new"
precedent = "Sipahi (Mounted Archers +20 HP) (Turks), applied to Cavalry Archers"
basis = "Owner’s decision. The ō-yoroi (‘great armour’) of the 10th–14th centuries was a boxy lamellar harness made for the mounted archer, with broad shoulder boards (ō-sode) and a four-panel skirt for riding and shooting: the armour of the Genpei War (1180–85) and of the warriors who met the Mongols in 1274 and 1281 (Heike monogatari; Mōko shūrai ekotoba). The first draft made it a unique tech, but an equipment tradition of four centuries is a structural trait (RULES 6.2), as the owner’s sketch has it."
relevance = "Heavy armour let the mounted archer close to short range and survive the exchange of arrows: without the armoured mounted elite there would have been no warrior class to win the Genpei War and hold the coast against the Mongols, so the bonus stands for that elite rather than for one type of armour."

[[bonus]]
text = "Spearman-line costs -25%"
kind = "military"
level = 1
change = "new"
precedent = "Camel Riders, Skirmishers and Spearman-line cost -25% (Byzantines)"
basis = "Owner’s decision (ashigaru). Spears (yari) spread among Japanese troops from the 14th century, and the ashigaru, low-status foot soldiers raised in great numbers, burst onto the scene in the Ōnin War (1467–77), when the courtier Ichijō Kaneyoshi complained of their plundering (Shōdan chiyō, 1480); by the late 16th century the daimyō fielded mass armies of ashigaru with long spears (nagae-yari) and arquebuses. The trait originated inside the window; only its peak comes later (RULES section 2)."
relevance = "Cheap mass infantry changed Japanese warfare from the Ōnin War on and made the great armies of the Sengoku and of the unification possible."

[team_bonus]
text = "Trade Cogs generate +15% gold"
level = 1
change = "new"
replaces = "Galley-line +4 line of sight"
precedent = "Trade Units generate +25% gold (Spanish team bonus), applied to Trade Cogs at a lower magnitude"
basis = "Owner’s decision: the licensed tally trade (kangō bōeki) with the Ming, 1404–1547. In return for investiture and action against the wakō pirates (Ashikaga Yoshimitsu sent captured pirates to the Ming in 1405–07), the Ashikaga shoguns sent official missions to Ningbo, later run by the Hosokawa and Ōuchi with the merchants of Sakai and Hakata. Japan supplied swords by the tens of thousands, copper and sulphur, a gunpowder raw material, and took back silk, books and copper coin: Japan minted no coin between 958 and the late 16th century, and imported Chinese coin, mostly Northern Song with the Ming coin of the missions added, was the everyday money of Muromachi Japan (von Verschuer 2006). A team bonus because China gained the shoguns’ action against piracy and Japan’s sulphur and copper (RULES 6.2: trade), though the Ming counted the missions as a costly tribute (see contested); a maritime trade, hence Trade Cogs. The line-of-sight bonus it replaces had nothing specifically Japanese, and the first draft’s ashigaru team bonus (Barracks work +20% faster) benefited only Japan and now grounds the Spearman-line bonus."
relevance = "The tally trade was Muromachi Japan’s official link to China: it brought coin, silk and books, financed the shoguns and later the Ōuchi and Hosokawa, and sent Japanese copper and sulphur to the Ming."

[[unique_unit]]
name = "Samurai"
model = "Samurai"
building = "Castle"
level = 1
change = "kept"
basis = "‘Samurai’ (from saburau, ‘to serve’) first meant armed retainers, then a social status. A foot swordsman with a long sword (uchigatana, nodachi) fits the 14th–16th centuries, when warriors fought more and more on foot; ‘strong vs. unique units’ is pure game design."
relevance = "The samurai were Japan’s ruling warrior class from the 12th century to 1868 and are the emblem of the civ."
contested = "Before c. 1350 the samurai fought mainly as a mounted archer; that side is carried by the two Cavalry Archer bonuses."

[[unique_tech]]
name = "Tanegashima"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Hand Cannoneers cost -20% gold; train +25% faster"
level = 2
change = "new"
replaces = "Kataparuto (Trebuchets attack and pack/unpack faster)"
precedent = "All units cost -20% gold (Portuguese), applied to Hand Cannoneers; Gunpowder Units train +25% faster (Turks team bonus), applied to Hand Cannoneers"
basis = "Late element, RULES section 2, and the civ’s only one (with the Hand Cannoneer already in the tree, also Imperial Age only). Portuguese traders landed on Tanegashima in 1543 (Teppōki, 1606) or 1542 (António Galvão, 1563); the island’s lord bought two matchlocks and had the swordsmith Yaita Kinbei copy them, and within a generation the gun was made in numbers (the Teppōki tells of Sakai and Negoro); Oda Nobunaga’s arquebusiers at Nagashino (1575) are its famous use. Owner’s decision: it replaces Kataparuto, the modern katakana loanword for English ‘catapult’, whose effect has nothing to apply to once the counterweight Trebuchet goes. A new tech, so level 2: no existing tech has this effect."
relevance = "The arquebus, copied and mass-produced within a generation, reshaped Sengoku warfare and the unification; RULES section 2 names it as the model late element with clear fame."
contested = "The date (1542 or 1543), Fernão Mendes Pinto’s claim to have been there and the volleys at Nagashino are debated (see contested)."

[[unique_tech]]
name = "Shugo-Jitō"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Military Units cost -25% food"
level = 1
change = "new"
precedent = "Kshatriyas (Military Units cost -25% food) (Gurjaras): an existing unique tech, shared and renamed with an identical effect; six other drafts share it for systems of service paid in land or kind (the Burmese Ahmudan, Byzantine Themata, Ethiopian Gult, Gaelic Buannacht, Gurjara Samantas and Jurchen Meng’an Mouke; see open questions)"
basis = "In late 1185 the retired emperor Go-Shirakawa authorised Minamoto no Yoritomo’s men to levy commissariat rice (hyōrōmai) of five shō per tan on the estates and public lands of the home provinces and the west and to manage the land (Gyokuyō, Bunji 1.11.28); the Azuma kagami (c. 1300) presents the same grant as the appointment of constables (shugo) and land stewards (jitō). The jitō, drawn from Yoritomo’s housemen, kept order on the land and took a share of its revenue, so the warriors were fed from the estates they policed (Mass 1974). The rice levy itself was withdrawn in 1186, and the Muromachi half-tax edicts (hanzei, 1352 and 1368) later gave the shugo half of estate revenues to supply their troops. Cheaper food for soldiers renders an army provisioned from the land. At the Town Center because the shugo–jitō network was the governing institution of the first shogunate (RULES 6.2). The owner’s sketch named no Town Center tech; this is the research side’s choice."
relevance = "The shugo–jitō network made the warriors the governing class of the provinces and was the base of warrior rule from 1185 to the 16th century."
contested = "The scope of the grant of 1185 and the reading of its offices are debated (see contested)."

[tree]
add = ["Crop Rotation", "Architecture", "Traction Trebuchet"]
remove = ["Trebuchet", "Cannon Galleon", "Elite Cannon Galleon"]

[tree.basis]
"Crop Rotation" = "Owner’s decision. The rice–barley (or wheat) cycle of medieval western Japan, extended near Amagasaki by a third crop of buckwheat (Song Hŭi-gyŏng, 1420); its absence contradicted one of the period’s main agricultural advances."
"Architecture" = "Owner’s decision. Japan keeps some of the oldest wooden buildings in the world (Hōryū-ji, late 7th century) and raised the colossal Great Buddha Hall of Tōdai-ji (8th century); its absence contradicted this."
"Traction Trebuchet" = "Owner’s decision. The rope-pulled stone-thrower of East Asia, the only kind known in early Japan: in 618 Goguryeo presented to the court of Suiko trophies taken from the Sui, crossbows and stone-throwers among them, as a diplomatic gift (Nihon Shoki, Suiko 26). It replaces the counterweight Trebuchet as the long-range siege weapon (RULES 6.11), although its use in Japan stayed marginal (see contested)."
"Trebuchet" = "Owner’s decision. No Japanese use of the counterweight trebuchet is known; Japanese sieges were won by blockade, fire and assault, and from the late 16th century by European-type cannon. Kataparuto, which improved it, gives its slot to Tanegashima."
"Cannon Galleon" = "Owner’s decision. Japanese fleets carried little artillery, their great weakness against the Korean panokseon in the Imjin War (1592–98); Kuki Yoshitaka’s gun-armed ships for Oda Nobunaga (1578) were an exception."
"Elite Cannon Galleon" = "As for the Cannon Galleon."

[[rename]]
from = "Thumb Ring"
to = "Yugake"
level = 1
basis = "Japanese archers draw the string with the thumb, like steppe archers, but protect it with a glove (yugake) rather than a ring; same function, identical effect (RULES 6.10)."

[architecture]
set = "East Asian"
change = "kept"
basis = "Japanese temples, palaces and castles belong to the East Asian timber-frame tradition."

[[dropped]]
item = "Yasama"
kind = "unique_tech"
reason = "Relevance test (RULES 6.9); the owner kept it only if it passed (brief 5.5 flags it). 矢狭間, read yazama, is the arrow loophole in castle walls and towers: a single architectural feature, and the same thing as the generic Arrowslits, which the Japanese keep by the owner’s decision. By the first draft’s own dating the loopholed castles belong mainly to the late 16th century (Azuchi, 1576), so it would also be a second late element (RULES section 2). A per-civ rename of Arrowslits to Yazama was considered and not made: the owner asked for the generic tech, and the term’s referent is mainly late."
