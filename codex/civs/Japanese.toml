region = "Japanese archipelago (Honshū, Shikoku, Kyūshū)"
window = "645–1600 (core: the warrior era, c. 900–1573)"
sources = [
  "Nihon Shoki (720)",
  "Shoku Nihongi (797)",
  "Kujō Kanezane, Gyokuyō (diary, 1164–1200)",
