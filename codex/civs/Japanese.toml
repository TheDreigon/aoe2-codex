civ = "Japanese"
name = "Japanese"
status = "draft"
label = "Infantry and Cavalry Archer civilization"
summary = "Japan (645–1600), on the owner’s sketch: double cropping, ō-yoroi and ashigaru replace the cheap camps, the Cavalry Archer attack bonus goes, Genko Borui (the Hakata Bay wall of 1276) and Tanegashima (the one late element) replace Yasama and Kataparuto, Shugo-Jito is the Town Center tech, the Ming tally trade gives the team bonus, and the Traction Trebuchet replaces the Trebuchet."
ideas = [
  "N2: A Samurai that switches between bow and sword (like the Ratha), so that one unit covers both the Heian–Kamakura mounted archer (kyūba no michi) and the later foot swordsman (owner’s list, RULES 10).",
  "N2: A heavy mounted archer (mounted samurai) trained at the Castle, with more melee armour and less speed than the Cavalry Archer, for the ō-yoroi warriors of the Genpei War (1180–85) and of the Mongol invasions (Friday 2004): a Cavalry Archer with adapted stats, which is N2 under RULES section 5. The Scenario Editor’s Mounted Samurai (RULES section 5) was considered for this role and is not used: by the game data (codex/tools/scenario-units-stats.md) it is a melee heavy cavalryman (130 HP, 14 attack, 3/5 armour, speed 1.35, +12 attack vs. unique units, like the Samurai), so it cannot render the mounted archer. Its art is still to be checked in game; if it proves Japanese, the unit could later serve as the look of the Japanese Knight-line (RULES section 5), for the mounted warriors of the later centuries, who fought more with sword and spear.",
  "N2 (owner’s list): Sōhei, the armed forces of the great temples. From the 10th–11th centuries Enryaku-ji on Mount Hiei and Kōfuku-ji at Nara pressed the court with armed demonstrations (gōso), with the naginata as their emblematic weapon; in the 16th century the armed community of Negoro-ji (Negoro-shū) were famous arquebusiers, and Oda Nobunaga burnt Enryaku-ji (1571) while fighting the Ikkō-ikki, leagues of lay Jōdo Shinshū believers led from Ishiyama Hongan-ji, for ten years (1570–80). The Warrior Priest, which the Armenian design drops, would make them N1 as a second unique unit; the design keeps them as an N2 idea, as the owner’s sketch has it.",
  "N2: Ashigaru with long spears (nagae-yari, 4.5–6.5 m): extra melee range for the Spearman-line, reusing the reach mechanic of the Kamayuk.",
  "N2: Ishigaki, stone-faced castle bases (+HP for Castles and walls), for the castles of the late 16th century (Azuchi, 1576). Kept out of this level: its walls part would repeat the Great Wall effect that Genko Borui already uses, and it would be a second late element (RULES section 2).",
  "N3: A wakō / Murakami suigun naval unit for the pirate and clan fleets, and a Ryūkyū civ (unified 1429).",
]
contested = [
  "The katana as the main battlefield weapon: the sword’s fame is late (15th–16th centuries), while 14th-century reward claims (gunchūjō) show that most wounds came from arrows (Conlan 2003).",
  "Bushidō as a medieval code or as a tradition built in the Edo and Meiji periods (Benesch 2014); medieval loyalty was contractual (go’on and hōkō) and warriors often changed sides.",
  "The date of the arrival of firearms at Tanegashima (1543 in the Teppōki, 1542 in António Galvão) and Fernão Mendes Pinto’s claim to have been there.",
  "The Teppōki tells how the gun spread to Sakai (Tachibanaya Matasaburō) and Negoro (Tsuda Kenmotsu); Kunitomo’s role comes from later local records.",
  "Rotating three-rank volleys at Nagashino (1575), not clearly described in the Shinchō kōki (Fujimoto Masayuki).",
  "A decisive typhoon in 1274 (the ‘kamikaze’); the typhoon of 1281 is well attested. How much the Japanese defence, the Hakata Bay wall among it, rather than the storms decided the invasions is debated: Conlan (2001) argues that the warriors held the Mongols without divine help, against the older ‘kamikaze’ narrative.",
  "Genkō Bōrui (‘the defence wall against the Mongol invasions’) is a modern name, given by the archaeologist Nakayama Heijirō after his excavation of 1913; the documents of the time call the wall ishitsuiji (石築地, ‘stone-built wall’). The tech keeps the owner’s name, flagged as a modern coinage (RULES 6.16.15).",
  "How far Kuki Yoshitaka’s gun-armed ships for Oda Nobunaga (1578) were really iron-clad.",
  "The Ming treated the tally missions as costly tribute rather than a gain: under the Xuande emperor (1430s) it limited Japan to one mission every ten years, with three ships and 300 men, and it cut the prices it paid when the mission of 1453 brought swords in excess (von Verschuer 2006). The team bonus rests on what China did gain: the shoguns’ action against the wakō, and Japan’s sulphur and copper.",
  "Mangonel and Onager stay as abstractions of the default tree. The Mangonel is read as the light traction stone-thrower, the light stone-thrower of every design (RULES 6.16.5; in many medieval sources ‘mangonel’ meant the traction trebuchet, while the game’s art shows a torsion engine); the Onager has no Japanese counterpart and is kept as a pure abstraction. Leaving out the Onager tier, as the Khitan design does, was considered and not adopted, so that the siege line stays the default one. Traction engines themselves stayed marginal in Japan: the firm evidence is Goguryeo’s gift of captured Sui stone-throwers in 618 (Nihon Shoki). Japanese studies of the Ōnin War also report a stone-thrower (hassekiboku) built for the Eastern army in Kyoto in 1468, citing the diary Hekizan nichiroku; this design could not check the passage and does not rely on it.",
  "The Arbalester stays on crossbow evidence (RULES 6.16.3): the ōyumi (弩) of the ritsuryō army. Goguryeo’s gift of 618 included crossbows (Nihon Shoki, Suiko 26); the military code had two men of each fifty-man company trained on the ōyumi, and in the 9th century province after province asked the court for ōyumi instructors because no one could use the weapons in their armouries (Friday 2004). What the ōyumi was is debated: Friday thinks it was probably a heavy, mounted crossbow rather than a hand-held one, and it fell out of use as the mounted bushi rose. The Arbalester therefore rests on an early and partly heavy crossbow, an abstraction for the crossbow tier; the Heavy Scorpion, kept from the game, fits the heavier reading.",
  "The grant of late 1185: the contemporary diary Gyokuyō (Bunji 1.11.28) says that Hōjō Tokimasa and Yoritomo’s men were assigned the provinces of the Kinai, San’in, San’yō, Nankai and Saikai to levy commissariat rice of five shō per tan and to manage the land, without naming shugo; the Azuma kagami, compiled c. 1300, presents it as the appointment of shugo and jitō in every province. Whether it created provincial land stewards (kuni-jitō, Ishimoda Shō) rather than the later shugo and estate jitō, and how far it reached at first, is debated (Mass 1974); the rice levy was withdrawn in 1186 after protests.",
  "Sōhei is an Edo-period label: medieval sources speak of ‘evil monks’ (akusō) and of temple forces, many of them temple servants and affiliated warriors rather than ordained monks (Adolphson 2007, who prefers ‘monastic warriors’).",
]
open_questions = []

