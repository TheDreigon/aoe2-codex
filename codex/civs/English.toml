[[bonus]]
text = "Shepherds work +25% faster"
kind = "economic"
level = 1
change = "kept"
precedent = "Shepherds work +25% faster (Britons)"
basis = "Wool was England’s chief export and the fiscal engine of its wars. Edward I’s wars were paid largely by the ‘Ancient Custom’ on wool (1275) and the maltolt (1294–97); Edward III’s by the wool subsidies and wool-loan schemes such as the Dordrecht bonds (1337–38); and from 1363 the Calais Staple made the wool trade the paymaster of the Calais garrison, an arrangement made formal by the Act of Retainer of 1466 (T. H. Lloyd, The English Wool Trade in the Middle Ages, 1977). The Lord Speaker still sits on the Woolsack. An abstraction: sheep were valued for wool rather than meat. The Calais Staple stays in the basis of this bonus and is not given a trade-gold tech: in this region trade-gold effects are reserved for the Burgundians’ Bruges trade (level-1 review, section 3.2)."
relevance = "Wool was England’s main export and the tax base of its wars for three centuries."

[[bonus]]
text = "Town Centers cost -50% wood starting in Castle Age"
kind = "economic"
level = 1
change = "kept"
precedent = "Town Centers cost -50% wood starting in Castle Age (Britons)"
basis = "Town plantation: Beresford’s gazetteer counts some 170 towns planted in England between the Conquest and Queenborough (1368), over 80 in Wales and about 125 in Gascony, among them Edward I’s castle-boroughs in north Wales (Flint, Rhuddlan, Conwy, Caernarfon, Beaumaris) and New Winchelsea (Beresford, New Towns of the Middle Ages, 1967). The cheap Castle-Age Town Center stands for these planned boroughs."
relevance = "Planted boroughs carried English settlement and rule into Wales and Gascony; a borderline pass, since new towns were founded all over Europe."
contested = "The basis is supplied after the fact; the bonus was probably designed for balance. Rated ‘stretched’ by the analysis, kept because planted towns are a real and well-documented English phenomenon. Beresford’s counts are given as approximate."

[[bonus]]
text = "Foot Archers attack +10/+20% faster in Castle/Imperial Age"
kind = "military"
level = 2
change = "changed"
replaces = "Foot Archers +1/+2 range in Castle/Imperial Age"
precedent = "Foot Archers attack +18% faster (Ethiopians): a lower magnitude in the Castle Age and a higher one in the Imperial Age. The +20% step is the owner’s decision (level-1 review, section 9, Britons Q2, confirmed on 19 October 2026). It is a new magnitude of an existing effect, so the passive is level 2 (RULES section 5). It stays below the class ceiling (RULES 6.16.11): the game’s Ethiopian foot archers with Thumb Ring shoot about 39% faster, and the English design has no Thumb Ring. Age-gated like ‘Foot Archers +1/+2 range in Castle/Imperial Age’ (Britons), the bonus it replaces."
basis = "The English war bow in the field. At Falkirk (1298) Edward I’s mounted men-at-arms could not break the Scottish schiltrons until his archers and crossbowmen had shot gaps in them (Walter of Guisborough; Prestwich, Edward I, 1988). The system the war bow is famous for came a generation later: from Dupplin Moor (1332, the Disinherited under Edward Balliol) and Halidon Hill (1333), massed archers, increasingly mounted archers who rode to the fight and shot on foot, stood on the wings of dismounted men-at-arms, the formation of Crécy (1346) and Agincourt (1415); at Poitiers (1356), where the French attacked largely on foot, the archers ran short of arrows and the Captal de Buch’s flank attack settled the day (Prestwich 1996; Ayton 1994; Rogers 2000). The weapon’s edge lay in rate of shooting and massed volleys rather than range: a trained archer loosed several arrows in the time a crossbowman spanned and shot once, at ranges comparable to the crossbow’s (Strickland and Hardy 2005; Curry 2005). Faster attack renders that edge; the range the game gave this passive is kept once, in Yeomen, for the weapon’s fame (level-1 review, section 9). A long military tradition, so a passive (RULES 6.2), gated at the ages of the bonus it replaces; the royal arms legislation that supplied the archers is the basis of Yeomen."
relevance = "The massed war bow is the defining English weapon from Falkirk to Agincourt and the best-known trait of the civ."
contested = "The bonus also speeds the Crossbowman line, which English field armies used little after c. 1300 (see the N2 idea of split lines). How much the arrows did against plate is debated (see the civ-level contested list)."

[[bonus]]
text = "Militia-line +1/+2 melee armor in Castle/Imperial Age"
kind = "military"
level = 1
change = "new"
precedent = "Infantry and Mounted Units +1/+2 melee armor in Castle/Imperial Age (Teutons), narrowed to the Militia-line at the same magnitude; Bagains (Militia-line +5 melee armor) (Bulgarians) shows the Militia-line as an armour target"
basis = "Anglo-Norman knights dismounted to fight at Tinchebray (1106) and at the Standard (1138); from Dupplin Moor (1332, the Disinherited under Edward Balliol) and Halidon Hill (1333) English men-at-arms in full armour fought on foot in the centre with archers on the wings, the system of Crécy, Poitiers and Agincourt (Prestwich 1996; Rogers 2000). What was English was the combination of dismounted men-at-arms with massed archers on the wings; dismounting itself was common Western practice (the French fought largely on foot at Poitiers and Agincourt). The game’s Militia-line, whose second tier is literally called Man-at-Arms, stands for these armoured dismounted men-at-arms."
relevance = "Dismounted men-at-arms were half of the English tactical system that won the great battles of the Hundred Years War."

[team_bonus]
text = "Archery Ranges work +10% faster"
level = 1
change = "kept"
precedent = "Archery Ranges work +10% faster (Britons)"
basis = "English archers served allies and employers abroad: under the Black Prince they decided Nájera (1367) for Pedro I of Castile; the White Company, in Italy from 1361 and led by John Hawkwood from 1364, and Hawkwood’s later English companies served Pisa, Bernabò Visconti, the papacy and Florence until his death in 1394 (Caferro 2006); an English contingent fought with John I of Portugal at Aljubarrota (1385), on the eve of the Treaty of Windsor (1386); Henry of Bolingbroke’s archers fought beside the Teutonic Order before Vilnius (1390); and Charles the Bold hired English archers in the 1470s (Vaughan, Charles the Bold, 1973). The Portuguese defensive line of dismounted men with missile troops on the flanks, used at Atoleiros (1384) and Aljubarrota, is often linked to English example after the Earl of Cambridge’s expedition of 1381–82 (see contested). A team bonus because the archers benefited allies and employers (RULES 6.2); England’s own recruiting by commissions of array and indentures benefited only England and would not qualify."
relevance = "The English archer was England’s best-known military export, hired by allies and employers from Castile to Florence; Nájera shows an ally winning with him."
contested = "The size of the English contingent at Aljubarrota is uncertain, and whether the Portuguese tactics of 1384–85 copied the English or developed independently is debated."

[[unique_unit]]
name = "Longbowman"
model = "Longbowman"
building = "Castle"
level = 1
change = "kept"
basis = "The emblematic soldier of English armies from Edward I’s Welsh wars to Castillon (1277–1453). Bows recovered from the Mary Rose (sunk 1545) suggest very heavy draw weights (estimates of c. 100–180 lbf, debated). English archers also carried swords or bucklers and stakes and were decisive only alongside dismounted men-at-arms (Strickland and Hardy 2005)."
relevance = "The longbowman is the emblem of English arms in the Hundred Years War."

[[unique_tech]]
name = "Yeomen"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Foot Archers and Skirmisher-line +1 range; Watch Tower-line +2 attack"
level = 1
change = "changed"
replaces = "Yeomen (Castle unique tech, same effect)"
precedent = "Yeomen (Foot Archers and Skirmisher-line +1 range; Watch Tower-line +2 attack) (Britons): moved to the Town Center, identical effect and age"
basis = "The Crown’s arms legislation supplied the archers: Henry III’s writs of 1242 and 1252 extended Henry II’s Assize of Arms (1181) to bows and arrows for the poorer free men; Edward I’s Statute of Winchester (1285) fixed the arms every man had to keep by his wealth and ordered a watch at the town gates from sunset to sunrise (‘watch and ward’); and Edward III’s proclamation of 1363 ordered archery practice on holidays, an order repeated in the Statute of Cambridge (1388) and later, which suggests it was not always obeyed (Strickland and Hardy 2005). With a culture of archery among free men of modest means (later called yeomen), it fed armies whose archers were increasingly recruited as professionals by indenture (Bell, Curry, King and Simpkin, The Soldier in Later Medieval England, 2013). At the Town Center because it rests on the Crown’s legislation, a state matter (RULES 6.2); the tower half fits the Statute’s watch. This is now the civ’s only range bonus: the passive renders rate of shooting instead (level-1 review, section 9)."
relevance = "The Crown’s arms legislation kept England supplied with archers from Falkirk to Agincourt, and the yeoman archer is the popular image of English arms."
contested = "In the 14th century ‘yeoman’ (yeman, Latin valettus) meant a household servant or attendant of middling rank (Chaucer’s Yeoman is the Knight’s forester-archer); the sense of a substantial free smallholder is mainly 15th-century (Middle English Dictionary). The tower bonus has also been read as an allusion to the Yeomen Warders of the Tower of London, but that body descends from the Yeomen of the Guard (1485), at the very end of the window; the link to the Statute’s watch is this design’s reading."

[[unique_tech]]
name = "Chevauchée"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Knight-line and Scout Cavalry-line +2 attack vs. buildings; loot 25% of the resource cost of each destroyed building (by any unit)"
level = 2
change = "new"
replaces = "Warwolf (Trebuchets deal blast damage and are more accurate)"
precedent = "Effect 1: Scout Cavalry-line and Camel Units +2 attack vs. buildings (Hindustanis team bonus), with the Knight-line in place of the Camel Units; effect 2: Loot 25% of the resource cost of each destroyed building (Danes), with the same scope. Other designs reuse both effects as passives or team bonuses, each on its own history (RULES 6.16.12). No existing unique tech renders a raiding strategy: the game has these effects only as a passive bonus and a team bonus."
basis = "The chevauchée, the great mounted raid that burned and plundered across enemy country, was the core of Edward III’s strategy: the Cambrésis (1339), Normandy on the way to Crécy (1346), the Black Prince’s raids from Bordeaux to Narbonne (1355) and towards the Loire before Poitiers (1356), and Reims (1359–60) (Rogers, War Cruel and Sharp, 2000; Sumption). The later raids of Knolles (1370), John of Gaunt (1373, from Calais to Bordeaux) and Buckingham (1380–81) failed to bring the French to battle, and Henry V’s war (1415–22) was one of sieges and occupation instead. The whole army rode. The Knight-line stands for the men-at-arms, and the Scout Cavalry-line for the hobelars, light horsemen raised first in the English lordship of Ireland (the first of them came to Edward I’s Scottish campaign of 1296) and then in England, who rode with Edward III’s armies in the 1330s and 1340s until the mounted archers replaced them (Morris 1914; Lydon 1954; Prestwich 1996; see the Gaels’ contested note on the hobelar); the mounted archers, who rode with the raids and shot on foot, are the foot archers. The loot applies to every enemy building destroyed, as in the Danes’ bonus, since the engine ties no loot to a unit class. Replaces Warwolf, dropped under the relevance test (see [[dropped]]); the analysis proposed this tech."
relevance = "The chevauchées were how Edward III and the Black Prince waged the war (1339–1360), bringing on Crécy, Poitiers and the Treaty of Brétigny (1360), and a recurring English strategy until the 1380s."
contested = "What the raids were for (see the civ-level contested list)."

[tree]
add = ["Bombard Cannon", "Carrack", "Crop Rotation"]
remove = ["Mounted Crossbowman", "Heavy Mounted Crossbowman", "Cranequins", "Siphons"]

[tree.basis]
"Bombard Cannon" = "English armies besieged with gunpowder artillery: guns at the siege of Calais (1346–47), Henry V’s train of great guns at Harfleur (1415) and the artillery of the conquest of Normandy (Caen 1417, Rouen 1418–19) (Sumption, vol. IV). The civ already had the Cannon Galleon; land artillery removes that incoherence. The Hand Cannoneer is not added: handgunners in English armies are documented mainly in the Wars of the Roses (Edward IV’s Flemish handgunners in 1471; the Bosworth shot of 1485), after the design core (see contested)."
"Carrack" = "Genoese carracks captured at the battle of the Seine (1416) were taken into Henry V’s navy, which also built its own ‘great ships’, the largest being the Grace Dieu (launched 1418); the Mary Rose (1511), built just after the window, shows the type in English service (Rodger, The Safeguard of the Sea, 1997). In the game the Britons were the only civ of the region without it. Navy tier (RULES 6.16.1): a fleet of ships, from the royal cogs of Edward III’s war (Sluys, 1340) to Henry V’s great ships, with the Galleon as the skeleton’s flagged abstraction (RULES 6.16.2); the Cannon Galleon rests on guns aboard English warships from the 1330s (the cog Christopher is reported with three guns and a handgun when the French took her at Arnemuiden, 1338)."
"Crop Rotation" = "The open fields of the Midland system were worked in two- and three-course rotations, with the fallow course grazed by the village’s livestock (David Hall, The Open Fields of England, 2014). The game gives the tech to the Saxons (now the Anglo-Saxons’ design, which ends in 1066) but not to the Britons, who stand for later medieval England, a reversed chronology (RULES 6.12)."
"Mounted Crossbowman" = "Shared basis (level-1 review, section 3.2): the Mounted Crossbowman line stays only where shooting from the saddle is documented. Crossbowmen, many of them foreign (Gascon, Brabançon, Genoese), were important in Angevin and early Edwardian armies, among them mounted crossbowmen (balistarii equites) in the pay of John and Henry III, but nothing shows them shooting from the saddle rather than using their horses to move. After c. 1300 the longbow displaced the crossbow in English field armies, and the ‘mounted archers’ of the Hundred Years War rode to battle and shot on foot with the longbow (Strickland and Hardy 2005; Prestwich 1996; Ayton 1994). Removed; no substitute is needed, since the archers are the foot Archer line and the Longbowman (see the N2 idea of a dismounting mounted archer). The Franks’ and Burgundians’ designs drop the line on the same test, and the Germans’ design keeps it on Hans Talhoffer’s depiction of mounted crossbow combat (1467), evidence from the Empire. No English crossbow cavalry of that kind is recorded: English field armies had given up the crossbow for the longbow after c. 1300, and the crossbow survived mainly in garrisons and at sea."
"Heavy Mounted Crossbowman" = "Same reason as the Mounted Crossbowman."
"Cranequins" = "The cranequin (rack-and-pinion spanning device) is a 15th-century continental crossbow fitting; it has no place in an army built on the longbow."
"Siphons" = "Named after the Byzantine fire siphon, the projector of Greek fire, a state secret that Constantine VII ordered never to be given to another nation (De Administrando Imperio 13); its game effect, an explosive charge for fire ships, has no medieval English equivalent. The fire-ship line itself stays as the engine’s convention for close-range incendiary warships."

[architecture]
set = "Western European"
change = "kept"
basis = "Anglo-Norman Romanesque (Durham, the Tower of London) and English Gothic, with the stone castles of Edward I’s Welsh programme (Arnold Taylor, The Welsh Castles of Edward I, 1986)."

[[dropped]]
item = "Warwolf (Trebuchets deal blast damage and are more accurate)"
kind = "unique_tech"
reason = "Relevance test (RULES 6.9): the Warwolf was a single engine built for a single siege, Stirling (1304), whose garrison Edward I would not let surrender until the engine had been tried (Prestwich, Edward I, 1988); erasing it changes neither the course nor the identity of medieval England, and ‘blast damage’ is a game invention (a trebuchet threw one heavy stone). Its Castle slot goes to the Chevauchée, the weightier trait the civ lacked. Its fame in the game does not keep it, neither in place of the Chevauchée nor as a third tech: fame alone does not justify a slot (RULES 6.9)."
