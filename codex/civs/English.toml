civ = "Britons"
name = "English"
original_name = "Britons"
status = "reviewed"
label = "Foot Archer civilization"
summary = "Britons renamed English for England after 1066 (core c. 1277–1453): faster shooting replaces the archers’ range passive, Yeomen moves to the Town Center, the Chevauchée replaces Warwolf, dismounted men-at-arms gain armour, archers serving allies carry the team bonus, and the Mounted Crossbowman line leaves the tree as Bombard Cannon, Carrack and Crop Rotation join it."
ideas = [
  "N2: A mounted archer that rides at cavalry speed and dismounts to shoot as a Longbowman (the Ratha’s mode switch), as the historical substitute for the removed Mounted Crossbowman line: English mounted archers rode to the fight and shot on foot (Strickland and Hardy, The Great Warbow, 2005).",
  "N2: Rebalance the Longbowman’s own stats towards a faster rate of fire and only slightly more range than the Arbalester, since the war bow’s edge lay in shooting rate and massed volleys rather than range (Strickland and Hardy 2005; Curry 2005); in N1 the passive carries the rate of fire (+20% in the Imperial Age, the owner’s decision, level 2) and Yeomen the range.",
  "N2: Split the Archer and Crossbowman lines (RULES section 10), so that the longbow bonuses stop applying to crossbows, which English field armies used little after c. 1300.",
  "N2: A ‘Bill’ name or variant for the late-medieval English polearm infantry (Wars of the Roses; still used at Flodden, 1513).",
  "N3: An Anglo-Norman layer (the French-speaking elite and the Angevin lands, 1066–1204): the window includes it, but this design, centred on 1277–1453, draws on it only for forerunners (the dismounted knights of Tinchebray and the Standard) and for the Romanesque of its architecture; Normandy itself falls within the Franks’ France.",
  "N3: A Brythonic civ (Welsh, Cornish, Bretons), which can take the name ‘Britons’ that this civ’s rename frees (RULES section 4): the archers of Gwent praised by Gerald of Wales, Owain Glyndŵr’s revolt, the Breton captains of the Hundred Years War.",
]
contested = [
  "The name. In English scholarship ‘Britons’ means the Brythonic peoples (Welsh, Cornish, Bretons) whom the English displaced, so the civ is called English (RULES section 4). How soon the French-speaking elite of the Conquest counted itself English is debated: John Gillingham (The English in the Twelfth Century, 2000) finds an English identity among them by the mid-12th century; Hugh M. Thomas (The English and the Normans: Ethnic Hostility, Assimilation, and Identity 1066–c.1220, 2003) traces the assimilation through the 12th century, largely complete by about 1200, with a further phase into the 13th century in which the descendants of the Norman aristocracy took up English identity as a political cause; and Klaus Hillingmeier, cited by Gillingham, sees a clear English national consciousness only in the mid-13th century. The design’s core (1277–1453) lies after all of these dates.",
  "Where the longbow’s advantage lay: Strickland and Hardy and Anne Curry stress rate of shooting and massed use, with ranges comparable to contemporary crossbows. This design follows that reading: the passive renders rate of shooting, and range is kept once, through Yeomen, for the weapon’s fame (level-1 review, section 9).",
  "The effect of arrows on plate armour: Clifford Rogers argues for real lethality, Kelly DeVries is more sceptical, and modern tests disagree; arrows killed horses and lightly armoured men above all.",
  "The size of the armies at Agincourt, and so the odds: Anne Curry, from the pay records, puts c. 9,000 English against c. 12,000 French; Sumption, Barker and Rogers count a smaller English army (c. 5,000 archers and 900–1,000 men-at-arms), and Barker and Rogers a French host several times larger. All agree that archers made up the great majority of Henry V’s army.",
  "The Welsh origin of the longbow (Gerald of Wales on the archers of Gwent, 1188) against the view that it was the ordinary European self bow (Strickland and Hardy; Bradbury).",
  "The scale of English gunpowder use at Crécy (1346): reported by Giovanni Villani, absent from most other accounts.",
  "How common hand guns were in English armies before 1485: the royal stores held guns from the 1340s, but handgunners in the field are documented mainly in the Wars of the Roses, from the 300 Flemish handgunners who landed with Edward IV in 1471 (Warkworth’s Chronicle) to the lead shot from small guns found by the battlefield survey of Bosworth, 1485 (Foard and Curry, 2013). This design adds the Bombard Cannon, whose siege guns of Calais, Harfleur and Normandy fall inside its core (c. 1277–1453), but not the Hand Cannoneer, whose field evidence comes after it (RULES 6.16.19(d): the tree follows the period the design represents); that some of the gunners were hired foreigners is not the reason (hired handgunners give the unit to the Danes, Poles and Magyars).",
  "What the chevauchées were for: Clifford Rogers argues that Edward III used them to force the French to battle as well as to ruin the Valois tax base; other historians stress plunder and economic war that avoided battle.",
]
open_questions = []

