[[bonus]]
text = "Military Units cost -15/20/25/30% food in Dark/Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Military Units cost -15/20/25/30% food in Dark/Feudal/Castle/Imperial Age (Incas)"
basis = "The state stored food, cloth and weapons in thousands of storehouses (qullqa) along the roads, such as the hundreds above Huánuco Pampa studied by Craig Morris and the some 2,400 of Cotapachi, and fed its armies from them on the march; freeze-dried potatoes (chuño) and dried meat (ch'arki) kept for years (Murra 1980; D'Altroy 2014)."
relevance = "The qullqa that fed armies on the march were the logistical core of Inca expansion; the rules themselves name them as a trait that passes on weight alone."

[[bonus]]
text = "Villagers affected by Infantry Blacksmith upgrades starting in Castle Age"
kind = "military"
level = 1
change = "kept"
precedent = "Villagers affected by Infantry Blacksmith upgrades starting in Castle Age (Incas)"
basis = "Military service was a form of mit'a: adult tributary men (hatun runa) served as soldiers in rotating turns and went back to their fields (Murra 1980; D'Altroy 2014)."
relevance = "Rotating labour service, the mit'a, was the basis of the Inca state, and the farmer and the soldier were the same man."

[[bonus]]
text = "Buildings +5/10/15/20% HP in Dark/Feudal/Castle/Imperial Age"
kind = "other"
level = 1
change = "changed"
replaces = "Buildings cost -15% stone"
precedent = "Buildings +10/20/30/40% HP in Dark/Feudal/Castle/Imperial Age (Byzantines), at half the magnitude"
basis = "Inca fitted-stone masonry (the Qurikancha, Sacsayhuamán, Ollantaytambo) was costly in mit'a labour, not cheap in stone, and built to last: the Inca walls of Cusco withstood the earthquakes of 1650 and 1950 that brought down colonial buildings (Hemming & Ranney 1982; D'Altroy 2014). Durability renders this better than a stone discount, as the project's analysis proposes. The bonus covers all buildings rather than fortifications alone, since the earthquake evidence concerns temples, palaces and enclosure walls rather than forts."
relevance = "Inca stonework, raised by state labour to last, is with the roads the most famous Inca achievement and a statement of imperial power."

[[bonus]]
text = "Start with a free Llama; Shepherds work +25% faster"
kind = "economic"
level = 1
change = "new"
replaces = "Houses and Settlements provide +5 population space"
precedent = "Start with a free Llama (Incas team bonus); Shepherds work +25% faster (Britons)"
basis = "Llamas and alpacas were the only large domesticated animals of the Americas: the state and the communities kept great herds for wool, for meat dried as ch'arki and for caravan transport (a llama carries some 25–30 kg), tended by herders and counted on khipu (Murra 1965; D'Altroy 2014). The free Llama moves here from the team bonus, which must show a benefit to allies (RULES 6.2). The population bonus it replaces had no clear historical link (rated stretched)."
relevance = "Llamas and alpacas, the only large domesticated animals of the Americas, carried the state's goods along the roads and gave wool and preserved meat."

[team_bonus]
text = "Units more resistant to conversion"
level = 1
change = "new"
replaces = "Start with a free Llama"
precedent = "Units more resistant to conversion (Teutons team bonus)"
basis = "The Inca won allies as well as subjects. Under Viracocha Inca they allied with Cari, lord of Chucuito (the Lupaqa of Lake Titicaca), against his rival Zapana of Hatun Colla; Cari defeated Zapana, who died in the battle, prepared lodgings and provisions for the Inca at Chucuito, and the two lords agreed a peace there (Cieza, part II, chapters 42–43). The Inca bound allied and newly subject lords to the state with gifts of fine cloth (qumpi, woven by the aqllakuna and by male specialists, qumpikamayuq), women and feasts under the norms of Andean reciprocity, offered peaceful submission before war (Chincha, for one, submitted without a battle), and rewarded soldiers with cloth (Murra 1962; Murra 1980). The lords who received Inca cloth gave it on to their own followers and so kept them loyal: the effect, allied units that are harder to turn, is a metaphor for that gift-bound loyalty, since the game's conversion models religious persuasion. RULES 6.2: alliances. The free Llama it replaces showed a benefit to the Inca themselves only and moves to a passive bonus. The game's Teutons have the same team bonus; the Germans' design turns it into a passive (the vows of the Order's brethren), as the Lithuanians' design does (a pagan people holding to its faith), so on a team with either their units receive the effect both from their own passive and from this team bonus, an overlap accepted since each copy rests on its own history (RULES 6.7, 6.16.12)."
relevance = "Alliances, from Viracocha Inca's pact with Cari of Chucuito on, and reciprocity sealed with gifts of cloth were how the Inca turned dozens of lordships into allies and subjects, often without a battle."
contested = "Most lords bound by reciprocity became Inca subjects. The alliance with Cari is the clearest case of an independent ally; it is known from Cieza's informants and falls in the reign of Viracocha Inca, before Pachacuti, whose chronology is contested (see the civ-level notes). Other chroniclers (Sarmiento) place the war in the Collao under Pachacuti, against Chuchi Capac, lord of Hatun Colla, rather than in Viracocha's reign with Cari against Zapana. The Lupaqa were later incorporated into the empire."

[[unique_unit]]
name = "Awqa Kamayuq"
model = "Kamayuk"
building = "Castle"
level = 1
change = "changed"
replaces = "Kamayuk"
basis = "Inca armies were provincial levies, each with its own arms (slings, star-headed maces, clubs, lances and, from the Antisuyu, bows); long spears belonged to that arsenal: Xerez (1534), describing the arms and order of Atahualpa's armies (1532–33), puts in the rearguard pikemen with lances thirty palms long (some 6 m), who wore on the left arm a sleeve padded with cotton on which they worked the lance (Xerez; Hemming 1970; D'Altroy 2014). The unit keeps its stats but not its truncated name: kamayuq means ‘specialist’ or ‘person in charge’ (as in khipukamayuq), while Guaman Poma calls the age grade of all adult warrior-tributaries auca camayoc (awqa kamayuq, ‘warrior’). The model is shared with the Berbers' Murabit, the Ethiopians' Chewa Spearman and the Mapuche Colihue Lancer."
relevance = "Long lances were one of the main arms of Inca infantry, which fought only on foot; the name restores Guaman Poma's term for the adult warrior."
contested = "Xerez describes Atahualpa's armies of 1532–33, and the earlier use of the pike is inferred; the analysis rates the unit plausible."

[[unique_tech]]
name = "Andean Sling"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Skirmishers and Slingers no minimum range; Slingers +1 attack"
level = 1
change = "kept"
precedent = "Andean Sling (Incas)"
basis = "The sling (warak'a) was the main Andean missile weapon, preferred to the bow in the highlands: Xerez (1534), describing the order of Atahualpa's armies, puts the slingers in the van, and conquest accounts stress that sling stones could badly hurt men and horses (Hemming 1970). Removing the minimum range abstracts a weapon that could be used at any distance. A kept existing tech for a long weapon tradition, held as a tech rather than a passive by the effect-size tie-break (RULES 6.2.4); its Castle Age follows the current game, since neither Castle tech marks a datable moment. Decision: it stays a tech, as does Fabric Shields, as a flagged fallback (RULES 6.16.19 b) rather than becoming a passive bonus: it is the game's own Inca tech, its strong effect suits the brake of a tech, and the civ's datable moments, the roads and the resettlements, hold the Town Center."
relevance = "The sling was the missile weapon of the Andes, and slingers were the Inca army's missile troops."

[[unique_tech]]
name = "Fabric Shields"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Awqa Kamayuqs, Slingers and Champi Warriors +1 melee/+1 pierce armor"
level = 1
change = "kept"
precedent = "Fabric Shields (Incas)"
basis = "The name is the game's, and the effect renders the Andean soldier's shield together with padded cotton. Andean shields were of wood or cane, sometimes faced with hide or cloth (analysis, rated plausible). Xerez (1534), describing the arms and order of Atahualpa's armies, gives the slingers of the van shields of narrow, very strong slats and doublets quilted with cotton, and the pikemen of the rearguard a cotton-padded sleeve on the left arm; the state stored cloth and arms in the qullqa and issued them for war (Murra 1980). This tech carries Xerez's cotton evidence alone: no Blacksmith tier is renamed after it, since the slingers' doublets fit the generic Padded Archer Armor, whose name already means quilted armour, and the pikemen's sleeve is a lance rest, not body armour (see Tin Bronze). A kept existing tech for an equipment tradition, held as a tech by the effect-size tie-break (RULES 6.2.4), a flagged fallback (RULES 6.16.19 b); its Imperial Age follows the current game. In-game text: ‘Kamayuks, Slingers and Champi Warriors +1 melee/+1 pierce armor’; only the unit name changes."
relevance = "Shields and padded cotton were the Andean soldier's only body protection, and the state stored and issued them for war."

[[unique_tech]]
name = "Qhapaq Ñan"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Infantry and Villagers move +10% faster"
level = 2
change = "new"
precedent = "Infantry moves +10% faster (Squires) and Villagers move +5% faster in Dark Age, +10% faster starting in Feudal Age (Berbers): one effect type, movement speed, applied to both targets at +10%. With Squires, Inca infantry moves about +21% faster (1.10 × 1.10), within the game's ceiling for the infantry class (RULES 6.16.11): the game's Lithuanian Spearman-line (+10%) reaches the same with Squires, and the game's Muisca Champi Warriors about +26% with Herbalism and Squires. It is slightly faster than the infantry of the game's Celts (+15/+20% in the Castle/Imperial Age, without Squires), whose bonus the Gaels' design keeps. No existing unique tech renders a road system (Grand Trunk Road has a road's name but a gold effect)."
basis = "The Qhapaq Ñan, a network of some 30,000–40,000 km of roads with stairways, suspension bridges and waystations (tampu) about a day's walk apart, moved armies, mit'a labourers and llama caravans across the empire (Hyslop 1984; Cieza de León). Built mainly under Pachacuti and Thupa Inca, and incorporating older Wari and Chimú roads (Hyslop 1984), it is the state infrastructure of the empire (RULES 6.2: state). Faster infantry and villagers render the roads; the relay runners (chaski) are an N2 idea (see ideas). Villager speed is not also given as a passive bonus, so the roads are not counted twice."
relevance = "The road network held the Tawantinsuyu together: without it there would have been no Andean empire of this size."

[[unique_tech]]
name = "Mitmaqkuna"
building = "Town Center"
kind = "civil"
age = "Imperial"
effect = "Settlements can train Spearman-line and Skirmishers"
level = 2
change = "new"
precedent = "Settlements can train Spearman-line and Skirmishers (Mapuche civ bonus), as a tech; the Mapuche design keeps it as a passive for their lof levies (RULES 6.7). No existing unique tech renders the resettlement of colonists."
basis = "The Inca moved whole communities from their homelands to other provinces as mitmaqkuna (‘those moved out’): loyal colonists to garrison the frontiers and watch newly conquered peoples, restive groups away from their homes, and farmers and craftsmen to work for the state, as in the Cochabamba valley, where Huayna Capac settled thousands of workers to grow maize for the state storehouses (Wachtel 1982; D'Altroy 2014). The chroniclers credit Pachacuti and above all Thupa Inca with the policy, together with the decimal census (Cieza; Sarmiento; the census is an N2 idea). Settlements that raise spearmen and skirmishers render the garrison colonies of the frontiers. A distinct institution, so a second Town Center tech (RULES 6.2, 6.3); Imperial Age, after the roads, since the largest colonisation projects, such as Cochabamba, belong to Huayna Capac's reign."
relevance = "Resettlement held the empire's conquests and redrew the ethnic map of the Andes; with the roads and the census it defined Inca rule."
contested = "The scale of the resettlements and how much of the policy was new under the Inca are debated (see the civ-level note)."

[tree]
add = ["Architecture", "Traction Trebuchet"]
remove = [
  "Battering Ram", "Capped Ram", "Siege Ram", "Mangonel", "Onager",
  "Scorpion", "Heavy Scorpion", "Siege Tower", "Trebuchet", "Siege Engineers",
  "Crossbowman", "Arbalester", "Thumb Ring",
  "Halberdier",
  "Galleon", "Carrack", "Catapult Galleon", "Fast Fire Ship", "Galleon, Fast Fire Ship and Carrack",
  "Block Printing", "Guilds",
]

[tree.basis]
"Traction Trebuchet" = "Game convention (RULES 6.16.5, the heavy-engine floor; owner’s decision of 20 October 2026), not a historical claim: no siege engine of any kind existed in the pre-contact Americas (see the Trebuchet). Every civ keeps one heavy engine so that it can answer an enemy’s trebuchets, and the traction trebuchet, a man-powered engine known across Eurasia and North Africa from the late 6th century, is the oldest and most widespread of the three heavy engines, so the least anachronistic choice. The Siege Workshop stays in the tree for this engine alone. For its other units the design’s reading stands: Andean armies built no siege engines: forts (pukara) were taken by assault, blockade and fire, and the frontier forts of Pambamarca were held for years of war against the Cayambe. The Champi line, Arson, Sappers and Petards replace them (owner's decision, RULES 6.16.5; RULES 6.11 and section 10). Before the heavy-engine floor every Castle had to be taken by units standing in its arrow fire; the Traction Trebuchet now does it from range, as a game convention, until an N2/N3 assault unit exists, with no compensating bonus (RULES 6.16.13). The Petard, a 16th-century gunpowder charge, stays unrenamed as a flagged generic abstraction of assault parties with fire, outside the one-late-element limit (RULES 6.16.2). Incendiary sling stones, recorded at Manco Inca's siege of Cusco (1536), are left to the ideas as an N2 burning effect."
"Architecture" = "The Inca were master builders in fitted stone (Sacsayhuamán, the Qurikancha, Ollantaytambo), yet the civ had Masonry and Keep but not Architecture. The Keep fits them, since the region keeps it only where stone towers are documented: Sacsayhuamán had three towers, Muyuq Marka, Sallaq Marka and Paucar Marka, which Garcilaso describes. Treadmill Crane, which the Inca hold in the game, is renamed Mit'a, after the rotating labour service that raised these buildings (see the renames)."
"Battering Ram" = "Removed with the Siege Workshop: there were no rams and no wheeled vehicles in the Andes."
"Capped Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Siege Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Mangonel" = "Removed with the Siege Workshop: no torsion or traction artillery existed in the Americas."
"Onager" = "Removed with the Siege Workshop (see Mangonel)."
"Scorpion" = "Removed with the Siege Workshop: no bolt-throwers existed in the Americas."
"Heavy Scorpion" = "Removed with the Siege Workshop (see Scorpion)."
"Siege Tower" = "Removed with the Siege Workshop: a wheeled assault tower."
"Trebuchet" = "Counterweight artillery never existed in the Americas."
"Siege Engineers" = "No siege engines are left to improve."
"Crossbowman" = "The crossbow was unknown in the Americas, which have neither crossbow tier (RULES 6.16.3); Inca missile troops were slingers, with bowmen from the eastern lowlands (Antisuyu). Archers and Slingers cover the role. In the current game the Bulgarians also lack crossbows (so do the current Spanish; the Castilian and Bulgarian designs restore the Crossbowman)."
"Arbalester" = "Removed with the Crossbowman (see there)."
"Thumb Ring" = "No thumb rings or thumb draw are attested in the Americas, so the tech goes (RULES 6.16.4)."
"Halberdier" = "Removed under the codex convention for the American civs (RULES 6.16.6, the owner's decision on their power budget): a playability line, not a historical one, since the kept Pikeman bears as European a name; the American spear line stops at the Pikeman, as the game already does for the Aztecs and Muisca. The Inca have the region's strongest case for the tier: Xerez (1534), describing the arms of Atahualpa's armies, gives axes with a metal blade a palm wide, ‘como alabarda’ (like a halberd), beside pikemen with lances thirty palms long. The pikes are the Awqa Kamayuq, Spearman and Pikeman remain, and the Andes knew no cavalry before 1532."
"Galleon" = "Ocean-going sailing warships were unknown. Andean seafaring used balsa rafts with cotton sails, such as the raft that Bartolomé Ruiz intercepted off Ecuador c. 1526, which probably belonged to coastal merchants rather than to the Inca state, and reed boats; no Inca war fleet is documented, and Thupa Inca's raft voyage into the Pacific, told by Sarmiento, is contested. Basic navy (RULES 6.16.1), since the Inca had no war fleet of their own: the galleys, fire ships, the Hulk line, the demolition ships and the generic Dock techs stay as an abstraction for water maps, without the Galleon, Carrack, Fast Fire Ship or a siege warship; the demolition ships are generic post-1500 items kept as flagged abstractions (RULES 6.16.2). The Scenario Editor Canoe, a dugout, does not render sailing rafts, so the Galley keeps its look (the balsa raft is an N3 idea)."
"Carrack" = "High-castled sailing warships were unknown (see Galleon)."
"Fast Fire Ship" = "Removed under the basic navy (see Galleon); the Fire Ship stays."
"Galleon, Fast Fire Ship and Carrack" = "With the Galleon, Fast Fire Ship and Carrack removed, this upgrade has nothing left to upgrade."
"Catapult Galleon" = "A sailing ship carrying a catapult: both a European ship type and a siege engine."
"Block Printing" = "There was no printing, nor writing in the usual sense: records were kept on knotted cords (khipu). With no equivalent for the function the tech is removed (18 of the game's 56 civs already lack it)."
"Guilds" = "The Inca economy ran on mit'a labour, storehouses and redistribution, with local barter (qhatu) but, apart from the debated coastal merchants of Chincha (see contested), no professional merchant class like the pochteca (Murra 1980); the current game gave Guilds to the Inca but not to the Aztecs, who had the pochteca."

[[rename]]
from = "Horse Collar"
to = "Andenes"
level = 1
basis = "There were no draft animals. Stone-walled, often irrigated terraces (andenes, the term used in Andean scholarship) turned the mountain slopes into fields, as at Pisac, Moray and the Colca valley (Donkin 1979). A rename beyond the agreed list, applied under RULES 6.16.6. Crop Rotation keeps its generic name as a flagged abstraction (RULES 6.16.6), since no Andean equivalent with a period term was found."

[[rename]]
from = "Heavy Plow"
to = "Chakitaqlla"
level = 1
basis = "Agreed rename. The chakitaqlla, a foot plough with a footrest, was the Andean tillage tool; Guaman Poma draws it in his agricultural calendar."

[[rename]]
from = "Hand Cart"
to = "Llama Caravans"
level = 1
basis = "Agreed rename. There were no carts; llama caravans carried about 25–30 kg per animal across the Andes. Wheelbarrow keeps its generic name as a flagged abstraction (RULES 6.16.6): there were no wheeled vehicles, and loads went on porters' backs and on llamas. The generic Caravan (Trade Units) keeps its name, so two caravan techs appear. Decision: kept so, since renaming Caravan as well would add a name without an equivalent. The Trade Cart also keeps its generic name and wheeled look, as a flagged abstraction of porters and llama trains (RULES 6.16.6). A llama look for it would be possible in level 1 (the herdable Llama, or the Alpaca of the Scenario Editor, RULES section 5, whose look and behaviour as a trade unit would have to be checked in game), but the Inca had no trade between markets for the unit to render, since exchange ran on redistribution and local barter (see Guilds), and the llama name is already this tech's; so the llama trade unit stays with the N3 idea of llamas as pack animals."

[[rename]]
from = "Banking"
to = "Khipu"
level = 1
basis = "Agreed rename. Knotted-cord records kept by specialists (khipukamayuq) registered census, tribute and storehouse accounts (Urton 2003). The rename keeps Banking's effect (tributes to other players are free) for the shared ground of state accounting; it does not imply that khipu moved goods between polities. Coinage, which Khipu requires, keeps its generic name as a flagged abstraction (RULES 6.16.6): the Inca had no money, and exchange ran on labour service, storehouses and local barter (Murra 1980)."

[[rename]]
from = "Treadmill Crane"
to = "Mit'a"
level = 1
basis = "There were no cranes or treadwheels: the stones of Inca masonry were hauled with ropes and levers and raised on earthen ramps, such as the ramp by which blocks from the Kachiqhata quarries were dragged up to the Temple of the Sun at Ollantaytambo (Protzen 1993), by labourers who came by the mit'a (‘turn’), the rotating labour service that tributary households owed to the state (Murra 1980; D'Altroy 2014). Cieza (part II, chapter 51) says that the provinces sent twenty thousand men for the works of the fortress of Cusco (Sacsayhuamán), who worked there for a limited time and were then relieved by others. Same effect as Treadmill Crane (Villagers construct buildings +20% faster): organised labour in turns is the Inca equivalent of faster building, as the Aztecs' Coatequitl renders the Mexica labour draft for public works. A rename beyond the agreed list, applied under RULES 6.16.6 and 6.16.15: mit'a is a period term (the chroniclers' mita), and building by rotating labour is the same function inside the window. The mit'a also covered work on the state's fields and herds, weaving and military service (see the Villagers bonus); the rename gives the building turns their name and adds no element of its own."

[[rename]]
from = "Iron Casting"
to = "Tin Bronze"
level = 1
basis = "There was no iron. After the Inca conquest tin bronze spread at the expense of the older arsenical bronze in regions such as the Upper Mantaro Valley, while plain copper remained common (Owen 2001), and Lechtman describes tin bronze as the alloy the Inca state spread through its provinces (Lechtman 2007); bronze served for tools and for the star-shaped heads of champi maces. Same effect as Iron Casting; a rename beyond the agreed list, applied under RULES 6.16.6. The other Blacksmith tiers keep their generic names as a flagged generic equipment level (RULES 6.16.6): Forging and Blast Furnace, since Andean metallurgy worked gold, silver, copper and bronze, never iron, and the huayrachina furnace does not fit Blast Furnace (see contested); Bodkin Arrow, although there were no iron arrowheads; and Scale Mail, Chain Mail and Plate Mail Armor and Ring Archer Armor, since there was no metal body armour, only the metal discs some warriors wore on the chest and back, which marked rank as much as they protected. No infantry armour tier is renamed after cotton (RULES 6.16.15): the only infantry cotton item in Xerez is the pikemen's padded sleeve, a lance rest rather than body armour, and the quilted doublets he gives the slingers fit the generic Padded Archer Armor, whose name already means quilted armour; that evidence is carried by Fabric Shields. Chemistry stays for its +1 ranged attack as a flagged abstraction, although the Inca had no gunpowder."
contested = "How far the Inca imposed a standard alloy is debated."

