civ = "Incas"
name = "Inca"
status = "reviewed"
label = "Infantry civilization"
summary = "The Tawantinsuyu (1400–1533): the roads and the mitmaqkuna colonies become Town Center techs, fitted stonework makes buildings tougher instead of cheaper, llama herding and cloth gifts to allied lords replace the population and Llama bonuses, and siege engines, crossbows, the Halberdier and the sailing warships go."
ideas = [
  "N2: Relay posts (chaski) on the roads: Outposts that cost no stone and give +3 line of sight (the game's Ethiopian team bonus, which the Mongols' design puts in their Yam tech), built instantly, and cheaper Spies, completing the Qhapaq Ñan tech (analysis proposal).",
  "N2: The decimal administration (households counted on khipu in units of 10 to 10,000 under hereditary and appointed lords, credited to Thupa Inca) as a population or labour mechanic; the replaced ‘Houses and Settlements provide +5 population space’ could be re-read this way.",
  "N3: Replace the Market with a qullqa (state storehouse) that redistributes rather than buys and sells, with income from mit'a labour.",
  "N3: Llamas as pack animals: a mobile dropsite like the Mule Cart, and llama caravans as the Trade Cart (the owner's N3 idea of other pack animals; in N1 the Mule Cart stays with its four holders, RULES 6.16.7).",
  "N3: Balsa sailing rafts (the raft with cotton sails intercepted by Bartolomé Ruiz off Ecuador c. 1526) replacing the Galley-line and Trade Cog.",
  "N3: Captured huacas: enemy cult objects taken to Cusco as hostages, instead of conversion.",
  "N2: Incendiary sling stones as a burning (damage-over-time) effect on buildings, after Manco Inca's siege of Cusco (1536); a post-1500 element, so only possible in the Imperial Age (RULES section 2). Boleadoras (liwi) slowing cavalry, as in Manco Inca's rebellion.",
  "N2: A bow line split from the Crossbowman (RULES section 10), so the bowmen levied from the Antisuyu can improve without crossbows, while the sling stays the main missile weapon.",
]
contested = [
  "Chronology of the expansion: 1438 (Rowe, after Cabello Valboa) or earlier radiocarbon dates (Ogburn 2012; Marsh et al. 2017).",
  "The historicity of the Chanka war and of Pachacuti as sole reformer, largely dynastic propaganda.",
  "Dual rulership (Zuidema, Duviols) or a single line of succession.",
  "The nature of the state: Baudin's ‘socialist empire’ (1928, discredited) or reciprocity and redistribution (Murra).",
  "Specialised merchants at Chincha: Rostworowski (1970), on the anonymous Aviso of c. 1570 (‘six thousand merchants’), against Murra's model of a redistributive economy without a merchant class.",
  "Khipu as writing or as numerical records only (Urton; Hyland).",
  "How far the Inca standardised tin bronze: it spread at the expense of arsenical bronze in the Upper Mantaro Valley after the conquest while copper stayed common (Owen 2001), and local alloys continued elsewhere (studies in north-west Argentina).",
  "The scale of the mitmaqkuna resettlements: the chroniclers' figures are high and uncertain, and how much of the policy was new under the Inca is debated (D'Altroy 2014).",
  "The southern frontier: the chroniclers' Maule (Garcilaso's battle of the Maule) against archaeological evidence for direct Inca control only to the Maipo–Cachapoal line (Stehberg).",
  "Blast Furnace as huayrachina: the tech-tree theme proposes renaming it after the Andean wind furnace, but that furnace smelted silver rather than weapon metal and its pre-Hispanic use is debated, so the tech keeps its generic name as a flagged equipment level (RULES 6.16.6).",
  "The civ's name: ‘Inca’ was the title of the ruler and of the ruling lineage, and the state, Tawantinsuyu, included dozens of peoples (Chimú, Cañari, Chanka, Wanka, Aymara lordships). Decision: the name stays under RULES 6.16.15 (a civ is renamed only where standard English scholarship does not use the game's name), since English scholarship uses ‘Inca’ (or ‘Inka’) for the state (Hemming 1970; D'Altroy 2014); the renames decided in the level-1 review were limited to the English, Anglo-Saxons and Arabs. The profile names the Tawantinsuyu.",
  "The cause and date of Huayna Capac's death (c. 1524–1528) and the date of Atahualpa's execution (26 July or 29 August 1533).",
]
open_questions = []

[profile]
entity = "Tawantinsuyu, the state ruled by the Inca lineage of Cusco"
region = "The Andes from southern Colombia to the Maipo–Cachapoal (traditionally the Maule): Peru, Ecuador, Bolivia, northern and central Chile and north-west Argentina"
window = "1400–1533 (expansion of the Tawantinsuyu to Atahualpa's execution, with its core in the expansion and reforms of Pachacuti and Thupa Inca in the 15th century: from c. 1400 on radiocarbon dates, or 1438 in Rowe's chronology, to Thupa Inca's death, 1493 in Rowe's; kingdom of Cusco from c. 1200; Vilcabamba until 1572)"
sources = [
  "Francisco de Xerez, Verdadera relación de la conquista del Perú (Seville, 1534)",
  "Juan de Betanzos, Suma y narración de los Incas (1551)",
  "Pedro Cieza de León, Crónica del Perú (1553); part II, El señorío de los Incas (c. 1550, published 1880)",
  "Pedro Sarmiento de Gamboa, Historia de los Incas (1572)",
  "Pedro Pizarro, Relación del descubrimiento y conquista del Perú (1571)",
  "Inca Garcilaso de la Vega, Comentarios Reales (1609)",
  "Felipe Guaman Poma de Ayala, Nueva corónica y buen gobierno (c. 1615)",
  "Bernabé Cobo, Historia del Nuevo Mundo (1653)",
  "John V. Murra, ‘Cloth and its functions in the Inca state’, American Anthropologist 64 (1962)",
  "John V. Murra, ‘Herds and herders in the Inca state’, in A. Leeds & A. P. Vayda (eds.), Man, Culture, and Animals (1965)",
  "John V. Murra, The Economic Organization of the Inka State (1956/1980)",
  "John Hyslop, The Inka Road System (1984); Inka Settlement Planning (1990)",
  "Nathan Wachtel, ‘The mitimas of the Cochabamba Valley: the colonization policy of Huayna Capac’, in G. A. Collier, R. I. Rosaldo & J. D. Wirth (eds.), The Inca and Aztec States, 1400–1800 (1982)",
  "Terence N. D'Altroy, The Incas (2nd ed., 2014)",
