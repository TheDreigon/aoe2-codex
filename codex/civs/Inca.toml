civ = "Incas"
name = "Inca"
status = "draft"
label = "Infantry civilization"
summary = "The Tawantinsuyu (1400–1533): the roads and the mitmaqkuna colonies become Town Center techs, fitted stonework makes buildings tougher instead of cheaper, llama herding and cloth gifts to allied lords replace the population and Llama bonuses, and siege engines, crossbows and Imperial metal tiers go."
ideas = [
  "N2: Relay posts (chaski) on the roads: Outposts that cost no stone and give +3 line of sight (the game's Ethiopian team bonus, which the Mongols' design puts in their Yam tech), built instantly, and cheaper Spies, completing the Qhapaq Ñan tech (analysis proposal).",
  "N2: The decimal administration (households counted on khipu in units of 10 to 10,000 under hereditary and appointed lords, credited to Thupa Inca) as a population or labour mechanic; the replaced ‘Houses and Settlements provide +5 population space’ could be re-read this way.",
  "N3: Replace the Market with a qullqa (state storehouse) that redistributes rather than buys and sells, with income from mit'a labour.",
  "N3: Llamas as pack animals: a mobile dropsite like the Mule Cart, and llama caravans as the Trade Cart (the owner's N3 idea of other pack animals).",
  "N3: Balsa sailing rafts (the raft with cotton sails intercepted by Bartolomé Ruiz off Ecuador c. 1526) replacing the Galley-line and Trade Cog.",
  "N3: Captured huacas: enemy cult objects taken to Cusco as hostages, instead of conversion.",
  "N2: Incendiary sling stones as a burning (damage-over-time) effect on buildings, after Manco Inca's siege of Cusco (1536); a post-1500 element, so only possible in the Imperial Age (RULES section 2). Boleadoras (liwi) slowing cavalry, as in Manco Inca's rebellion.",
  "N2: A bow line split from the Crossbowman (RULES section 10), so the bowmen levied from the Antisuyu can improve without crossbows, while the sling stays the main missile weapon.",
]
contested = [
  "Chronology of the expansion: 1438 (Rowe, after Cabello Valboa) or earlier radiocarbon dates (Ogburn 2012; Marsh et al. 2017).",
  "The historicity of the Chanka war and of Pachacuti as sole reformer, largely dynastic propaganda.",
  "Dual rulership (Zuidema, Duviols) or a single line of succession.",
  "The nature of the state: Baudin's ‘socialist empire’ (1928, discredited) or reciprocity and redistribution (Murra).",
  "Specialised merchants at Chincha: Rostworowski (1970), on the anonymous Aviso of c. 1570 (‘six thousand merchants’), against Murra's model of a redistributive economy without a merchant class.",
  "Khipu as writing or as numerical records only (Urton; Hyland).",
  "How far the Inca standardised tin bronze: it spread at the expense of arsenical bronze in the Upper Mantaro Valley after the conquest while copper stayed common (Owen 2001), and local alloys continued elsewhere (studies in north-west Argentina).",
  "The scale of the mitmaqkuna resettlements: the chroniclers' figures are high and uncertain, and how much of the policy was new under the Inca is debated (D'Altroy 2014).",
  "The southern frontier: the chroniclers' Maule (Garcilaso's battle of the Maule) against archaeological evidence for direct Inca control only to the Maipo–Cachapoal line (Stehberg).",
  "Blast Furnace as huayrachina: the tech-tree theme proposes renaming it after the Andean wind furnace, but that furnace smelted silver rather than weapon metal and its pre-Hispanic use is debated, so the tech is removed instead.",
  "The cause and date of Huayna Capac's death (c. 1524–1528) and the date of Atahualpa's execution (26 July or 29 August 1533).",
]
open_questions = [
  "Rename the civ ‘Tawantinsuyu’? ‘Inca’ was the title of the ruler and the ruling lineage, and the state included dozens of peoples (Chimú, Cañari, Chanka, Wanka, Aymara lordships). The renames are decided together in codex-wide question CQ16 (see codex/civs/README.md).",
  "Llama Caravans: the agreed rename puts the llama caravan on Hand Cart (Villager carry capacity and speed), while the generic Caravan (Trade Units move +20% faster) keeps its name, so the civ shows two caravan techs with different effects. Keep, rename Caravan for the Inca, or move the llama caravan to the Trade Cart?",
  "Unique techs: the two Castle techs, Andean Sling and Fabric Shields, are kept existing techs for long weapon and equipment traditions, held as techs by the effect-size tie-break (RULES 6.2.4), not datable moments (RULES 6.3; the general rule is codex-wide question CQ25, point b); the datable moments are the two Town Center techs (Qhapaq Ñan, Mitmaqkuna). Keep both, or turn Andean Sling into a passive bonus (the sling as a long tradition, RULES 6.2)?",
  "Region-wide, siege: the Siege Workshop with all its units, the Trebuchet and Siege Engineers are removed from all six American civs (owner's decision), the first civs in the game without them. Buildings fall to the Champi line, Arson, Sappers and Petards, but every Castle must be taken by units standing in its arrow fire, so castle-breaking will be slow. Accept the risk until an N2/N3 assault unit exists?",
  "Region-wide, metal arms and armour: the criterion is the name of a metal weapon or armour tier. The Imperial-Age tiers (Blast Furnace, Plate Mail Armor, Ring Archer Armor) are removed, a playability line rather than a historical one (the Lithuanians already lack Blast Furnace and Plate Mail Armor). A lower tier is renamed only where a specific, documented equivalent exists for that tech: Iron Casting → Tin Bronze (Obsidian Blades and Flint Points in Mesoamerica). Forging, Scale Mail Armor and Chain Mail Armor stay as a flagged generic equipment level, and Chemistry stays for its +1 ranged attack, although the Inca had no gunpowder. One further rename is possible: Chain Mail Armor → Quilted Cotton Armor, for the padded cotton tunics reported for Inca soldiers (the name is free for the Inca, who have neither the Militia-line nor Gambesons), though a single cotton armour would then stand beside a generic Scale Mail tier. Rename it, remove or rename the remaining tiers too, or keep them as they are?",
  "Codex-wide question CQ2 (see codex/civs/README.md): Generic post-1500 items.",
  "Codex-wide question CQ3 (see codex/civs/README.md): Crossbows.",
  "Codex-wide question CQ4 (see codex/civs/README.md): Mule Cart.",
  "Codex-wide question CQ12 (see codex/civs/README.md): American power budget.",
  "Codex-wide question CQ20 (see codex/civs/README.md): American renames beyond the agreed list.",
  "Codex-wide question CQ21 (see codex/civs/README.md): Windows past 1500 (here 1533, to Atahualpa's execution, with no late element).",
]

[profile]
entity = "Tawantinsuyu, the state ruled by the Inca lineage of Cusco"
region = "The Andes from southern Colombia to the Maipo–Cachapoal (traditionally the Maule): Peru, Ecuador, Bolivia, northern and central Chile and north-west Argentina"
window = "1400–1533 (expansion of the Tawantinsuyu to Atahualpa's execution; kingdom of Cusco from c. 1200; Vilcabamba until 1572)"
sources = [
  "Juan de Betanzos, Suma y narración de los Incas (1551)",
  "Pedro Cieza de León, Crónica del Perú (1553)",
  "Pedro Sarmiento de Gamboa, Historia de los Incas (1572)",
  "Pedro Pizarro, Relación del descubrimiento y conquista del Perú (1571)",
  "Inca Garcilaso de la Vega, Comentarios Reales (1609)",
  "Felipe Guaman Poma de Ayala, Nueva corónica y buen gobierno (c. 1615)",
  "Bernabé Cobo, Historia del Nuevo Mundo (1653)",
  "John V. Murra, ‘Cloth and its functions in the Inca state’, American Anthropologist 64 (1962)",
  "John V. Murra, ‘Herds and herders in the Inca state’, in A. Leeds & A. P. Vayda (eds.), Man, Culture, and Animals (1965)",
  "John V. Murra, The Economic Organization of the Inka State (1956/1980)",
  "John Hyslop, The Inka Road System (1984); Inka Settlement Planning (1990)",
  "Nathan Wachtel, ‘The mitimas of the Cochabamba Valley: the colonization policy of Huayna Capac’, in G. A. Collier, R. I. Rosaldo & J. D. Wirth (eds.), The Inca and Aztec States, 1400–1800 (1982)",
  "Terence N. D'Altroy, The Incas (2nd ed., 2014)",
  "John Hemming, The Conquest of the Incas (1970)",
  "John Hemming & Edward Ranney, Monuments of the Incas (1982)",
  "R. A. Donkin, Agricultural Terracing in the Aboriginal New World (1979)",
  "Gary Urton, Signs of the Inka Khipu (2003)",
  "María Rostworowski, ‘Mercaderes del valle de Chincha en la época prehispánica’ (1970)",
  "Bruce Owen, ‘The economy of metal and shell wealth goods’, in T. N. D'Altroy & C. A. Hastorf (eds.), Empire and Domestic Economy (2001)",
  "Heather Lechtman, ‘The Inka, and Andean metallurgical tradition’, in R. L. Burger, C. Morris & R. Matos Mendieta (eds.), Variations in the Expression of Inka Power (2007)",
]

[[bonus]]
text = "Military Units cost -15/20/25/30% food in Dark/Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Military Units cost -15/20/25/30% food in Dark/Feudal/Castle/Imperial Age (Incas)"
basis = "The state stored food, cloth and weapons in thousands of storehouses (qullqa) along the roads, such as the hundreds above Huánuco Pampa studied by Craig Morris and the some 2,400 of Cotapachi, and fed its armies from them on the march; freeze-dried potatoes (chuño) and dried meat (ch'arki) kept for years (Murra 1980; D'Altroy 2014)."
relevance = "The qullqa that fed armies on the march were the logistical core of Inca expansion; the rules themselves name them as a trait that passes on weight alone."

[[bonus]]
text = "Villagers affected by Infantry Blacksmith upgrades starting in Castle Age"
kind = "military"
level = 1
change = "kept"
precedent = "Villagers affected by Infantry Blacksmith upgrades starting in Castle Age (Incas)"
basis = "Military service was a form of mit'a: adult tributary men (hatun runa) served as soldiers in rotating turns and went back to their fields (Murra 1980; D'Altroy 2014)."
relevance = "Rotating labour service, the mit'a, was the basis of the Inca state, and the farmer and the soldier were the same man."

[[bonus]]
text = "Buildings +5/10/15/20% HP in Dark/Feudal/Castle/Imperial Age"
kind = "other"
level = 1
change = "changed"
replaces = "Buildings cost -15% stone"
precedent = "Buildings +10/20/30/40% HP in Dark/Feudal/Castle/Imperial Age (Byzantines), at half the magnitude"
basis = "Inca fitted-stone masonry (the Qurikancha, Sacsayhuamán, Ollantaytambo) was costly in mit'a labour, not cheap in stone, and built to last: the Inca walls of Cusco withstood the earthquakes of 1650 and 1950 that brought down colonial buildings (Hemming & Ranney 1982; D'Altroy 2014). Durability renders this better than a stone discount, as the project's analysis proposes. The bonus covers all buildings rather than fortifications alone, since the earthquake evidence concerns temples, palaces and enclosure walls rather than forts."
relevance = "Inca stonework, raised by state labour to last, is with the roads the most famous Inca achievement and a statement of imperial power."

[[bonus]]
text = "Start with a free Llama; Shepherds work +25% faster"
kind = "economic"
level = 1
change = "new"
replaces = "Houses and Settlements provide +5 population space"
precedent = "Start with a free Llama (Incas team bonus); Shepherds work +25% faster (Britons)"
basis = "Llamas and alpacas were the only large domesticated animals of the Americas: the state and the communities kept great herds for wool, for meat dried as ch'arki and for caravan transport (a llama carries some 25–30 kg), tended by herders and counted on khipu (Murra 1965; D'Altroy 2014). The free Llama moves here from the team bonus, which must show a benefit to allies (RULES 6.2). The population bonus it replaces had no clear historical link (rated stretched)."
relevance = "Llamas and alpacas, the only large domesticated animals of the Americas, carried the state's goods along the roads and gave wool and preserved meat."

[team_bonus]
text = "Units more resistant to conversion"
level = 1
change = "new"
replaces = "Start with a free Llama"
precedent = "Units more resistant to conversion (Teutons team bonus)"
basis = "The Inca bound allied and newly subject lords to the state with gifts of fine cloth (qumpi, woven by the aqllakuna and by male specialists, qumpikamayuq), women and feasts under the norms of Andean reciprocity, offered peaceful submission before war (Chincha, for one, submitted without a battle), and rewarded soldiers with cloth (Murra 1962; Murra 1980). The lords who received Inca cloth gave it on to their own followers and so kept them loyal: the effect, allied units that are harder to turn, is a metaphor for that gift-bound loyalty, since the game's conversion models religious persuasion. RULES 6.2: alliances. The free Llama it replaces showed a benefit to the Inca themselves only and moves to a passive bonus. The current Teutons have the same team bonus, which the codex's Germans give up (RULES 6.7)."
relevance = "Reciprocity sealed with cloth was how the Inca turned dozens of lordships into allies and subjects, often without a battle."
contested = "Reciprocity bound lords who then became Inca subjects; the benefit to lords who remained independent allies is thinly documented."

[[unique_unit]]
name = "Awqa Kamayuq"
model = "Kamayuk"
building = "Castle"
level = 1
change = "changed"
replaces = "Kamayuk"
basis = "Inca armies were provincial levies, each with its own arms (slings, star-headed maces, clubs, lances and, from the Antisuyu, bows); long-shafted spears belonged to that arsenal, and the Spaniards met long lances in battle (Hemming 1970; D'Altroy 2014). The unit keeps its stats but not its truncated name: kamayuq means ‘specialist’ or ‘person in charge’ (as in khipukamayuq), while Guaman Poma calls the age grade of all adult warrior-tributaries auca camayoc (awqa kamayuq, ‘warrior’). The model is shared with the Berbers' Murabit, the Ethiopians' Chewa Spearman and the Mapuche Colihue Lancer."
relevance = "Long lances were one of the main arms of Inca infantry, which fought only on foot; the name restores Guaman Poma's term for the adult warrior."
contested = "The accounts of long lances date from the conquest period; the analysis rates the unit plausible."

[[unique_tech]]
name = "Andean Sling"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Skirmishers and Slingers no minimum range; Slingers +1 attack"
level = 1
change = "kept"
precedent = "Andean Sling (Incas)"
basis = "The sling (warak'a) was the main Andean missile weapon, preferred to the bow in the highlands, and conquest accounts stress that sling stones could badly hurt men and horses (Hemming 1970). Removing the minimum range abstracts a weapon that could be used at any distance. A kept existing tech for a long weapon tradition, held as a tech rather than a passive by the effect-size tie-break (RULES 6.2.4); its Castle Age follows the current game, since neither Castle tech marks a datable moment (see open questions)."
relevance = "The sling was the missile weapon of the Andes, and slingers were the Inca army's missile troops."

[[unique_tech]]
name = "Fabric Shields"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Awqa Kamayuqs, Slingers and Champi Warriors +1 melee/+1 pierce armor"
level = 1
change = "kept"
precedent = "Fabric Shields (Incas)"
basis = "Andean shields were of wood or cane, sometimes faced with hide or cloth, and padded cotton tunics are reported for Inca soldiers (the chronicle passages have not been checked at first hand); the state stored cloth and arms in the qullqa and issued them for war (Murra 1980). With Plate Mail Armor removed this is the Inca late armour. A kept existing tech for an equipment tradition, held as a tech by the effect-size tie-break (RULES 6.2.4); its Imperial Age follows the current game. In-game text: ‘Kamayuks, Slingers and Champi Warriors +1 melee/+1 pierce armor’; only the unit name changes."
relevance = "Shields and padded cotton were the Andean soldier's only body protection, and the state stored and issued them for war."

[[unique_tech]]
name = "Qhapaq Ñan"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Infantry and Villagers move +10% faster"
level = 2
change = "new"
precedent = "Infantry moves +10% faster (Squires) and Villagers move +5% faster in Dark Age, +10% faster starting in Feudal Age (Berbers): one effect type, movement speed, applied to both targets at +10%. With Squires, Inca infantry moves about +21% faster, less than the Gaels' infantry with its own speed bonus (the game's Celt bonus, which their design keeps). No existing unique tech renders a road system (Grand Trunk Road has a road's name but a gold effect)."
basis = "The Qhapaq Ñan, a network of some 30,000–40,000 km of roads with stairways, suspension bridges and waystations (tampu) about a day's walk apart, moved armies, mit'a labourers and llama caravans across the empire (Hyslop 1984; Cieza de León). Built mainly under Pachacuti and Thupa Inca, and incorporating older Wari and Chimú roads (Hyslop 1984), it is the state infrastructure of the empire (RULES 6.2: state). Faster infantry and villagers render the roads; the relay runners (chaski) are an N2 idea (see ideas). Villager speed is not also given as a passive bonus, so the roads are not counted twice."
relevance = "The road network held the Tawantinsuyu together: without it there would have been no Andean empire of this size."

[[unique_tech]]
name = "Mitmaqkuna"
building = "Town Center"
kind = "civil"
age = "Imperial"
effect = "Settlements can train Spearman-line and Skirmishers"
level = 2
change = "new"
precedent = "Settlements can train Spearman-line and Skirmishers (Mapuche civ bonus), as a tech; the Mapuche design keeps it as a passive for their lof levies (RULES 6.7). No existing unique tech renders the resettlement of colonists."
basis = "The Inca moved whole communities from their homelands to other provinces as mitmaqkuna (‘those moved out’): loyal colonists to garrison the frontiers and watch newly conquered peoples, restive groups away from their homes, and farmers and craftsmen to work for the state, as in the Cochabamba valley, where Huayna Capac settled thousands of workers to grow maize for the state storehouses (Wachtel 1982; D'Altroy 2014). The chroniclers credit Pachacuti and above all Thupa Inca with the policy, together with the decimal census (Cieza; Sarmiento; the census is an N2 idea). Settlements that raise spearmen and skirmishers render the garrison colonies of the frontiers. A distinct institution, so a second Town Center tech (RULES 6.2, 6.3); Imperial Age, after the roads, since the largest colonisation projects, such as Cochabamba, belong to Huayna Capac's reign."
relevance = "Resettlement held the empire's conquests and redrew the ethnic map of the Andes; with the roads and the census it defined Inca rule."
contested = "The scale of the resettlements and how much of the policy was new under the Inca are debated (see the civ-level note)."

[tree]
add = ["Architecture"]
remove = [
  "Siege Workshop", "Battering Ram", "Capped Ram", "Siege Ram", "Mangonel", "Onager",
  "Scorpion", "Heavy Scorpion", "Siege Tower", "Trebuchet", "Siege Engineers",
  "Crossbowman", "Arbalester", "Thumb Ring",
  "Blast Furnace", "Plate Mail Armor", "Ring Archer Armor",
  "Halberdier",
  "Galleon", "Carrack", "Catapult Galleon",
  "Block Printing", "Guilds",
]

[tree.basis]
"Architecture" = "The Inca were master builders in fitted stone (Sacsayhuamán, the Qurikancha, Ollantaytambo), yet the civ had Masonry and Keep but not Architecture. The Keep fits them, since the region keeps it only where stone towers are documented: Sacsayhuamán had three towers, Muyuq Marka, Sallaq Marka and Paucar Marka, which Garcilaso describes."
"Siege Workshop" = "Andean armies built no siege engines: forts (pukara) were taken by assault, blockade and fire, and the frontier forts of Pambamarca were held for years of war against the Cayambe. Removing the workshop removes all its units; the Champi line, Arson, Sappers and Petards replace them (owner's decision; RULES 6.11 and section 10). The Petard, a 16th-century gunpowder charge, stays unrenamed as a flagged generic abstraction of assault parties with fire, outside the one-late-element limit (codex-wide question CQ2). Incendiary sling stones, recorded at Manco Inca's siege of Cusco (1536), are left to the ideas as an N2 burning effect."
"Battering Ram" = "Removed with the Siege Workshop: there were no rams and no wheeled vehicles in the Andes."
"Capped Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Siege Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Mangonel" = "Removed with the Siege Workshop: no torsion or traction artillery existed in the Americas."
"Onager" = "Removed with the Siege Workshop (see Mangonel)."
"Scorpion" = "Removed with the Siege Workshop: no bolt-throwers existed in the Americas."
"Heavy Scorpion" = "Removed with the Siege Workshop (see Scorpion)."
"Siege Tower" = "Removed with the Siege Workshop: a wheeled assault tower."
"Trebuchet" = "Counterweight artillery never existed in the Americas."
"Siege Engineers" = "No siege engines are left to improve."
"Crossbowman" = "The crossbow was unknown in the Americas; Inca missile troops were slingers, with bowmen from the eastern lowlands (Antisuyu). Archers and Slingers cover the role. In the current game the Bulgarians also lack crossbows (so do the current Spanish; the Castilian and Bulgarian designs restore the Crossbowman)."
"Arbalester" = "Removed with the Crossbowman (see there)."
"Thumb Ring" = "No thumb rings or thumb draw are attested in the Americas (game-model theme)."
"Blast Furnace" = "There was no iron: Andean metallurgy worked gold, silver, copper and bronze. Removed with the other Imperial-Age tiers of metal arms and armour, a playability line rather than a historical one (the Lithuanians already lack both Blast Furnace and Plate Mail Armor): the lower Blacksmith tiers stay as a generic equipment level and Iron Casting is renamed Tin Bronze (see open questions and contested)."
"Plate Mail Armor" = "Removed with the Imperial-Age tiers of metal arms and armour (see Blast Furnace): there was no metal body armour, only the metal discs some warriors wore on the chest and back, which marked rank as much as they protected. Inca soldiers carried shields, and padded cotton tunics are reported (see Fabric Shields); Scale Mail and Chain Mail Armor stay as a generic equipment level (see open questions)."
"Ring Archer Armor" = "Removed with the other Imperial-Age tiers of metal arms and armour, a playability line rather than a historical one (see Blast Furnace)."
"Halberdier" = "The halberd is a European polearm of the 14th–15th centuries, and the Andes knew no cavalry before 1532; the long spear is represented by the Awqa Kamayuq, and Spearman and Pikeman remain."
"Galleon" = "Ocean-going sailing warships were unknown; Andean seafaring used balsa rafts with cotton sails and reed boats. Codex navy rule for canoe and raft fleets (codex-wide question CQ1): the high-seas sailing ships (Galleon, Carrack) are removed and the siege ship goes with the siege engines, while the Galley, Fire Ship, Demolition and Hulk lines stay with their tiers as a generic abstraction for water maps; the demolition ships are generic post-1500 items kept as flagged abstractions (codex-wide question CQ2)."
"Carrack" = "High-castled sailing warships were unknown (see Galleon)."
"Catapult Galleon" = "A sailing ship carrying a catapult: both a European ship type and a siege engine."
"Block Printing" = "There was no printing, nor writing in the usual sense: records were kept on knotted cords (khipu). With no equivalent for the function the tech is removed (18 of the game's 56 civs already lack it)."
"Guilds" = "The Inca economy ran on mit'a labour, storehouses and redistribution, with local barter (qhatu) but, apart from the debated coastal merchants of Chincha (see contested), no professional merchant class like the pochteca (Murra 1980); the current game gave Guilds to the Inca but not to the Aztecs, who had the pochteca."

[[rename]]
from = "Horse Collar"
to = "Andenes"
level = 1
basis = "There were no draft animals. Stone-walled, often irrigated terraces (andenes, the term used in Andean scholarship) turned the mountain slopes into fields, as at Pisac, Moray and the Colca valley (Donkin 1979). Pending approval with the other renames beyond the agreed list (codex-wide question CQ20)."

[[rename]]
from = "Heavy Plow"
to = "Chakitaqlla"
level = 1
basis = "Agreed rename. The chakitaqlla, a foot plough with a footrest, was the Andean tillage tool; Guaman Poma draws it in his agricultural calendar."

[[rename]]
from = "Hand Cart"
to = "Llama Caravans"
level = 1
basis = "Agreed rename. There were no carts; llama caravans carried about 25–30 kg per animal across the Andes. The generic Caravan (Trade Units) keeps its name, so two caravan techs appear (see open questions)."

[[rename]]
from = "Banking"
to = "Khipu"
level = 1
basis = "Agreed rename. Knotted-cord records kept by specialists (khipukamayuq) registered census, tribute and storehouse accounts (Urton 2003). The rename keeps Banking's effect (tributes to other players are free) for the shared ground of state accounting; it does not imply that khipu moved goods between polities."

[[rename]]
from = "Iron Casting"
to = "Tin Bronze"
level = 1
basis = "There was no iron. After the Inca conquest tin bronze spread at the expense of the older arsenical bronze in regions such as the Upper Mantaro Valley, while plain copper remained common (Owen 2001), and Lechtman describes tin bronze as the alloy the Inca state spread through its provinces (Lechtman 2007); bronze served for tools and for the star-shaped heads of champi maces. Same effect as Iron Casting; Forging, which does not name iron, keeps its generic name. Pending approval with the other renames beyond the agreed list (codex-wide question CQ20)."
contested = "How far the Inca imposed a standard alloy is debated."

[[rename]]
from = "Kamayuk"
to = "Awqa Kamayuq"
level = 1
basis = "Guaman Poma's term for the age grade of adult warriors; ‘kamayuk’ alone means ‘specialist’ (see the unique unit)."

[[rename]]
from = "Elite Kamayuk"
to = "Elite Awqa Kamayuq"
level = 1
basis = "Elite tier of the renamed unit."

[architecture]
set = "South American"
level = 1
change = "kept"
basis = "Since The Last Chieftains the Inca use the South American set, which fits them; kept."
