  "John Hemming & Edward Ranney, Monuments of the Incas (1982)",
  "Jean-Pierre Protzen, Inca Architecture and Construction at Ollantaytambo (1993)",
  "R. A. Donkin, Agricultural Terracing in the Aboriginal New World (1979)",
  "Gary Urton, Signs of the Inka Khipu (2003)",
  "María Rostworowski, ‘Mercaderes del valle de Chincha en la época prehispánica’ (1970)",
  "Bruce Owen, ‘The economy of metal and shell wealth goods’, in T. N. D'Altroy & C. A. Hastorf (eds.), Empire and Domestic Economy (2001)",
