civ = "Georgians"
name = "Georgians"
status = "draft"
label = "Cavalry and Defensive civilization"
summary = "The Bagrationi kingdom of Georgia (1008–1490, core 1089–1213): Monaspa, the mountain defence and the monastic economy are kept; the aznauri become a passive, David IV's Kipchak settlers bring a second unique unit and the Castle tech (Kipchak Settlers, which absorbs Didgori), his chancellor-archbishop becomes the Town Center tech (Chqondideli), the Gelati Academy enters at the University, the team bonus now rests on Tamar's restoration of Armenian Ani and its monasteries, the monastery tree is completed, a Catapult Galleon replaces the Cannon Galleon and the hand cannon leaves."
ideas = [
  "N2: Svan gold: Gold Shaft Mining and faster gold mining, if medieval (not only ancient: Strabo, Geography XI.2.19) evidence for gold washing in Svaneti and Racha is found.",
  "N2: A Trebizond protectorate trade tech (1204), for Tamar's support of the Komnenoi of Trebizond.",
  "N2: Viticulture (wine in qvevri; St Nino's vine cross) as an economic trait, if a fitting effect and medieval evidence of its economic weight are found.",
  "N3: Alan (Ossetian) allies alongside the Kipchaks.",
  "N3: A Georgian monastery-academy building distinct from the Armenian walled monastery (the churches split c. 607–609); the most iconic Georgian fortified churches, Ananuri and Gremi, are 16th–17th century.",
  "N3: A Caucasian architecture set shared with the Armenians.",
]
contested = [
  "Composition of the monaspa (Kipchaks, royal servants in the sense of mamluks, or lesser Georgian nobles) and the documentary basis of the usual figure of 5,000.",
  "Number of Kipchaks settled by David IV: his historian speaks of 40,000 warriors; the usual reading as 40,000 families, each owing a soldier (160,000–200,000 people), is challenged by some Georgian historians, who propose far lower figures (see Golden, 1984, for the sources).",
  "Troop numbers at Didgori (1121): Christian sources give hundreds of thousands of Muslims, Ibn al-Athir c. 30,000; modern estimates vary widely. The decisive role of the Kipchaks is a modern reading of Ibn al-Athir and later reconstructions.",
  "Cumans and Kipchaks: one people, two branches of one confederation, or two associated peoples (P. B. Golden; see the Cumans' file).",
  "Date of the unification: 1008 (Kartli) or 1010 (Kakheti-Hereti).",
  "Date of the council of Ruisi-Urbnisi (1103 or slightly later), and whether the see of Chqondidi was joined to the chancellorship at that council or shortly afterwards.",
  "The Zakarid conquests in Armenia read as liberation in Armenian chronicles (Kirakos Gandzaketsi) and as Georgian expansion in Georgian ones; the brothers served the Georgian crown, Zakare keeping to the Armenian church while Ivane joined the Georgian (Chalcedonian) one.",
  "Dating of the Svan tower-houses.",
  "Etymology of aznauri (Leonti Mroveli's Azon or an Iranian origin, cf. Armenian azat).",
  "Identity of Gregory Pakourianos, claimed as Georgian and as Armenian.",
  "The role of Ioane Petritsi at Gelati rests largely on tradition.",
]
open_questions = [
  "Mule Cart (owner's question): this draft keeps the status quo (the Mule Cart replaces the Lumber and Mining Camps for Georgians and Armenians, and the Georgians start with one) as a generic abstraction of highland haulage. Pack mules were universal (the Byzantine file refuses the Mule Cart for that reason), and other regions' drafts now give it alongside the camps to the Castilians, Portuguese, Ethiopians and Tatars. Keep it, put it alongside the camps, or extend it further?",
  "Kipchaks: the Kipchak is a unique unit trained at the Castle, with its Elite upgrade there as for the Cumans, and the Castle tech Kipchak Settlers also lets the Archery Range train it (the Huns' Marauders pattern). It benefits from Thumb Ring and, from the Imperial Age, from the aznauri population bonus. The model is now the unique unit of four drafts (the Cumans' and Georgians' Kipchak, the Hindustanis' Ghulam and the Saracens' Mamluk), and the Bulgarians in this region give free Elite Kipchaks to their team through Cuman Alliance. Is this degree of sharing acceptable?",
  "Didgori is no longer a tech of its own: the battle (1121) was the outcome of David IV's military reform, which Kipchak Settlers represents (RULES 6.3), and no source describes the lance charge it gave (the Sicilians keep a similar charge as a passive and the Goths as a Castle tech). Tamar's era (1184–1213) therefore has no unique tech. An Imperial Age Castle tech could be added for it, for example for the commander-in-chief (amirspasalari) Zakare Mkhargrdzeli and the victories of Shamkor (1195) and Basiani (1202/1205), though no existing effect expresses them well. Add one?",
  "Svan Towers is dropped for relevance, like the Japanese Yasama: the Svan tower-houses are emblematic but were family defences in one mountain province and did not shape the kingdom's history. Keep it as a fame exception instead (it would take the Castle slot of Kipchak Settlers or a fourth tech slot)?",
  "Aznauri Cavalry moves from a unique tech to a passive (RULES 6.2: the aznauri were a social estate, a structural trait), with the same effect from the Imperial Age; that gate is a balance choice inherited from the original tech, not a historical date. Agree, or let it apply from the Castle Age?",
  "Chqondideli uses “Town Centers work +10% faster” (the Persian work-rate effect) for a stronger central government. Alternatives among existing effects: “All gold income +10%” for the royal fiscal administration, or “Villagers gather, build, and repair +5% faster” (the Tamils' Uttaramerur) for David the Builder's restoration of the realm. Which does the owner prefer?",
  "All three unique techs are level 2 (Kipchak Settlers, Chqondideli, Gelati Academy), because no existing tech fits these moments. Acceptable, or keep fewer new techs (e.g. leave the Gelati Academy as an N2 idea)?",
  "Siege warship: a non-gunpowder Catapult Galleon replaces the Cannon Galleon (RULES 6.11), with the same policy and wording as for the Armenians and Bulgarians, although the kingdom had no significant war fleet; without it, coastal buildings would fall only to Demolition Ships and landed siege. Keep it, or leave the civ without a siege warship?",
  "Gold Shaft Mining stays out: the gold of Colchis and Svaneti is attested mainly in ancient sources (Strabo). Add it anyway?",
]

[profile]
entity = "Kingdom of Georgia (Sakartvelo) under the Bagrationi dynasty"
region = "Southern Caucasus: Kartli, Kakheti, Imereti, Abkhazia, Tao-Klarjeti and Svaneti"
window = "1008–1490 (core 1089–1213, David IV to Tamar)"
sources = [
  "Kartlis Tskhovreba (The Georgian Chronicles), especially the Life of David, King of Kings (c. 1123–1126) and the Histories and Eulogies of the Sovereigns (Tamar); English translation: Kartlis Tskhovreba: A History of Georgia (ed. R. Metreveli and S. Jones, Tbilisi, 2014)",
  "R. W. Thomson, Rewriting Caucasian History: The Medieval Armenian Adaptation of the Georgian Chronicles; the Original Georgian Texts and the Armenian Adaptation (1996)",
  "Ibn al-Athir, al-Kamil fi l-tarikh (Didgori); Matthew of Edessa, Chronicle; Walter the Chancellor, Bella Antiochena",
  "Kirakos Gandzaketsi, History of the Armenians (13th century; tr. R. Bedrosian, 1986)",
  "C. Toumanoff, Studies in Christian Caucasian History (1963)",
  "W. E. D. Allen, A History of the Georgian People (1932)",
  "P. B. Golden, “Cumanica I: The Qipčaqs in Georgia”, Archivum Eurasiae Medii Aevi 4 (1984)",
  "D. Rayfield, Edge of Empires: A History of Georgia (2012)",
  "R. G. Suny, The Making of the Georgian Nation (2nd ed., 1994)",
  "R. Hovannisian (ed.), The Armenian People from Ancient to Modern Times (1997)",
  "S. H. Rapp Jr., Studies in Medieval Georgian Historiography (2003)",
  "A. Eastmond, Royal Imagery in Medieval Georgia (1998)",
  "L. Gigineishvili, The Platonic Theology of Ioane Petritsi (2007)",
  "A. Mikaberidze, Historical Dictionary of Georgia",
]

[[bonus]]
text = "Start with a Mule Cart"
kind = "economic"
level = 1
change = "kept"
precedent = "Start with a Mule Cart (Georgians)"
basis = "Pack animals carried timber, stone and ore through the valleys and passes of the Caucasus; the Mule Cart's mobile drop site abstracts this highland haulage. A generic abstraction shared with the Armenians and kept under the owner's Mule Cart decision; the caravan trade through Tbilisi, retaken in 1122, which with tribute and booty paid for the golden age, is a different matter."
relevance = "A borderline pass: pack transport shaped the economy of a mountain kingdom, but pack animals were universal; it stays as the economic side of the owner's Mule Cart decision."

[[bonus]]
text = "Units and buildings receive -15% damage when located on higher elevation"
kind = "military"
level = 1
change = "kept"
precedent = "Units and buildings receive -15% damage when located on higher elevation (Georgians)"
basis = "Defence in mountain country: hill fortresses, the valleys of the Greater Caucasus and the tower-houses of Svaneti served as refuges during the Mongol conquest (1236–1240) and Timur's invasions (1386–1403), and western Georgia broke away from Ilkhanid rule from 1259; Didgori (1121) was fought on broken ground chosen by David IV."
relevance = "Mountain refuges let the dynasty and the Church survive and regroup after each conquest (western Georgia from 1259; Svaneti; the resistance to Timur); a structural trait of geography."

[[bonus]]
text = "Fortified Churches provide Villagers in a 9 tiles radius with +10% work rate"
kind = "economic"
level = 1
change = "kept"
precedent = "Fortified Churches provide Villagers in a 9 tiles radius with +10% work rate (Georgians)"
basis = "Monasteries were great landowners and organisers of farming and learning: Gelati (founded by David IV in 1106), Ikalto, Shio-Mgvime and the monasteries of David Gareja."
relevance = "The monasteries held much of the land and organised its cultivation; the Church was, with the crown, the main institution of medieval Georgia."

[[bonus]]
text = "Mounted Units take -20% population space starting in Imperial Age"
kind = "military"
level = 1
change = "changed"
replaces = "Aznauri Cavalry (Mounted Units take -20% population space), formerly the Imperial Age unique tech"
precedent = "Aznauri Cavalry: Mounted Units take -20% population space (Georgians); for an age-gated passive, +10 population space in Imperial Age (Goths) and Town Centers cost -50% wood starting in Castle Age (Britons)"
basis = "The aznauri were the Georgian nobility, from great lords (didebulni) to lesser knights, who served on horseback with their own retinues and formed the base of the feudal cavalry; lower population space abstracts warriors who equipped and supported themselves. A social estate, not a datable reform, so it becomes a passive (RULES 6.2). The Imperial Age gate is a balance choice inherited from the original tech, not a historical date."
relevance = "The mounted service nobility was the backbone of the kingdom's armies from Bagrat III to Tamar and beyond."
contested = "Etymology of aznauri (Leonti Mroveli's Azon or an Iranian word, cf. Armenian azat, “free, noble”)."

[team_bonus]
text = "Building repairs cost -25%"
level = 1
change = "kept"
precedent = "Building repairs cost -25% (Georgians team bonus)"
basis = "Under Tamar the Georgian crown carried its Armenian commanders, the brothers Zakare and Ivane Mkhargrdzeli (the Zakarids), into Armenia: they took Ani from the Shaddadid emirs in 1199 and later Dvin and Kars, and as Georgian vassals they and their followers restored Armenian towns and monasteries, from Tigran Honents' church at Ani (1215) to Harichavank (1201), Makaravank and the main church of Geghard (1215) (Kirakos Gandzaketsi; Histories and Eulogies of the Sovereigns; Hovannisian, 1997; Rayfield, 2012). Cheaper repairs for allies abstract this rebuilding in a neighbouring people's land. The former basis, David IV's gifts to Georgian monasteries abroad, mainly benefited Georgian communities and so failed RULES 6.2."
relevance = "Tamar's reign carried Georgian power into Armenia and made the Zakarid princes the restorers of Ani and of Armenian monasteries, the clearest case of the kingdom benefiting a neighbouring people (RULES 6.2)."
contested = "An abstraction: the sources speak of conquest and church building, not of repairs as such; Armenian and Georgian chronicles also read the Zakarid conquests differently (see the civ-level contested list)."

[[unique_unit]]
name = "Monaspa"
model = "Monaspa"
building = "Castle"
level = 1
change = "kept"
basis = "The monaspa (roughly “host of servants”) was the royal guard that David IV formed in his military reform of c. 1118, well armed with lance and bow and serving the king directly. Growing stronger near other heavy cavalry abstracts a cohesive elite."
relevance = "The royal guard was the instrument of David IV's reconquest (Didgori 1121, Tbilisi 1122) and of royal power over the great lords."
contested = "Its strength (the usual 5,000) and composition (Kipchaks, royal servants or lesser nobles) are debated."

[[unique_unit]]
name = "Kipchak"
model = "Kipchak"
building = "Castle"
level = 1
change = "new"
basis = "The Kipchak horse archers whom David IV settled in Georgia c. 1118–1120, after his marriage to Gurandukht, daughter of the khan Otrok; his historian speaks of 40,000 warriors (Life of David; Golden, 1984; Rayfield, 2012). Kipchak contingents fought at Didgori (Ibn al-Athir), and many modern historians consider them decisive. The same unit as the Cumans' Kipchak, since the Qivchaqni of the Georgian sources belonged to the same Cuman-Kipchak confederation (see the Cumans' contested note); trained at the Castle with its Elite upgrade there, as for the Cumans."
relevance = "Without the Kipchak settlers David IV would have lacked the army that reversed the Seljuk conquest; their absence was the main gap of the original civ."
contested = "The number settled (see the civ-level contested list)."

[[unique_tech]]
name = "Kipchak Settlers"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Kipchaks can be trained at Archery Ranges"
level = 2
change = "new"
replaces = "Svan Towers (Fortifications +2 attack; Watch Tower-line deals pass through damage), dropped for relevance: the Svan tower-houses were family defences in one province and did not shape the kingdom's history"
precedent = "Marauders: Tarkans can be trained at Stables (Huns, a Castle tech); Genitour available at the Archery Range starting in Castle Age (Berbers team bonus)"
basis = "David IV's military reform of c. 1118–1121 rested on the Kipchaks: after marrying Gurandukht, daughter of the khan Otrok, he settled Kipchak families on royal land in a kingdom emptied by the Seljuk “Great Turkish troubles” of the 1080s, each family owing a soldier, which gave the crown a standing army independent of the great lords (Life of David; Golden, 1984). At Didgori (12 August 1121), according to Ibn al-Athir, a Kipchak detachment feigned to desert and fell on the Muslim leaders before the royal army broke Ilghazi's coalition (Walter the Chancellor and Matthew of Edessa also mention a small Frankish contingent), which opened the way to Tbilisi (1122). The tech lets the settled Kipchaks be raised outside the Castle. It absorbs the earlier draft's Didgori tech: the battle was the outcome of the same reform (RULES 6.3), and no source describes the lance charge that tech gave."
relevance = "The settlement was the decisive measure of David IV's reform: it repopulated the kingdom, gave the crown the army of Didgori (1121) and of Tamar's campaigns, and reversed the Seljuk conquest; a datable military reform at the Castle."
contested = "How many Kipchaks were settled, and how decisive they were at Didgori (see the civ-level contested list)."

[[unique_tech]]
name = "Chqondideli"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Town Centers work +10% faster"
level = 2
change = "new"
precedent = "Town Centers and Docks +100% HP and work +5/10/15/20% faster in Dark/Feudal/Castle/Imperial Age (Persians): the work-rate effect only, Town Centers only, at its Feudal Age value (+10%)"
basis = "In 1103 David IV called the church council of Ruisi and Urbnisi, which deposed unworthy bishops, many of them creatures of the great families, and set the church in order; he joined the see of Chqondidi to the office of chancellor (mtsignobartukhutsesi), so that the archbishop-chancellor (the Chqondideli), first his tutor Giorgi, became the first of the king's ministers and headed the royal administration for the rest of the golden age (Life of David; Suny, 1994; Rayfield, 2012). Faster Town Centers abstract the stronger central government."
relevance = "The reform bound the church and the nobility to the crown and created the central government that carried David IV's restoration and Tamar's reign; a datable state institution, at the Town Center (RULES 6.2)."
contested = "The date of the council and of the union of the see with the chancellorship (see the civ-level contested list)."

[[unique_tech]]
name = "Gelati Academy"
building = "University"
kind = "civil"
age = "Castle"
effect = "University technologies cost -25%; Universities work +80% faster"
level = 2
change = "new"
precedent = "Dock and University technologies cost -25% (Italians; University part only); Universities work +80% faster (Malians team bonus)"
basis = "David IV founded the monastery and academy of Gelati in 1106, and his historian calls it a second Jerusalem and another Athens (Life of David). Tradition links it with the philosophers Ioane Petritsi and Arsen Iqaltoeli (on Petritsi, L. Gigineishvili, The Platonic Theology of Ioane Petritsi, 2007). It became the intellectual centre of the golden age and the burial place of David IV."
relevance = "Gelati was the centre of Georgian learning in the golden age and remains one of the symbols of Georgian identity; a datable institution at the University."
contested = "The role of Ioane Petritsi at Gelati rests largely on tradition."

[tree]
add = ["Thumb Ring", "Illumination", "Atonement", "Catapult Galleon"]
remove = ["Hand Cannoneer", "Cannon Galleon"]

[tree.basis]
"Thumb Ring" = "The Kipchak settlers were steppe horse archers and the monaspa carried the bow (Golden, 1984); the civ had Heavy Cavalry Archer and Parthian Tactics without Thumb Ring."
"Illumination" = "A strong monastic culture: the academy of Gelati (1106), Iviron on Mount Athos (c. 980), Petritsoni (1083) and the Monastery of the Cross in Jerusalem."
"Atonement" = "As for Illumination: the full monastery tree for one of the great Orthodox monastic cultures."
"Catapult Galleon" = "Substitute for the removed Cannon Galleon (RULES 6.11): a generic non-gunpowder siege warship, so that the civ can still attack coastal buildings from the water. The kingdom had no significant war fleet, so it is a playability abstraction, like the rest of its navy; the same policy as for the Armenians and Bulgarians (see the open question)."
"Hand Cannoneer" = "Firearms are not attested in Georgian armies of the core period (1089–1213), and we know of no evidence of their use before the kingdom split (c. 1490). Any guns of its last decades would be marginal, so the tree follows the period the civ represents: the same regional rule as for the Byzantines' guns of 1453."
"Cannon Galleon" = "No naval artillery and no significant war fleet in the period, despite the Abkhazian Black Sea coast; the Catapult Galleon replaces it."

[architecture]
set = "Mediterranean"
change = "kept"
basis = "Stone church and fortress architecture is closer to Georgian building than the other existing sets; a Caucasian set is N3."

[[dropped]]
item = "Mounted Units regenerate 2/8/14 HP per minute in Feudal/Castle/Imperial Age"
kind = "bonus"
reason = "No identifiable historical basis: nothing distinguishes Georgian horses or remounts in this respect. Its place among the cavalry traits goes to the aznauri passive, and the Kipchak settlers it made way for in the first draft are now a unique unit and the Castle tech."
