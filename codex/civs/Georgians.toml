civ = "Georgians"
name = "Georgians"
status = "draft"
label = "Cavalry and Defensive civilization"
summary = "The Bagrationi kingdom of Georgia (1008–1490, core 1089–1213): Monaspa, the mountain defence, the monastic economy and the Builder's repairs (now a team bonus for David IV's patronage abroad) are kept; the aznauri become a passive, Didgori replaces Svan Towers at the Castle, David IV's Kipchak settlers bring a second unique unit and the Town Center tech, the Gelati Academy enters at the University, the monastery tree is completed and the gunpowder units leave."
ideas = [
  "N2: Svan gold: Gold Shaft Mining and faster gold mining, if medieval (not only ancient: Strabo, Geography XI.2.19) evidence for gold washing in Svaneti and Racha is found.",
  "N2: A Trebizond protectorate trade tech (1204), for Tamar's support of the Komnenoi of Trebizond.",
  "N2: Viticulture (wine in qvevri; St Nino's vine cross) as an economic trait, if a fitting effect and medieval evidence of its economic weight are found.",
  "N3: Alan (Ossetian) allies alongside the Kipchaks.",
  "N3: A Georgian monastery-academy building distinct from the Armenian walled monastery (the churches split c. 607–609); the most iconic Georgian fortified churches, Ananuri and Gremi, are 16th–17th century.",
  "N3: A Caucasian architecture set shared with the Armenians.",
]
contested = [
  "Composition of the monaspa (Kipchaks, royal servants in the sense of mamluks, or lesser Georgian nobles) and the documentary basis of the usual figure of 5,000.",
  "Number of Kipchaks settled by David IV: his historian speaks of 40,000 warriors; the usual reading as 40,000 families, each owing a soldier (160,000–200,000 people), is challenged by M. Bakhtadze (Tbilisi State University, 2016), who estimates c. 13,000–15,000 families (see also Golden, 1984).",
  "Troop numbers at Didgori (1121): Christian sources give hundreds of thousands of Muslims, Ibn al-Athir c. 30,000; modern estimates vary widely. The decisive role of the Kipchaks is a modern reading of Ibn al-Athir and later reconstructions.",
  "Date of the unification: 1008 (Kartli) or 1010 (Kakheti-Hereti).",
  "Dating of the Svan tower-houses.",
  "Etymology of aznauri (Leonti Mroveli's Azon or an Iranian origin, cf. Armenian azat).",
  "Identity of Gregory Pakourianos, claimed as Georgian and as Armenian.",
  "The role of Ioane Petritsi at Gelati rests largely on tradition.",
]
open_questions = [
  "Mule Cart (owner's question): this draft keeps the status quo (the Mule Cart replaces the Lumber and Mining Camps for Georgians and Armenians, and the Georgians start with one). Keep it, put it alongside the camps, or extend it to other civs?",
  "Kipchaks: the Kipchak is shared with the Cumans (steppe region) and trained at the Castle, with its Elite upgrade there as for the Cumans; the Town Center tech Kipchak Settlers also lets the Archery Range train it (the Huns' Marauders pattern), replacing the first draft's free “available at the Archery Range” bonus, which was stronger than its precedents. The Kipchak also benefits from Thumb Ring and, from the Imperial Age, from the aznauri population bonus. The Town Center holds the tech because David IV's settlement of Kipchak families on royal land was state colonisation, like the Byzantine themes; the Castle would also fit. The Bulgarians in this region get Kipchaks too, through Cuman Alliance: acceptable overlap?",
  "Svan Towers is dropped for relevance, like the Japanese Yasama: the Svan tower-houses are emblematic but were family defences in one mountain province and did not shape the kingdom's history. Keep it as a fame exception instead of Didgori?",
  "Aznauri Cavalry moves from a unique tech to a passive (RULES 6.2: the aznauri were a social estate, a structural trait), with the same effect from the Imperial Age, which keeps its original timing. Agree?",
  "All three unique techs are level 2 (Didgori, Kipchak Settlers, Gelati Academy), because no existing tech fits these moments. Acceptable, or keep fewer new techs (e.g. leave the Gelati Academy as an N2 idea)?",
  "Team bonus: the Builder's repairs (-25%) are kept but now rest on David IV's gifts to holy places abroad and the Georgian monasteries outside Georgia (RULES 6.2), since his restoration of his own kingdom benefited only Georgia. Acceptable?",
  "No siege warship: the Cannon Galleon is removed (no naval artillery and no significant war fleet), so on water maps coastal buildings fall only to Demolition Ships and landed siege. Acceptable, or keep a non-gunpowder Catapult Galleon?",
  "Gold Shaft Mining stays out: the gold of Colchis and Svaneti is attested mainly in ancient sources (Strabo). Add it anyway?",
]

[profile]
entity = "Kingdom of Georgia (Sakartvelo) under the Bagrationi dynasty"
region = "Southern Caucasus: Kartli, Kakheti, Imereti, Abkhazia, Tao-Klarjeti and Svaneti"
window = "1008–1490 (core 1089–1213, David IV to Tamar)"
sources = [
  "Kartlis Tskhovreba (The Georgian Chronicles), especially the Life of David, King of Kings (c. 1123–1126) and the Histories and Eulogies of the Sovereigns (Tamar); English translation: Kartlis Tskhovreba: A History of Georgia (ed. R. Metreveli and S. Jones, Tbilisi, 2014)",
  "R. W. Thomson, Rewriting Caucasian History: The Medieval Armenian Adaptation of the Georgian Chronicles; the Original Georgian Texts and the Armenian Adaptation (1996)",
  "Ibn al-Athir, al-Kamil fi l-tarikh (Didgori); Matthew of Edessa, Chronicle; Walter the Chancellor, Bella Antiochena",
  "C. Toumanoff, Studies in Christian Caucasian History (1963)",
  "W. E. D. Allen, A History of the Georgian People (1932)",
  "P. B. Golden, “Cumanica I: The Qipčaqs in Georgia”, Archivum Eurasiae Medii Aevi 4 (1984)",
  "D. Rayfield, Edge of Empires: A History of Georgia (2012)",
  "R. G. Suny, The Making of the Georgian Nation (2nd ed., 1994)",
  "S. H. Rapp Jr., Studies in Medieval Georgian Historiography (2003)",
  "A. Eastmond, Royal Imagery in Medieval Georgia (1998)",
  "A. Mikaberidze, Historical Dictionary of Georgia",
]

[[bonus]]
text = "Start with a Mule Cart"
kind = "economic"
level = 1
change = "kept"
precedent = "Start with a Mule Cart (Georgians)"
basis = "Pack animals carried goods through the valleys and passes of the Caucasus and on the caravan roads through Tbilisi, retaken in 1122 and from then on a hub between Persia, Byzantium, the Black Sea and the steppe. An abstraction shared with the Armenians."
relevance = "The caravan trade through Tbilisi paid for the golden age; a borderline pass, since pack animals themselves were universal, kept with the Mule Cart economy (see the open question)."

[[bonus]]
text = "Units and buildings receive -15% damage when located on higher elevation"
kind = "military"
level = 1
change = "kept"
precedent = "Units and buildings receive -15% damage when located on higher elevation (Georgians)"
basis = "Defence in mountain country: hill fortresses, the valleys of the Greater Caucasus and the tower-houses of Svaneti served as refuges during the Mongol conquest (1236–1240) and Timur's invasions (1386–1403), and western Georgia broke away from Ilkhanid rule from 1259; Didgori (1121) was fought on broken ground chosen by David IV."
relevance = "The mountains repeatedly let Georgian states survive conquests that destroyed their lowland neighbours; a structural trait of geography."

[[bonus]]
text = "Fortified Churches provide Villagers in a 9 tiles radius with +10% work rate"
kind = "economic"
level = 1
change = "kept"
precedent = "Fortified Churches provide Villagers in a 9 tiles radius with +10% work rate (Georgians)"
basis = "Monasteries were great landowners and organisers of farming and learning: Gelati (founded by David IV in 1106), Ikalto, Shio-Mgvime and the monasteries of David Gareja."
relevance = "The monasteries held much of the land and organised its cultivation; the Church was, with the crown, the main institution of medieval Georgia."

[[bonus]]
text = "Mounted Units take -20% population space starting in Imperial Age"
kind = "military"
level = 1
change = "changed"
replaces = "Aznauri Cavalry (Mounted Units take -20% population space), formerly the Imperial Age unique tech"
precedent = "Aznauri Cavalry: Mounted Units take -20% population space (Georgians); for an age-gated passive, +10 population space in Imperial Age (Goths) and Town Centers cost -50% wood starting in Castle Age (Britons)"
basis = "The aznauri were the Georgian nobility, from great lords (didebulni) to lesser knights, who served on horseback with their own retinues and formed the base of the feudal cavalry; lower population space abstracts warriors who equipped and supported themselves. A social estate, not a datable reform, so it becomes a passive (RULES 6.2), from the Imperial Age as the original tech was."
relevance = "The mounted service nobility was the backbone of the kingdom's armies from Bagrat III to Tamar and beyond."
contested = "Etymology of aznauri (Leonti Mroveli's Azon or an Iranian word, cf. Armenian azat, “free, noble”)."

[team_bonus]
text = "Building repairs cost -25%"
level = 1
change = "kept"
precedent = "Building repairs cost -25% (Georgians team bonus)"
basis = "David IV Aghmashenebeli, “the Builder” or “the Restorer”, did not only rebuild his own kingdom after the Seljuk devastations: according to his historian he sent generous gifts to holy places in Greece (Mount Athos), Bulgaria, Syria, Cyprus, the Black Mountain and Palestine (Life of David), continuing the Georgian foundations abroad: Iviron on Athos (c. 980), Petritsoni in Bulgaria (1083) and the Monastery of the Cross in Jerusalem (11th century). Cheaper repairs for allies abstract this upkeep of churches and monasteries in neighbouring lands."
relevance = "The Georgian monasteries abroad, where much of Georgian literature was written, and royal patronage of them are a lasting part of Georgian identity and a benefit to others, as RULES 6.2 requires; the effect keeps the pun on the Builder's epithet."
contested = "An abstraction: the sources speak of gifts and endowments, not of repairs as such."

[[unique_unit]]
name = "Monaspa"
model = "Monaspa"
building = "Castle"
level = 1
change = "kept"
basis = "The monaspa (roughly “host of servants”) was the royal guard that David IV formed in his military reform of c. 1118, well armed with lance and bow and serving the king directly. Growing stronger near other heavy cavalry abstracts a cohesive elite."
relevance = "The royal guard was the instrument of David IV's reconquest (Didgori 1121, Tbilisi 1122) and of royal power over the great lords."
contested = "Its strength (the usual 5,000) and composition (Kipchaks, royal servants or lesser nobles) are debated."

[[unique_unit]]
name = "Kipchak"
model = "Kipchak"
building = "Castle"
level = 1
change = "new"
basis = "The Kipchak horse archers whom David IV settled in Georgia c. 1118–1120, after his marriage to Gurandukht, daughter of the khan Otrok; his historian speaks of 40,000 warriors (Life of David; Golden, 1984; Rayfield, 2012). Kipchak contingents fought at Didgori (Ibn al-Athir), and many modern historians consider them decisive. The same unit as the Cumans' Kipchak, since they were the same people; trained at the Castle with its Elite upgrade there, as for the Cumans."
relevance = "Without the Kipchak settlers David IV would have lacked the army that reversed the Seljuk conquest; their absence was the main gap of the original civ."
contested = "The number settled (see the civ-level contested list)."

[[unique_tech]]
name = "Didgori"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Monaspas and Knight-line receive a charge attack"
level = 2
change = "new"
replaces = "Svan Towers (Fortifications +2 attack; Watch Tower-line deals pass through damage), dropped for relevance: the Svan tower-houses were family defences in one province and did not shape the kingdom's history"
precedent = "Comitatenses: Militia-line, Knight-line, and Centurions train +50% faster and receive a charge attack (Romans; charge part only); Coustillier: Heavy Cavalry with a powerful charged attack (Burgundians)"
basis = "On 12 August 1121 David IV's reformed army destroyed the coalition of Ilghazi at Didgori: according to Ibn al-Athir a Kipchak detachment feigned to desert and fell on the Muslim leaders, and the Georgian cavalry then broke the coalition (Ibn al-Athir; Walter the Chancellor and Matthew of Edessa also mention a small Frankish contingent). The victory opened the way to Tbilisi (1122). The heavy cavalry also won Shamkor (1195) and Basiani (1202/1205)."
relevance = "Didgori reversed the Seljuk conquest and began the Georgian golden age; the tech stands for the heavy cavalry shock of the reformed royal army, not for a single anecdote."
contested = "The sources describe a sudden assault rather than a lance charge in detail; the charge is an abstraction."

[[unique_tech]]
name = "Kipchak Settlers"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Kipchaks can be trained at Archery Ranges"
level = 2
change = "new"
precedent = "Marauders: Tarkans can be trained at Stables (Huns); Genitour available at the Archery Range starting in Castle Age (Berbers team bonus)"
basis = "David IV settled Kipchak families on royal land, largely in a kingdom emptied by the Seljuk “Great Turkish troubles” of the 1080s, each family owing service: a state colonisation that gave the crown a standing army independent of the great lords (Life of David; Golden, 1984). The tech lets the Kipchak settlers be raised outside the Castle."
relevance = "The settlement of c. 1118–1120 was David IV's decisive state measure: it repopulated the kingdom and gave the crown the army of Didgori and of Tamar's campaigns."
contested = "How many Kipchaks were settled (see the civ-level contested list)."

[[unique_tech]]
name = "Gelati Academy"
building = "University"
kind = "civil"
age = "Castle"
effect = "University technologies cost -25%; Universities work +80% faster"
level = 2
change = "new"
precedent = "Dock and University technologies cost -25% (Italians; University part only); Universities work +80% faster (Malians team bonus)"
basis = "David IV founded the monastery and academy of Gelati in 1106; his historian calls it a second Jerusalem and another Athens, and tradition links it with the philosophers Ioane Petritsi and Arsen Iqaltoeli (Life of David; Rapp, 2003). It became the intellectual centre of the golden age and the burial place of David IV."
relevance = "Gelati was the centre of Georgian learning in the golden age and remains one of the symbols of Georgian identity; a datable institution at the University."

[tree]
add = ["Thumb Ring", "Illumination", "Atonement"]
remove = ["Hand Cannoneer", "Cannon Galleon"]

[tree.basis]
"Thumb Ring" = "The Kipchak settlers were steppe horse archers and the monaspa carried the bow (Golden, 1984); the civ had Heavy Cavalry Archer and Parthian Tactics without Thumb Ring."
"Illumination" = "A strong monastic culture: the academy of Gelati (1106), Iviron on Mount Athos (c. 980), Petritsoni (1083) and the Monastery of the Cross in Jerusalem."
"Atonement" = "As for Illumination: the full monastery tree for one of the great Orthodox monastic cultures."
"Hand Cannoneer" = "Firearms are not attested in Georgian armies of the core period (1089–1213); they reached Georgia only in the 15th–16th centuries, and by the end of the 16th century, after the kingdom had split (c. 1490), only a small part of the army had guns and pistols (A. Tabuashvili, “On the question of the spread, manufacture and prices of firearms in Georgia”, Tbilisi State University, in Georgian)."
"Cannon Galleon" = "No naval artillery and no significant war fleet in the period, despite the Abkhazian Black Sea coast."

[architecture]
set = "Mediterranean"
change = "kept"
basis = "Stone church and fortress architecture is closer to Georgian building than the other existing sets; a Caucasian set is N3."

[[dropped]]
item = "Mounted Units regenerate 2/8/14 HP per minute in Feudal/Castle/Imperial Age"
kind = "bonus"
reason = "No identifiable historical basis: nothing distinguishes Georgian horses or remounts in this respect. Its place among the cavalry traits goes to the aznauri passive, and the Kipchak settlers it made way for in the first draft are now a unique unit and the Town Center tech."
