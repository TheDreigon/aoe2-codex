civ = "Georgians"
name = "Georgians"
status = "draft"
label = "Cavalry and Defensive civilization"
summary = "The Bagrationi kingdom of Georgia (1008–1490): Monaspa, mountain defence and the monastic economy stay; the aznauri become a passive, David IV's Kipchaks a second unique unit and the Castle tech, his chancellor-archbishop the Town Center tech and Gelati a University tech; the hand cannon leaves."
ideas = [
  "N2: Svan gold: Gold Shaft Mining and faster gold mining, if medieval (not only ancient: Strabo, Geography XI.2.19) evidence for gold washing in Svaneti and Racha is found; until then Gold Shaft Mining stays out of the tree, as in the game.",
  "N2: An Imperial Age Castle tech for Tamar's era (1184–1213), which has no unique tech: the commander-in-chief (amirspasalari) Zakare Mkhargrdzeli and the victories of Shamkor (1195) and Basiani (1202/1205), if a fitting effect is found; no existing effect expresses them well, so N1 leaves the era to the team bonus (the Zakarid reconquest of Armenian towns).",
  "N2: A Trebizond protectorate trade tech (1204), for Tamar's support of the Komnenoi of Trebizond.",
  "N2: Viticulture (wine in qvevri; St Nino's vine cross) as an economic trait, if a fitting effect and medieval evidence of its economic weight are found.",
  "N3: Alan (Ossetian) allies alongside the Kipchaks.",
  "N3: A Georgian monastery-academy building distinct from the Armenian walled monastery (the churches split c. 607–609); the most iconic Georgian fortified churches, Ananuri and Gremi, are 16th–17th century.",
  "N3: A Caucasian architecture set shared with the Armenians.",
]
contested = [
  "Composition of the monaspa (Kipchaks, royal servants in the sense of mamluks, or lesser Georgian nobles) and the documentary basis of the usual figure of 5,000.",
  "Number of Kipchaks settled by David IV: his historian speaks of 40,000 warriors; the usual reading as 40,000 families, each owing a soldier (160,000–200,000 people), is challenged by some Georgian historians, who propose far lower figures (see Golden, 1984, for the sources).",
  "Troop numbers at Didgori (1121): Christian sources give hundreds of thousands of Muslims, Ibn al-Athir c. 30,000; modern estimates vary widely. The decisive role of the Kipchaks is a modern reading of Ibn al-Athir and later reconstructions.",
  "Cumans and Kipchaks: one people, two branches of one confederation, or two associated peoples (P. B. Golden; see the Cumans' file).",
  "Date of the unification: 1008 (Kartli) or 1010 (Kakheti-Hereti).",
  "Date of the council of Ruisi-Urbnisi (1103 or slightly later), and whether the see of Chqondidi was joined to the chancellorship at that council or shortly afterwards.",
  "The Zakarid conquests in Armenia read as liberation in Armenian chronicles (Kirakos Gandzaketsi) and as Georgian expansion in Georgian ones; the brothers served the Georgian crown, Zakare keeping to the Armenian church while Ivane joined the Georgian (Chalcedonian) one.",
  "Dating of the Svan tower-houses.",
  "Etymology of aznauri (Leonti Mroveli's Azon or an Iranian origin, cf. Armenian azat).",
  "Identity of Gregory Pakourianos, claimed as Georgian and as Armenian.",
  "The role of Ioane Petritsi at Gelati rests largely on tradition.",
  "Counterweight trebuchet: the civ keeps the game's Trebuchet, but its Georgian use is an inference. The engine was in Byzantine and Ayyubid use within the core period (Zeugminon in 1165, Niketas Choniates; al-Tarsusi's treatise for Saladin, c. 1187), and Tamar's armies took fortified cities (Ani 1199, Dvin 1203, Kars 1206–1207), but no Georgian source consulted for this design names the engines they used; Kars fell after a long blockade. The Mangonel line is the light stone-thrower (RULES 6.16.5).",
]
open_questions = []

[profile]
entity = "Kingdom of Georgia (Sakartvelo) under the Bagrationi dynasty"
region = "Southern Caucasus: Kartli, Kakheti, Imereti, Abkhazia, Tao-Klarjeti and Svaneti"
window = "1008–1490 (core 1089–1213, David IV to Tamar)"
sources = [
  "Kartlis Tskhovreba (The Georgian Chronicles), especially the Life of David, King of Kings (c. 1123–1126) and the Histories and Eulogies of the Sovereigns (Tamar); English translation: Kartlis Tskhovreba: A History of Georgia (ed. R. Metreveli and S. Jones, Tbilisi, 2014)",
  "R. W. Thomson, Rewriting Caucasian History: The Medieval Armenian Adaptation of the Georgian Chronicles; the Original Georgian Texts and the Armenian Adaptation (1996)",
  "Ibn al-Athir, al-Kamil fi l-tarikh (Didgori); Matthew of Edessa, Chronicle; Walter the Chancellor, Bella Antiochena",
  "Kirakos Gandzaketsi, History of the Armenians (13th century; tr. R. Bedrosian, 1986)",
  "C. Toumanoff, Studies in Christian Caucasian History (1963)",
  "W. E. D. Allen, A History of the Georgian People (1932)",
  "P. B. Golden, “Cumanica I: The Qipčaqs in Georgia”, Archivum Eurasiae Medii Aevi 4 (1984)",
  "D. Rayfield, Edge of Empires: A History of Georgia (2012)",
  "R. G. Suny, The Making of the Georgian Nation (2nd ed., 1994)",
  "R. Hovannisian (ed.), The Armenian People from Ancient to Modern Times (1997)",
  "S. H. Rapp Jr., Studies in Medieval Georgian Historiography (2003)",
  "A. Eastmond, Royal Imagery in Medieval Georgia (1998)",
  "L. Gigineishvili, The Platonic Theology of Ioane Petritsi (2007)",
  "A. Mikaberidze, Historical Dictionary of Georgia",
]

[[bonus]]
text = "Start with a Mule Cart"
kind = "economic"
level = 1
change = "kept"
precedent = "Start with a Mule Cart (Georgians)"
basis = "Pack animals carried timber, stone and ore through the valleys and passes of the Caucasus; the Mule Cart's mobile drop site abstracts this highland haulage. A generic abstraction shared with the Armenians: the Georgians stay one of the Mule Cart's four holders, with the game's version that replaces the Lumber and Mining Camps (RULES 6.16.7); the caravan trade through Tbilisi, retaken in 1122, which with tribute and booty paid for the golden age, is a different matter."
relevance = "A borderline pass: pack transport shaped the economy of a mountain kingdom, but pack animals were universal; it is kept with the game's Mule Cart (RULES 6.16.7)."

[[bonus]]
text = "Units and buildings receive -15% damage when located on higher elevation"
kind = "military"
level = 1
change = "kept"
precedent = "Units and buildings receive -15% damage when located on higher elevation (Georgians)"
basis = "Defence in mountain country: hill fortresses, the valleys of the Greater Caucasus and the tower-houses of Svaneti served as refuges during the Mongol conquest (1236–1240) and Timur's invasions (1386–1403), and western Georgia broke away from Ilkhanid rule from 1259; Didgori (1121) was fought on broken ground chosen by David IV."
relevance = "Mountain refuges let the dynasty and the Church survive and regroup after each conquest (western Georgia from 1259; Svaneti; the resistance to Timur); a structural trait of geography."

[[bonus]]
text = "Fortified Churches provide Villagers in a 9 tiles radius with +10% work rate"
kind = "economic"
level = 1
change = "kept"
precedent = "Fortified Churches provide Villagers in a 9 tiles radius with +10% work rate (Georgians)"
basis = "Monasteries were great landowners and organisers of farming and learning: Gelati (founded by David IV in 1106), Ikalto, Shio-Mgvime and the monasteries of David Gareja."
relevance = "The monasteries held much of the land and organised its cultivation; the Church was, with the crown, the main institution of medieval Georgia."

[[bonus]]
text = "Mounted Units take -20% population space starting in Imperial Age"
kind = "military"
level = 1
change = "changed"
replaces = "Aznauri Cavalry (Mounted Units take -20% population space), formerly the Imperial Age unique tech"
precedent = "Aznauri Cavalry: Mounted Units take -20% population space (Georgians); for an age-gated passive, +10 population space in Imperial Age (Goths) and Town Centers cost -50% wood starting in Castle Age (Britons)"
basis = "The aznauri were the Georgian nobility, from great lords (didebulni) to lesser knights, who served on horseback with their own retinues and formed the base of the feudal cavalry; lower population space abstracts warriors who equipped and supported themselves. A social estate, not a datable reform, so it becomes a passive (RULES 6.2). The Imperial Age gate is a balance choice inherited from the original tech, not a historical date: a moved effect keeps the game's age or a later one, and the site labels this as a game constraint (RULES 6.16.11)."
relevance = "The mounted service nobility was the backbone of the kingdom's armies from Bagrat III to Tamar and beyond."
contested = "Etymology of aznauri (Leonti Mroveli's Azon or an Iranian word, cf. Armenian azat, “free, noble”)."

[team_bonus]
text = "Building repairs cost -25%"
level = 1
change = "kept"
precedent = "Building repairs cost -25% (Georgians team bonus)"
basis = "Under Tamar the Georgian crown carried its Armenian commanders, the brothers Zakare and Ivane Mkhargrdzeli (the Zakarids), into Armenia: they took Ani from the Shaddadid emirs in 1199 and later Dvin and Kars, and as Georgian vassals they and their followers restored Armenian towns and monasteries, from Tigran Honents' church at Ani (1215) to Harichavank (1201), Makaravank and the main church of Geghard (1215) (Kirakos Gandzaketsi; Histories and Eulogies of the Sovereigns; Hovannisian, 1997; Rayfield, 2012). Cheaper repairs for allies abstract this rebuilding in a neighbouring people's land. David IV's gifts to Georgian monasteries abroad are not used as the basis, because they mainly benefited Georgian communities (RULES 6.2)."
relevance = "Tamar's reign carried Georgian power into Armenia and made the Zakarid princes the restorers of Ani and of Armenian monasteries, the clearest case of the kingdom benefiting a neighbouring people (RULES 6.2)."
contested = "An abstraction: the sources speak of conquest and church building, not of repairs as such; Armenian and Georgian chronicles also read the Zakarid conquests differently (see the civ-level contested list)."

[[unique_unit]]
name = "Monaspa"
model = "Monaspa"
building = "Castle"
level = 1
change = "kept"
basis = "The monaspa (roughly “host of servants”) was the royal guard that David IV formed in his military reform of c. 1118, well armed with lance and bow and serving the king directly. Growing stronger near other heavy cavalry abstracts a cohesive elite. The model is shared with the Castilians' Freire (owner's decision) and the Poles' Kopijnik."
relevance = "The royal guard was the instrument of David IV's reconquest (Didgori 1121, Tbilisi 1122) and of royal power over the great lords."
contested = "Its strength (the usual 5,000) and composition (Kipchaks, royal servants or lesser nobles) are debated."

[[unique_unit]]
name = "Kipchak"
model = "Kipchak"
building = "Castle"
level = 1
change = "new"
basis = "The Kipchak horse archers whom David IV settled in Georgia c. 1118–1120, after his marriage to Gurandukht, daughter of the khan Atrak (Otrok in the Rus' chronicles); his historian speaks of 40,000 warriors (Life of David; Golden, 1984; Rayfield, 2012). Kipchak contingents fought at Didgori (Ibn al-Athir), and many modern historians consider them decisive. The same unit as the Cumans' Kipchak, since the Qivchaqni of the Georgian sources belonged to the same Cuman-Kipchak confederation (see the Cumans' contested note); trained at the Castle with its Elite upgrade there, as for the Cumans. The model also serves, each use on its own history, the Hindustanis' Ghulam and the Arabs' Mamluk, and the Bulgarians' Cuman Alliance gives free Elite Kipchaks to their team; RULES 6.7 and 6.16.12 accept this reuse. It benefits from Thumb Ring and, from the Imperial Age, from the aznauri population bonus."
relevance = "Without the Kipchak settlers David IV would have lacked the army that reversed the Seljuk conquest; their absence was the main gap of the original civ."
contested = "The number settled (see the civ-level contested list)."

[[unique_tech]]
name = "Kipchak Settlers"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Kipchaks can be trained at Archery Ranges"
level = 2
change = "new"
replaces = "Svan Towers (Fortifications +2 attack; Watch Tower-line deals pass through damage), dropped for relevance: the Svan tower-houses were family defences in one province and did not shape the kingdom's history"
precedent = "Marauders: Tarkans can be trained at Stables (Huns, a Castle tech); Genitour available at the Archery Range starting in Castle Age (Berbers team bonus)"
basis = "David IV's military reform of c. 1118–1121 rested on the Kipchaks: after marrying Gurandukht, daughter of the khan Atrak, he settled Kipchak families on royal land in a kingdom emptied by the Seljuk “Great Turkish troubles” of the 1080s, each family owing a soldier, which gave the crown a standing army independent of the great lords (Life of David; Golden, 1984). At Didgori (12 August 1121), according to Ibn al-Athir, a Kipchak detachment feigned to desert and fell on the Muslim leaders before the royal army broke Ilghazi's coalition (Walter the Chancellor and Matthew of Edessa also mention a small Frankish contingent), which opened the way to Tbilisi (1122). The tech lets the settled Kipchaks be raised outside the Castle. It also stands for Didgori, which has no tech of its own: the battle was the outcome of the same reform (RULES 6.3), and no source describes a lance charge there that a charge effect could render. Svan Towers is not kept as a fame exception: the slot goes to the reform that reversed the Seljuk conquest."
relevance = "The settlement was the decisive measure of David IV's reform: it repopulated the kingdom, gave the crown the army of Didgori (1121) and of Tamar's campaigns, and reversed the Seljuk conquest; a datable military reform at the Castle."
contested = "How many Kipchaks were settled, and how decisive they were at Didgori (see the civ-level contested list)."

[[unique_tech]]
name = "Chqondideli"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Town Centers work +10% faster"
level = 2
change = "new"
precedent = "Town Centers and Docks +100% HP and work +5/10/15/20% faster in Dark/Feudal/Castle/Imperial Age (Persians): the work-rate effect only, Town Centers only, at its Feudal Age value (+10%); the Cumans' Council of Khans and the Sicilians' Diwan use the same new tech for their governments"
basis = "In 1103 David IV called the church council of Ruisi and Urbnisi, which deposed unworthy bishops, many of them creatures of the great families, and set the church in order; he joined the see of Chqondidi to the office of chancellor (mtsignobartukhutsesi), so that the archbishop-chancellor (the Chqondideli), first his tutor Giorgi, became the first of the king's ministers and headed the royal administration for the rest of the golden age (Life of David; Suny, 1994; Rayfield, 2012). Faster Town Centers abstract the stronger central government; this effect is preferred to “All gold income +10% faster” (the royal fiscal administration) and to the Tamils' Uttaramerur effect (David's restoration of the realm), since the reform built a government rather than a treasury or a work force."
relevance = "The reform bound the church and the nobility to the crown and created the central government that carried David IV's restoration and Tamar's reign; a datable state institution, at the Town Center (RULES 6.2)."
contested = "The date of the council and of the union of the see with the chancellorship (see the civ-level contested list)."

[[unique_tech]]
name = "Gelati Academy"
building = "University"
kind = "civil"
age = "Castle"
effect = "University technologies cost -25%; Universities work +80% faster"
level = 2
change = "new"
precedent = "Dock and University technologies cost -25% (Italians; University part only); Universities work +80% faster (Malians team bonus)"
basis = "David IV founded the monastery and academy of Gelati in 1106, and his historian calls it a second Jerusalem and another Athens (Life of David). Tradition links it with the philosophers Ioane Petritsi and Arsen Iqaltoeli (on Petritsi, L. Gigineishvili, The Platonic Theology of Ioane Petritsi, 2007). It became the intellectual centre of the golden age and the burial place of David IV. It is a distinct datable moment from the military and church reforms (RULES 6.3), so it keeps a third tech slot, level 2 like the other two, since no existing tech fits these moments."
relevance = "Gelati was the centre of Georgian learning in the golden age and remains one of the symbols of Georgian identity; a datable institution at the University."
contested = "The role of Ioane Petritsi at Gelati rests largely on tradition."

[tree]
add = ["Thumb Ring", "Illumination", "Atonement"]
remove = ["Hand Cannoneer", "Cannon Galleon", "Galleon", "Fast Fire Ship", "Galleon, Fast Fire Ship and Carrack", "Block Printing"]

[tree.basis]
"Thumb Ring" = "The Kipchak settlers were steppe horse archers and the monaspa carried the bow (Golden, 1984): a steppe archery tradition the kingdom's armies demonstrably used (RULES 6.16.4); the civ had Heavy Cavalry Archer and Parthian Tactics without Thumb Ring."
"Illumination" = "A strong monastic culture: the academy of Gelati (1106), Iviron on Mount Athos (c. 980), Petritsoni (1083) and the Monastery of the Cross in Jerusalem."
"Atonement" = "As for Illumination: the full monastery tree for one of the great Orthodox monastic cultures."
"Hand Cannoneer" = "Firearms are not attested in Georgian armies of the core period (1089–1213), and we know of no evidence of their use before the kingdom split (c. 1490). Any guns of its last decades would be marginal, so the tree follows the period the civ represents, as for the Byzantines' guns of 1453 (RULES 6.16.19(d))."
"Cannon Galleon" = "No naval artillery and no significant war fleet in the period, despite the Abkhazian Black Sea coast; the civ has the basic navy (RULES 6.16.1), with no substitute siege warship."
"Galleon" = "No significant war fleet of its own (see Cannon Galleon): the basic navy only (RULES 6.16.1: Galley and War Galley, Fire Galley and Fire Ship, Hulk and War Hulk, demolition ships and the Dock techs)."
"Fast Fire Ship" = "As Galleon."
"Galleon, Fast Fire Ship and Carrack" = "Nothing is left for this upgrade once the Galleon and Fast Fire Ship are removed (the Georgians already lacked the Carrack)."
"Block Printing" = "No printing in the window: the first book in Georgian type, a Georgian–Italian dictionary, was printed in Rome in 1629."

[architecture]
set = "Mediterranean"
change = "kept"
basis = "Stone church and fortress architecture is closer to Georgian building than the other existing sets; a Caucasian set is N3."

[[dropped]]
item = "Mounted Units regenerate 2/8/14 HP per minute in Feudal/Castle/Imperial Age"
kind = "bonus"
reason = "No identifiable historical basis: nothing distinguishes Georgian horses or remounts in this respect. Its place among the cavalry traits goes to the aznauri passive and to the Kipchak settlers (a unique unit and the Castle tech)."
