civ = "Turks"
name = "Turks"
status = "draft"
label = "Gunpowder civilization"
summary = "Turks as the Seljuks of Rum and the Ottomans (1071–1526): Sipahi moves to the Town Center as Timar, the Seljuk hans (Caravanserai) replace the gold-mining bonus, Turkish horsemen serving neighbours become the team bonus, and the Hussar and Shipwright are renamed Akıncı and Tersane."
ideas = [
  "N2: Mehter: the Janissary military band as a support unit with an aura (the Centurion's mechanic) that speeds up nearby infantry and gunpowder units.",
  "N2: Ok Meydanı: a Turkish composite-bow technology (Archer-line and Cavalry Archers +1 range) once the Archer and Crossbowman lines are split; the early Janissaries were archers and Mehmed II founded the Ok Meydanı range in Istanbul after 1453.",
  "N2: Tersane-i Amire: an arsenal technology (Galley-line HP, cheaper Docks) for the fleet of the Golden Horn and the Red Sea and Indian Ocean campaigns against the Portuguese, beyond the renamed Shipwright.",
  "N2: An early-ages Seljuk profile (Oghuz horse archers and the feigned flight that drew the Byzantine army apart at Manzikert, 1071) with gunpowder reserved for the Imperial Age.",
  "N2: The Caravanserai available from the Castle Age, since the Seljuk sultan hans (1229–1236) are two centuries older than Ottoman gunpowder; N1 keeps the existing Imperial Age precedent.",
  "N3: A separate Seljuk civ (1037–1308), leaving the Turks as the Ottomans; in this design the Great Seljuk state in Iran belongs to the Persians.",
]
contested = [
  "Name: ‘Turks’ or ‘Ottomans’. The design is mostly Ottoman, but it also carries the Seljuks of Rum, and English scholarship speaks of both as Turks (the Seljuk and the Ottoman Turks), so the civ keeps the game's name (RULES section 4 and 6.16.15); a separate Seljuk civ is an N3 idea.",
  "Origin of the Ottoman timar: iqta' or pronoia (shared with the Arabs' design): Köprülü (1931) derived the Ottoman timar from the Seljuk and Ilkhanid iqta', against theories of Byzantine origin; Ostrogorsky (Pour l'histoire de la féodalité byzantine, 1954) saw it as the continuation of the Byzantine pronoia that the Ottomans found in the Balkans; İnalcık (‘Ottoman Methods of Conquest’, 1954; 1973) showed that Christian pronoia holders were taken into the timar registers of the conquered Balkans while tracing the institution to the iqta'. Bartusis (Land and Privilege in Byzantium, 2012) treats the pronoia as a grant of fiscal revenues, usually to soldiers, rather than a fief, which makes a direct institutional derivation of the timar harder to show. The codex follows the iqta' lineage, with Balkan continuity as a contributing factor.",
  "The ‘gazi thesis’ of Ottoman origins: Wittek (1938) against Lindner (1983), Kafadar (1995) and Lowry (2003).",
  "When the Janissaries adopted firearms (1440s or 1460s).",
  "When the Ottomans adopted the wagon fort (tabur): they met Hunyadi's wagon forts at Varna (1444) and Kosovo (1448), and their use of a wagon-and-gun line is usually dated from Otlukbeli (1473), against Uzun Hasan (Ágoston, 2005), though how early and how fully they took it over is uncertain; its fame rests on Chaldiran (1514) and Mohács (1526).",
  "Figures for the siege of 1453 (guns and Janissaries) in Kritovoulos, Barbaro and Doukas; modern estimates put the corps well below 15,000.",
  "The alleged printing bans of Bayezid II (1485) and Selim I (1515), questioned by Kathryn Schwartz (2017); Block Printing stays out.",
  "The ‘gunpowder empires’ model (Hodgson, McNeill) against Streusand and Ágoston.",
  "How far Babur's ‘Rumi’ cart-and-gun line at Panipat (1526) and the gunners called Rumi in the Indian Ocean world came from Ottoman practice or merely followed its model.",
  "Who the Turcopoles were: sons of Turkish fathers, baptised Turks, or local light horsemen recruited and equipped in the Turkish manner.",
  "How far camels served Seljuk and Ottoman armies as mounts in battle rather than as baggage animals (Ottoman campaigns moved with thousands of camels): the regional analysis sees them as mainly logistic, the tech-tree audit rates the Camel Rider plausible for the Turks. The Camel Rider and Heavy Camel Rider stay as a regional abstraction.",
]
open_questions = []

[profile]
entity = "The Turkish sultanates of Anatolia and the Balkans: the Seljuks of Rum and, above all, the Ottoman Empire (the Great Seljuk state in Iran is carried by the Persians)"
region = "Anatolia and the Balkans"
window = "1071–1526 (from Manzikert to Mohács, 1526, a terminal event soon after 1500 as RULES 6.16.17 allows; Ottoman core 1389–1500; nothing in the design originates after 1500, the generic skeleton items of RULES 6.16.2 aside)"
sources = [
  "Michael Attaleiates, History (Manzikert, 1071)",
  "Anna Komnene, Alexiad",
  "John VI Kantakouzenos, Histories",
  "Ibn Bibi, al-Awamir al-'Ala'iyya (Seljuk Rum)",
  "Aşıkpaşazade, Tevârîh-i Âl-i Osman",
  "Kritovoulos, History of Mehmed the Conqueror",
  "Konstantin Mihailović, Memoirs of a Janissary",
  "Claude Cahen, Pre-Ottoman Turkey (1968)",
  "A. C. S. Peacock and S. N. Yıldız (eds.), The Seljuks of Anatolia (2013)",
  "Kurt Erdmann, Das anatolische Karavansaray des 13. Jahrhunderts (1961)",
  "Donald M. Nicol, The Last Centuries of Byzantium, 1261–1453 (2nd ed., 1993)",
  "Halil İnalcık, The Ottoman Empire: The Classical Age 1300–1600 (1973)",
  "Cemal Kafadar, Between Two Worlds: The Construction of the Ottoman State (1995)",
  "Colin Imber, The Ottoman Empire, 1300–1650 (2002)",
  "Gábor Ágoston, Guns for the Sultan (2005)",
  "Steven Runciman, The Fall of Constantinople 1453 (1965)",
  "Palmira Brummett, Ottoman Seapower and Levantine Diplomacy in the Age of Discovery (1994)",
  "Giancarlo Casale, The Ottoman Age of Exploration (2010)",
