[[bonus]]
text = "Can build Caravanserai in Imperial Age"
kind = "economic"
level = 1
change = "new"
replaces = "Gold miners work +25% faster"
precedent = "Can build Caravanserai in Imperial Age (Persians, Hindustanis)"
basis = "After taking the ports of Antalya (1207) and Sinop (1214), the Seljuk sultans of Rum built a network of royal hans a day's march apart on the roads between them, Konya, Kayseri and Sivas, among them the two Sultan Hans near Aksaray (1229) and Kayseri (1232–1236), and protected the merchants who used them, even making good their losses to robbers from the treasury (Ibn Bibi; Erdmann, 1961; Cahen, 1968; Peacock and Yıldız, 2013). The Ottomans continued the type in their hans and külliyes. The gold-mining bonus it replaces failed the relevance test (see dropped)."
relevance = "State-built hans made Seljuk Anatolia a transit corridor between Iran, the Black Sea and the Mediterranean, and the Ottoman han-and-külliye system grew from them; they are the Seljuks' most visible material legacy."

[[bonus]]
text = "Scout Cavalry-line +1 pierce armor and upgrades free"
kind = "military"
level = 1
change = "kept"
precedent = "Scout Cavalry-line +1 pierce armor and upgrades free (Turks)"
basis = "The akıncı, light raiding horsemen of the frontier families (Mihaloğlu, Evrenosoğlu), and before them the Turkmen light cavalry of the Seljuks, were a large and cheap arm of every Turkish army."
relevance = "Raiding light horse carried the frontier warfare by which the Turks entered Anatolia and the Ottomans conquered the Balkans."

[[bonus]]
text = "Chemistry free; Gunpowder technologies cost -50%"
kind = "military"
level = 1
change = "kept"
precedent = "Chemistry free; Gunpowder technologies costs -50% (Turks)"
basis = "State production of powder and guns: founders such as Orban, who cast Mehmed II's great bombards in 1452–1453, and after 1453 the imperial cannon foundry (Tophane-i Amire) in Istanbul, with state control of saltpetre (Ágoston, 2005). The in-game text reads “Chemistry free; Gunpowder technologies costs -50%”; only the grammar is corrected here. As in the game, the Elite Skirmisher stays out as the counterweight to the gunpowder bonuses: a balance choice, not a historical claim, since the Ottoman azaps were light foot, many of them archers. The Arbalester stays out too, as no Turkish crossbow use is securely attested in the sources used here (RULES 6.16.3); the N2 Ok Meydanı idea carries the bow."
relevance = "Mastery of gunpowder weapons took Constantinople (1453) and won Chaldiran (1514) and Mohács (1526); it is the defining Ottoman military trait."

[[bonus]]
text = "Gunpowder Units +25% HP"
kind = "military"
level = 1
change = "kept"
precedent = "Gunpowder Units +25% HP (Turks)"
basis = "An abstraction of the discipline and professionalism of the salaried household troops (kapıkulu), above all the Janissaries, one of the earliest permanent salaried infantry corps of late medieval Europe and the Near East."
relevance = "A large salaried household army set the Ottomans apart from most of their Balkan and Anatolian rivals."

[team_bonus]
text = "Mounted Archers train +25% faster"
level = 1
change = "new"
replaces = "Gunpowder Units train +25% faster"
precedent = "Mounted Archers train +25% faster (Magyars team bonus, which the Magyars' design keeps)"
basis = "Turkish horsemen served neighbours as mercenaries and allies throughout the window. Byzantine commanders and emperors hired Turkish horse archers from the 1070s (Anna Komnene, Alexiad), and the Byzantines, then the crusader states and the military orders, raised Turcopoles, light horse archers of Turkish origin or fighting in the Turkish manner, whom the Hospitallers placed under a Turcopolier. In the Byzantine civil war of 1341–1347 Umur of Aydin and Orhan's Ottomans fought for John VI Kantakouzenos, who married his daughter Theodora to Orhan (1346); Ottoman help again in 1352 brought the Ottomans into Europe (Tzympe 1352, Gallipoli 1354) (Kantakouzenos, Histories; Nicol, 1993). The original bonus was a general abstraction of Ottoman logistics. Ottoman guns and gunners did reach neighbours, but every case falls after 1500 (guns, powder and timber for the Mamluk Red Sea fleet in 1510–1511 and Selman Reis's defence of Jeddah in 1517, Brummett, 1994, and Casale, 2010; Babur's ‘custom of Rum’ at Panipat, 1526), and a team bonus cannot meet the late-element rule (Imperial Age only, RULES section 2), so the horsemen carry the team bonus. Identical team-wide effects count once per team (RULES 6.16.12)."
relevance = "Turkish horse archers in the service of neighbours, from the Turcopoles to Kantakouzenos' Turkish allies, shaped Byzantine and crusader warfare and opened Europe to the Ottomans; it is a benefit to allies, as RULES 6.2 requires."

[[unique_unit]]
name = "Janissary"
model = "Janissary"
building = "Castle"
level = 1
change = "kept"
basis = "The yeniçeri (‘new troops’) were formed under Murad I (c. 1363–1380) from the sultan's fifth of war captives (pençik) and later from the devşirme levy of Christian boys; they began as archers and took up firearms from the mid-15th century. The unit represents the Janissary of c. 1450–1600 well; the Scenario Editor's Royal Janissary, a stronger variant, adds nothing the game's unit lacks. The wagon fort (tabur) behind which the Janissaries fought, most famously at Chaldiran (1514) and Mohács (1526), on Hungarian and Hussite models, is not added through the Bohemians' Hussite Wagon: it was a field-fortification tactic rather than a troop type, the Hussite Wagon, whether as a second unique unit or unlocked by a Castle tech (as in the Magyars' design), would render a Bohemian institution, and its Ottoman fame rests on battles after 1500 (on when the Ottomans adopted it, see contested)."
relevance = "The Janissaries were the core of the Ottoman army and, through the devşirme, of the Ottoman state; they are also the troops most associated with the Turks."

[[unique_tech]]
name = "Timar"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Mounted Archers +20 HP"
level = 1
change = "changed"
replaces = "Sipahi (Mounted Archers +20 HP)"
precedent = "Sipahi (Mounted Archers +20 HP) (Turks): an existing unique tech, moved from the Castle to the Town Center and renamed with an identical effect; the Hindustanis share it at the Castle as Dagh"
basis = "The timar assigned the revenue of a district, recorded in the state's survey registers (tahrir defterleri, from the 1430s), to a provincial cavalryman (sipahi) who served with bow, lance and mace and brought armed retainers in proportion to his income (İnalcık, 1973). The Town Center fits the institution, a land-revenue system run by the central government; sturdier mounted archers translate the equipped timariot cavalry. The tech is named after the institution rather than after the soldiers (Sipahi), and the codex reads it as grown out of the Seljuk and Ilkhanid iqta' (see contested on its origin)."
relevance = "The timar system raised the bulk of the Ottoman army and organised the conquered provinces; it is the backbone of the classical Ottoman state."

[[unique_tech]]
name = "Artillery"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Bombard Towers, Bombard Cannons, Cannon Galleons +2 range"
level = 1
change = "kept"
precedent = "Artillery (Bombard Towers, Bombard Cannons, Cannon Galleons +2 range) (Turks)"
basis = "Ottoman superiority in siege artillery is well documented: Orban's great bombard at Constantinople (1453), Munir Ali's Dardanelles Gun (1464), the sieges of Rhodes (1480, 1522) and Belgrade (1521). Siege Engineers stays out of the tree, as in the game: with Artillery it would give Bombard Cannons a range of 15, beyond the highest value the game gives the class (RULES 6.16.11); Sappers, already in the tree, carries the Ottoman miners (lağımcı)."
relevance = "Siege artillery opened Constantinople, Belgrade and Rhodes to the Ottomans; without it their 15th–16th-century expansion fails."

[tree]
add = ["Herbal Medicine", "Caravanserai"]
remove = ["Siphons", "Incendiaries"]

[tree.basis]
"Herbal Medicine" = "Seljuk-era Anatolian rulers and the Ottomans founded great hospitals (darüşşifa): Gevher Nesibe in Kayseri (Kaykhusraw I, 1205–1206), the Mengujekid hospital of Turan Malik at Divriği (1228–1229) and the hospital of Bayezid II's complex at Edirne (1488). The absence was ironic."
"Caravanserai" = "Granted by the Caravanserai bonus (the Seljuk sultan hans and the Ottoman hans; see there) and added so that the tree shows the building, as in the Khmer design (the Persians and Hindustanis have it in the game)."
"Siphons" = "Named after the Byzantine fire siphon, a state secret never given to other nations (De Administrando Imperio 13); no ship-borne liquid-fire weapon is documented for this civ."
"Incendiaries" = "Requires Siphons, which this design removes."

[[rename]]
from = "Hussar"
to = "Akıncı"
level = 1
basis = "The akıncı (‘raider’) were the Ottoman light horsemen who raided ahead of the army into Hungary, Austria and Italy (Friuli, 1477–1499); the word hussar itself probably comes, through Serbian, from a word for raider. Same function, identical effect."

[[rename]]
from = "Shipwright"
to = "Tersane"
level = 1
basis = "The Ottoman state arsenals (tersane), at Gallipoli from c. 1390 and on the Golden Horn after 1453, enlarged by Selim I from 1515; the word itself comes, through Italian darsena, from the Arabic dār al-ṣināʿa, which the Arabs' renamed Shipwright uses. Same function (a state shipyard), identical effect. The navy is a fleet of ships (RULES 6.16.1): the galleys of Gallipoli and the Golden Horn and the gun-carrying göke of Kemal Reis at Zonchio (1499) keep the game's generic tiers, the Galleon as a flagged abstraction (RULES 6.16.2), and the Cannon Galleon. The game's lack of the Fast Fire Ship stands and no naval bonus is added: the fleet fought inside the window (Negroponte 1470, the Otranto landing 1480, Zonchio 1499, Modon 1500), but its peak (Rhodes 1522, Preveza 1538, Djerba 1560) comes after it."

[architecture]
set = "Middle Eastern"
change = "kept"
basis = "Seljuk and early Ottoman stone building (Konya, Bursa, Edirne) fits the Middle Eastern set; a Rumi-Ottoman set would be N3. Treadmill Crane stays in the tree under the region's one reading of the tech (see the Arabs' design): no treadwheel crane is attested at Seljuk or Ottoman building sites before 1526 in the sources used here, so it is kept as a generic abstraction of faster building, resting on the Seljuk sultan hans and on Ottoman külliyes such as Mehmed II's Fatih complex in Istanbul (1463–1470)."

[[dropped]]
item = "Gold miners work +25% faster"
kind = "bonus"
reason = "Relevance test (RULES 6.9), as a gold-mining bonus with weak historical weight: the analysis rates it stretched, the metal was the silver of Novo Brdo (taken 1455), Srebrenica and Kratovo, and mining was a modest share of Ottoman revenue beside land taxes and customs; erasing it would not change the course or identity of the civ. Replaced by the Seljuk and Ottoman hans (Caravanserai). No early economic passive (such as ‘Shepherds work +25% faster’ for the Turkmen and yörük herders) is added to make up for it: there is no blanket compensation (RULES 6.16.13), so the Turks' economic bonus comes only in the Imperial Age."
