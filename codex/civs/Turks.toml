civ = "Turks"
name = "Turks"
status = "draft"
label = "Gunpowder civilization"
summary = "Turks kept as the Seljuks of Rum and above all the Ottomans (1071–1526), one of the best-founded designs in the game: the akıncı, gunpowder and Janissary bonuses, the Janissary and Artillery (Castle) stay; Sipahi moves to the Town Center as ‘Timar’, the land grants that raised the cavalry; the weak gold-mining bonus gives way to the Seljuk and Ottoman hans (Caravanserai); the team bonus is re-based on Ottoman gunners and methods spreading to neighbours; Siege Engineers and Herbal Medicine enter the tree, the Hussar becomes the Akıncı and Shipwright the Tersane."
ideas = [
  "N2: Mehter: the Janissary military band as a support unit with an aura (the Centurion's mechanic) that speeds up nearby infantry and gunpowder units.",
  "N2: Ok Meydanı: a Turkish composite-bow technology (Archer-line and Cavalry Archers +1 range) once the Archer and Crossbowman lines are split; the early Janissaries were archers and Mehmed II founded the Ok Meydanı range in Istanbul after 1453.",
  "N2: Tersane-i Amire: an arsenal technology (Galley-line HP, cheaper Docks) for the fleet of the Golden Horn and the Red Sea and Indian Ocean campaigns against the Portuguese, beyond the renamed Shipwright.",
  "N2: An early-ages Seljuk profile (Oghuz horse archers, the feigned retreats of Manzikert 1071 and Dorylaeum 1097) with gunpowder reserved for the Imperial Age.",
  "N3: A separate Seljuk civ (1037–1308), leaving the Turks as the Ottomans.",
]
contested = [
  "The ‘gazi thesis’ of Ottoman origins: Wittek (1938) against Lindner (1983), Kafadar (1995) and Lowry (2003).",
  "When the Janissaries adopted firearms (1440s or 1460s).",
  "Figures for the siege of 1453 (guns and Janissaries) in Kritovoulos, Barbaro and Doukas; modern estimates put the corps well below 15,000.",
  "The alleged printing bans of Bayezid II (1485) and Selim I (1515), questioned by Kathryn Schwartz (2017); Block Printing stays out.",
  "The ‘gunpowder empires’ model (Hodgson, McNeill) against Streusand and Ágoston.",
  "How far Babur's ‘Rumi’ cart-and-gun line at Panipat (1526) and the gunners called Rumi in the Indian Ocean world came from Ottoman practice or merely followed its model.",
]
open_questions = [
  "Name: rename to ‘Ottomans’, as the analysis proposes? The design is Ottoman and the Seljuks are thin (the Caravanserai now gives them an element). Not decided, so the current name is kept.",
  "Tabur: share the Bohemian Hussite Wagon (as a second unique unit or through a technology) for the Ottoman wagon forts of Chaldiran (1514) and Mohács (1526), which followed Hungarian and Hussite models? N1-feasible, not done because the Ottoman use is late in the window.",
  "Archery on foot: under the regional archer rule (see the Persians), the Turks, with a famous bow tradition and no archer unique unit, qualify for the Arbalester as the generic Imperial bow tier; the civ has never had it. Add it now, or wait for the N2 bow/crossbow split (and the Ok Meydanı idea)?",
  "Navy: no Fast Fire Ship and no naval bonus, though the fleet acted inside the window: Negroponte (1470), the Otranto landing (1480), Zonchio (1499, where Kemal Reis's gun-carrying göke fought), Modon (1500) and the amphibious conquest of Rhodes (1522); its peak (Preveza 1538, Djerba 1560) comes later. Add Fast Fire Ship or a naval bonus with an existing precedent?",
  "Siege Engineers stacks with Artillery: Bombard Cannons go from +2 to +3 range and gain +20% attack against buildings, a power increase to the civ's strongest late-game unit. Accept it?",
  "Sipahi is moved to the Town Center and renamed ‘Timar’, after the institution rather than the soldiers. Keep the old name ‘Sipahi’ instead?",
]

[profile]
entity = "The Turkish sultanates of Anatolia and the Balkans: the Seljuks of Rum and, above all, the Ottoman Empire"
region = "Anatolia and the Balkans"
window = "1071–1526 (Ottoman core 1389–1526)"
sources = [
  "Michael Attaleiates, History (Manzikert, 1071)",
  "Aşıkpaşazade, Tevârîh-i Âl-i Osman",
  "Kritovoulos, History of Mehmed the Conqueror",
  "Konstantin Mihailović, Memoirs of a Janissary",
  "Babur, Baburnama (Panipat, 1526)",
  "Halil İnalcık, The Ottoman Empire: The Classical Age 1300–1600 (1973)",
  "Cemal Kafadar, Between Two Worlds: The Construction of the Ottoman State (1995)",
  "Colin Imber, The Ottoman Empire, 1300–1650 (2002)",
  "Gábor Ágoston, Guns for the Sultan (2005)",
  "Giancarlo Casale, The Ottoman Age of Exploration (2010)",
  "A. C. S. Peacock, The Great Seljuk Empire (2015)",
  "Kurt Erdmann, Das anatolische Karavansaray des 13. Jahrhunderts (1961)",
  "Steven Runciman, The Fall of Constantinople 1453 (1965)",
]

[[bonus]]
text = "Can build Caravanserai in Imperial Age"
kind = "economic"
level = 1
change = "new"
replaces = "Gold miners work +25% faster"
precedent = "Can build Caravanserai in Imperial Age (Persians, Hindustanis)"
basis = "After taking the ports of Antalya (1207) and Sinop (1214), the Seljuk sultans of Rum built a network of royal hans a day's march apart on the roads between them, Konya, Kayseri and Sivas, among them the two Sultan Hans near Aksaray (1229) and Kayseri (1232–1236), and protected and even insured the merchants who used them (Erdmann, 1961; Peacock, 2015). The Ottomans continued the type in their hans and külliyes. The gold-mining bonus it replaces failed the relevance test (see dropped)."
relevance = "State-built hans made Seljuk Anatolia a transit corridor between Iran, the Black Sea and the Mediterranean, and the Ottoman han-and-külliye system grew from them; it is the Seljuks' clearest legacy."

[[bonus]]
text = "Scout Cavalry-line +1 pierce armor and upgrades free"
kind = "military"
level = 1
change = "kept"
precedent = "Scout Cavalry-line +1 pierce armor and upgrades free (Turks)"
basis = "The akıncı, light raiding horsemen of the frontier families (Mihaloğlu, Evrenosoğlu), and before them the Turkmen light cavalry of the Seljuks, were a large and cheap arm of every Turkish army."
relevance = "Raiding light horse carried the frontier warfare by which the Turks entered Anatolia and the Ottomans conquered the Balkans."

[[bonus]]
text = "Chemistry free; Gunpowder technologies cost -50%"
kind = "military"
level = 1
change = "kept"
precedent = "Chemistry free; Gunpowder technologies costs -50% (Turks)"
basis = "State production of powder and guns: founders such as Orban, who cast Mehmed II's great bombards in 1452–1453, and after 1453 the imperial cannon foundry (Tophane-i Amire) in Istanbul, with state control of saltpetre (Ágoston, 2005). The in-game text reads “Chemistry free; Gunpowder technologies costs -50%”; only the grammar is corrected here."
relevance = "Mastery of gunpowder weapons took Constantinople (1453) and won Chaldiran (1514) and Mohács (1526); it is the defining Ottoman military trait."

[[bonus]]
text = "Gunpowder Units +25% HP"
kind = "military"
level = 1
change = "kept"
precedent = "Gunpowder Units +25% HP (Turks)"
basis = "An abstraction of the discipline and professionalism of the salaried household troops (kapıkulu), above all the Janissaries, the first standing infantry of the period."
relevance = "A salaried standing army of household troops set the Ottomans apart from their feudal and tribal neighbours."

[team_bonus]
text = "Gunpowder Units train +25% faster"
level = 1
change = "kept"
precedent = "Gunpowder Units train +25% faster (Turks team bonus)"
basis = "Re-based on Ottoman gunners and methods passed to neighbours and allies: Babur, the Timurid prince, fought at Panipat (1526) with guns behind chained carts ‘after the custom of Rum’ under his gunner Ustad Ali Quli (Baburnama), and gunners and sailors called Rumi served Muslim rulers across the Indian Ocean world from the 1500s (Casale, 2010). The original basis was a general abstraction of Ottoman logistics (Ágoston, 2005)."
relevance = "Ottoman gunpowder warfare became the model of the Islamic world's ‘gunpowder empires’; spreading it to allies is a benefit to neighbours, as RULES 6.2 requires."

[[unique_unit]]
name = "Janissary"
model = "Janissary"
building = "Castle"
level = 1
change = "kept"
basis = "The yeniçeri (‘new troops’) were formed under Murad I (c. 1363–1380) from the sultan's fifth of war captives (pençik) and later from the devşirme levy of Christian boys; they began as archers and took up firearms from the mid-15th century. The unit represents the Janissary of c. 1450–1600 well."
relevance = "The Janissaries were the core of the Ottoman army and, through the devşirme, of the Ottoman state; they are also the troops most associated with the Turks."

[[unique_tech]]
name = "Timar"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Mounted Archers +20 HP"
level = 1
change = "changed"
replaces = "Sipahi (Mounted Archers +20 HP)"
precedent = "Sipahi (Mounted Archers +20 HP) (Turks): an existing unique tech, moved from the Castle to the Town Center and renamed with an identical effect"
basis = "The timar assigned the revenue of a district, recorded in the state's survey registers (tahrir defterleri, from the 1430s), to a provincial cavalryman (sipahi) who served with bow, lance and mace and brought armed retainers in proportion to his income (İnalcık, 1973). The Town Center fits the institution, a land-revenue system run by the central government; sturdier mounted archers translate the equipped timariot cavalry. Renamed after the institution."
relevance = "The timar system raised the bulk of the Ottoman army and organised the conquered provinces; it is the backbone of the classical Ottoman state."

[[unique_tech]]
name = "Artillery"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Bombard Towers, Bombard Cannons, Cannon Galleons +2 range"
level = 1
change = "kept"
precedent = "Artillery (Bombard Towers, Bombard Cannons, Cannon Galleons +2 range) (Turks)"
basis = "Ottoman superiority in siege artillery is well documented: Orban's great bombard at Constantinople (1453), Munir Ali's Dardanelles Gun (1464), the sieges of Rhodes (1480, 1522) and Belgrade (1521)."
relevance = "Siege artillery opened Constantinople, Belgrade and Rhodes to the Ottomans; without it their 15th–16th-century expansion fails."

[tree]
add = ["Siege Engineers", "Herbal Medicine"]
remove = []

[tree.basis]
"Siege Engineers" = "Ottoman sappers (lağımcı) were central to Ottoman siegecraft: months of mining and countermining brought down the bastions of Rhodes in 1522, and miners also worked at Belgrade (1521). At Constantinople (1453) the mines dug by miners from Novo Brdo, sent by the Serbian despot, were all countered by Johannes Grant's teams (Runciman, 1965), but the effort shows the specialism. (The first siege of Vienna, 1529, falls outside the window and failed.)"
"Herbal Medicine" = "Seljuk-era Anatolian rulers and the Ottomans founded great hospitals (darüşşifa): Gevher Nesibe in Kayseri (Kaykhusraw I, 1205–1206), the Mengujekid hospital of Turan Malik at Divriği (1228–1229) and the hospital of Bayezid II's complex at Edirne (1488). The absence was ironic."

[[rename]]
from = "Hussar"
to = "Akıncı"
level = 1
basis = "The akıncı (‘raider’) were the Ottoman light horsemen who raided ahead of the army into Hungary, Austria and Italy (Friuli, 1477–1499); the word hussar itself probably comes, through Serbian, from a word for raider. Same function, identical effect."

[[rename]]
from = "Shipwright"
to = "Tersane"
level = 1
basis = "The Ottoman state arsenals (tersane), at Gallipoli from c. 1390 and on the Golden Horn after 1453, enlarged by Selim I from 1515; the word itself comes, through Italian darsena, from the Arabic dār al-ṣināʿa, which the Saracens' renamed Shipwright uses. Same function (a state shipyard), identical effect."

[architecture]
set = "Middle Eastern"
change = "kept"
basis = "Seljuk and early Ottoman stone building (Konya, Bursa, Edirne) fits the Middle Eastern set; a Rumi-Ottoman set would be N3."

[[dropped]]
item = "Gold miners work +25% faster"
kind = "bonus"
reason = "Relevance test (RULES 6.9; brief 5.5 flags gold-mining bonuses with weak historical weight): the analysis rates it stretched, the metal was the silver of Novo Brdo (taken 1455), Srebrenica and Kratovo, and mining was a modest share of Ottoman revenue beside land taxes and customs; erasing it would not change the course or identity of the civ. Replaced by the Seljuk and Ottoman hans (Caravanserai)."
