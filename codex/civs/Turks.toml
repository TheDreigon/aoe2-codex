civ = "Turks"
name = "Turks"
status = "draft"
label = "Gunpowder civilization"
summary = "Turks as the Seljuks of Rum and the Ottomans (1071–1526): Sipahi moves to the Town Center as Timar, the Seljuk hans (Caravanserai) replace the gold-mining bonus, Turkish horsemen serving neighbours become the team bonus, and the Hussar and Shipwright are renamed Akıncı and Tersane."
ideas = [
  "N2: Mehter: the Janissary military band as a support unit with an aura (the Centurion's mechanic) that speeds up nearby infantry and gunpowder units.",
  "N2: Ok Meydanı: a Turkish composite-bow technology (Archer-line and Cavalry Archers +1 range) once the Archer and Crossbowman lines are split; the early Janissaries were archers and Mehmed II founded the Ok Meydanı range in Istanbul after 1453.",
  "N2: Tersane-i Amire: an arsenal technology (Galley-line HP, cheaper Docks) for the fleet of the Golden Horn and the Red Sea and Indian Ocean campaigns against the Portuguese, beyond the renamed Shipwright.",
  "N2: An early-ages Seljuk profile (Oghuz horse archers and the feigned flight that drew the Byzantine army apart at Manzikert, 1071) with gunpowder reserved for the Imperial Age.",
  "N2: The Caravanserai available from the Castle Age, since the Seljuk sultan hans (1229–1236) are two centuries older than Ottoman gunpowder; N1 keeps the existing Imperial Age precedent.",
  "N3: A separate Seljuk civ (1037–1308), leaving the Turks as the Ottomans; in this design the Great Seljuk state in Iran belongs to the Persians.",
]
contested = [
  "The ‘gazi thesis’ of Ottoman origins: Wittek (1938) against Lindner (1983), Kafadar (1995) and Lowry (2003).",
  "When the Janissaries adopted firearms (1440s or 1460s).",
  "Figures for the siege of 1453 (guns and Janissaries) in Kritovoulos, Barbaro and Doukas; modern estimates put the corps well below 15,000.",
  "The alleged printing bans of Bayezid II (1485) and Selim I (1515), questioned by Kathryn Schwartz (2017); Block Printing stays out.",
  "The ‘gunpowder empires’ model (Hodgson, McNeill) against Streusand and Ágoston.",
  "How far Babur's ‘Rumi’ cart-and-gun line at Panipat (1526) and the gunners called Rumi in the Indian Ocean world came from Ottoman practice or merely followed its model.",
  "Who the Turcopoles were: sons of Turkish fathers, baptised Turks, or local light horsemen recruited and equipped in the Turkish manner.",
  "How far camels served Seljuk and Ottoman armies as mounts in battle rather than as baggage animals (Ottoman campaigns moved with thousands of camels): the regional analysis sees them as mainly logistic, the tech-tree audit rates the Camel Rider plausible for the Turks. The Camel Rider and Heavy Camel Rider stay as a regional abstraction.",
]
open_questions = [
  "Name: rename to ‘Ottomans’, as the analysis proposes? The design is Ottoman and the Seljuks are thin (the Caravanserai now gives them an element). Not decided, so the current name is kept. The renames are decided together in codex-wide question CQ16 (see codex/civs/README.md).",
  "Team bonus: the previous draft re-based ‘Gunpowder Units train +25% faster’ on Ottoman guns and gunners for neighbours, but every case falls after 1500 (guns, powder and timber sent for the Mamluk Red Sea fleet in 1510–1511 and Selman Reis's defence of Jeddah in 1517, Brummett, 1994, and Casale, 2010; Babur's ‘custom of Rum’ at Panipat, 1526), and a team bonus cannot meet the late-element rule (Imperial Age only, RULES section 2). This draft uses Turkish horsemen serving neighbours instead (‘Mounted Archers train +25% faster’, also the Magyars' team bonus). Keep that, or restore the gunpowder team bonus as an owner's exception to RULES section 2?",
  "Tabur: share the Bohemian Hussite Wagon (as a second unique unit or through a technology) for the Ottoman wagon forts of Chaldiran (1514) and Mohács (1526), which followed Hungarian and Hussite models? N1-feasible, not done because the Ottoman use falls after 1500 and would be a late element.",
  "Navy: no Fast Fire Ship and no naval bonus, though the fleet acted inside the window: Negroponte (1470), the Otranto landing (1480), Zonchio (1499, where Kemal Reis's gun-carrying göke fought) and Modon (1500); its peak (Rhodes 1522, Preveza 1538, Djerba 1560) comes later. Add Fast Fire Ship or a naval bonus with an existing precedent?",
  "Codex-wide question CQ9 (see codex/civs/README.md): magnitude ceiling (Siege Engineers stays out, since with Artillery it would give range-15 Bombard Cannons; Sappers, already in the tree, carries the Ottoman miners, the lağımcı).",
  "Sipahi is moved to the Town Center and renamed ‘Timar’, after the institution rather than the soldiers. Keep the old name ‘Sipahi’ instead? (The Saracens share the same tech as Iqta', the institution from which the timar grew.)",
  "Foot archery and skirmishers: the Turks remain the only civ without the Elite Skirmisher, a balance choice with no historical reason (the Ottoman azaps were light foot, many of them archers), and they get no Arbalester, since no Turkish crossbow use is securely attested in the sources used here (the N2 Ok Meydanı idea carries the bow). Add the Elite Skirmisher, or keep it out as the counterweight to the gunpowder bonuses?",
  "Power: with the gold-mining bonus dropped, the Turks' only economic passive is the Imperial Age Caravanserai, so they have no economic bonus before the Imperial Age. Add an early economic passive with an existing precedent, for example ‘Shepherds work +25% faster’ (Britons) for the Turkmen and yörük herders of Anatolia, or accept the change?",
]

[profile]
entity = "The Turkish sultanates of Anatolia and the Balkans: the Seljuks of Rum and, above all, the Ottoman Empire (the Great Seljuk state in Iran is carried by the Persians)"
region = "Anatolia and the Balkans"
window = "1071–1526 (Ottoman core 1389–1526)"
sources = [
  "Michael Attaleiates, History (Manzikert, 1071)",
  "Anna Komnene, Alexiad",
  "John VI Kantakouzenos, Histories",
  "Ibn Bibi, al-Awamir al-'Ala'iyya (Seljuk Rum)",
  "Aşıkpaşazade, Tevârîh-i Âl-i Osman",
  "Kritovoulos, History of Mehmed the Conqueror",
  "Konstantin Mihailović, Memoirs of a Janissary",
  "Claude Cahen, Pre-Ottoman Turkey (1968)",
  "A. C. S. Peacock and S. N. Yıldız (eds.), The Seljuks of Anatolia (2013)",
  "Kurt Erdmann, Das anatolische Karavansaray des 13. Jahrhunderts (1961)",
  "Donald M. Nicol, The Last Centuries of Byzantium, 1261–1453 (2nd ed., 1993)",
  "Halil İnalcık, The Ottoman Empire: The Classical Age 1300–1600 (1973)",
  "Cemal Kafadar, Between Two Worlds: The Construction of the Ottoman State (1995)",
  "Colin Imber, The Ottoman Empire, 1300–1650 (2002)",
  "Gábor Ágoston, Guns for the Sultan (2005)",
  "Steven Runciman, The Fall of Constantinople 1453 (1965)",
]

[[bonus]]
text = "Can build Caravanserai in Imperial Age"
kind = "economic"
level = 1
change = "new"
replaces = "Gold miners work +25% faster"
precedent = "Can build Caravanserai in Imperial Age (Persians, Hindustanis)"
basis = "After taking the ports of Antalya (1207) and Sinop (1214), the Seljuk sultans of Rum built a network of royal hans a day's march apart on the roads between them, Konya, Kayseri and Sivas, among them the two Sultan Hans near Aksaray (1229) and Kayseri (1232–1236), and protected the merchants who used them, even making good their losses to robbers from the treasury (Ibn Bibi; Erdmann, 1961; Cahen, 1968; Peacock and Yıldız, 2013). The Ottomans continued the type in their hans and külliyes. The gold-mining bonus it replaces failed the relevance test (see dropped)."
relevance = "State-built hans made Seljuk Anatolia a transit corridor between Iran, the Black Sea and the Mediterranean, and the Ottoman han-and-külliye system grew from them; they are the Seljuks' most visible material legacy."

[[bonus]]
text = "Scout Cavalry-line +1 pierce armor and upgrades free"
kind = "military"
level = 1
change = "kept"
precedent = "Scout Cavalry-line +1 pierce armor and upgrades free (Turks)"
basis = "The akıncı, light raiding horsemen of the frontier families (Mihaloğlu, Evrenosoğlu), and before them the Turkmen light cavalry of the Seljuks, were a large and cheap arm of every Turkish army."
relevance = "Raiding light horse carried the frontier warfare by which the Turks entered Anatolia and the Ottomans conquered the Balkans."

[[bonus]]
text = "Chemistry free; Gunpowder technologies cost -50%"
kind = "military"
level = 1
change = "kept"
precedent = "Chemistry free; Gunpowder technologies costs -50% (Turks)"
basis = "State production of powder and guns: founders such as Orban, who cast Mehmed II's great bombards in 1452–1453, and after 1453 the imperial cannon foundry (Tophane-i Amire) in Istanbul, with state control of saltpetre (Ágoston, 2005). The in-game text reads “Chemistry free; Gunpowder technologies costs -50%”; only the grammar is corrected here."
relevance = "Mastery of gunpowder weapons took Constantinople (1453) and won Chaldiran (1514) and Mohács (1526); it is the defining Ottoman military trait."

[[bonus]]
text = "Gunpowder Units +25% HP"
kind = "military"
level = 1
change = "kept"
precedent = "Gunpowder Units +25% HP (Turks)"
basis = "An abstraction of the discipline and professionalism of the salaried household troops (kapıkulu), above all the Janissaries, one of the earliest permanent salaried infantry corps of late medieval Europe and the Near East."
relevance = "A large salaried household army set the Ottomans apart from most of their Balkan and Anatolian rivals."

[team_bonus]
text = "Mounted Archers train +25% faster"
level = 1
change = "new"
replaces = "Gunpowder Units train +25% faster"
precedent = "Mounted Archers train +25% faster (Magyars team bonus; the Tatars' design uses it too)"
basis = "Turkish horsemen served neighbours as mercenaries and allies throughout the window. Byzantine commanders and emperors hired Turkish horse archers from the 1070s (Anna Komnene, Alexiad), and the Byzantines, then the crusader states and the military orders, raised Turcopoles, light horse archers of Turkish origin or fighting in the Turkish manner, whom the Hospitallers placed under a Turcopolier. In the Byzantine civil war of 1341–1347 Umur of Aydin and Orhan's Ottomans fought for John VI Kantakouzenos, who married his daughter Theodora to Orhan (1346); Ottoman help again in 1352 brought the Ottomans into Europe (Tzympe 1352, Gallipoli 1354) (Kantakouzenos, Histories; Nicol, 1993). The original bonus was a general abstraction of Ottoman logistics, and its transfer to allies is attested only after 1500 (see open questions)."
relevance = "Turkish horse archers in the service of neighbours, from the Turcopoles to Kantakouzenos' Turkish allies, shaped Byzantine and crusader warfare and opened Europe to the Ottomans; it is a benefit to allies, as RULES 6.2 requires."

[[unique_unit]]
name = "Janissary"
model = "Janissary"
building = "Castle"
level = 1
change = "kept"
basis = "The yeniçeri (‘new troops’) were formed under Murad I (c. 1363–1380) from the sultan's fifth of war captives (pençik) and later from the devşirme levy of Christian boys; they began as archers and took up firearms from the mid-15th century. The unit represents the Janissary of c. 1450–1600 well."
relevance = "The Janissaries were the core of the Ottoman army and, through the devşirme, of the Ottoman state; they are also the troops most associated with the Turks."

[[unique_tech]]
name = "Timar"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Mounted Archers +20 HP"
level = 1
change = "changed"
replaces = "Sipahi (Mounted Archers +20 HP)"
precedent = "Sipahi (Mounted Archers +20 HP) (Turks): an existing unique tech, moved from the Castle to the Town Center and renamed with an identical effect; the Saracens share it as Iqta'"
basis = "The timar assigned the revenue of a district, recorded in the state's survey registers (tahrir defterleri, from the 1430s), to a provincial cavalryman (sipahi) who served with bow, lance and mace and brought armed retainers in proportion to his income (İnalcık, 1973). The Town Center fits the institution, a land-revenue system run by the central government; sturdier mounted archers translate the equipped timariot cavalry. Renamed after the institution, which grew out of the Seljuk iqta'."
relevance = "The timar system raised the bulk of the Ottoman army and organised the conquered provinces; it is the backbone of the classical Ottoman state."

[[unique_tech]]
name = "Artillery"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Bombard Towers, Bombard Cannons, Cannon Galleons +2 range"
level = 1
change = "kept"
precedent = "Artillery (Bombard Towers, Bombard Cannons, Cannon Galleons +2 range) (Turks)"
basis = "Ottoman superiority in siege artillery is well documented: Orban's great bombard at Constantinople (1453), Munir Ali's Dardanelles Gun (1464), the sieges of Rhodes (1480, 1522) and Belgrade (1521)."
relevance = "Siege artillery opened Constantinople, Belgrade and Rhodes to the Ottomans; without it their 15th–16th-century expansion fails."

[tree]
add = ["Herbal Medicine", "Caravanserai"]
remove = ["Siphons", "Incendiaries"]

[tree.basis]
"Herbal Medicine" = "Seljuk-era Anatolian rulers and the Ottomans founded great hospitals (darüşşifa): Gevher Nesibe in Kayseri (Kaykhusraw I, 1205–1206), the Mengujekid hospital of Turan Malik at Divriği (1228–1229) and the hospital of Bayezid II's complex at Edirne (1488). The absence was ironic."
"Caravanserai" = "Granted by the Caravanserai bonus (the Seljuk sultan hans and the Ottoman hans; see there) and added so that the tree shows the building, as in the Khmer and Hindustani designs."
"Siphons" = "Named after the Byzantine fire siphon, a state secret never given to other nations (De Administrando Imperio 13); no ship-borne liquid-fire weapon is documented for this civ."
"Incendiaries" = "Requires Siphons, which this design removes."

[[rename]]
from = "Hussar"
to = "Akıncı"
level = 1
basis = "The akıncı (‘raider’) were the Ottoman light horsemen who raided ahead of the army into Hungary, Austria and Italy (Friuli, 1477–1499); the word hussar itself probably comes, through Serbian, from a word for raider. Same function, identical effect."

[[rename]]
from = "Shipwright"
to = "Tersane"
level = 1
basis = "The Ottoman state arsenals (tersane), at Gallipoli from c. 1390 and on the Golden Horn after 1453, enlarged by Selim I from 1515; the word itself comes, through Italian darsena, from the Arabic dār al-ṣināʿa, which the Saracens' renamed Shipwright uses. Same function (a state shipyard), identical effect."

[architecture]
set = "Middle Eastern"
change = "kept"
basis = "Seljuk and early Ottoman stone building (Konya, Bursa, Edirne) fits the Middle Eastern set; a Rumi-Ottoman set would be N3."

[[dropped]]
item = "Gold miners work +25% faster"
kind = "bonus"
reason = "Relevance test (RULES 6.9; brief 5.5 flags gold-mining bonuses with weak historical weight): the analysis rates it stretched, the metal was the silver of Novo Brdo (taken 1455), Srebrenica and Kratovo, and mining was a modest share of Ottoman revenue beside land taxes and customs; erasing it would not change the course or identity of the civ. Replaced by the Seljuk and Ottoman hans (Caravanserai)."
