civ = "Khmer"
name = "Khmer"
status = "draft"
label = "Elephant and Siege civilization"
summary = "The Angkorian empire (802–1431): Jayavarman VII’s hospitals (Arogyashala) replace Tusk Swords, rice, temples, spear levies and rest houses (Dharmashala) the unfounded mechanics, Khmer script passed to the Tai the Scorpion team bonus, and the tree follows Zhou Daguan: no stone-throwers, Knights or guns."
ideas = [
  "N3: A baray (reservoir) building that waters nearby Farms, if the agricultural role of the barays is upheld (Fletcher, Evans).",
  "N2: Tonle Sap fleet: a naval tech for the river battles against the Cham shown on the Bayon and Banteay Chhmar (c. 1177–81).",
  "N2: Double Crossbows reworked as one heavier bolt (more attack and range) rather than an extra projectile, closer to the double-bow engines of the reliefs.",
  "N2: Hospitals as a regeneration aura around Monasteries and Town Centers (the analysis’ Arogyashala proposal), instead of the Bimaristan effect used here.",
  "N3: Champa and Siam (Sukhothai, Ayutthaya) as civs, Angkor’s main rivals.",
]
contested = [
  "The devarāja cult: a god-king or the kingdom’s protective deity (Cœdès versus Kulke and Jacques); the source, Sdok Kak Thom (1052), is 250 years later than 802.",
  "The ‘hydraulic city’: whether the barays served irrigation, flood control or symbolism (Groslier versus van Liere and Acker; the LiDAR surveys).",
  "The ‘fall’ of Angkor in 1431 versus a gradual decline and a move of the capital south for trade (Vickery).",
  "The origin of the double-bow engines: Chinese multiple-bow bed crossbows, perhaps through Champa, or Cham contingents serving Jayavarman VII. They appear in the reliefs of his temples (the Bayon, Banteay Chhmar), not in the army procession of Angkor Wat.",
  "The dates of Jayavarman II: traditional 802–850 (Cœdès) or c. 770–834 (Vickery, Jacques).",
  "Zhou Daguan (1296–97) writes in his section on the army that the soldiers went naked and barefoot with a lance in the right hand and a shield in the left and ‘have nothing in the way of bows and arrows, stone-throwers, armour or helmets’ (別無所謂弓箭、砲石、甲冑之屬). The design follows him on the stone-throwers, none of which has been identified in the reliefs either, and on armour. His bow clause concerns hand bows and arrows (弓箭): the double-bow engines of the reliefs are crossbows (弩), which his list neither confirms nor denies, and the Bayon reliefs also show hand crossbows (Khmer sna, the crossbow of the region’s Austroasiatic peoples), above all in hunting scenes and, on some readings, in the hands of a few fighters in battle; on that crossbow evidence the Arbalester stays (RULES 6.16.3), although the reliefs show the hand crossbow far more often in the hunt than in war. The Archer line is kept as a game abstraction of missile troops against his statement: bows abound in the epic battle reliefs of Angkor Wat, whose sculptors knew the weapon, and the reliefs (c. 1113–1218) are a century or more older than his visit, so a difference need not be a contradiction.",
  "The 121 vahnigṛha (‘houses with fire’) of the Preah Khan stela: rest houses on the royal roads (Cœdès’ ‘gîtes d’étape’, the majority reading) or chapels for a sacred fire carried along them; ‘dharmaśālā’ is the modern label for the rest-house reading.",
  "The label’s ‘Siege’ refers to the crossbow engines (the Scorpions and the Ballista Elephant, the game’s siege class), not to elaborate siege warfare, for which the evidence is thin; ‘Elephant’ comes first because it is the better-founded half (RULES 6.16.16).",
  "The Petard and the Demolition Raft and Ship stay as generic pieces of the game skeleton (held by 56 and 50 of the game’s 56 civs), read as sappers and fire-boats with incendiary charges rather than gunpowder (tech-tree audit), so the ‘no gunpowder’ tree is qualified, not contradicted.",
]
open_questions = []

[profile]
entity = "The Khmer Empire of Angkor (Kambujadeśa)"
region = "Mekong basin and the Tonle Sap, with provinces in present-day Thailand, Laos and southern Vietnam"
window = "802–1431 (traditional dates; antecedents in Chenla from c. 550)"
sources = [
  "Zhou Daguan, Zhenla fengtu ji (A Record of Cambodia, 1296–97; tr. Peter Harris, 2007)",
  "Song shi, chapter 489 (Champa, 1171)",
  "Inscriptions of Sdok Kak Thom (K.235, 1052), Ta Prohm (K.273, 1186) and Preah Khan (K.908, 1191); the hospital edict (e.g. Say Fong)",
  "Reliefs of Angkor Wat, the Bayon and Banteay Chhmar",
  "George Cœdès, Les États hindouisés d’Indochine et d’Indonésie (1964)",
  "Michel Jacq-Hergoualc’h, The Armies of Angkor (2007)",
  "Roland Fletcher, Damian Evans et al., Greater Angkor Project (LiDAR surveys; Evans et al., PNAS 110, 2013)",
  "W. J. van Liere, ‘Traditional water management in the lower Mekong Basin’, World Archaeology 11 (1980)",
  "Mitch Hendrickson, ‘Historic routes to Angkor: development of the Khmer road system (ninth to thirteenth centuries AD)’, Antiquity 84 (2010)",
  "Etsuo Uchida and Ichita Shimoda, on the Angkor sandstone quarries, Journal of Archaeological Science 40 (2013)",
  "Chris Baker and Pasuk Phongpaichit, A History of Ayutthaya (2017)",
  "Martin Stuart-Fox, The Lao Kingdom of Lān Xāng (1998)",
  "David Chandler, A History of Cambodia",
]

[[bonus]]
text = "Farms +10% food"
kind = "economic"
level = 1
change = "new"
replaces = "Farmers don’t require Mills or Town Centers to drop off food"
precedent = "Farms +10% food (Chinese team bonus)"
basis = "Angkor lived on rice. Zhou Daguan (1296–97) says rice could be harvested three or four times a year, which he puts down to a frostless climate, with planting that followed the receding flood of the Great Lake and floating rice in deep water. Separately, LiDAR surveys have mapped around the capital an engineered landscape of embankments, canals, bunded fields and reservoirs (barays; the West Baray, 11th century, is about 8 × 2.1 km) (Evans et al. 2013; Fletcher). The drop-off mechanic it replaces matched no identifiable trait. A farm-upgrade effect at a lower magnitude (Sicilians: ‘Farm upgrades provide +X% additional food’), which would also set the Khmer apart from the other designs with Farms +10%, was considered as a way to strengthen the civ and not adopted: the Khmer power budget is accepted without compensation (RULES 6.16.13)."
relevance = "Rice surpluses fed the labour and armies of Angkor; its monuments and its population rest on them."
contested = "How far the barays served irrigation rather than flood control or symbolism is debated; Zhou Daguan says nothing of irrigation from them, a silence van Liere (1980) used against the hydraulic thesis."

[[bonus]]
text = "Builders work +25% faster"
kind = "economic"
level = 1
change = "new"
replaces = "No buildings required to advance to the next Age or to unlock other buildings"
precedent = "Builders work +30% faster (Spanish)"
basis = "Angkor raised more than a thousand temples. Angkor Wat went up in about three decades under Suryavarman II (c. 1113–1150), and the Bayon, Preah Khan, Ta Prohm, Banteay Kdei and the walls of Angkor Thom belong largely to the single reign of Jayavarman VII (1181–c. 1218); their sandstone came from the quarries of Phnom Kulen along transport canals (Uchida and Shimoda 2013). Royal foundations commanded vast labour: the Ta Prohm stela (1186) binds nearly 80,000 people from 3,140 villages to that one temple, as dependants who supplied rice, goods and services rather than as builders. The age-up rule it replaces had no historical basis."
relevance = "Temple-building is Angkor’s defining achievement: Angkor Wat is the largest religious monument in the world."

[[bonus]]
text = "Battle Elephants move +10% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Battle Elephants move +10% faster (Khmer)"
basis = "The reliefs of Angkor Wat show Suryavarman II and his generals on elephants, and those of the Bayon war elephants in battle; the speed is a generic abstraction of skill with elephants. A stronger elephant passive was considered, since elephants were the royal arm of Angkor while the game gave its largest elephant buff (Chatras, +100 HP) to the Vietnamese, whose elephants were secondary. The design keeps the speed bonus: the Khmer are not strengthened (RULES 6.16.13), their elephant identity also rests on the Ballista Elephant and Double Crossbows, and the Vietnamese design now gives its Tượng Binh only the light Howdah effect."
relevance = "Kings and generals fought from war elephants, the royal arm of Angkor’s wars with Champa and Đại Việt."

[[bonus]]
text = "Spearman-line costs -25%"
kind = "military"
level = 1
change = "new"
replaces = "Villagers can garrison in Houses"
precedent = "Camel Riders, Skirmishers and Spearman-line cost -25% (Byzantines)"
basis = "The mass of Khmer armies was infantry with lance and shield and little or no body armour, as the reliefs of Angkor Wat and the Bayon show and Zhou Daguan describes (1296–97), adding that in the wars with Siam the common people were all driven to fight. The house-garrison bonus it replaces had no basis: Zhou Daguan describes common houses of wood and thatch with no defensive role."
relevance = "Levies of lance-and-shield infantry were the bulk of every Angkorian army."

[[bonus]]
text = "Can build Dharmashala in Imperial Age"
kind = "economic"
level = 1
change = "new"
precedent = "Can build Caravanserai in Imperial Age (Persians, Hindustanis)"
basis = "From the 9th to the 13th century the Khmer kings built a network of raised roads from Angkor to the provinces, to Phimai in the north-west, Wat Phu in the north-east and Preah Khan of Kompong Svay in the east, with laterite bridges such as Spean Praptos at Kampong Kdei (Hendrickson 2010). Its best-documented feature belongs to Jayavarman VII: the Preah Khan stela (K.908, 1191) lists 121 vahnigṛha, ‘houses with fire’, along the roads, usually read as rest houses (dharmaśālā is the modern label; the function is debated, see contested). A passive, because the road network is a structural trait built over four centuries (RULES 6.2), with the rest houses as its culmination. The Caravanserai, which heals and speeds Trade Carts, is the closest existing equivalent. Its rename keeps the modern label Dharmashala rather than the inscription’s vahnigṛha, because the label names the majority rest-house reading and is the scholarly term; it is flagged as a modern label (RULES 6.16.15; see contested)."
relevance = "The royal roads tied the provinces to Angkor for four centuries and carried its armies, its tribute and its pilgrims."

[team_bonus]
text = "Universities work +80% faster"
level = 1
change = "new"
replaces = "Scorpions +1 range"
precedent = "Universities work +80% faster (Malians team bonus); also the team bonus of the Chinese, Frankish, Persian and Polish designs and part of the Georgians’ Gelati Academy, a reuse that RULES 6.16.12 accepts for level 1"
basis = "Angkor schooled the Tai and Lao kingdoms that succeeded it. The script of Sukhothai derives from Old Khmer writing, and Khmer stayed a language of learning and of court vocabulary at Ayutthaya, whose royal rituals, Brahmin court priests and royal language came largely through Khmer Lopburi (Cœdès 1964; Baker and Phongpaichit 2017); the transfer to Ayutthaya came partly through conquest (the taking of Angkor, 1431). The Lao chronicles say that Fa Ngum, raised at the Angkor court, founded Lan Xang (1353) with a Khmer army, and add that Theravāda monks and the Phra Bang image were later sent from Angkor at the request of his Khmer queen; the image reached Luang Prabang only in the early 16th century (Stuart-Fox 1998). A team bonus because Khmer writing and learning passed to neighbours (RULES 6.2: transferred techniques, religious influence). The Scorpion range bonus it replaces was a generic abstraction with no benefit to allies; the Scorpions keep their place through Double Crossbows. Identical team-wide effects count once per team, and trade-gold team bonuses count as one at the highest value present (RULES 6.16.12)."
relevance = "Angkor’s script, court ritual and kingship shaped Sukhothai, Ayutthaya and Lan Xang."
contested = "The Fa Ngum story mixes history and legend, and the authenticity of the Ram Khamhaeng inscription (dated 1292), which credits that king with the Thai script, is debated."

[[unique_unit]]
name = "Ballista Elephant"
model = "Ballista Elephant"
building = "Castle"
level = 1
change = "kept"
basis = "The reliefs of the Bayon and Banteay Chhmar (Jayavarman VII, 1181–c. 1218) show heavy double-bow crossbows mounted on elephants and on wheeled carts; in some scenes the crews seem to wear the Cham headdress. Their frequency is unknown, and ‘can destroy trees’ is a game invention."
relevance = "Mounting the engine on the war elephant was the Khmer’s own combination: the elephant-borne engines are the signature war machine of the Bayon and Banteay Chhmar reliefs."
contested = "Their origin: Chinese multiple-bow bed crossbows (plausible, not documented) or Cham contingents serving Jayavarman VII."

[[unique_tech]]
name = "Arogyashala"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Monks passively heal multiple nearby units"
level = 1
change = "new"
replaces = "Tusk Swords (Battle Elephants +3 attack)"
precedent = "Bimaristan (Monks passively heal multiple nearby units) (Saracens): an existing unique tech, shared and renamed with an identical effect; the Arabs’ design keeps it as Bimaristan, at the Monastery"
basis = "By royal edict Jayavarman VII founded hospitals (ārogyaśālā) across the empire: the Ta Prohm stela (1186) counts 102 of them, supplied from the royal stores, and the hospital edict inscribed in their chapels, as at Say Fong near Vientiane, says that the king suffered from his subjects’ illnesses more than from his own. At the Town Center because the hospitals were a state foundation (RULES 6.2), each with a Buddhist chapel. Tusk Swords, which it replaces, has no support in the Angkorian reliefs: blades on tusks are attested mainly in India and later."
relevance = "Jayavarman VII’s hospitals are the most famous institution of his Buddhist kingship and reached the far provinces of the empire."
contested = "The hospitals had their own carers and physicians; tying them to Monks is an abstraction, as for the Arabs’ Bimaristan."

[[unique_tech]]
name = "Double Crossbows"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Ballista Elephants and Scorpions fire an additional projectile"
level = 1
change = "kept"
precedent = "Double Crossbow (Ballista Elephants and Scorpions fire an additional projectile) (Khmer)"
basis = "An adopted technique of Jayavarman VII’s reign (RULES 6.2). The double-bow engines appear in the reliefs of his temples, the Bayon and Banteay Chhmar, mounted on elephants and on wheeled carts and in some scenes worked by men in Cham headdress, and not in the army procession of Angkor Wat (c. 1113–50), the earlier depiction of the Khmer army on the march. They resemble the multiple-bow bed crossbows of Song China and were probably taken up in the Cham wars of 1177–1203 (see contested). The tech stands for the adoption of the engine, on carts (the Scorpions) as on elephants; the Ballista Elephant stands for the elephant platform that set the Khmer use apart. Unlike the Burmese Howdah, dropped as an old equipment feature of the elephant, this is a weapon whose adoption the reliefs date to one reign. The name matches the double bow; the effect misreads it (see below). With the Ballista Elephant and Arogyashala, three of the nine slots come from Jayavarman VII’s reign, the best-documented reign of Angkor and the one of its greatest war; giving the Castle a datable moment of another reign instead, such as the oath of allegiance that Suryavarman I’s officials swore in 1011, inscribed on a gopura of the Royal Palace (a new, level-2 tech), was considered and not adopted."
relevance = "The double-bow engine was the new weapon of Angkor’s greatest war, Jayavarman VII’s expulsion and conquest of the Cham (1177–1203), and the most distinctive Khmer weapon."
contested = "The second bow gave power to a single large bolt, which is what the reliefs show; the extra projectile misreads the weapon, though some Chinese bed crossbows did shoot sheaves of arrows."

[tree]
add = ["Caravanserai"]
remove = ["Cavalry Archer", "Heavy Cavalry Archer", "Parthian Tactics", "Knight", "Cavalier", "Hand Cannoneer", "Cannon Galleon", "Elite Cannon Galleon", "Trebuchet", "Mangonel", "Onager", "Siphons"]

[tree.basis]
"Caravanserai" = "Given by the Dharmashala bonus: the rest houses of the royal roads (Preah Khan stela, 1191)."
"Cavalry Archer" = "No evidence of Khmer mounted archers; cavalry was marginal (small horses and riders with lances in the reliefs). The only mention of mounted archery in the Khmer–Cham wars is on the Cham side: in 1171 a man from Fujian advised the Cham king to adopt it against the Khmer elephants, and Champa bought horses (Song shi, ch. 489)."
"Heavy Cavalry Archer" = "As for the Cavalry Archer."
"Parthian Tactics" = "As for the Cavalry Archer."
"Knight" = "The Knight line is the game’s heavy shock cavalry, while Khmer cavalry was light and marginal: small horses and riders with lances in the reliefs, and soldiers without armour in Zhou Daguan (see contested). The Light Cavalry and Hussar stand for these horsemen, and the shock role falls to the Battle Elephant, as in the Malay design. Keeping the Knight and Cavalier as a game abstraction against Zhou Daguan, to strengthen the civ, was considered and not adopted (RULES 6.16.13)."
"Cavalier" = "As for the Knight."
"Hand Cannoneer" = "There is no evidence of firearms at Angkor, or in the Siamese attacks on it, before 1431, although Ming-derived guns spread in Đại Việt and the northern mainland from c. 1390 (Sun Laichen 2003); Cambodian firearms belong to the post-Angkorian kingdom of Longvek (16th century), with adventurers such as Diogo Veloso and Blas Ruiz in the 1590s."
"Cannon Galleon" = "No gunpowder in the Angkorian period. The Khmer keep the fleet-of-ships tier (RULES 6.16.1): the reliefs of the Bayon and Banteay Chhmar show the naval battles against the Cham on the Tonle Sap (c. 1177–81) fought from long oared war galleys crowded with paddlers and spearmen, and Zhou Daguan (1296–97) describes large boats built of hardwood planks, split with axes and fastened with iron nails, beside small dugouts hollowed out with fire. The Galleon stays as the skeleton’s flagged abstraction (RULES 6.16.2), but no gun-armed warship is documented, so the Cannon Galleons go."
"Elite Cannon Galleon" = "As for the Cannon Galleon."
"Trebuchet" = "Zhou Daguan says the Khmer had no stone-throwers (paoshi), and none has been identified in the reliefs, which show the double-bow engines in detail (see contested); the counterweight trebuchet reached China only in 1273. The Siege Ram and the Battle Elephants keep the civ able to destroy buildings (RULES 6.11). With no Bombard Cannon either, the Khmer have no long-range siege weapon (no Trebuchet, Traction Trebuchet or Bombard Cannon) and rely on the Siege Ram as the RULES 6.11 substitute, as RULES 6.16.5 allows where no engine is attested; no traction engine is given because Zhou Daguan denies them."
"Mangonel" = "As for the Trebuchet: Zhou Daguan denies stone-throwers of any kind, so no traction engine replaces them; the Scorpions and the Ballista Elephant remain against massed troops."
"Onager" = "As for the Mangonel."
"Siphons" = "Named after the Byzantine fire siphon, a state secret never given to other nations (De Administrando Imperio 13); no ship-borne liquid-fire weapon is documented for this civ."

[[rename]]
from = "Caravanserai"
to = "Dharmashala"
level = 1
basis = "The rest houses that Jayavarman VII set along the royal roads. The Preah Khan stela calls them vahnigṛha (‘houses with fire’), and dharmaśālā is the modern scholarly label for the rest-house reading (see contested). Same building and effect; the function, a staged network that served travellers, has this historical equivalent (RULES 6.10)."

[architecture]
set = "Southeast Asian"
change = "kept"
basis = "The set evokes the stone temple towers of Angkor."
