civ = "Aztecs"
name = "Aztecs"
status = "reviewed"
label = "Infantry civilization"
summary = "The Mexica and the Triple Alliance (1325–1521): chinampas, temple-burning infantry and a Tlatelolco market team bonus replace the start gold, Monk bonus and Relic gold, tribute becomes the Calpixqueh tech, siege engines and crossbows give way to Slingers, and the galleys become war canoes."
ideas = [
  "N3: An acalli war-canoe line (cheap, fast, carries a war party, throws darts) replacing the Galley-line, Fire Ships and Hulks: thousands of canoes defended Lake Texcoco in 1521 and Cortés had to build thirteen brigantines to break them (Cortés, third letter). In N1 the Canoe and War Canoe renames give the Galley line the look of the Scenario Editor Canoe.",
  "N3: Capture instead of conversion and killing: infantry that defeats enemy soldiers takes captives, which promote the captor (the warrior ranks of the Codex Mendoza) and feed tribute; captured enemy cult images kept in the Coateocalli (Durán) instead of Relics.",
  "N3: Re-theme the Monastery as a teocalli with tlamacazqueh (priests), the god-bearers (teomamaqueh) who led the army, and Nahuatl tech names.",
  "N2: A tribute mechanic proper: Castles and Town Centers yielding a slow income of food, cloth and gold, with the Market tribute fee at 0% (the Calpixqueh tech is the N1 stand-in).",
  "N2: Quimichtin (‘mice’, Sahagún), the scouts and spies of Mexica armies, as a scout unit of their own, so that the Eagle line can stand for the eagle order alone (the Eagle Scout's misfit is flagged in the Jaguar Warrior basis).",
  "N2: Regional names for the Blacksmith armour lines (chimalli shields, tlahuiztli warrior suits) once Blacksmith granularity is decided (RULES section 10).",
  "N2: A bow line split from the Crossbowman (RULES section 10), so the Aztec archer (tlahuitolli bow) can improve without crossbows.",
  "N3: Assault mechanics (scaling ladders, firing the temple) as the American alternative to siege engines (RULES section 10).",
]
contested = [
  "The purpose of the xochiyaoyotl (flower wars): ritual capture of victims for sacrifice (Durán, Tezozómoc) or a strategy of attrition and encirclement of Tlaxcala (Hassig 1988; Isaac 1983).",
  "The origin of the flower wars: the story that they began during the famine of 1450–54, to feed the gods with captives, is Ixtlilxóchitl's (early 17th century), and Hicks (1979) doubts it. Durán instead credits the arrangement to Tlacaelel under Moctezuma I (1440–1469), who called the nearby enemy cities a market where the god could buy victims. Both accounts place the arrangement with Tlaxcala and its neighbours under Moctezuma I, which is all the design relies on; it follows neither origin story, and how far the wars were prearranged at all belongs to the debate on their purpose (see the note above).",
  "The civ's name: ‘Aztecs’ is an 18th–19th-century scholarly label (Clavijero, Humboldt, Prescott); the people called themselves Mexica or Tenochca, and the empire was the Triple Alliance with Texcoco and Tlacopan. Decision: the name stays under RULES 6.16.15 (a civ is renamed only where standard English scholarship does not use the game's name), since English scholarship uses ‘Aztec’ for the Mexica and the Triple Alliance (Hassig 1988, Aztec Warfare; Berdan, Smith et al. 1996, Aztec Imperial Strategies), and Smith (2012) uses ‘Aztecs’ more broadly for the Nahuatl-speaking peoples of Late Postclassic central Mexico. Townsend (2019) prefers ‘Mexica’ in her text. The renames decided in the level-1 review were limited to the English, Anglo-Saxons and Arabs; the profile names the Mexica and the Triple Alliance.",
  "The scale of human sacrifice: Durán's 80,400 victims at the 1487 rededication of the Templo Mayor against much lower modern estimates; the Huey Tzompantli excavations (INAH, since 2015) confirm large-scale sacrifice accumulated over decades. Harner's ‘protein’ hypothesis (1977) is rejected.",
  "Hegemonic or territorial empire, and the degree of provincial control (Berdan, Smith et al. 1996).",
  "The population of Tenochtitlan in 1519 (estimates c. 150,000–250,000) and of central Mexico.",
  "The date of Tenochtitlan's foundation (1325 or 1345) and the historicity of the migration from Aztlan.",
  "The story that Moctezuma took Cortés for Quetzalcoatl, probably a post-conquest construction (Townsend; Restall).",
]
open_questions = []

[profile]
entity = "The Mexica (Tenochca) of Tenochtitlan and the Triple Alliance (Excan Tlahtoloyan: Tenochtitlan, Texcoco and Tlacopan)"
region = "Basin of Mexico and central Mesoamerica"
window = "1325–1521 (from the traditional foundation of Tenochtitlan to its fall, a terminal event soon after 1500 as RULES 6.16.17 allows; core 1428–1500, the Triple Alliance from Itzcoatl's victory over Azcapotzalco to the reign of Ahuitzotl; nothing in the design originates after 1500, the generic skeleton items of RULES 6.16.2 aside)"
sources = [
  "Codex Mendoza (c. 1541); ed. Frances F. Berdan & Patricia Rieff Anawalt (1992)",
  "Bernardino de Sahagún, Florentine Codex (c. 1577)",
  "Diego Durán, Historia de las Indias de Nueva España (1581)",
  "Hernán Cortés, Cartas de relación (1519–1526)",
  "Bernal Díaz del Castillo, Historia verdadera de la conquista de la Nueva España",
  "Ross Hassig, Trade, Tribute, and Transportation (1985)",
  "Ross Hassig, Aztec Warfare: Imperial Expansion and Political Control (1988)",
  "Barry L. Isaac, ‘The Aztec Flowery War: a geopolitical explanation’, Journal of Anthropological Research 39 (1983)",
  "Fernando de Alva Ixtlilxóchitl, Historia de la nación chichimeca (early 17th century)",
  "Frederic Hicks, ‘“Flowery war” in Aztec history’, American Ethnologist 6 (1979)",
  "Frances F. Berdan, Michael E. Smith et al., Aztec Imperial Strategies (1996)",
  "Michael E. Smith, The Aztecs (3rd ed., 2012)",
  "R. A. Donkin, Agricultural Terracing in the Aboriginal New World (1979)",
  "Camilla Townsend, Fifth Sun: A New History of the Aztecs (2019)",
]

[[bonus]]
text = "Villagers carry +3"
kind = "economic"
level = 1
change = "kept"
precedent = "Villagers carry +3 (Aztecs)"
basis = "Mesoamerica had no draft animals and no wheeled transport, so goods moved on the backs of professional porters (tlamemeh) who carried about 23 kg over day stages of some 21–28 km; the supply of Tenochtitlan and the tribute depended on them and on canoes (Hassig 1985)."
relevance = "Without porters there was no tribute, no supply for Tenochtitlan and no campaigning: porterage carried the whole Mesoamerican economy."

[[bonus]]
text = "Military Units train +15% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Military Units train +15% faster (Aztecs)"
basis = "Every Mexica boy was schooled for war, commoners in the telpochcalli of their calpolli and nobles in the calmecac, and contingents were raised by calpolli and by city within days (Hassig 1988)."
relevance = "Universal schooling for war made every Mexica man a trained warrior and let the Triple Alliance raise armies within days, the basis of a century of conquest."

[[bonus]]
text = "Infantry +1/+2/+3 attack vs. buildings in Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "new"
replaces = "Monks gain +5 HP for each researched Monastery technology"
precedent = "Infantry +1/+2/+3 attack vs. buildings in Feudal/Castle/Imperial Age (Goths)"
basis = "Mesoamerican armies had no siege engines. Most wars were decided by defeating the defending army in the field, few towns were walled, and once resistance broke the attackers entered the town and burned its main temple, which marked the conquest: the Codex Mendoza's sign for a conquered altepetl is a burning temple with its roof toppled (a conventional glyph: the town was then folded into the tribute system, not destroyed) (Hassig 1988). This bonus is the substitute for the removed siege weapons (RULES 6.11 and section 10); the Maya and the Gaels' design use it too, while the Goths' design drops it (RULES 6.7). The Monk bonus it replaces linked priestly austerities to a purely mechanical HP progression (rated stretched). With it gone, no element rests on the priesthood, so the label drops the game's ‘Monk’ and becomes ‘Infantry civilization’ (RULES 6.16.16); the priesthood is left to the N3 re-theme of the Monastery (ideas)."
relevance = "Defeating the field army, then entering the town and firing its main temple, was how the Triple Alliance conquered, and it is the civ's main means of breaking buildings without engines."

[[bonus]]
text = "Farms +10% food"
kind = "economic"
level = 1
change = "new"
replaces = "Start with +50 gold"
precedent = "Farms +10% food (Chinese team bonus)"
basis = "Chinampas, raised beds of lake mud between canals, gave several harvests a year and fed Tenochtitlan; under the Triple Alliance the freshwater southern lakes of Xochimilco and Chalco were turned into vast chinampa districts, and the dike of Nezahualcoyotl (1449) kept the salt water of Lake Texcoco away from the lagoon around Tenochtitlan (Smith 2012). The +50 starting gold it replaces had only a loose link to gold tribute (rated stretched); tribute is now the Calpixqueh tech. The generic Horse Collar keeps the name Chinampas (agreed rename)."
relevance = "The chinampas were the food base of a lake city of some 150,000–250,000 people, one of the largest of its time."

[team_bonus]
text = "Markets work +80% faster"
level = 1
change = "new"
replaces = "Relics generate +33% gold"
precedent = "Markets work +80% faster (Bohemians team bonus)"
basis = "Tlatelolco, the market of Tenochtitlan's twin city, astonished the Spaniards: Cortés (second letter, 1520) reckoned that more than sixty thousand people traded there daily, under judges who settled disputes and checked measures. The market and the pochteca drew goods and traders from all Mesoamerica, and the pochteca traded at ports of trade outside the empire such as Xicalanco, and at Xoconochco (Soconusco) before its conquest under Ahuitzotl (1486–1502), after which it paid tribute (Sahagún, Florentine Codex, book 9; Codex Mendoza; Berdan, Smith et al. 1996). RULES 6.2: trade that benefited neighbours. The game's Relics follow the Christian cult of relics, and the Mexica sacred bundles (tlaquimilolli) produced no wealth (rated unfounded). The game's Bohemians hold the same team bonus; the Bohemians' design gives it up for the Czech mercenaries (repetition would be allowed in any case, RULES 6.7)."
relevance = "Tlatelolco was the greatest market of the Americas and the hub of the exchange that tied the Triple Alliance to the rest of Mesoamerica."

[[unique_unit]]
name = "Jaguar Warrior"
model = "Jaguar Warrior"
building = "Castle"
level = 1
change = "kept"
basis = "The ocelomeh were, with the eagle warriors (cuauhmeh), one of the two great military orders, ranked below only the otontin and the cuachicqueh; entry depended above all on taking captives, and many members were nobles. The Codex Mendoza shows warriors rising in rank and insignia with each captive. The extra damage after defeating enemies evokes this promotion, although merit came from capturing, not killing (Hassig 1988). The regional Eagle Warrior line also stays in the Aztec tree. Decision: the generic unit lines keep their game names (no Macuahuitl Warrior or Tequihua for the Two-Handed Swordsman and Champion), since neither is a period term for the same function, the first being a modern coinage and the second a rank (RULES 6.16.15). The regional Eagle line is shared with the Maya, and its upper tiers stand for the eagle order; renaming its scout tier alone, for instance after the quimichtin (Sahagún's ‘mice’, the scouts and spies of Mexica armies), would split the line. So the misfit of the Eagle Scout, which turns a noble order into a cheap scout (rated stretched), is flagged for the site, and quimichtin scouts are an N2 idea."
relevance = "The jaguar and eagle orders, below only the otontin and cuachicqueh, were the elite of a warrior hierarchy built on taking captives, and they are the emblem of Aztec warfare."

[[unique_tech]]
name = "Atlatl"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Skirmishers +1 attack, +1 range"
level = 1
change = "kept"
precedent = "Atlatl (Aztecs)"
basis = "The spear-thrower (ahtlatl) with its darts (tlacochtli) was a feared weapon, used mostly by elite warriors as the armies closed, after the bow and sling volleys (Hassig 1988). It was pan-Mesoamerican and far older than the Mexica (already at Teotihuacan), which is why the Maya keep their own atlatl tech (Hul'che Javelineers) with a different effect (intended overlap, RULES 6.7). As a long weapon tradition it is not a datable moment (RULES 6.2, 6.3): it is a kept existing tech, held as a tech rather than a passive by the effect-size tie-break (RULES 6.2.4), since a strong effect suits the brake of cost and delay. Decision: it stays as a flagged fallback (RULES 6.16.19 b), for its fame and as the game's own Aztec tech. The datable alternatives, Itzcoatl's grants of conquered land to the nobles and warriors who fought Azcapotzalco (1428) and Moctezuma I's laws tying noble privilege and dress to deeds in war (Durán), would be new level-2 techs and are not used."
relevance = "The atlatl was the missile weapon of the Mexica elite, and its Nahuatl name is the word the world uses for the spear-thrower: fame tips a weapon tradition that could otherwise be a detail."
contested = "Conquistador claims that atlatl darts pierced armour are anecdotal."

[[unique_tech]]
name = "Flower Wars"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Infantry +4 attack"
level = 1
change = "changed"
replaces = "Garland Wars"
precedent = "Garland Wars (Aztecs): identical effect, renamed"
basis = "Renamed to the standard English rendering of xochiyaoyotl (‘flower war’). The Triple Alliance fought recurrent wars against Tlaxcala, Huexotzinco and Cholula, which the sources present as prearranged, in which picked warriors displayed their skill and took captives. Durán credits the arrangement to Tlacaelel under Moctezuma I (1440–1469); the story that the wars began during the famine of 1450–54 is Ixtlilxóchitl's, and Hicks (1979) doubts it (see contested). Both accounts place the arrangement under Moctezuma I, after the ancient atlatl in the civ's own chronology (RULES 6.4). The attack bonus stands for the battle experience of these veterans (Durán; Hassig 1988)."
relevance = "The flower wars shaped the empire's last six decades and, in one reading, left Tlaxcala unconquered to become Cortés's decisive ally."
contested = "Ritual capture for sacrifice (Durán, Tezozómoc) or a strategy of attrition (Hassig 1988; Isaac 1983), and with it how far the wars were prearranged; the famine origin is Ixtlilxóchitl's, doubted by Hicks (1979), while Durán credits Tlacaelel."

[[unique_tech]]
name = "Calpixqueh"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Farmers slowly generate gold in addition to food"
level = 1
change = "new"
precedent = "Burgundian Vineyards (Burgundians): identical effect, shared, moved to the Town Center and renamed"
basis = "After the Triple Alliance of 1428 the conquered provinces paid tribute on a fixed schedule: staple foods from the nearer provinces; cotton mantles, cacao, feathers, warrior suits and gold from the distant ones, recorded province by province in the Codex Mendoza and collected by the stewards (calpixqueh) installed in each province (Berdan & Anawalt 1992; Berdan, Smith et al. 1996). Farm output turning into gold renders tribute in kind becoming the wealth of the state. Tribute is a datable institution, so it is the Town Center tech rather than a passive bonus (RULES 6.2). The effect is Burgundian Vineyards, kept by the Burgundians and shared in the Persians', Berbers', Tatars' and Rus' designs, and the Bengalis' design has it as a passive: seven civs in all (RULES 6.7; reuse is accepted in N1, RULES 6.16.12)."
relevance = "Tribute was the purpose and the engine of the Triple Alliance's expansion: the empire was above all a tribute empire."
contested = "How far the empire controlled its provinces, and how regular collection was outside the core (Berdan, Smith et al. 1996)."

[tree]
add = ["Slinger", "Guilds", "Masonry", "Architecture"]
remove = [
  "Siege Workshop", "Battering Ram", "Capped Ram", "Siege Ram", "Mangonel", "Onager", "Siege Onager",
  "Scorpion", "Siege Tower", "Trebuchet", "Siege Engineers",
  "Crossbowman", "Arbalester",
  "Carrack", "Catapult Galleon",
  "Block Printing",
]

[tree.basis]
"Slinger" = "Slingers fought beside archers as standard Aztec missile troops (Hassig 1988), and Bernal Díaz repeatedly describes showers of sling stones. The regional Slinger, which the Inca, Muisca and Mapuche keep and the Maya also receive, takes over part of the role of the removed crossbows."
"Guilds" = "The pochteca were professional long-distance merchants organised in hereditary, self-governing corporations with their own courts, who also served the state as spies (Sahagún, Florentine Codex, book 9). The current game gives Guilds to the Incas but not to the Aztecs; here it is added and renamed Pochteca (agreed rename)."
"Masonry" = "The Mexica and their allies built in stone and lime: the Templo Mayor, the causeways across the lake, the Chapultepec aqueduct and Nezahualcoyotl's dike (1449). The civ already had Fortified Wall without Masonry or Architecture, which was incoherent."
"Architecture" = "Same basis as Masonry: monumental and hydraulic engineering on the scale of the Templo Mayor and the dike of Nezahualcoyotl. Decision: the Keep, which the Aztecs lack in the game, is not added, since the region gives it only where defensive stone towers are documented (the Inca); the temple-pyramid as a town's last stronghold (the burning-temple glyph of the Codex Mendoza; Cortés's ‘torres’ at Cholula) is a reading the design declines, and the Guard Tower and Fortified Wall stay as abstractions."
"Siege Workshop" = "No Mesoamerican people built siege engines: towns fell to assault, fire and blockade. Removing the workshop removes all its units; infantry with the anti-building bonus, Arson, Sappers and Petards replace them (owner's decision, RULES 6.16.5; RULES 6.11 and section 10). Every Castle must then be taken by units standing in its arrow fire, so castle-breaking is slow; this is accepted until an N2/N3 assault unit exists (ideas), with no compensating bonus (RULES 6.16.13). The Petard, a 16th-century gunpowder charge, stays unrenamed as a flagged generic abstraction of assault parties with fire, outside the one-late-element limit (RULES 6.16.2)."
"Battering Ram" = "Removed with the Siege Workshop: there were no rams and no wheeled vehicles in pre-Hispanic Mesoamerica."
"Capped Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Siege Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Mangonel" = "Removed with the Siege Workshop: no torsion or traction artillery existed in the Americas."
"Onager" = "Removed with the Siege Workshop (see Mangonel)."
"Siege Onager" = "Removed with the Siege Workshop (see Mangonel)."
"Scorpion" = "Removed with the Siege Workshop: no bolt-throwers existed in the Americas."
"Siege Tower" = "Removed with the Siege Workshop: a wheeled assault tower; Mesoamerican assaults used no such engines."
"Trebuchet" = "Counterweight artillery never existed in the Americas; the only trebuchet seen at Tenochtitlan was built by the Spaniards in 1521 and failed at its first shot (Bernal Díaz; Cortés, third letter)."
"Siege Engineers" = "No siege engines are left to improve."
"Crossbowman" = "The crossbow was unknown in the pre-Hispanic Americas, which have neither crossbow tier (RULES 6.16.3); Aztec missile troops were archers, slingers and atlatl dart-throwers (Hassig 1988). Archers, Slingers and Skirmishers with Atlatl cover the role. In the current game the Bulgarians also lack crossbows (so do the current Spanish; the Castilian and Bulgarian designs restore the Crossbowman)."
"Arbalester" = "Removed with the Crossbowman (see there)."
"Carrack" = "High-castled sailing warships were unknown; the Mexica navy was thousands of dugout canoes (acalli) on Lake Texcoco (Cortés, third letter). The Aztecs already lack the Galleon. Boat tier (RULES 6.16.1), resting on the acalli: the high-seas sailing ships (Galleon, Carrack) are removed and the siege ship goes with the siege engines, while the Galley (renamed Canoe), Fire Ship, Demolition and Hulk lines stay with their tiers as a generic abstraction of canoe fleets for water maps; the demolition ships are generic post-1500 items kept as flagged abstractions (RULES 6.16.2)."
"Catapult Galleon" = "A sailing ship carrying a catapult: both a European ship type and a siege engine."
"Block Printing" = "There was no printing: Mexica books (amoxtli) were painted by hand. With no equivalent for the function the tech is removed (18 of the game's 56 civs already lack it)."

[[rename]]
from = "Horse Collar"
to = "Chinampas"
level = 1
basis = "Agreed rename. Chinampas, raised beds of lake mud between canals, fed Tenochtitlan; the freshwater southern lakes of Xochimilco and Chalco were turned into vast chinampa districts under the Triple Alliance in the 15th century (Smith 2012). The farm bonus renders their scale; this rename gives the generic farm upgrade its local name."

[[rename]]
from = "Heavy Plow"
to = "Terraces"
level = 1
basis = "There was no plough (farmers used the digging stick, huictli). Hillside terraces (metepantli), often edged with maguey, intensified farming around the Basin, notably in the Texcoco piedmont (Donkin 1979). Same effect; the same rename is used for the Maya."

[[rename]]
from = "Crop Rotation"
to = "Milpa"
level = 1
basis = "Agreed rename. The milpa, intercropping maize, beans and squash, kept fields productive: the Mesoamerican equivalent of rotation. The word is Nahuatl (mīlli, ‘field’, with -pan, ‘on’); the same rename is used for the Maya as the standard term. The tier order is a game convention: historically the milpa came first, and chinampas and terraces intensified it later."

[[rename]]
from = "Guilds"
to = "Pochteca"
level = 1
basis = "Agreed rename: the guild-like corporations of the pochteca, the professional merchants of Tenochtitlan, Tlatelolco and other cities (Sahagún, Florentine Codex, book 9)."

[[rename]]
from = "Gambesons"
to = "Ichcahuipilli"
level = 1
basis = "Same effect as Gambesons (Militia-line +1 pierce armor): the ichcahuipilli was a quilted cotton jacket, the standard body armour of Mesoamerican warriors, which the Spaniards adopted as the escaupil. The Maya get the same tech under an English name."

[[rename]]
from = "Iron Casting"
to = "Obsidian Blades"
level = 1
basis = "There was no iron. Prismatic obsidian blades struck from prepared cores, much of it the green obsidian of the Sierra de las Navajas near Pachuca, edged the macuahuitl and tipped darts and spears (Hassig 1988; Smith 2012). Same effect as Iron Casting. The Maya counterpart is Flint Points and the Inca one Tin Bronze. The other Blacksmith tiers keep their generic names as a flagged generic equipment level (RULES 6.16.6): Forging and Blast Furnace, although there was no iron metallurgy (metals, copper, gold and silver, were mostly ornamental); Bodkin Arrow, although arrowheads were of obsidian and flint, not forged iron; and Scale Mail, Chain Mail and Plate Mail Armor, although there was no metal armour. The quilted cotton ichcahuipilli already renames Gambesons and cannot stand for three tiers more. The feathered warrior suits (tlahuiztli) that veterans wore over it are documented above all as insignia granted by the number of captives taken (Codex Mendoza, fols. 64r–67r); how much protection they added beyond the cotton armour is uncertain, so they do not pass the same-function test for an armour tier (RULES 6.16.15), and regional armour names stay an N2 idea. Chemistry stays for its +1 ranged attack as a flagged abstraction, although the Mexica had no gunpowder. The Aztecs lack Ring Archer Armor in the game, and the design leaves it so."

[[rename]]
from = "Wheelbarrow"
to = "Tumplines"
level = 1
basis = "There were no wheeled vehicles: loads were carried with the tumpline (mecapalli), a strap passing over the forehead, the basic tool of Mesoamerican porters (Hassig 1985). Same rename for the Maya."

[[rename]]
from = "Hand Cart"
to = "Carrying Frames"
level = 1
basis = "Porters used a wooden carrying frame (cacaxtli) slung from the tumpline, shown in the Codex Mendoza (Hassig 1985). Parallel to the agreed Hand Cart → Llama Caravans for the Incas; same rename for the Maya. The Trade Cart keeps its generic name and look as a flagged abstraction of the pochteca's porter trains (RULES 6.16.6), since there were no wheeled vehicles."

[[rename]]
from = "Coinage"
to = "Cacao Currency"
level = 1
basis = "There were no coins: cacao beans served as small change and standard cotton mantles (quachtli) as larger units of value in markets and tribute (Berdan, Smith et al. 1996). Same rename for the Maya, where Landa also records cacao as money. Banking (tributes to other players are free) keeps its generic name as a flagged abstraction (RULES 6.16.6), since no Mesoamerican equivalent with a period term was found."

[[rename]]
from = "Treadmill Crane"
to = "Coatequitl"
level = 1
basis = "There were no cranes or treadwheels: temples, causeways and dikes were raised by the coatequitl, the rotational labour draft for public works that each calpolli owed to its city and ruler (Hassig 1985; Smith 2012). Same effect as Treadmill Crane (Villagers construct buildings +20% faster): organised labour is the Mexica equivalent of faster building, as the tumpline is of the Wheelbarrow. A rename beyond the agreed list, applied under RULES 6.16.6. The Inca design renames it Mit'a, after the Andean rotating labour service; the Maya keep Treadmill Crane under its generic name as a flagged abstraction, since the term is Nahuatl (see the Maya design)."

[[rename]]
from = "Galley"
to = "Canoe"
model = "Canoe"
level = 1
basis = "The Mexica fought on the lake in dugout canoes (acalli): thousands of them defended Tenochtitlan in 1521, and Cortés had thirteen brigantines built to break them (Cortés, third letter; Bernal Díaz). The Scenario Editor Canoe, a small warship introduced in The Forgotten (RULES section 5), gives the Galley the look of a dugout war canoe; the Galley keeps its stats, and the Canoe's look, scale, attack and role must be checked in game. Same rename for the Maya, Mapuche and Tupi, and outside the Americas in the Malians' and Avars' designs; the acalli war-canoe line proper is an N3 idea."

[[rename]]
from = "War Galley"
to = "War Canoe"
model = "Canoe"
level = 1
basis = "Upgrade tier of the renamed Galley, with the same Canoe look (see Galley)."

[architecture]
set = "Central American"
level = 1
change = "kept"
basis = "The Mesoamerican stepped temples and plastered stone buildings of the existing set fit the Mexica."
