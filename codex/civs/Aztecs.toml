civ = "Aztecs"
name = "Aztecs"
status = "draft"
label = "Infantry civilization"
summary = "The Mexica and the Triple Alliance (1325–1521): porters, fast-training infantry, the Jaguar Warrior, the atlatl and the flower wars stay; imperial tribute becomes the Town Center tech (Calpixqueh), chinampa farming and temple-burning infantry replace the start gold and the Monk bonus, the Tlatelolco market replaces Relic gold, and siege engines, crossbows, the Imperial iron tiers, Heated Shot, printing and European ships give way to Slingers, Masonry, Architecture, the Keep and local names (Chinampas, Milpa, Pochteca, Ichcahuipilli, Obsidian Blades)."
ideas = [
  "N3: An acalli war-canoe line (cheap, fast, carries a war party, throws darts) replacing the Galley-line, Fire Ships and Hulks: thousands of canoes defended Lake Texcoco in 1521 and Cortés had to build thirteen brigantines to break them (Cortés, third letter).",
  "N3: Capture instead of conversion and killing: infantry that defeats enemy soldiers takes captives, which promote the captor (the warrior ranks of the Codex Mendoza) and feed tribute; captured enemy cult images kept in the Coateocalli (Durán) instead of Relics.",
  "N3: Re-theme the Monastery as a teocalli with tlamacazqueh (priests), the god-bearers (teomamaqueh) who led the army, and Nahuatl tech names.",
  "N2: A tribute mechanic proper: Castles and Town Centers yielding a slow income of food, cloth and gold, with the Market tribute fee at 0% (the Calpixqueh tech is the N1 stand-in).",
  "N2: Regional names for the Blacksmith armour lines (chimalli shields, tlahuiztli warrior suits) once Blacksmith granularity is decided (RULES section 10).",
  "N2: A bow line split from the Crossbowman (RULES section 10), so the Aztec archer (tlahuitolli bow) can improve without crossbows.",
  "N3: Assault mechanics (scaling ladders, firing the temple) as the American alternative to siege engines (RULES section 10).",
]
contested = [
  "The purpose of the xochiyaoyotl (flower wars): ritual capture of victims for sacrifice (Durán, Tezozómoc) or a strategy of attrition and encirclement of Tlaxcala (Hassig 1988; Isaac 1983).",
  "The scale of human sacrifice: Durán's 80,400 victims at the 1487 rededication of the Templo Mayor against much lower modern estimates; the Huey Tzompantli excavations (INAH, since 2015) confirm large-scale sacrifice accumulated over decades. Harner's ‘protein’ hypothesis (1977) is rejected.",
  "Hegemonic or territorial empire, and the degree of provincial control (Berdan, Smith et al. 1996).",
  "The population of Tenochtitlan in 1519 (estimates c. 150,000–250,000) and of central Mexico.",
  "The date of Tenochtitlan's foundation (1325 or 1345) and the historicity of the migration from Aztlan.",
  "The story that Moctezuma took Cortés for Quetzalcoatl, probably a post-conquest construction (Townsend; Restall).",
]
open_questions = [
  "Rename the civ ‘Mexica’ or ‘Aztecs (Mexica)’? ‘Aztecs’ is an 18th–19th-century scholarly label (Clavijero, Humboldt, Prescott); the people called themselves Mexica or Tenochca, and the empire was the Triple Alliance with Texcoco and Tlacopan.",
  "Label: the game's ‘Infantry and Monk’ becomes ‘Infantry’, because the Monk HP bonus (rated stretched) is replaced and no element now rests on the priesthood. Accept, or keep ‘Monk’ for the weight of the priesthood (an N3 re-theme of the Monastery is in the ideas)?",
  "Two team bonuses: the Aztecs have two traits that benefited allies, the Tlatelolco market and its traders (the team bonus) and the Triple Alliance itself, whose three cities shared conquests and tribute (two fifths each to Tenochtitlan and Texcoco, one fifth to Tlacopan, as usually reported). If some civs may have two team bonuses (RULES 6.1, proposal), the Aztecs are a candidate, for example ‘Barracks work +20% faster’ (Goths team bonus) for the joint levies.",
  "Regional names for unit lines (region-wide): for example Macuahuitl Warrior and Tequihua for the Two-Handed Swordsman and Champion, and scouts (the quimichtin, ‘mice’, of Sahagún) instead of the Eagle Scout, which turns the elite eagle order into a cheap Dark Age scout. Wanted?",
  "Region-wide, siege: the Siege Workshop with all its units, the Trebuchet and Siege Engineers are removed from all six American civs (owner's decision, brief section 6), the first civs in the game without them. Buildings fall to anti-building infantry, Arson, Sappers where present and Petards, but every Castle must be taken by units standing in its arrow fire, so castle-breaking will be slow. The Petard is itself a 16th-century gunpowder charge (Cahors, 1580), a post-1500 element held by all 56 civs (RULES section 2); it is kept unrenamed as the abstraction of assault parties with fire, so as not to hide the anachronism (RULES 6.10). Accept the risk until an N2/N3 assault unit exists?",
  "Region-wide, iron: only the Imperial-Age iron tiers (Blast Furnace, Plate Mail Armor, Ring Archer Armor) are removed, a playability line rather than a historical one (the Lithuanians already lack Blast Furnace and Plate Mail Armor). Forging, Scale Mail Armor and Chain Mail Armor stay as a generic equipment level, and Iron Casting is renamed only where a real equivalent exists (Obsidian Blades for the Aztecs, Flint Points for the Maya, Tin Bronze for the Inca); the Muisca, Mapuche and Tupi, who had no metal weapons, keep it as a flagged abstraction. Chemistry also stays for its +1 ranged attack, although none of these peoples had gunpowder. Remove or rename the remaining tiers too, at a cost to playability?",
  "Region-wide, crossbows: the Crossbowman and Arbalester are removed from all six American civs, since the crossbow was unknown there (in the current game the Bulgarians also lack them). The two archer civs get their foot-archer unique unit at the Archery Range in the Imperial Age instead (Plumed Archer for the Maya, Blackwood Archers for the Tupi), after the Italians' ‘Condottiero available at the Barracks in Imperial Age’. Accept, or prefer Castle Age availability (stronger), a level-2 Archery Range tech, or the crossbow tiers as a flagged abstraction until the N2 bow line (the ‘regional archer rule’ proposed for the Persians, Malians, Ethiopians and Turks)?",
  "Mesoamerica: the Keep is added for the Aztecs and kept for the Maya as an abstraction of fortified strongpoints (the frontier garrison of Oztuma facing the Purépecha; temple platforms held as citadels in 1520–21), although neither people built stone towers. Accept, or remove it from both?",
  "Renames beyond the agreed list (Chinampas, Milpa, Pochteca): Heavy Plow → Terraces, Wheelbarrow → Tumplines, Hand Cart → Carrying Frames, Coinage → Cacao Currency, Gambesons → Ichcahuipilli and Iron Casting → Obsidian Blades follow the same policy (identical effect, real equivalent). Approve them? Trade Cart, Treadmill Crane and Banking keep their generic names although there were no carts, treadwheels or banks; rename them (for example porters, tlamemeh, for the Trade Cart, and the coatequitl labour draft for the Treadmill Crane) or keep them as accepted abstractions?",
]

[profile]
entity = "The Mexica (Tenochca) of Tenochtitlan and the Triple Alliance (Excan Tlahtoloyan: Tenochtitlan, Texcoco and Tlacopan)"
region = "Basin of Mexico and central Mesoamerica"
window = "1325–1521 (from the traditional foundation of Tenochtitlan to its fall; the Triple Alliance from 1428)"
sources = [
  "Codex Mendoza (c. 1541); ed. Frances F. Berdan & Patricia Rieff Anawalt (1992)",
  "Bernardino de Sahagún, Florentine Codex (c. 1577)",
  "Diego Durán, Historia de las Indias de Nueva España (1581)",
  "Hernán Cortés, Cartas de relación (1519–1526)",
  "Bernal Díaz del Castillo, Historia verdadera de la conquista de la Nueva España",
  "Ross Hassig, Trade, Tribute, and Transportation (1985)",
  "Ross Hassig, Aztec Warfare: Imperial Expansion and Political Control (1988)",
  "Barry L. Isaac, ‘The Aztec Flowery War: a geopolitical explanation’, Journal of Anthropological Research 39 (1983)",
  "Frances F. Berdan, Michael E. Smith et al., Aztec Imperial Strategies (1996)",
  "Michael E. Smith, The Aztecs (3rd ed., 2012)",
  "R. A. Donkin, Agricultural Terracing in the Aboriginal New World (1979)",
  "Camilla Townsend, Fifth Sun: A New History of the Aztecs (2019)",
]

[[bonus]]
text = "Villagers carry +3"
kind = "economic"
level = 1
change = "kept"
precedent = "Villagers carry +3 (Aztecs)"
basis = "Mesoamerica had no draft animals and no wheeled transport, so goods moved on the backs of professional porters (tlamemeh) who carried about 23 kg over day stages of some 21–28 km; the supply of Tenochtitlan and the tribute depended on them and on canoes (Hassig 1985)."
relevance = "Without porters there was no tribute, no supply for Tenochtitlan and no campaigning: porterage carried the whole Mesoamerican economy."

[[bonus]]
text = "Military Units train +15% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Military Units train +15% faster (Aztecs)"
basis = "Every Mexica boy was schooled for war, commoners in the telpochcalli of their calpolli and nobles in the calmecac, and contingents were raised by calpolli and by city within days (Hassig 1988)."
relevance = "Universal schooling for war made every Mexica man a trained warrior and let the Triple Alliance raise armies within days, the basis of a century of conquest."

[[bonus]]
text = "Infantry +1/+2/+3 attack vs. buildings in Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "new"
replaces = "Monks gain +5 HP for each researched Monastery technology"
precedent = "Infantry +1/+2/+3 attack vs. buildings in Feudal/Castle/Imperial Age (Goths)"
basis = "Mesoamerican armies had no siege engines: towns were taken by assault, fire and blockade, and the burning of the main temple marked the conquest, which is why the Codex Mendoza's sign for a conquered altepetl is a burning temple with its roof toppled (a conventional glyph: the town was then folded into the tribute system, not destroyed). This bonus is the substitute for the removed siege weapons (RULES 6.11 and section 10). The Monk bonus it replaces linked priestly austerities to a purely mechanical HP progression (rated stretched)."
relevance = "Storming towns and firing their temples was how the Triple Alliance conquered, and it is the civ's main means of breaking buildings without engines."

[[bonus]]
text = "Farms +10% food"
kind = "economic"
level = 1
change = "new"
replaces = "Start with +50 gold"
precedent = "Farms +10% food (Chinese team bonus)"
basis = "Chinampas, raised beds of lake mud between canals, gave several harvests a year and fed Tenochtitlan; under the Triple Alliance the freshwater southern lakes of Xochimilco and Chalco were turned into vast chinampa districts, and the dike of Nezahualcoyotl (1449) kept the salt water of Lake Texcoco away from the lagoon around Tenochtitlan (Smith 2012). The +50 starting gold it replaces had only a loose link to gold tribute (rated stretched); tribute is now the Calpixqueh tech. The generic Horse Collar keeps the name Chinampas (agreed rename)."
relevance = "The chinampas were the food base of a lake city of some 150,000–250,000 people, one of the largest of its time."

[team_bonus]
text = "Markets work +80% faster"
level = 1
change = "new"
replaces = "Relics generate +33% gold"
precedent = "Markets work +80% faster (Bohemians team bonus)"
basis = "Tlatelolco, the market of Tenochtitlan's twin city, astonished the Spaniards: Cortés (second letter, 1520) reckoned that more than sixty thousand people traded there daily, under judges who settled disputes and checked measures. The market and the pochteca drew goods and traders from all Mesoamerica, the pochteca dealt at independent ports of trade such as Xicalanco and Xoconochco (Soconusco), and Texcoco and Tlacopan shared in the market and tribute system of the Basin (Berdan, Smith et al. 1996). RULES 6.2: trade that benefited neighbours and allies. Relics are a Christian concept, and the Mexica sacred bundles (tlaquimilolli) produced no wealth (rated unfounded). The Bohemians have the same team bonus (repetition allowed, RULES 6.7)."
relevance = "Tlatelolco was the greatest market of the Americas and the hub of the exchange that tied the Triple Alliance to the rest of Mesoamerica."

[[unique_unit]]
name = "Jaguar Warrior"
model = "Jaguar Warrior"
building = "Castle"
level = 1
change = "kept"
basis = "The ocelomeh were, with the eagle warriors (cuauhmeh), one of the two elite military orders; entry depended above all on taking captives, and the Codex Mendoza shows warriors rising in rank and insignia with each captive. The extra damage after defeating enemies evokes this promotion, although merit came from capturing, not killing (Hassig 1988). The regional Eagle Warrior line also stays in the Aztec tree."
relevance = "The jaguar and eagle orders crowned the Mexica warrior hierarchy built on taking captives, and they are the emblem of Aztec warfare."

[[unique_tech]]
name = "Atlatl"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Skirmishers +1 attack, +1 range"
level = 1
change = "kept"
precedent = "Atlatl (Aztecs)"
basis = "The spear-thrower (ahtlatl) with its darts (tlacochtli) was a feared weapon, used mostly by elite warriors as the armies closed, after the bow and sling volleys (Hassig 1988). It was pan-Mesoamerican and far older than the Mexica (already at Teotihuacan), which is why the Maya keep their own atlatl tech (Hul'che Javelineers) with a different effect (intended overlap, RULES 6.7)."
relevance = "The atlatl was the missile weapon of the Mexica elite, and its Nahuatl name is the word the world uses for the spear-thrower: fame tips a weapon that could otherwise be a detail."
contested = "Conquistador claims that atlatl darts pierced armour are anecdotal."

[[unique_tech]]
name = "Flower Wars"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Infantry +4 attack"
level = 1
change = "changed"
replaces = "Garland Wars"
precedent = "Garland Wars (Aztecs): identical effect, renamed"
basis = "Renamed to the standard English rendering of xochiyaoyotl (‘flower war’). The Triple Alliance fought recurrent, prearranged wars against Tlaxcala, Huexotzinco and Cholula in which picked warriors displayed their skill and took captives; Durán places their start after the famine of 1450–54, so they come after the ancient atlatl in the civ's own chronology (RULES 6.4). The attack bonus stands for the battle experience of these veterans (Durán; Hassig 1988); with Blast Furnace removed it also keeps late Aztec infantry viable."
relevance = "The flower wars shaped the empire's last century and left the unconquered Tlaxcalans to become Cortés's decisive allies."
contested = "Ritual capture for sacrifice (Durán, Tezozómoc) or a strategy of attrition (Hassig 1988; Isaac 1983)."

[[unique_tech]]
name = "Calpixqueh"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Farmers slowly generate gold in addition to food"
level = 1
change = "new"
precedent = "Burgundian Vineyards (Burgundians): identical effect, shared, moved to the Town Center and renamed"
basis = "After the Triple Alliance of 1428 the conquered provinces paid tribute on a fixed schedule: staple foods from the nearer provinces; cotton mantles, cacao, feathers, warrior suits and gold from the distant ones, recorded province by province in the Codex Mendoza and collected by the stewards (calpixqueh) installed in each province (Berdan & Anawalt 1992; Berdan, Smith et al. 1996). Farm output turning into gold renders tribute in kind becoming the wealth of the state. Tribute is a datable institution, so it is the Town Center tech (RULES 6.2) instead of the first draft's age-up bonus. The effect is shared with the Burgundians' vineyards and the Persians' land tax in their designs (RULES 6.7)."
relevance = "Tribute was the purpose and the engine of the Triple Alliance's expansion: the empire was above all a tribute empire."
contested = "How far the empire controlled its provinces, and how regular collection was outside the core (Berdan, Smith et al. 1996)."

[tree]
add = ["Slinger", "Guilds", "Masonry", "Architecture", "Keep"]
remove = [
  "Siege Workshop", "Battering Ram", "Capped Ram", "Siege Ram", "Mangonel", "Onager", "Siege Onager",
  "Scorpion", "Siege Tower", "Trebuchet", "Siege Engineers",
  "Crossbowman", "Arbalester",
  "Blast Furnace", "Plate Mail Armor",
  "Carrack", "Catapult Galleon",
  "Block Printing", "Heated Shot",
]

[tree.basis]
"Slinger" = "Slingers fought beside archers as standard Aztec missile troops (Hassig 1988), and Bernal Díaz repeatedly describes showers of sling stones. The regional Slinger, already shared by the four South American civs, takes over part of the role of the removed crossbows."
"Guilds" = "The pochteca were professional long-distance merchants organised in hereditary, self-governing corporations with their own courts, who also served the state as spies (Sahagún, Florentine Codex, book 9). The current game gives Guilds to the Incas but not to the Aztecs; here it is added and renamed Pochteca (agreed rename)."
"Masonry" = "The Mexica and their allies built in stone and lime: the Templo Mayor, the causeways across the lake, the Chapultepec aqueduct and Nezahualcoyotl's dike (1449). The civ already had Fortified Wall without Masonry or Architecture, which was incoherent."
"Architecture" = "Same basis as Masonry: monumental and hydraulic engineering on the scale of the Templo Mayor and the dike of Nezahualcoyotl."
"Keep" = "Added as an abstraction of fortified strongpoints, as for the Maya: the frontier garrison of Oztuma, facing the Purépecha, was fortified under Ahuitzotl (1486–1502), and in 1520–21 temple platforms were held as citadels (Hassig 1988; Cortés, second letter). There was no tradition of stone towers (see open questions)."
"Siege Workshop" = "No Mesoamerican people built siege engines: towns fell to assault, fire and blockade. Removing the workshop removes all its units; infantry with the anti-building bonus, Arson and Sappers, and Petards replace them (owner's decision, brief section 6; RULES 6.11 and section 10). The Petard is a 16th-century gunpowder charge, kept unrenamed as the abstraction of assault parties with fire so as not to hide the anachronism (see open questions)."
"Battering Ram" = "Removed with the Siege Workshop: there were no rams and no wheeled vehicles in pre-Hispanic Mesoamerica."
"Capped Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Siege Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Mangonel" = "Removed with the Siege Workshop: no torsion or traction artillery existed in the Americas."
"Onager" = "Removed with the Siege Workshop (see Mangonel)."
"Siege Onager" = "Removed with the Siege Workshop (see Mangonel)."
"Scorpion" = "Removed with the Siege Workshop: no bolt-throwers existed in the Americas."
"Siege Tower" = "Removed with the Siege Workshop: a wheeled assault tower; Mesoamerican assaults used no such engines."
"Trebuchet" = "Counterweight artillery never existed in the Americas; the only trebuchet seen at Tenochtitlan was built by the Spaniards in 1521 and failed at its first shot (Bernal Díaz; Cortés, third letter)."
"Siege Engineers" = "No siege engines are left to improve."
"Crossbowman" = "The crossbow was unknown in the pre-Hispanic Americas; Aztec missile troops were archers, slingers and atlatl dart-throwers (Hassig 1988). Archers, Slingers and Skirmishers with Atlatl cover the role. In the current game the Bulgarians also lack crossbows (so do the current Spanish, but their Castilian redesign restores them)."
"Arbalester" = "Removed with the Crossbowman (see there)."
"Blast Furnace" = "There was no iron metallurgy: Aztec blades were of obsidian and metals (copper, gold, silver) were mostly ornamental. Removed with the other Imperial-Age iron tiers, a playability line rather than a historical one (the Lithuanians already lack both Blast Furnace and Plate Mail Armor): the lower Blacksmith tiers stay as a generic equipment level, Iron Casting is renamed Obsidian Blades, and Flower Wars keeps late infantry attack (see open questions)."
"Plate Mail Armor" = "Removed with the Imperial-Age iron tiers (see Blast Furnace): there was no plate armour. Mexica warriors wore the quilted cotton ichcahuipilli, which the Spaniards themselves adopted, and carried shields (chimalli); the Ichcahuipilli tech (Gambesons) stays, and Scale Mail and Chain Mail Armor stay as a generic equipment level."
"Carrack" = "High-castled sailing warships were unknown; the Mexica navy was thousands of dugout canoes (acalli) on Lake Texcoco (Cortés, third letter). The Aztecs already lack the Galleon."
"Catapult Galleon" = "A sailing ship carrying a catapult: both a European ship type and a siege engine."
"Block Printing" = "There was no printing: Mexica books (amoxtli) were painted by hand. With no equivalent for the function the tech is removed (18 civs already lack it)."
"Heated Shot" = "Red-hot shot fired at ships is an artillery technique (associated with Stephen Báthory, 1579). With no artillery and no equivalent it is removed from all four American civs that had it (Aztecs, Maya, Inca, Tupi)."

[[rename]]
from = "Horse Collar"
to = "Chinampas"
level = 1
basis = "Agreed rename. Chinampas, raised beds of lake mud between canals, fed Tenochtitlan; the freshwater southern lakes of Xochimilco and Chalco were turned into vast chinampa districts under the Triple Alliance in the 15th century (Smith 2012). The farm bonus renders their scale; this rename gives the generic farm upgrade its local name."

[[rename]]
from = "Heavy Plow"
to = "Terraces"
level = 1
basis = "There was no plough (farmers used the digging stick, huictli). Hillside terraces (metepantli), often edged with maguey, intensified farming around the Basin, notably in the Texcoco piedmont (Donkin 1979). Same effect; the same rename is used for the Maya."

[[rename]]
from = "Crop Rotation"
to = "Milpa"
level = 1
basis = "Agreed rename. The milpa, intercropping maize, beans and squash, kept fields productive: the Mesoamerican equivalent of rotation. The word is Nahuatl (mīlli, ‘field’, with -pan, ‘on’); the same rename is used for the Maya as the standard term."

[[rename]]
from = "Guilds"
to = "Pochteca"
level = 1
basis = "Agreed rename: the guild-like corporations of the pochteca, the professional merchants of Tenochtitlan, Tlatelolco and other cities (Sahagún, Florentine Codex, book 9)."

[[rename]]
from = "Gambesons"
to = "Ichcahuipilli"
level = 1
basis = "Same effect as Gambesons (Militia-line +1 pierce armor): the ichcahuipilli was a quilted cotton jacket, the standard body armour of Mesoamerican warriors, which the Spaniards adopted as the escaupil. The Maya get the same tech under an English name."

[[rename]]
from = "Iron Casting"
to = "Obsidian Blades"
level = 1
basis = "There was no iron. Prismatic obsidian blades struck from prepared cores, much of it the green obsidian of the Sierra de las Navajas near Pachuca, edged the macuahuitl and tipped darts and spears (Hassig 1988; Smith 2012). Same effect as Iron Casting; Forging, which does not name iron, keeps its generic name. The Maya counterpart is Flint Points and the Inca one Tin Bronze."

[[rename]]
from = "Wheelbarrow"
to = "Tumplines"
level = 1
basis = "There were no wheeled vehicles: loads were carried with the tumpline (mecapalli), a strap passing over the forehead, the basic tool of Mesoamerican porters (Hassig 1985). Same rename for the Maya."

[[rename]]
from = "Hand Cart"
to = "Carrying Frames"
level = 1
basis = "Porters used a wooden carrying frame (cacaxtli) slung from the tumpline, shown in the Codex Mendoza (Hassig 1985). Parallel to the agreed Hand Cart → Llama Caravans for the Incas; same rename for the Maya."

[[rename]]
from = "Coinage"
to = "Cacao Currency"
level = 1
basis = "There were no coins: cacao beans served as small change and standard cotton mantles (quachtli) as larger units of value in markets and tribute (Berdan, Smith et al. 1996). Same rename for the Maya, where Landa also records cacao as money."

[architecture]
set = "Central American"
level = 1
change = "kept"
basis = "The Mesoamerican stepped temples and plastered stone buildings of the existing set fit the Mexica."
