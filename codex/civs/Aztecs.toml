civ = "Aztecs"
name = "Aztecs"
status = "draft"
label = "Infantry civilization"
summary = "The Mexica and the Triple Alliance (1325–1521): chinampas, temple-burning infantry and a Tlatelolco market team bonus replace the start gold, Monk bonus and Relic gold, tribute becomes the Calpixqueh tech, and siege engines, crossbows and Imperial metal tiers give way to Slingers and local names."
ideas = [
  "N3: An acalli war-canoe line (cheap, fast, carries a war party, throws darts) replacing the Galley-line, Fire Ships and Hulks: thousands of canoes defended Lake Texcoco in 1521 and Cortés had to build thirteen brigantines to break them (Cortés, third letter).",
  "N3: Capture instead of conversion and killing: infantry that defeats enemy soldiers takes captives, which promote the captor (the warrior ranks of the Codex Mendoza) and feed tribute; captured enemy cult images kept in the Coateocalli (Durán) instead of Relics.",
  "N3: Re-theme the Monastery as a teocalli with tlamacazqueh (priests), the god-bearers (teomamaqueh) who led the army, and Nahuatl tech names.",
  "N2: A tribute mechanic proper: Castles and Town Centers yielding a slow income of food, cloth and gold, with the Market tribute fee at 0% (the Calpixqueh tech is the N1 stand-in).",
  "N2: Regional names for the Blacksmith armour lines (chimalli shields, tlahuiztli warrior suits) once Blacksmith granularity is decided (RULES section 10).",
  "N2: A bow line split from the Crossbowman (RULES section 10), so the Aztec archer (tlahuitolli bow) can improve without crossbows.",
  "N3: Assault mechanics (scaling ladders, firing the temple) as the American alternative to siege engines (RULES section 10).",
]
contested = [
  "The purpose of the xochiyaoyotl (flower wars): ritual capture of victims for sacrifice (Durán, Tezozómoc) or a strategy of attrition and encirclement of Tlaxcala (Hassig 1988; Isaac 1983).",
  "The scale of human sacrifice: Durán's 80,400 victims at the 1487 rededication of the Templo Mayor against much lower modern estimates; the Huey Tzompantli excavations (INAH, since 2015) confirm large-scale sacrifice accumulated over decades. Harner's ‘protein’ hypothesis (1977) is rejected.",
  "Hegemonic or territorial empire, and the degree of provincial control (Berdan, Smith et al. 1996).",
  "The population of Tenochtitlan in 1519 (estimates c. 150,000–250,000) and of central Mexico.",
  "The date of Tenochtitlan's foundation (1325 or 1345) and the historicity of the migration from Aztlan.",
  "The story that Moctezuma took Cortés for Quetzalcoatl, probably a post-conquest construction (Townsend; Restall).",
]
open_questions = [
  "Rename the civ ‘Mexica’ or ‘Aztecs (Mexica)’? ‘Aztecs’ is an 18th–19th-century scholarly label (Clavijero, Humboldt, Prescott); the people called themselves Mexica or Tenochca, and the empire was the Triple Alliance with Texcoco and Tlacopan. The renames are decided together in codex-wide question CQ16 (see codex/civs/README.md).",
  "Label (codex-wide question CQ19): the game's ‘Infantry and Monk’ becomes ‘Infantry’, because the Monk HP bonus (rated stretched) is replaced and no element now rests on the priesthood. Accept, or keep ‘Monk’ for the weight of the priesthood (an N3 re-theme of the Monastery is in the ideas)?",
  "Regional names for unit lines (region-wide): for example Macuahuitl Warrior and Tequihua for the Two-Handed Swordsman and Champion, and scouts (the quimichtin, ‘mice’, of Sahagún) instead of the Eagle Scout, which turns the elite eagle order into a cheap Dark Age scout. Wanted?",
  "Atlatl: the spear-thrower is a pan-Mesoamerican weapon tradition, kept as an existing tech by the effect-size tie-break (RULES 6.2.4), not a datable moment (RULES 6.3; the general rule is codex-wide question CQ25, point b). Keep it for its fame, or replace it with a level-2 Castle tech for a datable moment of Mexica military history, such as Itzcoatl's victory over Azcapotzalco (1428), after which he granted conquered lands to the nobles and warriors who had fought, or Moctezuma I's laws tying noble privilege and dress to deeds in war (Durán)?",
  "Region-wide, siege: the Siege Workshop with all its units, the Trebuchet and Siege Engineers are removed from all six American civs (owner's decision), the first civs in the game without them. The Aztecs break buildings with anti-building infantry, Arson, Sappers and Petards, but every Castle must be taken by units standing in its arrow fire, so castle-breaking will be slow. Accept the risk until an N2/N3 assault unit exists?",
  "Region-wide, metal arms and armour: the criterion is the name of a metal weapon or armour tier. The Imperial-Age tiers are removed (for the Aztecs Blast Furnace and Plate Mail Armor; they already lacked Ring Archer Armor), a playability line rather than a historical one (the Lithuanians already lack Blast Furnace and Plate Mail Armor). A lower tier is renamed only where a specific, documented equivalent exists for that tech: Iron Casting → Obsidian Blades (Flint Points for the Maya, Tin Bronze for the Inca) and Gambesons → Ichcahuipilli. Forging, Scale Mail Armor and Chain Mail Armor stay as a flagged generic equipment level, since one quilted cotton armour cannot stand for two successive tiers, and Chemistry stays for its +1 ranged attack, although none of these peoples had gunpowder. Remove or rename the remaining tiers too, at a cost to playability?",
  "Keep: only the Keep, a stone tower, needs documented stone towers, so it stays in the region only where they are documented, which means the Inca (the towers of Sacsayhuamán); the Guard Tower stays as a generic tier wherever the Watch Tower stays. The Aztecs, who built no towers, are therefore not given the Keep, and the Guard Tower and Fortified Wall stay as abstractions. A Mesoamerican Keep could instead rest on a pre-1500 fact, as a design abstraction: a town's main temple-pyramid was its last stronghold, and its capture and burning marked the conquest (the Codex Mendoza glyph; the conquistadors called the temples ‘torres’, and Cortés counted more than four hundred of them at Cholula, second letter). Add the Keep for the Aztecs on that basis?",
  "Codex-wide question CQ2 (see codex/civs/README.md): Generic post-1500 items.",
  "Codex-wide question CQ3 (see codex/civs/README.md): Crossbows.",
  "Codex-wide question CQ12 (see codex/civs/README.md): American power budget.",
  "Codex-wide question CQ20 (see codex/civs/README.md): American renames beyond the agreed list.",
]

[profile]
entity = "The Mexica (Tenochca) of Tenochtitlan and the Triple Alliance (Excan Tlahtoloyan: Tenochtitlan, Texcoco and Tlacopan)"
region = "Basin of Mexico and central Mesoamerica"
window = "1325–1521 (from the traditional foundation of Tenochtitlan to its fall; the Triple Alliance from 1428)"
sources = [
  "Codex Mendoza (c. 1541); ed. Frances F. Berdan & Patricia Rieff Anawalt (1992)",
  "Bernardino de Sahagún, Florentine Codex (c. 1577)",
  "Diego Durán, Historia de las Indias de Nueva España (1581)",
  "Hernán Cortés, Cartas de relación (1519–1526)",
  "Bernal Díaz del Castillo, Historia verdadera de la conquista de la Nueva España",
  "Ross Hassig, Trade, Tribute, and Transportation (1985)",
  "Ross Hassig, Aztec Warfare: Imperial Expansion and Political Control (1988)",
  "Barry L. Isaac, ‘The Aztec Flowery War: a geopolitical explanation’, Journal of Anthropological Research 39 (1983)",
  "Frances F. Berdan, Michael E. Smith et al., Aztec Imperial Strategies (1996)",
  "Michael E. Smith, The Aztecs (3rd ed., 2012)",
  "R. A. Donkin, Agricultural Terracing in the Aboriginal New World (1979)",
  "Camilla Townsend, Fifth Sun: A New History of the Aztecs (2019)",
]

[[bonus]]
text = "Villagers carry +3"
kind = "economic"
level = 1
change = "kept"
precedent = "Villagers carry +3 (Aztecs)"
basis = "Mesoamerica had no draft animals and no wheeled transport, so goods moved on the backs of professional porters (tlamemeh) who carried about 23 kg over day stages of some 21–28 km; the supply of Tenochtitlan and the tribute depended on them and on canoes (Hassig 1985)."
relevance = "Without porters there was no tribute, no supply for Tenochtitlan and no campaigning: porterage carried the whole Mesoamerican economy."

[[bonus]]
text = "Military Units train +15% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Military Units train +15% faster (Aztecs)"
basis = "Every Mexica boy was schooled for war, commoners in the telpochcalli of their calpolli and nobles in the calmecac, and contingents were raised by calpolli and by city within days (Hassig 1988)."
relevance = "Universal schooling for war made every Mexica man a trained warrior and let the Triple Alliance raise armies within days, the basis of a century of conquest."

[[bonus]]
text = "Infantry +1/+2/+3 attack vs. buildings in Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "new"
replaces = "Monks gain +5 HP for each researched Monastery technology"
precedent = "Infantry +1/+2/+3 attack vs. buildings in Feudal/Castle/Imperial Age (Goths)"
basis = "Mesoamerican armies had no siege engines. Most wars were decided by defeating the defending army in the field, few towns were walled, and once resistance broke the attackers entered the town and burned its main temple, which marked the conquest: the Codex Mendoza's sign for a conquered altepetl is a burning temple with its roof toppled (a conventional glyph: the town was then folded into the tribute system, not destroyed) (Hassig 1988). This bonus is the substitute for the removed siege weapons (RULES 6.11 and section 10); the Maya and the Gaels' design use it too, while the Goths' design drops it (RULES 6.7). The Monk bonus it replaces linked priestly austerities to a purely mechanical HP progression (rated stretched)."
relevance = "Defeating the field army, then entering the town and firing its main temple, was how the Triple Alliance conquered, and it is the civ's main means of breaking buildings without engines."

[[bonus]]
text = "Farms +10% food"
kind = "economic"
level = 1
change = "new"
replaces = "Start with +50 gold"
precedent = "Farms +10% food (Chinese team bonus)"
basis = "Chinampas, raised beds of lake mud between canals, gave several harvests a year and fed Tenochtitlan; under the Triple Alliance the freshwater southern lakes of Xochimilco and Chalco were turned into vast chinampa districts, and the dike of Nezahualcoyotl (1449) kept the salt water of Lake Texcoco away from the lagoon around Tenochtitlan (Smith 2012). The +50 starting gold it replaces had only a loose link to gold tribute (rated stretched); tribute is now the Calpixqueh tech. The generic Horse Collar keeps the name Chinampas (agreed rename)."
relevance = "The chinampas were the food base of a lake city of some 150,000–250,000 people, one of the largest of its time."

[team_bonus]
text = "Markets work +80% faster"
level = 1
change = "new"
replaces = "Relics generate +33% gold"
precedent = "Markets work +80% faster (Bohemians team bonus)"
basis = "Tlatelolco, the market of Tenochtitlan's twin city, astonished the Spaniards: Cortés (second letter, 1520) reckoned that more than sixty thousand people traded there daily, under judges who settled disputes and checked measures. The market and the pochteca drew goods and traders from all Mesoamerica, and the pochteca traded at ports of trade outside the empire such as Xicalanco, and at Xoconochco (Soconusco) before its conquest under Ahuitzotl (1486–1502), after which it paid tribute (Sahagún, Florentine Codex, book 9; Codex Mendoza; Berdan, Smith et al. 1996). RULES 6.2: trade that benefited neighbours. The game's Relics follow the Christian cult of relics, and the Mexica sacred bundles (tlaquimilolli) produced no wealth (rated unfounded). The Bohemians have the same team bonus (repetition allowed, RULES 6.7)."
relevance = "Tlatelolco was the greatest market of the Americas and the hub of the exchange that tied the Triple Alliance to the rest of Mesoamerica."

[[unique_unit]]
name = "Jaguar Warrior"
model = "Jaguar Warrior"
building = "Castle"
level = 1
change = "kept"
basis = "The ocelomeh were, with the eagle warriors (cuauhmeh), one of the two great military orders, ranked below only the otontin and the cuachicqueh; entry depended above all on taking captives, and many members were nobles. The Codex Mendoza shows warriors rising in rank and insignia with each captive. The extra damage after defeating enemies evokes this promotion, although merit came from capturing, not killing (Hassig 1988). The regional Eagle Warrior line also stays in the Aztec tree."
relevance = "The jaguar and eagle orders, below only the otontin and cuachicqueh, were the elite of a warrior hierarchy built on taking captives, and they are the emblem of Aztec warfare."

[[unique_tech]]
name = "Atlatl"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Skirmishers +1 attack, +1 range"
level = 1
change = "kept"
precedent = "Atlatl (Aztecs)"
basis = "The spear-thrower (ahtlatl) with its darts (tlacochtli) was a feared weapon, used mostly by elite warriors as the armies closed, after the bow and sling volleys (Hassig 1988). It was pan-Mesoamerican and far older than the Mexica (already at Teotihuacan), which is why the Maya keep their own atlatl tech (Hul'che Javelineers) with a different effect (intended overlap, RULES 6.7). As a long weapon tradition it is not a datable moment (RULES 6.2, 6.3): it is a kept existing tech, held as a tech rather than a passive by the effect-size tie-break (RULES 6.2.4), since a strong effect suits the brake of cost and delay; a datable alternative is put to the owner (see open questions)."
relevance = "The atlatl was the missile weapon of the Mexica elite, and its Nahuatl name is the word the world uses for the spear-thrower: fame tips a weapon tradition that could otherwise be a detail."
contested = "Conquistador claims that atlatl darts pierced armour are anecdotal."

[[unique_tech]]
name = "Flower Wars"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Infantry +4 attack"
level = 1
change = "changed"
replaces = "Garland Wars"
precedent = "Garland Wars (Aztecs): identical effect, renamed"
basis = "Renamed to the standard English rendering of xochiyaoyotl (‘flower war’). The Triple Alliance fought recurrent, prearranged wars against Tlaxcala, Huexotzinco and Cholula in which picked warriors displayed their skill and took captives; Durán places their start after the famine of 1450–54, so they come after the ancient atlatl in the civ's own chronology (RULES 6.4). The attack bonus stands for the battle experience of these veterans (Durán; Hassig 1988); with Blast Furnace removed it also keeps late Aztec infantry viable."
relevance = "The flower wars shaped the empire's last six decades and, in one reading, left Tlaxcala unconquered to become Cortés's decisive ally."
contested = "Ritual capture for sacrifice (Durán, Tezozómoc) or a strategy of attrition (Hassig 1988; Isaac 1983)."

[[unique_tech]]
name = "Calpixqueh"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Farmers slowly generate gold in addition to food"
level = 1
change = "new"
precedent = "Burgundian Vineyards (Burgundians): identical effect, shared, moved to the Town Center and renamed"
basis = "After the Triple Alliance of 1428 the conquered provinces paid tribute on a fixed schedule: staple foods from the nearer provinces; cotton mantles, cacao, feathers, warrior suits and gold from the distant ones, recorded province by province in the Codex Mendoza and collected by the stewards (calpixqueh) installed in each province (Berdan & Anawalt 1992; Berdan, Smith et al. 1996). Farm output turning into gold renders tribute in kind becoming the wealth of the state. Tribute is a datable institution, so it is the Town Center tech rather than a passive bonus (RULES 6.2). The effect is Burgundian Vineyards, kept by the Burgundians and shared in the Persians', Berbers' and Tatars' designs, and the Bengalis' design has it as a passive: six civs in all (RULES 6.7; the reuse itself is codex-wide question CQ11)."
relevance = "Tribute was the purpose and the engine of the Triple Alliance's expansion: the empire was above all a tribute empire."
contested = "How far the empire controlled its provinces, and how regular collection was outside the core (Berdan, Smith et al. 1996)."

[tree]
add = ["Slinger", "Guilds", "Masonry", "Architecture"]
remove = [
  "Siege Workshop", "Battering Ram", "Capped Ram", "Siege Ram", "Mangonel", "Onager", "Siege Onager",
  "Scorpion", "Siege Tower", "Trebuchet", "Siege Engineers",
  "Crossbowman", "Arbalester",
  "Blast Furnace", "Plate Mail Armor",
  "Carrack", "Catapult Galleon",
  "Block Printing",
]

[tree.basis]
"Slinger" = "Slingers fought beside archers as standard Aztec missile troops (Hassig 1988), and Bernal Díaz repeatedly describes showers of sling stones. The regional Slinger, which the Inca, Muisca and Mapuche keep and the Maya also receive, takes over part of the role of the removed crossbows."
"Guilds" = "The pochteca were professional long-distance merchants organised in hereditary, self-governing corporations with their own courts, who also served the state as spies (Sahagún, Florentine Codex, book 9). The current game gives Guilds to the Incas but not to the Aztecs; here it is added and renamed Pochteca (agreed rename)."
"Masonry" = "The Mexica and their allies built in stone and lime: the Templo Mayor, the causeways across the lake, the Chapultepec aqueduct and Nezahualcoyotl's dike (1449). The civ already had Fortified Wall without Masonry or Architecture, which was incoherent."
"Architecture" = "Same basis as Masonry: monumental and hydraulic engineering on the scale of the Templo Mayor and the dike of Nezahualcoyotl."
"Siege Workshop" = "No Mesoamerican people built siege engines: towns fell to assault, fire and blockade. Removing the workshop removes all its units; infantry with the anti-building bonus, Arson, Sappers and Petards replace them (owner's decision; RULES 6.11 and section 10). The Petard, a 16th-century gunpowder charge, stays unrenamed as a flagged generic abstraction of assault parties with fire, outside the one-late-element limit (codex-wide question CQ2)."
"Battering Ram" = "Removed with the Siege Workshop: there were no rams and no wheeled vehicles in pre-Hispanic Mesoamerica."
"Capped Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Siege Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Mangonel" = "Removed with the Siege Workshop: no torsion or traction artillery existed in the Americas."
"Onager" = "Removed with the Siege Workshop (see Mangonel)."
"Siege Onager" = "Removed with the Siege Workshop (see Mangonel)."
"Scorpion" = "Removed with the Siege Workshop: no bolt-throwers existed in the Americas."
"Siege Tower" = "Removed with the Siege Workshop: a wheeled assault tower; Mesoamerican assaults used no such engines."
"Trebuchet" = "Counterweight artillery never existed in the Americas; the only trebuchet seen at Tenochtitlan was built by the Spaniards in 1521 and failed at its first shot (Bernal Díaz; Cortés, third letter)."
"Siege Engineers" = "No siege engines are left to improve."
"Crossbowman" = "The crossbow was unknown in the pre-Hispanic Americas; Aztec missile troops were archers, slingers and atlatl dart-throwers (Hassig 1988). Archers, Slingers and Skirmishers with Atlatl cover the role. In the current game the Bulgarians also lack crossbows (so do the current Spanish; the Castilian and Bulgarian designs restore the Crossbowman)."
"Arbalester" = "Removed with the Crossbowman (see there)."
"Blast Furnace" = "There was no iron metallurgy: Aztec blades were of obsidian and metals (copper, gold, silver) were mostly ornamental. Removed with the other Imperial-Age tiers of metal arms and armour, a playability line rather than a historical one (the Lithuanians already lack both Blast Furnace and Plate Mail Armor): the lower Blacksmith tiers stay as a generic equipment level, Iron Casting is renamed Obsidian Blades, and Flower Wars keeps late infantry attack (see open questions)."
"Plate Mail Armor" = "Removed with the Imperial-Age tiers of metal arms and armour (see Blast Furnace): there was no metal armour. Mexica warriors wore the quilted cotton ichcahuipilli, which the Spaniards themselves adopted, and carried shields (chimalli); the Ichcahuipilli tech (Gambesons) stays, and Scale Mail and Chain Mail Armor stay as a generic equipment level."
"Carrack" = "High-castled sailing warships were unknown; the Mexica navy was thousands of dugout canoes (acalli) on Lake Texcoco (Cortés, third letter). The Aztecs already lack the Galleon. Codex navy rule for canoe and raft fleets (codex-wide question CQ1): the high-seas sailing ships (Galleon, Carrack) are removed and the siege ship goes with the siege engines, while the Galley, Fire Ship, Demolition and Hulk lines stay with their tiers as a generic abstraction of canoe fleets for water maps; the demolition ships are generic post-1500 items kept as flagged abstractions (codex-wide question CQ2)."
"Catapult Galleon" = "A sailing ship carrying a catapult: both a European ship type and a siege engine."
"Block Printing" = "There was no printing: Mexica books (amoxtli) were painted by hand. With no equivalent for the function the tech is removed (18 of the game's 56 civs already lack it)."

[[rename]]
from = "Horse Collar"
to = "Chinampas"
level = 1
basis = "Agreed rename. Chinampas, raised beds of lake mud between canals, fed Tenochtitlan; the freshwater southern lakes of Xochimilco and Chalco were turned into vast chinampa districts under the Triple Alliance in the 15th century (Smith 2012). The farm bonus renders their scale; this rename gives the generic farm upgrade its local name."

[[rename]]
from = "Heavy Plow"
to = "Terraces"
level = 1
basis = "There was no plough (farmers used the digging stick, huictli). Hillside terraces (metepantli), often edged with maguey, intensified farming around the Basin, notably in the Texcoco piedmont (Donkin 1979). Same effect; the same rename is used for the Maya."

[[rename]]
from = "Crop Rotation"
to = "Milpa"
level = 1
basis = "Agreed rename. The milpa, intercropping maize, beans and squash, kept fields productive: the Mesoamerican equivalent of rotation. The word is Nahuatl (mīlli, ‘field’, with -pan, ‘on’); the same rename is used for the Maya as the standard term. The tier order is a game convention: historically the milpa came first, and chinampas and terraces intensified it later."

[[rename]]
from = "Guilds"
to = "Pochteca"
level = 1
basis = "Agreed rename: the guild-like corporations of the pochteca, the professional merchants of Tenochtitlan, Tlatelolco and other cities (Sahagún, Florentine Codex, book 9)."

[[rename]]
from = "Gambesons"
to = "Ichcahuipilli"
level = 1
basis = "Same effect as Gambesons (Militia-line +1 pierce armor): the ichcahuipilli was a quilted cotton jacket, the standard body armour of Mesoamerican warriors, which the Spaniards adopted as the escaupil. The Maya get the same tech under an English name."

[[rename]]
from = "Iron Casting"
to = "Obsidian Blades"
level = 1
basis = "There was no iron. Prismatic obsidian blades struck from prepared cores, much of it the green obsidian of the Sierra de las Navajas near Pachuca, edged the macuahuitl and tipped darts and spears (Hassig 1988; Smith 2012). Same effect as Iron Casting; Forging, which does not name iron, keeps its generic name. The Maya counterpart is Flint Points and the Inca one Tin Bronze."

[[rename]]
from = "Wheelbarrow"
to = "Tumplines"
level = 1
basis = "There were no wheeled vehicles: loads were carried with the tumpline (mecapalli), a strap passing over the forehead, the basic tool of Mesoamerican porters (Hassig 1985). Same rename for the Maya."

[[rename]]
from = "Hand Cart"
to = "Carrying Frames"
level = 1
basis = "Porters used a wooden carrying frame (cacaxtli) slung from the tumpline, shown in the Codex Mendoza (Hassig 1985). Parallel to the agreed Hand Cart → Llama Caravans for the Incas; same rename for the Maya."

[[rename]]
from = "Coinage"
to = "Cacao Currency"
level = 1
basis = "There were no coins: cacao beans served as small change and standard cotton mantles (quachtli) as larger units of value in markets and tribute (Berdan, Smith et al. 1996). Same rename for the Maya, where Landa also records cacao as money."

[[rename]]
from = "Treadmill Crane"
to = "Coatequitl"
level = 1
basis = "There were no cranes or treadwheels: temples, causeways and dikes were raised by the coatequitl, the rotational labour draft for public works that each calpolli owed to its city and ruler (Hassig 1985; Smith 2012). Same effect as Treadmill Crane (Villagers construct buildings +20% faster): organised labour is the Mexica equivalent of faster building, as the tumpline is of the Wheelbarrow. Pending approval with the other renames beyond the agreed list (codex-wide question CQ20)."

[architecture]
set = "Central American"
level = 1
change = "kept"
basis = "The Mesoamerican stepped temples and plastered stone buildings of the existing set fit the Mexica."
