[[bonus]]
text = "Market trading fee only 5%; Markets cost -100 wood"
kind = "economic"
level = 1
change = "kept"
precedent = "Market trading fee only 5%; Markets cost -100 wood (Saracens)"
basis = "The Islamic world joined the Mediterranean, the Indian Ocean and the Sahara with a stable coinage (dinar and dirham), credit and transfer instruments (sakk, hawala, suftaja), suqs and funduqs; the Cairo Geniza letters show dense merchant networks (S. D. Goitein, A Mediterranean Society, 1967–1993). A low trading fee is a fair abstraction."
relevance = "Long-distance trade financed the caliphates and Mamluk Egypt and carried Islam along the routes; without it the civ loses its economic identity."

[[bonus]]
text = "Camel Units +25% HP"
kind = "military"
level = 1
change = "kept"
precedent = "Camel Units +25% HP (Saracens)"
basis = "The dromedary gave the conquest armies their strategic mobility, as in Khalid ibn al-Walid's desert crossing to Syria in 634 (al-Baladhuri, al-Tabari), and remained the transport animal of every Arab and Mamluk army. An abstraction of the camel's hardiness."
relevance = "Camel-borne mobility made the conquests of 632–651 possible across the deserts between Arabia, Syria and Iraq; it is also the trait most associated with the Arabs."
contested = "In battle the conquerors fought mostly on horseback or on foot (Yarmuk and Qadisiyya, 636); the camel served above all for transport."

[[bonus]]
text = "Galley-line attacks +25% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Galley-line attacks +25% faster (Saracens)"
basis = "Rashidun-era fleets of Egypt and Syria (Mu'awiya being governor of Syria) beat the Byzantines at the Battle of the Masts (654/655); Umayyad fleets attacked Constantinople (717–718); Aghlabid and Fatimid fleets held much of the central and eastern Mediterranean until the 11th century (Picard, 2015). Mamluk sea power was intermittent but real (Cyprus 1426, Rhodes 1440 and 1444, the Indian Ocean fleet of 1505–1509)."
relevance = "Arab galley fleets broke Byzantine control of the eastern Mediterranean, raided Cyprus and carried the conquest of Sicily; without them the caliphate stays a land power."

[[bonus]]
text = "Heavy Cavalry Archer upgrade costs -50%"
kind = "military"
level = 1
change = "new"
precedent = "Heavy Cavalry Archer upgrade available in Castle Age and costs -50% (Khitans), the cost half only"
basis = "From the Turkish ghilman of Samarra (830s) to the Mamluks, the core of these armies was the armoured horse archer, trained also with lance and sword in the furusiyya of the barracks schools (tibaq) and the training grounds (maydan) of Cairo; manuals such as Taybugha's on archery (c. 1368; Latham and Paterson, 1970) codify the training. These troops were paid through the iqta', which assigned the revenue of a district to an amir or soldier in return for service: introduced on a large scale by the Buyids (946), it paid the cavalry of Saladin and of the Mamluks, whose cadastral surveys (al-Rawk al-Husami, 1298; al-Rawk al-Nasiri, 1313–1325) redistributed the land of Egypt among the sultan, the amirs and their mamluks (Cahen, 1953; al-Maqrizi). They beat the Mongols at Ain Jalut (1260) and Homs (1281) (Ayalon; Amitai-Preiss, 1995). The tree already had Cavalry Archer, Heavy Cavalry Archer, Thumb Ring and Parthian Tactics, but no bonus expressed the civ's best-documented military trait. The iqta' itself has no slot of its own: the Town Center carries the earlier caliphal reform (Dinar), and the Sipahi effect stays with the Turks' Timar and the Hindustanis' Dagh (on the iqta' and the timar, see contested). The discount stays at the Khitans' -50% rather than a free upgrade, to keep the power budget."
relevance = "The trained horse archer was the military base of the Abbasid ghilman and of the Mamluk state, which stopped the Mongols; erase it and the Mamluk era makes no sense."

[team_bonus]
text = "Technologies research +25% faster"
level = 1
change = "new"
replaces = "Foot Archers and Skirmishers +2 attack vs. buildings"
precedent = "Technologies research +25% faster (Portuguese team bonus, which the Portuguese design replaces; the Vietnamese design uses the same effect for its Văn Miếu tech)"
basis = "Arabic was the language through which Greek, Persian and Indian science, and Islamic advances in mathematics, astronomy, optics and medicine, reached the neighbours: the translation movement patronised by the Abbasid caliphs (al-Ma'mun, 813–833; Gutas, 1998), paper made in Baghdad from c. 794 and in al-Andalus by the 12th century, and the Latin translations of Arabic works in southern Italy and Spain. Constantine the African (d. before 1099) translated at Monte Cassino the Viaticum of Ibn al-Jazzar, a physician of Kairouan under the Fatimids; Robert of Chester (1145) and Gerard of Cremona (d. 1187) translated the algebra that al-Khwarizmi had written in Abbasid Baghdad for al-Ma'mun; and Ibn al-Haytham's Optics, written in Fatimid Cairo in the early 11th century, became the Latin De aspectibus (late 12th or early 13th century), the basis of the optics of Roger Bacon and Witelo (Lindberg, 1976). Neighbours researched faster with what the Arabic world passed on. The original team bonus (rated unfounded) had no referent."
relevance = "Transmitting science and techniques to Europe and Asia is one of the defining legacies of the Arabic-speaking world, and it benefited neighbours, as RULES 6.2 requires."

[[unique_unit]]
name = "Mamluk"
model = "Kipchak"
building = "Castle"
level = 1
change = "new"
replaces = "Mameluke"
basis = "Mamluks were slave soldiers bought young and trained as the elite of the Ayyubid and Mamluk armies; al-Salih Ayyub's Bahriyya (1240s) and the early Mamluk sultans' troops were mostly Kipchak Turks from the steppe (from 1382 mostly Circassians). They stopped the Mongols at Ain Jalut (1260) and Homs (1281) and took Acre (1291), fighting above all as horse archers trained to shoot rapidly in volleys (Ayalon; Amitai-Preiss, 1995; Latham and Paterson, 1970). The Cuman Kipchak, a horse archer who looses several arrows at once, is the same people and the nearest existing unit; the game's camel-riding Mameluke with a thrown scimitar had the depiction wrong (analysis: ‘wrong’). The unit takes the spelling of modern scholarship, ‘Mamluk’, not the game's ‘Mameluke’."
relevance = "The mamluk institution produced the soldiers who ruled Egypt and Syria for 267 years, defeated the Mongols and ended the Crusader states."
contested = "The Kipchak is a light, cheap horse archer, while the royal mamluks were armoured and costly (see the N2 idea). The Kipchak model is also the Cumans' and the Georgians' Kipchak and the Hindustanis' Ghulam: sharing it with the Cumans is deliberate (the Bahri mamluks and the Cumans were both Kipchaks), and the Ghulam is the same institution in Delhi; the share is accepted until an N2 model exists (RULES 6.16.12). The alternatives fit worse: the restored Mameluke keeps the camel and the thrown scimitar, and the Persian Savar has no bow. Of the Scenario Editor units, the Khan, a mounted archer, was considered and not used: its stats are those of a campaign hero (160 HP, 12 attack; codex/tools/scenario-units-stats.md), not of a trainable soldier."

[[unique_tech]]
name = "Counterweights"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Trebuchets and Mangonel-line +15% attack"
level = 1
change = "kept"
precedent = "Counterweights (Trebuchets and Mangonel-line +15% attack) (Saracens)"
basis = "Murda al-Tarsusi's treatise for Saladin (c. 1187) contains one of the earliest clear descriptions of counterweight trebuchets, and the Mamluks massed them against the Crusader fortresses, above all Acre (1291). The technique also travelled east: Muslim engineers sent by the Ilkhan Abaqa built such engines for Kublai at Xiangyang (1273), where they were called huihui pao, ‘Muslim trebuchets’ (a secondary illustration, also used in the Mongols' design)."
relevance = "Massed engines, together with mines, let the Mamluks take the last Crusader strongholds (Tripoli 1289, Acre 1291) and end the Crusader states."
contested = "A Byzantine origin is argued by Chevedden; extending the effect to the Mangonel-line is a game liberty. Other strongholds fell mainly to mining (Margat, 1285), which Sappers and Siege Engineers carry."

[[unique_tech]]
name = "Dinar"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "All gold income +10% faster"
level = 2
change = "new"
precedent = "Grand Trunk Road (All gold income +10% faster; Market trading fee reduced to 10%) (Hindustanis), the gold half only, at the game's age (Castle): a new tech (level 2). The trading-fee half is left out because the civ's Market bonus already lowers the fee to 5%. The same half is the Town Center tech of the Avars' (Byzantine Tribute), Bulgarians' (Peace of 927) and Danes' (Øresundstold) designs and a passive bonus of the Byzantines' design."
basis = "Abd al-Malik (685–705) gave the caliphate its own money and its own language of government. In 696/697 (AH 77) his mint struck the first purely epigraphic gold dinars, with the profession of faith in place of the Byzantine and caliphal images and a lighter weight standard (the mithqal of about 4.25 g), followed by reformed silver dirhams (AH 78–79); in the same years the registers of the treasury (diwan) were turned into Arabic, in Iraq from Persian on al-Hajjaj's orders (697) and in Syria from Greek under Sulayman ibn Sa'd (700) (al-Baladhuri; Robinson, 2005; Bacharach, 2010). Arab coin and Arab clerks replaced the Byzantine and Sasanian systems the conquerors had inherited, and the dinar became the gold coin of the Islamic world. Gold income that comes in faster translates a state that collected and paid in its own coin. The tech gives the early caliphate (632 to c. 1050), otherwise carried by passives and the team bonus, a datable moment of its own."
relevance = "The reform made Arabic the language of government and the dinar the money of the Islamic world: the moment the conquest state became an Arab-Islamic empire with institutions of its own."
contested = "The effect abstracts a reform whose aims were as much ideological (the profession of faith in place of images, a claim of sovereignty against Byzantium) as fiscal, and the provinces followed at different paces: Egypt's diwan was turned into Arabic only in 706, under al-Walid I."

[[unique_tech]]
name = "Bimaristan"
building = "Monastery"
kind = "civil"
age = "Castle"
effect = "Monks passively heal multiple nearby units"
level = 1
change = "changed"
precedent = "Bimaristan (Monks passively heal multiple nearby units) (Saracens): an existing unique tech, moved from the Castle to the Monastery with an identical effect and age; the Khmer design shares the effect as Arogyashala, at the Town Center"
basis = "The bimaristan (Persian bimar ‘sick’ + stan ‘place’) was the great Islamic hospital: Dols (1987) places the first in Baghdad in the early 9th century, where al-Razi later practised; Nur al-Din's in Damascus (1154) and Qalawun's al-Mansuri in Cairo (1284–1285) followed with specialised wards and medical teaching. They were pious foundations endowed as waqf and often joined to a mosque or madrasa: the al-Mansuri hospital stood in one complex with Qalawun's madrasa and mausoleum. As a charitable religious foundation whose effect works through Monks, the tech sits at the Monastery (RULES 6.2)."
relevance = "The endowed hospital with medical teaching is a signature institution of Islamic civilisation, the setting of al-Razi's and Ibn al-Nafis's medicine."
contested = "Bimaristans were staffed by physicians and funded by waqf endowments, not run by clergy; tying them to Monks is an abstraction. The Monk and the Monastery keep the game's generic names (RULES 6.16.9), although ‘Monk’ fits a Muslim civ worst."

[tree]
add = ["Cavalier", "Shipwright", "Architecture", "Treadmill Crane"]
remove = ["Hand Cannoneer", "Cannon Galleon", "Elite Cannon Galleon"]

[tree.basis]
"Cavalier" = "Heavy mail-clad cavalry with lance and sword, sometimes on armoured horses (tijfaf), was the core of Ayyubid and Mamluk armies and an important arm of the Fatimids, whose armies also relied on Kutama Berber cavalry, black infantry ('abid) and Turkish and Armenian contingents (Yaacov Lev, State and Society in Fatimid Egypt, 1991). Stopping at the Knight contradicted the civ's best-documented military identity. The Paladin stays out."
"Shipwright" = "Renamed Dar al-Sina'a (see the rename): the state arsenals of Tunis (c. 698), Alexandria and Rawda island at Fustat built the caliphal fleets. Its absence was ironic in a naval civ."
"Architecture" = "Monumental building from the Dome of the Rock (691/692) and the Great Mosque of Damascus (705–715) to Samarra (836–892), al-Azhar (970–972) and Mamluk Cairo (Sultan Hasan, 1356–1363), and military works such as Saladin's Citadel of Cairo (from 1176)."
"Treadmill Crane" = "One reading for the region (the Arabs, Persians, Turks, Berbers and Malians): no treadwheel crane is attested at medieval Islamic building sites in the sources used here (the device is Roman, and in medieval Europe it is attested again from c. 1225; A. L. Matthies, ‘Medieval Treadwheels’, Technology and Culture 33, 1992), so the tech is kept as a generic abstraction of faster building, as in the Hindustani, Tamil and Bengali designs, wherever large building programmes in stone or brick are a documented trait of the civ. Here it rests on the caliphal and sultanic building listed under Architecture, from Umayyad Jerusalem and Damascus and Abbasid Samarra, a new capital raised within a few decades, to Mamluk Cairo."
"Hand Cannoneer" = "The Mamluks used cannon in sieges from the 1360s (the Bombard Cannon stays), but their cavalry elite refused hand firearms: a corps of black slaves armed with arquebuses under al-Nasir Muhammad ibn Qaytbay was attacked by the royal mamluks and broken up (1498), and the arquebusier corps raised under al-Ghawri (c. 1510) stayed small, low-status and outside the mamluk elite (Ayalon, 1956). Tumanbay still had guns and arquebusiers at Raydaniyya (1517), so the removal models the elite's refusal, not a lack of handguns (see contested). It also sets the Arabs apart from the Turks."
"Cannon Galleon" = "The navy is a fleet of ships (RULES 6.16.1): the planked war galleys (shini, shalandi) and fire ships (harraqa) built in the caliphal arsenals keep every generic tier, the Galleon as a flagged abstraction (RULES 6.16.2). The Cannon Galleon needs gun-armed warships inside the window, and gun-armed Mamluk warships are attested only for the Red Sea fleets of the sultanate's last years (from 1505: Chaul 1508, Diu 1509). It would be a post-1500 element whose fame is that of the Portuguese victory at Diu, while the Mamluks are known for their reluctance to adopt firearms (Ayalon 1956), so it fails the clear-fame test of RULES section 2. Without it the civ has no siege warship, as the navy rule allows."
"Elite Cannon Galleon" = "As Cannon Galleon."

[[rename]]
from = "Shipwright"
to = "Dar al-Sina'a"
level = 1
basis = "Dār al-ṣināʿa, ‘house of manufacture’, the state naval arsenal (Tunis, Alexandria, Rawda); through Venetian it gave European languages the word ‘arsenal’. The function (a state shipyard that builds ships faster and cheaper) is a real equivalent inside the window, the name is the period term, and the effect is identical (RULES 6.16.15)."

[[rename]]
from = "Elite Kipchak"
to = "Elite Mamluk"
level = 1
basis = "Follows the unique unit (Kipchak → Mamluk) for the Arabs only."

[architecture]
set = "Middle Eastern"
change = "kept"
basis = "Arab-Islamic building of Syria, Iraq and Egypt (domes, courtyards, minarets) is what the Middle Eastern set represents."

[[dropped]]
item = "Transport Ships +100% HP, +20 carry capacity"
kind = "bonus"
reason = "Power budget, not relevance: dropped to offset the new Heavy Cavalry Archer bonus, the Cavalier and the Dinar; for the same reason the Fast Fire Ship (which would render the harraqa), absent from the game's Saracens, is not added. The trait itself is weighty (Arab landings and island conquests: Cyprus 649, Crete c. 827, Sicily 827–902, Bari 847–871, the Balearics 902/903, Fraxinetum c. 890–972), but the level-1 review settles that neither the bonus nor the Fast Fire Ship comes back; the Tamils' and Burmese designs use the identical bonus."
