[[bonus]]
text = "Magyar Huszar gold cost is replaced by additional food cost"
kind = "military"
level = 1
change = "new"
replaces = "Corvinian Army (unique tech): Magyar Huszar gold cost is replaced by additional food cost"
precedent = "Corvinian Army (Magyar Huszar gold cost is replaced by additional food cost) (Magyars); Forced Levy (Militia-line gold cost is replaced by additional food cost) (Malay)"
basis = "Owner’s decision: the 15th-century hussars were cheap, irregular light horsemen, many of Serbian (Rascian) origin, serving on the southern frontier. They were raised in numbers partly through the noble levy (militia portalis), which from 1397 obliged landowners to equip one archer for every twenty peasant plots, a system Matthias restored (Engel 2001). The old Corvinian Army tech only removed a gold cost the game itself had added, so the cheap Huszar is now native."
relevance = "Cheap, numerous light horse defined Hungarian warfare on the Ottoman frontier and gave Europe the word ‘hussar’."
contested = "Hungarian historiography links Matthias’ portal levies specifically to hussars through a decree usually dated c. 1481; the first mention of hussars (1403 or 1432) is debated."

[[bonus]]
text = "Scout Cavalry-line costs -15%"
kind = "military"
level = 1
change = "kept"
precedent = "Scout Cavalry-line costs -15% (Magyars)"
basis = "Abundant horses on the Pannonian plain and a numerous, cheap light cavalry from the Conquest to the hussars of the 15th century (Róna-Tas 1999; Engel 2001)."
relevance = "The Magyars entered history as a horse people, and light cavalry stayed central to Hungarian armies for six centuries."

[[bonus]]
text = "Mounted Archers +1 attack, +1 range starting in Imperial Age"
kind = "military"
level = 1
change = "changed"
replaces = "Recurve Bow (unique tech): Mounted Archers +1 attack, +1 range"
precedent = "Recurve Bow (Mounted Archers +1 attack, +1 range) (Magyars), the same effect as a passive, gated at its game age (RULES 6.16.11) as in the Anglo-Saxons’, Georgians’ and Lithuanians’ conversions; for the age gate, +10 population space in Imperial Age (Goths)"
basis = "Reflex composite bows with bone stiffeners are found in 10th-century Conquest-period graves. Leo VI’s Tactica (c. 900) describes the Hungarians (‘Turks’) fighting as mounted archers, but its chapter adapts Maurice’s Strategikon on the steppe peoples, so it is weaker evidence than it looks; the western annals of the raids and the Modena prayer against the Hungarians’ missiles (‘ab Ungerorum nos defendas iaculis’) are more direct. The raids reached Saxony, Italy and Spain until the Lechfeld (955) and Byzantium until Arcadiopolis (970) (Bowlus 2006), and the bow stayed with the kingdom’s light auxiliaries (Pechenegs, Székelys, later Cumans). A long military tradition that the Magyars brought with them marks no datable moment, so it is a passive (RULES 6.2), not a unique tech; it applies from the Imperial Age, the age of the original Recurve Bow tech. The Thumb Ring stays on the same ground, given for an archery tradition the civ’s armies demonstrably used: the steppe archery, which drew with the thumb, of the Conquest-era Hungarians and of the kingdom’s Pecheneg, Székely and Cuman auxiliaries."
relevance = "The reflex bow carried the Conquest and the raids that made the Magyars known across Europe."

[[bonus]]
text = "Gold miners work +20% faster"
kind = "economic"
level = 1
change = "new"
replaces = "Villagers defeat wolves with one strike"
precedent = "Gold miners work +25% faster (Turks); Stone miners work +20% faster (Koreans)"
basis = "Hungary was Europe’s largest gold producer in the 14th century. Charles I’s mining reform of 1327 let landowners keep a third of the royal mining dues to encourage prospecting; Kremnica (Körmöcbánya) received town privileges and a mint (1328), and the Hungarian gold florin was struck from 1325–26 (Engel 2001). The wolf bonus it replaces was pure game flavour with no historical basis. Four Central European designs now have a mining element (Bohemian silver, Polish salt, Hungarian gold, the German miners’ team bonus); each rests on its own history (RULES 6.7), and the effects differ (free Mining Camp technologies, stone that also yields gold, faster gold miners, longer-lasting gold), so the convergence is accepted."
relevance = "Gold paid for the Angevin kingdom’s power and made the Hungarian florin a standard coin of Central Europe; it is not a minor detail."

[[bonus]]
text = "Fortifications built +50% faster"
kind = "other"
level = 1
change = "new"
replaces = "Melee attack upgrades free"
precedent = "Fortifications built +50% faster; Town Centers built +100% faster (Sicilians), fortification part only; the Anglo-Saxons’ design narrows it to Walls and Gates"
basis = "After the Mongol invasion of 1241–42 Béla IV pressed nobles, prelates and towns to build stone castles, and dozens rose within a generation (Fügedi 1986); in the 15th century the kingdom held a belt of frontier fortresses against the Ottomans (Belgrade, held in 1456; Jajce, taken in 1463; Šabac, taken in 1476) (Pálosfalvi 2018). The free melee upgrades it replaces rested only on a weak link to the Conquest-era sabre. Béla IV’s castle policy stays a passive rather than a second Castle tech: a building wave over a generation rather than one reform; nor do Charles I’s banderia of the 1320s–30s get a tech, the Angevin heavy cavalry being carried by the generic Knight-line and Paladin."
relevance = "The castle-building after 1241 reshaped the kingdom’s power structure, and the frontier fortresses held the Ottomans back for decades, from Belgrade (1456) to its fall in 1521."
contested = "How far 1241 caused the castle-building wave is debated."

[team_bonus]
text = "Mounted Archers train +25% faster"
level = 1
change = "kept"
precedent = "Mounted Archers train +25% faster (Magyars team bonus); the Turks’ design uses it too, but not the Tatars’ design, which has a different team bonus. Identical team-wide effects count once per team (RULES 6.16.12)."
basis = "Hungarian horse archers often fought as allies and auxiliaries of their neighbours: for Arnulf of Carinthia against Moravia (892, Annales Fuldenses) and for Byzantium against Bulgaria (894–895, De Administrando Imperio); in 1278 Ladislaus IV’s army, with the Cuman horse archers settled in Hungary as royal auxiliaries since 1239–46, fought beside Rudolf of Habsburg at the Marchfeld (Engel 2001). RULES 6.2: alliances and auxiliaries."
relevance = "Mounted archery defined the Magyars from the Conquest to the Cuman auxiliaries of the 13th century, and it was what their allies sought from them."

[[unique_unit]]
name = "Magyar Huszar"
model = "Magyar Huszar"
building = "Castle"
level = 1
change = "kept"
basis = "Hussars appear in documents from southern Hungary in the first half of the 15th century: light cavalry, probably of Serbian origin, organised on a large scale under Matthias Corvinus (Engel 2001); the game’s generic Hussar takes its name from the same Hungarian word, huszár. A 15th-century troop as a Castle Age unit is early, and ‘Strong vs. Siege Weapons’ has no particular basis. The generic Hussar stays in the tree beside it, the default for keeping both: the Scout-line Hussar is the top tier of the kingdom’s light horse across the window (the Conquest-era horsemen, the Cuman and Székely light cavalry), while the Huszar renders the 15th-century hussars of the southern frontier and of Matthias’ army."
relevance = "The hussar is the best-known Hungarian contribution to European warfare, and the type spread from Hungary to Poland and beyond."

[[unique_tech]]
name = "Royal Counties"
building = "Town Center"
kind = "civil"
age = "Feudal"
effect = "Town Centers cost -50% stone"
level = 2
change = "new"
precedent = "Town Centers cost -50% stone (Bulgarians); the Goths’ design takes it as a passive and the Bulgarians’ design drops it"
basis = "Stephen I (997–1038, crowned 1000/1001) organised the new Christian kingdom into counties (Latin comitatus, later Hungarian vármegye), each run from a royal castle by an ispán (comes) with its castle folk; until the mid-13th century these castles were earth-and-timber ramparts rather than stone (Engel 2001; Fügedi 1986). Cheaper Town Centers stand for the spread of these stone-less royal centres across the Carpathian Basin. A new tech (level 2): no existing unique tech fits a state founding. Chosen over Charles I’s mining reform of 1327, which is the gold passive, and the militia portalis of 1397/1459, part of the Huszar passive’s basis."
relevance = "The county system founded with the Christian kingdom was the frame of Hungarian government for nine centuries."
contested = "How many counties Stephen founded, and how far the system developed later in the 11th century, is debated (Engel 2001; Kristó 1988)."

[[unique_tech]]
name = "Black Army"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Infantry and Hand Cannoneers +2 pierce armor; Hussite Wagons (and the Elite Hussite Wagon upgrade) available at the Castle"
level = 2
change = "new"
replaces = "Corvinian Army (Magyar Huszar gold cost is replaced by additional food cost): its slot; the effect became a native bonus"
precedent = "Effect 1: Tower Shields (Spearman-line and Skirmishers +2 pierce armor) (Lithuanians); Barracks Units +1/+2/+3 pierce armor in Feudal/Castle/Imperial Age (Malians); Foot Archers and Condottieri +1 melee/+1 pierce armor (Italians: a class plus a named unit); it names Hand Cannoneers rather than all Gunpowder Units so that the armour does not stack on the Hussite Wagon and the Bombard Cannon. Effect 2: Cuman Mercenaries (All team members can train 5 free Elite Kipchaks per Castle) (Cumans), the closest case of a tech giving another civ’s unique unit at the Castle; Condottiero available at the Barracks in Imperial Age (Italians team bonus); Marauders (Tarkans can be trained at Stables) (Huns)"
basis = "Matthias Corvinus’ standing mercenary army (from the 1460s) combined heavy and light cavalry, its core, with infantry and a large artillery train. In his letter of 1481 to Gabriele Rangoni, bishop of Eger, Matthias describes common foot, armoured foot and shield-bearers with great pavises, with the handgunners placed behind the shield-bearers at the start of battle and in defence (Rázsó 1982): effect 1, the pavise. Effect 2 follows the owner’s outline: Hungarian armies took over the Hussite war wagon, though not the Hussite way of fighting with it, and used wagon forts in a secondary, mainly defensive role, as mobile fortifications, under John Hunyadi (Varna 1444, Kosovo 1448) and in Matthias’ own campaigns (Baia 1467; the Breslau campaign of 1474) (Tóth 2026), which is what the Hussite Wagon renders. Czech companies brought the expertise: Jan Jiskra, whose companies had fought in Upper Hungary since 1440, entered Matthias’ service in 1462, and the brotherhoods (bratříci) who held out were defeated at Kostoľany (1467) and their survivors hired (Engel 2001); the Bohemians’ team bonus renders these Czech companies. The Elite Hussite Wagon upgrade is at the Castle as for the Bohemians, who keep the unit. A new tech (level 2), as the owner decided."
relevance = "Matthias’ standing army made Hungary a Central European great power (Moravia, Silesia, Vienna 1485) and is the best-known army of medieval Hungary."
contested = "The name ‘Black Army’ is attested only after Matthias’ death (1490), and the share of gunners in it is a much-repeated estimate of unclear origin."

[tree]
add = ["Hand Cannoneer", "Bombard Cannon", "Keep", "Fortified Wall"]
remove = ["Galleon", "Carrack"]

[tree.basis]
"Hand Cannoneer" = "Owner’s decision. Matthias’ army is traditionally credited with an unusually high share of handgunners (often given as one in four infantrymen, a figure of unclear origin), Czech mercenaries had brought Hussite firearms to Hungary since the 1440s, and Hunyadi’s wagon forts used guns; a kingdom without hand firearms was the most serious gap in the regional trees."
"Bombard Cannon" = "Matthias kept a large artillery train and won by siege at Jajce (1463), Šabac (1476), Vienna (1485) and Wiener Neustadt (1487) (Engel 2001); the Magyars had no gunpowder siege weapon at all."
"Keep" = "After 1241 stone castles multiplied across the kingdom, and in the 15th century it maintained a line of frontier fortresses (Fügedi 1986; Pálosfalvi 2018); the Keep (held by 37 of the game’s 56 civs) was missing from one of the most castle-rich kingdoms of the frontier."
"Fortified Wall" = "Same basis: the castle and town walls of the post-1241 kingdom and the great frontier fortresses such as Belgrade (Nándorfehérvár), which withstood Mehmed II in 1456."
"Galleon" = "Navy tier (RULES 6.16.1): the boat tier, by vessel. The royal Danube flotilla, the kingdom’s war fleet, was made of naszáds, oared river boats whose hulls the sources consulted do not describe (see the navy note under contested). The high-seas sailing warships (Galleon, Carrack) are removed, while the Galley, Fire Ship, Demolition and Hulk lines keep their tiers as an abstraction of the river flotilla for water maps, with the Dock techs and the ‘Galleon, Fast Fire Ship and Carrack’ upgrade kept for the Fast Fire Ship. The Cannon Galleon stays as a special warship for the naszáds’ bow guns."
"Carrack" = "See Galleon."

[architecture]
set = "Central European"
change = "changed"
replaces = "Eastern European"
basis = "Historical fit (RULES 6.16.8): the Conquest era left no monumental architecture, and the kingdom of 1000–1526 built in Latin Romanesque and Gothic, in the eastern borderlands too (Esztergom, Pécs, Ják, Székesfehérvár and Buda; in Transylvania the cathedral of Alba Iulia, the Saxon fortified churches and Hunedoara castle), while the Eastern European set is the Rus' set of timber and onion domes. The cost is visual distinctness: neighbours now look alike."
