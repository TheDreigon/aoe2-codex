civ = "Magyars"
name = "Magyars"
status = "reviewed"
label = "Cavalry civilization"
summary = "Magyars cover the Conquest and the kingdom to Mohács: the Huszar costs no gold, the reflex bow becomes an Imperial Age passive, Kremnica gold and castle-building replace two bonuses, Stephen I’s counties and Matthias’ Black Army are the techs, gunpowder and Central European architecture come in, and the Danube flotilla takes the boat tier."
ideas = [
  "N2: Végvár (border fortress): Castles and towers cost less stone, gain HP and heal garrisoned units, for the 15th-century belt of frontier fortresses from Belgrade to Jajce.",
  "N2: Székely frontier guards: cheap Cavalry Archers from towers and Castles with extra line of sight, after the Székelys and Pechenegs who guarded the borders and formed the archer vanguard of Árpád-age armies (the Illuminated Chronicle names them as the vanguard, for example on the Olšava in 1116; Otto of Freising, present at the battle on the Fischa in 1146, names Pechenegs in the Hungarian vanguard).",
  "N2: Militia Portalis as its own tech (the noble levy of one archer per twenty peasant plots, 1397), if the native gold-free Huszar is later moved back into a tech.",
  "N2: A feigned-retreat mechanic for mounted archers, the signature tactic of the Conquest-era raids.",
]
contested = [
  "Hungarian ethnogenesis: the Finno-Ugric linguistic origin is agreed, but the homeland, the chronology and the mixing with Turkic groups are debated (genetic studies of 2018–2020 show the Conquest-era elite had mixed ancestry).",
  "The location and chronology of Magna Hungaria, Levedia and Etelköz.",
  "The etymology of huszár (Serbian gusar/husar, from Latin cursarius, or Hungarian húsz, ‘twenty’) and the date of the first mention (1403 or 1432).",
  "The phrase ‘De sagittis Hungarorum libera nos, Domine’ is not attested; the real formula of the Modena hymn is different.",
  "How far the Mongol invasion of 1241–42 caused the wave of stone castles (Fügedi and his critics).",
  "The real share of gunners in Matthias’ army (the ‘one in four’ figure is much repeated but of unclear origin), how much of the Hussite wagon-fort tactics Hungary took over (Tóth 2026: the wagons, not the Hussite way of fighting with them), and the name ‘Black Army’, attested only after 1490.",
  "The origin of John Hunyadi (Vlach according to most sources, or Hungarian).",
  "Navy (RULES 6.16.1): the boat tier, classified by vessel (see the Galleon in the tree). The kingdom’s war fleet was the royal Danube flotilla: John Hunyadi’s river fleet broke the Ottoman blockade of Belgrade on 14 July 1456 (Pálosfalvi 2018), and Matthias’ flotilla served at the siege of Šabac (1475–76) (Veszprémy 2009). Its warship was the naszád (from the Slavic nasad, a river vessel with built-up sides): the undated report on Matthias’ forces by the Venetian envoy Sebastiano Badoer (Baduario, in Hungary 1474–76), quoted by Szendrei (1896) and Bánlaky, counts 34 naszáds at Belgrade, each with 18 oars, 18 handgunners, two gunners and a light gun (cerbottana) in the bow (figures as quoted by Szendrei and Bánlaky; not confirmed at first hand). The sources consulted do not describe how the naszád was built, and no identified period depiction of it was found; only its name points to a construction, a vessel whose sides were built up, which fits the boat tier but is etymology, not a description of the hull. A crew of about forty, as in Badoer’s figures, is that of the Rus’ monoxyla (the Primary Chronicle reckons Oleg’s tribute of 907 at forty men to a ship), which the codex keeps in the boat tier, and a royal flotilla with fighting crews and bow guns is a matter of role, not of hull; so the flotilla is classed as boats, as the Bengalis’ design classes royal river war fleets whose hulls no source describes. The Cannon Galleon stays as a special warship for the naszáds’ bow guns, an abstraction of a light piece, resting on Badoer’s figures as quoted. Contested: a period description or depiction of planked river galleys would move the flotilla to the fleet of ships; and Badoer’s total of 330 ships for the royal fleet is probably inflated, since a letter from the Šabac campaign reportedly speaks of about 100 (Veszprémy 2009).",
  "Crossbows (RULES 6.16.3): the Arbalester is kept on the Czech companies that served Hungarian kings and lords from 1440 (Jiskra in Upper Hungary from 1440 and in Matthias’ service from 1462; the brotherhoods hired after Kostoľany, 1467; Engel 2001) and fought in the Hussite manner, whose wagon crews combined crossbowmen with handgunners (Durdík 1953, see the Bohemians’ design). The sources consulted give no crossbow corps of the kingdom’s own, so the evidence is indirect and flagged as thin.",
  "Tree decisions: Plate Mail Armor (for Matthias’ armoured foot), Arrowslits, Architecture, the Bombard Tower (for the post-1241 castles and the végvár line) and the Monastery’s Atonement, Redemption and Faith (for the kingdom of the ‘holy kings’: Stephen and Emeric canonised in 1083, Ladislaus in 1192; Pannonhalma, 996; the Pauline order) stay out for the power budget (RULES 6.14); Black Army’s +2 pierce armour partly stands in for Plate Mail Armor, and the Keep and Fortified Wall carry the castles.",
]
open_questions = []

[profile]
entity = "The Hungarians: the Conquest-era tribal confederation and Grand Principality (895–1000) and the Kingdom of Hungary of the Árpáds, Angevins, Sigismund, the Hunyadis and the Jagiellonians, to Mohács (1526)"
region = "Carpathian Basin"
window = "895–1526 (from the Conquest of the Carpathian Basin to Mohács, a terminal event soon after 1500 as RULES 6.16.17 allows; core 895–1490, from the Conquest to Matthias’ death; nothing in the design originates after 1500, the generic skeleton items of RULES 6.16.2 aside)"
