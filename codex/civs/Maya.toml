civ = "Mayans"
name = "Maya"
status = "draft"
label = "Archer civilization"
summary = "The Maya kingdoms (500–1524): scribes and astronomers replace the extra Villager, city-burning infantry the siege engines and sea trade the walls team bonus, divine kingship becomes the Town Center tech, the Plumed Archer reaches the Archery Range in the Imperial Age, the galleys become war canoes, and crossbows, the Halberdier and the Keep go."
ideas = [
  "N2: Identity by period: discounts on the Spearman-line and Skirmishers (Classic spear and atlatl) in Feudal and Castle Age, passing to Foot Archers in Imperial Age (Postclassic bow), as the analysis proposes.",
  "N3: A large trading and war canoe (the canoe met by Columbus's men off Guanaja in 1502, ‘as long as a galley’, with some 25 paddlers and a cargo of cacao, copper and cloth) replacing the Trade Cog and Galley-line; in N1 the Canoe and War Canoe renames give the Galley line the look of the Scenario Editor Canoe.",
  "N3: Royal captives (baak): kings bore titles such as ‘he of twenty captives’; captured enemies held at a Castle or Monastery would work like Relics.",
  "N2: A bow line split from the Crossbowman (RULES section 10); the Plumed Archer at the Archery Range in the Imperial Age is the N1 stop-gap.",
  "N3: Re-theme the Monastery and Relics (divine kings, k'uhul ajaw; ancestor shrines) and add a scribe or astronomer unit.",
  "N3: Sacbeob (raised causeways) giving speed to units moving between owned buildings.",
  "N3: Assault mechanics (scaling ladders, firing the town and its temples) as the American alternative to siege engines and to the Petard (RULES section 10).",
]
contested = [
  "When the bow and arrow reached the Maya lowlands: by the Late Classic or earlier (Aoyama's arrow points at Aguateca and Copán) or only in the Terminal Classic and Postclassic.",
  "The causes of the collapse of the southern lowland kingdoms (c. 750–950): drought, endemic war, population pressure and the crisis of divine kingship, in debated proportions (Demarest 2004; Kennett et al. 2012); Diamond's ecological thesis (2005) is disputed.",
  "The degree of hegemony of the Tikal and Calakmul ‘superstates’ (Martin & Grube) against autonomous cities.",
  "Relations between Tula and Chichén Itzá: ‘Toltec invasion’ or interaction within a shared style.",
  "Classic warfare: largely ritual and elite, or often destructive (the burning of Witzna in 697; Wahl et al. 2019).",
  "Late Classic population size in the light of LiDAR (Canuto et al. 2018).",
  "The extent and form of lowland wetland fields (raised, or ditched and drained), debated since the radar-based overestimates of the 1980s (Pope & Dahlin 1989; Beach et al. 2009); the field complexes of northern Belize are well documented (Beach et al. 2019).",
  "Periodisation: the Late Classic is usually dated c. 600–900 and the Postclassic from c. 900–1000, but where the Postclassic ends is a convention, since the conquest came piecemeal: the K'iche' fell in 1524, where the window ends, northern Yucatán in 1527–1546 and the Itza of Nojpetén only in 1697.",
  "The Eagle Warrior line: the eagle order is Nahua; Maya eagle and jaguar warriors appear at Chichén Itzá (Platform of the Eagles and Jaguars, Postclassic, with central Mexican influence). Kept as plausible (tech-tree audit), with Holcans as a Yucatec-Nahua hybrid. Decision: the Militia-line and the Eagle line keep their game names, since N1 renames a shared item only where a period term names the same function (RULES 6.16.15).",
]
open_questions = []

[profile]
entity = "The Maya kingdoms and city-states: the Classic lowland kingdoms (Tikal, Calakmul, Caracol, Copán, Palenque and others) and the Postclassic polities of Yucatán and the highlands (Chichén Itzá, Mayapán, the Yucatec provinces, the K'iche' and Kaqchikel kingdoms)"
region = "Yucatán Peninsula, Petén, Chiapas, Tabasco, Belize, Guatemala, western Honduras and El Salvador"
window = "500–1524 (the Classic kingdoms and the Postclassic, to the Spanish conquest of the K'iche', 1524, a terminal event soon after 1500 as RULES 6.16.17 allows; core 500–1500; nothing in the design originates after 1500, the generic skeleton items of RULES 6.16.2 aside)"
sources = [
  "Diego de Landa, Relación de las cosas de Yucatán (c. 1566)",
  "Bernal Díaz del Castillo, Historia verdadera (on Champotón, 1517, and Tabasco, 1518)",
  "Ferdinand Columbus, The Life of the Admiral Christopher Columbus (on the Guanaja canoe, 1502)",
  "Popol Vuh (Ximénez manuscript, c. 1701)",
  "Dresden Codex",
  "Simon Martin & Nikolai Grube, Chronicle of the Maya Kings and Queens (2nd ed., 2008)",
  "Simon Martin, Ancient Maya Politics (2020)",
  "Michael D. Coe, Breaking the Maya Code (1992)",
  "Arthur Demarest, Ancient Maya (2004)",
  "Kazuo Aoyama, ‘Classic Maya warfare and weapons’, Ancient Mesoamerica 16 (2005)",
  "David Wahl et al., ‘Paleoenvironmental, epigraphic and archaeological evidence of total warfare among the Classic Maya’, Nature Human Behaviour (2019)",
  "David L. Webster, Defensive Earthworks at Becan, Campeche, Mexico: Implications for Maya Warfare (Middle American Research Institute, Publication 41, 1976)",
  "Joseph W. Ball, The Archaeological Ceramics of Becan, Campeche, Mexico (Middle American Research Institute, Publication 43, 1977)",
  "Arlen and Diane Chase, ‘Scale and intensity in Classic period Maya agriculture: terracing and settlement at the garden city of Caracol’ (1998)",
  "B. L. Turner II & Peter Harrison (eds.), Pulltrouser Swamp (1983)",
  "Timothy Beach et al., ‘Ancient Maya wetland fields revealed under tropical forest canopy from laser scanning and multiproxy evidence’, PNAS 116 (2019)",
  "Marcello A. Canuto et al., ‘Ancient lowland Maya complexity as revealed by airborne laser scanning of northern Guatemala’, Science 361 (2018)",
  "France V. Scholes & Ralph L. Roys, The Maya Chontal Indians of Acalan-Tixchel (1948)",
  "Anthony P. Andrews, Maya Salt Production and Trade (1983)",
  "Ross Hassig, Trade, Tribute, and Transportation (1985)",
  "Elliot M. Abrams, How the Maya Built Their World: Energetics and Ancient Architecture (1994)",
  "Matthew Restall, Maya Conquistador (1998)",
]

[[bonus]]
text = "Universities work +33% faster; Monasteries work +20% faster"
kind = "other"
level = 1
change = "new"
replaces = "Start with +1 Villager, but -50 food"
precedent = "Universities work +80% faster (Malians team bonus), at a lower magnitude; Monasteries work +20% faster (Lithuanians team bonus), at the same magnitude, the only Monastery work rate in the game, so the Monastery half cannot go higher in level 1 (RULES section 5)"
basis = "The Maya developed the most complete writing system of the pre-Columbian Americas, kept by court scribes (aj tz'ib), and an astronomy precise enough for the Venus and eclipse tables of the Dresden Codex (Coe 1992; Martin & Grube 2008). The extra starting Villager it replaces was a balance device with no historical link (rated unfounded)."
relevance = "Writing, the calendar and astronomy are the best-known achievements of the Maya and the core of their identity."

[[bonus]]
text = "Resources last +15% longer"
kind = "economic"
level = 1
change = "kept"
precedent = "Resources last +15% longer (Mayans)"
basis = "Maya cities managed their landscape intensively and over centuries: forest gardens, terraces covering whole hillsides around Caracol (Chase & Chase 1998), wetland fields and reservoirs such as those of Tikal. Read as careful long-term use of resources."
relevance = "Long-term management of a tropical landscape sustained dense populations for centuries, as LiDAR survey has shown (Canuto et al. 2018)."
contested = "The popular thesis that over-exploitation of the environment caused the Classic collapse is disputed."

[[bonus]]
text = "Foot Archers cost -10/20/30% in Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Foot Archers cost -10/20/30% in Feudal/Castle/Imperial Age (Mayans)"
basis = "Bows with flint-tipped arrows were the main weapon of Postclassic Yucatec armies (Landa), and Maya archers and slingers drove the Spaniards off at Champotón in 1517 (Bernal Díaz). The discount grows with each Age, following the growing role of the bow from the Late Classic to the Postclassic (Aoyama 2005)."
relevance = "The bow armed the mass of Postclassic Maya warriors, so cheap archers render an army of bowmen."
contested = "The Classic date of the bow is debated; Classic imagery is dominated by spears and atlatls."

[[bonus]]
text = "Infantry +1/+2/+3 attack vs. buildings in Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "new"
precedent = "Infantry +1/+2/+3 attack vs. buildings in Feudal/Castle/Imperial Age (Goths)"
basis = "Classic inscriptions record the burning (puluuy) of enemy cities among the outcomes of war, beside the capture of lords (chuhkaj) and the ‘downfall’ (jubuuy) of rival kingdoms (Martin & Grube 2008); at Witzna, lake sediments confirm the fire that a Naranjo stela dates to 697 (Wahl et al. 2019). With siege engines removed, fire-raiding infantry is how the Maya take towns (RULES 6.11). Making Arson and cotton armour free would add no damage against buildings, so instead Arson stays in the tree and Quilted Cotton Armor is added to it. The Aztecs and the Gaels' design use the same bonus, while the Goths' design drops it (RULES 6.7)."
relevance = "Classic inscriptions record the burning of rival cities among the outcomes of war, and Postclassic towns fell to assault and fire; it is the civ's substitute for siege engines."
contested = "Burnings are comparatively rare in the inscriptions, and Witzna is the best-documented case; the capture of lords, tribute and overlordship were the usual aims (see the civ-level note on Classic warfare)."

[[bonus]]
text = "Walls cost -50%"
kind = "military"
level = 1
change = "changed"
precedent = "Walls cost -50% (Mayans team bonus), as a passive bonus"
basis = "Maya cities were often fortified, above all from the Late Classic on: the hastily raised walls of Dos Pilas and its neighbours in the 760s (Demarest 2004), the walls of Ek' Balam, and in the Postclassic the wall of some 9 km around Mayapán and the walled site of Tulum. The tradition was old: the ditch and parapet of Becan date from the end of the Late Preclassic or the beginning of the Early Classic (Webster 1976; Ball 1977). Moved from the team bonus, because walls protected only their builders (RULES 6.2)."
relevance = "Fortifying cities spread as warfare intensified from the Late Classic on, and the last great Maya capital, Mayapán, was a walled city."

[[bonus]]
text = "Plumed Archer available at the Archery Range in Imperial Age"
kind = "military"
level = 1
change = "new"
precedent = "Condottiero available at the Barracks in Imperial Age (Italians team bonus); Genitour available at the Archery Range starting in Castle Age (Berbers team bonus)"
basis = "This bonus is a RULES 6.11 substitution rather than a separate trait. The bow was the main weapon of the Postclassic Maya (Landa; Bernal Díaz on Champotón, 1517); the crossbow was unknown in the Americas, so the Crossbowman and Arbalester are removed, and the Plumed Archer, which stands for the ordinary Maya bowman (its plumes and speed are game conventions), becomes the Imperial-Age foot archer of the Archery Range in their place. The Imperial Age follows the Italian precedent and keeps the main unique unit from becoming a cheap Castle Age mass unit, so in the Castle Age the Archer-line stops at the Archer. It is the civ's sixth passive, at the proposed cap of nine elements (6 passives + 3 techs). Decision: this substitution is kept rather than Castle Age availability, which would make the unique unit a cheap mass unit, or a level-2 Archery Range tech, which would spend a tech slot on a substitution; the sacbeob causeways stay an N3 idea."
relevance = "The bow was the weapon of the Postclassic Maya levies (Landa), and an Imperial-Age foot archer at the Archery Range keeps that weight in the late game."

[team_bonus]
text = "Trade Units generate +10% gold"
level = 1
change = "new"
replaces = "Walls cost -50%"
precedent = "Trade Units generate +25% gold (Spanish team bonus), at a lower magnitude"
basis = "Postclassic Maya traders, above all the Chontal of Tabasco and Acalan, carried cacao, cotton cloth, salt, honey and obsidian by canoe around Yucatán and traded at ports of trade such as Xicalanco and Cozumel, where Nahua merchants also came (Scholes & Roys 1948); off Guanaja in 1502 Columbus's men met a trading canoe ‘as long as a galley’ laden with cacao, copper and cloth (Ferdinand Columbus), and the salt beds of northern Yucatán supplied much of Mesoamerica (Andrews 1983). RULES 6.2: trade that benefited neighbours. The walls discount it replaces protected only their builders and becomes a passive bonus. The same team bonus is in the Armenians', Ethiopians', Rus' and Tamils' designs (RULES 6.7). Identical team-wide effects count once per team, and trade-gold team bonuses count as one at the highest value present (RULES 6.16.12)."
relevance = "Seaborne trade tied the Postclassic Maya to the rest of Mesoamerica and made the ports and salt beds of Yucatán a hub of exchange."

[[unique_unit]]
name = "Plumed Archer"
model = "Plumed Archer"
building = "Castle"
level = 1
change = "kept"
basis = "No corps of ‘plumed archers’ is documented: the unit stands for the Postclassic Maya bowman, with the feathered headdresses worn as insignia by warriors of rank across Mesoamerica (Landa; the Bonampak murals, c. 790). Its high speed is a game invention. Also trainable at the Archery Range in the Imperial Age (see bonuses)."
relevance = "The bow was the main weapon of the Postclassic Maya, who drove off the first Spanish expeditions with it (Champotón, 1517)."
contested = "Rated stretched by the analysis: generic unit, invented speed."

[[unique_tech]]
name = "Hul'che Javelineers"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Skirmishers fire an additional projectile"
level = 1
change = "kept"
precedent = "Hul'che Javelineers (Mayans)"
basis = "Hul'che (hulche) is the Yucatec Maya name of the spear-thrower: a Yucatec specimen in the Smithsonian is catalogued as ‘(Hulche) or spear-thrower (atlatl)’; the colonial dictionaries (the Calepino de Motul; the Diccionario Maya Cordemex, 1980) have not been checked. Warriors with atlatls and darts fill the carvings and murals of Terminal Classic and Early Postclassic Chichén Itzá (Temple of the Warriors), and the Spaniards met darts or javelins at Champotón in 1517 (Bernal Díaz). The extra projectile is an abstraction of dart volleys; the Aztec Atlatl gives range and attack instead (intended overlap, RULES 6.7). As a weapon tradition it is not a datable moment: it is a kept existing tech, held as a tech by the effect-size tie-break (RULES 6.2.4), a flagged fallback (RULES 6.16.19 b). Castle Age, before the Late Postclassic holkan of the Imperial tech (RULES 6.4)."
relevance = "Before the bow prevailed, the atlatl was, with the spear, the weapon of Maya war imagery, culminating in the warrior art of Chichén Itzá, the leading power of northern Yucatán in the Terminal Classic (c. 850–1000): it carries the earlier half of the window, as the archer bonus carries the Postclassic."
contested = "Classic images of the atlatl often show Teotihuacan-style warriors (Tikal Stela 31, 445), before the time window."

[[unique_tech]]
name = "Holcans"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Eagle Warriors +40 HP"
level = 1
change = "kept"
precedent = "Holcans (Mayans)"
basis = "The holkan were the soldiers of Postclassic Yucatán, paid while on campaign and led by the war captain (nacom), who was elected for three years, as Landa describes. The tech replaced the old ‘El Dorado’, a Muisca myth, with the same effect."
relevance = "The holkan were the paid core of Postclassic Yucatec armies under an elected war captain (nacom), as Landa describes."
contested = "Applying a Yucatec term to the Nahua eagle order makes a hybrid; the effect is kept because the Eagle line is the Maya's light infantry, and an existing tech with an identical effect stays level 1."

[[unique_tech]]
name = "K'uhul Ajaw"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Town Centers +100% HP and work +15% faster"
level = 2
change = "new"
precedent = "Town Centers and Docks +100% HP and work +5/10/15/20% faster in Dark/Feudal/Castle/Imperial Age (Persians), narrowed to Town Centers at the Castle Age rate (+15%), the age in which the tech is researched. No existing unique tech renders a form of government of this kind. The Armenians', Bengalis' and Bohemians' designs use the same pattern at +10% for their capitals; the Castle Age rate also keeps divine kingship from reading as a copy of them (RULES 6.7)."
basis = "Classic Maya kingdoms were ruled by ‘holy lords’ (k'uhul ajaw) from palace and acropolis complexes at the heart of each city, such as the Central Acropolis of Tikal and the Palace of Palenque; the king led in war, performed the calendar rituals, commissioned temples and stelae and drew labour and tribute from his polity (Martin & Grube 2008; Martin 2020). Stronger and busier Town Centers render the royal seat as the hub of the city-state. Divine kingship is a state institution, so it is the Town Center tech (RULES 6.2)."
relevance = "Divine kingship organised Classic Maya politics, war and building, and its crisis brought down the Classic kingdoms (c. 750–950)."
contested = "Postclassic Yucatán was ruled by councils of lineage lords rather than divine kings (the joint government of Mayapán; the provincial lords, halach uinic and batab, of Landa's time); the tech renders the Classic institution."

[tree]
add = ["Slinger", "Gambesons"]
remove = [
  "Siege Workshop", "Battering Ram", "Capped Ram", "Siege Ram", "Mangonel", "Onager",
  "Scorpion", "Heavy Scorpion", "Siege Tower", "Trebuchet",
  "Crossbowman", "Arbalester", "Thumb Ring",
  "Halberdier",
  "Galleon", "Carrack", "Catapult Galleon",
  "Block Printing", "Keep",
]

[tree.basis]
"Slinger" = "The Maya who fought the first Spanish expeditions in 1517 used slings as well as bows and lances (Bernal Díaz, on Champotón). The regional Slinger, shared with the Aztecs, the Inca, the Muisca and the Mapuche, replaces part of the role of the removed crossbows."
"Gambesons" = "Quilted cotton armour is well documented among the Maya: Landa describes jackets of cotton quilted in two layers with coarse salt as very strong, and the Spaniards met cotton-armoured warriors in 1517. The Maya have the Militia-line but lacked the tech; it is added and renamed Quilted Cotton Armor."
"Siege Workshop" = "The Maya built no siege engines: cities fell to assault, fire and blockade. Removing the workshop removes all its units; infantry with the anti-building bonus, Arson, Sappers and Petards replace them (owner's decision, RULES 6.16.5; RULES 6.11 and section 10). Every Castle must then be taken by units standing in its arrow fire, so castle-breaking is slow; this is accepted until an N2/N3 assault unit exists (ideas), with no compensating bonus (RULES 6.16.13). The Petard, a 16th-century gunpowder charge, stays unrenamed as a flagged generic abstraction of assault parties with fire, outside the one-late-element limit (RULES 6.16.2)."
"Battering Ram" = "Removed with the Siege Workshop: there were no rams and no wheeled vehicles."
"Capped Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Siege Ram" = "Removed with the Siege Workshop (see Battering Ram)."
"Mangonel" = "Removed with the Siege Workshop: no torsion or traction artillery existed in the Americas."
"Onager" = "Removed with the Siege Workshop (see Mangonel)."
"Scorpion" = "Removed with the Siege Workshop: no bolt-throwers existed in the Americas."
"Heavy Scorpion" = "Removed with the Siege Workshop (see Scorpion)."
"Siege Tower" = "Removed with the Siege Workshop: a wheeled assault tower."
"Trebuchet" = "Counterweight artillery never existed in the Americas."
"Crossbowman" = "The crossbow was unknown in the pre-Hispanic Americas, which have neither crossbow tier (RULES 6.16.3); Maya missile troops used bows, slings and atlatls. The Plumed Archer becomes available at the Archery Range in the Imperial Age in its place (bonus). In the current game the Bulgarians also lack crossbows (so do the current Spanish; the Castilian and Bulgarian designs restore the Crossbowman)."
"Arbalester" = "Removed with the Crossbowman (see there)."
"Thumb Ring" = "No thumb rings or thumb draw are attested in the Americas, so the tech goes (RULES 6.16.4); the game's Britons, the archer civ par excellence, also lack it."
"Halberdier" = "Removed under the codex convention for the American civs (RULES 6.16.6, the owner's decision on their power budget): a playability line, not a historical one, since the kept Pikeman bears as European a name; the American spear line stops at the Pikeman, as the game already does for the Aztecs and Muisca. The Maya met no cavalry before the Spanish expeditions (Centla, 1519), and Spearman and Pikeman remain for the spear of Classic imagery."
"Galleon" = "Ocean-going sailing warships were unknown; Maya seafaring used large dugout canoes (the canoe seen off Guanaja in 1502; the Chontal canoe trade, Scholes & Roys 1948). Boat tier (RULES 6.16.1), resting on these dugouts: the high-seas sailing ships (Galleon, Carrack) are removed and the siege ship goes with the siege engines, while the Galley (renamed Canoe), Fire Ship, Demolition and Hulk lines stay with their tiers as a generic abstraction of canoe fleets for water maps; the demolition ships are generic post-1500 items kept as flagged abstractions (RULES 6.16.2)."
"Carrack" = "High-castled sailing warships were unknown (see Galleon)."
"Catapult Galleon" = "A sailing ship carrying a catapult: both a European ship type and a siege engine."
"Block Printing" = "There was no printing: Maya books (codices of bark paper) were painted by hand, and Landa burned many of them at Maní in 1562. With no equivalent for the function the tech is removed (18 of the game's 56 civs already lack it); the scribes are represented by the University and Monastery bonus."
"Keep" = "No defensive Maya stone tower is documented: the four-storey tower of the Palace of Palenque was a palace lookout or observatory, and the small corner structures of the Tulum wall are shrines or watch posts, which the Watch Tower and Guard Tower stand for. Region-wide tower policy: the Keep, a stone tower, stays only where stone towers are documented, which among the American civs means the Inca (the towers of Sacsayhuamán)."

[[rename]]
from = "Horse Collar"
to = "Raised Fields"
level = 1
basis = "There were no draft animals. Raised and channelised wetland fields, such as those of Pulltrouser Swamp (Turner & Harrison 1983) and the field complexes of north-western Belize mapped by LiDAR and multiproxy study (Beach et al. 2019), intensified lowland farming: the Maya counterpart of the Aztec chinampas. The same rename is used for the Muisca and the Mapuche."
contested = "The lowland-wide extent and the form (raised, or ditched and drained) of Maya wetland fields are debated since the radar-based overestimates of the 1980s (Pope & Dahlin 1989; Beach et al. 2009); the fields of northern Belize are well documented."

[[rename]]
from = "Heavy Plow"
to = "Terraces"
level = 1
basis = "There was no plough. Agricultural terraces covered whole hillsides around Caracol, documented by ground survey and excavation (Chase & Chase 1998) and later shown in full by LiDAR. Same rename as for the Aztecs."

[[rename]]
from = "Crop Rotation"
to = "Milpa"
level = 1
basis = "Agreed rename (Crop Rotation → Milpa), applied to both Mesoamerican civs: the milpa, intercropping maize, beans and squash, is the basis of Maya farming to this day. ‘Milpa’ is Nahuatl (mīlli with -pan) but is the standard term of Mexican Spanish and of Maya scholarship, as ‘andenes’ is Spanish for Andean terraces. Decision: it is kept rather than the Yucatec kool, although the region otherwise avoids giving one people's word to another. The tier order is a game convention: historically the milpa came first, and raised fields and terraces intensified it later."

[[rename]]
from = "Gambesons"
to = "Quilted Cotton Armor"
level = 1
basis = "Same effect as Gambesons. Landa describes Maya jackets of quilted cotton as very strong. The Nahuatl name ichcahuipilli used for the Aztecs is not applied to the Maya, to avoid giving one people's word to another."

[[rename]]
from = "Iron Casting"
to = "Flint Points"
level = 1
basis = "There was no iron. Maya lances, axes and arrows were tipped with knapped flint (chert), as Landa describes, and with obsidian imported from highland sources such as El Chayal and Ixtepeque (Aoyama 2005). Same effect as Iron Casting. The Aztec counterpart is Obsidian Blades. The other Blacksmith tiers keep their generic names as a flagged generic equipment level (RULES 6.16.6): Forging and Blast Furnace, although there was no iron metallurgy (metal, copper bells and axes, arrived late and mostly as imports); Bodkin Arrow, although arrows were tipped with flint and obsidian, not forged iron; Scale Mail, Chain Mail and Plate Mail Armor, although there was no metal armour (Maya warriors wore quilted cotton, which renames Gambesons, and carried flexible or hide shields); and Ring Archer Armor, beside Padded and Leather Archer Armor, which have real equivalents in cotton and hide. Chemistry stays for its +1 ranged attack as a flagged abstraction, although the Maya had no gunpowder."

[[rename]]
from = "Wheelbarrow"
to = "Tumplines"
level = 1
basis = "There were no wheeled vehicles; Maya porters, like all Mesoamerican porters, carried loads with a tumpline across the forehead. Same rename as for the Aztecs."

[[rename]]
from = "Hand Cart"
to = "Carrying Frames"
level = 1
basis = "Porters slung wooden carrying frames from the tumpline throughout Mesoamerica (Hassig 1985). Same rename as for the Aztecs. The Trade Cart keeps its generic name and look as a flagged abstraction of porter trains and the canoe trade (RULES 6.16.6), since there were no wheeled vehicles."

[[rename]]
from = "Coinage"
to = "Cacao Currency"
level = 1
basis = "There were no coins: Landa says the Yucatec Maya traded salt, cloth and slaves for cacao and stone beads, which were their money. Same rename as for the Aztecs. Banking (tributes to other players are free) keeps its generic name as a flagged abstraction (RULES 6.16.6), since no Maya equivalent with a period term was found."

[[rename]]
from = "Guilds"
to = "P'olom"
level = 1
basis = "Same effect as Guilds (Market trading fee reduced to 15%). The Yucatec word for merchant was p'olom (ppolom in colonial spelling), and merchant lords led the canoe trade of the Chontal of Acalan, whose ruler was its chief merchant (Scholes & Roys 1948). The Maya counterpart of the agreed Aztec Pochteca, a rename beyond the agreed list applied under RULES 6.16.6."

[[rename]]
from = "Galley"
to = "Canoe"
model = "Canoe"
level = 1
basis = "Maya fleets were dugout canoes: off Guanaja in 1502 Columbus's men met a trading canoe ‘as long as a galley’ with some 25 paddlers (Ferdinand Columbus), the Chontal of Tabasco and Acalan carried the coastal trade in canoes (Scholes & Roys 1948), and in 1518 armed warriors in canoes met Grijalva's ships off Tabasco (Bernal Díaz, who says he sailed with him). The Scenario Editor Canoe, a small warship introduced in The Forgotten (RULES section 5), gives the Galley the look of a dugout war canoe; the Galley keeps its stats, and the Canoe's look, scale, attack and role must be checked in game. Same rename as for the Aztecs, Mapuche and Tupi, and outside the Americas in the Malians' and Avars' designs."

[[rename]]
from = "War Galley"
to = "War Canoe"
model = "Canoe"
level = 1
basis = "Upgrade tier of the renamed Galley, with the same Canoe look (see Galley)."

[architecture]
set = "Central American"
level = 1
change = "kept"
basis = "The stepped temples, palaces and corbel-vaulted stone buildings of the existing Mesoamerican set fit the Maya. Treadmill Crane, which the Maya hold in the game, keeps its generic name as a flagged abstraction of faster building (RULES 6.16.6): there were no cranes or treadwheels, and these buildings were raised by human labour alone, with stone quarried by hand and carried by porters without wheels or draft animals; energetic studies of Copán's buildings measure that work in person-days (Abrams 1994). Decision: it is flagged rather than renamed. The Aztecs' rename, Coatequitl, is a Nahuatl term, which the region avoids giving to another people (see Quilted Cotton Armor; Milpa, the standard term of Maya scholarship, is the one exception), and no Maya term for a labour draft with a period source was found in the sources used here."
