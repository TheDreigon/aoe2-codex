civ = "Berbers"
name = "Berbers"
status = "draft"
label = "Cavalry and Naval civilization"
summary = "Berbers as the Amazigh of the Maghreb, centred on the Almoravids and Almohads (683–1554): the Almoravid spearmen (Murabit) replace the Camel Archer, Yusuf's black guard and Abd al-Mu'min's land survey become the techs, rammed-earth (tabiya) walls a passive, the Genitour a regional unit, and the Hand Cannoneer and Cannon Galleons leave."
ideas = [
  "N2: A Murabit with its own model (Almoravid infantry with long spear, veil and lamt shield) instead of the Andean Kamayuk graphic.",
  "N2: Tabl: the Almoravid war drums of Zallaqa (1086) as an aura that slows nearby enemies or hastens friendly infantry.",
  "N2: Ribat: a fortified Monastery (the Fortified Church's mechanics on a Maghrebi Monastery graphic) for the ribat and the murabitun of Ibn Yasin's movement, from which the Almoravids took their name (the Ifriqiyan ribats of Monastir, 796, and Sousse, 821, were Abbasid and Aghlabid works in a Berber land). In N1 the Monastery keeps its generic name (RULES 6.16.9).",
  "N2: Huffaz: the corps of young men Abd al-Mu'min had trained in Almohad doctrine and in riding, archery, swimming and rowing to staff his state and army (Bennison, 2016), as a technology once a second Almohad moment has a slot.",
  "N3: An al-Andalus civ (Umayyad Córdoba, the taifas, Nasrid Granada), today represented only in its conquest and Umayyad province (711–750), by the Arabs, and in its Almoravid and Almohad periods, by the Berbers.",
]
contested = [
  "‘Berber’ as a category shaped by medieval Arab genealogists and historians (Ramzi Rouighi, Inventing the Berbers, 2019). The civ keeps the game's name, the usual one in English scholarship (Brett and Fentress, The Berbers, 1996), with the endonym Amazigh (plural Imazighen) in its entity (RULES section 4 and 6.16.15); ‘Maghrebis’ would also cover the Arabic-speaking towns.",
  "The date of Kusaila's victory over Uqba ibn Nafi at Tahudha, near Biskra, which opens the window: 683 in most accounts, 682 in some.",
  "The Almoravid conquest of Ghana in 1076 (Conrad and Fisher, ‘The Conquest that Never Was’, 1982–1983).",
  "The impact of the Hilalian invasions of the 11th century (Ibn Khaldun against Poncet and Brett).",
  "The earliest gunpowder in the Maghreb: Ibn Khaldun's Marinid engine with powder at Sijilmasa (1274) is doubted, the Marinid defence of Algeciras (1342–1344) is secure, and Maghrebi hand firearms are documented only from the early 16th century. The Nasrid case of Baza (1324/1325) belongs to al-Andalus, not to this civ.",
  "Whether Ibn Yasin's ribat was a real fortified place or the name of a movement.",
  "The origin of Tariq ibn Ziyad (Berber in most sources) and the make-up of the army of 711.",
  "Mounted archers (Cavalry Archer, Heavy Cavalry Archer, Thumb Ring) stay in the tree for the Ghuzz, Turkish horse archers who came west with Qaraqush from the 1170s and were taken into Almohad service after Ya'qub al-Mansur defeated them (1187) (Bennison, 2016); how numerous they were and how long they lasted is uncertain.",
  "The narratives of Zallaqa/Sagrajas (1086) are 14th-century and literary (Rawd al-qirtas, al-Hulal al-mawshiyya): the decisive role they give Yusuf's black guard, and its numbers, cannot be checked against contemporary accounts.",
  "Abd al-Mu'min's survey of 1159–1160 is reported by Ibn Abi Zar (14th century); how fully it was carried out is unknown.",
]
open_questions = []

[profile]
entity = "The Amazigh (Berber) peoples of the Maghreb and the states they founded: Zirids, Almoravids, Almohads, Marinids, Zayyanids, Hafsids and Wattasids"
region = "The Maghreb and the western Sahara, with al-Andalus under Almoravid and Almohad rule"
window = "683–1554 (from Kusaila's victory over Uqba ibn Nafi at Tahudha to the fall of the Wattasids, a terminal event soon after 1500 as RULES 6.16.17 allows; core 1040–1269: Almoravids and Almohads; nothing in the design originates after 1500, the generic skeleton items of RULES 6.16.2 aside)"
sources = [
  "al-Bakri, Kitab al-masalik wa'l-mamalik (1068), in N. Levtzion and J. F. P. Hopkins, Corpus of Early Arabic Sources for West African History (1981)",
  "Ibn Khaldun, Kitab al-'ibar (Histoire des Berbères, trans. de Slane)",
  "Ibn Abi Zar, Rawd al-qirtas",
  "al-Hulal al-mawshiyya (14th century)",
  "Ibn Idhari, al-Bayan al-mughrib",
  "al-Idrisi, Nuzhat al-mushtaq",
  "Crónica de Alfonso XI (siege of Algeciras, 1342–1344)",
  "Pliny the Elder, Natural History XXXV (earth walls packed in frames in Africa and Spain)",
  "Ambrosio Huici Miranda, Las grandes batallas de la Reconquista durante las invasiones africanas (1956)",
  "Michael Brett and Elizabeth Fentress, The Berbers (1996)",
  "Ronald A. Messier, The Almoravids and the Meanings of Jihad (2010)",
  "Amira K. Bennison, The Almoravid and Almohad Empires (2016)",
  "Hugh Kennedy, Muslim Spain and Portugal (1996)",
  "Joseph F. O'Callaghan, The Gibraltar Crusade (2011)",
  "Ramzi Rouighi, Inventing the Berbers (2019)",
]

[[bonus]]
text = "Trade Units generate +15% gold"
kind = "economic"
level = 1
change = "new"
replaces = "Villagers move +5% faster in Dark Age, +10% faster starting in Feudal Age"
precedent = "Trade Units generate +25% gold (Spanish team bonus)"
basis = "The Almoravid movement rose among the Sanhaja who held the western trans-Saharan routes; they took Sijilmasa and Awdaghust (1054–1055) and struck gold dinars so trusted that Christian Iberia copied them as morabitinos (maravedís), minted in Portugal by Sancho I (Messier, 2010). The villager-speed bonus had only a stretched link with pastoral mobility."
relevance = "Control of the Saharan gold routes funded the Almoravid and Almohad empires and made their dinar the coin of the western Mediterranean."

[[bonus]]
text = "Shepherds work +25% faster"
kind = "economic"
level = 1
change = "new"
precedent = "Shepherds work +25% faster (Britons)"
basis = "Herding, beside the farming and tree crops of the Tell, the Kabylia and the oases, was central to many Berber groups: the camel and sheep nomadism of the Sanhaja and Zenata and the transhumance of the Atlas Masmuda, on which Ibn Khaldun builds his contrast between nomad and settled peoples (Brett and Fentress, 1996)."
relevance = "The nomadic Sanhaja and Zenata, herders first, founded the Almoravid and Marinid states; pastoralism shaped Berber society and its dynasties."

[[bonus]]
text = "Stable Units cost -15/20% in Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Stable Units cost -15/20% in Castle/Imperial Age (Berbers)"
basis = "Horses were plentiful (the hardy Barb) and light horsemen were raised in large numbers from the tribes, far more cheaply than the heavy feudal cavalry of their Iberian enemies."
relevance = "Tribal light cavalry, above all the Zenata, was the most constant Berber military tradition, from the Marinid armies to the Granada frontier."

[[bonus]]
text = "Ships move +10% faster"
kind = "military"
level = 1
change = "kept"
precedent = "Ships move +10% faster (Berbers)"
basis = "Light Maghrebi galleys: the Almoravid and Almohad fleets, built in Maghrebi and Andalusi arsenals and often led by Andalusi admirals such as the Banu Maymun of Almería, were respected enough for Saladin to ask for Almohad help in 1189–1190; the Marinid fleet destroyed the Castilian fleet of Alfonso Jofre Tenorio off Gibraltar (April 1340) before the Salado campaign (O'Callaghan, 2011), and Hafsid corsairs of Bougie and Mahdia provoked the Franco-Genoese crusade against Mahdia (1390). The great corsair age of Salé, Algiers and Tunis came later, under the Moriscos and the Ottomans. The navy is a fleet of ships (RULES 6.16.1). The Shipwright keeps its generic name: it is neither foreign nor anachronistic for the civ (RULES 6.16.15), although the Almohad and Hafsid arsenals (dar al-sina'a) could also carry the Arabs' name."
relevance = "Every Almoravid, Almohad and Marinid intervention in al-Andalus depended on crossing and holding the Strait, so Maghrebi sea power shaped their history."

[[bonus]]
text = "Stone Walls cost -50%"
kind = "military"
level = 1
change = "new"
precedent = "Walls cost -50% (Mayans team bonus), narrowed to Stone Walls and used as a passive bonus: a narrower set of targets, so level 1 (RULES section 5); the Maya design uses the full effect as a passive"
basis = "Berber dynasties walled their capitals and frontier towns in tabiya, rammed earth mixed with lime and gravel and packed into wooden formwork, which raised long circuits quickly and cheaply: Ali ibn Yusuf walled Marrakesh in 1126–1127, the Almohads built the walls of Rabat with the Bab er-Rouah and refortified al-Andalus (the walls of Seville; the Alcazaba of Badajoz with its albarrana towers, 1169) (Bennison, 2016), and the Marinids raised the siege-city of al-Mansura before Tlemcen (1299–1307; Ibn Khaldun, Kitab al-'ibar). Cheaper Stone Walls translate a technique that let these states enclose whole cities; Palisade Walls are left out, since the basis is rammed earth, not timber. It is a passive, not the team bonus, because the walls protected only their builders (RULES 6.2), and it is the historically grounded extra that the level-1 review (section 6, CQ14) names for the Berbers under the power-floor convention (RULES 6.16.13)."
relevance = "Rapidly raised rammed-earth circuits let the Almoravids, Almohads and Marinids hold the Maghreb and al-Andalus from fortified capitals and frontier towns; they are the visible military architecture of these dynasties."
contested = "Rammed earth was not a Berber invention: Pliny already describes earth walls packed in frames in Africa and Spain (Natural History XXXV.169), and al-Andalus built in tabiya as much as the Maghreb, so the bonus rests on the scale at which the Berber dynasties used it rather than on an invention."

[team_bonus]
text = "Genitour available at the Archery Range starting in Castle Age"
level = 1
change = "kept"
precedent = "Genitour available at the Archery Range starting in Castle Age (Berbers team bonus)"
basis = "Riding à la gineta, with short stirrups, javelins and leather shield (adarga), passed from Zenata and Granadan horsemen to Castile and Portugal, and Zenata volunteers (ghuzat) served Nasrid Granada: one of the best-founded team bonuses in the game. Jinete/ginete comes from Zanati, ‘Zenata’. The Genitour stays in the Berber tree, but as a regional unit shared with the Castilians, Portuguese and Lithuanians (owner's decision, RULES 6.16.10), so it no longer counts as a Berber unique unit (see dropped)."
relevance = "The jineta style was the Berbers' best-known military gift to their neighbours: the word and the cavalry of the Reconquista frontier come from the Zenata."
contested = "The ginete also charged with the lance; the Genitour has no close-range attack."

[[unique_unit]]
name = "Murabit"
model = "Kamayuk"
building = "Castle"
level = 1
change = "new"
replaces = "Camel Archer"
basis = "al-Bakri (1068) describes the early Almoravids fighting on foot in close ranks, the front rank with long spears and the ranks behind with javelins; in a separate passage he records the prized lamt shields of antelope hide made at Nul Lamta and sought in the Maghreb and al-Andalus, the shield this infantry carried. The Inca Kamayuk, a spearman with long reach strong against cavalry, is the nearest existing unit; the Mapuche Colihue Lancer and the Ethiopians' Chewa Spearman use it too. Named after the al-murabitun, ‘the people of the ribat’, who gave the Almoravids their name. It replaces the Camel Archer: no camel-mounted archer is attested as a Maghrebi troop type (camels served the Saharan Sanhaja and the army's baggage, and combat relied on spears, javelins and swords)."
relevance = "The Almoravid spear infantry built the empire that united the western Maghreb and al-Andalus; it is the defining military trait of the civ's core dynasty."
contested = "The Kamayuk model is Andean (see the N2 idea), and ‘murabit’ named members of the movement, not a troop type. Which antelope gave the lamt hide (oryx or addax), and how widely lamt shields were used beyond the Almoravid elite, is uncertain. The Kamayuk fits better than the alternatives: a restored Camel Archer has no attested referent, the Saxons' Hearth Troop (javelin, then melee) renders only the rear ranks, and the Scenario Editor's Heavy Pikeman, a Pikeman with 20 more HP and a European look, lacks the reach that renders the long spears."

[[unique_tech]]
name = "Taksir"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Farmers slowly generate gold in addition to food"
level = 1
change = "new"
precedent = "Burgundian Vineyards (Farmers slowly generate gold in addition to food) (Burgundians, kept there at the Mill; the Persians share it as Kharaj, the Aztecs as Calpixqueh and the Tatars as Yarlyk, and the Bengalis have it as a passive): an existing unique tech, shared and renamed with an identical effect and age (Castle). Reuse is accepted in level 1, each copy resting on its own history (RULES 6.16.12)."
basis = "In 1159–1160 Abd al-Mu'min had the Maghreb surveyed (taksir) from Barqa to the Sus, deducted a third for mountains, rivers and wasteland, and assessed the rest for the land tax (kharaj), payable in grain and coin (Ibn Abi Zar, Rawd al-qirtas, year 555 AH); it gave the Almohad caliphate its fiscal base (Bennison, 2016). Farmers whose fields yield coin to the treasury translate the assessment, as for the Persians' Kharaj, the same land tax. It takes Kasbah's slot (see dropped). The shared tech is kept rather than a new fiscal tech (level 2) with ‘All gold income +10% faster’, the gold half of Grand Trunk Road, which the Arabs' design now uses for Abd al-Malik's coinage."
relevance = "The Almohads were the only Berber dynasty to unite the whole Maghreb and al-Andalus under one government, and the survey gave that state its revenue; it is the Almohad state's defining reform."

[[unique_tech]]
name = "Black Guard"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Infantry +5 attack vs. Cavalry, +4 vs. Camel Units"
level = 1
change = "new"
replaces = "Maghrebi Camels (Camel Units regenerate 15 HP per minute)"
precedent = "Chieftains (Infantry +5 attack vs. Cavalry, +4 vs. Camel Units) (Vikings): an existing unique tech, moved and renamed with an identical effect and age (Castle); the Norwegians' design drops it"
basis = "Yusuf ibn Tashfin kept a royal guard of black slaves (ʿabīd), and in the 14th-century narratives of Zallaqa/Sagrajas (1086) the Almoravid vanguard held while Yusuf took the Castilian camp and committed this black guard, whose attack broke Alfonso VI's knights; one of its men wounded the king (Rawd al-qirtas; al-Hulal al-mawshiyya; Huici Miranda, 1956). The Almohad and Marinid sultans kept black slave guards beside their tribal troops (Bennison, 2016). Infantry stronger against cavalry translates foot soldiers who broke a charge of armoured knights. Maghrebi Camels, an abstraction of the dromedary's hardiness, gives way to this royal institution."
relevance = "Slave guards gave the Almoravid, Almohad and Marinid rulers a force of their own beside the tribal levies, and at Zallaqa the black guard halted Alfonso VI's advance and opened al-Andalus to Almoravid rule."
contested = "The guard's role and numbers at Zallaqa come from late narratives (see the civ-level list)."

[tree]
add = ["Halberdier", "Keep", "Architecture"]
remove = ["Hand Cannoneer", "Cannon Galleon", "Elite Cannon Galleon", "Siphons"]

[tree.basis]
"Halberdier" = "The Almoravid infantry fought as a phalanx with long spears in the front rank (al-Bakri, 1068); stopping at the Pikeman contradicted their best-documented tactic."
"Keep" = "Fortification by Berber dynasties (see the tabiya bonus): the Almoravid walls of Marrakesh, raised in rammed earth (tabiya) by Ali ibn Yusuf in 1126–1127; the Almohad walls and gates of Rabat (Bab er-Rouah) and the Kasbah of the Udayas (c. 1150–1197); the Almohad rebuilding of the Alcazaba of Badajoz (1169) with its albarrana towers; the Torre del Oro in Seville (1220–1221); and the Marinid siege-city of al-Mansura outside Tlemcen (1299–1307)."
"Architecture" = "Almohad monuments such as the Kutubiyya in Marrakesh, the Hassan Tower in Rabat and the Giralda in Seville; the analysis notes the absence contradicted the civ's own history text. Treadmill Crane stays in the tree under the region's one reading of the tech (see the Arabs' design): no treadwheel crane is attested at Maghrebi building sites in the sources used here, so it is kept as a generic abstraction of faster building, resting on these Almoravid and Almohad programmes."
"Hand Cannoneer" = "No Maghrebi hand firearms are documented before the early 16th century, when Moroccan and Hafsid troops met the Portuguese enclaves with them (the earliest dates are contested), and the famous Moroccan arquebusiers of Alcácer Quibir (1578) and Tondibi (1591) were Saadian, after the window and outside the civ's dynasties: the unit would be a late element without clear Berber fame (RULES section 2). The Bombard Cannon stays on secure in-window evidence: the Marinid defenders of Algeciras fired iron balls with ‘truenos’ against Alfonso XI (1342–1344; Crónica de Alfonso XI)."
"Cannon Galleon" = "No Maghrebi gun-armed sailing fleet is documented inside the window; the gun-carrying corsair fleets of Algiers and Tunis came with the Barbarossa brothers and the Ottomans after 1516. The galleys and fire ships keep the fleet-of-ships tier (RULES 6.16.1; see the Ships bonus), the Galleon as a flagged abstraction (RULES 6.16.2)."
"Elite Cannon Galleon" = "As Cannon Galleon."
"Siphons" = "Named after the Byzantine fire siphon, a state secret never given to other nations (De Administrando Imperio 13); no ship-borne liquid-fire weapon is documented for this civ."

[[rename]]
from = "Elite Kamayuk"
to = "Elite Murabit"
level = 1
basis = "Follows the unique unit (Kamayuk → Murabit) for the Berbers only."

[architecture]
set = "Middle Eastern"
change = "kept"
basis = "The Berbers have used the Middle Eastern set since The African Kingdoms (2015), whose new African set went to the Ethiopians and Malians. Maghrebi Islamic building (horseshoe arches, courtyards, square minarets, flat roofs) is closer to it than to the other sets; a Maghrebi-Andalusi set would be N3."

[[dropped]]
item = "Kasbah (Team Castles work +25% faster)"
kind = "unique_tech"
reason = "Relevance test (RULES 6.9): the qasaba, a town's fortified government quarter, was common to the whole Islamic West rather than a Berber institution (Umayyad Mérida, 835; Almería, 955), much of the word's fame comes from later places (Ottoman Algiers, the earthen kasbahs of southern Morocco), and its effect only abstracts it. Even as a Town Center tech it would fail against a weightier datable state reform, the Almohad survey (Taksir), which takes its slot. Fame alone does not justify a slot (RULES 6.9), so it is not restored as an exception, at the Castle or elsewhere."

[[dropped]]
item = "Genitour (Mounted Skirmisher)"
kind = "unique_unit"
reason = "Owner's decision: the Genitour/Jinete is a regional unit, shared with the Castilians, Portuguese and Lithuanians (RULES 6.16.10), and no longer counts as a Berber unique unit. It stays in the Berber tree at the Archery Range and in the team bonus; the Murabit is the counted unique unit."
