civ = "Slavs"
name = "Rus'"
original_name = "Slavs"
status = "draft"
label = "Cavalry and Defensive civilization"
summary = "Slavs renamed Rus' (882–1505), on the owner's sketch: fur-hunting gold and cheaper horse archers replace Arson, Gambesons and the siege discount, Detinets becomes a passive, Druzhina gives the Boyar and Knight line trample, Kalita's tribute is the Town Center tech, the Baptism of Rus' and Ivan III's gun foundry are new techs, trade with Byzantium and the Hanse is the team bonus, and Muscovite guns enter."
ideas = [
  "N2: Poliud'e, the princes' winter tribute rounds, as a further tech or an age-gated passive if a slot frees up. Constantine VII describes them (De Administrando Imperio 9): every November the princes left Kiev with all the Rus' to spend the winter among their Slav tributaries, returning in April. After the Drevlians killed Igor for demanding a second tribute (945), Olga regularised the system with fixed dues (uroki) and collection points (pogosty) (Primary Chronicle s.a. 946–947), the first recorded reform of Rus' government. Tribute came largely from the forest, in furs, honey and wax. The prince and his men were maintained by their tributaries all winter, which Tuntian's ‘Soldiers passively produce food’ (Wei; the Chinese design holds it), narrowed to mounted units, could render.",
  "N2: Pomest'e, Ivan III's service-land grants, as a further tech or an Imperial Age passive if a slot frees up. After annexing Novgorod (1478) Ivan III deported many of its landowners and, from the late 1480s, granted their estates as pomest'ia, lands held on condition of service, to servitors (deti boyarskie) who owed mounted service with their armed men; the Novgorod cadastres of the 1490s record them, and the system became the base of the Muscovite cavalry until the 17th century. Aznauri Cavalry's ‘Mounted Units take -20% population space’ would render horsemen maintained by land rather than by pay; the Georgians' design already uses that effect as a passive.",
  "N2: Monastic colonisation: Monasteries also accept wood and food drop-offs, for the monasteries of the north-east (Trinity–Sergius, Kirillo-Belozersky, Solovetsky), following Klyuchevsky's thesis.",
  "N2: Ushkuiniki, Novgorod's river raiders of the 14th century, as fast river boats.",
  "N3: The Novgorod veche as a merchant-republic mechanic.",
  "N3: Abatis defence lines (zaseki) as a buildable obstacle against cavalry.",
  "N3: Portage: boats hauled overland around the Dnieper rapids, as the Rus' convoys to Constantinople were (De Administrando Imperio 9). The Scenario Editor's Wheeled Ship, a civilian unit of the Viking Sagas campaigns, could give it a look; its stats and role must be checked in game. The unit also echoes the Primary Chronicle's legend of Oleg's ships set on wheels before Constantinople (s.a. 907), a tale with no Byzantine corroboration.",
]
contested = [
  "The Normanist debate: how far the Scandinavian founding elite shaped the early Rus' state (the Rhos of 839 were found to be Swedes, Annales Bertiniani; most names in the treaty of 911 are Norse). The current consensus is a Scandinavian elite assimilated to the Slavs by the 11th century (Franklin and Shepard 1996), but the debate remains politically charged.",
  "The heritage of Kievan Rus' is shared by Ukrainians, Belarusians and Russians; the civ name avoids ‘Russians’.",
  "Continuity after 1240: most elements of this design from the later centuries are Muscovite, which follows the Kiev–Vladimir–Moscow ‘traditional scheme’ that Mykhailo Hrushevsky criticised in 1904. Galicia–Volhynia (to the 1340s; Daniel crowned king of Rus' in 1253) is in the profile; the Rus' lands of the Grand Duchy of Lithuania (Kiev from c. 1362) are represented by the Lithuanians, who share the Boyar for their Ruthenian boyars.",
  "How fast the druzhina turned from fighting on foot (Sviatoslav at Dorostolon, 971, in Leo the Deacon) to mounted warfare (11th–12th centuries): 10th-century chamber graves (Gnezdovo, Shestovytsia, Chernihiv) already hold horses and riding gear.",
  "The date (987–989) and place of Vladimir's baptism differ between the sources, and the Primary Chronicle's tale of his choice between the faiths is legendary.",
  "‘Monastic colonisation’ of the north-east is Klyuchevsky's thesis; later work notes that peasants often settled before the monks and that monastic lands grew by grants and purchases.",
  "Whether the kuna reckoning (‘martens’) meant furs used as money or only units of account.",
  "Whether the pomest'e (now an N2 idea) followed foreign models (Byzantine pronoia, the Ottoman timar) or grew out of earlier princely grants.",
  "The form of the tyufyaki of 1382, the first firearms in Rus' hands that the chronicles name; the ‘thunder’ shot from the walls of Bulgar at a Rus' army in 1376 is an earlier, debated mention of guns, on the other side.",
  "Whether the pishchali that the Muscovites fired on the Ugra (1480) included hand-held guns: the word then also covered light cannon. The design reads them as including handguns (see the Hand Cannoneer); if hand guns are unambiguous in Muscovy only after 1500, the Hand Cannoneer is the civ's one late element under RULES section 2, which it meets: an Imperial Age unit with clear fame (the later Muscovite musketeers, the streltsy).",
  "Counterweight trebuchet: its Rus' use is an inference. The chronicles call the engines poroki without describing them (Novgorod's poroki for the campaign against Rakvere, Novgorod First Chronicle s.a. 1268; Kirpichnikov 1976), and porok is sometimes read as a ram; the design reads the poroki of the counterweight era as counterweight engines, a flagged inference on the standard of the Georgians' design (an inference with a stated basis, RULES 6.16.5). If they were man-powered, the Traction Trebuchet would replace the Trebuchet (RULES 6.16.5, 6.11); the Tatars' design reads the Horde's engines that way, on J. P. Zanders' reading of the engines at Caffa (1344).",
]
open_questions = []

[profile]
entity = "Rus': the Rurikid principalities from Oleg's Kiev to Ivan III's Muscovy, with their Scandinavian founding elite"
region = "The East European forest and forest-steppe: Kiev and the Dnieper, Novgorod and the Volkhov (a republic from 1136), Galicia–Volhynia (to the 1340s), Vladimir-Suzdal and Moscow on the upper Volga"
window = "882–1505 (from Oleg's taking of Kiev, traditionally 882, to the death of Ivan III, 1505, a terminal event soon after 1500 as RULES 6.16.17 allows; core 10th–15th centuries, from the treaties with Byzantium to Ivan III's unification of the north-east)"
sources = [
  "Povest' vremennykh let (Primary Chronicle)",
  "Novgorod First Chronicle; Hypatian Chronicle (with the Galician-Volhynian Chronicle)",
  "Constantine VII, De Administrando Imperio (c. 950)",
  "Leo the Deacon, History (trans. Talbot and Sullivan, 2005)",
  "Ibn Rusta, Kitab al-A'laq al-Nafisa (early 10th century)",
  "Russkaya Pravda",
  "Novgorod birchbark letters (V. L. Yanin, A. A. Zaliznyak)",
  "Slovo o polku Igoreve (The Tale of Igor's Campaign); on its authenticity, E. L. Keenan, Josef Dobrovský and the Origins of the Igor' Tale (2003), and A. A. Zaliznyak, ‘Slovo o polku Igoreve’: vzglyad lingvista (2004)",
  "Sigismund von Herberstein, Rerum Moscoviticarum commentarii (1549)",
  "A. F. Medvedev, Ruchnoe metatel'noe oruzhie (1966)",
  "A. N. Kirpichnikov, Drevnerusskoe oruzhie, 3 vols (1966–1971); Voennoe delo na Rusi v XIII–XV vv. (1976)",
  "R. E. F. Smith, The Origins of Farming in Russia (1959)",
  "Janet Martin, Treasure of the Land of Darkness: The Fur Trade and its Significance for Medieval Russia (1986)",
  "Simon Franklin and Jonathan Shepard, The Emergence of Rus 750–1200 (1996)",
  "Donald Ostrowski, Muscovy and the Mongols (1998)",
  "Janet Martin, Medieval Russia 980–1584 (2nd ed., 2007)",
  "O. G. Ulyanov, ‘Drevneishii arsenal v Moskovskom Kremle – mesto rozhdeniya russkoi artillerii’, in Voina i oruzhie: novye issledovaniya i materialy, part IV (St Petersburg, 2015), pp. 220–243",
]
replaces = "Slavs (a pan-Slavic umbrella covering Bulgaria, Great Moravia and Rus')"

[[bonus]]
text = "Farmers work +15% faster"
kind = "economic"
level = 1
change = "kept"
precedent = "Farmers work +15% faster (Slavs)"
basis = "The Rus' combined slash-and-burn clearing (podseka) in the northern forests with ploughland on the black earth of the south; finds of ploughshares trace the spread of the plough (R. E. F. Smith 1959), the Russkaya Pravda fines whoever ploughs across a field boundary, and Novgorod's birchbark letters deal in rye and grain dues. The bonus stands for an agrarian society, not for high yields: Novgorod depended on grain from the Suzdal lands and suffered famines (1128, 1230–31)."
relevance = "The Rus' were an agrarian society: grain and land underlay the power of princes and boyars and drove the settlement of the north-east."

[[bonus]]
text = "Hunting also generates gold"
kind = "economic"
level = 1
change = "new"
replaces = "Siege Workshop Units cost -15%"
precedent = "Shepherding, fishing, and hunting also generate gold (Varangians), narrowed to hunting (RULES section 5); the Swedes' design uses the same narrowing for the furs of the Svear, a repetition RULES 6.7 allows"
basis = "Furs were the great export of the Rus' lands. Early in the 10th century Ibn Rusta wrote of the Scandinavian Rus' elite, who had no fields, lived on what they took from the Slavs, whom they raided for captives, and traded sable, squirrel and other furs for coin (the farming population they came to rule is the ground of the farming bonus); tribute was reckoned in furs, as when Oleg imposed a tribute of a black marten apiece on the Drevlians (Primary Chronicle s.a. 883); in 969 Sviatoslav named furs, wax, honey and slaves as what came from Rus' to the Danube; and Novgorod sold squirrel and marten pelts in vast numbers to the Hanse merchants of its Peterhof. The silver the furs earned paid the princes' retinues and, after 1240, much of the Horde's tribute (Martin 1986). Gold from the hunt renders a fur economy fed by trapping and by tribute from the forest peoples. The replaced siege discount had little basis: the Rus' had no siege tradition of note before artillery, whose moment is rendered by Pushechny Dvor."
relevance = "From the Volga trade of the 10th century to Novgorod's Hanse trade and Muscovy's advance into the north, furs were the wealth of the Rus' lands; Janet Martin's study treats them as central to medieval Russian history."
contested = "The bonus abstracts furs bought or taken as tribute from forest peoples as much as furs hunted by the Rus' themselves; whether the kuna reckoning meant furs used as money is debated (see the civ-level notes)."

[[bonus]]
text = "Replaces 40% of Castle and Watch Tower-line stone cost with additional wood cost starting in Castle Age"
kind = "military"
level = 1
change = "changed"
replaces = "Detinets (Replaces 40% of Castle and Watch Tower-line stone cost with additional wood cost), formerly the Castle Age unique tech"
precedent = "Detinets (Replaces 40% of Castle and Watch Tower-line stone cost with additional wood cost) (Slavs), as a passive from the Castle Age, the age of the tech in the game (RULES 6.16.11); for an age-gated passive, Town Centers cost -50% wood starting in Castle Age (Britons)"
basis = "Rus' citadels (detinets, later kremlin) were built of earth and timber cribs (gorodni) through most of the window: Novgorod's detinets was laid out in 1044 (Novgorod First Chronicle) and received stone walls only in the 14th century, and Moscow's Kremlin had oak walls in 1339, white stone from 1367 and brick only in 1485–1495. Timber fortification was a building tradition of every Rus' town over five centuries, not a datable reform, so it becomes a passive (RULES 6.2)."
relevance = "The timber citadel was the heart of every Rus' town and the seat of prince and bishop; the Moscow Kremlin grew from it."

[[bonus]]
text = "Cavalry Archers cost -10/20% in Castle/Imperial Age"
kind = "military"
level = 1
change = "new"
replaces = "Arson, Gambesons free"
precedent = "Cavalry Archers cost -10/20% in Castle/Imperial Age (Huns; the Avars', Hindustanis' and Tatars' designs also use it)"
basis = "War against the steppe brought the composite bow and the horse archer into Rus' armies: Rus' bows and quivers follow steppe models (Medvedev 1966); from the 12th century Turkic nomads settled on the Ros served as Kiev's frontier guard, the Black Hoods (named from 1146, Hypatian Chronicle); and after the Mongol conquest the cavalry of Muscovy fought in the Tatar manner with bow and sabre (Ostrowski 1998; Herberstein, 1549, just after the window). The replaced bonus is dropped for relevance: Gambesons rested on one armour type, the quilted tegilyai, known mainly from 16th-century Muscovite musters, and Arson on the folk tale of Olga burning Iskorosten with birds (Primary Chronicle s.a. 946)."
relevance = "Steppe-style archery grew in Rus' warfare from the 12th century, through the Black Hoods, and above all in the Muscovite cavalry after the Mongol conquest; the Castle/Imperial gating follows that later weight."

[[bonus]]
text = "Monks move +20% faster"
kind = "other"
level = 1
change = "kept"
precedent = "Monks move +20% faster (Slavs)"
basis = "Rus' monasticism took root with the Kiev Caves monastery (c. 1051), which adopted the Studite rule of Constantinople. In the 14th–15th centuries monks carried settlement and Moscow's influence into the forests of the north-east: Sergius of Radonezh's Trinity monastery (1330s–1340s), Kirillo-Belozersky (1397) and Solovetsky (1429/1436). Moving monks render this outward movement, which Klyuchevsky called monastic colonisation."
relevance = "Monasticism shaped Rus' religious culture and carried settlement and Muscovite authority across the forest north."
contested = "Klyuchevsky's thesis is qualified by later work (see the civ-level notes)."

[team_bonus]
text = "Trade Units generate +10% gold"
level = 1
change = "new"
replaces = "Military buildings (except Castles) provide +5 population space"
precedent = "Trade Units generate +25% gold (Spanish team bonus), at a lower magnitude (RULES section 5); Trade Units generate +10% food in addition to gold (Bengalis team bonus)"
basis = "The Rus' state was born trading with its neighbours. Oleg's treaty with Byzantium of 911 and Igor's of 944 (Primary Chronicle) set the terms for the Rus' who came each year to Constantinople: law between the two peoples, the rescue of ships and goods and, in 944, the rules for merchants, who lodged at St Mamas, entered the city by one gate under an imperial officer, carried their prince's charters and could buy silk only up to a fixed value. Constantine VII describes the convoy that made the trade possible: monoxyla cut by the Slavs in winter gathered at Kiev and went down the Dnieper every June, past the rapids, to Constantinople (De Administrando Imperio 9); in 969 Sviatoslav named furs, wax, honey and slaves as the goods of Rus'. In the north, Novgorod was the eastern pole of the Baltic trade: its furs and wax supplied the merchants of Gotland and the Hanse, who kept their own courts in the city (the Gotlanders' court and the German Peterhof) under a treaty with the Germans and Gotlanders of the late 12th century, until Ivan III closed the Peterhof in 1494. Allied trade earning more gold renders a partner whose goods made others rich (RULES 6.2: trade). The replaced team bonus had no historical basis, and ‘Building repairs cost -25%’ is not used: its basis, the rebuilding of the Rus' timber towns, benefited only the Rus' (RULES 6.2). Trade-gold team bonuses count as one per team, at the highest value present (RULES 6.16.12)."
relevance = "Trade with Byzantium shaped the early Rus' state and its treaties, and Novgorod's trade with the Hanse lasted three centuries and made it the richest of the Rus' cities."

[[unique_unit]]
name = "Boyar"
model = "Boyar"
building = "Castle"
level = 1
change = "kept"
basis = "The boyars were the landed aristocracy and the senior members of the prince's retinue (druzhina), fighting as armoured horsemen in Kiev, Novgorod and Galicia alike; turning a social class into a unit is an abstraction, but its heavy armour is well founded (Kirpichnikov). The model is shared only with the Lithuanians, whose Boyar renders the Ruthenian boyars of the Grand Duchy, the same class under a new ruler (RULES 6.7); the Rus' Boyar is set apart by Druzhina, which gives it trample."
relevance = "The boyars dominated Rus' politics and war from Kiev to Muscovy; in Galicia they made and unmade princes."

[[unique_tech]]
name = "Druzhina"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Boyars and Knight-line deal trample damage"
level = 2
change = "changed"
replaces = "Druzhina (Infantry deals trample damage)"
precedent = "Vendel Legacy (Knight-line deals trample damage) (Varangians; the Swedes' design gives it up), extended to the Boyar, at the game's age of Vendel Legacy (Castle Age); the trample of the game's own Druzhina (Infantry deals trample damage) (Slavs) moves from the infantry to the horsemen. Adding the Boyar makes it a level-2 tech; on the Knight line alone it would be level 1."
basis = "The druzhina was the prince's retinue, the core of every Rus' army from the 10th century to the 13th. Vladimir valued it above treasure: when his men complained of eating with wooden spoons he had silver ones made, saying that silver and gold would not find him a druzhina, but with a druzhina he would find silver and gold, as his father and grandfather had (Primary Chronicle s.a. 996). From the 11th century it fought as armoured horsemen: Rus' finds combine mail with lamellar plates, taken from Byzantine and steppe models, and tall spheroconical helmets, some with face masks (Kirpichnikov, Drevnerusskoe oruzhie, vol. 3, 1971); 10th-century chamber graves already hold horses and riding gear. Its battle was the lance charge, the emblem of the warrior in the Tale of Igor's Campaign, where Igor wishes ‘to break a lance at the end of the Polovtsian field’. Trample renders that shock charge, for the retinue (Knight line) and its senior boyars (Boyar); the 10th-century foot phase is left to the generic infantry, and the trample itself is a game abstraction. Royal and military, so at the Castle (RULES 6.2)."
relevance = "The prince's mounted retinue fought every war of the Rus' principalities and was the ladder by which boyars rose; the game already names a Slavs tech after it."
contested = "The druzhina is a long tradition, not a datable reform; it is a Castle tech by the owner's decision (level-1 review, section 9: Rus' Q1 and Swedes Q2, the Knight-line trample goes to the Druzhina), flagged in the manner of RULES 6.16.19(b). How fast it turned from foot to horse is debated (see the civ-level notes). The Tale of Igor's Campaign is quoted as colour: its authenticity, questioned by A. A. Zimin (1960s) and E. L. Keenan (2003), is accepted by most scholars, notably on A. A. Zaliznyak's linguistic evidence (2004); the evidence for the armoured horseman is Kirpichnikov's."

[[unique_tech]]
name = "Kalita"
building = "Town Center"
kind = "civil"
age = "Imperial"
effect = "Lumberjacks slowly generate gold in addition to wood"
level = 1
change = "new"
precedent = "Paper Money (Lumberjacks slowly generate gold in addition to wood) (Vietnamese, whose design drops it): moved from the Castle to the Town Center and renamed, identical effect and age (Imperial Age, as in the game), so level 1 (RULES 6.5); no other design holds it. The owner's sketch asks for a small gold trickle like the Feitoria's; no tech gives a flat trickle, and of the two techs whose gold comes ‘slowly’, Burgundian Vineyards (Farmers slowly generate gold in addition to food) is not used: it is already the Tatars' Yarlyk, which renders the same tribute from the Horde's side, and a Town Center tech in three more designs, and beside the Cavalry Archer discount it would make the Rus' copy two Tatar effects again (level-1 review, section 3.3)."
basis = "Ivan I of Moscow (1325–1340), called Kalita, ‘money-bag’, became grand prince of Vladimir in 1328, sharing the title with Alexander of Suzdal until 1331, after helping the Horde crush the rising at Tver (1327). As grand prince he answered for the Horde's tribute (vykhod) from the principalities of north-eastern Rus', a tax on the households that the Mongol census of 1257–1259 had counted, paid in silver; he pressed the other lands for their share, as in 1332, when he took Torzhok and Bezhetsky Verkh to force Novgorod to hand over its ‘silver from beyond the Kama’ (Novgorod First Chronicle). Moscow profited from what passed through his hands: it grew rich, bought up villages and, by tradition, whole principalities (the ‘purchases’ of Uglich, Beloozero and Galich named in his grandson Dmitry's testament), and drew the metropolitan of all Rus' to live there. The tribute was paid in silver, which the Rus' lands earned above all with the produce of their forests, furs first, then wax and honey (Martin 1986). Lumberjacks who slowly generate gold render that forest wealth turned into the silver that Moscow gathered for the khan, an abstraction: the hunting passive renders the fur economy itself, the tech Moscow's collection of the tribute. A state revenue, so at the Town Center (RULES 6.2)."
relevance = "Kalita's collection of the tribute began Moscow's rise to lead the Rus' lands, the decisive turn of the later window; his byname is one of the best known of Russian history."
contested = "The traditional account credits Ivan I with the right to collect the tribute for all north-eastern Rus', dated either to 1328 or to 1331–32, when he became sole grand prince; the sources describe no formal grant, and the grand princes before him (Yury of Moscow among them) already answered for the tribute, so the right is inferred from his office and from later practice, and when the Rus' princes took over the collection from the Horde's agents is itself debated (Martin 2007). The tech renders Moscow's role in the collection, not a dated charter."

[[unique_tech]]
name = "Baptism of Rus'"
building = "Monastery"
kind = "civil"
age = "Castle"
effect = "Monastery technologies cost -50%"
level = 2
change = "new"
precedent = "Monastery technologies cost -50% (Burmese), as a tech; the Ethiopians' design also uses it as a passive and the Koreans' design at a lower magnitude as a team bonus. No existing tech renders a conversion."
basis = "Vladimir took Christianity from Byzantium: his baptism, traditionally dated 988 and tied to the capture of Chersonesos (Korsun) and his marriage to the emperor's sister Anna, was followed by the baptism of the people of Kiev in the Dnieper, the building of the Church of the Tithes (consecrated 996), endowed with a tenth of his revenues, and the taking of children of the leading families to be taught book learning (Primary Chronicle s.a. 988–996). Rus' received a Church already formed: Greek bishops under a metropolitan of Kiev subject to Constantinople, the Byzantine liturgy and canon law, and the Slavonic books and clergy of Bulgaria, so that it had no need to create its own church language or institutions (Franklin and Shepard 1996). Cheaper Monastery technologies render institutions received ready-made. Religion, so at the Monastery (RULES 6.2)."
relevance = "The conversion of 988 made Rus' an Orthodox Christian land tied to Byzantium in faith, letters, art and law, and RULES section 4 counts it among the traits that define the civ."
contested = "The date and place of Vladimir's baptism differ between the sources (see the civ-level notes)."

[[unique_tech]]
name = "Pushechny Dvor"
building = "Siege Workshop"
kind = "military"
age = "Imperial"
effect = "Gunpowder Units cost -20% and train +25% faster"
level = 2
change = "new"
precedent = "Effect 1: Gunpowder Units cost -20% (Italians; the Italians' design keeps it); effect 2: Gunpowder Units train +25% faster (Turks team bonus, which the Turks' design gives up; the Vietnamese and Bohemian designs take it over as their team bonus, and the Japanese design's Tanegashima uses it narrowed to Hand Cannoneers). Both effects are exclusive: the tech does not give back the guns, which are in the tree (RULES 6.6). No existing tech renders a state gun foundry."
basis = "Ivan III made gun-founding a work of the Muscovite state. Aristotele Fioravanti, the Bolognese engineer who came to Moscow in 1475 to build the Dormition Cathedral, also directed the guns on Ivan III's campaigns until his last mention (1485); older works credit him with founding gun-casting in Moscow on his arrival, which the sources used for this design do not confirm. A cannon house (pushechnaya izba) is first documented in Moscow in 1488, not in 1475 as older works held (O. G. Ulyanov 2015), the forerunner of the Cannon Yard (Pushechny dvor) where Andrey Chokhov cast the Tsar Cannon in 1586. The tech is named after the Cannon Yard that grew from the cannon house of 1488, as RULES section 2 allows for an element that originated inside the time frame and took its later name. Cheaper guns made faster render a state foundry that cast them in series. Gunpowder production at the building that makes the guns, so at the Siege Workshop (RULES 6.2)."
relevance = "A state gun foundry armed the Muscovite army that unified the Rus' lands and then fought Kazan and Lithuania; the Moscow Cannon Yard was the centre of Russian gun-founding for the next two centuries."
contested = "The beginnings: older works date a Moscow gun foundry to Fioravanti's arrival (1475) and credit him with founding it, and some give 1479 for the Cannon Yard; the design dates the tech from the first documented cannon house (1488; Ulyanov 2015) and credits Fioravanti only with directing the guns on campaign."

[tree]
add = ["Hand Cannoneer", "Bombard Cannon", "Bombard Tower", "Thumb Ring", "Bracer", "Architecture", "Arbalester"]
remove = ["Galleon", "Carrack", "Cannon Galleon", "Hussar", "Siege Onager", "Block Printing"]

[tree.basis]
"Hand Cannoneer" = "The unit stands for the firearm infantry of late-15th-century Muscovy, inside the window: the tree follows the period the design represents (RULES 6.16.19(d)), and Muscovy's late 15th century is part of it. The chronicles say that on the Ugra (1480) the Muscovites drove back the Tatars with arrows and pishchali, and firearms had been in Rus' use since 1382 and spread through the 15th century (Kirpichnikov, Voennoe delo na Rusi v XIII–XV vv., 1976). The word pishchal' then also covered light guns, so the reading is flagged in the civ-level notes, with the late-element fallback."
"Bombard Cannon" = "Ivan III's Italian engineer Aristotele Fioravanti (in Moscow from 1475) directed his guns on campaign, and a cannon house in Moscow is first documented in 1488 (Ulyanov 2015); see Pushechny Dvor."
"Bombard Tower" = "In 1382 the defenders of Moscow fired tyufyaki and pushki from the Kremlin walls against Tokhtamysh, the first firearms in Rus' hands that the chronicles name (see contested)."
"Thumb Ring" = "Given for the steppe archery tradition that Rus' armies demonstrably used (RULES 6.16.4); the draw of the Rus' archers themselves is not documented. Rus' bows and quivers followed steppe models; the Black Hoods, Turkic nomads settled on the Ros, served Kiev as frontier troops; and the Muscovite cavalry fought in the Tatar manner with bow and sabre (see the horse-archer bonus)."
"Bracer" = "Rus' archery followed steppe models: Rus' bows and quivers are of steppe types (Medvedev 1966), the Black Hoods, Turkic nomads settled on the Ros, served Kiev as frontier horse archers, and the Muscovite cavalry fought in the Tatar manner with bow and sabre (Ostrowski 1998). The Bracer, the last archery upgrade, renders that tradition for the horse archers of the Cavalry Archer passive, as the Thumb Ring renders their draw; without it the passive's unit would also lack an upgrade most civs have."
"Architecture" = "Stone and brick building of the later window: the white-stone churches of Vladimir-Suzdal (12th century) and the brick Kremlin of Moscow (1485–1495), built by Italian architects."
"Arbalester" = "Crossbows (samostrely) were secondary to the bow in field armies but a regular weapon in the defence of Rus' towns: crossbow bolts are common in 13th–14th-century finds (Medvedev 1966), and in the tale of Tokhtamysh's siege of Moscow (1382) the defenders shot crossbows from the walls, where the clothier Adam killed the son of a Horde prince with a crossbow bolt from the Frolov gate. The top tier suits a civ labelled defensive (RULES 6.16.3)."
"Galleon" = "Navy tier (RULES 6.16.1): the boat tier. Rus' fleets were fleets of boats, not of ships, from the monoxyla, dugout hulls that the Slavs cut in winter and the Rus' fitted out with oars and, for the sea, with masts, sails and rudders (De Administrando Imperio 9), in which the Rus' crossed the Black Sea against Constantinople in 860, 941 and 1043, to the ushkui of the Novgorodian river raiders in the 14th century. The boat tier keeps the generic Galley, Fire Ship, Demolition and Hulk lines as the game gives them (without the Heavy Demolition Ship) as an abstraction for water maps, the ‘Galleon, Fast Fire Ship and Carrack’ upgrade staying for the Fast Fire Ship, and removes the high-seas sailing warships (Galleon, Carrack). The Scenario Editor's Canoe (RULES section 5), which several boat-tier designs use as the Galley's look, the Avars' among them for the Slav dugouts of 626, was weighed and not adopted: in the game it is a light boat (70 HP; codex/tools/scenario-units-stats.md), while the Rus' monoxyla, rigged for the sea, carried some forty men each by the Primary Chronicle's reckoning (s.a. 907), nearer in scale and role to the Galley, which keeps its look."
"Carrack" = "See Galleon."
"Cannon Galleon" = "The Rus' had no purpose-built warships and no gun-armed ships: their fleets were river-sea boats (monoxyla, lod'i), which nonetheless crossed the Black Sea against Constantinople in 860, 941 and 1043. The Cannon Galleon needs gun-armed warships inside the window (RULES 6.16.1)."
"Hussar" = "Hungarian and Serbian light cavalry of the 15th century; Rus' light horsemen fought as mounted archers in the steppe manner, rendered by the Cavalry Archer, and Light Cavalry stays."
"Siege Onager" = "Dropped with the original ‘Infantry and Siege’ identity and its siege discount, whose top tier it was; the Mangonel and Onager stay as the generic light stone-thrower (RULES 6.16.5), and Muscovy's late siege power is represented by the Bombard Cannon. The Trebuchet stays on Rus' evidence: Rus' armies built stone-throwing engines (poroki), as when Novgorod had poroki made at the archbishop's court for the campaign against Rakvere (Novgorod First Chronicle s.a. 1268), and Kirpichnikov (Voennoe delo, 1976) traces their use through the 13th–14th centuries. The chronicles do not describe their mechanism, and porok is sometimes read as a ram (see the Tatars' design); the design reads the Rus' poroki of the counterweight era as heavy counterweight engines, a flagged inference (see contested), with the Traction Trebuchet as the fallback if they were man-powered (RULES 6.16.5, 6.11)."
"Block Printing" = "No printing in the window (to 1505): Moscow's first press worked anonymously from the 1550s, and the first dated Moscow book, Ivan Fedorov's Apostol, appeared in 1564. The same printing-date test keeps Block Printing for the Danes (Odense, 1482) and gives it to the Swedes (Stockholm, 1483)."

[architecture]
set = "Eastern European"
change = "kept"
basis = "Timber kremlins and log houses and, late in the window, onion domes fit Rus'. Eastern European is the Slavs' set in the game, though it is not recorded in the repository data."
