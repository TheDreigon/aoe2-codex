civ = "Slavs"
name = "Rus'"
original_name = "Slavs"
status = "draft"
label = "Cavalry and Defensive civilization"
summary = "Slavs renamed Rus' (owner's decision) and centred on the Rus' from Oleg's Kiev, with its Scandinavian founding elite, to Ivan III's Muscovy (882–1505), leaving Bulgaria and Moravia to their own civs: farming, monks, the Boyar and Detinets stay; steppe horse archery and armoured cavalry replace Arson, Gambesons and the siege discount, the Poliudie tribute becomes the Town Center tech, the Baptism of Rus' (988) replaces Druzhina at the Monastery, Ivan III's Pomest'e is the Imperial Age tech and Novgorod's trade with the Hanse the team bonus, and the tree gains Muscovite guns, the Bombard Tower, Architecture, the Arbalester and steppe archery upgrades while the Cannon Galleon, Carrack, Fast Fire Ship, demolition ships, Hussar and Siege Onager leave."
ideas = [
  "N2: Monastic colonisation: Monasteries also accept wood and food drop-offs, for the monasteries of the north-east (Trinity–Sergius, Kirillo-Belozersky, Solovetsky), following Klyuchevsky's thesis.",
  "N2: Ushkuiniki, Novgorod's river raiders of the 14th century, as fast river boats.",
  "N2: Pushechny dvor, a cannon-yard tech for Ivan III's gun-founding (a cannon house is documented in 1488), with a second, exclusive effect (RULES 6.6), if the owner wants a gunpowder moment.",
  "N3: The Novgorod veche as a merchant-republic mechanic.",
  "N3: Abatis defence lines (zaseki) as a buildable obstacle against cavalry.",
  "N3: Portage: boats hauled overland around the Dnieper rapids, as the Rus' convoys to Constantinople were (De Administrando Imperio 9).",
]
contested = [
  "The Normanist debate: how far the Scandinavian founding elite shaped the early Rus' state (the Rhos of 839 were found to be Swedes, Annales Bertiniani; most names in the treaty of 911 are Norse). The current consensus is a Scandinavian elite assimilated to the Slavs by the 11th century (Franklin and Shepard 1996), but the debate remains politically charged.",
  "The heritage of Kievan Rus' is shared by Ukrainians, Belarusians and Russians; the civ name avoids ‘Russians’.",
  "Continuity after 1240: the late elements of this design are Muscovite, which follows the Kiev–Vladimir–Moscow ‘traditional scheme’ that Mykhailo Hrushevsky criticised in 1904. Galicia–Volhynia (to the 1340s; Daniel crowned king of Rus' in 1253) is in the profile; the Rus' lands of the Grand Duchy of Lithuania (Kiev from c. 1362) are represented by the Lithuanians.",
  "How fast the druzhina turned from fighting on foot (Sviatoslav at Dorostolon, 971, in Leo the Deacon) to mounted warfare (11th–12th centuries): 10th-century chamber graves (Gnezdovo, Shestovytsia, Chernihiv) already hold horses and riding gear.",
  "The date (987–989) and place of Vladimir's baptism differ between the sources, and the Primary Chronicle's tale of his choice between the faiths is legendary.",
  "‘Monastic colonisation’ of the north-east is Klyuchevsky's thesis; later work notes that peasants often settled before the monks and that monastic lands grew by grants and purchases.",
  "Whether the kuna reckoning (‘martens’) meant furs used as money or only units of account.",
  "Whether the pomest'e followed foreign models (Byzantine pronoia, the Ottoman timar) or grew out of earlier princely grants.",
  "The form of the tyufyaki of 1382, the first firearms in Rus' hands that the chronicles name; the ‘thunder’ shot from the walls of Bulgar at a Rus' army in 1376 is an earlier, debated mention of guns, on the other side.",
  "Whether the pishchali that the Muscovites fired on the Ugra (1480) included hand-held guns: the word then also covered light cannon.",
]
open_questions = [
  "Power budget: the Rus' gain land gunpowder, the Bombard Tower, Architecture, the Arbalester, Thumb Ring, Bracer and the horse-archer discount, with Poliudie and the Baptism of Rus' as new unique techs (4 passives + 4 techs = 8, within the proposed cap of 9), and lose Arson, Gambesons, the siege discount, Druzhina, the Siege Onager, the Hussar, the demolition ships and the gun and carrack ships. Poliudie comes in the Castle Age, one age earlier than its source tech, the Vietnamese' Paper Money. Acceptable?",
  "Team bonus: ‘Trade Units generate +10% gold’ is now the team bonus of five drafts (Armenians, Ethiopians, Maya, Tamils, Rus'). Keep it, or use another trade effect for Novgorod (for example ‘Markets work +80% faster’, the Bohemians' team bonus)?",
  "Boyar: the Rus' unit is now shared with the Lithuanians' Boyar and is the model of the Germans' mounted Teutonic Knight, so three civs field the same heavy cavalry (see the Lithuanians' question). From the Rus' side the Lithuanian sharing is historical (the Ruthenian boyars of the Grand Duchy), and the Rus' heavy cavalry stays distinct through the Knight-line armour bonus and Pomest'e. Accept?",
]

[profile]
entity = "Rus': the Rurikid principalities from Oleg's Kiev to Ivan III's Muscovy, with their Scandinavian founding elite"
region = "The East European forest and forest-steppe: Kiev and the Dnieper, Novgorod and the Volkhov (a republic from 1136), Galicia–Volhynia (to the 1340s), Vladimir-Suzdal and Moscow on the upper Volga"
window = "882–1505"
sources = [
  "Povest' vremennykh let (Primary Chronicle)",
  "Novgorod First Chronicle; Hypatian Chronicle (with the Galician-Volhynian Chronicle)",
  "Constantine VII, De Administrando Imperio (c. 950)",
  "Leo the Deacon, History (trans. Talbot and Sullivan, 2005)",
  "Russkaya Pravda",
  "Novgorod birchbark letters (V. L. Yanin, A. A. Zaliznyak)",
  "Sigismund von Herberstein, Rerum Moscoviticarum commentarii (1549)",
  "A. F. Medvedev, Ruchnoe metatel'noe oruzhie (1966)",
  "A. N. Kirpichnikov, Drevnerusskoe oruzhie, 3 vols (1966–1971); Voennoe delo na Rusi v XIII–XV vv. (1976)",
  "R. E. F. Smith, The Origins of Farming in Russia (1959)",
  "Simon Franklin and Jonathan Shepard, The Emergence of Rus 750–1200 (1996)",
  "Donald Ostrowski, Muscovy and the Mongols (1998)",
  "Janet Martin, Medieval Russia 980–1584 (2nd ed., 2007)",
]
replaces = "Slavs (a pan-Slavic umbrella covering Bulgaria, Great Moravia and Rus')"

[[bonus]]
text = "Farmers work +15% faster"
kind = "economic"
level = 1
change = "kept"
precedent = "Farmers work +15% faster (Slavs)"
basis = "The Rus' combined slash-and-burn clearing (podseka) in the northern forests with ploughland on the black earth of the south; finds of ploughshares trace the spread of the plough (R. E. F. Smith 1959), the Russkaya Pravda fines whoever ploughs across a field boundary, and Novgorod's birchbark letters deal in rye and grain dues. The bonus stands for an agrarian society, not for high yields: Novgorod depended on grain from the Suzdal lands and suffered famines (1128, 1230–31)."
relevance = "The Rus' were an agrarian society: grain and land underlay the power of princes and boyars and drove the settlement of the north-east."

[[bonus]]
text = "Cavalry Archers cost -10/20% in Castle/Imperial Age"
kind = "military"
level = 1
change = "new"
replaces = "Arson, Gambesons free"
precedent = "Cavalry Archers cost -10/20% in Castle/Imperial Age (Huns; the Avars' and Hindustanis' drafts also use it)"
basis = "War against the steppe brought the composite bow and the horse archer into Rus' armies: Rus' bows and quivers follow steppe models (Medvedev 1966); from the 12th century Turkic nomads settled on the Ros served as Kiev's frontier guard, the Black Hoods (named from 1146, Hypatian Chronicle); and after the Mongol conquest the cavalry of Muscovy fought in the Tatar manner with bow and sabre (Ostrowski 1998; Herberstein, 1549, just after the window). The replaced bonus is dropped for relevance: Gambesons rested on one armour type, the quilted tegilyai, known mainly from 16th-century Muscovite musters, and Arson on the folk tale of Olga burning Iskorosten with birds (Primary Chronicle s.a. 946)."
relevance = "Steppe-style archery grew in Rus' warfare from the 12th century, through the Black Hoods, and above all in the Muscovite cavalry after the Mongol conquest; the Castle/Imperial gating follows that later weight."

[[bonus]]
text = "Knight-line +1 pierce armor"
kind = "military"
level = 1
change = "new"
replaces = "Siege Workshop Units cost -15%"
precedent = "Hauberk (Knight-line +1 melee/+2 pierce armor) (Sicilians; the Armenians' Sparapet), the pierce half at a lower magnitude; Scout Cavalry-line +1 pierce armor and upgrades free (Turks), applied to the Knight-line"
basis = "From the 11th century the princes' retinue (druzhina) and the boyars fought as armoured horsemen, in armour suited to war against steppe archers: Rus' finds combine mail with lamellar plates, a technique taken from Byzantine and steppe models, and tall spheroconical helmets, some with face masks (Kirpichnikov, Drevnerusskoe oruzhie, vol. 3, 1971). The bonus covers the whole mounted retinue; the Boyar renders its senior aristocracy. The siege bonus is dropped: the Rus' had little siege tradition before artillery."
relevance = "Armoured horsemen, the princes' retinue and the boyars, were the striking force of the Rus' principalities from the 11th century to the Mongol age."

[[bonus]]
text = "Monks move +20% faster"
kind = "other"
level = 1
change = "kept"
precedent = "Monks move +20% faster (Slavs)"
basis = "Rus' monasticism took root with the Kiev Caves monastery (c. 1051), which adopted the Studite rule of Constantinople. In the 14th–15th centuries monks carried settlement and Moscow's influence into the forests of the north-east: Sergius of Radonezh's Trinity monastery (1330s–1340s), Kirillo-Belozersky (1397) and Solovetsky (1429/1436). Moving monks render this outward movement, which Klyuchevsky called monastic colonisation."
relevance = "Monasticism shaped Rus' religious culture and carried settlement and Muscovite authority across the forest north."
contested = "Klyuchevsky's thesis is qualified by later work (see the civ-level notes)."

[team_bonus]
text = "Trade Units generate +10% gold"
level = 1
change = "new"
replaces = "Military buildings (except Castles) provide +5 population space"
precedent = "Trade Units generate +25% gold (Spanish team bonus), at a lower magnitude; Trade Units generate +10% food in addition to gold (Bengalis team bonus)"
basis = "Novgorod was the eastern pole of the Baltic trade: its furs and wax supplied the merchants of Gotland and the Hanse, who kept their own courts in the city (the Gotlanders' court and the German Peterhof) under a treaty with the Germans and Gotlanders of the late 12th century, until Ivan III closed the Peterhof in 1494. Allied trade earning more gold renders a partner whose goods made others rich (RULES 6.2: trade). The replaced team bonus had no historical basis, and the first draft's ‘Building repairs cost -25%’ rested on the rebuilding of the Rus' timber towns, which benefited only the Rus'."
relevance = "Novgorod's trade with the Hanse lasted three centuries and made it the richest of the Rus' cities."

[[unique_unit]]
name = "Boyar"
model = "Boyar"
building = "Castle"
level = 1
change = "kept"
basis = "The boyars were the landed aristocracy and the senior members of the prince's retinue (druzhina), fighting as armoured horsemen in Kiev, Novgorod and Galicia alike; turning a social class into a unit is an abstraction, but its heavy armour is well founded (Kirpichnikov). The model is now also the Lithuanians' Boyar (the Ruthenian boyars of the Grand Duchy) and the base of the Germans' mounted Teutonic Knight; the Rus' heavy cavalry is set apart by the Knight-line armour bonus and Pomest'e (see open questions)."
relevance = "The boyars dominated Rus' politics and war from Kiev to Muscovy; in Galicia they made and unmade princes."

[[unique_tech]]
name = "Detinets"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Replaces 40% of Castle and Watch Tower-line stone cost with additional wood cost"
level = 1
change = "kept"
precedent = "Detinets (Replaces 40% of Castle and Watch Tower-line stone cost with additional wood cost) (Slavs)"
basis = "Rus' citadels (detinets, later kremlin) were built of earth and timber cribs (gorodni): Novgorod's detinets was laid out in 1044 (Novgorod First Chronicle) and received stone walls only in the 14th century, and Moscow's Kremlin had oak walls in 1339, white stone from 1367 and brick only in 1485–1495."
relevance = "The timber citadel was the heart of every Rus' town and the seat of prince and bishop; the Moscow Kremlin grew from it."

[[unique_tech]]
name = "Baptism of Rus'"
building = "Monastery"
kind = "civil"
age = "Castle"
effect = "Monks +1 conversion range; train +33% faster"
level = 1
change = "new"
precedent = "Clerical Recruitment (Monks +1 conversion range; train +33% faster) (Saxons, whose draft moves it to the Monastery): shared and renamed, identical effect and age; the Bulgarians' draft also shares it as the Council of Preslav (893), whose Slavonic books and clergy passed to Rus'"
basis = "Vladimir took Christianity from Byzantium: his baptism, traditionally dated 988 and tied to the capture of Chersonesos (Korsun) and his marriage to the emperor's sister Anna, was followed by the baptism of the people of Kiev in the Dnieper, the building of the Church of the Tithes (consecrated 996), endowed with a tenth of his revenues, and the taking of children of the leading families to be taught book learning (Primary Chronicle s.a. 988–996). The Church came with Greek bishops and with the Slavonic books and clergy of Bulgaria (Franklin and Shepard 1996). Monks that convert at greater range and train faster render a clergy recruited and spread quickly over a converted land. Religion, so at the Monastery (RULES 6.2); it takes the slot of Druzhina (see [[dropped]])."
relevance = "The conversion of 988 made Rus' an Orthodox Christian land tied to Byzantium in faith, letters, art and law, and RULES section 4 counts it among the traits that define the civ."
contested = "The date and place of Vladimir's baptism differ between the sources (see the civ-level notes)."

[[unique_tech]]
name = "Poliudie"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Lumberjacks slowly generate gold in addition to wood"
level = 1
change = "new"
precedent = "Paper Money (Lumberjacks slowly generate gold in addition to wood) (Vietnamese): shared and renamed, identical effect, at the Town Center like the Vietnamese draft's own Town Center tech, but in the Castle Age rather than the Imperial Age, because Olga's reform (946–947) falls early in the Rus' window"
basis = "Tribute was the first business of the Rus' state. Constantine VII describes the poliudia: every November the princes left Kiev with all the Rus' to spend the winter among their Slav tributaries, returning in April (De Administrando Imperio 9). After the Drevlians killed Igor for demanding a second tribute (945), Olga regularised the system with fixed dues (uroki) and collection points (pogosty) (Primary Chronicle s.a. 946–947); the tech renders the tribute system as she reformed it. Tribute came largely from the forest, in furs, honey and wax, and furs were money of account: the Russkaya Pravda reckons fines in grivnas of kunas (‘martens’). ‘Lumberjacks generate gold’ is an abstraction of that forest revenue. A state institution, so at the Town Center (RULES 6.2)."
relevance = "Tribute collection built the early Rus' state, and Olga's reform is the first recorded reform of Rus' government."
contested = "Whether the kuna reckoning meant furs used as money (see the civ-level notes)."

[[unique_tech]]
name = "Pomest'e"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Mounted Units take -20% population space"
level = 1
change = "new"
precedent = "Aznauri Cavalry (Mounted Units take -20% population space) (Georgians, whose draft turns it into a passive): shared and renamed, identical effect and age"
basis = "After annexing Novgorod (1478) Ivan III deported many of its landowners and, from the late 1480s, granted their estates as pomest'ia, lands held on condition of service, to servitors (deti boyarskie) who owed mounted service with their armed men; the Novgorod cadastres of the 1490s record them, and the system became the base of the Muscovite cavalry. Lower population space renders horsemen maintained by land rather than by pay."
relevance = "The service-land system created the Muscovite service class that fought Russia's wars until the 17th century."
contested = "Its models are debated (see the civ-level notes)."

[tree]
add = ["Hand Cannoneer", "Bombard Cannon", "Bombard Tower", "Thumb Ring", "Bracer", "Architecture", "Arbalester"]
remove = ["Cannon Galleon", "Carrack", "Fast Fire Ship", "Demolition Raft", "Demolition Ship", "Hussar", "Siege Onager"]

[tree.basis]
"Hand Cannoneer" = "The chronicles say that on the Ugra (1480) the Muscovites drove back the Tatars with arrows and pishchali, a word that then covered light guns as well as hand-held ones; firearms had been in Rus' use since 1382 and spread through the 15th century (Kirpichnikov, Voennoe delo na Rusi v XIII–XV vv., 1976). The unit stands for the gunpowder infantry of the late window. If hand guns are unambiguous only after 1500, it is the civ's one late element under RULES section 2, which it meets: it is an Imperial Age unit, and Muscovy's musketeers, the later streltsy, give it fame."
"Bombard Cannon" = "Ivan III brought Italian engineers who also cast and served guns, Aristotele Fioravanti (in Moscow from 1475) among them, and a cannon house in Moscow is first documented in 1488."
"Bombard Tower" = "In 1382 the defenders of Moscow fired tyufyaki and pushki from the Kremlin walls against Tokhtamysh, the first firearms in Rus' hands that the chronicles name (see contested)."
"Thumb Ring" = "Rus' archery followed steppe models (see the horse-archer bonus); the exact draw is not documented, so the tech stands for steppe archery in general."
"Bracer" = "A generic archery upgrade held by most civs; its absence left the Rus' Cavalry Archers, a well-attested troop type, without the last range upgrade."
"Architecture" = "Stone and brick building of the later window: the white-stone churches of Vladimir-Suzdal (12th century) and the brick Kremlin of Moscow (1485–1495), built by Italian architects."
"Arbalester" = "Crossbows (samostrely) were secondary to the bow in field armies but a regular weapon in the defence of Rus' towns: crossbow bolts are common in 13th–14th-century finds (Medvedev 1966), and in the tale of Tokhtamysh's siege of Moscow (1382) the defenders shot crossbows from the walls, where the clothier Adam killed the son of a Horde prince with a crossbow bolt from the Frolov gate. The top tier suits a civ labelled defensive."
"Cannon Galleon" = "The Rus' had no purpose-built warships and no gun-armed ships: their fleets were river-sea boats (monoxyla, lod'i), which nonetheless crossed the Black Sea against Constantinople in 860, 941 and 1043."
"Carrack" = "No Rus' carracks: Hanseatic cogs sailed only to the mouth of the Neva, and goods went up to Novgorod in river boats. The Galleon stays as the engine's generic Imperial Age warship (regional rule for late tiers, see the Norwegians' open questions)."
"Fast Fire Ship" = "No Rus' fire ships are known: their fleets were the victims of Greek fire in 941 and 1043. The generic Fire Galley and Fire Ship stay as early warships, without the top upgrade (regional rule for late tiers)."
"Demolition Raft" = "Explosive ships are an early modern device (the Antwerp ‘hellburners’ of 1585) with no Rus' counterpart; they leave under the regional rule for late tiers, as the Norse civs never had them. This reverses the previous draft, which kept them as generic."
"Demolition Ship" = "Same as the Demolition Raft."
"Hussar" = "Hungarian and Serbian light cavalry of the 15th century; Rus' light horsemen fought as mounted archers in the steppe manner, rendered by the Cavalry Archer, and Light Cavalry stays (regional rule for late tiers)."
"Siege Onager" = "Dropped with the original ‘Infantry and Siege’ identity and its siege discount, whose top tier it was; the Mangonel, Onager and Trebuchet stay as the generic siege line, and Muscovy's late siege power is represented by the Bombard Cannon."

[architecture]
set = "Eastern European"
change = "kept"
basis = "Timber kremlins and log houses and, late in the window, onion domes fit Rus'. Eastern European is the Slavs' set in the game, though it is not recorded in the repository data."

[[dropped]]
item = "Druzhina (Infantry deals trample damage)"
kind = "unique_tech"
reason = "The druzhina was the prince's standing retinue from the 10th to the 13th century, a social and military structure without a founding act, so it is a passive trait rather than a tech (RULES 6.2–6.3); the trample is a game invention (the analysis rates the tech ‘stretched’), and the previous draft's basis rested on one siege (Dorostolon, 971) and placed the tech where a slot was free. The mounted retinue of the 11th–12th centuries is now part of the Boyar and the Knight-line bonus, the 10th-century foot phase is left to the generic infantry, and the slot goes to the Baptism of Rus' (988), a datable moment that RULES section 4 counts among the traits that define the civ."
