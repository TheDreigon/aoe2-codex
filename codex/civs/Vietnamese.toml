civ = "Vietnamese"
name = "Vietnamese"
status = "draft"
label = "Archer and Naval civilization"
summary = "Đại Việt from Ngô Quyền to the Lê (938–1527): the Rattan Archer, the archer HP bonus, free Conscription (renamed Ngụ Binh Ư Nông), Tượng Binh (Chatras renamed, at the Castle) and Paper Money (now the Town Center tech, for Hồ Quý Ly’s reforms) stay; the Red River dikes and the river fleets of Bạch Đằng replace the unfounded economic and scouting bonuses, the guns the Ming learned from Đại Việt replace the Imperial Skirmisher and its team bonus, the Hand Cannoneer and the Traction Trebuchet enter the tree while the counterweight Trebuchet and the mounted archers leave, and the architecture becomes East Asian."
ideas = [
  "N2: Bạch Đằng stakes: obstacles in shallow water that damage and hold enemy ships, for the river victories of 938 and 1288 (stakes have been excavated in the estuary).",
  "N2: A crossbow Rattan Archer (nỏ thủ) when the Archer and Crossbowman lines are split (owner’s list, RULES 10); the multi-shot ‘magic crossbow’ of Cao Lỗ remains legend.",
  "N2: Vườn không nhà trống (‘empty gardens, empty houses’): scorched earth and evacuation against the Yuan (1258, 1285, 1287–88), as attrition for enemy units in Vietnamese territory.",
  "N2: Hỏa khí: a gunpowder tech for Hand Cannoneers and Fire Lancers (Chế Bồng Nga killed by gunfire in 1390; Hồ Nguyên Trừng’s work for the Ming; Sun Laichen 2003), kept out of this level because the firearms trait already gives the team bonus.",
  "N2: A Văn Miếu / examination tech for the Confucian state (Temple of Literature 1070, first examination 1075, Quốc Tử Giám 1076).",
  "N3: A Champa civ (c. 192–1471, Panduranga to 1832), the rival of Đại Việt and Angkor, which could take back the Sanskrit name Chatras.",
]
contested = [
  "The historicity of the Hùng kings and Văn Lang: the Đông Sơn culture versus traditions elaborated in the 14th–15th centuries (Kelley 2005).",
  "Where Vietnamese firearms came from and which way the technique flowed: the Ming shi credits the Ming’s ‘divine-engine’ guns to the conquest of Jiaozhi, while Sun Laichen (2003, 2006) argues that the main flow ran from China to Đại Việt.",
  "The nationalist narrative of continuous resistance to China, criticised by Keith W. Taylor for erasing regional diversity and periods of integration.",
  "Stakes at Bạch Đằng in 981 (tradition only), and whether the excavated stakes belong to 938 or to 1288.",
  "Ngụ binh ư nông (寓兵於農, ‘lodge the army in agriculture’) is a classical Chinese maxim that later Vietnamese historiography uses for the Lý–Lê system, not a recorded Lý–Trần name.",
  "Stone-throwers: no specific Vietnamese source for them has been found for this design. The Traction Trebuchet and the kept Mangonel and Onager (read as light traction engines) rest on Đại Việt’s Chinese-style military tradition, an inference.",
  "No Lý–Trần evidence for an elephant corps has been checked for this design; the elephants of Tượng Binh rest on the Hồ and Lê wars of the 15th century.",
]
open_questions = [
  "Name: rename the civ to Đại Việt, the state’s name from 1054 (Đại Cồ Việt from 968)? ‘Việt Nam’ dates from 1804.",
  "Label: ‘Archer and Naval civilization’ instead of ‘Archer civilization’, for the river fleets of Bạch Đằng. Accept?",
  "Imperial Skirmisher: dropped because no Vietnamese troop type matches it (see dropped). Keep it instead as a pure game abstraction, the elite light infantry of a skirmisher civ?",
]

[profile]
entity = "Đại Việt (Đại Cồ Việt from 968, Đại Việt from 1054): the Ngô, Đinh, Early Lê, Lý, Trần, Hồ and Later Lê states of the Việt (Kinh)"
region = "Red River delta and northern Vietnam, expanding south at the expense of Champa"
window = "938–1527 (core 1009–1497)"
sources = [
  "Ngô Sĩ Liên et al., Đại Việt sử ký toàn thư (1479)",
  "Lê Tắc, An Nam chí lược (c. 1335)",
  "Trần Hưng Đạo, Hịch tướng sĩ (1284)",
  "Yuan shi; Ming shilu; Ming shi, Bing zhi (1739)",
  "Keith W. Taylor, The Birth of Vietnam (1983); A History of the Vietnamese (2013)",
  "John K. Whitmore, Vietnam, Hồ Quý Ly, and the Ming (1985)",
  "Sun Laichen, ‘Military Technology Transfers from Ming China and the Emergence of Northern Mainland Southeast Asia (c. 1390–1527)’, Journal of Southeast Asian Studies 34 (2003)",
  "Sun Laichen, ‘Chinese Gunpowder Technology and Đại Việt, ca. 1390–1497’, in N. T. Tran and A. Reid (eds.), Việt Nam: Borderless Histories (2006)",
  "Liam C. Kelley, Beyond the Bronze Pillars (2005)",
]

[[bonus]]
text = "Mill technologies free"
kind = "economic"
level = 1
change = "new"
replaces = "Economic upgrades cost no wood and research +100% faster"
precedent = "Mill technologies free (Franks)"
basis = "The wet-rice economy of the Red River delta depended on dikes: in 1248 the Trần ordered dikes built along the river from its upper course to the sea and appointed dike officials (Đại Việt sử ký toàn thư), and the hydraulic network stayed under state care, the base of the delta’s dense population. The state’s investment in water control is abstracted as free farming upgrades. The bonus it replaces had no identifiable link."
relevance = "Dike-protected wet rice fed the dense population of the delta, the base of every Việt army and of the southward expansion."

[[bonus]]
text = "Foot Archers and Skirmishers +20% HP"
kind = "military"
level = 1
change = "kept"
precedent = "Foot Archers and Skirmishers +20% HP (Vietnamese)"
basis = "Missile infantry was the core of Việt armies, and its characteristic weapon was the crossbow (nỏ): bronze trigger mechanisms and thousands of bronze arrowheads come from Cổ Loa (3rd century BC, before the window), Chinese sources speak of the crossbowmen of Jiaozhi, and crossbows were used against the Song (1075–77) and the Mongols; wicker and rattan shields protected light troops across Southeast Asia and southern China. The extra HP abstracts this protected light infantry; the crossbow tradition, a team bonus in the first draft, belongs here because it benefited only Đại Việt."
relevance = "Crossbowmen and shielded light infantry were the backbone of the armies that held off the Song and the Yuan and expelled the Ming."

[[bonus]]
text = "Ngụ Binh Ư Nông (Conscription) free"
kind = "military"
level = 1
change = "kept"
precedent = "Conscription free (Vietnamese)"
basis = "Đại Việt kept rotating peasant-soldiers who farmed between turns of service, the system later historians call ngụ binh ư nông (see contested): in 1429 Lê Lợi cut his army from about 250,000 to 100,000 men serving in five rotating shifts (Đại Việt sử ký toàn thư). The Trần mobilised the whole country against the Mongols: the elders of the Diên Hồng conference (1284) voted to fight, and soldiers tattooed ‘Sát Thát’ (‘kill the Tatars’) on their arms."
relevance = "Mass mobilisation of a peasant army defeated the Mongols three times and expelled the Ming; rotating service kept that army in being."

[[bonus]]
text = "Ships move +10% faster"
kind = "military"
level = 1
change = "new"
replaces = "Enemy Town Centers are revealed at the start of the game"
precedent = "Ships move +10% faster (Berbers)"
basis = "Đại Việt’s most celebrated victories were won on the rivers: at Bạch Đằng in 938 Ngô Quyền’s light boats drew the Southern Han fleet over stakes planted in the riverbed at high tide, and in 1288 Trần Hưng Đạo set the same trap for the Yuan fleet, after Trần Khánh Dư had destroyed the Yuan grain fleet at Vân Đồn in the winter of 1287–88 (Đại Việt sử ký toàn thư; Yuan shi). Speed abstracts the light river craft that lured enemies into these traps. No Vietnamese fire-ship tradition is recorded (the river victories rested on stakes, tides and boarding), so the Fast Fire Ship stays out. The scouting bonus it replaces was only weakly linked to guerrilla intelligence."
relevance = "The river battles of Bạch Đằng, which ended Chinese rule in 938 and destroyed the Yuan fleet in 1288, are among the defining events of Vietnamese history."

[team_bonus]
text = "Gunpowder Units train +25% faster"
level = 1
change = "new"
replaces = "Imperial Skirmisher upgrade available in Imperial Age"
precedent = "Gunpowder Units train +25% faster (Turks team bonus, which the Turks design gives up)"
basis = "Đại Việt was an early gunpowder power of Southeast Asia (in 1390 the Cham king Chế Bồng Nga was killed by Vietnamese gunfire), and its gun-making passed to the Ming. The Ming shi’s treatise on the army says that when the Yongle emperor conquered Jiaozhi (1407) he obtained the method of the ‘divine-engine’ guns (shenji qiangpao) and set up the Shenjiying, a division to drill with them; Hồ Nguyên Trừng, captured in 1407, directed firearms work for the Ming Ministry of Works and later wrote the Nam Ông mộng lục (1438). A team bonus because the technique went to a neighbour (RULES 6.2: transferred techniques); faster training fits a division founded to drill with the new guns. The first draft’s crossbow bonus (Archery Ranges work +10% faster) benefited only Đại Việt and now grounds the archer bonus."
relevance = "Firearms made 15th-century Đại Việt the leading military power of the eastern mainland, and their passage to the Ming is the best-known Vietnamese contribution to Chinese military technology."
contested = "Sun Laichen argues that the main flow ran the other way, from China to Đại Việt (see contested)."

[[unique_unit]]
name = "Rattan Archer"
model = "Rattan Archer"
building = "Castle"
level = 1
change = "kept"
basis = "Shields and protection of rattan and wicker were common in Southeast Asia and southern China (the rattan-shield troops, tengpai, of the Ming), which justifies the high pierce armour."
relevance = "Shielded missile infantry was the core of Việt armies; the Rattan Archer is also the civ’s best-known unit."
contested = "The characteristic Việt missile weapon was the crossbow rather than the bow, and ‘rattan armour’ is associated more with the peoples of south-west China."

[[unique_tech]]
name = "Tượng Binh"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Battle Elephants +100 HP"
level = 1
change = "changed"
replaces = "Chatras (Battle Elephants +100 HP)"
precedent = "Chatras (Battle Elephants +100 HP) (Vietnamese): renamed, identical effect"
basis = "War elephants served Đại Việt’s rulers, though as a secondary arm: the Hồ fielded them against the Ming at Đa Bang (1407), where, by the Ming accounts, they were routed by cavalry in lion masks and by guns, and Lê Lợi’s insurgents used them in the 1420s; Đại Việt fought its southern wars against the elephant armies of Champa. The effect stays, but the Sanskrit chattra (royal parasol) belongs to the Indianised courts of Champa and Angkor; tượng binh, ‘elephant troops’, is the Sino-Vietnamese term."
relevance = "A borderline case, kept: elephants were a secondary arm of Đại Việt (central for Champa and Angkor) but its royal heavy arm from the Hồ to the Lê, and the war elephant is a fixture of Vietnamese martial imagery from the Trưng sisters on; fame tips the case (RULES 6.9)."
contested = "Earlier evidence is unchecked (see contested); if none turns up, the elephants could become a passive instead."

[[unique_tech]]
name = "Paper Money"
building = "Town Center"
kind = "civil"
age = "Imperial"
effect = "Lumberjacks slowly generate gold in addition to wood"
level = 1
change = "changed"
precedent = "Paper Money (Lumberjacks slowly generate gold in addition to wood) (Vietnamese): moved from the Castle to the Town Center, identical effect"
basis = "Hồ Quý Ly, regent of the Trần and king from 1400, carried out a programme of state reforms: paper money (Thông bảo hội sao) in 1396, modelled on the Ming paper currency (Da Ming baochao, issued from 1375), the limitation of private landholding (hạn điền) in 1397 and a new capital at Tây Đô (1397). The reforms were coercive and unpopular, and that unpopularity helped the Ming conquest of 1407 (Whitmore 1985). At the Town Center because the issue was a state measure (RULES 6.2); the effect (lumberjacks generate gold) is a game abstraction."
relevance = "Hồ Quý Ly’s reforms, with the paper money as their best-known measure, mark the crisis of the Trần state that ended in the Ming conquest of 1407."
contested = "The issue was coercive, unpopular and short-lived (Whitmore 1985)."

[tree]
add = ["Hand Cannoneer", "Traction Trebuchet"]
remove = ["Cavalry Archer", "Heavy Cavalry Archer", "Trebuchet"]

[tree.basis]
"Hand Cannoneer" = "In 1390 the Cham king Chế Bồng Nga was killed by Vietnamese gunfire; the Ming took the Vietnamese gun-making method after 1407 (see the team bonus), and the Lê used firearms against Champa (1471) and Lan Xang (1479–80) (Sun Laichen 2003). The civ had Bombard Cannon and Fire Lancer but no hand-held gun, against its own game history text."
"Traction Trebuchet" = "Đại Việt’s pre-gunpowder artillery would have been the traction stone-thrower (pao) of its Chinese-style military tradition, an inference (see contested); it replaces the counterweight Trebuchet as the long-range siege weapon (RULES 6.11), beside the Bombard Cannon of the 15th century."
"Trebuchet" = "The counterweight trebuchet reached China only in 1273 (Xiangyang), and no Vietnamese source for it is known; the Japanese, Korean, Chinese, Jurchen and Khitan designs make the same change."
"Cavalry Archer" = "No Vietnamese tradition of mounted archery is known, and horses were scarce in the delta."
"Heavy Cavalry Archer" = "As for the Cavalry Archer."

[[rename]]
from = "Conscription"
to = "Ngụ Binh Ư Nông"
level = 1
basis = "Same effect. ‘Conscription’ evokes modern compulsory service (France, 1798); the Vietnamese equivalent is the rotating levy of trained reserves who farmed between turns of service, which later historians call ngụ binh ư nông (see contested), well attested under Lê Lợi (1429)."

[architecture]
set = "East Asian"
change = "changed"
replaces = "Southeast Asian"
basis = "Đại Việt built in Chinese timber-frame forms with tiled, curved roofs, such as the One Pillar Pagoda (1049), the Temple of Literature (1070) and the Thăng Long citadel, and raised brick pagoda-towers of Chinese type such as Phổ Minh (1310), with some Cham decorative influence under the Lý; the surviving buildings are largely later reconstructions (the One Pillar Pagoda was rebuilt in 1955). The Southeast Asian set evokes instead the Indic brick and stone towers of Champa and Angkor."

[[dropped]]
item = "Imperial Skirmisher"
kind = "unique_unit"
reason = "No Vietnamese troop type matching an ‘imperial’ javelin skirmisher is known; it was a balance variant (see open questions). The Vietnamese keep the Elite Skirmisher, and its team bonus is replaced."
