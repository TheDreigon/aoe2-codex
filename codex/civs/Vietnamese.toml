civ = "Vietnamese"
name = "Vietnamese"
status = "draft"
label = "Archer and Naval civilization"
summary = "Đại Việt from Ngô Quyền to the Lê (938–1527): Red River dikes and the Bạch Đằng river fleets replace the unfounded economic and scouting bonuses, the examination state (Văn Miếu) Paper Money, guns passed to the Ming the Imperial Skirmisher, Chatras becomes a lighter Tượng Binh, the Traction Trebuchet (an inference) replaces the Trebuchet, and the architecture East Asian."
ideas = [
  "N2: Bạch Đằng stakes: obstacles in shallow water that damage and hold enemy ships, for the river victories of 938 and 1288 (stakes have been excavated in the estuary).",
  "N2: A crossbow Rattan Archer (nỏ thủ) when the Archer and Crossbowman lines are split (owner’s list, RULES 10); the multi-shot ‘magic crossbow’ of Cao Lỗ remains legend.",
  "N2: Vườn không nhà trống (‘empty gardens, empty houses’): scorched earth and evacuation against the Yuan (1258, 1285, 1287–88), as attrition for enemy units in Vietnamese territory.",
  "N2: Hỏa khí: a gunpowder tech for Hand Cannoneers and Fire Lancers (Chế Bồng Nga killed by gunfire in 1390; Hồ Nguyên Trừng’s work for the Ming; Sun Laichen 2003), kept out of this level because the firearms trait already gives the team bonus.",
  "N3: A Champa civ (c. 192–1471, Panduranga to 1832), the rival of Đại Việt and Angkor, which could take back the Sanskrit name Chatras.",
]
contested = [
  "The name: the state called itself Đại Cồ Việt from 968 and Đại Việt from 1054, and ‘Việt Nam’ dates from 1804. English scholarship writes the history of the state and its people as Vietnamese history (Taylor 2013; Whitmore 1985; Kelley 2005), so the civ keeps the name Vietnamese (RULES 6.16.15), with Đại Việt as the entity of the profile.",
  "The historicity of the Hùng kings and Văn Lang: the Đông Sơn culture versus traditions elaborated in the 14th–15th centuries (Kelley 2005).",
  "Where Vietnamese firearms came from and which way the technique flowed: the Ming shi, compiled under the Qing (1739), credits the Ming’s ‘divine-engine’ guns to the conquest of Jiaozhi, while Sun Laichen (2003, 2006) argues that the main flow ran from China to Đại Việt. Either way, what reached the Ming came by conquest and capture, not as a gift.",
  "Guns on the water: in 1390, in a naval battle on the river at Hải Triều, Trần Khát Chân’s men killed the Cham king Chế Bồng Nga with a volley of guns aimed at his war boat (Đại Việt sử ký toàn thư; Sun Laichen 2003), the first recorded Vietnamese use of guns. The Cannon Galleon line stays on this ground (gun-armed warships inside the window, RULES 6.16.1), as an abstraction: these were light guns, not the heavy ship artillery of the game’s unit.",
  "The nationalist narrative of continuous resistance to China, criticised by Keith W. Taylor for erasing regional diversity and periods of integration.",
  "Stakes at Bạch Đằng in 981 (tradition only), and whether the excavated stakes belong to 938 or to 1288.",
  "Ngụ binh ư nông (寓兵於農, ‘lodge the army in agriculture’) is a classical Chinese maxim that later Vietnamese historiography uses for the Lý–Trần–Lê system, not a recorded Lý–Trần name.",
  "Stone-throwers: no Vietnamese source for them has been found. A check of the Song accounts of the siege of Yongzhou (1076), the best-recorded Vietnamese siege of the period, found siege towers and ramps but no stone-throwers. The Traction Trebuchet is therefore an inference, not an attestation, unlike the Japanese case, a documented transfer of engines (Goguryeo’s gift of 618): Đại Việt organised its armies on the Chinese model, besieged walled cities from Yongzhou (1076) to the Cham capital Vijaya (1471), and fought between two neighbours whose traction engines are recorded, Song China and Champa (the ‘Muslim three-pole’ pao of the Cham defenders of 1283, Yuan shi 210). The design reads the traction test (RULES 6.16.5) on that regional evidence and flags the inference; the Armenian design is judged by the same standard. The kept Mangonel and Onager are the light stone-thrower of the game skeleton, an abstraction.",
  "The war elephants of the Lý and Trần are known mainly from their enemies’ accounts (Song accounts of the war of 1076–77; the Yuan shi for 1258), those of the Hồ and Lê from Ming and Vietnamese sources. They were a secondary arm of Đại Việt, central for Champa and Angkor, so Tượng Binh takes a light effect, and it stays a tech only as a flagged fallback (see the tech).",
]
open_questions = []

[profile]
entity = "Đại Việt (Đại Cồ Việt from 968, Đại Việt from 1054): the Ngô, Đinh, Early Lê, Lý, Trần, Hồ and Later Lê states of the Việt (Kinh)"
region = "Red River delta and northern Vietnam, expanding south at the expense of Champa"
window = "938–1527 (core 1009–1497)"
sources = [
  "Ngô Sĩ Liên et al., Đại Việt sử ký toàn thư (1479)",
  "Lê Tắc, An Nam chí lược (c. 1335)",
  "Trần Hưng Đạo, Hịch tướng sĩ (1284)",
  "Yuan shi (1370); Ming shilu; Ming shi, Bing zhi (1739)",
  "Keith W. Taylor, The Birth of Vietnam (1983); A History of the Vietnamese (2013)",
  "John K. Whitmore, Vietnam, Hồ Quý Ly, and the Ming (1985)",
  "Sun Laichen, ‘Military Technology Transfers from Ming China and the Emergence of Northern Mainland Southeast Asia (c. 1390–1527)’, Journal of Southeast Asian Studies 34 (2003)",
  "Sun Laichen, ‘Chinese Gunpowder Technology and Đại Việt, ca. 1390–1497’, in N. T. Tran and A. Reid (eds.), Việt Nam: Borderless Histories (2006)",
  "Liam C. Kelley, Beyond the Bronze Pillars (2005)",
  "Roxanna M. Brown, The Ming Gap and Shipwreck Ceramics in Southeast Asia (2009)",
]

[[bonus]]
text = "Mill technologies free"
kind = "economic"
level = 1
change = "new"
replaces = "Economic upgrades cost no wood and research +100% faster"
precedent = "Mill technologies free (Franks)"
basis = "The wet-rice economy of the Red River delta depended on dikes: in 1248 the Trần ordered dikes built along the river from its upper course to the sea and appointed dike officials (Đại Việt sử ký toàn thư), and the hydraulic network stayed under state care, the base of the delta’s dense population. The state’s investment in water control is abstracted as free farming upgrades. The bonus it replaces had no identifiable link."
relevance = "Dike-protected wet rice fed the dense population of the delta, the base of every Việt army and of the southward expansion."

[[bonus]]
text = "Foot Archers and Skirmishers +20% HP"
kind = "military"
level = 1
change = "kept"
precedent = "Foot Archers and Skirmishers +20% HP (Vietnamese)"
basis = "Missile infantry was the core of Việt armies. Their characteristic weapon was the crossbow (nỏ), at home in the delta since Cổ Loa, where bronze trigger mechanisms and thousands of bronze arrowheads have been found (3rd century BC, before the window), and made a national emblem by the legend of An Dương Vương’s magic crossbow; wicker and rattan shields protected light troops across Southeast Asia and southern China. The extra HP abstracts this protected light infantry; the crossbow tradition belongs in this passive rather than in the team bonus because it benefited only Đại Việt (RULES 6.2). The same crossbow tradition is the evidence on which the Arbalester stays (RULES 6.16.3). Bowmen served beside the crossbowmen: Trần Hưng Đạo’s proclamation to his officers (Hịch tướng sĩ, 1284) bids them drill their men in archery until they rival Bàng Mông and Hậu Nghệ, the master archers of Chinese legend. The Thumb Ring stays on that ground, given for an archery tradition the civ’s armies demonstrably used, the East Asian tradition of China, rather than for an attested draw of their own (RULES 6.16.4): Chinese archers drew with the thumb, protected by a thumb ring, and that the Việt bowmen drew the same way is an inference from that tradition, since no source describes their draw."
relevance = "Missile troops and shielded light infantry were the mass of the armies that held off the Song and the Yuan and expelled the Ming."

[[bonus]]
text = "Ngụ Binh Ư Nông free"
kind = "military"
level = 1
change = "kept"
precedent = "Conscription free (Vietnamese)"
basis = "Đại Việt kept rotating peasant-soldiers who farmed between turns of service, the system later historians call ngụ binh ư nông (see contested): in 1429 Lê Lợi sent 250,000 men back to the fields and kept 100,000, who served in five rotating shifts (Đại Việt sử ký toàn thư). The Trần mobilised the whole country against the Mongols: the elders of the Diên Hồng conference (1284) voted to fight, and soldiers tattooed ‘Sát Thát’ (‘kill the Tatars’) on their arms."
relevance = "Mass mobilisation of a peasant army defeated the Mongols three times and expelled the Ming; rotating service kept that army in being."

[[bonus]]
text = "Ships move +10% faster"
kind = "military"
level = 1
change = "new"
replaces = "Enemy Town Centers are revealed at the start of the game"
precedent = "Ships move +10% faster (Berbers)"
basis = "Đại Việt’s most celebrated victories were won on the rivers: at Bạch Đằng in 938 Ngô Quyền’s light boats drew the Southern Han fleet over stakes planted in the riverbed at high tide, and in 1288 Trần Hưng Đạo set the same trap for the Yuan fleet, after Trần Khánh Dư had destroyed the Yuan grain fleet at Vân Đồn in the winter of 1287–88 (Đại Việt sử ký toàn thư; Yuan shi). Speed abstracts the light river craft that lured enemies into these traps. Đại Việt keeps the fleet-of-ships tier (RULES 6.16.1): beside the river craft, its rulers carried armies by sea against Champa (Lý Thái Tông in 1044, Lý Thánh Tông in 1069, Lê Thánh Tông in 1471) in seagoing fleets of war junks, and the Galleon stays as the skeleton’s flagged abstraction (RULES 6.16.2). This design found no source for Vietnamese fire ships (the river victories rested on stakes, tides and boarding); the Fast Fire Ship, absent from the game’s Vietnamese tree, simply stays out. The scouting bonus it replaces was only weakly linked to guerrilla intelligence."
relevance = "The river battles of Bạch Đằng, which ended Chinese rule in 938 and destroyed the Yuan fleet in 1288, are among the defining events of Vietnamese history."

[team_bonus]
text = "Gunpowder Units train +25% faster"
level = 1
change = "new"
replaces = "Imperial Skirmisher upgrade available in Imperial Age"
precedent = "Gunpowder Units train +25% faster (Turks team bonus, which the Turks’ design gives up)"
basis = "Đại Việt was an early gunpowder power of Southeast Asia (in 1390 the Cham king Chế Bồng Nga was killed by Vietnamese gunfire), and its gun-making passed to the Ming through conquest and capture. The Ming shi’s treatise on the army says that when the Yongle emperor conquered Jiaozhi (1407) he obtained the method of the ‘divine-engine’ guns (shenji qiangpao) and set up the Shenjiying, a division to drill with them; Hồ Nguyên Trừng, captured in 1407, directed firearms work for the Ming Ministry of Works and later wrote the Nam Ông mộng lục (1438). A team bonus because the technique went to a neighbour (RULES 6.2: transferred techniques), though by conquest rather than as a gift (see contested); faster training fits a division founded to drill with the new guns. A benefit given willingly, the 15th-century export of Vietnamese ceramics to island Southeast Asia (the Cù Lao Chàm wreck off Hội An; Vietnamese tiles at Trowulan and in the Demak mosque; Brown 2009), was considered as a trade alternative; the gun transfer is kept as the weightier trait (RULES 6.9). The crossbow tradition benefited only Đại Việt, so it grounds the archer bonus rather than a team bonus."
relevance = "Firearms made 15th-century Đại Việt the leading military power of the eastern mainland, and their passage to the Ming, as the Ming shi tells it, is the best-known Vietnamese contribution to Chinese military technology."
contested = "Sun Laichen argues that the main flow ran the other way, from China to Đại Việt, and the Ming shi was compiled three centuries later (see contested)."

[[unique_unit]]
name = "Rattan Archer"
model = "Rattan Archer"
building = "Castle"
level = 1
change = "kept"
basis = "Shields and protection of rattan and wicker were common in Southeast Asia and southern China (the rattan-shield troops, tengpai, of the Ming), which justifies the high pierce armour. The same model also serves the Bengali design’s Paik, renamed, until the Paik gets its own art (N3); the Vietnamese unique unit is shared on that footing."
relevance = "Shield-protected missile infantry, above all crossbowmen, was the core of the Việt armies that fought the Song and the Yuan; the Rattan Archer carries it, with the bow standing in for the crossbow (see contested)."
contested = "The characteristic Việt missile weapon was the crossbow rather than the bow, and ‘rattan armour’ is associated more with the peoples of south-west China."

[[unique_tech]]
name = "Tượng Binh"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Battle Elephants +1 melee/+1 pierce armor"
level = 1
change = "changed"
replaces = "Chatras (Battle Elephants +100 HP)"
precedent = "Howdah (Battle Elephants +1 melee/+1 pierce armor) (Burmese): an existing unique tech, which the Burmese design drops, shared and renamed with an identical effect and age"
basis = "War elephants served Đại Việt’s rulers across the period, though as a secondary arm: Song accounts of the war of 1076–77 report Lý elephants against the Song advance; in 1258 Trần Thái Tông drew up his elephant troops and infantry across the river against Uriyangqadai’s Mongols (Yuan shi, biography of Uriyangqadai); the Hồ fielded elephants against the Ming at Đa Bang (1407), where, by the Ming accounts, they were routed by cavalry in lion masks and by guns, and Lê Lợi’s insurgents used them in the 1420s; Đại Việt fought its southern wars against the elephant armies of Champa. The game’s Chatras (+100 HP) gave the largest Battle Elephant buff in the game to an arm that was secondary in Đại Việt, while the Khmer, for whom elephants were the royal arm, have only +10% speed; the tech therefore takes the lighter effect of the Burmese Howdah, which the Burmese design drops, and stays level 1. The armour is an abstraction of trained elephant troops, not a recorded harness. The elephants are a long-standing arm, which RULES 6.2 would make a passive; they stay a Castle tech as a flagged fallback for a long tradition (RULES 6.16.19(b)), because the Castle needs a military tech and no datable Lý–Trần military moment has a fitting existing effect (a new tech for Trần Hưng Đạo’s proclamation to his officers, Hịch tướng sĩ, 1284, with a modest elephant passive beside it, was considered and not adopted). The Sanskrit chattra (royal parasol) belongs to the Indianised courts of Champa and Angkor; tượng binh, ‘elephant troops’, is the Sino-Vietnamese term."
relevance = "War elephants were the royal heavy arm of Đại Việt from the Lý to the Lê (1077, 1258, 1407), though secondary to its infantry, and the war elephant is a fixture of Vietnamese martial imagery from the Trưng sisters on; fame tips a borderline case (RULES 6.9)."
contested = "Elephants were secondary in Đại Việt, central for Champa and Angkor (see contested)."

[[unique_tech]]
name = "Văn Miếu"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Technologies research +25% faster"
level = 2
change = "new"
replaces = "Paper Money (Lumberjacks slowly generate gold in addition to wood)"
precedent = "Technologies research +25% faster (Portuguese team bonus, which the Portuguese design gives up; also the team bonus of the Arabs’ design), as a tech of the civ alone. A new tech (level 2): no existing unique tech renders an examination state, and Paper Money, the civ’s existing civil tech, fails the relevance test (see dropped)."
basis = "The Lý founded the Temple of Literature (Văn Miếu) in 1070, held the first examination in 1075 and set up the Imperial Academy (Quốc Tử Giám) in 1076; the Trần made the examinations regular, with the three top laureates (tam khôi) from 1247; and under the Lê, above all Lê Thánh Tông (1460–97), examination-recruited Confucian officials ran the state, their names carved from 1484 on the doctors’ stelae of the Văn Miếu (Đại Việt sử ký toàn thư; Taylor 2013). Faster research abstracts an administration of trained literati. At the Town Center because the examinations recruited the state’s officials (RULES 6.2). Castle Age, as the institution dates from the Lý."
relevance = "The examination state made Đại Việt a Confucian monarchy governed by literati, the trait that most set it apart from its Indianised neighbours; erase it and Vietnam’s state and elite culture lose their form until the 20th century."

[tree]
add = ["Hand Cannoneer", "Traction Trebuchet"]
remove = ["Cavalry Archer", "Heavy Cavalry Archer", "Trebuchet"]

[tree.basis]
"Hand Cannoneer" = "In 1390 the Cham king Chế Bồng Nga was killed by Vietnamese gunfire; the Ming took the Vietnamese gun-making method after 1407 (see the team bonus), and the Lê used firearms against Champa (1471) and Lan Xang (1479–80) (Sun Laichen 2003). The civ had Bombard Cannon and Fire Lancer but no hand-held gun, against its own game history text."
"Traction Trebuchet" = "An inference, flagged (see contested): Đại Việt’s pre-gunpowder heavy artillery would have been the traction stone-thrower (pao) of the Chinese military tradition on which it modelled its armies, the engine of both its neighbours, Song China and Champa (Yuan shi 210, for the Cham in 1283); no Vietnamese source names one, and the Song accounts of Yongzhou (1076) record towers and ramps instead. On that regional evidence it replaces the counterweight Trebuchet as the long-range siege weapon (RULES 6.11, 6.16.5), beside the Bombard Cannon of the 15th-century Hồ and Lê (Sun Laichen 2003, 2006)."
"Trebuchet" = "The counterweight trebuchet reached China only in 1273 (Xiangyang), and no Vietnamese source for it is known; the Chinese, Japanese and Korean designs, among others, make the same change (RULES 6.16.5)."
"Cavalry Archer" = "No Vietnamese tradition of mounted archery is known, and horses were scarce in the delta."
"Heavy Cavalry Archer" = "As for the Cavalry Archer."

[[rename]]
from = "Conscription"
to = "Ngụ Binh Ư Nông"
level = 1
basis = "Same effect. ‘Conscription’ evokes modern compulsory service (France, 1798); the Vietnamese equivalent is the rotating levy of trained reserves who farmed between turns of service, which later historians call ngụ binh ư nông (see contested), well attested under Lê Lợi (1429). Vietnamese is written in the Latin script, so the name keeps its diacritics (RULES 6.16.15)."

[architecture]
set = "East Asian"
change = "changed"
replaces = "Southeast Asian"
basis = "Đại Việt built in Chinese timber-frame forms with tiled, curved roofs, such as the One Pillar Pagoda (1049), the Temple of Literature (1070) and the Thăng Long citadel, and raised brick pagoda-towers of Chinese type such as Phổ Minh (1310), with some Cham decorative influence under the Lý; the surviving buildings are largely later reconstructions (the One Pillar Pagoda was rebuilt in 1955). The Southeast Asian set evokes instead the Indic brick and stone towers of Champa and Angkor."

[[dropped]]
item = "Imperial Skirmisher"
kind = "unique_unit"
reason = "No Vietnamese troop type matching an ‘imperial’ javelin skirmisher is known; it was a balance variant, and keeping it as a pure game abstraction, the elite light infantry of a skirmisher civ, was considered and not adopted. The Vietnamese keep the Elite Skirmisher, and its team bonus is replaced."

[[dropped]]
item = "Paper Money"
kind = "unique_tech"
reason = "Relevance test (RULES 6.9). Hồ Quý Ly’s paper notes of 1396 (Thông bảo hội sao), modelled on the Ming paper currency (Da Ming baochao, from 1375), were a coercive and unpopular measure that disappeared with the Hồ in 1407 (Whitmore 1985): erasing them would change neither Đại Việt’s course nor its identity, and most of their fame comes from the game. They could pass only by standing for Hồ Quý Ly’s whole reform programme, which neither the name nor the effect (lumberjacks generate gold) represents. The Town Center slot goes to the examination state (Văn Miếu); keeping Paper Money anyway, as an optional third tech at the Market framed on the notes of 1396 and their failure, was considered and not adopted. Its effect lives on as the Rus' Kalita (Ivan I's handling of the Horde's tribute, Town Center, Imperial Age)."
