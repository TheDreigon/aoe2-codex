civ = "Vikings"
name = "Norse"
status = "draft"
label = "Infantry and Naval civilization"
summary = "Vikings renamed Norse and narrowed to the West Norse world of Norway and its North Atlantic colonies (c. 790–1380), leaving Denmark to the Danes and the eastern routes to the Varangians: stockfish and sheep replace the unfounded free Wheelbarrow/Hand Cart, the Leiðangr naval levy replaces Chieftains, Berserk and Bogsveigar stay, the medieval Christian kingdom gains Monastery techs and Keeps, and Cavalier, Mounted Crossbowman, Siphons and Catapult Galleon leave."
ideas = [
  "N2: Skíðamenn, a cheap gold-free ski scout replacing Scout Cavalry and faster on snow terrain (ski troops in Sverris saga; the Birkebeinar who carried the child Haakon Haakonsson to safety in 1206).",
  "N2: A Kristnitaka choice at the Monastery: convert (full Monastery tree) or stay pagan (Berserks keep their regeneration), for the conversions of Olaf Tryggvason and St Olaf (995–1030) and the Althing's decision of 999/1000.",
  "N2: Give the Norse Shipwright with a smaller warship discount, so that the shipbuilders' tech is not missing from the best-documented shipbuilders of the game.",
  "N3: A thing (assembly) building and a landnám mechanic for settling empty islands (Iceland c. 870–930, Greenland c. 985, L'Anse aux Meadows c. 1021).",
  "N3: Walrus ivory and hides as a tradeable resource (Ohthere's walrus hunt reported to King Alfred, c. 890; Greenland ivory in European workshops).",
]
contested = [
  "Etymology of víkingr (vík ‘bay’, the Víken region, víkja ‘to turn aside’ or Old English wīc ‘trading place’); in any case it named an activity, not a people.",
  "Whether the first raiders of the 790s (Portland, Lindisfarne) were Norwegians: English sources call all Scandinavians ‘Dene’, though one Anglo-Saxon Chronicle version says the Portland men came from Hǫrðaland.",
  "Date and organisation of the leiðangr before the provincial laws of the 12th–13th centuries (Snorri credits Haakon the Good, mid-10th century).",
  "Nature of the berserkir: an Odinic warrior cult, ritual trance or literary type; the hallucinogen theories are speculative.",
  "Date of Hafrsfjord (traditionally c. 872, now often the 880s) and the real extent of Harald Fairhair's unification.",
]
open_questions = [
  "Scope: Norse = the West Norse world (Norway, the Northern Isles, the Hebrides and Man, Norse Dublin, the Faroes, Iceland, Greenland); Danes = the kingdom of Denmark with Scania, the Danelaw and Cnut's North Sea empire; Varangians = the East Norse (Svear and Gotlanders) of the eastern routes and the Byzantine Guard. The split follows the Old West Norse / Old East Norse dialect division and the medieval kingdoms, and removes the triple coverage of Lindisfarne, Cnut and Kiev. Confirm?",
  "End of the window: 1380 (union with Denmark under Olaf IV), 1397 (Kalmar Union) or 1266 (Treaty of Perth, when the Hebrides and Man were ceded)?",
  "The Varangian Guard stays in the Norse tree as returning veterans (Harald Hardrada served 1034–1043 before ruling Norway; Icelanders such as Bolli Bollason). Remove it to sharpen the contrast with the Varangians?",
  "Knight is kept for the small mounted hirð of the 13th-century kings and only the Cavalier is removed. Remove the Knight too?",
  "Catapult Galleon is removed from all three Norse civs; the Longship (strong vs buildings) is the substitute anti-building ship. Accept?",
  "Monastery: Illumination, Sanctity and Herbal Medicine are added; Redemption and Theocracy stay out, so the Norse are not a Monk civ. Enough for a kingdom Christian from c. 1030?",
  "Architecture: the current set is not in the repository data; the official Viking Sagas FAQ gives Danes, Varangians and Vikings a new shared set, assumed here to be Northern European.",
]

[profile]
entity = "The Norse of Norway and the North Atlantic (the West Norse world)"
region = "Norway, the Northern Isles, the Hebrides and Man, Norse Dublin, the Faroes, Iceland and Greenland"
window = "c. 790–1380"
sources = [
  "Anglo-Saxon Chronicle",
  "Ohthere's account in the Old English Orosius (c. 890)",
  "Ari Þorgilsson, Íslendingabók; Landnámabók",
  "Snorri Sturluson, Heimskringla (c. 1230)",
  "Gulaþingslög and Frostaþingslög; Grágás; Konungs skuggsjá (c. 1250)",
  "Judith Jesch, Ships and Men in the Late Viking Age (2001)",
  "Knut Helle (ed.), The Cambridge History of Scandinavia, vol. 1 (2003)",
  "Neil Price, Children of Ash and Elm (2020)",
  "B. Star et al., ‘Ancient DNA reveals the Arctic origin of Viking Age cod from Haithabu, Germany’, PNAS 114 (2017)",
]
replaces = "Vikings (all Scandinavians of the Viking Age, named after an activity rather than a people)"

[[bonus]]
text = "Infantry +20% HP starting in Feudal Age"
kind = "military"
level = 1
change = "kept"
precedent = "Infantry +20% HP starting in Feudal Age (Vikings)"
basis = "Norse armies fought on foot in the shield wall (skjaldborg) and used horses to move, not to charge. Mail was costly and rare (the Gjermundbu helmet is the only near-complete Viking helmet found), so the bonus stands for shields, cohesion and endurance rather than armour (Price 2020)."

[[bonus]]
text = "Warships cost -10/15/20% in Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Warships cost -10/15/20% in Feudal/Castle/Imperial Age (Vikings)"
basis = "Clinker-built ships from abundant timber, seen in the Norwegian ship burials of Oseberg (834) and Gokstad (c. 900), and the leiðangr, under which coastal districts built, manned and provisioned ships for the king (Gulaþingslög; Jesch 2001)."

[[bonus]]
text = "Fishing also generates gold"
kind = "economic"
level = 1
change = "new"
replaces = "Wheelbarrow, Hand Cart free"
precedent = "Shepherding, fishing, and hunting also generate gold (Varangians): the fishing part only"
basis = "Stockfish, cod dried on the racks of northern Norway, was the Norse export par excellence: ancient DNA shows that cod eaten at Haithabu in 800–1066 came from the Arctic Lofoten stock (Star et al. 2017), and from the 12th century Bergen shipped it across Europe, later through the Hanseatic Bryggen. The replaced bonus had no historical basis (no known Norse excellence in land transport)."

[[bonus]]
text = "Shepherds work +25% faster"
kind = "economic"
level = 1
change = "new"
precedent = "Shepherds work +25% faster (Britons)"
basis = "The North Atlantic colonies lived on livestock: settlers shipped sheep and cattle (Landnámabók tells how Hrafna-Flóki's herds starved because he neglected haymaking), the Faroes were the ‘sheep islands’ (Færeyjar), and homespun wool (vaðmál) was legal tender in Iceland (Grágás)."

[team_bonus]
text = "Docks cost -15%"
level = 1
change = "kept"
precedent = "Docks cost -15% (Vikings team bonus)"
basis = "Abstraction of a society organised around ships: the coast was divided into ship districts (skipreiður) that owed vessels and crews to the levy (Gulaþingslög)."

[[unique_unit]]
name = "Berserk"
model = "Berserk"
building = "Castle"
level = 1
change = "kept"
basis = "Berserkir appear in skaldic verse at Hafrsfjord (Þorbjǫrn hornklofi, Haraldskvæði, c. 900), and Snorri describes warriors without mail who bit their shields and were hurt by neither fire nor iron (Ynglinga saga 6); regeneration renders that legendary invulnerability."
contested = "They were an elite or cultic minority, not mass troops; the sagas often make them villains, and the Christian-law section of the Icelandic Grágás punished going berserk with lesser outlawry."

[[unique_tech]]
name = "Leiðangr"
age = "Castle"
effect = "Ships train +33% faster; Docks provide +5 population space"
level = 1
change = "new"
replaces = "Chieftains"
precedent = "Ships train +33% faster (Circumnavigation, Portuguese); Docks provide +5 population space (Dravidians team bonus)"
basis = "The naval levy of the Norwegian kings: each ship district had to build, man and provision a warship when the king called out the leiðangr. It is first named in verse on Hjǫrungavágr (c. 986) and regulated in detail in the Gulaþingslög and Frostaþingslög (12th–13th centuries). Chieftains is replaced because its name (any chief, goði or jarl) has nothing to do with its anti-cavalry effect."
contested = "How organised the leiðangr was before the written laws is debated; Snorri's attribution to Haakon the Good is late."

[[unique_tech]]
name = "Bogsveigar"
age = "Imperial"
effect = "Archer-line and Longships +1 attack"
level = 1
change = "kept"
precedent = "Archer-line and Longships +1 attack (Bogsveigar, Vikings)"
basis = "Old Norse bogsveigir, ‘bow-bender’. Archery decided Norse sea fights: Einarr Þambarskelfir is the famous archer of Olaf Tryggvason's last battle at Svolder (c. 1000, Heimskringla), and the King's Mirror (c. 1250) counts bows and crossbows among the weapons of war at sea."

[tree]
add = ["Keep", "Illumination", "Sanctity", "Herbal Medicine"]
remove = ["Cavalier", "Mounted Crossbowman", "Siphons", "Catapult Galleon"]

[tree.basis]
"Keep" = "Norway built royal stone castles from the late 12th century: Sverresborg in Trondheim and Bergen (1180s), Bergenhus with Håkonshallen (c. 1261), Tunsberghus and Akershus (c. 1299)."
"Illumination" = "Norway was Christian from c. 1030 (St Olaf, Stiklestad), with an archbishopric at Nidaros from 1152/53 whose province reached Iceland, Greenland, the Faroes, Orkney and Man; a pagan Monastery until 1500 is anachronistic."
"Sanctity" = "The cult of St Olaf made Nidaros the main pilgrimage centre of the North."
"Herbal Medicine" = "Monastic houses and hospitals spread with the 12th-century church; a generic Monastery tech held by most civs."
"Cavalier" = "Norway never fielded a large knightly cavalry; the 13th-century kings had only a small mounted hirð, represented by the Knight."
"Mounted Crossbowman" = "A late-medieval continental troop type (13th–15th centuries) never characteristic of Norway; it came with a generic ‘Western European’ block."
"Siphons" = "The siphon for liquid fire was a Byzantine state secret that Constantine VII ordered never to be given to another nation (De Administrando Imperio 13)."
"Catapult Galleon" = "There is no evidence of ship-borne catapults in Norse fleets; the Longship (strong vs buildings) keeps the role of attacking coastal buildings."

[architecture]
set = "Northern European"
change = "kept"
basis = "The Viking Sagas set for Scandinavia (timber halls, clinker ships) fits Norway, whose wooden stave churches and halls set it apart from the stone architecture of the south."
