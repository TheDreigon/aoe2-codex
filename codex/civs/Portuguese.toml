replaces = "The Portugal of the Discoveries only (c. 1415–1550): Organ Gun, Arquebus, Circumnavigation"

[[bonus]]
text = "Crossbowman and Arbalester upgrades free"
kind = "military"
level = 1
change = "new"
replaces = "Foragers generate wood in addition to food"
precedent = "Militia-line upgrades free (Bulgarians); Pikeman upgrade free (Ethiopians)"
basis = "The crossbow was the main missile weapon of Portuguese armies and fleets from the 13th to the 15th century: the Crown fixed a quota (conto) of crossbowmen for every concelho, mostly artisans enrolled under an anadel-mor, and their rolls counted several thousand men by the early 15th century, beside mounted crossbowmen (besteiros de cavalo) and a royal guard of crossbowmen (Monteiro, 1998). Crossbowmen fought beside the dismounted men-at-arms at Atoleiros (1384) and Aljubarrota (1385) (Fernão Lopes). Owner's agreed example; the forager-wood bonus it replaces had no historical basis. The passive and the Besteiro do Conto both rest on the crossbowmen, as the owner's example and decision imply, and both are kept (level-1 review decision): the unit renders the enrolled crossbowman in battle, the passive the quota system that kept the crossbow the kingdom's main missile arm for two centuries."
relevance = "The crossbowmen were the backbone of the kingdom's infantry for two centuries and fought in the battles that secured its independence."
contested = "Whether the besteiros do conto began under D. Dinis (c. 1299) or D. Afonso IV is debated."

[[bonus]]
text = "Fishing Ships work +5/10/15/20% faster in Dark/Feudal/Castle/Imperial Age"
kind = "economic"
level = 1
change = "new"
replaces = "All units cost -20% gold"
precedent = "Fishing Ships work +5/10/15/20% faster in Dark/Feudal/Castle/Imperial Age; +100% HP (Japanese), without the HP part"
basis = "Fish and salt were staples of the medieval Portuguese economy and of its exports: the treaty of London (20 October 1353) allowed the fishermen of Lisbon and Porto to fish off the English coasts for 50 years, and the salt pans of Setúbal, Aveiro and the Tagus estuary fed the trade in salted fish (Oliveira Marques, 1972). The -20% gold bonus it replaces had no basis: Portugal was a small kingdom short of coin, and the gold of Mina (from 1471) is already the Feitoria's role."
relevance = "Fishing and salt made the coastal economy and trained the seamen of the discoveries; a fishing bonus the relevance test accepts, because fishing shaped this civ."

[[bonus]]
text = "Ships +10/15/20% HP in Feudal/Castle/Imperial Age"
kind = "military"
level = 1
change = "kept"
precedent = "Ships +10/15/20% HP in Feudal/Castle/Imperial Age (Portuguese)"
basis = "An acceptable abstraction of the large, sturdy naus (carracks) of the Carreira da Índia and of long experience of the open Atlantic; the age scaling is purely mechanical (Diffie and Winius, 1977). Shipwright stays out of the tree, as in the game, although the royal shipyard of Lisbon could ground it: it would stack with this bonus and with Volta do Mar's faster ship production (level-1 review decision)."
relevance = "Ocean-going ships carried the expansion that defines Portugal's place in history."
contested = "Before c. 1400 the royal navy was modest and was organised with Genoese help (Manuel Pessanha, admiral from 1317)."

[[bonus]]
text = "Can build Feitoria in Imperial Age"
kind = "economic"
level = 1
change = "kept"
precedent = "Can build Feitoria in Imperial Age (Portuguese)"
basis = "Feitorias were the central institution of the Portuguese trading network: Flanders (Bruges, later Antwerp), Arguim (1440s), São Jorge da Mina (1482), Calicut and Cochin (1500–1503) (Diffie and Winius, 1977; Disney, 2009). Passive income is a fair abstraction of a chain of trading posts; Arguim and Mina also traded in enslaved people, a trade whose Portuguese beginnings (1441–1444) Zurara describes."
relevance = "The feitoria network was the institution of Portuguese overseas trade and empire."

[team_bonus]
text = "Ships move +5% faster"
level = 1
change = "new"
replaces = "Technologies research +25% faster (owner's ruling: it fails RULES 6.2, and the 'school of Sagres' it alluded to is a myth)"
precedent = "Ships move +10% faster (Berbers), halved for a team-wide effect"
basis = "Portugal trained the seamen, pilots and chart-makers who carried Atlantic navigation abroad, and the transfer began well before 1500. Foreign captains learned the Guinea route in Prince Henry's service (the Venetian Cadamosto and the Genoese Usodimare, 1455–1456); Columbus sailed with the Portuguese in the 1470s–1480s, to Guinea by his own later notes, and took what he had learned to Castile, which sent him west in 1492; and Portugal spread the solar tables of Abraham Zacuto, a Salamanca astronomer whose work it had translated into Latin (José Vizinho) and printed at Leiria in 1496 (Diffie and Winius, 1977; Phillips and Phillips, 1992). An epilogue after 1500, inside the window, shows the same flow: the Cantino planisphere, a Portuguese chart smuggled to Ferrara in 1502; Juan Díaz de Solís, who had sailed for Portugal, as Castile's chief pilot (piloto mayor) from 1512; Magellan and Rui Faleiro in Castilian service from 1517; and the chart-makers Pedro and Jorge Reinel at Seville in 1519. Faster allied ships stand for the men and methods that passed from Portugal to its neighbours. The design keeps this effect rather than 'Docks +6 line of sight' (the game's Malay team bonus) or 'Docks cost -15%' (Vikings) (level-1 review decision)."
relevance = "Before 1500, the foreign seamen who sailed in Portuguese service (Columbus among them) and the solar tables printed at Leiria carried Portugal's Atlantic navigation to Italy and Castile, and its pilots and charts kept it flowing after 1500: Portugal's main legacy to its neighbours, as RULES 6.2 requires."
contested = "How far the Crown kept its knowledge secret (see the civ-level list)."

[[unique_unit]]
name = "Besteiro do Conto"
model = "Genoese Crossbowman"
building = "Castle"
level = 1
change = "new"
replaces = "Organ Gun"
basis = "The municipal crossbowmen of the quotas (contos): each concelho had to keep a fixed number of enrolled crossbowmen, mostly artisans, who trained, mustered under an anadel-mor and enjoyed privileges in return (Monteiro, 1998); they fought at Atoleiros (1384) and Aljubarrota (1385) (Fernão Lopes). The Genoese Crossbowman, strong against cavalry, is the closest existing unit; it is shared with the Italians and renamed (owner's decision). Since the Italians' team bonus also gives the Genoese Crossbowman to their allies, a Portuguese–Italian team fields the same unit under two names, which the design accepts (level-1 review decision; RULES 6.16.12). The Scenario Editor's Heavy Crossbowman (RULES section 5), a foot crossbowman with high attack and range (base 10 attack and range 6 in the extracted game data, codex/tools/scenario-units-stats.md), would avoid the double and suit the N2 idea of a hard-hitting besteiro, but it has no anti-cavalry role, its play is untested, and the owner chose the Genoese model, so it is not adopted. The Organ Gun it replaces was the pan-European ribaudequin (England 1339, Flanders 1382, Burgundy, Italy), with no Portuguese speciality."
relevance = "The besteiros do conto were the kingdom's enrolled crossbow militia from c. 1300 to the late 15th century, and fought in the battles that secured independence (1384–1385)."
contested = "The founding date (D. Dinis or D. Afonso IV); the model's strength against cavalry abstracts crossbowmen fighting in a defensive line."

[[unique_unit]]
name = "Caravel"
model = "Caravel"
building = "Dock"
level = 1
change = "kept"
basis = "The lateen caravel was refined in Portugal through the 15th century and carried the Guinea voyages and Bartolomeu Dias (1487–1488); it also served as an armed patrol ship in the Strait and off Morocco (Diffie and Winius, 1977). It was mainly a light exploration ship; the armed 'caravela redonda' is the closest war version."
relevance = "The caravel is the emblem of the Portuguese discoveries."

[[unique_tech]]
name = "Aljubarrota"
building = "Castle"
kind = "military"
age = "Castle"
effect = "Infantry and Foot Archers +1 melee/+1 pierce armor"
level = 2
change = "new"
replaces = "Arquebus"
precedent = "Foot Archers and Condottieri +1 melee/+1 pierce armor (Italians), with the Condottieri widened to all Infantry; Fabric Shields (Kamayuks, Slingers and Champi Warriors +1 melee/+1 pierce armor, Incas)"
basis = "Nuno Álvares Pereira's defensive battles of the crisis of 1383–1385: at Atoleiros (6 April 1384) his men fought on foot and broke a larger Castilian cavalry force; at Aljubarrota (14 August 1385) the Portuguese and their English allies held a chosen position, with dismounted men-at-arms in the centre and crossbowmen and archers on the wings, strengthened with ditches, pits and abatis, and defeated the Franco-Castilian army; Valverde (October 1385) followed (Fernão Lopes; Monteiro, 2003 and 2009). The tech stands for the defensive system the Portuguese adopted from English practice, known through the alliance of 1373, the Earl of Cambridge's expedition (1381–1382) and the English archers of 1385: armour for infantry and foot archers abstracts a prepared position, whether it was attacked on horse or on foot. The Arquebus tech it replaces had no Portuguese specificity: the arquebus was a German and Burgundian weapon that Portugal spread rather than developed."
relevance = "Aljubarrota secured Portuguese independence and the new Avis dynasty that launched the expansion; it is the most famous battle of Portuguese history, commemorated by the monastery of Batalha."
contested = "The famous 'square' (quadrado) of Nuno Álvares is a later reconstruction, and the battle applied an existing model rather than a new one (Monteiro, 2003 and 2009); how much of the Franco-Castilian vanguard attacked mounted or on foot, and the numbers on each side, are debated. Because the attack came both ways, the design keeps armour for the prepared position as a whole rather than the narrower anti-cavalry 'Spearman-line and Foot Archers receive -2 damage from Mounted Units' (Royal Heirs, Ethiopians), which would fit Atoleiros alone (level-1 review decision)."

[[unique_tech]]
name = "Lei das Sesmarias"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "Farmers work +15% faster"
level = 2
change = "new"
precedent = "Farmers work +15% faster (Slavs)"
basis = "King Fernando I's law of 1375, issued when the Black Death had left land untilled, obliged owners to cultivate their land or have it cultivated, on pain of losing it to others, and put the idle to work in the fields (Rau, 1946; Oliveira Marques, 1972). Owner's decision, as in the agreed example (RULES section 8)."
relevance = "Portugal's great agrarian law answered the post-plague crisis, and its sesmarias later shaped land grants overseas, Brazil included."
contested = "How far the law achieved its aims is debated: it did not end the shortage of labour, and its compulsions had to be reissued; the effect assumes its intent."

[[unique_tech]]
name = "Ordem de Cristo"
building = "Monastery"
kind = "civil"
age = "Castle"
effect = "Dock technologies cost -25%; each garrisoned Relic provides +1 attack to the Galley-line (maximum +2)"
level = 2
change = "new"
precedent = "Effect 1: Dock and University technologies cost -25% (Italians), Dock part only. Effect 2: Each garrisoned Relic provides +1 attack to Knight-line and Leitis (maximum +4) (Lithuanians in the game), retargeted to the Galley-line and capped at +2, the highest attack bonus the game gives that line (Ballistas: Scorpions attack +33% faster; Galley-line +2 attack, Romans), as the magnitude ceiling of RULES 6.16.11 requires. A new tech combining narrowed effects, so level 2 (RULES 6.5)"
basis = "At King Dinis' request, Pope John XXII founded the Order of Christ by the bull of 14 March 1319 and gave it the Portuguese property of the suppressed Templars, with its seat at Castro Marim and later Tomar. Prince Henry governed the order from 1420 and used its revenues for the Atlantic and African voyages; in 1456 the papacy gave it spiritual jurisdiction over the new lands, and its red cross was carried on the sails (Russell, 2000; Disney, 2009). The relic-driven attack is an abstraction, not a documented practice: it stands for the crusading frame the papacy gave the African enterprise and the order, the indulgences of Dum diversas (1452) and Romanus pontifex (1455) and the order's spiritual jurisdiction (1456). Owner's decision, as is its scope: the relic attack goes to the Galley-line only, the war galleys of the royal fleet that fought the crusading war in the Strait and off Morocco from Ceuta (1415) on, at most +2. At +4 on every warship it would have doubled or tripled the attack of the light ships (Caravel 4 to 8, Fire Galley 2 to 6, firing every 0.25 s) from the Castle Age and stacked with the ship-HP passive, Volta do Mar and the team's faster ships (level-1 review, section 3.1; owner's decision of section 9)."
relevance = "The Order of Christ financed the expansion and gave it its crusading frame; its cross on the sails is the emblem of the discoveries."

[[unique_tech]]
name = "Volta do Mar"
building = "Dock"
kind = "civil"
age = "Imperial"
effect = "Sets the entire map to explored; Ships train +33% faster"
level = 1
change = "changed"
replaces = "Circumnavigation"
precedent = "Circumnavigation (Portuguese): identical effect, moved to the Dock and from the Castle to the Imperial Age, as in the owner's agreed example (RULES section 8)"
basis = "The Portuguese way home from Guinea: instead of beating against the trade winds along the African coast, ships stood out into the open Atlantic towards the Azores to pick up the westerlies, a route worked out on the West African voyages of the 15th century. Its South Atlantic form opened the Cape route: Dias was carried out to sea round the Cape (1487–1488), and Gama made the first deliberate great arc through the South Atlantic (1497), helped by solar tables and the astrolabe (Diffie and Winius, 1977). The faster ship production is mechanical, loosely the royal shipyard of Lisbon (the Ribeira das Naus) that fitted out the yearly India fleets from 1500. Circumnavigation honoured the Castilian expedition of Magellan and Elcano (1519–1522), which Portugal tried to stop."
relevance = "The open-ocean route made the Cape route and the Portuguese maritime empire possible; it is the core of the discoveries."
contested = "Whether Dias's swing into the open ocean was deliberate or storm-driven."

[tree]
add = ["Arrowslits", "Hoardings", "Genitour", "Elite Genitour"]
remove = ["Thumb Ring", "Siphons"]

[tree.basis]
"Arrowslits" = "Portugal kept a dense network of frontier castles, rebuilt under D. Dinis (1279–1325) and his successors with tall keeps, machicolations and loopholes (Monteiro, 1999). Owner's decision in the agreed example. These castles also carry the kingdom's first century of conquest (Santarém and Lisbon 1147, Alcácer do Sal 1217, the Algarve 1249), which has no slot of its own: the design stays at 4 passive bonuses and 4 unique techs (8), without a fifth passive for the military orders of the frontier or the concelho cavalry (level-1 review decision)."
"Hoardings" = "Same castle network: wooden and later stone galleries on the walls of the castles of D. Dinis and his successors (Monteiro, 1999). Owner's decision in the agreed example."
"Genitour" = "Riding à gineta (short stirrups, light lance, javelins and leather adarga), taken from the Zenata and Granadan horsemen, was one of the two riding styles of Portuguese cavalry: King Duarte's Livro da Ensinança de Bem Cavalgar Toda Sela (c. 1434–1438) teaches both à brida and à gineta. Ginetes were central to the raiding war around the Moroccan strongholds (Ceuta from 1415, Alcácer Ceguer from 1458, Arzila and Tangier from 1471), which Zurara's chronicles of the Meneses (Ceuta and Alcácer Ceguer, to 1464) and Rui de Pina's chronicle of Afonso V narrate (Ricard, 1955). The ginete's main weapon was the short lance, with javelins secondary; the Genitour, a javelin horseman that cannot fight at close range, is the closest existing unit. A regional unit (owner's decision; RULES 6.16.10) that does not count as a unique unit (RULES 6.1), trained at the Archery Range from the Castle Age as for the Berbers' allies, and renamed Ginete."
"Elite Genitour" = "The Elite upgrade of the Ginete (Archery Range), for the same light horsemen."
"Thumb Ring" = "The Thumb Ring is given where the thumb draw is attested for a civ's own archers or for an archery tradition its armies demonstrably used (the steppe, Islamic and East Asian traditions); civs whose archers used the European draw, or whose missile troops were crossbowmen, do not get it. Portugal does not: its archers used the European draw and its missile troops the crossbow (see the Besteiro do Conto) (RULES 6.16.4)."
"Siphons" = "Named after the Byzantine fire siphon, a state secret never given to other nations (De Administrando Imperio 13); no ship-borne liquid-fire weapon is documented for this civ. The Portuguese keep the fleet-of-ships tier (RULES 6.16.1): the royal war galleys of the 14th century, the caravels and the gun-armed naus of the India fleets (Diffie and Winius, 1977)."

[[rename]]
from = "Genitour"
to = "Ginete"
level = 1
basis = "Ginete is the Portuguese name (from Zenata) of the light horseman the Castilians call jinete: the same regional unit, named in each language. The rename meets RULES 6.16.15: the same function inside the window, a period term (à gineta in King Duarte's Livro da Ensinança), and 'genitour' is the English and French borrowing of the same word. The Berbers keep 'Genitour', and the Lithuanians, to whom RULES 6.16.10 extends the regional unit, name it in their own design."

[[rename]]
from = "Elite Genitour"
to = "Elite Ginete"
level = 1
basis = "Same rename for the Elite upgrade."

[[rename]]
from = "Elite Genoese Crossbowman"
to = "Elite Besteiro do Conto"
level = 1
basis = "Follows the unique unit (Genoese Crossbowman → Besteiro do Conto), for the Portuguese only; the Italians keep the Genoese Crossbowman."

[architecture]
set = "Mediterranean"
level = 1
change = "kept"
basis = "Portuguese Romanesque and Gothic (Braga, Alcobaça, Batalha) and the whitewashed southern towns sit well in the Mediterranean set; an Iberian set of its own would be N3."
