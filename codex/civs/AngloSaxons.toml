]
replaces = "Saxons as a name that leaves out the Angles who gave England its name (Bede’s Northumbria, Offa’s Mercia) and collides with the continental Saxons; England after 1066 belongs to the English design"

[[bonus]]
text = "Mills, Lumber- and Mining Camps provide +35 food when built"
kind = "economic"
level = 1
change = "changed"
replaces = "Mills, Lumber- and Mining Camps provide +35 food and +10 stone when built"
precedent = "Mills, Lumber- and Mining Camps provide +35 food and +10 stone when built (Saxons), without the stone; Military production buildings and Docks provide +55 food when built (Wu)"
basis = "Food render (feorm): estates owed the king fixed renders in kind, and Ine’s law 70.1 (c. 694) lists what ten hides owed: ten vats of honey, 300 loaves, ale, cattle or wethers, geese, hens, cheeses, butter, salmon and eels (Lavelle, ‘Ine 70.1 and Royal Provision in Anglo-Saxon Wessex’, 2013). Mills were dense: Domesday (1086) records at least 5,624, many older than the Conquest, like the mill excavated at Old Windsor. Woodland also yielded food, as pannage for swine (Domesday measures woods by the pigs they fed); the Mining Camp has no such link and stays for balance. The +10 stone is dropped: nothing links it to camps."
relevance = "Food renders fed the itinerant kings and their households and were the economic base of early English kingship; a borderline pass, since royal food renders were common to early medieval kingship (the Frankish servitium regis, the Welsh gwestfa, the Irish cuid oíche) and the link to camps is weak."
contested = "An abstraction: each new estate centre is assumed to bring in its first render. The feorm went to royal vills and estate centres, not to camps, so the history would favour ‘Mills and Town Centers provide +35 food when built’; the design keeps the game’s targets because Town Centers are built too rarely for the bonus to matter in a civ that already loses much of its tree, and the link is closest for Mills."

[[bonus]]
text = "Town Centers +10 garrison capacity"
kind = "other"
level = 1
change = "new"
precedent = "Town Centers +10 garrison capacity; Towers +5 garrison capacity (Teutons), narrowed to Town Centers"
basis = "The burh was a garrisoned town and refuge: the Burghal Hidage assigns one man per hide and four men to each pole of rampart for some 30 burhs of Alfred’s and Edward the Elder’s Wessex, spaced so that few places lay more than a day’s march from one (Hill and Rumble 1996; Abels 1998). In the wars of 893–896 and 917 the garrisons of the burhs sallied against Danish armies (Anglo-Saxon Chronicle)."
relevance = "The burhs were the defence that saved Wessex from the Danes and the bases from which the Danelaw was reconquered in the 910s."

[[bonus]]
text = "Foot Soldiers cost -5% per Town Center or Castle controlled (maximum -20%)"
kind = "military"
level = 1
change = "kept"
precedent = "Foot Soldiers cost -5% per Town Center or Castle controlled (maximum -20%) (Saxons)"
basis = "Service was tied to land and to the burhs: the Burghal Hidage fixes the men owed for each burh by the hides assigned to it, one man for each hide, and the burhs were the musters and bases of the levy in the Danish wars of 892–896 and 910–920 (Anglo-Saxon Chronicle; Abels, Lordship and Military Obligation, 1988). More fortified centres meant a larger and cheaper levy. Alfred’s division of the levy (893) is the basis of the Fyrd tech."
relevance = "Land-based military service, organised around the burhs, raised the armies with which the West Saxon kings defeated the Danes."
contested = "‘Castle’ is anachronistic before the Norman castles of the 1050s; in this civ it stands for a major fortified centre."

[[bonus]]
text = "Palisade Walls +30% HP; Stone Walls +30% HP starting in Castle Age; Walls and Gates built +50% faster"
kind = "other"
level = 1
change = "new"
replaces = "Towers and Castles fire +100% base arrows starting in Castle Age"
precedent = "Palisade Walls +33% HP (Cumans team bonus), at a lower magnitude, for the timber ramparts; Great Wall (Walls, Watch Tower-line and Bombard Towers +30% HP) (Chinese), narrowed to Stone Walls and kept in the Castle Age, the game age of the tech, since a reused effect that becomes a passive never comes earlier (RULES 6.16.11); Fortifications built +50% faster (Sicilians), narrowed to Walls and Gates"
basis = "Burhs were earth banks and ditches with timber revetments and palisades, some reusing Roman walls (Winchester, Exeter, Bath), raised and kept up by obligated labour (burh-bot, one of the ‘common burdens’ laid on all land from 8th-century Mercia onwards; Brooks 2000): Edward the Elder stayed four weeks at Buckingham in 914 and built a burh on each side of the river, and Æthelflæd raised about ten burhs between 910 and 915 (Anglo-Saxon Chronicle). Most burh defences were earth and timber, rendered by the Palisade Walls from the start; the Stone Walls, for the burhs that reused Roman walls, gain their HP only from the Castle Age, the game age of the effect they reuse (RULES 6.16.11). The old arrow bonus is dropped: castles were the Norman novelty, and Orderic Vitalis blamed the weak English resistance after 1066 on the scarcity of the fortifications ‘which the Gauls call castles’."
relevance = "The burhs, built and repaired by the whole kingdom, are the signature of Alfred’s and Edward’s Wessex and the reason it survived."

[[bonus]]
text = "Longships +20% HP"
kind = "military"
level = 1
change = "changed"
replaces = "Longships and Catapult Galleons +20% HP"
precedent = "Longships and Catapult Galleons +20% HP (Saxons), narrowed to Longships"
basis = "In 896 Alfred had long ships built against the Danes, almost twice as long as theirs, some with 60 oars or more, ‘neither on the Frisian pattern nor on the Danish’; the Chronicle’s own word is langscipu (Anglo-Saxon Chronicle, 896). Edgar kept fleets, in 1008 Æthelred levied a ship from every 310 hides, and Harold II kept a fleet off the Isle of Wight through the summer of 1066. The Catapult Galleon part is dropped: there is no evidence of ship-borne catapults in North Sea warfare."
relevance = "Sea power framed the civ from the North Sea crossing and the Sutton Hoo ship burial to the fleets of 896, 1008 and 1066; a borderline pass on weight, helped by the fame of Alfred’s ships."

[[bonus]]
text = "Infantry gain additional armor when massed starting in Imperial Age"
kind = "military"
level = 1
change = "changed"
replaces = "Shield Wall (Castle unique tech: Infantry gain additional armor when massed)"
precedent = "Shield Wall (Infantry gain additional armor when massed) (Saxons), the same effect as a passive; age-gated like ‘Town Centers cost -50% wood starting in Castle Age’ (Britons)"
basis = "The shield wall: the bordweall of The Battle of Brunanburh (937); the close shield formation is described at Maldon (991) and Hastings (1066), where the English line held through most of the day. It was common Germanic practice (and late Roman and Byzantine, the fulcum of the Strategikon), not something the English copied from the Vikings. A long military tradition, used for six centuries, so a passive (RULES 6.2); it starts in the Imperial Age, when the game’s tech came, so that its power stays where it was (RULES 6.16.11). The game’s arrangement, Shield Wall as the Castle tech, is not kept: the Castle slot goes to the Fyrd, a datable reform of the levy. The English had arms ordinances (in 1008 Æthelred ordered a helmet and mail-coat from every eight hides, beside the ship levy; Anglo-Saxon Chronicle), but they equipped the host and created no formation. The Gaels’ design treats its formation the other way, for a stated reason: Robert Bruce adopted the schiltron as an attacking formation at Bannockburn (1314), a datable adopted technique, and the Gaels have no other datable moment fit for the Castle slot, so the schiltron is promoted to a tech (RULES 6.2, 6.3), while the shield wall stays a passive beside the Fyrd."
relevance = "The shield wall is how the English fought every battle of the period, Hastings included."
contested = "The split between this passive and the Gaels’ Schiltron tech is a design reading: both formations were long traditions with arms ordinances behind them (1008 here, 1318 in Scotland), and the word schiltron itself comes from Old English scieldtruma, ‘shield-troop’; the difference lies in Bruce’s datable adoption of the schiltron as an attacking formation and in each civ’s other datable moments (RULES 6.3)."

[team_bonus]
text = "Monasteries work +20% faster"
level = 1
change = "new"
replaces = "Repairers work +25% faster"
precedent = "Monasteries work +20% faster (Lithuanians team bonus, which their design gives up); also the team bonus of the Bulgarians’, Burmese, Danes’, Gaels’, Hindustanis’, Khitans’ and Malay designs, among them the Gaels’ for the Irish missions; reuse is accepted in N1, each copy resting on its own history, and identical team-wide effects count once per team (RULES 6.16.12)"
basis = "Anglo-Saxon missionaries converted and organised the Church of their continental neighbours, under Frankish protection: Willibrord, trained for twelve years at Rath Melsigi in Ireland, worked in Frisia from 690 and was consecrated archbishop of the Frisians, with his see at Utrecht, in 695; Boniface organised the Church in Hesse, Thuringia and Bavaria, reformed the Frankish Church in the councils of the 740s, founded Fulda (744) and called English monks and nuns such as Leoba to help him, before his death in Frisia (754); and Alcuin of York led Charlemagne’s palace school from 782 (Bede, HE V; Willibald, Life of Boniface; Levison 1946). Faster allied monasteries render the monks and nuns the English sent and trained. A team bonus because it benefited neighbours (RULES 6.2: religious influence); the repair bonus it replaces fails that test (see [[dropped]]). The Irish mission, which the Gaels’ design renders with the same bonus, is one of the roots of the English one."
relevance = "The Anglo-Saxon missions converted much of Germany and reshaped the Frankish Church, the most lasting English influence on the continent before 1066."

[[unique_unit]]
name = "Hearth Troop"
model = "Hearth Troop"
building = "Castle"
level = 1
change = "kept"
basis = "Old English heorðwerod, the lord’s household troop (The Battle of Maldon, l. 24, where Byrhtnoth’s retinue dies with him in 991; Beowulf’s word for Hygelac’s men is heorðgeneatas, l. 261). It stands for the spear-and-javelin retinues of the 10th-century lords, while the Housecarl (the renamed Varangian Guard) is the axe-armed guard of the Anglo-Danish kings (1016–1066). Throwing before melee is attested: Maldon mentions darts, and William of Poitiers describes the English at Hastings throwing spears, axes and stones."
relevance = "Lords’ retinues fought and died around their lord in every Anglo-Saxon battle; the heorðwerod of Maldon is the classic image of English heroic warfare."

[[unique_tech]]
name = "Fyrd"
building = "Castle"
kind = "military"
age = "Imperial"
effect = "Militia-line gold cost is replaced by additional food cost"
level = 1
change = "new"
precedent = "Forced Levy (Militia-line gold cost is replaced by additional food cost) (Malay): an existing unique tech, shared and renamed with an identical effect and age (the Goths’ design also reuses it, as Liber Iudiciorum; RULES 6.16.12)"
basis = "In 893 Alfred divided his levy so that half its men were always at home and half on service, apart from the men who held the burhs (Anglo-Saxon Chronicle 893). Service was owed by land: Domesday’s Berkshire custom (1086) sent one man from every five hides, who received four shillings from each hide for his food or pay for two months (Abels 1988). The effect renders a levy kept by the land that owed it rather than paid from the king’s purse. A datable military reform, so at the Castle (RULES 6.2); it takes the slot the shield wall, a long tradition, held in the game. Imperial Age, the game age of Forced Levy (RULES 6.16.11); Edgar's Recoinage and Clerical Recruitment, later in date, are Castle Age techs at other buildings, which the chronological rule allows, since it binds only two Castle techs (RULES 6.16.19(a))."
relevance = "The divided levy kept Alfred’s army in the field through the Danish wars of 892–896, which ended with the Danish army breaking up; with the burhs it is the core of the Alfredian military reforms."
contested = "How the levy was organised (the ‘select fyrd’ debate, see the civ-level contested list); the five-hide rule is recorded only in Domesday."

[[unique_tech]]
name = "Clerical Recruitment"
building = "Monastery"
kind = "civil"
age = "Castle"
effect = "Monks +1 conversion range; train +33% faster"
level = 1
change = "changed"
replaces = "Clerical Recruitment (Castle unique tech, same effect)"
precedent = "Clerical Recruitment (Monks +1 conversion range; train +33% faster) (Saxons): moved to the Monastery, identical effect and age; the Bulgarians’ Council of Preslav shares it"
basis = "Based on the Church at home, since the continental missions are the team bonus: the conversion of the Danish settlers (Guthrum baptised in 878 with Alfred as his sponsor; Oda, son of a Danish settler, archbishop of Canterbury 941–958) and the 10th-century Benedictine reform of Dunstan, Æthelwold and Oswald, which refounded dozens of monasteries and was codified in the Regularis Concordia (c. 973). Conversion range renders the conversion of the Danelaw, faster training the refounded houses. At the Monastery, where religion belongs (RULES 6.2)."
relevance = "The conversion of the Danelaw and the monastic reform made the late Anglo-Saxon Church and gave Edgar and Æthelred the bishops who governed with them."

[[unique_tech]]
name = "Edgar's Recoinage"
building = "Town Center"
kind = "civil"
age = "Castle"
effect = "All gold income +10% faster; Market trading fee reduced to 10%"
level = 1
change = "new"
precedent = "Grand Trunk Road (All gold income +10% faster; Market trading fee reduced to 10%) (Hindustanis): an existing unique tech, shared and renamed with an identical effect and age; several designs reuse it for coinage and revenue reforms, among them the Hindustanis’ Tanka, the Burgundians’ Vierlander Coinage, the Malay Syahbandar and the Muisca Cotton Mantles, each on its own history (RULES 6.16.12)"
basis = "Æthelstan’s Grately code (c. 926–930) decreed one coinage throughout the king’s realm and minting only in a market town, and Edgar’s reform (c. 973) gave the kingdom a single silver penny of one type, struck in dozens of burh mints and periodically called in and reissued with new types; the system let the late Anglo-Saxon kings raise the great gelds of 991–1018 (Dolley and Metcalf 1961; Molyneaux 2015). Gold income renders the gelds and the profits of the mints, the lower trading fee a single trusted coin in the burh markets. A state reform, so at the Town Center (RULES 6.2)."
relevance = "The silver penny and the geld made late Anglo-Saxon England one of the most centralised kingdoms of the West (see contested); Cnut conquered a kingdom whose taxes still worked."

[tree]
add = ["Clinker Construction"]
remove = [
  "Trebuchet",
  "Arbalester",
  "Mounted Crossbowman",
  "Heavy Mounted Crossbowman",
  "Cranequins",
  "Cavalier",
  "Hussar",
  "Bloodlines",
  "Catapult Galleon",
  "Keep",
  "Arrowslits",
  "Hoardings",
  "Thumb Ring",
  "Siphons",
  "Block Printing",
]

[tree.basis]
"Clinker Construction" = "The Sutton Hoo ship (c. 625) is the classic clinker-built hull; in the game the Saxons were the only civ without this tech."
"Trebuchet" = "The counterweight trebuchet appears only in the later 12th century, a century after the end of the civ. No Anglo-Saxon siege engine of any kind is attested either, so the traction test gives no Traction Trebuchet (RULES 6.16.5): English siege warfare was blockade, assault and counter-fortification (Alfred’s two forts on the Lea, 895; Edward’s burhs on both banks at Buckingham, 914; the storming of Tempsford and Derby, 917; Anglo-Saxon Chronicle). The rams, Mangonel, Onager and Scorpions stay only as the engine’s minimum abstraction of siege warfare (RULES 6.11, 6.14), not as evidence of Anglo-Saxon engines. The civ has no long-range anti-building weapon, as RULES 6.16.5 allows where none is attested, and relies on the Siege Ram, which it keeps; no other compensation is added for the items the tree loses, mostly later than 1066 (RULES 6.16.13)."
"Arbalester" = "The crossbow was practically unknown in Anglo-Saxon England; at Hastings the crossbowmen were on the Norman side (William of Poitiers). The Crossbowman tier is kept as the generic ranged upgrade (RULES 6.16.3)."
"Mounted Crossbowman" = "Shared basis (level-1 review, section 3.2): the Mounted Crossbowman line stays only where shooting from the saddle is documented. Here it is anachronistic and foreign to an army that rode to battle and fought on foot (Maldon, 991; Hereford, 1055; Hastings, 1066)."
"Heavy Mounted Crossbowman" = "Same reason as the Mounted Crossbowman."
"Cranequins" = "A 15th-century continental crossbow fitting."
"Cavalier" = "The English did not fight as heavy cavalry: in 1055 near Hereford they fled ‘because they were on horseback’ (Anglo-Saxon Chronicle), and John of Worcester adds that Earl Ralph had made them fight mounted against their custom. The Knight is kept, without upgrades, as the abstraction of thegns who rode to war."
"Hussar" = "Hungarian and Serbian light cavalry of the 15th century; Light Cavalry is kept for scouts and mounted thegns."
"Bloodlines" = "Horse-breeding upgrades belong to cavalry armies; the English rode to battle and fought on foot, so the mounted thegns keep the plain Knight and Light Cavalry."
"Catapult Galleon" = "No evidence of ship-borne catapults in North Sea warfare; Longships keep the role of attacking coasts and shore buildings. Navy tier (RULES 6.16.1): a fleet of ships, resting on Alfred’s long ships of 896, Æthelred’s ship levy of 1008 and Harold II’s fleet of 1066. The Carrack, a 14th–15th-century type, stays as a generic tier of a fleet of ships (RULES 6.16.1) and the Galleon as a flagged post-1500 abstraction (RULES 6.16.2); both are anachronistic for this civ and flagged as abstractions. The civ has no Cannon Galleon."
"Keep" = "Castles and their great towers were the Norman novelty (Orderic Vitalis); the burh was a communal earthwork held by its garrison. The Watch Tower and Guard Tower stay as the abstraction of the burh gate tower (burh-geat), which an early 11th-century text on ranks (Geþyncðo) counts among the marks of a thegn."
"Arrowslits" = "Archery from towers belongs to the stone castles of the Normans and later; archery was marginal in Anglo-Saxon warfare, and the old tower-arrow bonus is dropped for the same reason."
"Hoardings" = "The timber galleries of 12th–13th-century stone castles; the civ has no castles in that sense (Orderic Vitalis)."
"Thumb Ring" = "The thumb draw belongs to the steppe and Asian archery traditions, and Anglo-Saxon archery was marginal and European (RULES 6.16.4). The English design, the codex’s archer civ, also lacks the tech."
"Siphons" = "Named after the Byzantine fire siphon, the projector of Greek fire, a state secret never to be given to another nation (De Administrando Imperio 13); its game effect, an explosive charge for fire ships, has no Anglo-Saxon equivalent. The Fire Galley and Fire Ship stay as the engine’s convention for close-range incendiary warships."
"Block Printing" = "European block printing dates only from c. 1400, centuries after the civ ends; Anglo-Saxon book culture was manuscript copying (the Lindisfarne Gospels, the scriptoria of the Benedictine reform). The Gaels’ design also leaves the tech out, since the Gaelic world printed nothing before 1567."

[[rename]]
from = "Varangian Guard"
to = "Housecarl"
level = 1
basis = "The housecarls (Old Norse húskarlar) were the household troops of Cnut and his successors, from 1016 to Harold II’s guard at Hastings (1066), armed with the two-handed Dane axe that the Bayeux Tapestry shows (Hooper 1985); whether they were paid from the heregeld (levied 1012–1051) or rewarded with land is debated (see contested). The rename keeps the model inside the civ’s window; the Danes rename the same model the same way, and the Varangian Guard itself stays Byzantine (RULES section 4; a renamed regional unit, which does not count as a unique unit, RULES 6.16.10)."

[[rename]]
from = "Elite Varangian Guard"
to = "Elite Housecarl"
level = 1
basis = "Same as the Varangian Guard rename."

[architecture]
set = "Northern European"
change = "changed"
replaces = "Western European"
basis = "Anglo-Saxon building was overwhelmingly in timber (the halls of Yeavering and Cheddar) and its ships clinker-built (Sutton Hoo), closer to the North Sea world of Scandinavia than to the Gothic stone of the Western European set, which suits the English and Franks; it also tells the two English civs apart. Historical fit decides (RULES 6.16.8). In the game the Saxons have the Western European set: the official Viking Sagas FAQ and launch notes give the new Northern European set to the Danes, Varangians and Vikings only, and the community wiki lists the Saxons with the Western European civs (the pre-order page’s ‘shared architecture’ for the three new civs names no set). The repository data hold no architecture field, so the check rests on these pages."
contested = "Anglo-Saxon England also built in stone, from the 7th century (Escomb, Brixworth) to the 10th–11th (the tower of Earls Barton), in a pre-Romanesque style that neither set shows (Taylor and Taylor 1965–78)."

[[dropped]]
item = "Repairers work +25% faster"
kind = "team_bonus"
reason = "Fails RULES 6.2: its basis, the ‘common burdens’ of fyrd service, bridge-work and the building and repair of fortresses (burh-bot) laid on all land, benefited only the kingdom itself. Burh-bot now underlies the walls bonus, and the team slot goes to the continental missions. The label ‘trinoda necessitas’ comes from a misreading of a spurious charter (Brooks 2000)."
