civ = "Saxons"
name = "Anglo-Saxons"
original_name = "Saxons"
status = "draft"
label = "Infantry and Defensive civilization"
summary = "Saxons renamed Anglo-Saxons for England from the settlement to Hastings (449–1066), rebuilt around the burh and the fyrd: earthwork walls and garrisoned towns replace castle arrows, the shield wall becomes a passive, the Fyrd and Edgar's Recoinage are the new techs, the continental missions the team bonus, and post-1066 items leave the tree."
ideas = [
  "N3: A ‘Burh’ building available in Feudal Age: an earth-and-timber fortified town that gives population, serves as a drop-site, trains infantry and counts for the Foot Soldier discount, partly replacing the Castle (Burghal Hidage; Hill and Rumble, The Defence of Wessex, 1996).",
  "N2: Give the Housecarl the two-handed Dane axe as a separate weapon state with bonus damage against cavalry (Bayeux Tapestry; Wace’s account of English axes at Hastings).",
  "N2: Remove the Housecarl’s gold generation, inherited from the Varangian Guard model: it has no basis (the heregeld was a tax raised to pay the king’s standing forces, a cost to the king, abolished in 1051).",
  "N2: Split the Archer and Crossbowman lines (RULES section 10); the Crossbowman tier is kept here only as the generic ranged upgrade.",
  "N3: Old English names for the generic lines (fyrd, thegn, scip) and a history text that ends in 1066, now that the English design covers later medieval England.",
]
contested = [
  "The term ‘Anglo-Saxon’, kept as the civ’s name and flagged (RULES section 4). It has period roots: Asser styles Alfred Anglorum Saxonum rex and Angul-Saxonum rex, ‘king of the Anglo-Saxons’ (Life of King Alfred, dedication and ch. 1; Keynes and Lapidge, Alfred the Great, 1983), the style Simon Keynes reads as a ‘kingdom of the Anglo-Saxons’ under Alfred and Edward the Elder (c. 886–927); the people called themselves Englisc or Angelcynn. Its racialised modern uses were criticised long before the present debate (Reginald Horsman, Race and Manifest Destiny: The Origins of American Racial Anglo-Saxonism, 1981), and the debate within the field has been sharp since about 2017: in 2019 the International Society of Anglo-Saxonists voted to become the International Society for the Study of Early Medieval England (ISSEME), and Cambridge’s journal Anglo-Saxon England has since been renamed Early Medieval England and its Neighbours. Some scholars prefer ‘early medieval English’ or ‘early English’; many historians and archaeologists keep ‘Anglo-Saxon’ for the period. The codex keeps it because it is the name most readers know and it tells this civ apart from the English design; the site flags the debate.",
  "The scale and nature of the Anglo-Saxon migration: elite takeover (Higham) or substantial migration (Härke), now reassessed with ancient DNA (Gretzinger et al., Nature, 2022, substantial migration in the east with strong regional variation). The window’s 449 is Bede’s conventional date for the coming of the Saxons; settlement began earlier.",
  "How strong the late Anglo-Saxon state was: James Campbell’s ‘maximum view’ against more cautious readings.",
  "How regular the recoinages after Edgar’s reform were: Michael Dolley’s six-year cycle has been questioned by later numismatists.",
  "Whether the Anglo-Saxons ever fought on horseback (Richard Glover against Richard Abels and Nicholas Hooper); this design keeps a mounted Knight without upgrades.",
  "The ‘select fyrd’ and ‘great fyrd’ model (C. Warren Hollister, 1962) against Richard Abels’ critique (1988).",
  "What housecarls were: a paid standing guard (L. M. Larson, 1904) or royal and noble retainers, many of them landholders (N. Hooper, 1985).",
  "How literally the Burghal Hidage formula was applied: it matches the measured defences closely at Winchester and Wareham and less well elsewhere, where the circuits are often uncertain (Hill 1969; Hill and Rumble 1996).",
  "Anglo-Saxon siege engines: none is attested. At the siege of Paris (885–886) the engines Abbo describes were built by the Danish besiegers and the Frankish defenders, and whether his ‘mangana’ were traction trebuchets is itself debated (Purton, A History of the Early Medieval Siege, 2009). This design follows the English evidence of blockade, assault and counter-fortification and gives the civ no trebuchet.",
]
open_questions = []

[profile]
entity = "The Anglo-Saxon kingdoms and the late Anglo-Saxon kingdom of the English"
region = "Lowland Britain: England, with Lothian until the early 11th century"
window = "449–1066 (from Bede’s conventional date for the coming of the Saxons to Hastings; design core 871–1066, from Alfred to Harold II)"
sources = [
  "Bede, Historia ecclesiastica gentis Anglorum (731)",
  "Anglo-Saxon Chronicle",
  "Asser, Life of King Alfred (893)",
  "The Burghal Hidage; the laws of Ine, Alfred and Æthelstan",
  "The Battle of Maldon; The Battle of Brunanburh",
  "Willibald, Life of Boniface; Regularis Concordia (c. 973)",
  "Domesday Book (1086)",
  "Wilhelm Levison, England and the Continent in the Eighth Century (1946)",
  "Simon Keynes and Michael Lapidge (trans.), Alfred the Great: Asser’s Life of King Alfred and Other Contemporary Sources (1983)",
  "Reginald Horsman, Race and Manifest Destiny: The Origins of American Racial Anglo-Saxonism (1981)",
  "Michael Dolley and D. M. Metcalf, ‘The Reform of the English Coinage under Eadgar’ (1961)",
  "David Hill, ‘The Burghal Hidage: the establishment of a text’, Medieval Archaeology 13 (1969)",
  "Richard Abels, Lordship and Military Obligation in Anglo-Saxon England (1988); Alfred the Great (1998)",
  "Ryan Lavelle, Alfred’s Wars (2010)",
  "David Hill and Alexander Rumble (eds.), The Defence of Wessex: The Burghal Hidage and Anglo-Saxon Fortifications (1996)",
  "Nicholas Brooks, Communities and Warfare 700–1400 (2000)",
  "N. Hooper, ‘The Housecarls in England in the Eleventh Century’, Anglo-Norman Studies 7 (1985)",
